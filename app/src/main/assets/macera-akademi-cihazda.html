<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Macera Akademi</title>
<!-- Android/iOS: ana ekrana eklenince tam ekran uygulama gibi açılır -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macera Akademi">
<meta name="theme-color" content="#ffd7ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd7ea'/%3E%3Cstop offset='1' stop-color='%2386dcec'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffd7ea'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#ffd7ea; --pink2:#ff9fc2; --pink3:#ff6f9d;
    --purple1:#d9c6f5; --purple2:#b79ef0;
    --blue1:#bfe0ff; --blue2:#8fd0ea; --blue3:#5fc1d9;
    --teal1:#8fe9e2; --teal2:#4fc9c2; --teal3:#2fa8a8;
    --ink:#4a3b6b; --ink-soft:#7566a0;
    --good:#3fbf7f;
    --shadow-soft: 0 10px 24px rgba(90,60,140,0.16);
    --radius-lg:28px; --radius-md:20px; --radius-sm:14px;
    --font-head:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
    --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:#241a3d;
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,select{font-family:var(--font-body);}
  .app-shell{
    width:100%; max-width:480px; min-height:100vh;
    position:relative; overflow-x:hidden;
    background:linear-gradient(180deg,#ffd7ea 0%, #f2cdf1 16%, #d3c0f5 34%, #b9cdf5 55%, #a2d6f0 75%, #86dcec 100%);
    padding-bottom:12px;
  }
  .sky-decor{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .cloud-shape{position:absolute; width:110px; height:34px; background:#fff; border-radius:50px; opacity:.5;}
  .cloud-shape:before,.cloud-shape:after{content:''; position:absolute; background:#fff; border-radius:50%;}
  .cloud-shape:before{width:54px; height:54px; top:-22px; left:8px;}
  .cloud-shape:after{width:40px; height:40px; top:-16px; right:14px;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-10px) rotate(6deg);}}
  .deco{position:absolute; font-size:20px; animation:floaty 4.5s ease-in-out infinite; opacity:.9; z-index:0;}
  #app{position:relative; z-index:1;}

  .title-hero{
    font-family:var(--font-head); font-weight:800; text-align:center;
    font-size:26px; letter-spacing:.3px; padding:0 20px; line-height:1.25;
    background:linear-gradient(180deg,#ff8fc0,#5fc7e0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.55);
    text-shadow:0 2px 0 rgba(255,255,255,.35);
  }
  .panel{
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:2px solid rgba(255,255,255,.75);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    padding:20px;
  }
  .btn{
    display:block; width:100%; text-align:center; border:none; cursor:pointer;
    font-family:var(--font-head); font-weight:700; font-size:16px; color:#fff;
    padding:15px 18px; border-radius:999px; margin-top:12px;
    box-shadow:0 5px 0 rgba(0,0,0,.13), 0 8px 14px rgba(0,0,0,.12);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translateY(3px) scale(.98); box-shadow:0 2px 0 rgba(0,0,0,.13);}
  .btn-teal{background:linear-gradient(180deg,#9ff0ea,#33b6c2);}
  .btn-pink{background:linear-gradient(180deg,#ffb4d0,#ff6f9d);}
  .btn-outline{background:rgba(255,255,255,.7); color:var(--ink); box-shadow:none; border:2px solid rgba(120,90,160,.25);}

  .field{margin-bottom:14px; text-align:left;}
  .field label{display:block; font-family:var(--font-head); font-weight:700; color:var(--ink); font-size:12px; margin-bottom:5px; letter-spacing:.3px;}
  .field input,.field select{
    width:100%; padding:12px 14px; border-radius:16px; border:none;
    background:#fff; font-size:15px; color:#333;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.08);
  }
  .field input:focus,.field select:focus{outline:2px solid var(--teal2);}

  .profile-card{
    display:flex; gap:14px; align-items:center;
    background:rgba(255,255,255,.5); border:2px solid rgba(255,255,255,.7);
    border-radius:22px; padding:14px; margin:16px; box-shadow:var(--shadow-soft);
    position:relative; z-index:1;
  }
  .avatar{
    width:60px; height:60px; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#ffe9c2,#ffcf8a 70%);
    display:flex; align-items:center; justify-content:center; font-size:30px;
    border:3px solid #fff; box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .profile-info{flex:1; min-width:0;}
  .xp-bar-track{background:#3a2d5c; border-radius:999px; height:12px; overflow:hidden; margin-top:5px;}
  .xp-bar-fill{background:linear-gradient(90deg,#9ff0ea,#33b6c2); height:100%; transition:width .4s;}

  .icon-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px 14px;}
  .icon-btn{background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px;}
  .icon-circle{
    width:92px; height:92px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #f0fffe, #bdeceb 55%, #78cdd4 100%);
    display:flex; align-items:center; justify-content:center; font-size:38px;
    box-shadow:0 6px 14px rgba(60,120,140,.25), inset 0 -5px 8px rgba(0,0,0,.08);
    transition:transform .12s;
  }
  .icon-btn:active .icon-circle{transform:scale(.93);}
  .icon-label{font-family:var(--font-head); font-weight:700; color:var(--ink); font-size:13px; letter-spacing:.3px;}

  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:rgba(255,255,255,.6); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; justify-content:space-around; padding:9px 6px 12px;
    border-top:2px solid rgba(255,255,255,.75); z-index:5;
  }
  .nav-btn{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:var(--font-head); font-size:10.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; padding:2px 4px;}
  .nav-btn .nav-ic{font-size:21px; padding:3px 11px; border-radius:13px;}
  .nav-btn.active{color:var(--teal3);}
  .nav-btn.active .nav-ic{background:rgba(255,255,255,.85); box-shadow:0 0 0 2px #6fcfd9;}

  .section-title{font-family:var(--font-head); font-weight:800; color:var(--ink); margin:18px 16px 8px; font-size:14.5px; text-transform:uppercase; letter-spacing:.4px; opacity:.85;}
  .game-card{
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.62); border:2px solid rgba(255,255,255,.8);
    margin:8px 16px; padding:12px 14px; border-radius:18px; box-shadow:var(--shadow-soft);
    cursor:pointer; transition:transform .1s;
  }
  .game-card:active{transform:scale(.98);}
  .game-card .emoji{font-size:28px; width:40px; text-align:center; flex:0 0 auto;}
  .game-card .info{flex:1; min-width:0;}
  .game-card .gtitle{font-family:var(--font-head); font-weight:700; color:var(--ink); font-size:14.5px;}
  .game-card .gsub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .badge-done{background:var(--good); color:#fff; border-radius:50%; width:23px; height:23px; display:flex; align-items:center; justify-content:center; font-size:13px; flex:0 0 auto;}

  .list-header{display:flex; align-items:center; gap:10px; padding:16px 16px 4px; position:relative; z-index:1;}
  .back-btn{background:rgba(255,255,255,.75); border:none; border-radius:50%; width:38px; height:38px; font-size:17px; cursor:pointer; flex:0 0 auto; box-shadow:0 3px 6px rgba(0,0,0,.12);}

  .game-header{display:flex; align-items:center; gap:12px; padding:16px; position:relative; z-index:1;}
  .game-title-block{display:flex; align-items:center; gap:10px;}
  .game-emoji{font-size:30px;}
  .game-title{font-family:var(--font-head); font-weight:800; color:var(--ink); font-size:16px;}
  .game-sub{font-size:11.5px; color:var(--ink-soft);}
  .game-stage{
    margin:0 16px 100px; min-height:280px; position:relative;
    background:rgba(255,255,255,.4); border:2px solid rgba(255,255,255,.6);
    border-radius:22px; padding:18px;
  }
  .instruction-text{font-family:var(--font-head); font-weight:700; color:var(--ink); text-align:center; font-size:15px; margin-bottom:14px; line-height:1.4;}
  .game-question{font-family:var(--font-head); font-weight:700; color:var(--ink); text-align:center; font-size:14.5px; margin:10px 0;}
  .tile-wrap{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .tile{
    background:#fff; border-radius:16px; padding:12px 15px; font-size:20px; font-family:var(--font-body); font-weight:700; color:#333;
    box-shadow:0 4px 9px rgba(0,0,0,.13); cursor:pointer; border:3px solid transparent; transition:transform .12s;
  }
  .tile.picked{border-color:#ffb703; transform:translateY(-5px) scale(1.05); box-shadow:0 8px 15px rgba(0,0,0,.2);}
  .tile.correct{border-color:var(--good); background:#e9fff2; opacity:.75;}
  .tile.wrong{animation:shake .32s; border-color:#ff6b6b;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);}}
  .target-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px;}
  .target-zone{
    min-width:64px; min-height:56px; border:3px dashed #b79ef0; border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:rgba(255,255,255,.5); padding:8px 10px; cursor:pointer;
  }
  .target-zone.filled{border-style:solid; border-color:var(--good); background:#e9fff2;}
  .target-zone.wrong{animation:shake .32s; border-color:#ff6b6b;}
  .target-label{font-family:var(--font-head); font-weight:700; font-size:12px; color:var(--ink);}
  .target-filled{font-size:19px; margin-top:3px;}
  .progress-text{text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:12px; font-weight:700;}

  .pattern-row{display:flex; gap:8px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;}
  .pattern-tile{background:#fff; border-radius:14px; padding:12px 14px; font-size:18px; font-weight:700; box-shadow:0 3px 7px rgba(0,0,0,.1);}

  .reveal-box{text-align:center; font-size:22px; font-weight:800; color:var(--ink); background:#fff; border-radius:16px; padding:16px; margin:10px 0;}
  .feedback-text{text-align:center; font-size:13.5px; color:var(--ink-soft); margin:8px 0 4px; font-weight:700; line-height:1.4;}

  .chart-row{display:flex; gap:14px; justify-content:center; align-items:flex-end; min-height:140px; margin-bottom:12px;}
  .chart-col{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .chart-bar{width:52px; background:linear-gradient(180deg,#ffd9ea,#ff9fc2); border-radius:10px 10px 4px 4px; display:flex; align-items:flex-start; justify-content:center; font-size:12px; overflow:hidden; padding-top:2px; transition:height .35s cubic-bezier(.34,1.56,.64,1);}
  .chart-label{font-size:11.5px; font-weight:700; color:var(--ink); text-align:center;}

  .word-strip{display:flex; gap:8px; justify-content:center; margin:14px 0;}
  .word-strip.wrong{animation:shake .32s;}
  .letter-box{width:38px; height:44px; background:#fff; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:var(--ink); box-shadow:inset 0 2px 4px rgba(0,0,0,.1);}

  .trail-text{text-align:center; font-family:var(--font-head); font-weight:700; color:var(--ink-soft); margin-bottom:12px; font-size:15px;}
  .trace-svg{width:100%; max-width:220px; display:block; margin:0 auto 12px;}
  .trace-line{fill:none; stroke:var(--teal3); stroke-width:4; stroke-linecap:round; stroke-linejoin:round;}
  .trace-pt{fill:#fff; stroke:var(--purple2); stroke-width:3; cursor:pointer;}
  .trace-pt.done{fill:var(--good); stroke:var(--good);}
  .trace-num{font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; pointer-events:none;}

  .count-display{text-align:center; font-family:var(--font-head); font-size:40px; font-weight:800; color:var(--ink); margin-bottom:6px;}
  .word-label{text-align:center; font-size:14px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
  .ten-frame{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; max-width:280px; margin:8px auto 14px;}
  .tf-cell{aspect-ratio:1; background:#fff; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; border:2px solid #e3d9f5;}
  .tf-cell.filled{background:#e9fff2; border-color:var(--good);}
  .tower{display:flex; flex-direction:column-reverse; gap:3px; max-width:220px; margin:8px auto 14px;}
  .tower-floor{background:#fff; border:2px solid #e3d9f5; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--ink-soft); text-align:center;}
  .tower-floor.lit{background:#e9fff2; border-color:var(--good); color:var(--ink);}

  .scale-visual{display:flex; align-items:flex-end; justify-content:center; gap:26px; min-height:110px; margin-bottom:14px;}
  .pan{background:#fff; border-radius:14px; padding:10px; min-width:76px; min-height:44px; text-align:center; font-size:19px; box-shadow:0 4px 9px rgba(0,0,0,.15); transition:transform .4s cubic-bezier(.34,1.56,.64,1); display:flex; align-items:center; justify-content:center; flex-wrap:wrap;}
  .tilt-left .pan:first-child{transform:translateY(-16px);} .tilt-left .pan:last-child{transform:translateY(16px);}
  .tilt-right .pan:first-child{transform:translateY(16px);} .tilt-right .pan:last-child{transform:translateY(-16px);}

  .flash-box{text-align:center; font-size:30px; background:#fff; border-radius:18px; padding:26px; margin:10px 0;}

  .celebrate{position:absolute; inset:0; background:rgba(255,255,255,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border-radius:20px; z-index:10; text-align:center; padding:24px; overflow:hidden;}
  .reward-row{font-family:var(--font-head); font-weight:800; color:var(--ink); font-size:15px; margin:4px 0 8px;}

  .overlay-bg{position:fixed; inset:0; background:rgba(30,20,50,.45); display:flex; align-items:center; justify-content:center; z-index:20; padding:20px;}
  .modal-card{width:100%; max-width:320px; background:linear-gradient(180deg,#fff,#eef6ff); border-radius:24px; padding:22px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.35);}
  .modal-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}

  .toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:#3a2d5c; color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px; z-index:30; max-width:85%; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.3);}

  .detail-row{background:#fff; border-radius:14px; padding:11px 14px; margin-bottom:8px; font-size:13.5px; color:#3a3350;}
  .badge-row{display:flex; gap:8px; overflow-x:auto; padding:8px 2px;}
  .lvl-badge{flex:0 0 auto; width:58px; text-align:center; font-size:11px; font-weight:700; background:#e7e3f3; border-radius:14px; padding:10px 4px; color:#9d94b8;}
  .lvl-badge.unlocked{background:#fff2b8; color:var(--ink);}
  .settings-row{display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:14px; padding:11px 14px; margin-bottom:8px; font-size:13.5px; color:#3a3350; font-weight:700;}
  .friend-row{display:flex; align-items:center; gap:10px; background:#fff; border-radius:16px; padding:10px; margin-bottom:8px; cursor:pointer;}
  .status-dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
  .status-dot.online{background:var(--good);}
  .status-dot.offline{background:#bbb;}
  .search-input{width:100%; padding:11px 14px; border-radius:16px; border:none; margin:4px 0 12px; background:#fff; box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}

  .switch{position:relative; display:inline-block; width:42px; height:23px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .slider-tg{position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:999px; transition:.2s;}
  .slider-tg:before{content:''; position:absolute; height:17px; width:17px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;}
  input:checked + .slider-tg{background:var(--good);}
  input:checked + .slider-tg:before{transform:translateX(19px);}

  /* ===== HAREKETLİLİK / ANIMATIONS ===== */
  @keyframes popIn{
    0%{ transform:scale(.4); opacity:0; }
    60%{ transform:scale(1.12); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes correctPop{
    0%{ transform:scale(1) rotate(0); }
    40%{ transform:scale(1.22) rotate(-4deg); }
    70%{ transform:scale(.94) rotate(3deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  @keyframes bounceIn{
    0%{ transform:scale(0) rotate(-14deg); opacity:0; }
    55%{ transform:scale(1.2) rotate(7deg); opacity:1; }
    75%{ transform:scale(.93) rotate(-3deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  @keyframes idleSway{
    0%,100%{ transform:rotate(-3deg) translateY(0); }
    50%{ transform:rotate(4deg) translateY(-3px); }
  }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift,0px), 320px) rotate(340deg); opacity:0; }
  }
  @keyframes pulseRing{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.26); opacity:.65; }
  }
  @keyframes slideInUp{
    0%{ transform:translateY(14px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }
  @keyframes xpGrow{
    0%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
    100%{ filter:brightness(1); }
  }

  .tile{ animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
  .tile.correct{ animation:correctPop .45s ease; }
  .target-zone.filled{ animation:correctPop .45s ease; }
  .pattern-tile{ animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
  .game-card{ animation:slideInUp .32s ease; }
  .icon-btn{ animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
  .icon-btn:nth-child(1){animation-delay:.02s;} .icon-btn:nth-child(2){animation-delay:.08s;}
  .icon-btn:nth-child(3){animation-delay:.14s;} .icon-btn:nth-child(4){animation-delay:.2s;}
  .icon-btn:nth-child(5){animation-delay:.26s;} .icon-btn:nth-child(6){animation-delay:.32s;}
  .avatar{ animation:idleSway 3.4s ease-in-out infinite; }
  .tf-cell.filled{ animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
  .tower-floor.lit{ animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
  .letter-box.filled{ animation:popIn .25s cubic-bezier(.34,1.56,.64,1); background:#eafff5; }
  .reveal-box{ animation:popIn .35s cubic-bezier(.34,1.56,.64,1); }
  .flash-box{ animation:popIn .2s ease; }
  .xp-bar-fill{ animation:xpGrow .5s ease; }
  .trace-pt.next{ transform-box:fill-box; transform-origin:center; animation:pulseRing 1.1s ease-in-out infinite; filter:drop-shadow(0 0 4px rgba(183,158,240,.75)); }

  .celebrate-content{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; border-radius:20px; }

  .speak-btn{ background:rgba(255,255,255,.8); border:none; border-radius:50%; width:38px; height:38px; font-size:16px; cursor:pointer; flex:0 0 auto; box-shadow:0 3px 6px rgba(0,0,0,.12); margin-left:auto; }

  /* ===== OYUN SAHNESİ / GAME SCENE ===== */

  @keyframes aHop{ 0%,100%{transform:translateY(0) scaleY(1);} 20%{transform:translateY(0) scaleY(.82);} 45%{transform:translateY(-26px) scaleY(1.08);} 70%{transform:translateY(0) scaleY(.92);} }
  .a-spin{ animation:aSpin 7s linear infinite; }

  /* --- ortam parçacıkları --- */
  .particle{ position:absolute; top:-34px; z-index:2; pointer-events:none; }
  @keyframes pFall{ 0%{transform:translateY(0) rotate(0);} 100%{transform:translateY(105vh) rotate(340deg);} }
  @keyframes pRise{ 0%{transform:translateY(0); opacity:.95;} 100%{transform:translateY(-104vh); opacity:0;} }

  .imm-hud{

  .hud-title{ flex:1; min-width:0; }

    box-shadow:0 3px 7px rgba(0,0,0,.14); white-space:nowrap;

  /* --- tam ekran modunda daha parlak, oyunsu karolar --- */
  .imm-content .tile{
    background:linear-gradient(180deg,#ffffff,#eef4ff);

  }
  .imm-content .tile:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(110,85,155,.28); }
  .imm-content .tile.picked{ box-shadow:0 6px 0 #d99000, 0 0 0 4px rgba(255,183,3,.35), 0 12px 22px rgba(0,0,0,.22); }
  .imm-content .tile-emo{ font-size:36px; }
  .imm-content .speech-bubble{ font-size:14.5px; box-shadow:0 6px 14px rgba(60,40,90,.2); }

  /* --- ekran efektleri: doğru/yanlış tepkisi --- */
  .fx-flash{ position:absolute; inset:0; z-index:6; pointer-events:none;

    animation:goodFlash .5s ease-out forwards; }
  @keyframes goodFlash{ 0%{opacity:0;} 28%{opacity:.6;} 100%{opacity:0;} }
  @keyframes badShake{
    0%,100%{ transform:translateX(-50%); }
    20%{ transform:translateX(calc(-50% - 10px)); }

    80%{ transform:translateX(calc(-50% + 6px)); }
  }
  .immersive-stage.shake{ animation:badShake .4s ease; }
  .fx-banner{
    position:absolute; top:40%; left:0; right:0; text-align:center; z-index:7; pointer-events:none;
    font-family:var(--font-head); font-weight:800; font-size:27px; color:#fff;
    text-shadow:0 3px 0 #2fa8a8, 0 9px 18px rgba(0,0,0,.32);

  }
  @keyframes bannerPop{
    0%{ transform:scale(.45) rotate(-9deg); opacity:0; }
    28%{ transform:scale(1.16) rotate(4deg); opacity:1; }

  .burst-bit{ position:fixed; z-index:70; pointer-events:none; font-size:17px;

  /* ===== GERÇEK SÜRÜKLE-BIRAK (real drag & drop) ===== */

    background:#ffe6e9; border:2px solid #ff9aa8; color:#a52639;

<body>
<div class="app-shell">
  <div class="sky-decor" id="skyDecor"></div>
  <div id="app"></div>
</div>
<script>
/* ===================== STATE & STORAGE ===================== */
let state = {
  screen:'welcome',
  loggedIn:false,
  currentUser:null,
  formError:'',
  confirmDelete:false,
  currentSubject:null,
  currentGameId:null,
  friendModal:null,
  soonTitle:'', soonEmoji:'',
  /* giriş yapılana kadar boş; oturum açılınca veritabanındaki kayıttan doldurulur */
  hero:{
    name:'', grade:1, className:'', teacher:'', teacherCode:'',
    email:'', fullName:'', level:1, xp:0, coins:0
  },
  settings:{ sound:true, music:true, taskNotif:true, rewardNotif:true },
  completed:{}
};
let gs = {}; /* runtime state for the currently open game */

/* ===================== VERİTABANI KATMANI (DATA LAYER) ===================== */
/* Hesaplar cihazda kalıcı olarak saklanır: Claude ortamında window.storage,
   APK/tarayıcıda localStorage. Tüm veri erişimi tek bir DB nesnesinden geçer;
   ileride uzak bir sunucuya taşınmak istenirse sadece bu fonksiyonlar değişir. */
const DB = {
  async read(key){
    try{
      if(window.storage){
        const r = await window.storage.get(key);
        if(r && r.value) return r.value;
      }
    }catch(e){ /* bu anahtar henüz yok */ }
    try{ if(window.localStorage) return window.localStorage.getItem(key); }catch(e){}
    return null;
  },
  async write(key, value){
    let ok = false;
    try{ if(window.localStorage){ window.localStorage.setItem(key, value); ok = true; } }catch(e){}
    try{ if(window.storage){ await window.storage.set(key, value); ok = true; } }catch(e){}
    return ok;
  },
  async remove(key){
    try{ if(window.localStorage) window.localStorage.removeItem(key); }catch(e){}
    try{ if(window.storage) await window.storage.delete(key); }catch(e){}
  },
  async readJSON(key){
    const raw = await this.read(key);
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  },
  async writeJSON(key, obj){ return this.write(key, JSON.stringify(obj)); }
};

const USER_KEY = u => 'user:' + String(u||'').trim().toLowerCase();
const SESSION_KEY = 'session-v1';

/* ---- şifre güvenliği: rastgele tuz + özet (şifre asla düz metin saklanmaz) ---- */
function fnvHash(str){
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i=0;i<str.length;i++){
    h1 = ((h1 ^ str.charCodeAt(i)) * 16777619) >>> 0;
    h2 = ((h2 ^ str.charCodeAt(i)) * 2246822519) >>> 0;
  }
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
function fnvStretch(data){
  let acc = data;
  for(let i=0;i<600;i++) acc = fnvHash(acc + '|' + i);
  return 'fnv$' + acc;
}
async function hashPassword(pw, salt){
  const data = salt + '|' + pw;
  try{
    if(window.crypto && window.crypto.subtle && window.TextEncoder){
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return 'sha256$' + Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* güvenli bağlam yok: yedek özete düş */ }
  return fnvStretch(data);
}
async function verifyPassword(pw, salt, stored){
  const h = await hashPassword(pw, salt);
  if(h === stored) return true;
  /* ortam değiştiyse (ör. crypto erişimi kaybolduysa) eski yöntemi de dene */
  if(String(stored).indexOf('fnv$') === 0) return fnvStretch(salt + '|' + pw) === stored;
  return false;
}
function makeSalt(){
  try{
    if(window.crypto && window.crypto.getRandomValues){
      const a = new Uint8Array(12);
      window.crypto.getRandomValues(a);
      return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return String(Date.now()) + Math.random().toString(36).slice(2,10);
}

/* ---- kayıt / giriş doğrulamaları ---- */
function validateRegistration(f){
  const name = String(f.name||'').trim();
  if(name.length < 3) return 'Kahraman adı en az 3 harf olmalı.';
  if(name.length > 20) return 'Kahraman adı en fazla 20 harf olabilir.';
  if(!/^[A-Za-z0-9ÇĞİıÖŞÜçğöşü_ .-]+$/.test(name)) return 'Kahraman adında kullanılamayan bir karakter var.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(f.email||'').trim())) return 'Geçerli bir e-posta adresi yaz.';
  if(String(f.pass||'').length < 4) return 'Şifre en az 4 karakter olmalı.';
  if(f.pass !== f.pass2) return 'İki şifre birbiriyle aynı değil.';
  if(!f.grade) return 'Kaçıncı sınıf olduğunu seç.';
  return null;
}

async function dbRegister(f){
  const name = String(f.name).trim();
  const existing = await DB.readJSON(USER_KEY(name));
  if(existing) return {ok:false, error:'Bu kahraman adı zaten alınmış. Başka bir ad dene.'};
  const salt = makeSalt();
  const rec = {
    username:name,
    email:String(f.email).trim(),
    grade:Number(f.grade),
    salt,
    pass: await hashPassword(f.pass, salt),
    fullName:name, teacher:'', teacherCode:'',
    level:1, xp:0, coins:0, completed:{},
    settings:{sound:true, music:true, taskNotif:true, rewardNotif:true},
    createdAt:new Date().toISOString()
  };
  const ok = await DB.writeJSON(USER_KEY(name), rec);
  if(!ok) return {ok:false, error:'Kayıt cihaza yazılamadı. Tarayıcı depolaması kapalı olabilir.'};
  await DB.write(SESSION_KEY, USER_KEY(name));
  return {ok:true, user:rec};
}

async function dbLogin(name, pass){
  name = String(name||'').trim();
  if(!name) return {ok:false, error:'Kahraman adını yaz.'};
  if(!pass) return {ok:false, error:'Şifreni yaz.'};
  const rec = await DB.readJSON(USER_KEY(name));
  if(!rec) return {ok:false, error:'Böyle bir kahraman bulunamadı. Yeni hesap oluşturabilirsin.'};
  const good = await verifyPassword(pass, rec.salt, rec.pass);
  if(!good) return {ok:false, error:'Şifre yanlış. Tekrar dene.'};
  await DB.write(SESSION_KEY, USER_KEY(name));
  return {ok:true, user:rec};
}

/* ---- oturumu state'e uygula / kaydet ---- */
function applyUser(rec){
  state.currentUser = rec.username;
  state.hero = {
    name:rec.username,
    grade:Number(rec.grade)||1,
    className:(Number(rec.grade)||1) + '. Sınıf',
    teacher:rec.teacher||'', teacherCode:rec.teacherCode||'',
    email:rec.email||'', fullName:rec.fullName||rec.username,
    level:rec.level||1, xp:rec.xp||0, coins:rec.coins||0
  };
  state.completed = rec.completed || {};
  if(rec.settings) Object.assign(state.settings, rec.settings);
  state.loggedIn = true;
}

async function loadState(){
  const sessionKey = await DB.read(SESSION_KEY);
  if(!sessionKey) return;
  const rec = await DB.readJSON(sessionKey);
  if(!rec || !rec.username){ await DB.remove(SESSION_KEY); return; }
  applyUser(rec);
}

async function saveState(){
  if(!state.loggedIn || !state.currentUser) return;
  const key = USER_KEY(state.currentUser);
  const rec = await DB.readJSON(key);
  if(!rec) return;
  rec.level = state.hero.level;
  rec.xp = state.hero.xp;
  rec.coins = state.hero.coins;
  rec.completed = state.completed;
  rec.settings = state.settings;
  rec.teacher = state.hero.teacher;
  rec.teacherCode = state.hero.teacherCode;
  rec.fullName = state.hero.fullName;
  rec.email = state.hero.email;
  rec.grade = state.hero.grade;
  await DB.writeJSON(key, rec);
}

async function doLogout(){
  await DB.remove(SESSION_KEY);
  state.loggedIn = false;
  state.currentUser = null;
  state.completed = {};
  state.hero = {name:'', grade:1, className:'', teacher:'', teacherCode:'', email:'', fullName:'', level:1, xp:0, coins:0};
  state.formError = '';
  go('welcome');
}

/* ===================== SMALL HELPERS ===================== */
function qa(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function speak(text){
  try{
    if(!state.settings.sound) return;
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'tr-TR'; u.rate = 0.85; u.pitch = 1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);

function toast(msg){
  try{
    const old = document.getElementById('toastEl');
    if(old) old.remove();
    const t = document.createElement('div');
    t.id = 'toastEl'; t.className = 'toast'; t.textContent = msg;
    document.querySelector('.app-shell').appendChild(t);
    setTimeout(()=>{ if(t && t.parentNode) t.remove(); }, 2200);
  }catch(e){}
}

function getGame(id){ return ALL_GAMES.find(g => g.id === id); }

/* ===================== GÖRSEL YARDIMCILAR (VISUAL HELPERS) ===================== */
const EMOJI_RE = /^([\u200D\uFE0F\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{25A0}-\u{25FF}\u{2B00}-\u{2BFF}\u{1F1E6}-\u{1F1FF}\u{3030}\u{303D}\u{3297}\u{3299}\u{00A9}\u{00AE}\u{2122}]+)\s*(.*)$/u;
function splitLabel(label){
  const s = String(label);
  const m = s.match(EMOJI_RE);
  if(m) return {emo:m[1], text:(m[2]||'').trim()};
  return {emo:null, text:s};
}
function labelInner(label){
  const p = splitLabel(label);
  if(p.emo && p.text) return `<span class="tile-emo">${p.emo}</span><span class="tile-text">${p.text}</span>`;
  if(p.emo) return p.emo;
  return p.text;
}
function labelClass(label){
  const p = splitLabel(label);
  if(p.emo && p.text) return 'tile-rich';
  if(p.emo) return 'tile-emo-only';
  return '';
}
function instr(text){
  if(!text) return '';
  return `<div class="mascot-row"><div class="mascot">🦊</div><div class="speech-bubble">${text}</div></div>`;
}
function renderSceneLayer(game){
  const def = SCENE_DEFS[game.scene] || SCENE_DEFS.sky;
  const d = def.decor;
  /* arka katman: büyük ve soluk dekor (derinlik hissi) */
  const back = [
    {em:d[0], l:4,  t:5,  s:60},
    {em:d[1], l:72, t:3,  s:66}
  ].map((o,i)=>`<div class="scene-far" style="left:${o.l}%; top:${o.t}%; font-size:${o.s}px; animation-delay:${i*0.9}s;">${o.em}</div>`).join('');
  /* orta katman: küçük süzülen ögeler */
  const spots = [[10,26,24],[84,22,26],[6,54,22],[88,50,24],[46,3,22],[26,68,20]];
  const mid = d.map((em,i)=>{
    const sp = spots[i % spots.length];
    return `<div class="scene-decor" style="left:${sp[0]}%; top:${sp[1]}%; font-size:${sp[2]}px; animation-delay:${(i*0.45).toFixed(2)}s;">${em}</div>`;
  }).join('');
  const ground = def.ground.map(em=>`<span>${em}</span>`).join('');
  return `<div class="scene-layer">${back}${mid}<div class="scene-band"></div><div class="scene-ground">${ground}</div></div>`;
}

/* ===================================================== */
function isImmersive(game){ return game && game.subj === 'math'; }

function renderImmersiveScene(game){
  const def = SCENE_DEFS[game.scene] || SCENE_DEFS.sky;
  const fx  = SCENE_FX[game.scene]  || SCENE_FX.sky;

  /* kayan parallax katmanları — liste iki kez tekrar edilir ki döngü kusursuz olsun */
  const strip = arr => { const half = [...arr, ...arr]; return [...half, ...half].map(e=>`<span>${e}</span>`).join(''); };
  const far  = `<div class="px px-far">${strip(def.decor)}</div>`;
  const mid  = `<div class="px px-mid">${strip([...def.decor].reverse())}</div>`;
  const near = `<div class="px px-near">${strip(def.ground)}</div>`;

  /* sürekli hareket eden aktörler: [emoji, animasyon, sol%, üst%, boyut] */
  const actors = fx.actors.map(a=>{
    const [em, anim, left, top, size] = a;
    return `<div class="actor a-${anim}" style="left:${left}%; top:${top}%; font-size:${size}px;">${em}</div>`;
  }).join('');

  /* ortam parçacıkları */
  const [pEm, pAnim, pCount] = fx.p;
  let parts = '';
  for(let i=0;i<pCount;i++){
    const left = Math.round(Math.random()*96);
    const dur = (5 + Math.random()*7).toFixed(1);
    const delay = (Math.random()*7).toFixed(1);
    const size = 13 + Math.round(Math.random()*11);
    const top = pAnim === 'twinkle' ? `top:${Math.round(Math.random()*88)}%;` : '';
    parts += `<div class="particle p-${pAnim}" style="left:${left}%; ${top} font-size:${size}px; animation-duration:${dur}s; animation-delay:${delay}s;">${pEm}</div>`;
  }

  return `<div class="imm-scene">${far}${mid}${actors}${parts}<div class="imm-ground-band"></div>${near}</div>`;
}

function renderImmersiveScreen(g){
  const def = SCENE_DEFS[g.scene] || SCENE_DEFS.sky;
  return `<div class="immersive-stage" id="immStage" style="background:${def.bg}">
    ${renderImmersiveScene(g)}
    <div class="imm-hud">
      <button class="back-btn" onclick="go('subjectList')">←</button>
      <div class="hud-title"><div class="t1">${g.emo} ${g.title}</div><div class="t2">${g.sub}</div></div>

}

function screenFx(kind, text){
  try{
    const stage = document.getElementById('immStage');
    if(!stage) return;
    if(kind === 'bad'){
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
      setTimeout(()=>{ if(stage) stage.classList.remove('shake'); }, 450);
      return;
    }
    const flash = document.createElement('div');
    flash.className = 'fx-flash';
    stage.appendChild(flash);
    setTimeout(()=>{ if(flash && flash.parentNode) flash.remove(); }, 560);
    if(text){
      const b = document.createElement('div');
      b.className = 'fx-banner';
      b.textContent = text;
      stage.appendChild(b);
      setTimeout(()=>{ if(b && b.parentNode) b.remove(); }, 900);
    }
  }catch(e){ /* efektler süstür, hata oyunu durdurmasın */ }
}

function burstAt(el, emo){
  try{
    if(!el || !document.body) return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    for(let i=0;i<8;i++){
      const bit = document.createElement('div');
      bit.className = 'burst-bit';
      bit.textContent = emo || '✨';
      bit.style.left = (cx-8)+'px';
      bit.style.top  = (cy-8)+'px';
      document.body.appendChild(bit);
      const ang = (Math.PI*2*i)/8 + Math.random()*0.5;
      const dist = 45 + Math.random()*45;
      requestAnimationFrame(()=>{
        bit.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) scale(.4) rotate(${Math.round(Math.random()*300)}deg)`;
        bit.style.opacity = '0';
      });
      setTimeout(()=>{ if(bit && bit.parentNode) bit.remove(); }, 680);
    }
  }catch(e){}
}

/* Sayma/anket türü oyunlarda her dokunuş bir "doğru cevap" değil;
   bu türlerde ekran tepkisi verilmez (kendi görsel geri bildirimleri var) */
const FX_QUIET = {countToTarget:true, surveyChart:true, estimateReveal:true, balanceScale:true};

/* İlerleme algılayıcı: her başarılı hamlede ekran tepkisi vermek için */
function progressSig(game){
  const c = game.cfg;
  switch(game.type){
    case 'tapSelect':     return gs.done ? gs.done.size : 0;
    case 'dragMatch':     return Object.keys(gs.placed||{}).length;
    case 'orderSequence': return (c.mode === 'tapInOrder') ? (gs.progress||0) : (gs.stepIndex||0);
    case 'estimateReveal':return gs.phase === 'revealed' ? 1 : 0;
    case 'balanceScale':  return (gs.phase === 'equalize' ? 1 : 0) + (gs.rightVal||0);
    case 'choiceQuestion':return (gs.stepIndex||0) + Object.keys(gs.flashRevealed||{}).length;
    case 'countToTarget': return Math.abs((gs.count||0) - c.start);
    case 'surveyChart':   return gs.revealed||0;
    case 'typeWord':      return (gs.answer||'').length;
    default: return 0;
  }
}

/* ===== GERÇEK SÜRÜKLE-BIRAK MOTORU (drag & drop) ===== */
/* Parmakla/fareyle gerçekten sürüklenir; dokunarak yerleştirme de çalışmaya devam eder */
let dragCtx = null;

function dragStart(ev, srcId){
  try{
    const g = getGame(state.currentGameId);
    if(!g || g.type !== 'dragMatch') return;
    if(gs.placed && gs.placed[srcId] !== undefined) return;
    if(ev.button !== undefined && ev.button !== 0) return;
    dragCtx = {srcId, startX:ev.clientX, startY:ev.clientY, moved:false, ghost:null, hoverEl:null};
    document.addEventListener('pointermove', dragMove, {passive:false});
    document.addEventListener('pointerup', dragEnd);
    document.addEventListener('pointercancel', dragEnd);
  }catch(e){ dragCtx = null; }
}

function dragMove(ev){
  if(!dragCtx) return;
  const dx = ev.clientX - dragCtx.startX, dy = ev.clientY - dragCtx.startY;
  if(!dragCtx.moved){
    if(Math.sqrt(dx*dx + dy*dy) < 7) return;   /* küçük titremeleri sürükleme sayma */
    dragCtx.moved = true;
    const g = getGame(state.currentGameId);
    const src = g.cfg.sources.find(s=>s.id===dragCtx.srcId);
    const p = src ? splitLabel(src.label) : {emo:null, text:'?'};
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = p.emo || p.text;
    document.body.appendChild(ghost);
    dragCtx.ghost = ghost;
    gs.picked = dragCtx.srcId;
    gs.draggingId = dragCtx.srcId;
    renderGameBody();          /* hedefler "hazır" hâline geçsin */
  }
  ev.preventDefault();
  if(dragCtx.ghost){
    dragCtx.ghost.style.left = ev.clientX + 'px';
    dragCtx.ghost.style.top  = ev.clientY + 'px';
  }
  dragHitTest(ev.clientX, ev.clientY);
}

function dragHitTest(x, y){
  try{
    const el = document.elementFromPoint(x, y);
    const tz = el && el.closest ? el.closest('.target-zone') : null;
    if(dragCtx.hoverEl && dragCtx.hoverEl !== tz) dragCtx.hoverEl.classList.remove('drag-over');
    if(tz) tz.classList.add('drag-over');
    dragCtx.hoverEl = tz;
  }catch(e){}
}

function dragEnd(ev){
  document.removeEventListener('pointermove', dragMove);
  document.removeEventListener('pointerup', dragEnd);
  document.removeEventListener('pointercancel', dragEnd);
  const ctx = dragCtx;
  dragCtx = null;
  if(!ctx) return;
  if(ctx.ghost && ctx.ghost.parentNode) ctx.ghost.remove();
  if(ctx.hoverEl) ctx.hoverEl.classList.remove('drag-over');
  gs.draggingId = null;
  /* hiç hareket etmediyse: normal dokunma davranışı (onclick devralır) */
  if(!ctx.moved) return;
  let tid = null;
  try{
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const tz = el && el.closest ? el.closest('.target-zone') : null;
    if(tz) tid = tz.getAttribute('data-tid');
  }catch(e){}
  if(tid){
    gs.picked = ctx.srcId;
    dragTarget(tid);
  } else {
    gs.picked = null;         /* boşluğa bırakıldı: nesne yerine döner */
    renderGameBody();
  }
}

/* --- harf çizme oyununda parmakla iz sürme --- */
function traceStart(ev){
  try{
    const g = getGame(state.currentGameId);
    if(!g || g.type !== 'orderSequence' || g.cfg.mode !== 'tapInOrder' || g.cfg.visual !== 'path') return;
    ev.preventDefault();
    document.addEventListener('pointermove', traceMove, {passive:false});
    document.addEventListener('pointerup', traceEnd);
    document.addEventListener('pointercancel', traceEnd);
    traceMove(ev);
  }catch(e){}
}
function traceMove(ev){
  try{
    ev.preventDefault();
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if(!el || !el.classList || !el.classList.contains('trace-pt')) return;
    const g = getGame(state.currentGameId), c = g.cfg;
    const expected = c.order[gs.progress];
    const id = el.getAttribute('data-pid');
    if(id && id === expected) seqTapInOrder(id);
  }catch(e){}
}
function traceEnd(){
  document.removeEventListener('pointermove', traceMove);
  document.removeEventListener('pointerup', traceEnd);
  document.removeEventListener('pointercancel', traceEnd);
}

function flyEmoji(fromEl, toSelector, content){
  try{
    if(!fromEl || !document.body) return;
    const to = document.querySelector(toSelector);
    if(!to) return;
    const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly-emoji';
    fly.textContent = content;
    fly.style.left = (a.left + a.width/2 - 15) + 'px';
    fly.style.top  = (a.top + a.height/2 - 15) + 'px';
    document.body.appendChild(fly);
    const dx = (b.left + b.width/2) - (a.left + a.width/2);
    const dy = (b.top + b.height/2) - (a.top + a.height/2);
    requestAnimationFrame(()=>{
      fly.style.transform = `translate(${dx}px,${dy}px) scale(.5) rotate(24deg)`;
      fly.style.opacity = '0.15';
    });
    setTimeout(()=>{ if(fly && fly.parentNode) fly.remove(); }, 640);
  }catch(e){ /* animation is decorative only */ }
}

/* ===================== OYUN MOTORU (GAME ENGINE) ===================== */
function initGS(game){
  const c = game.cfg;
  switch(game.type){
    case 'tapSelect': return {done:new Set(), wrongId:null};
    case 'dragMatch': return {picked:null, placed:{}, wrongId:null, draggingId:null};
    case 'orderSequence':
      if(c.mode === 'tapInOrder') return {progress:0, wrongId:null};
      return {stepIndex:0, wrongId:null};
    case 'patternFill': return {wrongId:null};
    case 'estimateReveal': return {phase:'estimate', estChoice:null};
    case 'balanceScale': return {phase:(c.compare ? 'compare' : 'equalize'), rightVal:(c.equalize ? c.equalize.rightStart : 0), wrongId:null};
    case 'choiceQuestion': return {stepIndex:0, flashRevealed:{}, wrongId:null};
    case 'countToTarget': return {count:c.start};
    case 'surveyChart': return {revealed:0, tally:{}, phase:'survey', wrongId:null};
    case 'typeWord': return {answer:''};
    default: return {};
  }
}

function openGame(id){
  state.currentGameId = id;
  gs = initGS(getGame(id));
  go('gamePlayer');
}

function retryGame(){
  gs = initGS(getGame(state.currentGameId));
  renderGameBody();
}

function flashWrong(key){
  gs.wrongId = key;
  screenFx('bad');
  renderGameBody();
  setTimeout(()=>{ if(gs.wrongId === key){ gs.wrongId = null; renderGameBody(); } }, 350);
}

function completeGame(msg){
  const g = getGame(state.currentGameId);
  gs.celebrating = true;
  gs.celebrateMsg = msg || '';
  speak(msg ? msg : 'Harika iş, tebrikler!');
  if(!state.completed[g.id]){
    state.completed[g.id] = true;
    state.hero.xp += 15;
    state.hero.coins += 5;
    while(state.hero.xp >= 100){ state.hero.xp -= 100; state.hero.level += 1; }
    saveState();
  }
  renderGameBody();
}

function renderStage(game){
  const c = game.cfg;
  switch(game.type){
    case 'tapSelect': return renderTapSelect(game, c);
    case 'dragMatch': return renderDragMatch(game, c);
    case 'orderSequence': return c.mode === 'tapInOrder' ? renderSeqTapOrder(game, c) : renderSeqStepChoice(game, c);
    case 'patternFill': return renderPatternFill(game, c);
    case 'estimateReveal': return renderEstimateReveal(game, c);
    case 'balanceScale': return renderBalanceScale(game, c);
    case 'choiceQuestion': return renderChoiceQuestion(game, c);
    case 'countToTarget': return renderCountToTarget(game, c);
    case 'surveyChart': return renderSurveyChart(game, c);
    case 'typeWord': return renderTypeWord(game, c);
    default: return '<p>Bu oyun hazırlanıyor.</p>';
  }
}

/* ---------- SESLİ DİREKTİFLER (spoken instructions) ---------- */
function getCurrentPrompt(game){
  if(gs.celebrating) return null;
  const c = game.cfg;
  switch(game.type){
    case 'choiceQuestion': {
      const step = c.steps[gs.stepIndex];
      if(!step) return null;
      if(step.flashMs && !gs.flashRevealed[gs.stepIndex]) return null;
      return step.prompt;
    }
    case 'estimateReveal':
      return gs.phase === 'estimate' ? c.instruction : estimateFeedback(gs.estChoice, c.actualValue);
    case 'balanceScale':
      return gs.phase === 'compare' ? c.compare.question : 'Şimdi kefeleri eşitle!';
    case 'surveyChart':
      return gs.phase === 'survey' ? c.instruction : c.finalPrompt;
    default:
      return c.instruction;
  }
}
function autoSpeak(game){
  const text = getCurrentPrompt(game);
  if(text && text !== gs.spokenKey){
    gs.spokenKey = text;
    speak(text);
  }
}
function replayPrompt(){
  const g = getGame(state.currentGameId);
  if(!g) return;
  if(gs.celebrating){ speak(gs.celebrateMsg || 'Harika iş, tebrikler!'); return; }
  const text = getCurrentPrompt(g);
  if(text) speak(text);
}

/* ---------- 1) tapSelect ---------- */
function renderTapSelect(game, c){
  let html = `${instr(c.instruction)}<div class="tile-wrap">`;
  c.items.forEach(it=>{
    const isDone = gs.done.has(it.id);
    const isWrong = gs.wrongId === it.id;
    html += `<button class="tile ${labelClass(it.label)} ${isDone?'correct':''} ${isWrong?'wrong':''}" ${isDone?'disabled':''} onclick="tapSelectTap('${qa(it.id)}', this)">${labelInner(it.label)}</button>`;
  });
  html += '</div>';
  if(c.collector){
    const caught = c.items.filter(it => gs.done.has(it.id)).map(it=>{
      const p = splitLabel(it.label);
      return `<span>${p.emo || '✔️'}</span>`;
    }).join('');
    html += `<div class="collector ${gs.justCaught?'pulse':''}" id="collectorBox">
      <div class="collector-stack">${caught}</div>
      <div class="collector-body">${c.collector.emo}</div>
      <div class="collector-label">${c.collector.label} ${gs.done.size}/${c.correct.length}</div>
    </div>`;
  } else if(c.mode === 'multi'){
    html += `<div class="progress-text">${gs.done.size} / ${c.correct.length} bulundu</div>`;
  }
  return html;
}
function tapSelectTap(id, el){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(gs.done.has(id)) return;
  if(c.correct.includes(id)){
    const item = c.items.find(x=>x.id===id);
    const p = item ? splitLabel(item.label) : {emo:null};
    burstAt(el, '✨');
    if(c.collector){
      flyEmoji(el, '#collectorBox .collector-body', p.emo || '✔️');
    }
    gs.done.add(id);
    gs.justCaught = true;
    const need = c.mode === 'multi' ? c.correct.length : 1;
    if(gs.done.size >= need){
      if(c.speak) speak(c.speak);
      completeGame();
      return;
    }
    renderGameBody();
    setTimeout(()=>{ gs.justCaught = false; }, 500);
  } else {
    flashWrong(id);
  }
}

/* ---------- 2) dragMatch (tap-to-pick, tap-to-place) ---------- */
function renderDragMatch(game, c){
  let html = `${instr(c.instruction)}<div class="tile-wrap">`;
  c.sources.forEach(s=>{
    if(gs.placed[s.id] !== undefined) return;
    const isPicked = gs.picked === s.id;
    const isDragging = gs.draggingId === s.id;
    html += `<button class="tile tile-drag ${labelClass(s.label)} ${isPicked?'picked':''} ${isDragging?'dragging':''}" onpointerdown="dragStart(event,'${qa(s.id)}')" onclick="dragPick('${qa(s.id)}')">${labelInner(s.label)}</button>`;
  });
  html += '</div><div class="target-row">';
  c.targets.forEach(t=>{
    const placedEmos = Object.entries(gs.placed).filter(([k,v])=>v===t.id).map(([k])=>{
      const src = c.sources.find(s=>s.id===k);
      if(!src) return '';
      const p = splitLabel(src.label);
      return `<span class="placed">${p.emo || p.text}</span>`;
    });
    const isWrong = gs.wrongId === ('t_'+t.id);
    const tp = splitLabel(t.label);
    const need = t.need || 0;
    let slot = '';
    if(placedEmos.length) slot = placedEmos.join('');
    else if(need > 0) slot = Array(need).fill('<div class="tz-empty"></div>').join('');
    html += `<div class="target-zone ${placedEmos.length?'filled':''} ${isWrong?'wrong':''} ${gs.picked?'ready':''}" data-tid="${qa(t.id)}" onclick="dragTarget('${qa(t.id)}')">
      ${tp.emo ? `<div class="tz-emo">${tp.emo}</div>` : ''}
      <div class="target-label">${tp.text || (tp.emo ? '' : t.label)}</div>
      <div class="tz-slot">${slot}</div>
    </div>`;
  });
  html += '</div>';
  if(!gs.picked) html += `<div class="drag-hint">✋ Parmağınla sürükle ya da dokun-yerleştir</div>`;
  if(gs.picked){
    html += `<div class="progress-text">Şimdi doğru kutuya dokun! 👆</div>`;
  }
  return html;
}
function dragPick(id){
  if(gs.placed[id] !== undefined) return;
  gs.picked = (gs.picked === id) ? null : id;
  renderGameBody();
}
function dragTarget(tid){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(!gs.picked){ return; }
  const src = c.sources.find(s=>s.id===gs.picked);
  if(src && src.match === tid){
    gs.placed[gs.picked] = tid;
    const pickedId = gs.picked;
    gs.picked = null;
    const fulfilled = {};
    Object.values(gs.placed).forEach(tt=>{ fulfilled[tt] = (fulfilled[tt]||0) + 1; });
    const ok = c.targets.every(t => !t.need || (fulfilled[t.id]||0) >= t.need);
    if(ok){
      if(c.speak) speak(c.speak);
      completeGame();
      return;
    }
    renderGameBody();
  } else {
    gs.picked = null;
    flashWrong('t_'+tid);
  }
}

/* ---------- 3) orderSequence: tapInOrder ---------- */
function renderSeqTapOrder(game, c){
  let html = `${instr(c.instruction)}`;
  if(c.visual === 'path'){
    const donePts = c.order.slice(0, gs.progress).map(id => c.items.find(i=>i.id===id));
    html += `<svg viewBox="${c.viewBox||'0 0 150 210'}" class="trace-svg" onpointerdown="traceStart(event)">`;
    if(donePts.length > 1){
      html += `<polyline points="${donePts.map(p=>p.x+','+p.y).join(' ')}" class="trace-line"/>`;
    }
    c.items.forEach(it=>{
      const doneIdx = c.order.indexOf(it.id);
      const isDone = doneIdx >= 0 && doneIdx < gs.progress;
      const isNext = it.id === c.order[gs.progress];
      html += `<circle cx="${it.x}" cy="${it.y}" r="15" data-pid="${qa(it.id)}" class="trace-pt ${isDone?'done':''} ${isNext?'next':''}" onclick="seqTapInOrder('${qa(it.id)}')"></circle><text x="${it.x}" y="${it.y+4}" class="trace-num" onclick="seqTapInOrder('${qa(it.id)}')">${it.label}</text>`;
    });
    html += `</svg><div class="drag-hint">✋ Parmağını noktalar üzerinde kaydır</div>`;
  } else {
    html += '<div class="tile-wrap">';
    c.items.forEach(it=>{
      const doneIdx = c.order.indexOf(it.id);
      const isDone = doneIdx >= 0 && doneIdx < gs.progress;
      const isWrong = gs.wrongId === it.id;
      html += `<button class="tile ${labelClass(it.label)} ${isDone?'correct':''} ${isWrong?'wrong':''}" ${isDone?'disabled':''} onclick="seqTapInOrder('${qa(it.id)}')">${labelInner(it.label)}</button>`;
    });
    html += '</div>';
  }
  html += `<div class="progress-text">${gs.progress} / ${c.order.length}</div>`;
  return html;
}
function seqTapInOrder(id){
  const g = getGame(state.currentGameId), c = g.cfg;
  const expected = c.order[gs.progress];
  if(id === expected){
    gs.progress++;
    if(gs.progress >= c.order.length){
      if(c.speak) speak(c.speak);
      completeGame();
      return;
    }
    renderGameBody();
  } else {
    flashWrong(id);
  }
}

/* ---------- 3b) orderSequence: stepChoice ---------- */
function renderSeqStepChoice(game, c){
  let html = `${instr(c.instruction)}`;
  const trailVals = c.sequence.slice(0, gs.stepIndex).map(v=>{
    const f = c.choices.find(x=>x.key===v); return f ? f.label : v;
  });
  html += `<div class="trail-text">${trailVals.length? trailVals.join(' → ')+' → ':''}${gs.stepIndex<c.sequence.length?'❓':'✅'}</div>`;
  html += '<div class="tile-wrap">';
  c.choices.forEach(ch=>{
    const isWrong = gs.wrongId === ch.key;
    html += `<button class="tile ${labelClass(ch.label)} ${isWrong?'wrong':''}" onclick="seqStepChoice('${qa(ch.key)}')">${labelInner(ch.label)}</button>`;
  });
  html += `</div><div class="progress-text">${gs.stepIndex} / ${c.sequence.length}</div>`;
  return html;
}
function seqStepChoice(key){
  const g = getGame(state.currentGameId), c = g.cfg;
  const expected = c.sequence[gs.stepIndex];
  if(key === expected){
    gs.stepIndex++;
    if(gs.stepIndex >= c.sequence.length){ completeGame(); return; }
    renderGameBody();
  } else {
    flashWrong(key);
  }
}

/* ---------- 4) patternFill ---------- */
function renderPatternFill(game, c){
  let html = `${instr(c.instruction)}`;
  html += `<div class="pattern-row">${c.sequence.map(s=>`<span class="pattern-tile ${labelClass(s)}">${labelInner(s)}</span>`).join('')}</div>`;
  html += '<div class="tile-wrap">';
  c.options.forEach(opt=>{
    const isWrong = gs.wrongId === opt;
    html += `<button class="tile ${labelClass(opt)} ${isWrong?'wrong':''}" onclick="patternChoose('${qa(opt)}')">${labelInner(opt)}</button>`;
  });
  html += '</div>';
  return html;
}
function patternChoose(val){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(val === c.correct){ completeGame(c.ruleMsg); }
  else { flashWrong(val); }
}

/* ---------- 5) estimateReveal ---------- */
function estimateFeedback(est, actual){
  if(est === actual) return `Süper tahmin! Gerçek sayı da ${actual} çıktı! 🎯`;
  if(est < actual) return `Tahminin ${est} idi, gerçekte ${actual} çıktı — düşündüğünden fazlaymış!`;
  return `Tahminin ${est} idi, gerçekte ${actual} çıktı — düşündüğünden azmış!`;
}
function renderEstimateReveal(game, c){
  let html = `${instr(c.instruction)}`;
  if(gs.phase === 'estimate'){
    html += '<div class="tile-wrap">';
    c.estimateOptions.forEach(o=>{
      const sel = gs.estChoice === o.value;
      html += `<button class="tile ${labelClass(o.label)} ${sel?'picked':''}" onclick="estChoose(${o.value})">${labelInner(o.label)}</button>`;
    });
    html += '</div>';
    if(gs.estChoice !== null && gs.estChoice !== undefined){
      html += `<button class="btn btn-teal" onclick="estReveal()">🔍 Say ve Göster!</button>`;
    }
  } else {
    const fb = estimateFeedback(gs.estChoice, c.actualValue);
    html += `<div class="reveal-box">${c.actualDisplay}</div><div class="feedback-text">${fb}</div>`;
    html += `<button class="btn btn-teal" onclick="estFinish()">✅ Harika, Devam Et!</button>`;
  }
  return html;
}
function estChoose(val){ gs.estChoice = val; renderGameBody(); }
function estReveal(){ gs.phase = 'revealed'; renderGameBody(); }
function estFinish(){ completeGame(); }

/* ---------- 6) balanceScale ---------- */
function renderBalanceScale(game, c){
  let html = `${instr(c.instruction)}`;
  if(gs.phase === 'compare'){
    const cmp = c.compare;
    const tilt = cmp.leftCount > cmp.rightCount ? 'tilt-left' : (cmp.leftCount < cmp.rightCount ? 'tilt-right' : 'tilt-flat');
    html += `<div class="scale-visual ${tilt}"><div class="pan">${cmp.emoji.repeat(cmp.leftCount)}</div><div class="pan">${cmp.emoji.repeat(cmp.rightCount)}</div></div>`;
    html += `<div class="game-question">${cmp.question}</div><div class="tile-wrap">`;
    cmp.options.forEach(o=>{
      const isWrong = gs.wrongId === o;
      html += `<button class="tile ${isWrong?'wrong':''}" onclick="balCompare('${qa(o)}')">${o}</button>`;
    });
    html += '</div>';
  } else {
    const eq = c.equalize;
    const tilt = eq.leftVal > gs.rightVal ? 'tilt-left' : (eq.leftVal < gs.rightVal ? 'tilt-right' : 'tilt-flat');
    html += `<div class="scale-visual ${tilt}"><div class="pan">${eq.unitLabel.repeat(eq.leftVal)}</div><div class="pan">${eq.unitLabel.repeat(gs.rightVal)}</div></div>`;
    html += `<button class="btn btn-teal" onclick="balAdd()">➕ 1 ${eq.unitLabel} Ekle</button>`;
  }
  return html;
}
function balCompare(label){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(label === c.compare.correct){
    if(c.equalize){ gs.phase = 'equalize'; renderGameBody(); }
    else completeGame();
  } else {
    flashWrong(label);
  }
}
function balAdd(){
  const g = getGame(state.currentGameId), c = g.cfg;
  gs.rightVal++;
  if(gs.rightVal === c.equalize.leftVal){ completeGame(c.equalize.resultEquation); return; }
  if(gs.rightVal > c.equalize.leftVal){ gs.rightVal = c.equalize.rightStart; toast('Az kaldı, tekrar dene! 💪'); }
  renderGameBody();
}

/* ---------- 7) choiceQuestion (supports chained steps + optional flash memory) ---------- */
function renderChoiceQuestion(game, c){
  const idx = gs.stepIndex;
  if(idx >= c.steps.length) return '';
  const step = c.steps[idx];
  let html = `${instr(c.instruction)}`;
  if(step.flashMs && !gs.flashRevealed[idx]){
    html += `<div class="flash-box">${step.flashContent}</div>`;
    if(!gs._flashTimerStarted){
      gs._flashTimerStarted = true;
      const forId = game.id;
      setTimeout(()=>{
        /* oyuncu bu arada başka oyuna geçmiş olabilir */
        if(state.currentGameId !== forId || !gs.flashRevealed) return;
        gs.flashRevealed[idx] = true;
        gs._flashTimerStarted = false;
        renderGameBody();
      }, step.flashMs);
    }
    return html;
  }
  html += `<div class="game-question">${step.prompt}</div><div class="tile-wrap">`;
  step.options.forEach((o,oi)=>{
    const isWrong = gs.wrongId === ('o_'+idx+'_'+oi);
    html += `<button class="tile ${labelClass(o.label)} ${isWrong?'wrong':''}" onclick="cqChoose(${idx},${oi})">${labelInner(o.label)}</button>`;
  });
  html += '</div>';
  if(c.steps.length > 1){ html += `<div class="progress-text">${idx} / ${c.steps.length}</div>`; }
  return html;
}
function cqChoose(stepIdx, optIdx){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(stepIdx !== gs.stepIndex) return;
  const opt = c.steps[stepIdx].options[optIdx];
  if(opt.correct){
    gs.stepIndex++;
    if(gs.stepIndex >= c.steps.length){ completeGame(); return; }
    renderGameBody();
  } else {
    flashWrong('o_'+stepIdx+'_'+optIdx);
  }
}

/* ---------- 8) countToTarget ---------- */
function renderCountToTarget(game, c){
  let html = `${instr(c.instruction)}`;
  if(c.wordLabel) html += `<div class="word-label">Kelime: "${c.wordLabel}"</div>`;
  html += `<div class="count-display">${gs.count}</div>`;
  if(c.visual === 'tenFrame'){
    html += '<div class="ten-frame">';
    for(let i=0;i<20;i++){ html += `<div class="tf-cell ${i<gs.count?'filled':''}">${i<gs.count?c.unitEmoji:''}</div>`; }
    html += '</div>';
  } else {
    const floors = Math.max(c.start, c.target, 5);
    html += '<div class="tower">';
    for(let f=1; f<=floors; f++){ html += `<div class="tower-floor ${f<=gs.count?'lit':''}">${f}. Kat ${f<=gs.count?c.unitEmoji:''}</div>`; }
    html += '</div>';
  }
  html += `<button class="btn btn-teal" onclick="countBump()">${c.direction==='down' ? '⬇️ Bir Aşağı İn' : '➕ Bir Ekle'}</button>`;
  return html;
}
function countBump(){
  const g = getGame(state.currentGameId), c = g.cfg;
  gs.count += (c.direction === 'down' ? -1 : 1);
  if(gs.count === c.target){ completeGame(); return; }
  renderGameBody();
}

/* ---------- 9) surveyChart ---------- */
function renderSurveyChart(game, c){
  let html = `${instr(c.instruction)}<div class="chart-row">`;
  c.options.forEach(o=>{
    const n = gs.tally[o.id] || 0;
    html += `<div class="chart-col"><div class="chart-bar" style="height:${14+n*16}px">${o.emoji.repeat(Math.min(n,6))}</div><div class="chart-label">${o.label}<br>(${n})</div></div>`;
  });
  html += '</div>';
  if(gs.phase === 'survey'){
    html += `<button class="btn btn-teal" onclick="surveyNext()">👉 Sıradaki (${gs.revealed}/${c.responses.length})</button>`;
  } else {
    html += `<div class="game-question">${c.finalPrompt}</div><div class="tile-wrap">`;
    c.finalOptions.forEach((o,oi)=>{
      const isWrong = gs.wrongId === ('f_'+oi);
      html += `<button class="tile ${labelClass(o.label)} ${isWrong?'wrong':''}" onclick="surveyChoose(${oi})">${labelInner(o.label)}</button>`;
    });
    html += '</div>';
  }
  return html;
}
function surveyNext(){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(gs.revealed >= c.responses.length) return;
  const opt = c.responses[gs.revealed];
  gs.tally[opt] = (gs.tally[opt]||0) + 1;
  gs.revealed++;
  if(gs.revealed >= c.responses.length) gs.phase = 'question';
  renderGameBody();
}
function surveyChoose(idx){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(c.finalOptions[idx].correct){ completeGame(); }
  else { flashWrong('f_'+idx); }
}

/* ---------- 10) typeWord ---------- */
function renderTypeWord(game, c){
  let html = `${instr(c.instruction)}`;
  html += `<button class="btn btn-outline" onclick="twReplay()">🔊 Dinle</button>`;
  html += `<div class="word-strip ${gs.wrongId==='strip'?'wrong':''}">`;
  for(let i=0;i<c.target.length;i++){ html += `<div class="letter-box ${gs.answer[i]?'filled':''}">${gs.answer[i]||''}</div>`; }
  html += '</div><div class="tile-wrap">';
  c.letters.forEach(l=>{ html += `<button class="tile" onclick="twType('${qa(l)}')">${l}</button>`; });
  html += '</div>';
  html += `<button class="btn btn-outline" onclick="twBackspace()">⌫ Sil</button>`;
  return html;
}
function twType(ch){
  const g = getGame(state.currentGameId), c = g.cfg;
  if(gs.answer.length >= c.target.length) return;
  gs.answer += ch;
  if(gs.answer.length === c.target.length){
    if(gs.answer === c.target){ completeGame(); return; }
    gs.wrongId = 'strip';
    renderGameBody();
    setTimeout(()=>{ gs.answer=''; gs.wrongId=null; renderGameBody(); }, 650);
    return;
  }
  renderGameBody();
}
function twBackspace(){ gs.answer = gs.answer.slice(0,-1); renderGameBody(); }
function twReplay(){ const g = getGame(state.currentGameId); speak(g.cfg.speak || g.cfg.target); }

function renderGamePlayerScreen(){
  const g = getGame(state.currentGameId);
  autoSpeak(g);
  if(isImmersive(g)) return renderImmersiveScreen(g);
  const sceneDef = SCENE_DEFS[g.scene] || SCENE_DEFS.sky;
  return `
  <div class="game-header">
    <button class="back-btn" onclick="go('subjectList')">←</button>
    <div class="game-title-block">
      <div class="game-emoji">${g.emo}</div>
      <div><div class="game-title">${g.title}</div><div class="game-sub">${g.sub}</div></div>
    </div>
    <button class="speak-btn" onclick="replayPrompt()" title="Sesli Dinle">🔊</button>
  </div>
  <div class="game-stage" id="gameBody" style="background:${sceneDef.bg}">${renderStageWrapped(g)}</div>
  `;
}
function renderStageWrapped(g){
  if(gs.celebrating) return renderCelebration(g);
  return `${renderSceneLayer(g)}<div class="stage-content">${renderStage(g)}</div>`;
}
function renderGameBody(){
  const el = document.getElementById('gameBody');
  if(!el) return;
  const g = getGame(state.currentGameId);
  const imm = isImmersive(g);
  /* tam ekran modunda sadece içerik yenilenir; sahne animasyonları kesintisiz sürer */
  el.innerHTML = imm
    ? (gs.celebrating ? renderCelebration(g) : renderStage(g))
    : renderStageWrapped(g);
  if(imm && !gs.celebrating && !FX_QUIET[g.type]){
    const sig = progressSig(g);
    if(gs._sig !== undefined && sig > gs._sig) screenFx('good', 'DOĞRU! ✓');
    gs._sig = sig;
  }
  if(!gs.celebrating) autoSpeak(g);
}
function renderCelebration(g){
  const pieces = ['🎉','✨','⭐','🌟','🎈'];
  let confetti = '';
  for(let i=0;i<16;i++){
    const left = Math.round(Math.random()*94)+2;
    const delay = (Math.random()*0.5).toFixed(2);
    const dur = (1.5+Math.random()*0.9).toFixed(2);
    const drift = Math.round((Math.random()-0.5)*70);
    confetti += `<div class="confetti-piece" style="left:${left}%; animation-delay:${delay}s; animation-duration:${dur}s; --drift:${drift}px;">${pieces[i % pieces.length]}</div>`;
  }
  return `<div class="celebrate">
    <div class="confetti-layer">${confetti}</div>
    <div class="celebrate-content">
    <div class="trophy-pop" style="font-size:54px">🏆</div>
    <div class="title-hero" style="font-size:21px">Harika İş, Kahraman!</div>
    ${gs.celebrateMsg ? `<div class="feedback-text">${gs.celebrateMsg}</div>` : ''}
    <div class="reward-row">+15 XP 🌟 &nbsp; +5 🪙</div>
    <button class="btn btn-teal" onclick="retryGame()">🔁 Tekrar Oyna</button>
    <button class="btn btn-outline" onclick="go('subjectList')">📋 Oyun Listesine Dön</button>
  </div></div>`;
}

async function doChangePass(){
  const oldP = (document.getElementById('cpOld')||{}).value || '';
  const newP = (document.getElementById('cpNew')||{}).value || '';
  const newP2 = (document.getElementById('cpNew2')||{}).value || '';
  if(newP.length < 4) return setFormError('Yeni şifre en az 4 karakter olmalı.');
  if(newP !== newP2) return setFormError('Yeni şifreler birbiriyle aynı değil.');
  const key = USER_KEY(state.currentUser);
  const rec = await DB.readJSON(key);
  if(!rec) return setFormError('Hesap kaydı bulunamadı.');
  const good = await verifyPassword(oldP, rec.salt, rec.pass);
  if(!good) return setFormError('Eski şifre yanlış.');
  rec.salt = makeSalt();
  rec.pass = await hashPassword(newP, rec.salt);
  await DB.writeJSON(key, rec);
  state.formError = '';
  toast('Şifren güncellendi 🔐');
  go('account');
}

  {id:'f1', name:'MistikPati', level:3, online:true,  emo:'🐱', wins:12, badge:'Bulut Kaşifi'},
  {id:'f2', name:'YıldızPatisi', level:5, online:false, emo:'🐻', wins:20, badge:'Yıldız Avcısı'},
  {id:'f3', name:'HızlıZıp', level:2, online:true,  emo:'🐰', wins:6,  badge:'Hızlı Tavşan'},
  {id:'f4', name:'GölgeKuyruk', level:4, online:false, emo:'🦊', wins:15, badge:'Gölge Ustası'}
];
function renderFriends(){
  let html = `${renderProfileCard()}<div class="panel" style="margin:16px;">
  <div class="title-hero" style="font-size:17px; margin-bottom:10px;">ARKADAŞLAR</div>
  <input class="search-input" placeholder="Arkadaş Ara...">`;
  FRIENDS.forEach(f=>{
    html += `<div class="friend-row" onclick="openFriendModal('${f.id}')">
      <div class="avatar" style="width:44px; height:44px; font-size:22px;">${f.emo}</div>
      <div class="info" style="flex:1;"><div class="gtitle">${f.name}</div><div class="gsub">Seviye ${f.level}</div></div>
      <div class="status-dot ${f.online?'online':'offline'}"></div>
    </div>`;
  });
  html += `<div style="display:flex; gap:10px; margin-top:8px;">
    <button class="btn btn-outline" style="margin-top:0;" onclick="toast('Bu özellik demo sürümünde pasif 🙂')">Yeni Davet Gönder</button>
    <button class="btn btn-outline" style="margin-top:0;" onclick="toast('Bu özellik demo sürümünde pasif 🙂')">Önerilen Arkadaşlar</button>
  </div></div>
  <div style="height:80px"></div>`;
  return html;
}
function openFriendModal(id){ state.friendModal = id; renderAll(); }
function closeFriendModal(){ state.friendModal = null; renderAll(); }
function renderFriendModal(id){
  const f = FRIENDS.find(x=>x.id===id);
  if(!f) return '';
  return `<div class="overlay-bg" onclick="closeFriendModal()"><div class="modal-card" onclick="event.stopPropagation()">
    <div style="font-size:50px;">${f.emo}</div>
    <div class="title-hero" style="font-size:19px;">${f.name}</div>
    <div style="color:${f.online?'#2fa85a':'#999'}; font-weight:700; font-size:13px; margin-top:4px;">${f.online?'● Çevrimiçi':'● Çevrimdışı'}</div>
    <p>Toplam Zaferler: <b>${f.wins}</b><br>En İyi Rozet: <b>${f.badge}</b></p>
    <button class="btn btn-pink" onclick="toast('Bu özellik demo sürümünde pasif 🙂')">🏆 Yarışmaya Çağır</button>
    <button class="btn btn-teal" onclick="toast('Bu özellik demo sürümünde pasif 🙂')">✉️ Mesaj Gönder</button>
    <button class="btn btn-outline" onclick="closeFriendModal()">Kapat</button>
  </div></div>`;
}

function renderSubjectList(){
  const subj = state.currentSubject;
  const games = gamesForSubject(subj);
  const title = subj==='math' ? '🧮 MATEMATİK' : '📖 TÜRKÇE';
  const gr = currentGrade();
  let html = `<div class="list-header"><button class="back-btn" onclick="go('home')">←</button><div class="title-hero" style="font-size:20px; text-align:left;">${title}</div></div>`;

  if(games.length === 0){
    html += `<div class="panel" style="margin:36px 16px; text-align:center;">
      <div style="font-size:56px">🚧</div>
      <div class="title-hero" style="font-size:18px;">${gr}. Sınıf Oyunları Hazırlanıyor</div>
      <p style="color:var(--ink-soft); font-size:13.5px;">
        Bu bölüm için oyunlar henüz eklenmedi. Şu anda <b>1. sınıf</b> müfredatının
        ${ALL_GAMES.filter(g=>g.grade===1).length} oyunu hazır.
      </p>
      <button class="btn btn-teal" onclick="go('home')">Ana Sayfaya Dön</button>
    </div>
    <div style="height:30px"></div>`;
    return html;
  }

  const doneCount = games.filter(g=>state.completed[g.id]).length;
  html += `<div class="progress-text" style="margin:0 16px 10px; text-align:left;">${doneCount} / ${games.length} oyun tamamlandı ✓</div>`;
  let lastGrp = null;
  games.forEach(g=>{
    if(g.grp !== lastGrp){ html += `<div class="section-title">${g.grp}</div>`; lastGrp = g.grp; }
    const done = state.completed[g.id];
    html += `<div class="game-card" onclick="openGame('${g.id}')">
      <div class="emoji">${g.emo}</div>
      <div class="info"><div class="gtitle">${g.title}</div><div class="gsub">${g.sub}</div></div>
      ${done ? '<div class="badge-done">✓</div>' : ''}
    </div>`;
  });
  html += '<div style="height:30px"></div>';
  return html;
}
function openSubject(subj){ state.currentSubject = subj; go('subjectList'); }

function renderSoon(){
  return `<div class="list-header"><button class="back-btn" onclick="go('home')">←</button></div>
  <div class="panel" style="margin:50px 16px; text-align:center;">
    <div style="font-size:56px;">${state.soonEmoji||'🚧'}</div>
    <div class="title-hero" style="font-size:19px;">${state.soonTitle||''}</div>
    <p style="color:var(--ink-soft); font-size:13.5px;">Bu bölüm yakında burada olacak! Şimdilik Matematik ve Türkçe maceralarına göz at. 🗺️</p>
    <button class="btn btn-teal" onclick="go('home')">Ana Sayfaya Dön</button>
  </div>`;
}
function openSoon(title, emo){ state.soonTitle = title; state.soonEmoji = emo; go('soon'); }

/* ===================== YÖNLENDİRME (ROUTER) ===================== */
function go(screen){
  /* ekran değişince eski form hatası ekranda kalmasın */
  if(screen !== state.screen) state.formError = '';
  state.screen = screen;
  state.friendModal = null;
  renderAll();
  window.scrollTo(0,0);
}
function renderAll(){
  const app = document.getElementById('app');
  if(!app) return;
  let html = '';
  switch(state.screen){
    case 'welcome': html = renderWelcome(); break;
    case 'login': html = renderLogin(); break;
    case 'register': html = renderRegister(); break;
    case 'home': html = renderHome() + renderBottomNav('home'); break;
    case 'account': html = renderAccount() + renderBottomNav('account'); break;
    case 'changePass': html = renderChangePass(); break;
    case 'settings': html = renderSettings() + renderBottomNav('settings'); break;
    case 'friends': html = renderFriends() + renderBottomNav('friends'); break;
    case 'subjectList': html = renderSubjectList(); break;
    case 'soon': html = renderSoon(); break;
    case 'gamePlayer': html = renderGamePlayerScreen(); break;
    default: html = '<p>?</p>';
  }
  app.innerHTML = html;
  if(state.friendModal){ app.innerHTML += renderFriendModal(state.friendModal); }
  if(state.confirmDelete){ app.innerHTML += renderDeleteConfirm(); }
}

/* ===================== BAŞLANGIÇ (INIT) ===================== */
/* Android'de "Ana ekrana ekle" ile tam ekran uygulama gibi kurulabilsin diye
   manifest'i dosyaya ihtiyaç duymadan çalışma anında üretiyoruz. */
function installManifest(){
  try{
    const icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23ffd7ea'/%3E%3Ctext x='256' y='350' font-size='280' text-anchor='middle'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E";
    const manifest = {
      name:'Macera Akademi', short_name:'Macera', lang:'tr',
      start_url:'.', scope:'.', display:'standalone', orientation:'portrait',
      background_color:'#ffd7ea', theme_color:'#ffd7ea',
      description:'1. sınıf matematik ve okuma-yazma için 70 eğitici mini oyun.',
      icons:[
        {src:icon, sizes:'192x192', type:'image/svg+xml', purpose:'any'},
        {src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any'},
        {src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'maskable'}
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  }catch(e){ /* manifest desteklenmiyorsa uygulama normal çalışmaya devam eder */ }
}
window.addEventListener('DOMContentLoaded', async ()=>{
  installManifest();
  renderSkyDecor();
  await loadState();
  go(state.loggedIn ? 'home' : 'welcome');
});
</script>
