<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Uzay Lazerleri — Phaser 3</title>
<script src="phaser.min.js"></script>
<script src="svgciz.js?s=11790b0a"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05070f; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  #oyun { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>

<body>
<div id="oyun"></div>
<script>
/* =====================================================================
   UZAY LAZERLERİ — Phaser 3   (mekanik: choiceQuestion · 58 oyun)
   ---------------------------------------------------------------------
   Kazanım: MAT.2.2.5 — Çarpma ve bölme işlemlerinin sonuçlarını
   muhakeme eder.

   NOT — mekanik tercihi:
   Uygulamadaki choiceQuestion oyunları "şıkka dokun" mantığındaydı.
   Burada test hissini tamamen kaldırdık: cevaplar uzayda süzülen
   meteorların üstünde yazıyor, çocuk gemiyle NİŞAN ALIP doğru meteoru
   vuruyor. Soru aynı, etkileşim bir arcade oyunu.

   Sahneler : Boot → Menu → Game → GameOver
   Fizik    : Arcade.
              · Mermi gerçek yerçekimiyle YAY çizerek uçar.
              · Nişan alırken bu yay noktalarla önceden gösterilir
                (aynı fizik formülüyle hesaplanır).
              · Meteorlar yerçekimsiz süzülür, duvarlardan seker.
              · Vurulan meteor parçalanır, kalanlar savrulur.
   Görsel   : Bütün dokular Graphics ile çalışma anında üretilir —
              uygulama çevrimdışı kabukta (APK / iOS) çalışacağı için
              dışarıdan resim çekilmiyor.
   ===================================================================== */

const EN = 480, BOY = 800;

const RENK = {
  uzayUst : 0x070c1e,
  uzayAlt : 0x172347,
  dogru   : 0x34c47b,
  yanlis  : 0xf07575,
  gemi    : 0xcfd9ea,
  gemiAlt : 0x7f8ea8,
  mermi   : 0x7fe7ff,
  kaya    : 0x7a6a5e,
  kayaAcik: 0x9c8a7b,
  vurgu   : 0xffd166
};

/* ---------------------------------------------------------------------
   İÇERİK — uygulamadaki v20 oyununun birebir aynısı.
   Başka bir choiceQuestion oyununa geçmek için yalnızca bu blok değişir.
   ------------------------------------------------------------------- */
/* ---------------- uygulama köprüsü ----------------
   Adres  lazer.html#oyun=m10  biçiminde; katalog verisi üst pencereden
   okunuyor. 55 choiceQuestion oyunu bu şablonla oynanıyor (içeriği SVG
   çizim olan 3 oyun uygulamanın kendi oynatıcısında kalıyor).           */
const KOPRU = (function(){
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const id = p.get('oyun');
    if (id && window.parent && window.parent !== window &&
        typeof window.parent.getGame === 'function'){
      const g = window.parent.getGame(id);
      if (g && g.cfg) return {
        oyun: g, cfg: g.cfg,
        bitir(mesaj, puan){ try{ window.parent.completeGame(mesaj || '', puan); }catch(e){} },
        /* Turun kendi metnini uygulamanın sesiyle okutur (Piper). */
        oku(metin){ try{ if (window.parent.oku) window.parent.oku(metin); }catch(e){} },
        /* Kaybetme ekranından: bu oyunu bırak, sıradakine geç. */
        atla(){ try{ if (window.parent.sonrakiOyunaGec) window.parent.sonrakiOyunaGec(); }catch(e){} }
      };
    }
  }catch(e){ /* çapraz kaynak engeli: tek başına oynanır */ }
  return null;
})();

/* HTML varlıklarını çöz: katalogda "Pay &lt; payda" gibi yazımlar var,
   çözülmezse ekranda "&lt;" olarak görünüyor ve öyle okunuyor. */
function varlikCoz(m){
  return String(m)
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
    .replace(/&hellip;/gi, '…').replace(/&mdash;/gi, '—').replace(/&ndash;/gi, '–')
    .replace(/&times;/gi, '×').replace(/&divide;/gi, '÷').replace(/&deg;/gi, '°')
    .replace(/&rarr;/gi, '→').replace(/&larr;/gi, '←')
    .replace(/&amp;/gi, '&');            /* en sona: çift çözmeyi önler */
}

function duzMetin(x){
  return varlikCoz(String(x == null ? '' : x).replace(/<br\s*\/?>/gi,' ')
    .replace(/<[^>]+>/g,'')).replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}

const VARSAYILAN = {
  instruction:'Doğru meteoru vur',
  steps:[
    { prompt:'Lazer: 3 × 5 = ?',
      options:[{label:'15',correct:true},{label:'8',correct:false},{label:'35',correct:false}] },
    { prompt:'Lazer: 20 ÷ 4 = ?',
      options:[{label:'5',correct:true},{label:'16',correct:false},{label:'24',correct:false}] },
    { prompt:'Lazer: 4 × 4 = ?',
      options:[{label:'16',correct:true},{label:'8',correct:false},{label:'12',correct:false}] },
    { prompt:'5 × 2 ile 2 × 5 aynı sonucu verir mi?',
      options:[{label:'Evet, ikisi de 10',correct:true},{label:'Hayır, farklı',correct:false},
               {label:'Bilinemez',correct:false}] }
  ]
};

const CFG = KOPRU ? KOPRU.cfg : VARSAYILAN;

/* Görsel alanı katalogda "svg", "emoji" ya da "label" olabiliyor. */
function svgAl(o){
  if (!o || !window.SVGCIZ) return null;
  const alanlar = ['svg', 'emoji', 'label', 'prompt'];
  for (let i = 0; i < alanlar.length; i++)
    if (SVGCIZ.svgMi(o[alanlar[i]])) return o[alanlar[i]];
  return null;
}

const ADIMLAR = (CFG.steps || []).filter(a => a && a.options).map(a => ({
  soru: duzMetin(a.prompt),
  /* Şekil sorularında seçenek satır içi SVG (ör. aynadaki yansıma).
     Metne çevirince seçenekler ayırt edilemez oluyordu; artık çiziliyor. */
  soruCizim: svgAl({ prompt:a.prompt }),
  secenekler: a.options.filter(Boolean).map(o => {
    const cizim = svgAl(o);
    return { etiket: cizim ? SVGCIZ.metinAyikla(o.label) : duzMetin(o.label),
             cizim: cizim, dogru: !!o.correct };
  }),
  ipucu: duzMetin(a.hint)
}));

const OYUN_ADI = KOPRU ? duzMetin(KOPRU.oyun.title) : 'UZAY LAZERLERİ';
const OYUN_EMO = KOPRU ? (KOPRU.oyun.emo || '🛸') : '🛸';
const TALIMAT  = duzMetin(CFG.instruction) || 'Doğru meteoru vur';
const IPUCU    = duzMetin(CFG.tip) || 'Gemiyi çek, bırak — lazer yay çizerek uçar.';
const BASARI   = duzMetin(CFG.successMsg) || 'Hepsini doğru vurdun!';

const CAN_SAYISI = 3;

/* --- Yerleşim ve tempo ---------------------------------------------- */
const METEOR_UST  = 236;   /* meteorların süzüldüğü alan */
const METEOR_ALT   = 486;
const GEMI_Y       = 700;
/* Meteor bandının üst köşeleri (y=236, x=40/440) gemiden 464 px yukarıda.
   720 px/sn sınırıyla oraya ancak KUSURSUZ, tam güçlü ve yavaş bir lob
   atışıyla ulaşılıyordu — 1. sınıf çocuğu için yapılamaz. Ölçüm: m38 ve
   m61'de gereken hız 717 ve 709, yani sınırın dibinde.
   Güç yükseltildi ve yerçekimi düşürüldü: atışlar daha düz, nişan çizgisi
   daha bağışlayıcı; mekanik (sapan gibi çek-bırak) aynı kalıyor. */
const AZAMI_GUC    = 900;  /* merminin azami çıkış hızı (px/sn) */
const GUC_KATSAYI  = 6.0;  /* çekme mesafesi → hız (150 px çekiş tam güç) */

/* =====================================================================
   1) BOOT — dokuları üret
   ===================================================================== */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }

  create(){
    this.dokuKivilcim();
    this.dokuToz();
    this.dokuGemi();
    this.dokuMermi();
    this.dokuMeteor();
    /* Uygulama içinde çocuk oyunu listeden zaten seçti; menüyü atla. */
    this.scene.start(KOPRU ? 'Game' : 'Menu');
  }

  dokuKivilcim(){
    const g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1);
    g.fillCircle(8, 8, 8);
    g.generateTexture('kivilcim', 16, 16);
    g.destroy();
  }

  dokuToz(){
    const g = this.make.graphics({ add:false });
    for (let r = 14; r > 0; r--){
      g.fillStyle(0xffffff, 0.06);
      g.fillCircle(14, 14, r);
    }
    g.generateTexture('toz', 28, 28);
    g.destroy();
  }

  /* Uçan daire biçiminde uzay gemisi */
  dokuGemi(){
    const W = 104, H = 62;
    const g = this.make.graphics({ add:false });
    const mx = W / 2;

    /* alt gövde */
    g.fillStyle(RENK.gemiAlt, 1);
    g.fillEllipse(mx, 44, 96, 26);
    /* ana disk */
    g.fillStyle(RENK.gemi, 1);
    g.fillEllipse(mx, 36, 100, 24);
    /* kubbe */
    g.fillStyle(0x4a7fd6, 1);
    g.beginPath();
    g.arc(mx, 34, 26, Phaser.Math.DegToRad(180), Phaser.Math.DegToRad(360), false);
    g.closePath(); g.fillPath();
    g.fillStyle(0x9fd0ff, 1);
    g.beginPath();
    g.arc(mx, 34, 18, Phaser.Math.DegToRad(180), Phaser.Math.DegToRad(360), false);
    g.closePath(); g.fillPath();
    g.fillStyle(0xffffff, 0.75);
    g.fillEllipse(mx - 7, 24, 12, 7);

    /* yan ışıklar */
    g.fillStyle(RENK.vurgu, 1);
    g.fillCircle(mx - 38, 38, 4);
    g.fillCircle(mx,      40, 4);
    g.fillCircle(mx + 38, 38, 4);

    /* lazer namlusu */
    g.fillStyle(0x5f7089, 1);
    g.fillRoundedRect(mx - 6, 6, 12, 16, 4);

    g.generateTexture('gemi', W, H);
    g.destroy();
  }

  /* Enerji topu */
  dokuMermi(){
    const R = 13;
    const g = this.make.graphics({ add:false });
    g.fillStyle(RENK.mermi, 0.30); g.fillCircle(R, R, R);
    g.fillStyle(RENK.mermi, 0.65); g.fillCircle(R, R, R - 4);
    g.fillStyle(0xffffff, 1);      g.fillCircle(R, R, R - 8);
    g.generateTexture('mermi', R * 2, R * 2);
    g.destroy();
  }

  /* Kayalık meteor — üstüne cevap yazılacak */
  dokuMeteor(){
    const R = 42, W = R * 2, H = R * 2;
    const g = this.make.graphics({ add:false });

    /* düzensiz kaya gövdesi */
    g.fillStyle(RENK.kaya, 1);
    g.beginPath();
    for (let i = 0; i <= 14; i++){
      const a = Phaser.Math.PI2 * i / 14;
      const r = R - 3 - (i % 3) * 4;
      const x = R + Math.cos(a) * r, y = R + Math.sin(a) * r;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath(); g.fillPath();

    /* aydınlık taraf */
    g.fillStyle(RENK.kayaAcik, 1);
    g.fillCircle(R - 11, R - 12, 15);
    g.fillCircle(R + 9, R - 17, 8);

    /* kraterler */
    g.fillStyle(0x5d5048, 1);
    g.fillCircle(R + 15, R + 9, 8);
    g.fillCircle(R - 17, R + 15, 5);
    g.fillCircle(R + 2, R + 22, 4);

    g.generateTexture('meteor', W, H);
    g.destroy();
  }
}

/* =====================================================================
   Ortak yardımcılar
   ===================================================================== */
function uzayCiz(sc){
  const g = sc.add.graphics();
  g.fillGradientStyle(RENK.uzayUst, RENK.uzayUst, RENK.uzayAlt, RENK.uzayAlt, 1);
  g.fillRect(0, 0, EN, BOY);

  for (let i = 0; i < 54; i++){
    const s = sc.add.circle(
      Phaser.Math.Between(4, EN - 4),
      Phaser.Math.Between(4, BOY - 4),
      Phaser.Math.FloatBetween(1, 2.3),
      0xffffff,
      Phaser.Math.FloatBetween(0.2, 0.9)
    );
    sc.tweens.add({
      targets:s, alpha:0.06,
      duration:Phaser.Math.Between(800, 2400),
      yoyo:true, repeat:-1, delay:Phaser.Math.Between(0, 1800)
    });
  }
  return g;
}

function dugmeYap(sc, x, y, metin, renk, geriCagri){
  const c = sc.add.container(x, y);
  const g = sc.add.graphics();
  g.fillStyle(renk, 1);
  g.fillRoundedRect(-140, -30, 280, 60, 30);
  g.fillStyle(0xffffff, 0.16);
  g.fillRoundedRect(-140, -30, 280, 24, { tl:30, tr:30, bl:0, br:0 });
  const t = sc.add.text(0, 0, metin, {
    fontFamily:'system-ui, sans-serif', fontSize:'25px',
    fontStyle:'bold', color:'#ffffff'
  }).setOrigin(0.5);
  c.add([g, t]);
  c.setSize(280, 60).setInteractive({ useHandCursor:true });
  c.on('pointerover', () => sc.tweens.add({ targets:c, scale:1.05, duration:110 }));
  c.on('pointerout',  () => sc.tweens.add({ targets:c, scale:1.00, duration:110 }));
  c.on('pointerdown', () => sc.tweens.add({
    targets:c, scale:0.93, duration:90, yoyo:true, onComplete:geriCagri
  }));
  return c;
}

/* =====================================================================
   2) MENU
   ===================================================================== */
class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }

  create(){
    uzayCiz(this);

    const m = this.add.image(EN / 2 + 96, 168, 'meteor').setScale(0.8);
    this.tweens.add({ targets:m, angle:360, duration:11000, repeat:-1, ease:'Linear' });

    const gemi = this.add.image(EN / 2 - 40, 214, 'gemi');
    this.tweens.add({
      targets:gemi, y:200, duration:1600,
      yoyo:true, repeat:-1, ease:'Sine.easeInOut'
    });

    const baslik = this.add.text(EN / 2, 336, OYUN_ADI, {
      fontFamily:'system-ui, sans-serif', fontSize:'44px', fontStyle:'bold',
      color:'#ffffff', align:'center', lineSpacing:6
    }).setOrigin(0.5);
    this.tweens.add({
      targets:baslik, scale:1.04, duration:1400,
      yoyo:true, repeat:-1, ease:'Sine.easeInOut'
    });

    this.add.text(EN / 2, 430, TALIMAT, {
      fontFamily:'system-ui, sans-serif', fontSize:'24px',
      color:'#cfe0ff', align:'center'
    }).setOrigin(0.5);

    const kart = this.add.graphics();
    kart.fillStyle(0x0a1330, 0.9);
    kart.fillRoundedRect(32, 468, EN - 64, 76, 16);
    kart.lineStyle(2, 0x3b4d86, 1);
    kart.strokeRoundedRect(32, 468, EN - 64, 76, 16);
    this.add.text(EN / 2, 506, IPUCU, {
      fontFamily:'system-ui, sans-serif', fontSize:'19px', fontStyle:'bold',
      color:'#ffd166', align:'center', wordWrap:{ width:EN - 96 }, lineSpacing:4
    }).setOrigin(0.5);

    dugmeYap(this, EN / 2, 616, '▶  BAŞLA', RENK.dogru, () => this.scene.start('Game'));

    this.add.text(EN / 2, 722, `${ADIMLAR.length} lazer  ·  ${CAN_SAYISI} can`, {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', color:'#9fc2e6'
    }).setOrigin(0.5);
  }
}

/* =====================================================================
   3) GAME
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    this.can     = CAN_SAYISI;
    this.puan    = 0;
    this.seri    = 0;
    this.adim    = 0;
    this.kilit   = false;
    this.nisanda = false;
    this.mermi   = null;

    uzayCiz(this);

    this.kivilcimlar = this.add.particles(0, 0, 'kivilcim', {
      speed:{ min:140, max:400 }, angle:{ min:0, max:360 },
      scale:{ start:0.9, end:0 }, alpha:{ start:1, end:0 },
      lifespan:650, blendMode:'ADD', emitting:false
    }).setDepth(90);

    this.tozlar = this.add.particles(0, 0, 'toz', {
      speed:{ min:40, max:170 }, angle:{ min:0, max:360 },
      scale:{ start:1.1, end:2.4 }, alpha:{ start:0.5, end:0 },
      lifespan:700, emitting:false
    }).setDepth(80);

    /* merminin izi */
    this.iz = this.add.particles(0, 0, 'kivilcim', {
      speed:0, scale:{ start:0.5, end:0 }, alpha:{ start:0.7, end:0 },
      lifespan:280, frequency:22, tint:RENK.mermi, emitting:false
    }).setDepth(24);

    this.sinirlariKur();
    this.gemiKur();
    this.arayuzKur();
    this.nisanKur();

    this.meteorlar = this.physics.add.group();
    this.mermiler  = this.physics.add.group();
    this.physics.add.collider(this.meteorlar, this.duvarlar);
    /* Meteorlar birbirinden de sekiyor: şekil çizimli seçenekler yazıdan
       geniş olduğu için süzülürken üst üste biniyor, hangi kayaya
       nişan alındığı belirsizleşiyordu. */
    this.physics.add.collider(this.meteorlar, this.meteorlar);
    this.physics.add.overlap(this.mermiler, this.meteorlar, this.meteoraCarpti, null, this);

    this.adimiKur();
  }

  /* ---------- meteor alanının görünmez duvarları ---------- */
  sinirlariKur(){
    /* NOT: Phaser'da collider/overlap(grup, TEK nesne) çağrılırsa
       callback'e parametreler TERS gelir — (tekNesne, grupElemanı).
       Bu yüzden engeller staticGroup içinde tutuluyor. */
    this.duvarlar = this.physics.add.staticGroup();
    this.duvarlar.add(this.add.rectangle(-9,     BOY / 2, 18, BOY, 0, 0));
    this.duvarlar.add(this.add.rectangle(EN + 9, BOY / 2, 18, BOY, 0, 0));
    this.duvarlar.add(this.add.rectangle(EN / 2, METEOR_UST - 9, EN, 18, 0, 0));
    this.duvarlar.add(this.add.rectangle(EN / 2, METEOR_ALT + 9, EN, 18, 0, 0));
  }

  /* ---------- gemi ---------- */
  gemiKur(){
    this.gemi = this.add.image(EN / 2, GEMI_Y, 'gemi').setDepth(20);
    this.tweens.add({
      targets:this.gemi, y:GEMI_Y - 9, duration:1700,
      yoyo:true, repeat:-1, ease:'Sine.easeInOut'
    });

    /* nişan çizgisi ve yol noktaları */
    this.nisanCizgi = this.add.graphics().setDepth(22);
    this.yolNoktalari = [];
    for (let i = 0; i < 16; i++){
      const n = this.add.circle(0, 0, 4.5, RENK.vurgu, 0.9).setDepth(21).setVisible(false);
      this.yolNoktalari.push(n);
    }
  }

  /* ---------- nişan alma (çek–bırak) ---------- */
  nisanKur(){
    this.input.on('pointerdown', (p) => {
      if (this.kilit || this.mermi) return;
      this.nisanda = true;
      this.nisanNoktasi = imlec(p);
    });

    this.input.on('pointermove', (p) => {
      if (!this.nisanda) return;
      this.nisanNoktasi = imlec(p);
      this.nisaniCiz();
    });

    this.input.on('pointerup', () => {
      if (!this.nisanda) return;
      this.nisanda = false;
      this.nisaniGizle();
      const h = this.cikisHizi();
      if (h) this.atesEt(h);
    });
  }

  /* Çekme vektöründen çıkış hızını hesapla.
     Sapan gibi: gemiden PARMAĞA doğru olan yön ateş yönüdür. */
  cikisHizi(){
    if (!this.nisanNoktasi) return null;
    const dx = this.nisanNoktasi.x - this.gemi.x;
    const dy = this.nisanNoktasi.y - this.gemi.y;
    const uz = Math.hypot(dx, dy);
    if (uz < 26) return null;                 /* kazara dokunma */
    const guc = Math.min(uz * GUC_KATSAYI, AZAMI_GUC);
    return { x: dx / uz * guc, y: dy / uz * guc };
  }

  /* Nişan yolunu merminin gerçek fiziğiyle hesaplayıp göster.
     Aynı yerçekimi kullanıldığı için gösterilen yol ile merminin
     gittiği yol birebir aynı olur. */
  nisaniCiz(){
    const h = this.cikisHizi();
    this.nisanCizgi.clear();
    if (!h){ this.yolNoktalari.forEach(n => n.setVisible(false)); return; }

    const yc = this.physics.world.gravity.y;
    let x = this.gemi.x, y = this.gemi.y - 24;
    let vx = h.x, vy = h.y;
    const dt = 0.055;

    this.yolNoktalari.forEach((n, i) => {
      for (let k = 0; k < 2; k++){
        vy += yc * dt;
        x  += vx * dt;
        y  += vy * dt;
      }
      const gorunur = y > 0 && y < BOY && x > 0 && x < EN;
      n.setPosition(x, y).setVisible(gorunur)
       .setAlpha(0.95 - i * 0.045).setScale(1 - i * 0.038);
    });

    /* geriye çekme lastiği */
    this.nisanCizgi.lineStyle(3, RENK.vurgu, 0.5);
    this.nisanCizgi.lineBetween(this.gemi.x, this.gemi.y - 24,
                                this.nisanNoktasi.x, this.nisanNoktasi.y);
  }

  nisaniGizle(){
    this.nisanCizgi.clear();
    this.yolNoktalari.forEach(n => n.setVisible(false));
  }

  /* ---------- ateş ---------- */
  atesEt(h){
    const m = this.physics.add.image(this.gemi.x, this.gemi.y - 24, 'mermi').setDepth(25);
    this.mermiler.add(m);
    m.body.setCircle(13);
    m.body.setAllowGravity(true);
    m.body.setVelocity(h.x, h.y);
    this.mermi = m;

    this.iz.startFollow(m);
    this.iz.start();

    /* geri tepme */
    this.tweens.add({
      targets:this.gemi, scaleX:1.14, scaleY:0.86,
      duration:100, yoyo:true, ease:'Quad.easeOut'
    });
    this.kivilcimlar.setParticleTint(RENK.mermi);
    this.kivilcimlar.explode(8, this.gemi.x, this.gemi.y - 24);
  }

  mermiyiTemizle(){
    this.iz.stop();
    if (this.mermi){
      this.mermi.destroy();
      this.mermi = null;
    }
  }

  /* ---------- adım (soru) kurulumu ---------- */
  adimiKur(){
    const a = ADIMLAR[this.adim];
    this.soruYazi.setFontSize(a.soru.length > 96 ? 19 : (a.soru.length > 52 ? 20 : 24));
    this.soruYazi.setText(a.soru);

    /* Soru bir şekil içeriyorsa (ör. "bu şeklin aynadaki yansıması hangisi?")
       şekli sorunun altına çiz — yoksa soru neyi sorduğu belirsiz kalıyor. */
    if (this.soruCizimi){ this.soruCizimi.destroy(); this.soruCizimi = null; }
    if (a.soruCizim){
      /* Soru panelinin ALTINA yerleşsin: panel yazıdan taşkın olduğu için
         yazının bitişine plakanın yarısı + pay ekleniyor. */
      const cBoy = 74;
      this.soruCizimi = SVGCIZ.ciz(this, a.soruCizim,
        EN / 2, this.soruYazi.y + this.soruYazi.height + 18 + cBoy / 2, cBoy,
        { metin:false, zemin:true, pay:6 }).setDepth(61);
    }
    this.tweens.add({
      targets:this.soruYazi, scale:{ from:0.85, to:1 }, duration:300, ease:'Back.easeOut'
    });

    const secenekler = Phaser.Utils.Array.Shuffle(a.secenekler.slice());
    const n = secenekler.length;

    /* Seçenek etiketi 1 karakterlik sayıdan 96 karakterlik cümleye kadar
       gidiyor. Kısa seçenekler yan yana süzülüyor; uzun cümleler yan yana
       sığmadığı için meteorlar alt alta diziliyor. */
    const uzunMu = Math.max.apply(null, secenekler.map(s => s.etiket.length)) > 20;
    const sarma  = uzunMu ? 250 : 96;
    /* soru metninin altından başla — uzun soru meteor alanını daraltıyor */
    const soruAlt = this.soruYazi.y + this.soruYazi.height
      + (this.soruCizimi ? 18 + this.soruCizimi.height + 8 : 0);
    const bantUst = Math.max(METEOR_UST, soruAlt + 12);
    const bantBoy = Math.max(96, (METEOR_ALT - 6) - bantUst);
    const ARA = 18;          /* şeritler arası boşluk: kutular değmesin */

    /* ALT ALTA DİZİLİŞTE ÖNCE ÖLÇ, SONRA ÇİZ
       Üç uzun seçeneğin toplam yüksekliği kullanılabilir alandan büyük
       olabiliyor (251 px metin / 200 px alan); o zaman üçüncüsü alt duvara
       çarpıp dikey hız kazanıyor ve komşu şeride giriyordu. Şerit yüksekliği
       alandan hesaplanıyor, punto da o şeride sığacak şekilde seçiliyor. */
    let punto = uzunMu ? 15 : 21;
    let seritBoyu = 0;
    if (uzunMu){
      seritBoyu = Math.floor((bantBoy - ARA * (n - 1)) / n);
      while (punto > 9){
        let sigar = true;
        secenekler.forEach(sc => {
          const o = this.add.text(0, 0, sc.etiket, {
            fontFamily:'system-ui, sans-serif', fontSize:punto + 'px', fontStyle:'bold',
            align:'center', wordWrap:{ width:sarma }, lineSpacing:2
          }).setVisible(false);
          if (o.height + 16 > seritBoyu) sigar = false;
          o.destroy();
        });
        if (sigar) break;
        punto -= 1;
      }
    }

    const yerlesenler = [];
    secenekler.forEach((s, i) => {
      let x, y;
      if (uzunMu){
        x = EN / 2;
        y = bantUst + bantBoy * (i + 0.5) / n;   /* gerçek yer aşağıda hesaplanır */
      } else {
        /* Yan yana dizilişte de rastgele kayma kutuları çakıştırabiliyordu;
           kayma payı pay genişliğine göre sınırlanıyor. */
        const pay = EN / n;
        const kayma = Math.min(14, Math.max(0, (pay - 96) / 2));
        x = pay * (i + 0.5) + Phaser.Math.Between(-kayma, kayma);
        y = bantUst + Phaser.Math.Between(40, Math.max(44, bantBoy - 40));
      }
      const c = this.add.container(x, y).setDepth(18);

      const res = this.add.image(0, 0, 'meteor');
      /* Seçenek bir şekil çizimiyse kaya üstünde açık plakayla gösteriliyor:
         katalog SVG'leri açık zemin için renklendirilmiş, koyu kayada
         görünmüyorlar. */
      const yazi = s.cizim
        ? SVGCIZ.ciz(this, s.cizim, 0, 0, uzunMu ? Math.min(64, seritBoyu - 12) : 62,
                     { metin:false, zemin:true, pay:5 })
        : this.add.text(0, 0, s.etiket, {
            fontFamily:'system-ui, sans-serif', fontSize:punto + 'px', fontStyle:'bold',
            color:'#ffffff', align:'center', wordWrap:{ width:sarma }, lineSpacing:2,
            stroke:'#2a2018', strokeThickness:4
          }).setOrigin(0.5);
      /* Meteoru yazının hem enine hem boyuna göre büyüt — uzun
         seçeneklerde metin kayanın dışına taşıyordu. Alt alta dizilişte
         yükseklik şeride sabitlenir (dokunun en-boy oranı bırakılır). */
      const gx = Math.max(1, (yazi.width  + 30) / 84);
      const gy = uzunMu ? (seritBoyu / 84) : Math.max(1, (yazi.height + 26) / 84);
      res.setScale(gx, gy);

      c.add([res, yazi]);
      /* ÇARPIŞMA KUTUSU: kaya görseli köşelerinde saydam pay bırakan
         diyagonal bir şekil; gövdeyi görselin tamamı kadar yaparsak
         komşu kayaların kutuları üst üste biniyor ve doğru kayaya
         vurulsa bile mermi önce komşunun kutusuna değebiliyordu.
         Gövde artık YAZIYA göre, kenarlarda 6 px pay bırakılarak
         kuruluyor — kutular birbirine değmiyor. */
      const CW = Math.round(Math.min(78 * gx, yazi.width + 16));
      const CH = Math.round(Math.min(84 * gy, yazi.height + 12));
      c.setSize(CW, CH);

      /* Arcade gövdesi — gruba ÖNCE ekle (grup add() sırasında kendi
         varsayılanlarını gövdeye basıyor). Container gövdesi zaten
         container orijininde merkezlenir; setOffset verilmez. */
      this.meteorlar.add(c);
      c.body.setSize(CW, CH);
      c.body.setAllowGravity(false);
      c.body.setBounce(1, 1);
      /* Alt alta dizilen büyük meteorlar dikey süzülürse komşu şeride
         girip üst üste biniyor; bu yüzden yalnızca yatay kayıyorlar. */
      if (uzunMu){
        c.body.setVelocity(Phaser.Math.Between(-14, 14) || 9, 0);
      } else {
        c.body.setVelocity(
          Phaser.Math.Between(-46, 46) || 30,
          Phaser.Math.Between(-30, 30) || 22
        );
      }

      c.setData('dogru', s.dogru);
      c.setData('etiket', s.etiket);
      c.setData('vuruldu', false);

      /* ŞERİT DÜZENİNDE NİŞAN ALMAK GEOMETRİK OLARAK İMKÂNSIZ.
         Uzun seçenekler 250 px genişliğinde şeritler hâlinde alt alta
         diziliyor; gemi en altta. Üst şeritteki doğru cevaba giden her
         yol alttaki yanlış şeritten geçiyor — ölçümde m61'de tek bir
         temiz atış bulunamadı. Bu düzende çocuk hedefe DOKUNUYOR,
         gemi oraya lazer gönderiyor; sapan nişanı küçük kayalarda kalıyor. */
      if (uzunMu){
        c.setSize(CW + 16, CH + 16);
        c.setInteractive({ useHandCursor:true });
        c.on('pointerdown', () => this.hedefeKilitlen(c));
      }

      this.tweens.add({
        targets:res, angle:Phaser.Math.Between(-360, 360),
        duration:Phaser.Math.Between(9000, 15000), repeat:-1, ease:'Linear'
      });

      yerlesenler.push(c);
    });

    /* İKİ GEÇİŞLİ YERLEŞİM — meteorun yüksekliği ancak yazı ölçüldükten
       sonra bilindiği için şeritler burada hesaplanıyor. Eşit aralık
       varsaymak 79 px'lik meteorları 83 px aralığa sıkıştırıp bindiriyordu. */
    if (uzunMu){
      let y = bantUst;
      yerlesenler.forEach(c => {
        c.y = y + seritBoyu / 2;
        c.body.reset(c.x, c.y);            /* gövde de yeni yere taşınsın */
        c.body.setVelocity(Phaser.Math.Between(-30, 30) || 20, 0);
        c.setData('serit', true);          /* dikey dürtmeden muaf */
        y += seritBoyu + ARA;
      });
    }

    this.arayuzuTazele();
  }

  meteorlariTemizle(){
    this.meteorlar.getChildren().slice().forEach(m => m.destroy());
  }

  /* ---------- çarpışma ---------- */
  /* Dokunulan hedefe lazer gönder: mermi fiziği yerine doğrudan ışın.
     Sonuç yolu (doğru/yanlış) atışla aynı. */
  hedefeKilitlen(meteor){
    if (this.kilit || this.mermi || meteor.getData('vuruldu')) return;
    this.kilit = true;
    const isin = this.add.graphics().setDepth(30);
    isin.lineStyle(6, 0x9ef0ff, 0.95);
    isin.beginPath();
    isin.moveTo(this.gemi.x, this.gemi.y - 24);
    isin.lineTo(meteor.x, meteor.y);
    isin.strokePath();
    this.kivilcimlar.setParticleTint(RENK.mermi);
    this.kivilcimlar.explode(10, meteor.x, meteor.y);
    this.cameras.main.flash(90, 120, 220, 255);
    this.tweens.add({
      targets: isin, alpha: 0, duration: 260,
      onComplete: () => {
        isin.destroy();
        meteor.setData('vuruldu', true);
        this.kilit = false;
        if (meteor.getData('dogru')) this.dogru(meteor);
        else                         this.yanlis(meteor);
      }
    });
  }

  meteoraCarpti(mermi, meteor){
    /* Örtüşme her karede tetiklenir; meteor başına tek sonuç. */
    if (this.kilit) return;

    /* Kutular yine de teğet geçerse (uzun metinli kayalar iri oluyor)
       merminin MERKEZİNE en yakın kayayı vurulmuş sayıyoruz — çocuk
       doğru kayaya nişan aldığında komşusu sayılmıyor. */
    let hedef = meteor, enAz = Number.MAX_VALUE;
    this.meteorlar.getChildren().forEach(m => {
      if (!m.body || m.getData('vuruldu')) return;
      const kutu = m.body;
      const yakinX = Phaser.Math.Clamp(mermi.x, kutu.left, kutu.right);
      const yakinY = Phaser.Math.Clamp(mermi.y, kutu.top, kutu.bottom);
      const d = Phaser.Math.Distance.Between(mermi.x, mermi.y, yakinX, yakinY);
      if (d < enAz){ enAz = d; hedef = m; }
    });
    if (hedef.getData('vuruldu')) return;
    hedef.setData('vuruldu', true);

    if (hedef.getData('dogru')) this.dogru(hedef);
    else                        this.yanlis(hedef);
  }

  dogru(meteor){
    this.kilit = true;
    this.mermiyiTemizle();

    this.seri++;
    const kazanc = 100 + (this.seri - 1) * 25;
    this.puan += kazanc;
    this.adim++;

    const mx = meteor.x, my = meteor.y;

    this.kivilcimlar.setParticleTint(RENK.dogru);
    this.kivilcimlar.explode(34, mx, my);
    this.tozlar.explode(14, mx, my);
    this.cameras.main.shake(180, 0.008);
    this.cameras.main.flash(140, 80, 210, 140);
    meteor.destroy();

    /* kalan meteorlar savrulsun */
    this.meteorlar.getChildren().forEach(m => {
      if (!m.body) return;
      m.body.setVelocity(Phaser.Math.Between(-260, 260), Phaser.Math.Between(-260, 260));
    });

    this.puanYazi.setText('Puan ' + this.puan);
    this.tweens.add({
      targets:this.puanYazi, scale:1.55, duration:140, yoyo:true, ease:'Back.easeOut'
    });

    const ucan = this.add.text(mx, my, '+' + kazanc, {
      fontFamily:'system-ui, sans-serif', fontSize:'33px', fontStyle:'bold',
      color:'#7ce0a3'
    }).setOrigin(0.5).setDepth(95);
    this.tweens.add({
      targets:ucan, y:ucan.y - 80, alpha:0, scale:1.25,
      duration:800, ease:'Cubic.easeOut', onComplete:() => ucan.destroy()
    });

    if (this.seri >= 2) this.seriGoster();
    this.arayuzuTazele();

    this.time.delayedCall(800, () => {
      this.meteorlariTemizle();
      if (this.adim >= ADIMLAR.length){
        this.bitir(true);
      } else {
        this.kilit = false;
        this.adimiKur();
      }
    });
  }

  yanlis(meteor){
    this.seri = 0;
    this.can--;
    this.arayuzuTazele();
    this.mermiyiTemizle();

    /* GERÇEK FİZİK: vurulan yanlış meteor savrulup geri gelir */
    if (meteor.body){
      meteor.body.setVelocity(Phaser.Math.Between(-300, 300), Phaser.Math.Between(-260, -120));
    }
    this.tozlar.explode(18, meteor.x, meteor.y);
    this.cameras.main.shake(240, 0.013);
    this.cameras.main.flash(180, 220, 90, 90);

    this.tweens.add({
      targets:this.canYazi, angle:{ from:-12, to:12 },
      duration:70, yoyo:true, repeat:3,
      onComplete:() => this.canYazi.setAngle(0)
    });

    this.mesajGoster(ADIMLAR[this.adim].ipucu, '#b5453b');

    /* aynı meteor yeniden vurulabilsin */
    this.time.delayedCall(700, () => {
      if (meteor.active) meteor.setData('vuruldu', false);
    });

    if (this.can <= 0){
      this.kilit = true;
      this.time.delayedCall(800, () => this.bitir(false));
    }
  }

  seriGoster(){
    this.seriYazi.setText('🔥 ' + this.seri + ' SERİ!').setAlpha(1).setScale(0.6);
    this.tweens.add({ targets:this.seriYazi, scale:1, duration:220, ease:'Back.easeOut' });
    this.tweens.add({ targets:this.seriYazi, alpha:0, delay:900, duration:400 });
  }

  mesajGoster(metin, arka){
    if (this.mesaj) this.mesaj.destroy();
    this.mesaj = this.add.text(EN / 2, METEOR_ALT + 62, metin, {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', fontStyle:'bold',
      color:'#ffffff', backgroundColor:arka,
      padding:{ x:14, y:9 }, align:'center', wordWrap:{ width:EN - 70 }
    }).setOrigin(0.5).setDepth(96).setAlpha(0);
    const t = this.mesaj;
    this.tweens.add({ targets:t, alpha:1, duration:150 });
    this.time.delayedCall(1700, () => {
      if (!t.active) return;
      this.tweens.add({
        targets:t, alpha:0, duration:250,
        onComplete:() => { if (this.mesaj === t) this.mesaj = null; t.destroy(); }
      });
    });
  }

  /* ---------- arayüz ---------- */
  arayuzKur(){
    /* Katalogda yönerge 120 karaktere çıkıyor; sabit yükseklikli şerit
       yazıyı iki yandan kesiyordu. Şerit metnin gerçek boyuna göre. */
    const yon = this.add.text(EN / 2, 24, OYUN_EMO + '  ' + TALIMAT, {
      fontFamily:'system-ui, sans-serif',
      fontSize: (TALIMAT.length > 92 ? '16px' : (TALIMAT.length > 54 ? '17px' : '20px')),
      fontStyle:'bold', color:'#ffffff', align:'center',
      wordWrap:{ width:EN - 52 }, lineSpacing:3
    }).setOrigin(0.5, 0).setDepth(61);

    const seritBoy = Math.max(104, yon.height + 66);
    const serit = this.add.graphics().setDepth(60);
    serit.fillStyle(0x060b1c, 0.97);
    serit.fillRoundedRect(10, 10, EN - 20, seritBoy, 18);
    yon.setDepth(61);
    this.seritAlt = 10 + seritBoy;

    const satirY = this.seritAlt - 24;
    this.puanYazi = this.add.text(30, satirY, 'Puan 0', {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0, 0.5).setDepth(61);

    this.canYazi = this.add.text(EN - 30, satirY, '', { fontSize:'20px' })
      .setOrigin(1, 0.5).setDepth(61);

    this.ilerlemeYazi = this.add.text(EN / 2, satirY, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'19px', fontStyle:'bold',
      color:'#8fb6d8'
    }).setOrigin(0.5).setDepth(61);

    /* soru paneli */
    const panel = this.add.graphics().setDepth(59);
    panel.fillStyle(0x0a1330, 0.95);
    panel.fillRoundedRect(18, 130, EN - 36, 76, 14);
    panel.lineStyle(2, 0x4a7fd6, 1);
    panel.strokeRoundedRect(18, 130, EN - 36, 76, 14);

    /* Soru 17–135 karakter arasında; yazı uzunlukla küçülüyor ve şeridin
       hemen altından başlayıp meteor alanına girmiyor. */
    this.soruYazi = this.add.text(EN / 2, this.seritAlt + 8, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'24px', fontStyle:'bold',
      color:'#ffffff', align:'center', wordWrap:{ width:EN - 52 }, lineSpacing:3
    }).setOrigin(0.5, 0).setDepth(61);

    this.seriYazi = this.add.text(EN / 2, 224, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'26px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0.5).setDepth(62).setAlpha(0);

    this.arayuzuTazele();
  }

  arayuzuTazele(){
    this.canYazi.setText(
      '❤️'.repeat(Math.max(0, this.can)) +
      '🖤'.repeat(Math.max(0, CAN_SAYISI - this.can))
    );
    this.ilerlemeYazi.setText(`${this.adim} / ${ADIMLAR.length}`);
  }

  bitir(kazandi){
    /* Uygulama içindeyken kazanma ekranını uygulama gösteriyor: XP, altın,
       kutlama ve sıradaki oyuna otomatik geçiş onun akışında. */
    if (kazandi && KOPRU){ KOPRU.bitir(BASARI, this.puan); return; }
    this.scene.start('GameOver', {
      kazandi, puan:this.puan, can:this.can,
      adim:this.adim, toplam:ADIMLAR.length
    });
  }

  /* ---------- her kare ---------- */
  update(){
    /* ekrandan çıkan mermiyi temizle — yenisi atılabilsin */
    if (this.mermi){
      const m = this.mermi;
      if (!m.active || m.y > BOY + 40 || m.y < -200 || m.x < -40 || m.x > EN + 40){
        this.mermiyiTemizle();
      }
    }

    if (this.kilit) return;

    /* Meteor bir köşede takılmasın. Alt alta dizilen uzun seçenekler
       şeride sabitlendiği için dikey dürtme onlara uygulanmıyor —
       uygulanınca komşu şeride girip üst üste biniyorlardı. */
    this.meteorlar.getChildren().forEach(m => {
      if (!m.body) return;
      const v = m.body.velocity;
      if (Math.abs(v.x) < 14) m.body.setVelocityX(v.x >= 0 ? 34 : -34);
      if (m.getData('serit')) { m.body.setVelocityY(0); return; }
      if (Math.abs(v.y) < 11) m.body.setVelocityY(v.y >= 0 ? 26 : -26);
    });
  }
}

/* =====================================================================
   4) GAME OVER
   ===================================================================== */
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }

  init(veri){ this.veri = veri; }

  create(){
    const { kazandi, puan, can, adim, toplam } = this.veri;
    uzayCiz(this);

    const emo = this.add.text(EN / 2, 190, kazandi ? '🛸' : '💪', { fontSize:'97px' })
      .setOrigin(0.5).setScale(0);
    this.tweens.add({ targets:emo, scale:1, duration:520, ease:'Back.easeOut' });

    this.add.text(EN / 2, 300, kazandi ? 'UZAY GEMİSİ KURTULDU!' : 'TEKRAR DENE', {
      fontFamily:'system-ui, sans-serif', fontSize:'32px', fontStyle:'bold',
      color: kazandi ? '#7ce0a3' : '#ffd166', align:'center',
      wordWrap:{ width:EN - 50 }
    }).setOrigin(0.5);

    this.add.text(EN / 2, 362,
      kazandi ? BASARI : `${adim} / ${toplam} meteoru vurdun — bir daha deneyelim mi?`, {
      fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#cfe0ff',
      align:'center', wordWrap:{ width:EN - 70 }, lineSpacing:5
    }).setOrigin(0.5);

    const puanYazi = this.add.text(EN / 2, 456, 'Puan 0', {
      fontFamily:'system-ui, sans-serif', fontSize:'42px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0.5);
    const sayac = { v:0 };
    this.tweens.add({
      targets:sayac, v:puan, duration:900, ease:'Cubic.easeOut',
      onUpdate:() => puanYazi.setText('Puan ' + Math.round(sayac.v))
    });

    this.add.text(EN / 2, 506,
      'Kalan can: ' + (can > 0 ? '❤️'.repeat(can) : '—'), {
      fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#9fc2e6'
    }).setOrigin(0.5);

    if (kazandi){
      const konfeti = this.add.particles(EN / 2, -20, 'kivilcim', {
        speed:{ min:90, max:260 }, angle:{ min:60, max:120 },
        scale:{ start:0.8, end:0 }, alpha:{ start:1, end:0 },
        lifespan:2000, gravityY:180, quantity:2, frequency:70,
        tint:[0xffd166, 0x7ce0a3, 0x7fe7ff, 0xf07575]
      }).setDepth(5);
      this.time.delayedCall(2600, () => konfeti.stop());
    }

    dugmeYap(this, EN / 2, 606, '↻  TEKRAR OYNA', RENK.dogru, () => this.scene.start('Game'));

    /* Uygulama içinde: bu oyunda takılan çocuk sıradakine geçebilsin. */

    if (KOPRU) dugmeYap(this, EN / 2, 680, '⏭  SIRADAKİ OYUN', 0x4a679e, () => KOPRU.atla());
    if (!KOPRU) dugmeYap(this, EN / 2, 684, '☰  MENÜ', 0x4a679e, () => this.scene.start('Menu'));
  }
}

/* =====================================================================
   OYUNU BAŞLAT
   ===================================================================== */
/* =====================================================================
   NETLİK — cihazın piksel yoğunluğunda çizim
   ---------------------------------------------------------------------
   Oyun 480x800 mantıksal tuvalde çiziliyordu; telefon bunu 1080 piksele
   büyütünce yazılar ve kenarlar bulanıklaşıyordu. Çözüm: tuvali cihazın
   gerçek piksel sayısında açmak, dünyayı ise kamerayı NETLIK katına
   yakınlaştırarak yine 480x800 koordinatta tutmak. Böylece Graphics ile
   çizilen her şey (kartlar, şeritler, kutular) vektör keskinliğinde,
   yazılar da NETLIK çözünürlüğünde üretiliyor; oyun kodunun tek satırı
   değişmiyor.
   ===================================================================== */
const NETLIK = Math.min(3, Math.max(1, Math.round((window.devicePixelRatio || 1) * 2) / 2));

/* Phaser yazıyı kendi ara tuvaline çiziyor; çözünürlük verilmezse 1x
   üretilip yakınlaştırmada bulanıklaşır. Bütün yazılara varsayılan
   olarak NETLIK veriyoruz. */
(function(){
  const TS = Phaser.GameObjects.TextStyle.prototype;
  const eskiSetStyle = TS.setStyle;
  TS.setStyle = function(style, updateText, setDefaults){
    if (style && style.resolution === undefined) style.resolution = NETLIK;
    return eskiSetStyle.call(this, style, updateText, setDefaults);
  };
})();

/* Tuval NETLIK katına büyüdüğü için Phaser imleç konumunu da o ölçekte
   veriyor (0–960). Oyun koordinatına (0–480) çeviren yardımcı: sürükleme
   olayları zaten dünya koordinatı verdiği için yalnız pointer olaylarında
   kullanılıyor. */
function imlec(p){ return { x: p.x / NETLIK, y: p.y / NETLIK }; }

/* Her sahne başlarken kamerayı NETLIK katına yakınlaştırıp fizik
   dünyasını mantıksal ölçüde tutuyoruz: tuval büyüdü, dünya büyümedi.
   Sahne örnekleri oyun kurulumundan sonra eşzamansız oluştuğu için
   kanca Systems.start üzerine takılıyor — yeniden başlatmalarda da
   kendiliğinden çalışıyor. */
(function(){
  const SS = Phaser.Scenes.Systems.prototype;
  const eskiStart = SS.start;
  SS.start = function(veri){
    const sonuc = eskiStart.call(this, veri);
    const sc = this.scene;
    try{
      if (sc.cameras && sc.cameras.main){
        sc.cameras.main.setZoom(NETLIK);
        sc.cameras.main.centerOn(EN / 2, BOY / 2);
      }
      if (sc.physics && sc.physics.world) sc.physics.world.setBounds(0, 0, EN, BOY);
    }catch(e){ /* netlik ayarı oyunu engellemesin */ }
    return sonuc;
  };
})();

window.OYUN = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'oyun',
  width: EN * NETLIK,
  height: BOY * NETLIK,
  backgroundColor: '#05070f',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'arcade',
    /* Uzayda tam yerçekimsizlik olurdu ama o zaman nişan almak
       düz çizgiye inerdi. Hafif bir "gezegen çekimi" bırakıyoruz:
       mermi belirgin bir yay çiziyor, atış gerçek bir beceri oluyor. */
    arcade: { gravity: { y: 300 } }   /* yalnız mermiyi etkiler; meteorlar yerçekimsiz */
  },
  scene: [BootScene, MenuScene, GameScene, GameOverScene]
});
