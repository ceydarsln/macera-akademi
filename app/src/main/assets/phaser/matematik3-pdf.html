function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}

  state.a=0;state.b=0;state.karar=false;
  const ciz=()=>{
    updateStage();
    const kalan=r.total-state.a-state.b;

      state.karar=true;
      $('#task').innerHTML=`<div class="choices">
        <button class="choice" data-choice="0">TEK</button>
        <button class="choice" data-choice="1">ÇİFT</button></div>`;
      $$('[data-choice]').forEach(b=>b.onclick=()=>{
        const tek=(r.total%2===1);
        const secilenTek=b.dataset.choice==='0';
        if(secilenTek===tek) good(); else wrong(r.hint);
      });
      return;
    }
    $('#task').innerHTML=`<div class="actions">
      <button class="action" data-share="a">⬅️ Sol tabağa</button>
      <button class="action" data-share="b">Sağ tabağa ➡️</button></div>`;
    $$('[data-share]').forEach(btn=>btn.onclick=()=>{
      const hangi=btn.dataset.share;

      if(bu-digeri>=1){ wrong('Sırayla birer tane ver; tabaklar eşit ilerlemeli.'); return; }
      if(hangi==='a')state.a++;else state.b++;
      ciz();
    });
  };
  ciz();
}

function updateLiquid(r){const pct=Math.min(100,state.level/r.capacity*100),estimatePct=Math.min(100,state.estimate/r.capacity*100);$('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}<div class="liquid-lab"><div class="graduated"><div class="water-level" style="--level:${pct}%"></div><i style="position:absolute;left:0;right:0;bottom:${estimatePct}%;border-top:4px dashed #e64d63;z-index:3"></i></div><div class="stack"><div class="badge">${state.phase==='estimate'?'Tahmin çizgisi':state.level.toFixed(1)+' '+(r.unit||'L')}</div><div class="caption">${state.phase==='estimate'?'Ölçek açılmadan yerini seç.':'Musluğu basılı tut; bırakınca ölç.'}</div></div></div>`;if(state.phase==='estimate'){const min=r.min??0,max=r.max??r.capacity;$('#task').innerHTML=`<input class="range-control" data-liquid-est type="range" min="${min}" max="${max}" step="${r.estimateStep||.5}" value="${state.estimate}"><button class="action" data-est-ok>Tahmini Kaydet: ${state.estimate} ${r.unit||'L'}</button>`;const x=$('[data-liquid-est]');x.oninput=()=>{state.estimate=+x.value;updateLiquid(r)};$('[data-est-ok]').onclick=()=>{state.phase='fill';updateLiquid(r)}}else{$('#task').innerHTML='<button class="action hold" data-hold>🚰 DOLDURMAK İÇİN BASILI TUT</button><button class="action" data-drain>Biraz geri al</button><button class="action" data-liquid-ok>Ölçümü Onayla</button>';const h=$('[data-hold]');let tick=null;const stop=()=>{clearInterval(tick);tick=null};h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture?.(e.pointerId);if(tick)return;tick=setInterval(()=>{state.level=Math.min(r.capacity,state.level+(r.fillStep||.1));updateLiquid(r)},FAST?1:80)};h.onpointerup=stop;h.onpointercancel=stop;$('[data-drain]').onclick=()=>{state.level=Math.max(0,state.level-(r.fillStep||.1)*2);updateLiquid(r)};$('[data-liquid-ok]').onclick=()=>{if(Math.abs(state.level-r.target)>(r.tolerance||.11))return wrong('Suyu hedef derece çizgisine yaklaştır; tahmin çizgin ile ölçümü karşıla function ropeScene(r){const a=(state.angle||0)*Math.PI/180,cx=170,cy=108,rad=92,x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;return `<div class="rope-board" data-rope><div class="rope-can" style="${r.shape==='leaf'?'border-radius:70% 20% 70% 20%;transform:translate(-50%,-50%) rotate(25deg)':''}">${r.icon||'🥫'}</div><div class="rope-path" style="${r.shape==='leaf'?'border-radius:70% 20% 70% 20%;transform:translate(-50%,-50%) rotate(25deg)':''}"></div><i class="rope-dot" style="left:${x}px;top:${y}px"></i></div><div class="caption">İzlenen çevre: ${Math.min(100,Math.round((state.travel||0)/340*100))}%</div>`}
function renderRope(r){state.angle=-90;state.lastAngle=null;state.travel=0;$('#stage').innerHTML=ropeScene(r);$('#task').innerHTML='<div class="caption">Sarı ip ucunu nesnenin dış sınırı boyunca bir tam tur sürükle.</div>';bindRope(r)}
function bindRope(r){const board=$('[data-rope]');if(!board)return;const move=e=>{if(!state.ropeDown)return;const b=board.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height*.47,a=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;let d=state.lastAngle==null?0:a-state.lastAngle;if(d>180)d-=360;if(d<-180)d+=360;if(Math.abs(d)<45)state.travel+=Math.abs(d);state.lastAngle=a;state.angle=a;$('#stage').innerHTML=ropeScene(r);bindRope(r);if(state.travel>=340){state.ropeDown=false;setTimeout(()=>good(),FAST?20:350)}};board.onpointerdown=e=>{state.ropeDown=true;state.lastAngle=null;board.setPointerCapture?.(e.pointerId);move(e)};board.onpointermove=move;board.onpointerup=()=>state.ropeDown=false;board.onpointercancel=()=>state.ropeDown=false}

function connectSvg(r){const found=state.found||[],lines=found.map(id=>{const s=r.segments.find(x=>x.id===id),a=r.points.find(x=>x.id===s.a),b=r.points.find(x=>x.id===s.b);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${s.color||'#e64e64'}" stroke-width="8" stroke-linecap="round"/>`}).join('');return `<svg class="svg-board" viewBox="0 0 340 220" data-connect>${r.backdrop||''}${lines}${r.points.map(p=>`<circle data-point="${p.id}" cx="${p.x}" cy="${p.y}" r="17" fill="${state.first===p.id?'#f4be3f':'#fff'}" stroke="#29475c" stroke-width="5"/><text x="${p.x}" y="${p.y+6}" text-anchor="middle" font-size="15" font-weight="900" pointer-events="none">${esc(p.label||p.id)}</text>`).join('')}</svg><div class="caption">${found.length}/${r.segments.length} doğru parça çizildi</div>`}
function renderConnect(r){state.found=[];state.first=null;updateConnect(r)}
function updateConnect(r){$('#stage').innerHTML=connectSvg(r);$('#task').innerHTML=`<div class="tool-row"><span class="tool active">📏 ${esc(r.tool||'Cetvel')}</span>${r.undo===false?'':'<button class="tool" data-undo>↶ Geri al</button>'}</div><div class="caption">İki köşeye sırayla dokun; çizgi cetvel boyunca oluşsun.</div>`;$$('[data-point]').forEach(p=>p.onclick=()=>{const id=p.dataset.point;if(!state.first){state.first=id;return updateConnect(r)}if(id===state.first){state.first=null;return updateConnect(r)}const seg=r.segments.find(s=>(s.a===state.first&&s.b===id)||(s.b===state.first&&s.a===id));state.first=null;if(!seg)return wrong(r.hint||'Bu iki noktanın oluşturduğu parçayı şeklin koşuluyla karşılaştır.');if(state.found.includes(seg.id))return wrong('Bu çizgiyi zaten çizdin; farklı köşeleri birleştir.');state.found.push(seg.id);if(state.found.length===r.segments.length)return good();updateConnect(r)});$('[data-undo]')?.addEventListener('click',()=>{state.found.pop();state.first=null;updateConnect(r)})}

function renderGrid(r){state.cells={...(r.prefill||{})};state.history=[];state.color=r.colors?.[0]||'#e85d70';updateGrid(r)}
function updateGrid(r){const cells=[];for(let y=0;y<r.rows;y++)for(let x=0;x<r.cols;x++){const k=`${x},${y}`,src=(r.sources||[]).includes(k),axisR=x===r.axisX-1,axisB=y===r.axisY-1;cells.push(`<button class="grid-square ${src?'source':''} ${axisR?'axis-r':''} ${axisB?'axis-b':''}" data-cell="${k}" style="--cell:${state.cells[k]||'#fff'}" aria-label="${x+1}. sütun ${y+1}. satır"></button>`)}$('#stage').innerHTML=`<div class="grid-board" style="--cols:${r.cols};--rows:${r.rows}">${cells.join('')}</div><div class="caption">${Object.keys(state.cells).length}/${Object.keys(r.solution).length} renkli hücre</div>`;$('#task').innerHTML=`<div class="tool-row">${(r.colors||['#e85d70']).map(c=>`<button class="tool ${state.color===c?'active':''}" data-color="${c}" style="background:${c}">Renk</button>`).join('')}<button class="tool" data-eraser>Silgi</button><button class="tool" data-grid-undo>↶ Geri al</button><button class="tool" data-grid-ok>Deseni Katla</button></div>`;$$('[data-cell]').forEach(c=>c.onclick=()=>{const k=c.dataset.cell;if((r.sources||[]).includes(k))return wrong('Kaynak hücreyi değiştirme; eksenin karşısındaki eşini bul.');state.history.push([k,state.cells[k]]);if(state.color==='eraser')delete state.cells[k];else state.cells[k]=state.color;updateGrid(r)});$$('[data-color]').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;updateGrid(r)});$('[data-eraser]').onclick=()=>{state.color='eraser';updateGrid(r)};$('[data-grid-undo]').onclick=()=>{const h=state.history.pop();if(h){if(h[1])state.cells[h[0]]=h[1];else delete state.cells[h[0]]}updateGrid(r)};$('[data-grid-ok]').onclick=()=>{const keys=new Set([...Object.keys(state.cells),...Object.keys(r.solution)]),ok=[...keys].every(k=>state.cells[k]===r.solution[k]);if(!ok)return wrong(r.hint||'Kaynak hücre ile hedefin eksene uzaklığını ve rengini karşılaştır.');good()}}

function renderScan(r){state.found=[];updateScan(r)}
function updateScan(r){const active=new Set(state.found);$('#stage').innerHTML=`<svg class="svg-board" viewBox="0 0 340 220">${r.svg}${r.hotspots.map(h=>`<${h.tag||'circle'} data-hot="${h.id}" ${h.attrs} fill="${active.has(h.id)?'#53c28b':'rgba(255,255,255,.12)'}" stroke="${active.has(h.id)?'#16764d':'transparent'}" stroke-width="5"/>`).join('')}</svg><div class="caption">Bulunan ${state.found.length}/${r.hotspots.length} ${esc(r.label)}</div>`;$('#task').innerHTML='<div class="caption">Modeli incele; saymak istediğin öğelerin üzerine dokun.</div>';$$('[data-hot]').forEach(h=>h.onclick=()=>{if(state.found.includes(h.dataset.hot))return feedback('Bunu zaten buldun');state.found.push(h.dataset.hot);if(state.found.length===r.hotspots.length)return good();updateScan(r)})}

function renderTimer(r){state.estimate=r.startEstimate??5;state.started=0;state.elapsed=0;updateTimer(r)}
function updateTimer(r){$('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}<div class="digital">${state.started?(state.elapsed/1000).toFixed(1)+' sn':'Tahmin: '+state.estimate+' sn'}</div><div class="caption">${state.started?'Eylemi yap, bitince durdur.':'Önce bağımsız tahminini kaydet.'}</div>`;if(!state.started){$('#task').innerHTML=`<input class="range-control" data-time-est type="range" min="${r.min||1}" max="${r.max||30}" value="${state.estimate}"><button class="action" data-start-timer>Tahmini Kaydet ve Başlat</button>`;const x=$('[data-time-est]');x.oninput=()=>{state.estimate=+x.value;updateTimer(r)};$('[data-start-timer]').onclick=()=>{state.started=performance.now();state.tick=setInterval(()=>{state.elapsed=performance.now()-state.started;const d=$('.digital');if(d)d.textContent=(state.elapsed/1000).toFixed(1)+' sn'},100);updateTimer(r)}}else{$('#task').innerHTML='<button class="action" data-stop-timer>⏱️ Ölçümü Durdur</button>';$('[data-stop-timer]').onclick=()=>{clearInterval(state.tick);state.elapsed=performance.now()-state.started;if(state.elapsed<(FAST?5:350))return wrong('Kronometreyi eylem başlamadan durdurma; kısa da olsa gerçek bir ölçüm yap.');good()}}}
/* ===== w09: kesir tepsisi (bütün / yarım / çeyrek) =====
   Dilimler gerçek daire diliminden ibaret; hiçbirinin üstünde kesir yazmıyor.
   Çocuk alanı görerek seçiyor, tepsi toplam değeri denetliyor. */
function sektorPath(cx,cy,r,a0,a1){const nk=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
 if(a1-a0>=359.9)return `M ${cx-r} ${cy} a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 ${-2*r} 0 Z`;
 const [x0,y0]=nk(a0),[x1,y1]=nk(a1);
 return `M ${cx} ${cy} L ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z`}
function sucuk(a0,a1,cx,cy,R){const am=(a0+a1)/2,x=cx+R*Math.sin(am*Math.PI/180),y=cy-R*Math.cos(am*Math.PI/180);
 return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R/4.2).toFixed(1)}" fill="#c0392b"/>`}
function dilimSvg(birim,tam){tam=tam||8;const a=360*birim/tam;
 return `<svg class="slice" viewBox="0 0 64 64" width="56" height="56"><path d="${sektorPath(32,32,29,0,a)}" fill="#efb84d" stroke="#8a5725" stroke-width="3" stroke-linejoin="round"/>${sucuk(0,a,32,32,17)}</svg>`}
function modelPizza(birim,tam){tam=tam||8;
 return `<svg viewBox="0 0 80 80" width="72" height="72"><circle cx="40" cy="40" r="34" fill="#fbf3e2" stroke="#b9945c" stroke-width="4"/><path d="${sektorPath(40,40,34,0,360*birim/tam)}" fill="#efb84d" stroke="#8a5725" stroke-width="3"/></svg>`}
function tepsiSvg(dilimler,not){let a=0,ic='';for(const d of (dilimler||[])){const her=360*d/8;
  ic+=`<path d="${sektorPath(62,62,54,a,a+her)}" fill="#efb84d" stroke="#8a5725" stroke-width="2"/>${sucuk(a,a+her,62,62,30)}`;a+=her}
 return `<div class="pizza-tray"><svg viewBox="0 0 124 124" width="146" height="146"><circle cx="62" cy="62" r="58" fill="#f6ece0" stroke="#b9945c" stroke-width="5"/>${ic}</svg><div class="caption">${esc(not||'Servis tepsisi')}</div></div>`}
function fis(ic,alt){return `<div class="receipt"><div class="receipt-pin">📋</div>${ic}<div class="say">${esc(alt||'')}</div></div>`}
function pizzaSahne(fisIc,fisAlt,not){return st=>`<div class="pizza-wrap">${fis(fisIc,fisAlt)}${tepsiSvg(st.dilimler,'Senin tepsin')}${not?`<div class="caption">${esc(not)}</div>`:''}</div>`}
function PZ(id,birim){return{id,html:dilimSvg(birim),deger:birim,target:'tepsi',placed:'✔'}}
function kesirKanca(hedef){return(st,p)=>{st.dilimler=(st.dilimler||[]).concat(p.deger);st.toplam=(st.toplam||0)+p.deger;
 if(st.toplam===hedef)good();
 else if(st.toplam>hedef){wrong('Tepsiden taştı. Tepsideki fazlalığa bak, daha küçük bir dilim dene.');turuTazele()}}}

/* ===== w10: çikolata tableti (eş parçalar, birim kesir) =====
   Gerçek dikdörtgen tablet; çizgiyi çocuk kendi çekiyor, yanlış çizgiye dokununca kalkıyor. */
function barGeom(){return{W:280,H:120,x0:12,y0:12,w:256,h:96}}
function barSvg(r){const g=barGeom();let kareler='';
 for(let c=0;c<r.cols;c++)for(let sr=0;sr<r.rows;sr++)kareler+=`<rect x="${(g.x0+g.w*c/r.cols+3).toFixed(1)}" y="${(g.y0+g.h*sr/r.rows+3).toFixed(1)}" width="${(g.w/r.cols-6).toFixed(1)}" height="${(g.h/r.rows-6).toFixed(1)}" rx="5" fill="#7b4a24" stroke="#4e2d13" stroke-width="2"/>`;
 const cz=(state.cuts||[]).map((c,i)=>c.axis==='v'
  ?`<line data-cut="${i}" x1="${(g.x0+g.w*c.at).toFixed(1)}" y1="${g.y0-6}" x2="${(g.x0+g.w*c.at).toFixed(1)}" y2="${g.y0+g.h+6}" stroke="#f6d64a" stroke-width="5" stroke-linecap="round"/>`
  :`<line data-cut="${i}" x1="${g.x0-6}" y1="${(g.y0+g.h*c.at).toFixed(1)}" x2="${g.x0+g.w+6}" y2="${(g.y0+g.h*c.at).toFixed(1)}" stroke="#f6d64a" stroke-width="5" stroke-linecap="round"/>`).join('');
 return `<svg id="barModel" viewBox="0 0 ${g.W} ${g.H}" width="288" height="124" style="touch-action:none"><rect x="4" y="4" width="272" height="112" rx="10" fill="#5b3418" stroke="#3a2010" stroke-width="4"/>${kareler}${cz}</svg>`}
function barParcalar(){const c=state.cuts||[];
 const vs=[0,...c.filter(x=>x.axis==='v').map(x=>x.at),1].sort((a,b)=>a-b);
 const hs=[0,...c.filter(x=>x.axis==='h').map(x=>x.at),1].sort((a,b)=>a-b);
 const gv=[],gh=[];for(let i=1;i<vs.length;i++)gv.push(vs[i]-vs[i-1]);for(let i=1;i<hs.length;i++)gh.push(hs[i]-hs[i-1]);
 const es=gv.every(x=>Math.abs(x-gv[0])<1e-3)&&gh.every(x=>Math.abs(x-gh[0])<1e-3);
 return{vs,hs,adet:gv.length*gh.length,es}}
function barParcaSvg(){const g=barGeom(),p=barParcalar();let ic='',i=0;
 for(let ri=0;ri<p.hs.length-1;ri++)for(let ci=0;ci<p.vs.length-1;ci++){
  const x=g.x0+g.w*p.vs[ci],y=g.y0+g.h*p.hs[ri],w=g.w*(p.vs[ci+1]-p.vs[ci]),hh=g.h*(p.hs[ri+1]-p.hs[ri]);
  const sec=(state.sec||[]).indexOf(i)>=0;
  ic+=`<rect data-part="${i}" x="${(x+2).toFixed(1)}" y="${(y+2).toFixed(1)}" width="${(w-4).toFixed(1)}" height="${(hh-4).toFixed(1)}" rx="5" fill="${sec?'#f6d64a':'#7b4a24'}" stroke="${sec?'#b57d16':'#4e2d13'}" stroke-width="3" style="cursor:pointer"/>`;
  if(sec&&state.etiket)ic+=`<text x="${(x+w/2).toFixed(1)}" y="${(y+hh/2+7).toFixed(1)}" text-anchor="middle" font-size="19" font-weight="900" fill="#4e2d13">${esc(state.etiket)}</text>`;
  i++}
 return `<svg viewBox="0 0 ${g.W} ${g.H}" width="288" height="124">${ic}</svg>`}
function renderBar(r){state.cuts=(r.preset||[]).map(c=>({axis:c.axis,at:c.at}));state.faz=0;state.sec=[];state.etiket='';barCiz(r)}
function barCiz(r){
 if(state.faz===0){
  $('#stage').innerHTML=`<div class="stack">${barSvg(r)}<div class="caption">${esc(r.label||'')}</div></div>`;bindBar(r);
  $('#task').innerHTML=`<div class="caption">Parmağını tabletin üzerinde bir kenardan karşı kenara sürükle. Yanlış çizgiye dokunursan kalkar.</div><button class="action" id="barOk">Kes ve Ayır</button>`;
  $('#barOk').onclick=()=>checkBar(r);
 }else{
  const sc=r.selections[state.faz-1];
  $('#stage').innerHTML=`<div class="stack">${barParcaSvg()}<div class="caption">Parçalar ayrıldı; hepsi aynı büyüklükte.</div></div>`;
  $$('[data-part]').forEach(el=>el.onclick=()=>pickPart(+el.dataset.part));
  $('#task').innerHTML=`<div class="caption">${esc(sc.prompt)}</div><button class="action" id="partOk">Onayla</button>`;
  $('#partOk').onclick=()=>checkParts(r);
 }}
function bindBar(r){const m=$('#barModel');if(!m)return;const g=barGeom();let bas=null,ekr=null;
 const nk=e=>{const b=m.getBoundingClientRect();return[(e.clientX-b.left)/b.width*g.W,(e.clientY-b.top)/b.height*g.H]};
 m.onpointerdown=e=>{e.preventDefault();bas=nk(e);ekr=[e.clientX,e.clientY];m.setPointerCapture&&m.setPointerCapture(e.pointerId)};
 m.onpointerup=e=>{if(!bas)return;const b0=bas,son=nk(e);bas=null;
  if(Math.hypot(e.clientX-ekr[0],e.clientY-ekr[1])<14){
   const i=(state.cuts||[]).findIndex(c=>c.axis==='v'?Math.abs(g.x0+g.w*c.at-son[0])<13:Math.abs(g.y0+g.h*c.at-son[1])<13);
   if(i>=0){state.cuts.splice(i,1);barCiz(r)}return}
  const dx=Math.abs(son[0]-b0[0]),dy=Math.abs(son[1]-b0[1]),dikey=dy>dx;
  if(dikey&&dy<g.h*0.6)return wrong('Çizgiyi üst kenardan alt kenara kadar uzat.');
  if(!dikey&&dx<g.w*0.5)return wrong('Çizgiyi sol kenardan sağ kenara kadar uzat.');
  const at=dikey?Math.round(((b0[0]+son[0])/2-g.x0)/g.w*8)/8:Math.round(((b0[1]+son[1])/2-g.y0)/g.h*2)/2;
  if(at<=0||at>=1)return wrong('Çizgi tabletin içinden geçmeli.');
  if((state.cuts||[]).some(c=>c.axis===(dikey?'v':'h')&&Math.abs(c.at-at)<1e-6))return wrong('Orada zaten bir çizgi var.');
  addCut(dikey?'v':'h',at)}}
function pickPart(i){const s=(state.sec||[]).slice(),k=s.indexOf(i);
 if(k>=0)s.splice(k,1);else s.push(i);state.sec=s;barCiz(round())}
function addCut(axis,at){state.cuts=(state.cuts||[]).concat({axis,at});barCiz(round())}
function removeCut(i){(state.cuts||[]).splice(i,1);barCiz(round())}
function checkBar(r){const p=barParcalar();
 if(!p.es)return wrong('Parçaların kapladığı alanları karşılaştır: hepsi aynı büyüklükte değil. Eş olmayan çizgiye dokunup kaldırabilirsin.');
 if(p.adet!==r.parts)return wrong(`Tabletin şu an ${p.adet} parçası var; kaç eş parça istendiğini yeniden düşün.`);
 if(!r.selections||!r.selections.length)return good();
 state.faz=1;state.sec=[];state.etiket='';feedback('Parçalar eş!');barCiz(r)}
function checkParts(r){const sc=r.selections[state.faz-1],adet=barParcalar().adet,n=(state.sec||[]).length;
 if(n!==sc.count)return wrong(`Şu an ${n} parça seçili. İstenen parça sayısını yeniden oku.`);
 state.etiket=sc.count+'/'+adet;
 if(state.faz>=r.selections.length){barCiz(r);good()}
 else{feedback('Seçtiğin kadarı '+state.etiket);speak(sc.count+' bölü '+adet);state.faz++;state.sec=[];state.etiket='';ertele(()=>barCiz(r),FAST?30:760)}}

/* ===== w11: kesir asansörü (pay / payda) =====
   Gerçek dikey kuyu, 0 ile 1 bütün arasında on eş aralık. Tren/tünel yok. */
function liftHtml(r){const n=r.floors||10,kat=state.kat||0,H=252,adim=H/n;let segs='';
 for(let i=n;i>=1;i--)segs+=`<div class="lift-seg${i<=kat?' pass':''}" style="height:${adim}px"><span>${i<=kat?i:''}</span></div>`;
 return `<div class="lift-wrap"><div class="stack"><div class="caption">1 bütün</div><div class="lift-shaft" id="shaft" style="height:${H}px">${segs}<div class="lift-cabin" id="cabin" style="bottom:${(adim*kat).toFixed(1)}px;height:${(adim-3).toFixed(1)}px">🛗</div></div><div class="caption">0</div></div>
 <div class="stack"><div class="caption">Çağrı ekranı</div><div class="digital">${esc(r.label)}</div><div class="lift-info"><span style="color:#c98a10">${kat}</span> / <span>${n}</span></div><div class="caption">Geçilen kat (pay)<br>Bütün kat (payda)</div></div></div>`}
function liftCiz(r){$('#stage').innerHTML=liftHtml(r);const sh=$('#shaft');if(!sh)return;const n=r.floors||10;
 const tasi=e=>{const b=sh.getBoundingClientRect();setLift(Math.round((b.bottom-e.clientY)/b.height*n))};
 sh.onpointerdown=e=>{e.preventDefault();state.tut=true;sh.setPointerCapture&&sh.setPointerCapture(e.pointerId);tasi(e)};
 sh.onpointermove=e=>{if(state.tut)tasi(e)};
 sh.onpointerup=()=>state.tut=false;sh.onpointercancel=()=>state.tut=false}
function setLift(k){const r=round(),n=r.floors||10;state.kat=Math.max(0,Math.min(n,k));liftCiz(r)}
function renderLift(r){state.kat=r.start||0;liftCiz(r);
 $('#task').innerHTML='<div class="caption">Kabini parmağınla yukarı aşağı sürükle, sonra kapıyı aç.</div><button class="action" id="liftOk">Kapıyı Aç</button>';
 $('#liftOk').onclick=()=>checkLift(r)}
function checkLift(r){if(state.kat===r.target)good();else wrong(r.hint||'Zeminden kabine kadar kaç aralık geçtiğini tek tek say.')}

/* ===== w12: saat kulesi (analog / dijital) =====
   Zaman tek bir dakika sayacıyla tutuluyor; akrep dakikaya göre sürekli ilerliyor. */
function clockFace(tm){let nums='';for(let n=1;n<=12;n++){const a=n*Math.PI/6,x=50+42*Math.sin(a),y=50-42*Math.cos(a);nums+=`<span class="clock-number" style="left:${x}%;top:${y}%">${n}</span>`}
 return `<div class="clock" id="clock">${nums}<i class="hand hour" data-hand="hour" style="transform:rotate(${(tm*0.5).toFixed(2)}deg)"></i><i class="hand minute" data-hand="minute" style="transform:rotate(${((tm%60)*6).toFixed(1)}deg)"></i><i class="pin"></i></div>`}
function renderClock(r){state.tm=r.start||0;state.sub=0;clockCiz(r);
 $('#task').innerHTML='<div class="actions"><button class="action" data-tick="-5">◀ 5 dk</button><button class="action" data-tick="5">5 dk ▶</button><button class="action" id="clockOk">Saati Onayla</button></div><div class="caption">İbrelerin ucundan tutup çevir. Sürükleyemiyorsan 5 dakikalık düğmeleri kullanabilirsin.</div>';
 $$('[data-tick]').forEach(b=>b.onclick=()=>setClock(state.tm+(+b.dataset.tick)));
 $('#clockOk').onclick=()=>checkClock(r)}
function setClock(tm){state.tm=(((Math.round(tm/5)*5)%720)+720)%720;clockCiz(round())}
function clockCiz(r){const t=(r.targets||[r.target])[state.sub]||r.target;
 $('#stage').innerHTML=`<div class="clock-wrap">${clockFace(state.tm||0)}<div class="stack"><div class="caption">Dijital hedef</div><div class="digital">${esc(t.label)}</div><div class="caption">Günlük dil</div><div class="talk">${esc(t.speech)}</div><div class="caption">Kırmızı akrep · Mavi yelkovan</div></div></div>`;
 const c=$('#clock');if(!c)return;
 $$('[data-hand]').forEach(h=>h.onpointerdown=e=>{e.preventDefault();clockDrag=h.dataset.hand;c.setPointerCapture&&c.setPointerCapture(e.pointerId)});
 c.onpointermove=e=>{if(!clockDrag)return;const b=c.getBoundingClientRect(),a=(Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)*180/Math.PI+450)%360;
  if(clockDrag==='minute'){const hed=(Math.round(a/30)*5)%60,su=state.tm%60,d=((hed-su+90)%60)-30;state.tm=(state.tm+d+720)%720}
  else{const yeni=(Math.round(a/30*12)*5)%720,d=((yeni-state.tm+360)%720)-360;state.tm=(state.tm+d+720)%720}
  clockCiz(r)};
 c.onpointerup=()=>clockDrag=null;c.onpointercancel=()=>clockDrag=null}
function checkClock(r){const ts=r.targets||[r.target],t=ts[state.sub];
 if(state.tm===t.tm){state.sub++;if(state.sub>=ts.length)good();else{feedback('İlk saat doğru!');speak(t.speech);clockCiz(r)}}
 else wrong(r.hint||'Hangi ibre dakikayı, hangisi saati gösteriyor? İbreleri yeniden çevir.')}

/* ===== w13: zaman birimi kartları ===== */
function zamanKart(metin,alt){return `<div class="time-card"><div class="tc-main">${esc(metin)}</div>${alt?`<div class="tc-sub">${esc(alt)}</div>`:''}</div>`}
function chipSerisi(n,etiket){return `<div class="unit-strip">${Array.from({length:n},(_,i)=>`<span class="unit-chip">${i+1}</span>`).join('')}</div><div class="caption">Say: ${n} ${esc(etiket)}</div>`}
function noktaSerisi(n,etiket){return `<div class="unit-strip">${'<i class="unit-dot"></i>'.repeat(n)}</div><div class="caption">${n} ${esc(etiket)}</div>`}
function haftaModeli(){return `<div class="week-wrap">${'<span class="week-chip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>'.repeat(52)}<span class="day-extra"><i></i></span></div>
 <div class="caption">52 tam hafta (her biri 7 gün) ve turuncu 1 artan gün</div>`}

/* ===== w14: tahmin + gerçek kronometre ===== */
function renderTiming(r){state.faz=0;state.tahmin=r.baslangic||5;state.olcum=null;timingCiz(r)}
function setTahmin(n){state.tahmin=Math.max(1,Math.min(120,n));timingCiz(round())}
function kronBas(){state.t0=performance.now();state.calisiyor=true;timingCiz(round());
 state.saat=setInterval(()=>{const e=$('#kron');if(!e||!state.calisiyor){clearInterval(state.saat);return}
  e.textContent=((performance.now()-state.t0)/1000).toFixed(1).replace('.',',')+' sn'},100)}
function kronDur(){if(!state.calisiyor)return;state.calisiyor=false;clearInterval(state.saat);
 state.olcum=(performance.now()-state.t0)/1000;
 if(state.olcum<0.3){state.olcum=null;return wrong('Kronometre çok kısa çalıştı. Eylemi yapıp öyle durdur.')}
 state.faz=2;timingCiz(round())}
function timingCiz(r){
 if(state.faz===0){
  $('#stage').innerHTML=`<div class="stack"><div class="task-card">${esc(r.eylem)}</div><div class="caption">Kronometre henüz kapalı. Sence bu iş kaç saniye sürer?</div><div class="digital">${state.tahmin} sn</div></div>`;
  $('#task').innerHTML='<div class="actions"><button class="action" data-adim="-1">− 1 sn</button><button class="action" data-adim="1">+ 1 sn</button><button class="action" id="tahminOk">Tahminimi Kaydet</button></div>';
  $$('[data-adim]').forEach(b=>b.onclick=()=>setTahmin(state.tahmin+(+b.dataset.adim)));
  $('#tahminOk').onclick=()=>{state.faz=1;timingCiz(r)};
 }else if(state.faz===1){
  $('#stage').innerHTML=`<div class="stack"><div class="task-card">${esc(r.eylem)}</div><div class="caption">Şimdi işi gerçekten yap: başlat, bitince durdur.</div><div class="digital" id="kron">0,0 sn</div><div class="caption">Tahminin kayıtlı; şu an görünmüyor.</div></div>`;
  $('#task').innerHTML=state.calisiyor?'<button class="action" id="kronDur">Durdur</button>':'<button class="action" id="kronBasla">Başlat</button>';
  const b1=$('#kronBasla'),b2=$('#kronDur');if(b1)b1.onclick=()=>kronBas();if(b2)b2.onclick=()=>kronDur();
 }else{
  const fark=Math.abs(state.olcum-state.tahmin);
  $('#stage').innerHTML=`<div class="stack"><div class="report"><div><b>${state.tahmin}</b><small>tahminin</small></div><div><b>${state.olcum.toFixed(1).replace('.',',')}</b><small>ölçüm (sn)</small></div><div><b>${fark.toFixed(1).replace('.',',')}</b><small>fark</small></div></div><div class="caption">${esc(fark<=2?'Tahminin ölçüme çok yakın.':fark<=5?'Tahminin ölçüme yakın sayılır.':'Tahminle ölçüm arasında belirgin fark var; bu da bir bilgidir.')}</div><div class="caption">${esc(r.aciklama||'Süre kişiye ve koşula göre değişebilir.')}</div></div>`;
  $('#task').innerHTML='<button class="action" id="timingOk">Devam</button>';
  $('#timingOk').onclick=()=>good();
 }}

/* ===== w15: ölçüm istasyonu (önce nicelik, sonra birim) ===== */
const AILE={uzunluk:['cm','m','km'],kutle:['g','kg','ton']};
const AILE_AD={uzunluk:'uzunluk',kutle:'kütle'};
function renderStation(r){state.i=0;state.faz=0;state.rapor=[];stationCiz(r)}
function stationOzet(r){$('#stage').innerHTML=`<div class="stack"><div class="caption">İstasyon raporu</div>
 ${r.items.map((it,i)=>`<div class="report"><div><b>${it.emoji}</b><small>${esc(it.ad)}</small></div><div><b>${esc(it.birim)}</b><small>${esc(AILE_AD[it.tur])}</small></div><div><b>${esc(it.yaklasik)}</b><small>yaklaşık</small></div></div>`).join('')}</div>`;
 $('#task').innerHTML=''}
function stationCiz(r){const it=r.items[state.i];
 $('#stage').innerHTML=`<div class="stack"><div class="object-card"><div class="obj-emoji">${it.emoji}</div><div class="obj-name">${esc(it.ad)}</div></div>
  <div class="task-card">${esc(it.soru)}</div>
  ${state.rapor.length?`<div class="unit-strip">${state.rapor.map(x=>`<span class="unit-chip">${esc(x)}</span>`).join('')}</div>`:''}
  <div class="caption">${state.faz===0?'Önce hangi niceliği ölçüyoruz?':'Şimdi bu büyüklüğe uyan birimi seç.'}</div></div>`;
 if(state.faz===0){
  $('#task').innerHTML='<div class="choices"><button class="choice fam-len" data-tur="uzunluk">📏 Uzunluk</button><button class="choice fam-mass" data-tur="kutle">⚖️ Kütle</button></div>';
  $$('[data-tur]').forEach(b=>b.onclick=()=>{
   if(b.dataset.tur!==it.tur)return wrong('Soruyu yeniden oku: bu soru neyin ölçüsünü istiyor, uzunluk mu kütle mi?');
   state.faz=1;stationCiz(r)});
 }else{
  const sinif=it.tur==='uzunluk'?'unit-len':'unit-mass';
  $('#task').innerHTML=`<div class="choices">${AILE[it.tur].map(u=>`<button class="choice ${sinif}" data-birim="${u}">${u}</button>`).join('')}</div>
   <div class="actions"><button class="action" id="aileGeri">↩ Nicelik seçimine dön</button></div>`;
  $('#aileGeri').onclick=()=>{state.faz=0;stationCiz(r)};
  $$('[data-birim]').forEach(b=>b.onclick=()=>{
   if(b.dataset.birim!==it.birim)return wrong(it.ipucu);
   state.rapor.push(it.ad+' ≈ '+it.yaklasik);
   state.i++;state.faz=0;
   if(state.i>=r.items.length){stationOzet(r);good()}
   else{feedback(it.ad+' ≈ '+it.yaklasik);speak(it.ad+' yaklaşık '+it.yaklasik);ertele(()=>stationCiz(r),FAST?30:820)}});
 }}

/* ===== w16: banka gişesi (para eşdeğerliği) ===== */
const PARALAR=[25,50,100,500,1000];
function paraGorsel(k){return k>=500
 ? `<span class="banknote${k===1000?' n1000':''}">${k/100} TL</span>`
 : `<span class="coin c${k}">${k===100?'1 TL':k+' kr'}</span>`}
function kurusYaz(k){return `${k} kr = ${Math.floor(k/100)} TL ${k%100} kr`}
function tepsiPara(list){const gruplar=[];let cur=[],s=0;
 for(const k of list){cur.push(k);s+=k;if(s>=100){gruplar.push({p:cur,tam:s===100});cur=[];s=0}}
 if(cur.length)gruplar.push({p:cur,tam:false});
 return `<div class="tray">${gruplar.length?gruplar.map(g=>`<div class="tray-group${g.tam?' full':''}">${g.p.map(paraGorsel).join('')}${g.tam?'<small>1 TL</small>':''}</div>`).join(''):'<div class="caption">Tepsi boş</div>'}</div>`}
function hedefSimdi(r){return r.hedefler[state.hedefIx]}
function renderPara(r){state.tepsi=[];state.hedefIx=0;state.gecmis=[];paraCiz(r)}
function paraCiz(r){const h=hedefSimdi(r),toplam=state.tepsi.reduce((a,b)=>a+b,0);
 $('#stage').innerHTML=`<div class="stack"><div class="till">${esc(h.not)}</div>${tepsiPara(state.tepsi)}
  <div class="lift-info">${kurusYaz(toplam)}</div>
  <div class="caption">Hedef: ${kurusYaz(h.tutar)}${toplam>h.tutar?` · ${toplam-h.tutar} kr fazla`:toplam<h.tutar?` · ${h.tutar-toplam} kr kaldı`:''}</div></div>`;
 $('#task').innerHTML=`<div class="actions">${PARALAR.map(k=>{const acik=h.izin.indexOf(k)>=0;
   return `<button class="action money${acik?'':' kilitli'}" data-para="${k}">${paraGorsel(k)}${acik?'':'<i class="lock">🔒</i>'}</button>`}).join('')}</div>
  <div class="actions"><button class="action" id="geriAl">↩ Son parayı geri al</button></div>`;
 $$('[data-para]').forEach(b=>b.onclick=()=>paraKoy(r,+b.dataset.para));
 $('#geriAl').onclick=()=>{if(state.tepsi.length){state.tepsi.pop();paraCiz(r)}}}
function paraKoy(r,k){const h=hedefSimdi(r);
 if(h.izin.indexOf(k)<0){feedback(h.kilit,true);speak(h.kilit);return}
 state.tepsi.push(k);const t=state.tepsi.reduce((a,b)=>a+b,0);
 if(t!==h.tutar)return paraCiz(r);
 const imza=state.tepsi.slice().sort((a,b)=>a-b).join('-');
 if(h.farkli&&state.gecmis.indexOf(imza)>=0){feedback('Bu bileşimi az önce kullandın; başka paralarla dene.',true);
  speak('Aynı bileşimi kullandın. Farklı paralarla dene.');state.tepsi=[];return paraCiz(r)}
 state.gecmis.push(imza);state.hedefIx++;
 if(state.hedefIx>=r.hedefler.length){paraCiz2(r);good();return}
 feedback('Doğru ödeme: '+kurusYaz(h.tutar));speak(h.onay||('Tam '+kurusYaz(h.tutar)));
 state.tepsi=[];ertele(()=>paraCiz(r),FAST?30:900)}
function paraCiz2(r){const h=r.hedefler[r.hedefler.length-1];
 $('#stage').innerHTML=`<div class="stack">${tepsiPara(state.tepsi)}<div class="lift-info">${kurusYaz(h.tutar)}</div></div>`}

/* ===== ortak: sayı doğrusu ===== */
function sayiDogrusu(alt,ust,isaretler){const w=ust-alt||1;
 return `<div class="numline"><div class="nl-bar"></div>${isaretler.map(m=>`<i class="nl-mark" style="left:${((m.v-alt)/w*100).toFixed(1)}%;--c:${m.renk||'#e95e77'}"><b>${esc(m.etiket!=null?m.etiket:m.v)}</b></i>`).join('')}<span class="nl-end left">${alt}</span><span class="nl-end right">${ust}</span></div>`}

/* ===== w17: zihin arenası (tahmin → kesin sonuç → fark → yorum) ===== */
function O(etiket,deger){return{etiket:String(etiket),deger}}
function arenaTur(a,b,op,ipuclari){
 const yuv=n=>Math.round(n/100)*100, alt=n=>Math.floor(n/100)*100, ust=n=>Math.ceil(n/100)*100;
 const ya=yuv(a), yb=yuv(b);
 const tahmin=op==='+'?ya+yb:ya-yb, gercek=op==='+'?a+b:a-b, fark=Math.abs(gercek-tahmin);
 const parca=[Math.floor(b/100)*100, Math.floor(b%100/10)*10, b%10].filter(x=>x>0);
 const adimlar=[];
 [a,b].forEach(n=>{const k1=alt(n),k2=ust(n);
  adimlar.push({soru:`${n} en yakın yüzlüğe hangi sayıya yuvarlanır?`,
   sahne:sayiDogrusu(k1,k2,[{v:n,etiket:n,renk:'#e95e77'}])+
    `<div class="caption">Kırmızı çizgi hangi uca daha yakın duruyor?</div>`,
   secenekler:[O(k1,k1),O(k2,k2)],dogru:yuv(n),
   ipucu:`${n} sayısının ${k1}'e uzaklığı ${n-k1}, ${k2}'e uzaklığı ${k2-n}. Hangisi daha küçük?`});
 });
 let cari=a;
 parca.forEach(p=>{const sonuc=op==='+'?cari+p:cari-p;
  adimlar.push({soru:`${cari} ${op} ${p} = ?`,
   sahne:`<div class="caption">Sayıyı parçalara ayırıp adım adım işle: ${b} = ${parca.join(' + ')}</div>`,
   secenekler:[O(sonuc-10,sonuc-10),O(sonuc,sonuc),O(sonuc+100,sonuc+100)],dogru:sonuc,
   ipucu:`${cari} sayısına ${p} eklerken hangi basamak değişir? Basamağı yeniden say.`});
  cari=sonuc;});
 adimlar.push({soru:'Tahminle kesin sonuç arasındaki fark kaç?',
  sahne:sayiDogrusu(Math.min(tahmin,gercek)-40,Math.max(tahmin,gercek)+40,
   [{v:tahmin,etiket:'tahmin '+tahmin,renk:'#3f87b7'},{v:gercek,etiket:'kesin '+gercek,renk:'#2f9e5e'}]),
  secenekler:[O(fark,fark),O(fark+10,fark+10),O(fark+100,fark+100)],dogru:fark,
  ipucu:'İki işareti sayı doğrusunda karşılaştır: büyük sayıdan küçüğü çıkar.'});
 adimlar.push({soru:'Bu tahmin kesin sonuca ne kadar yakın?',
  sahne:sayiDogrusu(Math.min(tahmin,gercek)-40,Math.max(tahmin,gercek)+40,
   [{v:tahmin,etiket:'tahmin '+tahmin,renk:'#3f87b7'},{v:gercek,etiket:'kesin '+gercek,renk:'#2f9e5e'}]),
  secenekler:[O('10’dan yakın','yakin'),O('10 ile 100 arası','orta'),O('100’den uzak','uzak')],
  dogru:fark<10?'yakin':fark<100?'orta':'uzak',
  ipucu:'Az önce bulduğun farka bak: 10’dan küçük mü, 100’den büyük mü?'});
 return {kind:'arena',a,b,op,ya,yb,tahmin,gercek,fark,adimlar,
  prompt:ipuclari.prompt,result:ipuclari.result};
}
function arenaPano(r){const bilinen=[];
 if(state.adim>0)bilinen.push(`${r.a} ≈ ${r.ya}`);
 if(state.adim>1)bilinen.push(`${r.b} ≈ ${r.yb}`);
 if(state.adim>1)bilinen.push(`tahmin ${r.tahmin}`);
 if(state.adim>=r.adimlar.length-2)bilinen.push(`kesin ${r.gercek}`);
 if(state.adim>=r.adimlar.length-1)bilinen.push(`fark ${r.fark}`);
 return `<div class="board">${r.a} ${r.op} ${r.b}</div>${bilinen.length?`<div class="board-log">${bilinen.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}`}
function arenaOzet(r){$('#stage').innerHTML=`<div class="stack"><div class="board">${r.a} ${r.op} ${r.b} = ${r.gercek}</div>${sayiDogrusu(Math.min(r.tahmin,r.gercek)-40,Math.max(r.tahmin,r.gercek)+40,[{v:r.tahmin,etiket:'tahmin '+r.tahmin,renk:'#3f87b7'},{v:r.gercek,etiket:'kesin '+r.gercek,renk:'#2f9e5e'}])}<div class="talk">Fark ${r.fark} birim</div></div>`;$('#task').innerHTML=''}
function renderArena(r){state.adim=0;arenaCiz(r)}
function arenaCiz(r){const a=r.adimlar[state.adim];
 $('#stage').innerHTML=`<div class="stack">${arenaPano(r)}${a.sahne||''}</div>`;
 $('#task').innerHTML=`<div class="caption">${esc(a.soru)}</div><div class="choices">${a.secenekler.map((o,i)=>`<button class="choice" data-choice="${i}">${esc(o.etiket)}</button>`).join('')}</div>`;
 $$('[data-choice]').forEach(b=>b.onclick=()=>{
  if(a.secenekler[+b.dataset.choice].deger!==a.dogru)return wrong(a.ipucu);
  state.adim++;
  if(state.adim>=r.adimlar.length){arenaOzet(r);good()}
  else{feedback('Doğru');arenaCiz(r)}})}

/* ===== w18: akıllı asansör (toplama-çıkarmanın tersliği) ===== */
function tersSahne(r){const c=r.cift,ix=Math.min(state.ix,c.length-1),bitti=state.ix>=c.length,h=252,fark=r.tavan-r.taban;
 const y=v=>h-(v-r.taban)/fark*h;
 let tik='';for(let v=r.taban;v<=r.tavan;v+=r.adim)tik+=`<div class="tick" style="top:${y(v).toFixed(1)}px"><b>${v}</b></div>`;
 const izler=(state.izler||[]).map(z=>`<i class="iz ${z.yon}" style="top:${Math.min(y(z.a),y(z.b)).toFixed(1)}px;height:${Math.abs(y(z.a)-y(z.b)).toFixed(1)}px"></i>`).join('');
 const d=state.deger;
 return `<div class="lift-wrap"><div class="shaft2" style="height:${h}px">${tik}${izler}<div class="cabin2" id="cabin2" style="top:${(y(d)-13).toFixed(1)}px">${d}</div></div>
  <div class="stack"><div class="caption">${bitti?'İki yol da tamam':'Görev '+(ix+1)+'/'+c.length}</div><div class="digital">${bitti?'✓':c[ix].bas+' '+c[ix].islem+' '+c[ix].mik}</div>
  <div class="caption">Mavi iz: çıkış<br>Kırmızı iz: dönüş</div>${(state.yazi||[]).map(x=>`<div class="talk">${esc(x)}</div>`).join('')}</div></div>`}
function tersCiz(r){$('#stage').innerHTML=tersSahne(r);const sh=$('.shaft2');if(!sh)return;

 sh.onpointerdown=e=>{e.preventDefault();state.tut=true;sh.setPointerCapture&&sh.setPointerCapture(e.pointerId);tasi(e)};
 sh.onpointermove=e=>{if(state.tut)tasi(e)};
 sh.onpointerup=()=>state.tut=false;sh.onpointercancel=()=>state.tut=false}

 $$('[data-ters]').forEach(b=>b.onclick=()=>setTers(state.deger+(+b.dataset.ters)));
 $('#tersOk').onclick=()=>checkTers(r)}
function checkTers(r){if(state.ix>=r.cift.length)return;const c=r.cift[state.ix];
 if(state.deger!==c.hedef)return wrong(`${c.bas} katından ${c.islem==='+'?'yukarı':'aşağı'} ${c.mik} birim gitmelisin. Şu an ${c.bas} ile ${state.deger} arasında ${Math.abs(state.deger-c.bas)} birim var.`);
 state.izler=(state.izler||[]).concat({a:c.bas,b:c.hedef,yon:c.islem==='+'?'up':'down'});
 state.yazi=(state.yazi||[]).concat(`${c.bas} ${c.islem} ${c.mik} = ${c.hedef}`);
 state.ix++;

const PV_AD=['on binler','binler','yüzler','onlar','birler'];
function pvTablo(n,onceki){const s=String(n).padStart(5,' ').split('');

 return `<div class="pv-table">${s.map((d,i)=>`<div class="pv-col"><div class="pv-head">${PV_AD[i]}</div>

function renderKargo(r){state.ix=0;state.deger=r.islemler[0].baslangic;state.onceki=null;state.aciklama='';kargoCiz(r)}
function kargoCiz(r){const it=r.islemler[state.ix];
 $('#stage').innerHTML=`<div class="stack"><div class="board">${it.baslangic} ${it.islem} = ?</div>
  ${pvTablo(state.deger,state.onceki)}
  <div class="caption">Kargo kutularını basamak tablosunda kaydır.</div>
  ${state.aciklama?`<div class="talk">${esc(state.aciklama)}</div>`:''}</div>`;
 $('#task').innerHTML=`<div class="actions"><button class="action" data-kay="2">◀◀ 2 sola</button><button class="action" data-kay="1">◀ 1 sola</button><button class="action" data-kay="-1">1 sağa ▶</button><button class="action" data-kay="-2">2 sağa ▶▶</button></div>
  <div class="actions"><button class="action" id="kargoSifir">↺ Baştan</button><button class="action" id="kargoOk">Mühürle</button></div>`;
 $$('[data-kay]').forEach(b=>b.onclick=()=>kaydir(+b.dataset.kay));
 $('#kargoSifir').onclick=()=>{state.deger=it.baslangic;state.onceki=null;state.aciklama='';kargoCiz(r)};
 $('#kargoOk').onclick=()=>checkKargo(r)}
function kaydir(k){const r=round();state.onceki=state.deger;
 if(k>0){state.deger=state.deger*Math.pow(10,k);state.aciklama='Her rakam '+k+' basamak sola geçti; basamak değeri '+(k===1?'10':'100')+' katına çıktı. Boşalan basamağa yer tutucu 0 kondu.'}
 else{const b=Math.pow(10,-k);
  if(state.deger%b!==0){state.onceki=null;feedback('Bu sayı o kadar sağa kayamaz',true);
   state.aciklama='Sağa kaydırmak için sondaki basamakların 0 olması gerekir. '+state.deger+' sayısında yeterli 0 yok.';return kargoCiz(r)}
  state.deger=state.deger/b;state.aciklama='Her rakam '+(-k)+' basamak sağa geçti; basamak değeri '+(k===-1?'10':'100')+' kat küçüldü.'}
 kargoCiz(r)}
function checkKargo(r){const it=r.islemler[state.ix];
 if(state.deger!==it.hedef)return wrong(it.ipucu||'Tabloya bak: rakamlar doğru yöne ve doğru kadar kaydı mı?');
 state.aciklama=it.anlat;state.ix++;
 if(state.ix>=r.islemler.length){kargoCiz2(r);good();return}
 feedback(it.baslangic+' '+it.islem+' = '+it.hedef);speak(it.anlat);
 state.deger=r.islemler[state.ix].baslangic;state.onceki=null;
 ertele(()=>{state.aciklama='';kargoCiz(r)},FAST?30:900)}
function kargoCiz2(r){$('#stage').innerHTML=`<div class="stack">${r.islemler.map(it=>`<div class="talk">${esc(it.baslangic+' '+it.islem+' = '+it.hedef)}</div>`).join('')}${pvTablo(state.deger,null)}</div>`}

function renderSeker(r){state.faz=0;state.kutular=Array.from({length:r.kutu},()=>0);state.kalan=r.kutu*r.her;state.uyari=-1;sekerCiz(r)}
function ritim(r){const dolu=state.kutular.filter(x=>x===r.her).length;

 <div class="rhythm" id="ritim">${ritim(r)}</div>
 ${state.faz>0?`<div class="talk">${esc(r.kutu+' grup × '+r.her+' = '+(r.kutu*r.her))}</div>`:''}</div>`}
function sekerCiz(r){$('#stage').innerHTML=sekerSahne(r);
 if(state.faz===0){

  $$('[data-kutu]').forEach(el=>el.onclick=()=>sekerKoy(r,+el.dataset.kutu));
 }else{
  const liste=state.faz===1?r.carpma:r.bolme;
  $('#task').innerHTML=`<div class="caption">${esc(state.faz===1?'Kutulara uyan çarpma ifadesini seç.':'Aynı kutuları bozmadan doğru bölme ifadesini seç.')}</div>
   <div class="choices">${liste.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.label)}</button>`).join('')}</div>`;
  $$('[data-choice]').forEach(b=>b.onclick=()=>{
   if(!liste[+b.dataset.choice].correct)return wrong(state.faz===1?'Kaç kutu var ve her kutuda kaç tane var? İfadeyi buna göre kur.':'Toplam nesneyi kutu sayısına bölünce her kutudaki sayı çıkar.');
   state.faz++;
   if(state.faz>2){sekerCiz(r);good();return}
   feedback('Doğru');sekerCiz(r)});
 }}
/* Tek dokunuşta bütün sahneyi yeniden kurmak 32 dokunuşta ağır kalıyordu:
   yalnız ilgili kutu, bant ve ritim şeridi güncelleniyor. */
function sekerKoy(r,i){
 const kutu=$(`[data-kutu="${i}"]`);
 if(state.kutular[i]>=r.her){feedback('Bu kutu doldu',true);speak('Bu kutuda zaten '+r.her+' tane var. Boş kutulara bak.');
  if(kutu){kutu.classList.add('uyari');setTimeout(()=>kutu.classList.remove('uyari'),700)}return}
 if(!state.kalan)return;
 state.kutular[i]++;state.kalan--;
 if(kutu){kutu.insertAdjacentHTML('beforeend',`<span>${r.ikon}</span>`);
  if(state.kutular[i]===r.her)kutu.classList.add('dolu')}
 const bant=$('#belt'),say=$('#beltSay');
 if(bant&&bant.lastElementChild)bant.removeChild(bant.lastElementChild);
 if(bant&&!state.kalan)bant.innerHTML='<span class="caption">Bant boşaldı</span>';
 if(say)say.textContent=`Bantta ${state.kalan} ${r.ad} kaldı`;
 const rt=$('#ritim');if(rt)rt.innerHTML=ritim(r);
 if(state.kalan===0&&state.kutular.every(x=>x===r.her)){
  state.faz=1;feedback('Bütün kutular eşit doldu');speak(r.kutu+' grup, her grupta '+r.her+' tane');sekerCiz(r)}}

   Artık kart sabit, sayılar nokta çiftleriyle gösteriliyor; çocuk önce
   tahmin ediyor, sonra kural kartını kendisi yerleştiriyor. */
function noktaCifti(n){
 const cift=Math.floor(n/2),artan=n%2;
 return `<span class="dot-pairs">${'<i class="pair"></i>'.repeat(cift)}${artan?'<i class="odd"></i>':''}</span>`}
function labSahne(a,b){return()=>`<div class="lab-card"><div class="term">${a} ${noktaCifti(a)}</div>
 <div class="plus">+</div><div class="term">${b} ${noktaCifti(b)}</div></div>
 <div class="caption">Eşleşmeden kalan nokta sayının tek olduğunu gösterir</div>`}
function labTur(a,b,dogru,ipucu,sonuc){
 return{kind:'choice',prompt:`${a} + ${b} işleminin sonucu tek mi çift mi? Önce tahmin et.`,
  scene:labSahne(a,b),
  choices:[{label:'TEK',correct:dogru==='TEK'},{label:'ÇİFT',correct:dogru==='ÇİFT'}],
  hint:ipucu,result:sonuc}}

   ve kuralı kendisi söylüyor. */
function kuleSahne(dizi,gorunen){return()=>`<div class="tower-row">${dizi.slice(0,gorunen).map((n,i)=>
 `<div class="tower"><div class="blocks">${'<i class="block"></i>'.repeat(n)}</div><b>${n}</b><small>${i+1}. adım</small></div>`).join('')}
 <div class="tower ghost"><div class="blocks"></div><b>?</b><small>${gorunen+1}. adım</small></div></div>`}
function kuleTur(dizi,gorunen,ipucu,sonuc){
 const dogru=dizi[gorunen];
 const secenekler=[dogru,dogru+dizi[1]-dizi[0],dogru-1].map(v=>({label:String(v),correct:v===dogru}));
 return{kind:'choice',prompt:`${gorunen+1}. adımda kaç blok olmalı?`,scene:kuleSahne(dizi,gorunen),
  choices:secenekler.sort(()=>0),hint:ipucu,result:sonuc}}
