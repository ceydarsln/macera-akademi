<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Simetri Atölyesi — Phaser 3</title>
<script src="phaser.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1c1520; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  #oyun { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="oyun"></div>
<script>
/* =====================================================================
   SİMETRİ ATÖLYESİ — Phaser 3
   (mekanik: mirrorGrid + foldMirror · 5 + 3 = 8 oyun)
   ---------------------------------------------------------------------
   Kazanım: MAT.3.3.7.a / b — Bir parçası verilen simetrik şekli simetri
   doğrusuna göre tamamlar. MAT.2.3.7 — Katlama yoluyla simetri eksenini
   ve simetrik şekli oluşturur.

   NOT — iki mekanik tek şablon:
   mirrorGrid "aynanın karşı yanındaki kareyi doğru renkle doldur",
   foldMirror "katlayınca ne çıkar" mantığıydı. İkisi de simetri
   doğrusunun aynı işini öğretiyor; şablon tur tipine göre (izgara /
   katlama) ilgili aşamayı kuruyor.

   Fizik    : Arcade. Doğru karo dolunca boya kıvılcımı; kilim tamamlanınca
              düğümler yerçekimiyle savrulur. Katlama turunda sol yarı
              gerçekten aynanın üstüne KATLANIR ve iki yarı çarpışır.
   ===================================================================== */

const EN = 480, BOY = 800;

const RENK = {
  zeminUst : 0x2a1f2e,
  zeminAlt : 0x4a3752,
  dogru    : 0x34c47b,
  yanlis   : 0xf07575,
  eksen    : 0xff7bac,
  bos      : 0x3a2d42,
  vurgu    : 0xffd166
};

/* ---------------- uygulama köprüsü ----------------
   Uygulamanın içine iframe olarak gömüldüğünde adres  simetri.html#oyun=w35
   biçiminde olur. Sayfa uygulamayla AYNI kaynaktan sunulduğu için üst
   pencereden katalog verisi doğrudan okunabiliyor. Böylece 5 mirrorGrid +
   3 foldMirror oyununun hepsi bu tek şablonla oynanıyor. Kazanınca
   completeGame() çağrılır; XP, altın, kutlama ve sıradaki oyuna geçiş
   uygulamada kalır.
   Köprü yoksa (dosya tek başına açıldıysa) örnek içerik oynanır.        */
const KOPRU = (function(){
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const id = p.get('oyun');
    if (id && window.parent && window.parent !== window &&
        typeof window.parent.getGame === 'function'){
      const g = window.parent.getGame(id);
      if (g && g.cfg) return {
        oyun: g, cfg: g.cfg,
        bitir(mesaj, puan){ try{ window.parent.completeGame(mesaj || '', puan); }catch(e){} },
        /* Turun kendi metnini uygulamanın sesiyle okutur (Piper). */
        oku(metin){ try{ if (window.parent.oku) window.parent.oku(metin); }catch(e){} },
        /* Kaybetme ekranından: bu oyunu bırak, sıradakine geç. */
        atla(){ try{ if (window.parent.sonrakiOyunaGec) window.parent.sonrakiOyunaGec(); }catch(e){} }
      };
    }
  }catch(e){ /* çapraz kaynak engeli: tek başına oynanır */ }
  return null;
})();

/* HTML varlıklarını çöz: katalogda "Pay &lt; payda" gibi yazımlar var,
   çözülmezse ekranda "&lt;" olarak görünüyor ve öyle okunuyor. */
function varlikCoz(m){
  return String(m)
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
    .replace(/&hellip;/gi, '…').replace(/&mdash;/gi, '—').replace(/&ndash;/gi, '–')
    .replace(/&times;/gi, '×').replace(/&divide;/gi, '÷').replace(/&deg;/gi, '°')
    .replace(/&rarr;/gi, '→').replace(/&larr;/gi, '←')
    .replace(/&amp;/gi, '&');            /* en sona: çift çözmeyi önler */
}

function duzMetin(x){
  return varlikCoz(String(x == null ? '' : x).replace(/<br\s*\/?>/gi,' ')
    .replace(/<[^>]+>/g,'')).replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}

/* Katalogda renkler '#e0505c' biçiminde metin; Phaser sayı istiyor. */
function renkSayi(m, varsayilan){
  const s = String(m == null ? '' : m).trim().replace(/^#/, '');
  if (/^[0-9a-fA-F]{6}$/.test(s)) return parseInt(s, 16);
  if (/^[0-9a-fA-F]{3}$/.test(s))
    return parseInt(s[0]+s[0]+s[1]+s[1]+s[2]+s[2], 16);
  const adlar = { white:0xffffff, black:0x000000, red:0xe0505c, blue:0x2f6b9a };
  return (s.toLowerCase() in adlar) ? adlar[s.toLowerCase()] : varsayilan;
}

const VARSAYILAN = {   /* şablon tek başına açıldığında: uygulamadaki w35 */
  instruction:'Anadolu kilimimizin deseni yarım kaldı! Pembe <b>simetri doğrusunu ayna gibi</b> düşünerek diğer yarıyı dokur 🧶',
  cols:8, rows:6, axis:'v',
  colors:['#e0505c','#f0c36b','#2f6b9a','#3a7d52'],
  given:[[3,0,0],
         [2,1,1],[3,1,0],
         [1,2,2],[2,2,1],[3,2,0],
         [1,3,2],[2,3,1],[3,3,0],
         [2,4,1],[3,4,0],
         [3,5,0]],
  wrongMsg:'Burada simetrik eş yok! Aynanın karşı yanındaki kareye iyi bak 🧶',
  tip:'🧶 Simetri doğrusuna eşit uzaklıktaki kareler aynı renkte olmalı.',
  successMsg:'Tezgah tıkırdadı! Dikey simetriye uygun bir kilim deseni dokudun 🧶'
};

const CFG = KOPRU ? KOPRU.cfg : VARSAYILAN;

/* ---------------------------------------------------------------------
   İÇERİK — katalogdaki iki simetri mekaniği
   ---------------------------------------------------------------------
   mirrorGrid : cfg.cols/rows/axis/colors/given[[sütun,satır,renk]]
                → verilen her karenin AYNADAKİ EŞİNİ doğru renkle doldur.
                  Eşleme kuralı uygulamadaki mgTargets() ile birebir aynı:
                  dikey eksende (cols-1-x, y), yatayda (x, rows-1-y),
                  'both' ise üçü birden; eksen üstündeki kare kendisidir,
                  zaten verilmiş kareler istenmez.
   foldMirror : cfg.half satır içi SVG parçası (sol yarı), cfg.question +
                cfg.options → "katlayınca ne çıkar" sorusu, doğru cevapta
                sol yarı gerçekten aynanın üstüne katlanıp açılıyor.
   ------------------------------------------------------------------- */
const KATLAMA = !!CFG.half;   /* foldMirror mu? */

const OYUN_ADI = KOPRU ? duzMetin(KOPRU.oyun.title) : 'SİMETRİ\nATÖLYESİ';
const OYUN_EMO = KOPRU ? (KOPRU.oyun.emo || '🪞') : '🧶';
const TALIMAT  = duzMetin(CFG.instruction) || 'Aynanın karşı yanını tamamla';
const IPUCU    = duzMetin(CFG.tip) ||
  'Simetri doğrusuna eşit uzaklıktaki kareler aynı renkte olmalı.';
const BASARI   = duzMetin(CFG.successMsg) ||
  'Simetri ustası! Ayna doğrusunun iki yanının birbirinin yansıması olduğunu gösterdin 🪞';
const BASLIK_KISA = KATLAMA ? 'KATLAMA VE SİMETRİ' : 'SİMETRİ ATÖLYESİ';

/* Aynadaki eşleri hesapla — uygulamadaki mgTargets() ile aynı kural. */
function aynaHedefleri(c){
  const verilen = c.given || [];
  const eksen = c.axis || 'v';
  const varMi = (x, y) => verilen.some(g => g[0] === x && g[1] === y);
  const hedef = {};
  verilen.forEach(g => {
    const x = g[0], y = g[1], ri = g[2] || 0;
    const mx = c.cols - 1 - x, my = c.rows - 1 - y;
    const esler = [];
    if (eksen === 'v' || eksen === 'both') esler.push([mx, y]);
    if (eksen === 'h' || eksen === 'both') esler.push([x, my]);
    if (eksen === 'both')                  esler.push([mx, my]);
    esler.forEach(e => {
      if (e[0] === x && e[1] === y) return;   /* eksen üstündeki kare kendisi */
      if (varMi(e[0], e[1])) return;          /* zaten verilmiş */
      hedef[e[0] + ',' + e[1]] = ri;
    });
  });
  return hedef;
}

const TURLAR = (function(){
  const son = duzMetin(CFG.resultMsg);
  if (KATLAMA) return [{
    tip:'katlama',
    gorev: TALIMAT,
    ipucu: duzMetin(CFG.question) || 'Katlayınca ne çıkar?',
    yarimSvg: String(CFG.half || ''),
    secenekler: (CFG.options || []).map(o => ({ etiket:duzMetin(o.label), dogru:!!o.correct })),
    hataMsj: duzMetin(CFG.wrongHint) || 'Sol yarıya bir daha bak — tekrar düşün!',
    sonucAd: duzMetin(CFG.resultName) || '🪞 Simetrik şekil tamam!',
    okuKatlama: duzMetin(CFG.foldSay),
    tamam: son || 'Katlama çizgisinin her iki yanı birbirinin tam yansıması oldu.'
  }];

  const sutun = Math.max(2, Number(CFG.cols) || 8);
  const satir = Math.max(2, Number(CFG.rows) || 6);
  const renkler = (CFG.colors && CFG.colors.length ? CFG.colors : ['#e0505c'])
                    .map(r => renkSayi(r, 0xe0505c));
  return [{
    tip:'izgara',
    gorev: TALIMAT,
    ipucu: duzMetin(CFG.tip) || 'Önce rengi seç, sonra aynadaki kareye dokun.',
    sutun: sutun, satir: satir,
    eksen: CFG.axis || 'v',
    renkler: renkler,
    verilen: (CFG.given || []).map(g => [g[0], g[1], g[2] || 0]),
    hedefler: aynaHedefleri({ cols:sutun, rows:satir, axis:CFG.axis || 'v', given:CFG.given || [] }),
    sutunEtiket: (CFG.colLabels || []).map(duzMetin),
    satirEtiket: (CFG.rowLabels || []).map(duzMetin),
    hataMsj: duzMetin(CFG.wrongMsg) ||
      'Burada simetrik eş yok! Aynanın karşı yanındaki kareye iyi bak.',
    tamam: son || 'Desen tamamlandı — iki yan birbirinin aynası!'
  }];
})();

const CAN_SAYISI = 3;

/* --- Yerleşim -------------------------------------------------------- */
/* Izgara 6x6 ile 8x8 arasında değişiyor; karo boyu ekrana göre hesaplanır
   (sabit 46 piksel, 8x8 tabloyu paletin üstüne taşırıyordu). */
const IZG_UST  = 258;
const PALET_Y  = 690;
const KARO = (function(){
  const t = TURLAR[0];
  if (!t || t.tip !== 'izgara') return 46;
  const etiketVar = t.sutunEtiket.length || t.satirEtiket.length;
  const enBos  = EN - 36 - (etiketVar ? 26 : 0);
  const boyBos = (t.renkler.length > 1 ? PALET_Y - 66 : PALET_Y + 26) - IZG_UST - 14;
  return Math.floor(Math.min(enBos / t.sutun, boyBos / t.satir));
})();

/* Katlama sahnesi: DOM sürümüyle aynı viewBox (0 0 200 140), eksen x=100 */
const KAT_VB_EN  = 200;
const KAT_VB_BOY = 140;
const KAT_UST    = 268;
const KAT_OLCEK  = 1.9;


/* =====================================================================
   SATIR İÇİ SVG PARÇASI ÇİZİCİ (yalnız foldMirror için)
   ---------------------------------------------------------------------
   Katalogdaki cfg.half bir SVG PARÇASI: <svg> sarmalayıcısı yok, içinde
   <path d="M… C…"> kübik eğrileri var. Ortak çizici (svgciz.js) yol
   komutlarından C/Q'yu desteklemiyor — kalp ve kelebek yarımları köşeli
   çıkardı. Bu yüzden burada küçük, C destekli bir çizici var: yalnızca
   path / circle / ellipse / rect etiketlerini tanıyor, o da bu üç oyunun
   içeriğini tam karşılıyor.
   Koordinatlar viewBox ölçeğinde (0 0 200 140) geliyor; dönüşüm
   çağrıldığı yerde veriliyor.
   ===================================================================== */
function svgSayilar(m){
  return (String(m).match(/-?\d*\.?\d+(?:[eE][-+]?\d+)?/g) || []).map(Number);
}

function svgOzellik(etiket){
  const o = {};
  const re = /([a-zA-Z-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g;
  let m;
  while ((m = re.exec(etiket))) o[m[1].toLowerCase()] = (m[2] !== undefined ? m[2] : m[3]);
  return o;
}

/* kübik bezier örnekleme */
function bezierNoktalari(p0, p1, p2, p3, adim){
  const cikti = [];
  for (let i = 1; i <= adim; i++){
    const t = i / adim, u = 1 - t;
    cikti.push({
      x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
    });
  }
  return cikti;
}

/* d özniteliğini kapalı/açık nokta dizilerine çevirir (M L H V C S Z) */
function svgYol(d){
  const jetonlar = String(d).match(/[MmLlHhVvCcSsZz][^MmLlHhVvCcSsZzAa]*/g) || [];
  const parcalar = [];
  let simdi = [], x = 0, y = 0, sonKontrol = null;
  const bitir = (kapali) => {
    if (simdi.length > 1){ simdi.kapali = !!kapali; parcalar.push(simdi); }
    simdi = [];
  };
  jetonlar.forEach(j => {
    const komut = j[0], buyuk = komut.toUpperCase();
    const goreli = komut !== buyuk;
    const p = svgSayilar(j.slice(1));
    switch (buyuk){
      case 'M':
        bitir(false);
        x = goreli ? x + p[0] : p[0]; y = goreli ? y + p[1] : p[1];
        simdi = [{ x:x, y:y }];
        for (let i = 2; i + 1 < p.length; i += 2){
          x = goreli ? x + p[i] : p[i]; y = goreli ? y + p[i+1] : p[i+1];
          simdi.push({ x:x, y:y });
        }
        sonKontrol = null;
        break;
      case 'L':
        for (let i = 0; i + 1 < p.length; i += 2){
          x = goreli ? x + p[i] : p[i]; y = goreli ? y + p[i+1] : p[i+1];
          simdi.push({ x:x, y:y });
        }
        sonKontrol = null;
        break;
      case 'H':
        for (let i = 0; i < p.length; i++){ x = goreli ? x + p[i] : p[i]; simdi.push({ x:x, y:y }); }
        sonKontrol = null;
        break;
      case 'V':
        for (let i = 0; i < p.length; i++){ y = goreli ? y + p[i] : p[i]; simdi.push({ x:x, y:y }); }
        sonKontrol = null;
        break;
      case 'C':
        for (let i = 0; i + 5 < p.length; i += 6){
          const p0 = { x:x, y:y };
          const c1 = { x: goreli ? x + p[i]   : p[i],   y: goreli ? y + p[i+1] : p[i+1] };
          const c2 = { x: goreli ? x + p[i+2] : p[i+2], y: goreli ? y + p[i+3] : p[i+3] };
          const p3 = { x: goreli ? x + p[i+4] : p[i+4], y: goreli ? y + p[i+5] : p[i+5] };
          bezierNoktalari(p0, c1, c2, p3, 18).forEach(n => simdi.push(n));
          x = p3.x; y = p3.y; sonKontrol = c2;
        }
        break;
      case 'S':
        for (let i = 0; i + 3 < p.length; i += 4){
          const p0 = { x:x, y:y };
          const c1 = sonKontrol ? { x: 2*x - sonKontrol.x, y: 2*y - sonKontrol.y } : p0;
          const c2 = { x: goreli ? x + p[i]   : p[i],   y: goreli ? y + p[i+1] : p[i+1] };
          const p3 = { x: goreli ? x + p[i+2] : p[i+2], y: goreli ? y + p[i+3] : p[i+3] };
          bezierNoktalari(p0, c1, c2, p3, 18).forEach(n => simdi.push(n));
          x = p3.x; y = p3.y; sonKontrol = c2;
        }
        break;
      case 'Z': {
        const bas = simdi.length ? { x:simdi[0].x, y:simdi[0].y } : null;
        bitir(true);
        if (bas){ simdi = [bas]; x = bas.x; y = bas.y; }
        sonKontrol = null;
        break;
      }
    }
  });
  bitir(false);
  return parcalar;
}

/* SVG parçasını verilen Graphics'e çizer. donustur(x,y) → yerel koordinat */
function svgParcaCiz(g, parca, donustur){
  const metin = String(parca || '');
  const re = /<\s*(path|circle|ellipse|rect)\b([^>]*)>/gi;
  let m;
  while ((m = re.exec(metin))){
    const etiket = m[1].toLowerCase();
    const o = svgOzellik(m[2]);
    const dolgu  = renkSayi(o.fill, null);
    const kalem  = renkSayi(o.stroke, null);
    const kalinlik = Number(o['stroke-width']) || 0;
    const saydam = o.opacity === undefined ? 1 : Math.max(0, Math.min(1, Number(o.opacity)));
    const dolguVar = o.fill !== 'none' && dolgu !== null;
    const kalemVar = o.stroke !== 'none' && kalem !== null && kalinlik > 0;

    if (etiket === 'path'){
      svgYol(o.d).forEach(yol => {
        const n = yol.map(q => donustur(q.x, q.y));
        if (n.length < 2) return;
        if (dolguVar){ g.fillStyle(dolgu, saydam); g.fillPoints(n, true, true); }
        if (kalemVar){
          g.lineStyle(Math.max(1, kalinlik * KAT_OLCEK * 0.6), kalem, saydam);
          g.strokePoints(n, !!yol.kapali, !!yol.kapali);
        }
      });
    } else if (etiket === 'circle'){
      const c = donustur(Number(o.cx) || 0, Number(o.cy) || 0);
      const r = (Number(o.r) || 0) * KAT_OLCEK;
      if (dolguVar){ g.fillStyle(dolgu, saydam); g.fillCircle(c.x, c.y, r); }
      if (kalemVar){ g.lineStyle(Math.max(1, kalinlik * KAT_OLCEK * 0.6), kalem, saydam);
                     g.strokeCircle(c.x, c.y, r); }
    } else if (etiket === 'ellipse'){
      const c = donustur(Number(o.cx) || 0, Number(o.cy) || 0);
      const rx = (Number(o.rx) || 0) * KAT_OLCEK, ry = (Number(o.ry) || 0) * KAT_OLCEK;
      if (dolguVar){ g.fillStyle(dolgu, saydam); g.fillEllipse(c.x, c.y, rx * 2, ry * 2); }
    } else if (etiket === 'rect'){
      const a = donustur(Number(o.x) || 0, Number(o.y) || 0);
      const w = (Number(o.width) || 0) * KAT_OLCEK, h = (Number(o.height) || 0) * KAT_OLCEK;
      const yr = (Number(o.rx) || 0) * KAT_OLCEK;
      if (dolguVar){ g.fillStyle(dolgu, saydam);
                     if (yr > 0) g.fillRoundedRect(a.x, a.y, w, h, yr); else g.fillRect(a.x, a.y, w, h); }
      if (kalemVar){ g.lineStyle(Math.max(1, kalinlik * KAT_OLCEK * 0.6), kalem, saydam);
                     if (yr > 0) g.strokeRoundedRect(a.x, a.y, w, h, yr); else g.strokeRect(a.x, a.y, w, h); }
    }
  }
}

/* =====================================================================
   BOOT
   ===================================================================== */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }
  create(){
    let g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1); g.fillCircle(8, 8, 8);
    g.generateTexture('kivilcim', 16, 16); g.destroy();
    g = this.make.graphics({ add:false });
    for (let r = 14; r > 0; r--){ g.fillStyle(0xffffff, 0.06); g.fillCircle(14, 14, r); }
    g.generateTexture('toz', 28, 28); g.destroy();
    /* kilim düğümü — tamamlanınca savrulur */
    g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1); g.fillRoundedRect(0, 0, 18, 18, 4);
    g.generateTexture('dugum', 18, 18); g.destroy();
    /* Uygulama içinde çocuk oyunu listeden zaten seçti; menüyü atla. */
    this.scene.start(KOPRU ? 'Game' : 'Menu');
  }
}

/* =====================================================================
   Ortak yardımcılar
   ===================================================================== */
function atolyeCiz(sc){
  const g = sc.add.graphics();
  g.fillGradientStyle(RENK.zeminUst, RENK.zeminUst, RENK.zeminAlt, RENK.zeminAlt, 1);
  g.fillRect(0, 0, EN, BOY);
  for (let i = 0; i < 22; i++){
    const s = sc.add.circle(Phaser.Math.Between(6, EN - 6), Phaser.Math.Between(6, BOY - 6),
      Phaser.Math.FloatBetween(1.4, 3.2), 0xffffff, Phaser.Math.FloatBetween(0.04, 0.14));
    sc.tweens.add({ targets:s, alpha:0.02, duration:Phaser.Math.Between(1300, 2900),
      yoyo:true, repeat:-1, delay:Phaser.Math.Between(0, 1900) });
  }
  return g;
}

function dugmeYap(sc, x, y, metin, renk, geriCagri, genislik, yukseklik){
  const W = genislik || 280, H = yukseklik || 60;
  const c = sc.add.container(x, y);
  const g = sc.add.graphics();
  g.fillStyle(renk, 1);
  g.fillRoundedRect(-W / 2, -H / 2, W, H, Math.min(H / 2, 26));
  g.fillStyle(0xffffff, 0.16);
  g.fillRoundedRect(-W / 2, -H / 2, W, H * 0.4, { tl:Math.min(H / 2, 26), tr:Math.min(H / 2, 26), bl:0, br:0 });
  const t = sc.add.text(0, 0, metin, { fontFamily:'system-ui, sans-serif',
    fontSize: H > 52 ? '20px' : '16px', fontStyle:'bold', color:'#ffffff', align:'center' }).setOrigin(0.5);
  c.add([g, t]);
  c.setSize(W, H).setInteractive({ useHandCursor:true });
  c.on('pointerover', () => sc.tweens.add({ targets:c, scale:1.05, duration:110 }));
  c.on('pointerout',  () => sc.tweens.add({ targets:c, scale:1.00, duration:110 }));
  c.on('pointerdown', () => sc.tweens.add({ targets:c, scale:0.93, duration:90, yoyo:true, onComplete:geriCagri }));
  return c;
}

/* =====================================================================
   GAME
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    this.can = CAN_SAYISI; this.puan = 0; this.seri = 0; this.tur = 0; this.kilit = true;
    /* TEKRAR OYNA'da eski nesnelere işaret etmesinler */
    this.karoNesne = null; this.paletNesne = null; this.secimNesne = null;
    this.etiketNesne = null;
    this.mesaj = null; this.katlamaCizim = null; this.izgaraCizim = null;

    atolyeCiz(this);

    this.kivilcimlar = this.add.particles(0, 0, 'kivilcim', {
      speed:{ min:120, max:330 }, angle:{ min:0, max:360 }, scale:{ start:0.8, end:0 },
      alpha:{ start:1, end:0 }, lifespan:600, gravityY:300, blendMode:'ADD', emitting:false }).setDepth(90);
    this.tozlar = this.add.particles(0, 0, 'toz', {
      speed:{ min:40, max:150 }, angle:{ min:200, max:340 }, scale:{ start:0.9, end:2 },
      alpha:{ start:0.5, end:0 }, lifespan:660, emitting:false }).setDepth(80);
    this.dugumler = this.physics.add.group();

    this.izgaraCizim   = this.add.graphics().setDepth(8);
    this.katlamaCizim  = this.add.graphics().setDepth(8);

    this.arayuzKur();
    this.turuBaslat();
  }

  /* ---------- tur ---------- */
  turuBaslat(){
    const t = TURLAR[this.tur];
    this.aktifTur = t;     /* o anki tur — arayüz ve testler buradan okur */
    this.kilit = true;
    if (this.karoNesne)  this.karoNesne.forEach(o => o.destroy());
    if (this.paletNesne) this.paletNesne.forEach(o => o.destroy());
    if (this.secimNesne)  this.secimNesne.forEach(o => o.destroy());
    if (this.etiketNesne) this.etiketNesne.forEach(o => o.destroy());
    this.karoNesne = []; this.paletNesne = []; this.secimNesne = [];
    this.etiketNesne = [];
    this.dugumler.clear(true, true);
    this.izgaraCizim.clear(); this.katlamaCizim.clear();

    this.gorevYazi.setText(t.gorev);
    this.gorevYazi.setFontSize(t.gorev.length > 130 ? '15px'
                             : (t.gorev.length > 80 ? '16px' : '18px'));
    /* İpucu satırı ızgaranın hemen üstünde; yönerge uzunsa onun altına in. */
    this.ipucuYazi.setText(t.ipucu);
    this.ipucuYazi.setY(Math.max(this.gorevYazi.y + this.gorevYazi.height + 4, 200));
    this.tweens.add({ targets:this.gorevYazi, scale:{ from:0.88, to:1 }, duration:280, ease:'Back.easeOut' });

    if (t.tip === 'izgara') this.izgarayiKur(t);
    else                    this.katlamayiKur(t);

    this.time.delayedCall(340, () => { this.kilit = false; });
    this.arayuzuTazele();
  }

  /* ================= mirrorGrid ================= */
  karoNoktasi(t, c, r){
    const solX = this.izgaraSolu(t);
    return { x: solX + c * KARO + KARO / 2, y: IZG_UST + r * KARO + KARO / 2 };
  }

  /* Satranç tablosunda (w36) kenarda harf-sayı etiketleri var; ızgara o
     kadar sağa kayıyor ki etiketler ekranın dışına çıkmasın. */
  izgaraSolu(t){
    const bos = t.satirEtiket.length ? 22 : 0;
    return EN / 2 - (t.sutun * KARO) / 2 + bos / 2;
  }

  izgarayiKur(t){
    this.hucre = [];                    /* hucre[r][c] = renkIndeksi | null */
    for (let r = 0; r < t.satir; r++){
      this.hucre[r] = [];
      for (let c = 0; c < t.sutun; c++) this.hucre[r][c] = null;
    }
    t.verilen.forEach(([c, r, ri]) => { this.hucre[r][c] = ri; });

    /* Beklenen kareler katalog kuralıyla hesaplandı (dikey / yatay /
       her ikisi); eksen üstündekiler ve zaten verilenler listede yok. */
    this.kalan = Object.keys(t.hedefler).map(k => {
      const p = k.split(',');
      return { c:+p[0], r:+p[1], ri:t.hedefler[k] };
    });
    this.secilenRenk = 0;

    this.izgarayiCiz(t);
    this.etiketleriCiz(t);

    /* dokunulabilir kareler */
    for (let r = 0; r < t.satir; r++){
      for (let c = 0; c < t.sutun; c++){
        const p = this.karoNoktasi(t, c, r);
        const k = this.add.rectangle(p.x, p.y, KARO - 4, KARO - 4, 0, 0)
          .setInteractive({ useHandCursor:true }).setDepth(10);
        k.on('pointerdown', () => this.kareyeDokun(t, c, r));
        this.karoNesne.push(k);
      }
    }

    /* Renk paleti — tek renkli oyunlarda (satranç tahtası) gereksiz. */
    if (t.renkler.length > 1) t.renkler.forEach((renk, i) => {
      const ara = Math.min(76, Math.floor((EN - 40) / t.renkler.length));
      const x = EN / 2 + (i - (t.renkler.length - 1) / 2) * ara;
      const c = this.add.container(x, PALET_Y).setDepth(14);
      const g = this.add.graphics();
      c.add(g); c.setSize(64, 52);
      c.setData('renkIdx', i); c.setData('cizim', g);
      this.paletCiz(c, i === 0);
      c.setInteractive({ useHandCursor:true });
      c.on('pointerdown', () => {
        if (this.kilit) return;
        this.secilenRenk = i;
        this.paletNesne.forEach(p => this.paletCiz(p, p.getData('renkIdx') === i));
      });
      this.paletNesne.push(c);
    });
    if (t.renkler.length > 1)
      this.etiketNesne.push(this.add.text(EN / 2, PALET_Y - 42, 'RENK SEÇ',
        { fontFamily:'system-ui, sans-serif', fontSize:'14px', fontStyle:'bold',
          color:'#c9b0d6' }).setOrigin(0.5).setDepth(14));
  }

  paletCiz(c, secili){
    const t = TURLAR[this.tur];
    const g = c.getData('cizim');
    if (!g) return;              /* palet dışı öge — çizilecek bir şey yok */
    g.clear();
    g.fillStyle(t.renkler[c.getData('renkIdx')], 1);
    g.fillRoundedRect(-32, -26, 64, 52, 10);
    g.lineStyle(secili ? 5 : 2, secili ? RENK.vurgu : 0x6a4f75, 1);
    g.strokeRoundedRect(-32, -26, 64, 52, 10);
  }

  izgarayiCiz(t){
    const g = this.izgaraCizim;
    g.clear();
    const solX = this.izgaraSolu(t);
    /* zemin */
    g.fillStyle(0x1a1320, 0.9);
    g.fillRoundedRect(solX - 8, IZG_UST - 8, t.sutun * KARO + 16, t.satir * KARO + 16, 12);
    for (let r = 0; r < t.satir; r++){
      for (let c = 0; c < t.sutun; c++){
        const p = this.karoNoktasi(t, c, r);
        const v = this.hucre[r][c];
        g.fillStyle(v === null ? RENK.bos : t.renkler[v], 1);
        g.fillRoundedRect(p.x - KARO / 2 + 2, p.y - KARO / 2 + 2, KARO - 4, KARO - 4, 6);
        g.lineStyle(1, 0x6a4f75, 0.6);
        g.strokeRoundedRect(p.x - KARO / 2 + 2, p.y - KARO / 2 + 2, KARO - 4, KARO - 4, 6);
      }
    }
    /* Simetri ekseni — katalogdaki axis'e göre dikey, yatay ya da ikisi. */
    const ex = solX + (t.sutun / 2) * KARO;
    const ey = IZG_UST + (t.satir / 2) * KARO;
    g.lineStyle(5, RENK.eksen, 1);
    if (t.eksen === 'v' || t.eksen === 'both')
      g.lineBetween(ex, IZG_UST - 12, ex, IZG_UST + t.satir * KARO + 12);
    if (t.eksen === 'h' || t.eksen === 'both')
      g.lineBetween(solX - 12, ey, solX + t.sutun * KARO + 12, ey);

    /* Verilen desen: içine küçük beyaz nokta — hangi kareler hazır? */
    g.fillStyle(0xffffff, 0.55);
    t.verilen.forEach(v => {
      const p = this.karoNoktasi(t, v[0], v[1]);
      g.fillCircle(p.x, p.y, Math.max(2, KARO * 0.1));
    });
  }

  /* Satranç tahtasının harf-sayı etiketleri (katalogda colLabels/rowLabels) */
  etiketleriCiz(t){
    if (!t.sutunEtiket.length && !t.satirEtiket.length) return;
    const stil = { fontFamily:'system-ui, sans-serif',
                   fontSize: Math.max(10, Math.round(KARO * 0.36)) + 'px',
                   fontStyle:'bold', color:'#c9b0d6' };
    t.sutunEtiket.forEach((e, i) => {
      if (i >= t.sutun) return;
      const p = this.karoNoktasi(t, i, 0);
      this.karoNesne.push(this.add.text(p.x, IZG_UST - 14, e, stil)
        .setOrigin(0.5).setDepth(12));
    });
    t.satirEtiket.forEach((e, i) => {
      if (i >= t.satir) return;
      const p = this.karoNoktasi(t, 0, i);
      this.karoNesne.push(this.add.text(this.izgaraSolu(t) - 13, p.y, e, stil)
        .setOrigin(0.5).setDepth(12));
    });
  }

  kareyeDokun(t, c, r){
    if (this.kilit) return;
    if (this.hucre[r][c] !== null) return;              /* dolu */
    const hedef = this.kalan.find(k => k.c === c && k.r === r);
    if (!hedef){ this.yanlisHamle(t.hataMsj, c, r); return; }
    /* Tek renkli oyunlarda (satranç tahtası) palet yok, renk sorulmaz. */
    if (t.renkler.length > 1 && hedef.ri !== this.secilenRenk){
      this.yanlisHamle('Renk uymadı — aynadaki eşin rengine bak 🎨', c, r);
      return;
    }

    this.hucre[r][c] = hedef.ri;
    this.kalan = this.kalan.filter(k => k !== hedef);
    this.izgarayiCiz(t);
    const p = this.karoNoktasi(t, c, r);
    this.kivilcimlar.setParticleTint(t.renkler[hedef.ri]);
    this.kivilcimlar.explode(10, p.x, p.y);
    this.puanEkle(30, p.x, p.y - 20);
    this.arayuzuTazele();          /* HUD'daki "kalan" sayacı */

    if (!this.kalan.length) this.turuBitir(t);
  }

  /* ================= foldMirror ================= */
  /* viewBox koordinatı → yarım kabının YEREL koordinatı.
     Eksen (x=100) kabın merkezinde; böylece aynalama scaleX=-1 oluyor. */
  katViewBox(vx, vy){
    return { x:(vx - KAT_VB_EN / 2) * KAT_OLCEK, y:vy * KAT_OLCEK };
  }

  katlamayiKur(t){
    /* kâğıt ve katlama ekseni */
    this.katlamaCiz(t, 0);

    /* Sol yarı: katalogdaki cfg.half satır içi SVG parçası. */
    const yarim = () => {
      const kap = this.add.container(EN / 2, KAT_UST).setDepth(16);
      const g = this.add.graphics();
      kap.add(g);
      svgParcaCiz(g, t.yarimSvg, (vx, vy) => this.katViewBox(vx, vy));
      return kap;
    };
    /* Şeklin yarımları secimNesne'ye KONMAZ: katlamaSec() o listeyi
       soluklaştırıyor, şekil de soluyordu. */
    this.yarimKap = yarim();
    this.etiketNesne.push(this.yarimKap);

    /* Ayna kopyası — doğru cevaptan sonra scaleX 0 → -1 ile açılır. */
    this.aynaKap = yarim();
    this.aynaKap.setScale(0, 1).setVisible(false);
    this.etiketNesne.push(this.aynaKap);

    /* Seçenek etiketleri uzun cümleler ("Eş parça (aynı boyut, aynadaki
       gibi)"); yan yana sığmıyor, alt alta diziliyor. */
    const n = t.secenekler.length;
    const H = n >= 3 ? 50 : 58;
    const ad = H + 10;
    const y0 = 552 + (BOY - 24 - 552 - (n * ad - 10)) / 2;
    t.secenekler.forEach((sec, i) => {
      const d = dugmeYap(this, EN / 2, y0 + i * ad + H / 2, sec.etiket, 0x6a4f75,
                         () => this.katlamaSec(t, sec), EN - 56, H).setDepth(14);
      this.secimNesne.push(d);
    });
  }

  /* oran: 0 = ayna kapalı, 1 = tam açılmış (şekil tamamlanmış) */
  katlamaCiz(t, oran){
    const g = this.katlamaCizim;
    g.clear();
    /* kâğıt — DOM sürümündeki 8..192 / 8..132 kutusu */
    const a = this.katViewBox(8, 8), b = this.katViewBox(KAT_VB_EN - 8, KAT_VB_BOY - 8);
    const x0 = EN / 2 + a.x, y0 = KAT_UST + a.y;
    g.fillStyle(0xf7f2e8, 0.97);
    g.fillRoundedRect(x0, y0, b.x - a.x, b.y - a.y, 12);
    g.lineStyle(3, 0xe0d4b8, 1);
    g.strokeRoundedRect(x0, y0, b.x - a.x, b.y - a.y, 12);
    /* katlama ekseni (kesikli) */
    g.lineStyle(4, RENK.eksen, 1);
    const ust = KAT_UST + a.y - 8, alt = KAT_UST + b.y + 8;
    for (let y = ust; y < alt; y += 14) g.lineBetween(EN / 2, y, EN / 2, Math.min(y + 8, alt));

    if (this.aynaKap){
      this.aynaKap.setVisible(oran > 0.01);
      this.aynaKap.setScale(-oran, 1);
      this.aynaKap.setAlpha(0.35 + oran * 0.65);
    }
  }

  katlamaSec(t, sec){
    if (this.kilit) return;
    this.kilit = true;
    this.secimNesne.forEach(d => d.setAlpha(0.45));

    if (!sec.dogru){
      this.can--; this.seri = 0; this.arayuzuTazele();
      this.tozlar.explode(14, EN / 2, IZG_UST + 120);
      this.cameras.main.shake(230, 0.012);
      this.cameras.main.flash(170, 220, 90, 90);
      this.tweens.add({ targets:this.canYazi, angle:{ from:-12, to:12 }, duration:70,
        yoyo:true, repeat:3, onComplete:() => this.canYazi.setAngle(0) });
      this.mesajGoster(t.hataMsj, '#b5453b');
      this.time.delayedCall(1900, () => {
        if (this.can <= 0){ this.bitir(false); return; }
        this.secimNesne.forEach(d => d.setAlpha(1));
        this.kilit = false;
      });
      return;
    }

    /* Sol yarı aynanın üstünden açılıp şekli tamamlıyor. */
    if (KOPRU && t.okuKatlama) KOPRU.oku(t.okuKatlama);
    const durum = { o:0 };
    this.tweens.add({
      targets:durum, o:1, duration:900, ease:'Back.easeOut',
      onUpdate:() => this.katlamaCiz(t, durum.o),
      onComplete:() => {
        /* Aşımdan sonra iki yan TAM eşit olsun (simetri dersinin özü). */
        this.katlamaCiz(t, 1);
        this.kivilcimlar.setParticleTint(RENK.eksen);
        this.kivilcimlar.explode(30, EN / 2, KAT_UST + KAT_VB_BOY * KAT_OLCEK / 2);
        this.cameras.main.flash(150, 80, 210, 140);
        /* Sonuç adı kâğıdın İÇİNE, alt kenarına yazılıyor: kâğıdın altı
           mesaj kutusunun yeri (y=552), oraya yazılınca kapanıyordu. */
        this.etiketNesne.push(this.add.text(EN / 2,
          KAT_UST + (KAT_VB_BOY - 20) * KAT_OLCEK,
          t.sonucAd, { fontFamily:'system-ui, sans-serif', fontSize:'22px',
          fontStyle:'bold', color:'#7a4a2a', align:'center',
          wordWrap:{ width:EN - 140 } }).setOrigin(0.5).setDepth(24));
        this.puanEkle(250, EN / 2, KAT_UST + 60);
        this.turuBitir(t);
      }
    });
  }

  /* ---------- ortak ---------- */
  puanEkle(kazanc, x, y){
    this.seri++;
    const p = kazanc + (this.seri - 1) * 6;
    this.puan += p;
    this.puanYazi.setText('Puan ' + this.puan);
    this.tweens.add({ targets:this.puanYazi, scale:1.4, duration:120, yoyo:true, ease:'Back.easeOut' });
    const u = this.add.text(x, y, '+' + p, { fontFamily:'system-ui, sans-serif',
      fontSize:'24px', fontStyle:'bold', color:'#7ce0a3' }).setOrigin(0.5).setDepth(95);
    this.tweens.add({ targets:u, y:u.y - 44, alpha:0, duration:620, ease:'Cubic.easeOut',
      onComplete:() => u.destroy() });
  }

  yanlisHamle(mesaj, c, r){
    const t = TURLAR[this.tur];
    this.seri = 0; this.can--; this.arayuzuTazele();
    const p = this.karoNoktasi(t, c, r);
    this.tozlar.explode(12, p.x, p.y);
    this.cameras.main.shake(210, 0.011);
    this.cameras.main.flash(160, 220, 90, 90);
    this.tweens.add({ targets:this.canYazi, angle:{ from:-12, to:12 }, duration:70,
      yoyo:true, repeat:3, onComplete:() => this.canYazi.setAngle(0) });
    this.mesajGoster(mesaj, '#b5453b');
    if (this.can <= 0){ this.kilit = true; this.time.delayedCall(900, () => this.bitir(false)); }
  }

  turuBitir(t){
    this.kilit = true;
    this.puan += 150;
    this.puanYazi.setText('Puan ' + this.puan);

    /* GERÇEK FİZİK: kilim düğümleri savrulur */
    if (t.tip === 'izgara'){
      for (let i = 0; i < 14; i++){
        const p = this.karoNoktasi(t, Phaser.Math.Between(0, t.sutun - 1), Phaser.Math.Between(0, t.satir - 1));
        const d = this.physics.add.image(p.x, p.y, 'dugum').setDepth(30)
          .setTint(t.renkler[Phaser.Math.Between(0, t.renkler.length - 1)]);
        this.dugumler.add(d);
        d.body.setVelocity(Phaser.Math.Between(-200, 200), Phaser.Math.Between(-460, -260));
      }
    }
    this.kivilcimlar.setParticleTint(RENK.vurgu);
    this.kivilcimlar.explode(26, EN / 2, IZG_UST + 100);
    this.cameras.main.flash(150, 80, 210, 140);
    this.mesajGoster(t.tamam, '#1f6d4a');
    this.tur++;
    this.arayuzuTazele();
    this.time.delayedCall(2400, () => {
      if (this.tur >= TURLAR.length){ this.bitir(true); return; }
      this.turuBaslat();
    });
  }

  mesajGoster(metin, arka){
    if (this.mesaj) this.mesaj.destroy();
    this.mesaj = this.add.text(EN / 2, 552, metin, { fontFamily:'system-ui, sans-serif',
      fontSize:'17px', fontStyle:'bold', color:'#ffffff', backgroundColor:arka,
      padding:{ x:12, y:7 }, align:'center', wordWrap:{ width:EN - 60 }, lineSpacing:3
    }).setOrigin(0.5).setDepth(96).setAlpha(0);
    const t = this.mesaj;
    this.tweens.add({ targets:t, alpha:1, duration:150 });
    this.time.delayedCall(1800, () => {
      if (!t.active) return;
      this.tweens.add({ targets:t, alpha:0, duration:250,
        onComplete:() => { if (this.mesaj === t) this.mesaj = null; t.destroy(); } });
    });
  }

  arayuzKur(){
    const serit = this.add.graphics().setDepth(60);
    serit.fillStyle(0x150f1a, 0.97); serit.fillRoundedRect(10, 10, EN - 20, 104, 18);
    /* Şeride yönergenin tamamı sığmıyor (tek satır, sarmalsız); orada
       mekaniğin kısa adı, yönerge aşağıda sarmalı yazılıyor. */
    this.add.text(EN / 2, 38, OYUN_EMO + '  ' + BASLIK_KISA, { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#ffffff' }).setOrigin(0.5).setDepth(61);
    this.puanYazi = this.add.text(30, 80, 'Puan 0', { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0, 0.5).setDepth(61);
    this.canYazi = this.add.text(EN - 30, 80, '', { fontSize:'20px' }).setOrigin(1, 0.5).setDepth(61);
    this.ilerlemeYazi = this.add.text(EN / 2, 80, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'19px', fontStyle:'bold', color:'#c9b0d6' }).setOrigin(0.5).setDepth(61);
    /* Yukarıdan büyüyor: uzun yönerge (200 karaktere kadar) ızgaranın
       üstüne binmesin. */
    this.gorevYazi = this.add.text(EN / 2, 120, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'17px', fontStyle:'bold', color:'#ffffff', align:'center',
      wordWrap:{ width:EN - 44 }, lineSpacing:2 }).setOrigin(0.5, 0).setDepth(61);
    this.ipucuYazi = this.add.text(EN / 2, 226, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'15px', color:'#ffd166', align:'center',
      wordWrap:{ width:EN - 44 }, lineSpacing:2 }).setOrigin(0.5, 0).setDepth(61);
    this.arayuzuTazele();
  }

  arayuzuTazele(){
    this.canYazi.setText('❤️'.repeat(Math.max(0, this.can)) + '🖤'.repeat(Math.max(0, CAN_SAYISI - this.can)));
    const ek = (TURLAR[this.tur] && TURLAR[this.tur].tip === 'izgara' && this.kalan)
      ? '  ·  kalan ' + this.kalan.length : '';
    this.ilerlemeYazi.setText(`${this.tur} / ${TURLAR.length} görev` + ek);
  }

  bitir(kazandi){
    this.scene.start('GameOver', { kazandi, puan:this.puan, can:this.can,
      tur:this.tur, toplam:TURLAR.length });
  }

  update(){
    if (!this.dugumler || !this.dugumler.children) return;
    this.dugumler.getChildren().forEach(d => {
      if (d.active && (d.y > BOY + 60 || d.x < -60 || d.x > EN + 60)) d.destroy();
    });
  }
}

/* =====================================================================
   GAME OVER
   ===================================================================== */
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }
  init(veri){ this.veri = veri; }
  create(){
    const { kazandi, puan, can, tur, toplam } = this.veri;

    /* Uygulama içindeyken kazanma ekranı uygulamanın kutlamasıdır:
       XP/altın, kutlama ve sıradaki oyuna geçiş orada. */
    if (kazandi && KOPRU){ KOPRU.bitir(BASARI, puan); return; }

    atolyeCiz(this);
    const emo = this.add.text(EN / 2, 190, kazandi ? '🧶' : '💪', { fontSize:'97px' })
      .setOrigin(0.5).setScale(0);
    this.tweens.add({ targets:emo, scale:1, duration:520, ease:'Back.easeOut' });
    this.add.text(EN / 2, 300, kazandi ? 'SİMETRİ USTASI!' : 'TEKRAR DENE',
      { fontFamily:'system-ui, sans-serif', fontSize:'35px', fontStyle:'bold',
        color: kazandi ? '#7ce0a3' : '#ffd166', align:'center' }).setOrigin(0.5);
    this.add.text(EN / 2, 360, kazandi ? BASARI : `${tur} / ${toplam} görevi tamamladın — bir daha deneyelim mi?`,
      { fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#f0dcf5', align:'center',
        wordWrap:{ width:EN - 70 }, lineSpacing:5 }).setOrigin(0.5);
    const py = this.add.text(EN / 2, 456, 'Puan 0', { fontFamily:'system-ui, sans-serif',
      fontSize:'42px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0.5);
    const s = { v:0 };
    this.tweens.add({ targets:s, v:puan, duration:900, ease:'Cubic.easeOut',
      onUpdate:() => py.setText('Puan ' + Math.round(s.v)) });
    this.add.text(EN / 2, 506, 'Kalan can: ' + (can > 0 ? '❤️'.repeat(can) : '—'),
      { fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#c9b0d6' }).setOrigin(0.5);
    if (kazandi){
      const k = this.add.particles(EN / 2, -20, 'kivilcim', {
        speed:{ min:90, max:260 }, angle:{ min:60, max:120 }, scale:{ start:0.8, end:0 },
        alpha:{ start:1, end:0 }, lifespan:2000, gravityY:180, quantity:2, frequency:70,
        tint:[0xffd166, 0x7ce0a3, 0xe0505c, 0x2f6b9a] }).setDepth(5);
      this.time.delayedCall(2600, () => k.stop());
    }
    dugmeYap(this, EN / 2, 606, '↻  TEKRAR OYNA', RENK.dogru, () => this.scene.start('Game'));
    /* Çocuk bir oyunda takılıp kalmasın: uygulama içinde sıradakine geç. */
    if (KOPRU)  dugmeYap(this, EN / 2, 684, '⏭  SIRADAKİ OYUN', 0x4a679e, () => KOPRU.atla());
    if (!KOPRU) dugmeYap(this, EN / 2, 684, '☰  MENÜ', 0x6a4f75, () => this.scene.start('Menu'));
  }
}

/* =====================================================================
   NETLİK — cihazın piksel yoğunluğunda çizim
   ---------------------------------------------------------------------
   Oyun 480x800 mantıksal tuvalde çiziliyordu; telefon bunu 1080 piksele
   büyütünce yazılar ve kenarlar bulanıklaşıyordu. Çözüm: tuvali cihazın
   gerçek piksel sayısında açmak, dünyayı ise kamerayı NETLIK katına
   yakınlaştırarak yine 480x800 koordinatta tutmak. Böylece Graphics ile
   çizilen her şey (kartlar, şeritler, kutular) vektör keskinliğinde,
   yazılar da NETLIK çözünürlüğünde üretiliyor; oyun kodunun tek satırı
   değişmiyor.
   ===================================================================== */
const NETLIK = Math.min(3, Math.max(1, Math.round((window.devicePixelRatio || 1) * 2) / 2));

/* Phaser yazıyı kendi ara tuvaline çiziyor; çözünürlük verilmezse 1x
   üretilip yakınlaştırmada bulanıklaşır. Bütün yazılara varsayılan
   olarak NETLIK veriyoruz. */
(function(){
  const TS = Phaser.GameObjects.TextStyle.prototype;
  const eskiSetStyle = TS.setStyle;
  TS.setStyle = function(style, updateText, setDefaults){
    if (style && style.resolution === undefined) style.resolution = NETLIK;
    return eskiSetStyle.call(this, style, updateText, setDefaults);
  };
})();

/* Tuval NETLIK katına büyüdüğü için Phaser imleç konumunu da o ölçekte
   veriyor (0–960). Oyun koordinatına (0–480) çeviren yardımcı: sürükleme
   olayları zaten dünya koordinatı verdiği için yalnız pointer olaylarında
   kullanılıyor. */
function imlec(p){ return { x: p.x / NETLIK, y: p.y / NETLIK }; }

/* Her sahne başlarken kamerayı NETLIK katına yakınlaştırıp fizik
   dünyasını mantıksal ölçüde tutuyoruz: tuval büyüdü, dünya büyümedi.
   Sahne örnekleri oyun kurulumundan sonra eşzamansız oluştuğu için
   kanca Systems.start üzerine takılıyor — yeniden başlatmalarda da
   kendiliğinden çalışıyor. */
(function(){
  const SS = Phaser.Scenes.Systems.prototype;
  const eskiStart = SS.start;
  SS.start = function(veri){
    const sonuc = eskiStart.call(this, veri);
    const sc = this.scene;
    try{
      if (sc.cameras && sc.cameras.main){
        sc.cameras.main.setZoom(NETLIK);
        sc.cameras.main.centerOn(EN / 2, BOY / 2);
      }
      if (sc.physics && sc.physics.world) sc.physics.world.setBounds(0, 0, EN, BOY);
    }catch(e){ /* netlik ayarı oyunu engellemesin */ }
    return sonuc;
  };
})();

window.OYUN = new Phaser.Game({
  type: Phaser.AUTO, parent: 'oyun', width: EN * NETLIK, height: BOY * NETLIK,
  backgroundColor: '#1c1520',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 700 } } },
  scene: [BootScene, MenuScene, GameScene, GameOverScene]
});
