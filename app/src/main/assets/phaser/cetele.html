<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mevsimler ve Çetele — Phaser 3</title>
<script src="phaser.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#101d24; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  #oyun { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="oyun"></div>
<script>
/* =====================================================================
   MEVSİMLER VE ÇETELE — Phaser 3
   (mekanik: tallyChart + surveyChart · 6 + 9 = 15 oyun)
   ---------------------------------------------------------------------
   Kazanım: MAT.2.4.1 (c, ç) — İki veri grubundan veri toplar ve çetele
   tablosuna işler; veriyi yorumlayıp karar verir.

   NOT — iki mekanik tek şablon:
   tallyChart "cevabı doğru sütuna çetele olarak işle" mantığıydı;
   surveyChart aynı döngünün sonuna bir KARAR sorusu ekliyordu. Şablon
   ikisini birden karşılıyor: SONUC bloğu doldurulursa surveyChart gibi
   karar aşaması gelir, boş bırakılırsa saf tallyChart olur.
   İçerik v37'nin aynısı; karar sorusu v37'nin successMsg'ındaki
   "Yaz 5, Kış 3" karşılaştırmasından türetildi.

   Sahneler : Boot → Menu → Game → GameOver
   Fizik    : Arcade.
              · Seçilen cevap kartı sütuna GERÇEK HIZLA uçar, tabloya
                çarpıp çeteleye dönüşür.
              · Yanlış sütunda kart geri seker, kâğıt tozu kalkar.
              · Karar aşamasında kazanan sütunun çeteleleri zıplar.
   Görsel   : Çetele çizgileri Graphics ile çiziliyor; beşinci çizgi
              geleneksel çapraz olarak atılıyor.
   ===================================================================== */

const EN = 480, BOY = 800;

const RENK = {
  zeminUst : 0x16262f,
  zeminAlt : 0x28454f,
  dogru    : 0x34c47b,
  yanlis   : 0xf07575,
  kagit    : 0xf7f4e8,
  kagitKnr : 0xd8d2be,
  cetele   : 0x2a3d46,
  vurgu    : 0xffd166
};

/* ---------------- uygulama köprüsü ----------------
   Uygulamanın içine iframe olarak gömüldüğünde adres  cetele.html#oyun=v37
   biçiminde olur. Sayfa uygulamayla AYNI kaynaktan sunulduğu için üst
   pencereden katalog verisi doğrudan okunabiliyor. Böylece 6 tallyChart +
   9 surveyChart oyununun hepsi bu tek şablonla oynanıyor. Kazanınca
   completeGame() çağrılır; XP, altın, kutlama ve sıradaki oyuna geçiş
   uygulamada kalır.
   Köprü yoksa (dosya tek başına açıldıysa) örnek içerik oynanır.        */
const KOPRU = (function(){
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const id = p.get('oyun');
    if (id && window.parent && window.parent !== window &&
        typeof window.parent.getGame === 'function'){
      const g = window.parent.getGame(id);
      if (g && g.cfg) return {
        oyun: g, cfg: g.cfg,
        bitir(mesaj, puan){ try{ window.parent.completeGame(mesaj || '', puan); }catch(e){} },
        /* Turun kendi metnini uygulamanın sesiyle okutur (Piper). */
        oku(metin){ try{ if (window.parent.oku) window.parent.oku(metin); }catch(e){} },
        /* Kaybetme ekranından: bu oyunu bırak, sıradakine geç. */
        atla(){ try{ if (window.parent.sonrakiOyunaGec) window.parent.sonrakiOyunaGec(); }catch(e){} }
      };
    }
  }catch(e){ /* çapraz kaynak engeli: tek başına oynanır */ }
  return null;
})();

/* HTML varlıklarını çöz: katalogda "Pay &lt; payda" gibi yazımlar var,
   çözülmezse ekranda "&lt;" olarak görünüyor ve öyle okunuyor. */
function varlikCoz(m){
  return String(m)
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
    .replace(/&hellip;/gi, '…').replace(/&mdash;/gi, '—').replace(/&ndash;/gi, '–')
    .replace(/&times;/gi, '×').replace(/&divide;/gi, '÷').replace(/&deg;/gi, '°')
    .replace(/&rarr;/gi, '→').replace(/&larr;/gi, '←')
    .replace(/&amp;/gi, '&');            /* en sona: çift çözmeyi önler */
}

function duzMetin(x){
  return varlikCoz(String(x == null ? '' : x).replace(/<br\s*\/?>/gi,' ')
    .replace(/<[^>]+>/g,'')).replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}

const VARSAYILAN = {   /* şablon tek başına açıldığında: uygulamadaki v37 */
  instruction:'Arkadaşlarımıza en sevdikleri mevsimi soralım! Her cevap için doğru sütuna bir çetele çizgisi at.',
  columns:[{id:'yaz', label:'YAZ', emoji:'☀️'}, {id:'kis', label:'KIŞ', emoji:'❄️'}],
  responses:[
    {col:'yaz', emoji:'👧', text:'Ben yaz aylarını severim.'},
    {col:'kis', emoji:'👦', text:'Ben kış aylarını severim.'},
    {col:'yaz', emoji:'🧒', text:'Yazın denize giriyorum, yazı severim.'},
    {col:'yaz', emoji:'👧', text:'Yaz tatili en güzeli!'},
    {col:'kis', emoji:'👦', text:'Kar yağınca kardan adam yapıyorum.'},
    {col:'yaz', emoji:'🧒', text:'Yazın bisiklete biniyorum.'},
    {col:'yaz', emoji:'👧', text:'Ben de yazı seviyorum.'},
    {col:'kis', emoji:'👦', text:'Kışın sıcak çorba içmek güzel.'}
  ],
  successMsg:'Çeteleyi tamamladın! Yaz 5, Kış 3 — beşli grup saymayı kolaylaştırdı 📋'
};

const CFG = KOPRU ? KOPRU.cfg : VARSAYILAN;

/* Katalogda sütun rengi yok; sırayla bu paletten veriliyor. */
const SUTUN_PALET = [0xe0a03c, 0x6ba8d6, 0x8fbf6a, 0xd0789e, 0x9a86d8];

const OYUN_ADI = KOPRU ? duzMetin(KOPRU.oyun.title) : 'MEVSİMLER\nVE ÇETELE';
const OYUN_EMO = KOPRU ? (KOPRU.oyun.emo || '📋') : '📋';
const TALIMAT  = duzMetin(CFG.instruction) || 'Her cevabı doğru sütuna işle';
const IPUCU    = 'Beşinci çizgi çapraz atılır — beşli gruplar saymayı kolaylaştırır.';
/* Üst şeride yönergenin tamamı sığmıyor (tek satır, sarmalsız); orada
   mekaniğin kısa adı duruyor, yönerge aşağıda sarmalı yazılıyor. */
const BASLIK_KISA = 'ÇETELE TABLOSU';

/* Katalog yönergeleri 40 ile 190 karakter arasında değişiyor. Sabit punto
   ile uzun olanlar 4-5 satıra çıkıp cevap kartının üstüne biniyordu;
   punto uzunluğa göre seçiliyor. */
function yonergePunto(m){
  const n = String(m || '').length;
  return n > 130 ? '15px' : (n > 80 ? '16px' : '18px');
}

/* ---------------------------------------------------------------------
   İÇERİK — katalogdaki iki mekanik tek şablona eşleniyor
   ---------------------------------------------------------------------
   tallyChart  : cfg.columns  + cfg.responses[{col, text, emoji, say}]
                 → her cevabı doğru sütuna işle, karar aşaması YOK.
   surveyChart : cfg.options  + cfg.responses['id', ...]
                 + cfg.finalPrompt / cfg.finalOptions
                 → cevaplar seçenek kimliği olarak geliyor; kart metni
                   seçeneğin etiketi olur, sonda KARAR sorusu gelir.
   ------------------------------------------------------------------- */
const ANKET = !Array.isArray(CFG.columns) || !CFG.columns.length;   /* surveyChart mı? */

const SUTUNLAR = (ANKET ? (CFG.options || []) : CFG.columns).map((s, i) => ({
  id: s.id,
  ad: duzMetin(s.label) || String(s.id || ''),
  emoji: s.emoji || '📦',
  renk: SUTUN_PALET[i % SUTUN_PALET.length]
}));

const CEVAPLAR = (CFG.responses || []).map(c => {
  /* surveyChart'ta cevap yalnız seçenek kimliği: kartı seçenekten kur */
  if (typeof c === 'string'){
    const s = SUTUNLAR.find(x => x.id === c);
    return { sutun:c, emoji:(s ? s.emoji : '🗳️'), metin:(s ? s.ad : c), seslen:(s ? s.ad : '') };
  }
  return { sutun:c.col, emoji:c.emoji || '🧒',
           metin: duzMetin(c.text) || duzMetin(c.label),
           seslen: duzMetin(c.say) };
}).filter(c => SUTUNLAR.some(s => s.id === c.sutun));

/* Karar aşaması: yalnız surveyChart'ta var (finalPrompt + finalOptions).
   Açıklama katalogda yok; toplanan veriden üretiliyor — çocuk çeteleyi
   sayınca aynı sonuca varmalı. */
const SONUC = (function(){
  const secenekler = (CFG.finalOptions || []).map(o =>
    ({ etiket: duzMetin(o.label), dogru: !!o.correct }));
  if (!CFG.finalPrompt || !secenekler.length) return null;
  const sayim = {};
  CEVAPLAR.forEach(c => { sayim[c.sutun] = (sayim[c.sutun] || 0) + 1; });
  let kazanan = null;
  SUTUNLAR.forEach(s => {
    if (!kazanan || (sayim[s.id] || 0) > (sayim[kazanan.id] || 0)) kazanan = s;
  });
  const ozet = SUTUNLAR.map(s => s.ad + ' ' + (sayim[s.id] || 0)).join(', ');
  return {
    soru: duzMetin(CFG.finalPrompt),
    secenekler: secenekler,
    aciklama: ozet + (kazanan ? ' — en çok ' + kazanan.ad + '.' : '')
  };
})();

const BASARI = duzMetin(CFG.successMsg) ||
  (SONUC ? 'Veriyi topladın, çeteleyi okudun ve doğru kararı verdin 📋'
         : 'Çeteleyi tamamladın! Beşli gruplar saymayı kolaylaştırdı 📋');

const CAN_SAYISI = 3;

/* --- Yerleşim -------------------------------------------------------- */
const KART_Y    = 250;   /* gelen cevap kartı */
const TABLO_UST = 336;
/* Karar aşamasında seçenek düğmeleri tablonun ALTINA diziliyor; tablo o
   yüzden anket oyunlarında biraz kısa tutuluyor. */
const TABLO_ALT = SONUC ? 616 : 656;
/* Katalogda 2 ya da 3 sütun var; genişlik sütun sayısına göre. */
const SUTUN_EN  = Math.max(96, Math.min(176,
  Math.floor((EN - 28 - (SUTUNLAR.length - 1) * 12) / Math.max(1, SUTUNLAR.length))));

/* Bir sütunun en çok kaç çetele alacağı belli: beşli grup sayısı buradan
   çıkıyor, satır aralığı da ona göre sıkıştırılıyor (taşma olmasın). */
const AZAMI_SAYIM = (function(){
  const s = {};
  CEVAPLAR.forEach(c => { s[c.sutun] = (s[c.sutun] || 0) + 1; });
  return Math.max(1, ...SUTUNLAR.map(x => s[x.id] || 0));
})();
const GRUP_SAYISI = Math.max(1, Math.ceil(AZAMI_SAYIM / 5));
const GRUP_ADIM   = Math.min(74, Math.floor((TABLO_ALT - TABLO_UST - 42 - 46) / GRUP_SAYISI));
const CIZGI_BOY   = Math.max(22, Math.round(GRUP_ADIM * 0.65));

/* =====================================================================
   1) BOOT — dokuları üret
   ===================================================================== */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }

  create(){
    this.dokuKivilcim();
    this.dokuToz();
    /* Uygulama içinde çocuk oyunu listeden zaten seçti; menüyü atla. */
    this.scene.start(KOPRU ? 'Game' : 'Menu');
  }

  dokuKivilcim(){
    const g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1);
    g.fillCircle(8, 8, 8);
    g.generateTexture('kivilcim', 16, 16);
    g.destroy();
  }

  dokuToz(){
    const g = this.make.graphics({ add:false });
    for (let r = 14; r > 0; r--){
      g.fillStyle(0xffffff, 0.06);
      g.fillCircle(14, 14, r);
    }
    g.generateTexture('toz', 28, 28);
    g.destroy();
  }
}

/* =====================================================================
   Ortak yardımcılar
   ===================================================================== */
function sinifCiz(sc){
  const g = sc.add.graphics();
  g.fillGradientStyle(RENK.zeminUst, RENK.zeminUst, RENK.zeminAlt, RENK.zeminAlt, 1);
  g.fillRect(0, 0, EN, BOY);

  for (let i = 0; i < 22; i++){
    const s = sc.add.circle(
      Phaser.Math.Between(6, EN - 6),
      Phaser.Math.Between(6, BOY - 6),
      Phaser.Math.FloatBetween(1.4, 3.2),
      0xffffff,
      Phaser.Math.FloatBetween(0.04, 0.14)
    );
    sc.tweens.add({
      targets:s, alpha:0.02,
      duration:Phaser.Math.Between(1300, 2900),
      yoyo:true, repeat:-1, delay:Phaser.Math.Between(0, 1900)
    });
  }
  return g;
}

function dugmeYap(sc, x, y, metin, renk, geriCagri, genislik, yukseklik){
  const W = genislik || 280, H = yukseklik || 60;
  const c = sc.add.container(x, y);
  const g = sc.add.graphics();
  g.fillStyle(renk, 1);
  g.fillRoundedRect(-W / 2, -H / 2, W, H, Math.min(H / 2, 26));
  g.fillStyle(0xffffff, 0.16);
  g.fillRoundedRect(-W / 2, -H / 2, W, H * 0.4, { tl:Math.min(H / 2, 26), tr:Math.min(H / 2, 26), bl:0, br:0 });
  const t = sc.add.text(0, 0, metin, {
    fontFamily:'system-ui, sans-serif', fontSize: H > 52 ? '20px' : '17px',
    fontStyle:'bold', color:'#ffffff', align:'center'
  }).setOrigin(0.5);
  c.add([g, t]);
  c.setSize(W, H).setInteractive({ useHandCursor:true });
  c.on('pointerover', () => sc.tweens.add({ targets:c, scale:1.05, duration:110 }));
  c.on('pointerout',  () => sc.tweens.add({ targets:c, scale:1.00, duration:110 }));
  c.on('pointerdown', () => sc.tweens.add({
    targets:c, scale:0.93, duration:90, yoyo:true, onComplete:geriCagri
  }));
  return c;
}

/* =====================================================================
   2) MENU
   ===================================================================== */
class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }

  create(){
    sinifCiz(this);

    /* örnek çetele: 5 çizgi (dördü dik, biri çapraz) */
    const g = this.add.graphics().setDepth(6);
    g.lineStyle(6, RENK.vurgu, 1);
    for (let i = 0; i < 4; i++) g.lineBetween(EN / 2 - 54 + i * 24, 176, EN / 2 - 54 + i * 24, 232);
    g.lineBetween(EN / 2 - 66, 232, EN / 2 + 12, 176);
    this.add.text(EN / 2 + 74, 204, '= 5', {
      fontFamily:'system-ui, sans-serif', fontSize:'36px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0.5);

    const baslik = this.add.text(EN / 2, 332, OYUN_ADI, {
      fontFamily:'system-ui, sans-serif', fontSize:'42px', fontStyle:'bold',
      color:'#ffffff', align:'center', lineSpacing:5
    }).setOrigin(0.5);
    this.tweens.add({
      targets:baslik, scale:1.04, duration:1400,
      yoyo:true, repeat:-1, ease:'Sine.easeInOut'
    });

    this.add.text(EN / 2, 418, TALIMAT, {
      fontFamily:'system-ui, sans-serif', fontSize:'20px',
      color:'#cfe6f0', align:'center',
      wordWrap:{ width:EN - 60 }, lineSpacing:3
    }).setOrigin(0.5);

    const kart = this.add.graphics();
    kart.fillStyle(0x0d181e, 0.92);
    kart.fillRoundedRect(30, 456, EN - 60, 84, 16);
    kart.lineStyle(2, 0x3a6070, 1);
    kart.strokeRoundedRect(30, 456, EN - 60, 84, 16);
    this.add.text(EN / 2, 498, IPUCU, {
      fontFamily:'system-ui, sans-serif', fontSize:'17px', fontStyle:'bold',
      color:'#ffd166', align:'center', wordWrap:{ width:EN - 90 }, lineSpacing:4
    }).setOrigin(0.5);

    dugmeYap(this, EN / 2, 610, '▶  BAŞLA', RENK.dogru, () => this.scene.start('Game'));

    this.add.text(EN / 2, 706, `${CEVAPLAR.length} cevap  ·  ${CAN_SAYISI} can`, {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', color:'#9fc2cf'
    }).setOrigin(0.5);
  }
}

/* =====================================================================
   3) GAME
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    this.can    = CAN_SAYISI;
    this.puan   = 0;
    this.seri   = 0;
    this.sira   = 0;      /* kaçıncı cevap */
    this.kilit  = true;
    this.asama  = 'cetele';   /* 'cetele' → 'karar' */

    /* Phaser sahne örneğini yeniden kullanır — TEKRAR OYNA'da eski
       nesnelere işaret etmesinler. */
    this.kart       = null;
    this.kararNesne = null;
    this.mesaj      = null;

    sinifCiz(this);

    this.kivilcimlar = this.add.particles(0, 0, 'kivilcim', {
      speed:{ min:130, max:340 }, angle:{ min:0, max:360 },
      scale:{ start:0.85, end:0 }, alpha:{ start:1, end:0 },
      lifespan:620, gravityY:300, blendMode:'ADD', emitting:false
    }).setDepth(90);

    this.tozlar = this.add.particles(0, 0, 'toz', {
      speed:{ min:40, max:150 }, angle:{ min:200, max:340 },
      scale:{ start:0.9, end:2 }, alpha:{ start:0.5, end:0 },
      lifespan:660, emitting:false
    }).setDepth(80);

    this.sayac = SUTUNLAR.map(() => 0);
    this.kararNesne = [];

    this.sahneKur();
    this.arayuzKur();
    this.sonrakiCevap();
  }

  sutunX(i){
    const n = SUTUNLAR.length;
    return EN / 2 + (i - (n - 1) / 2) * (SUTUN_EN + 12);
  }

  /* ---------- çetele tablosu ---------- */
  sahneKur(){
    const g = this.add.graphics().setDepth(4);
    this.ceteleCizim = this.add.graphics().setDepth(8);
    this.sayiYazi = [];

    SUTUNLAR.forEach((s, i) => {
      const x = this.sutunX(i);
      /* kâğıt sütun */
      g.fillStyle(RENK.kagit, 0.96);
      g.fillRoundedRect(x - SUTUN_EN / 2, TABLO_UST, SUTUN_EN, TABLO_ALT - TABLO_UST, 12);
      g.lineStyle(2, RENK.kagitKnr, 1);
      g.strokeRoundedRect(x - SUTUN_EN / 2, TABLO_UST, SUTUN_EN, TABLO_ALT - TABLO_UST, 12);
      /* başlık şeridi */
      g.fillStyle(s.renk, 1);
      g.fillRoundedRect(x - SUTUN_EN / 2, TABLO_UST, SUTUN_EN, 42, { tl:12, tr:12, bl:0, br:0 });

      this.add.text(x, TABLO_UST + 21, s.emoji + ' ' + s.ad, {
        fontFamily:'system-ui, sans-serif',
        fontSize: (SUTUN_EN > 150 ? '20px' : '16px'), fontStyle:'bold',
        color:'#1c2b33', align:'center',
        wordWrap:{ width:SUTUN_EN - 10 }
      }).setOrigin(0.5).setDepth(6);

      /* dokunulabilir alan */
      const alan = this.add.rectangle(x, (TABLO_UST + TABLO_ALT) / 2 + 21,
                                     SUTUN_EN, TABLO_ALT - TABLO_UST - 42, 0, 0)
        .setInteractive({ useHandCursor:true }).setDepth(7);
      alan.on('pointerdown', () => this.sutunaIsle(i));

      /* sayı göstergesi */
      /* Sayı yazısını SABİT içerik dizisine değil sahneye bağlıyoruz;
         SUTUNLAR'a yazılırsa TEKRAR OYNA'da eski (yok edilmiş) nesneye
         işaret ediyor. */
      this.sayiYazi[i] = this.add.text(x, TABLO_ALT - 20, '0', {
        fontFamily:'system-ui, sans-serif', fontSize:'24px', fontStyle:'bold',
        color:'#1c2b33'
      }).setOrigin(0.5).setDepth(6);
    });

    /* NOT: Phaser'da collider(grup, TEK nesne) callback'e parametreleri
       ters veriyor; kart uçuşu için grup kullanıyoruz. */
    this.kartlar = this.physics.add.group();
  }

  /* çeteleyi baştan çiz — beşinci çizgi çapraz */
  ceteleyiCiz(){
    const g = this.ceteleCizim;
    g.clear();
    SUTUNLAR.forEach((s, i) => {
      const x = this.sutunX(i);
      const n = this.sayac[i];
      /* Aralık ve çizgi boyu sütuna sığacak şekilde hesaplandı; küme
         sütunun ortasına yerleşiyor (sabit -52 kaydırması 3 sütunlu
         tablolarda kâğıdın dışına çıkıyordu). */
      const ara = Math.min(22, Math.floor((SUTUN_EN - 34) / 4));
      for (let k = 0; k < n; k++){
        const grup = Math.floor(k / 5);
        const yer  = k % 5;
        const gy = TABLO_UST + 62 + grup * GRUP_ADIM;
        const gx = x - ara * 1.5;
        g.lineStyle(6, s.renk, 1);
        if (yer < 4){
          g.lineBetween(gx + yer * ara, gy, gx + yer * ara, gy + CIZGI_BOY);
        } else {
          /* beşinci: çapraz */
          g.lineBetween(gx - 10, gy + CIZGI_BOY, gx + ara * 3 + 10, gy);
        }
      }
    });
  }

  /* ---------- gelen cevap ---------- */
  sonrakiCevap(){
    if (this.sira >= CEVAPLAR.length){ this.kararaGec(); return; }
    const c = CEVAPLAR[this.sira];
    this.kilit = true;

    if (this.kart) this.kart.destroy();
    const k = this.add.container(EN / 2, KART_Y).setDepth(30);
    const g = this.add.graphics();
    g.fillStyle(RENK.kagit, 1);
    g.fillRoundedRect(-196, -38, 392, 76, 14);
    g.lineStyle(2, RENK.kagitKnr, 1);
    g.strokeRoundedRect(-196, -38, 392, 76, 14);
    const e = this.add.text(-158, 0, c.emoji, { fontSize:'34px' }).setOrigin(0.5);
    const m = this.add.text(-124, 0, '“' + c.metin + '”', {
      fontFamily:'system-ui, sans-serif', fontSize:'17px', fontStyle:'bold',
      color:'#1c2b33', wordWrap:{ width:288 }, lineSpacing:3
    }).setOrigin(0, 0.5);
    k.add([g, e, m]);
    k.setSize(392, 76);
    k.setAlpha(0).setScale(0.9);
    this.tweens.add({
      targets:k, alpha:1, scale:1, y:KART_Y, duration:280, ease:'Back.easeOut'
    });
    this.kart = k;

    this.time.delayedCall(320, () => { this.kilit = false; });
    this.arayuzuTazele();
    if (KOPRU && this.sira > 0 && c.seslen) KOPRU.oku(c.seslen);
  }

  /* ---------- sütuna işle ---------- */
  sutunaIsle(i){
    if (this.kilit || this.asama !== 'cetele') return;
    const c = CEVAPLAR[this.sira];
    const dogruIdx = SUTUNLAR.findIndex(s => s.id === c.sutun);

    if (i !== dogruIdx){ this.yanlis(i); return; }

    this.kilit = true;
    const hx = this.sutunX(i), hy = TABLO_UST + 90;

    /* GERÇEK FİZİK: kart sütuna uçar */
    const ucan = this.physics.add.existing(
      this.add.text(this.kart.x, this.kart.y, c.emoji, { fontSize:'33px' })
        .setOrigin(0.5).setDepth(34)
    );
    this.kartlar.add(ucan);
    ucan.body.setAllowGravity(false);
    this.physics.moveTo(ucan, hx, hy, 620);
    this.tweens.add({ targets:this.kart, alpha:0, y:this.kart.y - 18, duration:220 });

    this.time.delayedCall(300, () => {
      if (ucan.active){
        ucan.body.setVelocity(0, 0);
        this.tozlar.explode(6, hx, hy);
        ucan.destroy();
      }
      this.sayac[i]++;
      this.sayiYazi[i].setText(String(this.sayac[i]));
      this.ceteleyiCiz();
      this.kivilcimlar.setParticleTint(SUTUNLAR[i].renk);
      this.kivilcimlar.explode(12, hx, hy + 20);

      /* beşinci çizgide özel kutlama */
      if (this.sayac[i] % 5 === 0){
        this.mesajGoster('Beşli grup tamam — çapraz çizgi! ✋', '#1f6d4a');
        this.tweens.add({
          targets:this.sayiYazi[i], scale:1.5, duration:160, yoyo:true, ease:'Back.easeOut'
        });
      }

      this.seri++;
      const kazanc = 60 + (this.seri - 1) * 10;
      this.puan += kazanc;
      this.puanYazi.setText('Puan ' + this.puan);
      this.tweens.add({
        targets:this.puanYazi, scale:1.35, duration:120, yoyo:true, ease:'Back.easeOut'
      });

      this.sira++;
      this.time.delayedCall(420, () => this.sonrakiCevap());
    });
  }

  yanlis(i){
    this.seri = 0;
    this.can--;
    this.arayuzuTazele();

    /* GERÇEK FİZİK: kart yanlış sütundan geri seker */
    const hx = this.sutunX(i);
    const geri = this.physics.add.existing(
      this.add.text(hx, TABLO_UST + 70, CEVAPLAR[this.sira].emoji, { fontSize:'31px' })
        .setOrigin(0.5).setDepth(34)
    );
    this.kartlar.add(geri);
    geri.body.setAllowGravity(true);
    geri.body.setVelocity(Phaser.Math.Between(-120, 120), -320);
    this.tweens.add({ targets:geri, angle:Phaser.Math.Between(-200, 200), duration:700 });
    this.time.delayedCall(900, () => { if (geri.active) geri.destroy(); });

    this.tozlar.explode(14, hx, TABLO_UST + 70);
    this.cameras.main.shake(220, 0.011);
    this.cameras.main.flash(160, 220, 90, 90);
    this.tweens.add({
      targets:this.canYazi, angle:{ from:-12, to:12 },
      duration:70, yoyo:true, repeat:3,
      onComplete:() => this.canYazi.setAngle(0)
    });
    this.mesajGoster('Bu cevap ' + SUTUNLAR.find(s => s.id === CEVAPLAR[this.sira].sutun).ad +
                     ' sütununa ait.', '#b5453b');

    if (this.can <= 0){
      this.kilit = true;
      this.time.delayedCall(900, () => this.bitir(false));
    }
  }

  /* ---------- karar aşaması (surveyChart) ---------- */
  kararaGec(){
    if (!SONUC){ this.bitir(true); return; }
    this.asama = 'karar';
    this.kilit = true;
    if (this.kart) this.kart.destroy();

    this.gorevYazi.setText(SONUC.soru);
    this.gorevYazi.setFontSize(yonergePunto(SONUC.soru));
    this.tweens.add({
      targets:this.gorevYazi, scale:{ from:0.86, to:1 }, duration:300, ease:'Back.easeOut'
    });

    /* Katalogdaki karar seçenekleri uzun cümleler ("En çok oyu alan Ela"):
       yan yana 176 piksele sığmıyordu, tablonun altına alt alta diziliyor. */
    const n = SONUC.secenekler.length;
    const H  = n >= 3 ? 44 : 54;
    const ad = H + 8;
    const y0 = TABLO_ALT + 30 + (BOY - 14 - (TABLO_ALT + 30) - (n * ad - 8)) / 2;
    SONUC.secenekler.forEach((sec, i) => {
      const d = dugmeYap(this, EN / 2, y0 + i * ad + H / 2, sec.etiket, 0x3a6070,
                         () => this.kararVer(sec), EN - 56, H).setDepth(40);
      this.kararNesne.push(d);
    });
    if (KOPRU) KOPRU.oku(SONUC.soru);

    this.time.delayedCall(340, () => { this.kilit = false; });
    this.arayuzuTazele();
  }

  kararVer(sec){
    if (this.kilit) return;
    this.kilit = true;
    this.kararNesne.forEach(d => d.setAlpha(0.4));

    if (sec.dogru){
      /* Kazanan sütun: en çok çetelesi olan. Seçenek sırası katalogda
         sütun sırasıyla aynı olmak zorunda değil. */
      let i = 0;
      this.sayac.forEach((v, k) => { if (v > this.sayac[i]) i = k; });
      /* kazanan sütunun çeteleleri zıplasın */
      this.tweens.add({
        targets:this.ceteleCizim, y:-14, duration:150, yoyo:true, repeat:2
      });
      this.kivilcimlar.setParticleTint(RENK.dogru);
      this.kivilcimlar.explode(34, this.sutunX(i), (TABLO_UST + TABLO_ALT) / 2);
      this.cameras.main.flash(160, 80, 210, 140);
      this.puan += 250;
      this.puanYazi.setText('Puan ' + this.puan);
      this.mesajGoster('Doğru karar! ' + SONUC.aciklama, '#1f6d4a');
      this.time.delayedCall(2300, () => this.bitir(true));
      return;
    }

    this.can--;
    this.arayuzuTazele();
    this.tozlar.explode(16, EN / 2, 660);
    this.cameras.main.shake(230, 0.012);
    this.cameras.main.flash(170, 220, 90, 90);
    this.mesajGoster('Çeteleyi tekrar say: ' + SONUC.aciklama, '#b5453b');
    this.time.delayedCall(2000, () => {
      if (this.can <= 0){ this.bitir(false); return; }
      this.kararNesne.forEach(d => d.setAlpha(1));
      this.kilit = false;
    });
  }

  mesajGoster(metin, arka){
    if (this.mesaj) this.mesaj.destroy();
    this.mesaj = this.add.text(EN / 2, 300, metin, {
      fontFamily:'system-ui, sans-serif', fontSize:'17px', fontStyle:'bold',
      color:'#ffffff', backgroundColor:arka,
      padding:{ x:12, y:7 }, align:'center', wordWrap:{ width:EN - 60 }, lineSpacing:3
    }).setOrigin(0.5).setDepth(96).setAlpha(0);
    const t = this.mesaj;
    this.tweens.add({ targets:t, alpha:1, duration:150 });
    this.time.delayedCall(1700, () => {
      if (!t.active) return;
      this.tweens.add({
        targets:t, alpha:0, duration:250,
        onComplete:() => { if (this.mesaj === t) this.mesaj = null; t.destroy(); }
      });
    });
  }

  /* ---------- arayüz ---------- */
  arayuzKur(){
    const serit = this.add.graphics().setDepth(60);
    serit.fillStyle(0x0c161c, 0.97);
    serit.fillRoundedRect(10, 10, EN - 20, 104, 18);

    this.add.text(EN / 2, 38, OYUN_EMO + '  ' + BASLIK_KISA, {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', fontStyle:'bold',
      color:'#ffffff'
    }).setOrigin(0.5).setDepth(61);

    this.puanYazi = this.add.text(30, 80, 'Puan 0', {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0, 0.5).setDepth(61);

    this.canYazi = this.add.text(EN - 30, 80, '', { fontSize:'20px' })
      .setOrigin(1, 0.5).setDepth(61);

    this.ilerlemeYazi = this.add.text(EN / 2, 80, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'19px', fontStyle:'bold',
      color:'#9fc2cf'
    }).setOrigin(0.5).setDepth(61);

    /* Yukarıdan büyüyor (origin y=0): uzun yönerge aşağıdaki kartı değil
       kendi alanını doldurur. */
    this.gorevYazi = this.add.text(EN / 2, 122, TALIMAT, {
      fontFamily:'system-ui, sans-serif', fontSize:yonergePunto(TALIMAT),
      fontStyle:'bold', color:'#ffffff', align:'center',
      wordWrap:{ width:EN - 44 }, lineSpacing:2
    }).setOrigin(0.5, 0).setDepth(61);

    this.arayuzuTazele();
  }

  arayuzuTazele(){
    this.canYazi.setText(
      '❤️'.repeat(Math.max(0, this.can)) +
      '🖤'.repeat(Math.max(0, CAN_SAYISI - this.can))
    );
    this.ilerlemeYazi.setText(
      this.asama === 'karar' ? 'karar aşaması'
                             : `${this.sira} / ${CEVAPLAR.length} cevap`
    );
  }

  bitir(kazandi){
    this.scene.start('GameOver', {
      kazandi, puan:this.puan, can:this.can,
      sira:this.sira, toplam:CEVAPLAR.length,
      sayac:this.sayac.slice()
    });
  }

  /* ---------- her kare ---------- */
  update(){
    if (!this.kartlar || !this.kartlar.children) return;
    this.kartlar.getChildren().forEach(k => {
      if (!k.active) return;
      if (k.y > BOY + 60 || k.x < -60 || k.x > EN + 60) k.destroy();
    });
  }
}

/* =====================================================================
   4) GAME OVER
   ===================================================================== */
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }

  init(veri){ this.veri = veri; }

  create(){
    const { kazandi, puan, can, sira, toplam, sayac } = this.veri;

    /* Uygulama içindeyken kazanma ekranı uygulamanın kutlamasıdır:
       XP/altın, kutlama ve sıradaki oyuna geçiş orada. */
    if (kazandi && KOPRU){ KOPRU.bitir(BASARI, puan); return; }

    sinifCiz(this);

    const emo = this.add.text(EN / 2, 186, kazandi ? '📋' : '💪', { fontSize:'97px' })
      .setOrigin(0.5).setScale(0);
    this.tweens.add({ targets:emo, scale:1, duration:520, ease:'Back.easeOut' });

    this.add.text(EN / 2, 292, kazandi ? 'ÇETELE TAMAM!' : 'TEKRAR DENE', {
      fontFamily:'system-ui, sans-serif', fontSize:'35px', fontStyle:'bold',
      color: kazandi ? '#7ce0a3' : '#ffd166', align:'center'
    }).setOrigin(0.5);

    this.add.text(EN / 2, 352,
      kazandi ? BASARI : `${sira} / ${toplam} cevabı işledin — bir daha deneyelim mi?`, {
      fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#cfe6f0',
      align:'center', wordWrap:{ width:EN - 70 }, lineSpacing:5
    }).setOrigin(0.5);

    /* özet */
    if (sayac){
      const ozet = SUTUNLAR.map((s, i) => s.emoji + ' ' + s.ad + ': ' + sayac[i]).join('     ');
      this.add.text(EN / 2, 414, ozet, {
        fontFamily:'system-ui, sans-serif', fontSize:'20px', fontStyle:'bold',
        color:'#ffd166'
      }).setOrigin(0.5);
    }

    const puanYazi = this.add.text(EN / 2, 470, 'Puan 0', {
      fontFamily:'system-ui, sans-serif', fontSize:'40px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0.5);
    const s2 = { v:0 };
    this.tweens.add({
      targets:s2, v:puan, duration:900, ease:'Cubic.easeOut',
      onUpdate:() => puanYazi.setText('Puan ' + Math.round(s2.v))
    });

    this.add.text(EN / 2, 516,
      'Kalan can: ' + (can > 0 ? '❤️'.repeat(can) : '—'), {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', color:'#9fc2cf'
    }).setOrigin(0.5);

    if (kazandi){
      const konfeti = this.add.particles(EN / 2, -20, 'kivilcim', {
        speed:{ min:90, max:260 }, angle:{ min:60, max:120 },
        scale:{ start:0.8, end:0 }, alpha:{ start:1, end:0 },
        lifespan:2000, gravityY:180, quantity:2, frequency:70,
        tint:[0xffd166, 0x7ce0a3, 0xe0a03c, 0x6ba8d6]
      }).setDepth(5);
      this.time.delayedCall(2600, () => konfeti.stop());
    }

    dugmeYap(this, EN / 2, 606, '↻  TEKRAR OYNA', RENK.dogru, () => this.scene.start('Game'));
    /* Çocuk bir oyunda takılıp kalmasın: uygulama içinde sıradakine geç. */
    if (KOPRU)  dugmeYap(this, EN / 2, 684, '⏭  SIRADAKİ OYUN', 0x4a679e, () => KOPRU.atla());
    if (!KOPRU) dugmeYap(this, EN / 2, 684, '☰  MENÜ',          0x3a6070, () => this.scene.start('Menu'));
  }
}

/* =====================================================================
   OYUNU BAŞLAT
   ===================================================================== */
/* =====================================================================
   NETLİK — cihazın piksel yoğunluğunda çizim
   ---------------------------------------------------------------------
   Oyun 480x800 mantıksal tuvalde çiziliyordu; telefon bunu 1080 piksele
   büyütünce yazılar ve kenarlar bulanıklaşıyordu. Çözüm: tuvali cihazın
   gerçek piksel sayısında açmak, dünyayı ise kamerayı NETLIK katına
   yakınlaştırarak yine 480x800 koordinatta tutmak. Böylece Graphics ile
   çizilen her şey (kartlar, şeritler, kutular) vektör keskinliğinde,
   yazılar da NETLIK çözünürlüğünde üretiliyor; oyun kodunun tek satırı
   değişmiyor.
   ===================================================================== */
const NETLIK = Math.min(3, Math.max(1, Math.round((window.devicePixelRatio || 1) * 2) / 2));

/* Phaser yazıyı kendi ara tuvaline çiziyor; çözünürlük verilmezse 1x
   üretilip yakınlaştırmada bulanıklaşır. Bütün yazılara varsayılan
   olarak NETLIK veriyoruz. */
(function(){
  const TS = Phaser.GameObjects.TextStyle.prototype;
  const eskiSetStyle = TS.setStyle;
  TS.setStyle = function(style, updateText, setDefaults){
    if (style && style.resolution === undefined) style.resolution = NETLIK;
    return eskiSetStyle.call(this, style, updateText, setDefaults);
  };
})();

/* Tuval NETLIK katına büyüdüğü için Phaser imleç konumunu da o ölçekte
   veriyor (0–960). Oyun koordinatına (0–480) çeviren yardımcı: sürükleme
   olayları zaten dünya koordinatı verdiği için yalnız pointer olaylarında
   kullanılıyor. */
function imlec(p){ return { x: p.x / NETLIK, y: p.y / NETLIK }; }

/* Her sahne başlarken kamerayı NETLIK katına yakınlaştırıp fizik
   dünyasını mantıksal ölçüde tutuyoruz: tuval büyüdü, dünya büyümedi.
   Sahne örnekleri oyun kurulumundan sonra eşzamansız oluştuğu için
   kanca Systems.start üzerine takılıyor — yeniden başlatmalarda da
   kendiliğinden çalışıyor. */
(function(){
  const SS = Phaser.Scenes.Systems.prototype;
  const eskiStart = SS.start;
  SS.start = function(veri){
    const sonuc = eskiStart.call(this, veri);
    const sc = this.scene;
    try{
      if (sc.cameras && sc.cameras.main){
        sc.cameras.main.setZoom(NETLIK);
        sc.cameras.main.centerOn(EN / 2, BOY / 2);
      }
      if (sc.physics && sc.physics.world) sc.physics.world.setBounds(0, 0, EN, BOY);
    }catch(e){ /* netlik ayarı oyunu engellemesin */ }
    return sonuc;
  };
})();

window.OYUN = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'oyun',
  width: EN * NETLIK,
  height: BOY * NETLIK,
  backgroundColor: '#101d24',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 760 } }
  },
  scene: [BootScene, MenuScene, GameScene, GameOverScene]
});
