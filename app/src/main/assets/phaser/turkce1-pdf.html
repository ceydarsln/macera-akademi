.bubble-playfield,.pond-playfield{position:relative;width:min(330px,98%);height:230px;border-radius:18px;overflow:hidden}
.bubble-playfield{background:linear-gradient(#cdeafd 0 76%,#3f92c4 76%);box-shadow:inset 0 -16px 0 rgba(127,198,232,.42)}
.bubble-playfield:after{content:"";position:absolute;left:-5%;right:-5%;bottom:37px;height:13px;border-top:4px solid rgba(255,255,255,.42);border-radius:50%}
.bubble-target{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;width:64px;height:64px;min-width:64px;min-height:64px;padding:0;border:3px solid #fff;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#cfeaf8 60%,#9fd2ee);box-shadow:0 5px 0 rgba(48,115,157,.28);font-weight:950;color:#1f3b52}
.bubble-target:after{content:"";position:absolute;left:27px;bottom:-8px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:9px solid #9fd2ee}
.bubble-target.dogru{opacity:.45;box-shadow:none}
.pond-playfield{background:linear-gradient(#d7f2e4 0 52%,#3f9e83 52%);box-shadow:inset 0 -20px 0 rgba(26,111,91,.16)}
.pond-playfield:before,.pond-playfield:after{content:"";position:absolute;border-radius:50%;background:rgba(133,217,170,.62);width:94px;height:25px;bottom:18px}.pond-playfield:before{left:12px}.pond-playfield:after{right:12px}
.pond-frog{position:absolute;z-index:4;left:11px;bottom:54px;font-size:40px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18))}
.pond-leaves{position:absolute;z-index:3;left:58px;right:10px;bottom:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px 11px}
.pond-leaf{min-width:0;min-height:58px;border:3px solid #d6f3d9;border-radius:50%;background:#78c77e;box-shadow:0 5px 0 #397d5a;font-size:19px;font-weight:950;color:#173a31}
.pond-leaf:active{transform:translateY(3px);box-shadow:0 2px 0 #397d5a}

<script>
/* Sınama modunda (?test=1) tarayıcının arka plan sekme kısıntısını aş:
   gizli sekmede setTimeout dakikada bire kadar iniyor ve oyunun kendi
   geçişleri donuyordu. Yalnız kısa gecikmeler için, yalnız testte. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}

'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'t01';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speech=s=>String(s??'').replace(/\+/g,' artı ').replace(/[−–-]/g,' eksi ').replace(/[×x]/g,' çarpı ').replace(/[:÷]/g,' bölü ').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim();
/* ===== SES YEDEĞİ =====
   Bu motorlarda hedef şartname gereği ekrana KASTEN yazılmıyor, yalnız sesle
   veriliyor. Cihazda Türkçe ses paketi yoksa (ya da kullanıcı sesi kapattıysa)
   speakNow false dönüyor ve oyun çözülemez hâle geliyordu: çocuk ne duyuyor ne
   görüyor. Kataloğun oku() yorumunda tarif edilen yedek yol buydu ama kullanan
   yoktu. Artık speak() gerçekten seslendirildi mi bilgisini tutuyor; seslendirme
   olmuyorsa o turun gizli hedefi "ses yok" notuyla görünür kılınıyor.
   Çözülemeyen oyun, görünen hedeften kötüdür. */
let sesVar=null;
function sesYok(){return sesVar===false}
function speak(text,repeat=false){
 let ok=false,koprü=false;
 try{if(parent&&parent!==window&&typeof parent.oku==='function'){koprü=true;ok=!!parent.oku(speech(text),repeat)}}catch(e){}
 /* Köprü varsa onun cevabı bağlayıcıdır. Aksi hâlde motorun kendi
    speechSynthesis'i devreye giriyor ve o hata vermediği için köprünün
    "ses yok" sinyalini maskeliyordu. */
 if(!koprü){try{
   const sesler=speechSynthesis.getVoices()||[];
   /* getVoices ilk çağrıda boş dönebilir; boşluğu "bilinmiyor" sayıp
      yanlış alarm vermiyoruz. */
   if(!sesler.length||sesler.some(v=>/^tr/i.test(v.lang||''))){
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));
    u.lang='tr-TR';speechSynthesis.speak(u);ok=true}
  }catch(e){ok=false}}
 /* Boş metin her zaman false döner; bayrağı yalnız gerçek denemeler belirler. */
 if(String(text||'').trim()){sesVar=ok;sesUyariCiz()}
 return ok}
function sesUyariCiz(){
 const kap=document.querySelector('.scene');if(!kap)return;
 let el=document.getElementById('sesYokKutu');
 const h=sesYok()&&typeof gizliHedef==='function'?gizliHedef(round&&round()):'';
 if(!h){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='sesYokKutu';el.className='ses-yok';kap.appendChild(el)}
 el.innerHTML='🔇 Ses açılamadı, hedef gösteriliyor: <b>'+esc(h)+'</b>'}
/* Gizli hedef: bu motorda yedi kip hedefi yalnız sesle veriyor.
   sepet ve konum kiplerinde gizlenen şey nesne ADLARI; onlar banner yerine
   kartların üzerinde açılıyor (bkz. sepetCiz/konumCiz içindeki sesYok()). */
function gizliHedef(r){
 if(!r)return '';
 const a=(typeof asama==='function')?asama(r):r;
 switch(r.kind){
  case 'kurbaga': return String((r.hedefler||[])[state.ix||0]||'');
  case 'tren': case 'uzay': return String(a.hedefSes||'');
  case 'fabrika': return String(a.kelime||'');
  case 'dikte': return String(a.kelime||'');
  default: return ''}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}
function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;sonCeza=0;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();sesUyariCiz();/* rAF geri çağrısı bir sonraki karede çalışıyor; gizli sekmede hiç
   çalışmayıp sekme görünür olunca kuyruktan dönüyor. O ana kadar oyun
   bitmişse round() undefined oluyordu. Tur numarası da doğrulanıyor ki
   geciken kare bir önceki turun yönergesini okumasın. */
requestAnimationFrame(()=>{const t=roundIndex,r=round();if(r&&roundIndex===t)speak(r.prompt)})}
function updateStage(){if(!round())return;const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
/* Yönlendirme uyarısı hata değildir: örneği dinlemek ya da ölçüt işaretlemek
   bir ön koşuldur, can götürmemeli. */
function uyar(msg){feedback(msg,true);speak(msg)}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
/* Hızlı çift dokunuş tek hata için iki can götürüyordu; kısa bir ceza
   soğuması hem çocuğun ikinci dokunuşunu hem de yinelenen olayları yutar. */
let sonCeza=0;
function wrong(hint){if(locked||!round())return;
 const simdi=Date.now();if(simdi-sonCeza<550)return;sonCeza=simdi;
 if(!round().noPenalty)lives=Math.max(0,lives-1);feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün. Nesneleri dikkatle incele.');const sc=$('.stage');sc?.classList.remove('shake');void sc?.offsetWidth;sc?.classList.add('shake');if(lives===0){lives=3;setTimeout(render,650)}else $('.lives').innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function good(message){if(locked)return;locked=true;score+=10;const r=round();if(r.successScene){$('#stage').innerHTML=typeof r.successScene==='function'?r.successScene(state):r.successScene;$('#stage').classList.add('success-motion')}feedback(message||r.result||'Doğru!');speak(r.result||message||'Doğru.');setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function C(label,correct=false,value=null){return{label,correct,value}}
function P(id,html,target){return{id,html,target}}
function T(id,html,need=1){return{id,html,need}}
function Q(prompt,scene,choices,result,hint,extra={}){return{kind:'choice',prompt,scene,choices,result,hint,...extra}}
function D(prompt,scene,pieces,targets,result,hint,extra={}){return{kind:'drag',prompt,scene,pieces,targets,result,hint,...extra}}

function gecisBasla(fn,ms){state.gecis=true;ertele(()=>{state.gecis=false;fn()},ms)}
function ertele(fn,ms){const t=roundIndex;setTimeout(()=>{if(roundIndex===t&&!locked)fn()},ms)}

function sesOku(h){return String(h).replace(/^\/(.*)\/$/,'$1')}
function karistir(liste,tohum){const idx=[...liste.keys()];
 let x=(tohum*2654435761)%2147483647;if(x<=0)x+=2147483646;
 for(let i=idx.length-1;i>0;i--){x=(x*48271)%2147483647;const j=x%(i+1);const t=idx[i];idx[i]=idx[j];idx[j]=t}
 return idx}
/* Seçenekler veri sırasında çizilince doğru cevap ekrandan okunabiliyordu
   (hece kasaları hep ilk iki kutu, doğru anahtar hep ilk anahtar).
   Görünüm sırası tohumlu olarak karıştırılıyor; data-* gerçek dizini taşıdığı
   için doğruluk mantığı ve koşum etkilenmiyor. */
function gorunumSirasi(n,ek){const y=karistir(new Array(n).fill(0),turTohumu(ek));
 if(y.every((v,i)=>v===i))y.push(y.shift());
 return y}
/* Karıştırmak tek başına yetmiyor: doğru parçalar ekranda yan yana ve doğru
   sırada kalırsa cevap yine dizilişten okunuyor. Havuzlarda doğru dizinin
   bitişik olmadığı bir permütasyon aranıyor. */
function gsHavuz(ad,n,dogru,ek){const k='H'+ad+':'+(state.asama||0);
 state._gs=state._gs||{};
 if(state._gs[k]&&state._gs[k].length===n)return state._gs[k];
 let y=null;
 for(let d=0;d<16;d++){
  y=gorunumSirasi(n,(ek||0)+(state.asama||0)*7+d*101);
  const yer=dogru.map(i=>y.indexOf(i));
  const bitisik=yer.every((v,i)=>i===0||v===yer[i-1]+1);
  if(!bitisik)break}
 state._gs[k]=y;return y}
function gs(ad,n,ek){const k=ad+':'+(state.asama||0)+':'+(state.faz||0);
 state._gs=state._gs||{};
 if(!state._gs[k]||state._gs[k].length!==n)state._gs[k]=gorunumSirasi(n,(ek||0)+(state.asama||0)*7);
 return state._gs[k]}
function turTohumu(ek){let t=roundIndex+11+(ek||0);for(const c of String(GAME_ID))t=t*31+c.charCodeAt(0);return t}

/* ===================== SEPET: sesi işitsel ayırt etme (t02) =====================
   Şartname: ilk turda kelime yazıları görünmez, her nesnenin adı ayrı dinleme
   düğmesiyle çalınır, tekrar dinleme cezasız, baş-orta-son konumu çalışılır. */
function sepetCiz(r){
 /* Ses yoksa nesne adları açılır: yoksa çocuk ne duyar ne okur. */
 const yaziAcik=state.acik||r.yaziAcik||sesYok();
 const secili=state.secili||[];
 const sepetler=r.sepetler||[{ad:r.sepetAd||'Sepet',im:'🧺'}];
 const ozelSepet=['t12','t19','t28','t36','t45','t50','t56','t61'].includes(GAME_ID);
 const sepetBaslik={t12:'SESLİ BAHÇE SERASI',t19:'MEYVE PAZARI',t28:'KUMSAL SES İSTASYONU',t36:'ÜNLÜ SES LABORATUVARI',t45:'SON SES ATÖLYESİ',t50:'KELİME MANAVI',t56:'KARŞITLAR İSTASYONU',t61:'DİNLEME KEŞİF ÜSSÜ'}[GAME_ID];
 if(ozelSepet){
  $('#stage').innerHTML=`<div class="sound-sort-world sort-${GAME_ID}"><span class="sound-sort-title">${sepetBaslik}</span>
   <div class="sound-source-grid">${r.nesneler.map((n,i)=>{const bitti=(state.yerlesen||[]).some(x=>x.n===i);return `<button class="sound-source${secili.indexOf(i)>=0?' secili':''}${bitti?' dogru':''}" data-n="${i}" ${bitti?'disabled':''}>${n.im}<small>${yaziAcik?esc(n.ad):'Dokun ve dinle'}</small></button>`}).join('')}</div>
   <div class="sound-baskets">${sepetler.map((s,i)=>`<button class="sound-basket" data-sepet="${i}"><span class="basket-icon">${s.im}</span>${esc(s.ad)}<span class="basket-load">${(state.yerlesen||[]).filter(x=>x.sepet===i).map(x=>r.nesneler[x.n].im).join('')||'…'}</span></button>`).join('')}</div>
   <div class="caption">${esc(state.not||r.gorev)}</div></div>`;
  $('#task').innerHTML=`<div class="caption">${['t50','t56','t61'].includes(GAME_ID)?'Nesneyi gerçek hedefe sürükle; istersen dokunup da seçebilirsin':'Nesneye dokunup dinle, sonra doğru hedefe dokun'}</div>`;
 }else{$('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,'')}
  <div class="nesne-alan">${sepetler.map((s,i)=>`<div class="resim-kart" style="cursor:default;border-style:solid">
    <span class="im">${s.im}</span><span class="ad">${esc(s.ad)}</span>
    <span class="ad">${(state.yerlesen||[]).filter(x=>x.sepet===i).map(x=>r.nesneler[x.n].im).join('')||'…'}</span></div>`).join('')}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div></div>`;
 $('#task').innerHTML=`<div class="nesne-alan">${r.nesneler.map((n,i)=>{
   const bitti=(state.yerlesen||[]).some(x=>x.n===i);
   return `<button class="resim-kart${secili.indexOf(i)>=0?' secili':''}${bitti?' dogru':''}" data-n="${i}" ${bitti?'disabled':''}>
    <span class="im">${n.im}</span><span class="ad">${yaziAcik?esc(n.ad):'🔊'}</span></button>`}).join('')}</div>
  <div class="actions">${sepetler.map((s,i)=>`<button class="action" data-sepet="${i}">${s.im} ${esc(s.ad)}</button>`).join('')}</div>`}
 /* Nesneye dokunmak önce adını çalar; ikinci dokunuş seçer. Böylece
    işitsel karar yazıdan değil sesten veriliyor. */
 $$('[data-n]').forEach(b=>b.onclick=()=>{const i=+b.dataset.n;
  const s=(state.secili||[]).slice(),k=s.indexOf(i);
  if(k<0){s.push(i);speak(r.nesneler[i].ad,true)}else s.splice(k,1);
  state.secili=s;state.not=k<0?'Adını dinledin. Şimdi sepeti seç ya da başka nesneye dokun.':'';sepetCiz(r)});
 $$('[data-sepet]').forEach(b=>b.onclick=()=>{const sp=+b.dataset.sepet;
  const s=state.secili||[];
  if(!s.length)return uyar('Önce bir nesneye dokunup adını dinle.');
  const yanlis=s.find(i=>r.nesneler[i].sepet!==sp);
  if(yanlis!=null){const n=r.nesneler[yanlis];
   state.secili=[];state.not=n.hint||'“'+n.ad+'” sözcüğünü bir daha dinle: aradığın ses var mı?';
   sepetCiz(r);speak(n.ad,true);return wrong(state.not)}
  state.yerlesen=(state.yerlesen||[]).concat(s.map(i=>({n:i,sepet:sp})));
  state.secili=[];state.not='Sepete girdi.';sepetCiz(r);
  if(state.yerlesen.length>=r.nesneler.length){state.acik=true;state.not=r.result||'';sepetCiz(r);good()}});
 /* Yeni kelime oyunlarında nesne gerçekten sahnedeki sepete bırakılabilir.
    Dokun-seç yolu motor erişilebilirliği için ayrıca korunur. */
 if(['t50','t56','t61'].includes(GAME_ID))$$('[data-n]').forEach(b=>{
  let bas=null,suruk=false;
  const hareket=e=>{if(!bas)return;if(!suruk&&Math.hypot(e.clientX-bas.x,e.clientY-bas.y)<8)return;
   if(!suruk){suruk=true;b._suruklendi=true;const q=b.getBoundingClientRect();b.style.width=q.width+'px';b.style.height=q.height+'px';b.classList.add('dragging')}
   b.style.left=(e.clientX-b.offsetWidth/2)+'px';b.style.top=(e.clientY-b.offsetHeight/2)+'px'};
  const temizle=()=>{window.removeEventListener('pointermove',hareket);window.removeEventListener('pointerup',birak);window.removeEventListener('pointercancel',iptal)};
  const birak=e=>{if(!bas)return;bas=null;temizle();if(!suruk)return;
   const hedef=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-sepet]');
   b.classList.remove('dragging');b.style.cssText='';suruk=false;
   if(!hedef){state.not='Nesneyi iki gerçek hedeften birinin içine bırak.';return sepetCiz(r)}
   state.secili=[+b.dataset.n];hedef.click()};
  const iptal=()=>{bas=null;temizle();suruk=false;b.classList.remove('dragging');b.style.cssText=''};
  b.onpointerdown=e=>{if(b.disabled)return;bas={x:e.clientX,y:e.clientY};window.addEventListener('pointermove',hareket);window.addEventListener('pointerup',birak);window.addEventListener('pointercancel',iptal)};
  const tikla=b.onclick;b.onclick=e=>{if(b._suruklendi){b._suruklendi=false;return}tikla(e)}
 })}
function renderSepet(r){state.secili=[];state.yerlesen=[];state.acik=false;state.not='';sepetCiz(r)}

/* ===================== KONUM: sesin baş-orta-son yeri (t02 tur 2) ===================== */
function konumCiz(r){const i=state.ix||0,n=r.nesneler[i];
 if(!n)return;
 const ozelKonum=['t12','t19','t28','t36','t45','t50','t61'].includes(GAME_ID),konumBaslik={t12:'SERADA SESİN YERİ',t19:'PAZARDA SESİN YERİ',t28:'KUMSALDA SESİN YERİ',t36:'ÜNLÜNÜN YERİ',t45:'SON SESİN YERİ',t50:'MANAVDA SESİN YERİ',t61:'DİNLEDİĞİN SESİN YERİ'}[GAME_ID];
 $('#stage').innerHTML=ozelKonum?`<div class="sound-position-world position-${GAME_ID}"><span class="sound-sort-title">${konumBaslik}</span><div class="position-object">${n.im}<small>${(state.acik||sesYok())?esc(n.ad):'🔊 Dinle'}</small></div><div class="caption">${esc(state.not||r.gorev)}</div><div class="caption">${i+1}/${r.nesneler.length}</div></div>`:`<div class="stack">${sahneSvg(r.sahne,'')}
  <div class="nesne-alan"><div class="resim-kart" style="cursor:default;border-style:solid"><span class="im">${n.im}</span>
   <span class="ad">${(state.acik||sesYok())?esc(n.ad):'🔊'}</span></div></div>
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">${i+1}/${r.nesneler.length}</div></div>`;
 $('#task').innerHTML=`<div class="actions"><button class="action" id="adDinle">🔊 Adını dinle</button></div>
  <div class="serit">${['Başta','Ortada','Sonda'].map((k,j)=>`<button data-k="${j}">${k}</button>`).join('')}</div>`;
 $('#adDinle').onclick=()=>speak(n.ad,true);
 $$('[data-k]').forEach(b=>b.onclick=()=>{const j=+b.dataset.k;
  if(j!==n.konum){state.not=n.hint||'“'+n.ad+'” sözcüğünü yavaşça dinle: '+sesOku(r.ses)+' sesi neredeydi?';
   konumCiz(r);speak(n.ad,true);return wrong(state.not)}
  state.acik=true;state.not='Doğru: '+n.ad+' sözcüğünde '+sesOku(r.ses)+' sesi '+['başta','ortada','sonda'][j]+'.';
  konumCiz(r);
  if(i+1>=r.nesneler.length)return gecisBasla(()=>good(),FAST?40:700);
  gecisBasla(()=>{state.ix=i+1;state.acik=false;state.not='';konumCiz(r)},FAST?40:800)})}
function renderKonum(r){state.ix=0;state.acik=false;state.not='';konumCiz(r)}

/* ===================== BALON: büyük-küçük harf ayırt etme (t03) =====================
   Şartname: gerçek baloncuk, sepet/kova yok, iki yazı biçimi ve iki boyut,
   süre baskısı yok, yanlışta iki harf yan yana büyütülerek karşılaştırılıyor. */
const YAZIM=['ui-rounded, "Trebuchet MS", system-ui, sans-serif','Georgia, "Times New Roman", serif'];
function balonCiz(r){
 const patlak=state.patlak||[];
 const noktalar=[[18,26],[50,21],[82,28],[25,59],[57,55],[84,62]];
 const ortam={t13:'🌻',t20:'🔎',t29:'🌀',t37:'🪞'}[GAME_ID]||'🤿';
 const balonlar=`<div class="bubble-playfield balloon-${GAME_ID}">${r.baloncuklar.map((b,i)=>{
   const bitti=patlak.indexOf(i)>=0;
   const st=`font-family:${YAZIM[b.yazim||0]};font-size:${b.buyuk?40:26}px`;
   const p=noktalar[i%noktalar.length];
   return `<button class="bubble-target${bitti?' dogru':''}" data-b="${i}" ${bitti?'disabled':''}
     style="--x:${p[0]}%;--y:${p[1]}%;${st}">${bitti?'💥':esc(b.h)}</button>`}).join('')}<span style="position:absolute;right:16px;bottom:22px;font-size:31px">${ortam}</span></div>`;
 $('#stage').innerHTML=`<div class="stack">${balonlar}
  ${state.kars?`<div class="nesne-alan"><div class="resim-kart" style="cursor:default;border-style:solid"><span class="im" style="font-size:46px">${esc(state.kars[0])}</span><span class="ad">seçtiğin</span></div>
   <div class="resim-kart" style="cursor:default;border-style:solid"><span class="im" style="font-size:46px">${esc(state.kars[1])}</span><span class="ad">aranan</span></div></div>`:''}
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">Patlatılan: ${patlak.length}/${r.baloncuklar.filter(b=>b.dogru).length}</div></div>`;
 $('#task').innerHTML='<div class="caption">Balonlara doğrudan gökyüzünde dokun</div>';
 $$('[data-b]').forEach(el=>el.onclick=()=>{const i=+el.dataset.b,b=r.baloncuklar[i];
  if(!b.dogru){state.kars=[b.h,r.hedefler[0]];
   state.not=b.hint||'“'+b.h+'” ile “'+r.hedefler[0]+'” biçimlerini karşılaştır: çizgileri aynı mı?';
   balonCiz(r);return wrong(state.not)}
  state.patlak=(state.patlak||[]).concat(i);state.kars=null;state.not='Patladı!';
  speak(sesOku(r.ses));balonCiz(r);
  if(state.patlak.length>=r.baloncuklar.filter(x=>x.dogru).length){state.not=r.result||'';balonCiz(r);good()}})}
function renderBalon(r){state.patlak=[];state.kars=null;state.not='';balonCiz(r)}


/* Bazı turlar şartnamede birden çok kurulum istiyor (ör. "NA açık ve AN kapalı
   karşılaştırılır"). Aşama listesi bunu tek turda sırayla yürütüyor. */
function asama(r){return (r.asamalar&&r.asamalar[state.asama||0])||r}
function asamaSayisi(r){return r.asamalar?r.asamalar.length:1}
function asamaIlerle(r,devam){
 if((state.asama||0)+1>=asamaSayisi(r))return gecisBasla(()=>good(),FAST?40:700);
 gecisBasla(()=>{state.asama=(state.asama||0)+1;devam()},FAST?40:800)}

/* ===================== TREN: sesleri birleştirip hece kurma (t04) =====================
   Şartname: gerçek lokomotif ve vagonlar, hedef hece başta yazılı değil,
   sesler soldan sağa kesintisiz kaynaşıyor, açık/kapalı etiketi çocuk seçiyor. */
function trenCiz(r){const a=asama(r);
 const yer=state.yer||[null,null];
 const tc=['t14','t21','t30','t38','t46'].includes(GAME_ID)?`stack train-scene train-${GAME_ID}`:'stack';
 $('#stage').innerHTML=`<div class="${tc}">${sahneSvg('wagons','')}
  <div class="vagon-alan"><span style="font-size:30px">🚂</span>
   ${yer.map((v,i)=>`<div class="vagon${v!=null?' dolu':''}${yer.indexOf(null)===i?' aktif':''}">${v!=null?esc(a.sesler[v]):'…'}</div>`).join('<span style="font-size:15px;color:#5b7185">→</span>')}</div>
  ${state.kuruldu?`<div class="hece-kutu">${esc(state.kuruldu)}</div>`:''}
  <div class="caption">${esc(state.not||a.gorev||r.gorev)}</div>
  <div class="caption">Vagon dizisi ${(state.asama||0)+1}/${asamaSayisi(r)}</div></div>`;
 if(state.faz===1){
  $('#task').innerHTML=`<div class="caption">Kurduğun hece hangi sesle bitiyor?</div>
   <div class="choices"><button class="choice" data-tip="acik">Ünlüyle bitiyor · AÇIK hece</button>
    <button class="choice" data-tip="kapali">Ünsüzle bitiyor · KAPALI hece</button></div>`;
  $$('[data-tip]').forEach(b=>b.onclick=()=>{
   if(b.dataset.tip!==a.tip)return wrong('Hecenin SON sesini söyle: ünlü mü, ünsüz mü?');
   state.not=a.sonuc||'';trenCiz(r);
   asamaIlerle(r,()=>{state.yer=[null,null];state.faz=0;state.kuruldu='';state.not='';trenCiz(r)})});
  return}
 $('#task').innerHTML=`<div class="actions"><button class="action" id="hedefDinle">🔊 Heceyi dinle</button>
   <button class="action" id="vagonGeri">↩ Son vagonu çıkar</button></div>
  <div class="actions">${gsHavuz('ses',a.sesler.length,a.dogru,2).map(i=>`<button class="choice" data-ses="${i}" ${yer.indexOf(i)>=0?'disabled style="opacity:.35"':''}>${esc(a.sesler[i])}</button>`).join('')}</div>`;
 $('#hedefDinle').onclick=()=>speak(a.hedefSes,true);
 $('#vagonGeri').onclick=()=>{const y=(state.yer||[null,null]).slice();
  for(let i=y.length-1;i>=0;i--)if(y[i]!=null){y[i]=null;break}
  state.yer=y;state.not='Son vagon çıkarıldı.';trenCiz(r)};
 $$('[data-ses]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ses;
  const y=(state.yer||[null,null]).slice(),k=y.indexOf(null);
  if(k<0)return uyar('İki vagon da dolu. Önce son vagonu çıkar.');
  if(a.dogru[k]!==i){
   /* Yanlış sırada vagonlar çarpışmasın: iki ses ayrı ayrı çalınıp sıra vurgulanır. */
   state.not='Bu ses '+(k===0?'ilk':'ikinci')+' vagona gelmiyor. Heceyi bir daha dinle.';
   speak(a.sesler[i].toLocaleLowerCase('tr')+' … '+a.hedefSes,true);
   trenCiz(r);return wrong(state.not)}
  y[k]=i;state.yer=y;state.not='';
  if(y.every(x=>x!=null)){
   state.kuruldu=a.dogru.map(x=>a.sesler[x]).join('');
   speak(state.kuruldu.toLocaleLowerCase('tr'),true);
   state.not='Vagonlar birleşti: '+state.kuruldu;trenCiz(r);
   if(!a.tip)return asamaIlerle(r,()=>{state.yer=[null,null];state.kuruldu='';state.not='';trenCiz(r)});
   return gecisBasla(()=>{state.faz=1;state.not='Şimdi bu hecenin türünü seç.';trenCiz(r)},FAST?40:800)}
  trenCiz(r)})}
function renderTren(r){state.asama=0;state.yer=[null,null];state.faz=0;state.kuruldu='';state.not='';trenCiz(r)}

/* ===================== KURBAĞA: heceyi işitsel tanıma (t05) =====================
   Şartname: gerçek gölet ve nilüfer, hedef ilk turda yalnız sesli, yapraklar
   sabit, süre ilk turlarda ölçülmüyor, ters sıralı heceler karşılaştırılıyor. */
function kurbagaCiz(r){
 const ix=state.ix||0,hedef=r.hedefler[ix];
 if(!hedef)return;
 const yapraklar=`<div class="pond-playfield pond-${GAME_ID}"><span class="pond-frog">🐸</span><div class="pond-leaves">${gs('yaprak',r.yapraklar.length,3).map(i=>`<button class="pond-leaf" data-y="${i}">${esc(r.yapraklar[i])}</button>`).join('')}</div></div>`;
 $('#stage').innerHTML=`<div class="stack">${yapraklar}
  ${state.acik?`<div class="hece-kutu">${esc(hedef)}</div>`:''}
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">Hedef ${ix+1}/${r.hedefler.length}${state.sure!=null?' · süre '+state.sure.toFixed(1).replace('.',',')+' sn':''}</div></div>`;
 $('#task').innerHTML='<div class="actions"><button class="action" id="heceDinle">🔊 Heceyi dinle</button></div>';
 $('#heceDinle').onclick=()=>speak(hedef.toLocaleLowerCase('tr'),true);
 $$('[data-y]').forEach(b=>b.onclick=()=>{const i=+b.dataset.y;
  if(r.yapraklar[i]!==hedef){
   /* Yanlış yaprakta kurbağa başlangıçta kalır; ilk/son sesler karşılaştırılır. */
   state.not='Kurbağa yerinde kaldı. “'+r.yapraklar[i]+'” ile duyduğun hecenin ilk ve son sesleri aynı mı?';
   speak(r.yapraklar[i].toLocaleLowerCase('tr')+' … '+hedef.toLocaleLowerCase('tr'),true);
   kurbagaCiz(r);return wrong(state.not)}
  state.acik=true;state.not='Kurbağa doğru yaprağa zıpladı: '+hedef;
  speak(hedef.toLocaleLowerCase('tr'));kurbagaCiz(r);
  if(ix+1>=r.hedefler.length){
   /* Akıcılık süresi yalnız bütün diziyi doğru okuduktan sonra gösteriliyor. */
   if(r.sureOlc)state.sure=(performance.now()-state.t0)/1000;
   state.not=r.result||'';kurbagaCiz(r);return gecisBasla(()=>good(),FAST?40:700)}
  gecisBasla(()=>{state.ix=ix+1;state.acik=false;state.not='';kurbagaCiz(r)},FAST?40:800)})}
function renderKurbaga(r){state.ix=0;state.acik=false;state.not='';state.sure=null;
 state.t0=performance.now();kurbagaCiz(r)}

/* ===================== UZAY: ses sırasıyla hece inşa (t06) =====================
   Şartname: meteorlar sabit, yönerge sırayı söylemiyor, hedef yazısı cevaptan
   önce görünmüyor, geri gönder düğmesi yalnız son seçimi düzeltiyor. */
function uzayCiz(r){const a=asama(r);
 const yer=state.yer||[null,null];
 const uc=['t22','t48'].includes(GAME_ID)?`stack space-scene space-${GAME_ID}`:'stack';
 $('#stage').innerHTML=`<div class="${uc}">${sahneSvg('space','')}
  <div class="vagon-alan">${yer.map((v,i)=>`<div class="vagon${v!=null?' dolu':''}${yer.indexOf(null)===i?' aktif':''}">${v!=null?esc(a.meteorlar[v]):'…'}</div>`).join('<span style="font-size:15px;color:#5b7185">→</span>')}</div>
  ${state.kuruldu?`<div class="hece-kutu">${esc(state.kuruldu)}</div>`:''}
  <div class="caption">${esc(state.not||a.gorev||r.gorev)}</div>
  <div class="caption">Kapsül ${(state.asama||0)+1}/${asamaSayisi(r)}</div></div>`;
 if(state.faz===1&&a.kelimeSec){
  $('#task').innerHTML=`<div class="caption">${esc(a.kelimeSec.gorev)}</div>
   <div class="nesne-alan">${gs('ksec',a.kelimeSec.secenekler.length,5).map(i=>a.kelimeSec.secenekler[i]).map(c=>`<button class="resim-kart" data-k="${a.kelimeSec.secenekler.indexOf(c)}"><span class="im">${c.im}</span><span class="ad">${state.acik?esc(c.ad):''}</span></button>`).join('')}</div>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{const c=a.kelimeSec.secenekler[+b.dataset.k];
   if(!c.correct)return wrong(c.hint||'Kurduğun heceyle başlayan görseli seç.');
   state.acik=true;state.not=a.sonuc||r.result||'';uzayCiz(r);
   asamaIlerle(r,()=>{state.yer=[null,null];state.faz=0;state.kuruldu='';state.acik=false;state.not='';uzayCiz(r)})});
  return}
 $('#task').innerHTML=`<div class="actions"><button class="action" id="uzayDinle">🔊 Heceyi dinle</button>
   <button class="action" id="uzayGeri">↩ Son meteoru geri gönder</button></div>
  <div class="actions">${gsHavuz('met',a.meteorlar.length,a.dogru,4).map(i=>`<button class="choice" data-m="${i}" ${yer.indexOf(i)>=0?'disabled style="opacity:.35"':''}>${esc(a.meteorlar[i])}</button>`).join('')}</div>`;
 $('#uzayDinle').onclick=()=>speak(a.hedefSes,true);
 $('#uzayGeri').onclick=()=>{const y=(state.yer||[null,null]).slice();
  for(let i=y.length-1;i>=0;i--)if(y[i]!=null){y[i]=null;break}

function sandikCiz(r){
 const dunya={t52:['KÜTÜPHANE ARŞİVİ','📚'],t53:['SORU DEDEKTİFLERİ','🕵️'],t55:['NOKTALAMA KASASI','❓'],t57:['OLAY ZAMAN TÜNELİ','⏳'],t62:['GÖRSEL OKUMA GALERİSİ','🖼️'],t63:['YÖNERGE KONTROL ÜSSÜ','🎛️']}[GAME_ID];

   Şartname: hedef kelime hiçbir yerde yazılı değil, harf paleti karıştırılıyor,
   DİNLE sınırsız ve cezasız, GÖSTER iki denemeden önce açılmıyor, ipuçları

function dikteKur(r){const a=asama(r);
 const havuz=a.palet.slice(),idx=karistir(havuz,turTohumu((state.asama||0)+3));
 let p=idx.map(i=>havuz[i]);
 const harfDizisi=a.kelime.split('').filter(c=>c!==' ');
 if(p.slice(0,harfDizisi.length).join('')===harfDizisi.join(''))p.push(p.shift());
 state.palet=p;state.yaz=[];state.ipucu='';state.onizleme=false;state.faz=0;state.acik=false;state.not=''}
function dikteCiz(r){const a=asama(r),hedef=a.kelime,yaz=state.yaz||[];
 const gosterAcik=(state.deneme||0)>=2;
 const dunya={t58:['DİKTE DEFTERİ','📓'],t59:['UZUN KELİME PRESİ','⚙️'],t60:['BOŞLUK STÜDYOSU','⌨️']}[GAME_ID];
 const dc=dunya?`stack dictation-world dictation-${GAME_ID}`:'stack';
 $('#stage').innerHTML=`<div class="${dc}">${dunya?`<span class="world-title">${dunya[0]}</span><span class="world-prop">${dunya[1]}</span>`:sahneSvg('typewriter',
   state.onizleme?`<text x="165" y="100" font-size="24" font-weight="900" text-anchor="middle" fill="#1f3b52">${esc(hedef)}</text>`:'')}
  ${dunya&&state.onizleme?`<div class="hece-kutu">${esc(hedef)}</div>`:''}
  <div class="dikte-yuva">${hedef.split('').map((c,i)=>{
    const bos=c===' ';
    return `<span class="${bos?'bosluk':''}${yaz[i]?' dolu':''}${yaz.length===i?' aktif':''}">${bos?'␣':(yaz[i]||'')}</span>`}).join('')}</div>
  ${hedef.indexOf(' ')>=0?'<div class="caption">␣ = boşluk yuvası</div>':''}
  <div class="caption">${esc(state.not||a.gorev||r.gorev)}</div>
  <div class="caption">Kelime ${(state.asama||0)+1}/${asamaSayisi(r)} · deneme ${state.deneme||0} · ipucu: ${esc(state.ipucu||'yok')}</div></div>`;
 if(state.faz===1&&a.resimSec)return dikteResim(r);
 $('#task').innerHTML=`<div class="actions"><button class="action" id="dikteDinle">🔊 Dinle</button>
   <button class="action" id="dikteIpucu">💡 İpucu</button>
   <button class="action" id="dikteGoster" ${gosterAcik?'':'disabled style="opacity:.35"'}>👁 Göster</button>
   <button class="action" id="dikteSil">⌫ Sil</button></div>
  <div class="palet">${state.palet.map(h=>`<button data-hp="${esc(h)}">${h===' '?'␣':esc(h)}</button>`).join('')}</div>`;
 $('#dikteDinle').onclick=()=>speak(hedef,true);
 $('#dikteIpucu').onclick=()=>{
  if(!state.ipucu){state.ipucu='hece sayısı';state.not='İpucu: bu sözcük '+a.heceSayisi+' hecelidir.'}
  else if(state.ipucu==='hece sayısı'){state.ipucu='ilk ses';state.not='İpucu: ilk ses '+sesOku(a.ilkSes)+'.'}
  else state.not='Başka ipucu yok. Göster iki denemeden sonra açılır.';
  speak(state.not);dikteCiz(r)};
 $('#dikteGoster').onclick=()=>{if(!gosterAcik)return uyar('Göster iki bağımsız denemeden sonra açılır.');
  state.onizleme=true;state.not='Kısa ön izleme. Yazdığın harfler silinmedi.';dikteCiz(r);
  ertele(()=>{state.onizleme=false;state.not='Ön izleme kapandı; kaldığın yerden devam et.';dikteCiz(r)},FAST?40:1800)};
 $('#dikteSil').onclick=()=>{const y=(state.yaz||[]).slice();
  if(!y.length)return uyar('Silinecek harf yok.');
  y.pop();state.yaz=y;state.not='Son harf silindi.';dikteCiz(r)};
 $$('[data-hp]').forEach(b=>b.onclick=()=>{const h=b.dataset.hp;
  const y=(state.yaz||[]).slice(),i=y.length;
  if(i>=hedef.length)return uyar('Bütün yuvalar dolu.');
  if(hedef[i]!==h){
   /* Yanlış harfte bütün kelime silinmez; yalnız o konum boş kalır. */
   state.deneme=(state.deneme||0)+1;
   state.not='O ses buraya gelmiyor. Kelimeyi bir daha dinle; yazdıkların duruyor.';
   speak(hedef,true);dikteCiz(r);return wrong(state.not)}
  y.push(h);state.yaz=y;state.not='';
  if(y.length>=hedef.length){
   speak(hedef,true);state.not='Yazdın: '+hedef;dikteCiz(r);
   if(!a.resimSec)return asamaIlerle(r,()=>{dikteKur(r);dikteCiz(r)});
   return gecisBasla(()=>{state.faz=1;state.not='';dikteResim(r)},FAST?40:800)}
  dikteCiz(r)})}

 $('#stage').innerHTML=`<div class="stack">${sahneSvg('typewriter','')}

 $$('[data-r]').forEach(b=>b.onclick=()=>{const c=a.resimSec.secenekler[+b.dataset.r];

  state.acik=true;state.not=a.sonuc||r.result||'';dikteResim(r);
  asamaIlerle(r,()=>{dikteKur(r);dikteCiz(r)})})}
function renderDikte(r){state.asama=0;state.deneme=0;dikteKur(r);dikteCiz(r)}
