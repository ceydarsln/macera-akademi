<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kesir ve Saat Atölyesi — Phaser 3</title>
<script src="phaser.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#20160e; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  #oyun { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="oyun"></div>
<script>
/* =====================================================================
   KESİR VE SAAT ATÖLYESİ — Phaser 3
   (mekanik: fractionCut + clockSet · 2 + 2 = 4 oyun)
   ---------------------------------------------------------------------
   Kazanım: MAT.2.1.7 — Bütün, yarım ve çeyrek ilişkisini çözümler.
   MAT.2.1.9 — Tam, yarım ve çeyrek saati okur ve gösterir.

   NOT — iki mekanik tek şablon:
   İkisinin çekirdeği aynı: BİR BÜTÜNÜ eşit parçalara ayırmak. Pizzada
   parça sayısı, saatte ise kadranın çeyrekleri. Şablon tur tipine göre
   (kesme / saat) ilgili aşamayı kuruyor.

   Fizik    : Arcade. Kesilen dilimler GERÇEK FİZİKLE ayrılıp tahtaya
              savrulur. Saat doğru ayarlanınca çarklar fırlar; yanlışta
              ibre yaylanarak geri döner.
   ===================================================================== */

const EN = 480, BOY = 800;

const RENK = {
  zeminUst : 0x2b1d12,
  zeminAlt : 0x54391f,
  dogru    : 0x34c47b,
  yanlis   : 0xf07575,
  hamur    : 0xf2c26b,
  kabuk    : 0xb9762a,
  kadran   : 0xf7f4ea,
  vurgu    : 0xffd166
};

/* ---------------- uygulama köprüsü ----------------
   Uygulamanın içine iframe olarak gömüldüğünde adres  kesirsaat.html#oyun=v08
   biçiminde olur. Sayfa uygulamayla AYNI kaynaktan sunulduğu için üst
   pencereden katalog verisi doğrudan okunabiliyor. Böylece 2 fractionCut +
   2 clockSet oyununun hepsi bu tek şablonla oynanıyor. Kazanınca
   completeGame() çağrılır; XP, altın, kutlama ve sıradaki oyuna geçiş
   uygulamada kalır.
   Köprü yoksa (dosya tek başına açıldıysa) örnek içerik oynanır.        */
const KOPRU = (function(){
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const id = p.get('oyun');
    if (id && window.parent && window.parent !== window &&
        typeof window.parent.getGame === 'function'){
      const g = window.parent.getGame(id);
      if (g && g.cfg) return {
        oyun: g, cfg: g.cfg,
        bitir(mesaj, puan){ try{ window.parent.completeGame(mesaj || '', puan); }catch(e){} },
        /* Turun kendi metnini uygulamanın sesiyle okutur (Piper). */
        oku(metin){ try{ if (window.parent.oku) window.parent.oku(metin); }catch(e){} },
        /* Kaybetme ekranından: bu oyunu bırak, sıradakine geç. */
        atla(){ try{ if (window.parent.sonrakiOyunaGec) window.parent.sonrakiOyunaGec(); }catch(e){} }
      };
    }
  }catch(e){ /* çapraz kaynak engeli: tek başına oynanır */ }
  return null;
})();

/* HTML varlıklarını çöz: katalogda "Pay &lt; payda" gibi yazımlar var,
   çözülmezse ekranda "&lt;" olarak görünüyor ve öyle okunuyor. */
function varlikCoz(m){
  return String(m)
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
    .replace(/&hellip;/gi, '…').replace(/&mdash;/gi, '—').replace(/&ndash;/gi, '–')
    .replace(/&times;/gi, '×').replace(/&divide;/gi, '÷').replace(/&deg;/gi, '°')
    .replace(/&rarr;/gi, '→').replace(/&larr;/gi, '←')
    .replace(/&amp;/gi, '&');            /* en sona: çift çözmeyi önler */
}

function duzMetin(x){
  return varlikCoz(String(x == null ? '' : x).replace(/<br\s*\/?>/gi,' ')
    .replace(/<[^>]+>/g,'')).replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}

const VARSAYILAN = {   /* şablon tek başına açıldığında: uygulamadaki v08 */
  instruction:'Hoş geldin şef! Bu bütün pizzayı paylaşmak için önce <b>iki eş parçaya</b> bölmeliyiz.',
  emoji:'🍕', color:'#f2c26b',
  steps:[
    {need:2, label:'2’ye Böl', ask:'Bütünü iki eş parçaya böl',
     msg:'Harika! Bir bütünden iki eşit yarım elde ettik.',
     wrongHint:'Önce bütünü İKİ eş parçaya bölmeliyiz.'},
    {need:4, label:'4’e Böl', ask:'Yarımları da ikiye böl — kaç çeyrek çıkacak?',
     msg:'Bir bütünden dört çeyrek çıktı!',
     wrongHint:'Şimdi dört eş parçaya bölmelisin.'}
  ],
  successMsg:'1 bütün = 2 yarım = 4 çeyrek. Afiyet olsun şef! 🍕'
};

const CFG = KOPRU ? KOPRU.cfg : VARSAYILAN;

/* ---------------------------------------------------------------------
   İÇERİK — katalogdaki iki mekanik
   ---------------------------------------------------------------------
   fractionCut : cfg.steps[{need, label, ask, msg, say, wrongHint}]
                 → bütünü istenen sayıda EŞ parçaya böl.
   clockSet    : cfg.rounds[{targetH, targetM, label, say}]
                 → akrep ve yelkovanı hedef saate getir. Katalogda saat
                   24'lük olabiliyor (14:45); kadran 12'lik olduğu için
                   1–12 aralığına çevriliyor.
   ------------------------------------------------------------------- */
const SAAT_MI = Array.isArray(CFG.rounds) && CFG.rounds.length > 0;

const OYUN_ADI = KOPRU ? duzMetin(KOPRU.oyun.title) : 'KESİR VE SAAT\nATÖLYESİ';
const OYUN_EMO = KOPRU ? (KOPRU.oyun.emo || '🍕') : '🍕';
const TALIMAT  = duzMetin(CFG.instruction) || 'Bütünü eşit parçalara ayır';
const IPUCU    = duzMetin(CFG.tip) ||
  (SAAT_MI ? 'Kadran çeyreklere ayrılır: 15 dakika bir çeyrektir.'
           : '1 bütün = 2 yarım = 4 çeyrek.');
const BASARI   = duzMetin(CFG.successMsg) ||
  (SAAT_MI ? 'Saat ustası! Tam, buçuk ve çeyrek saatleri gösterdin 🕰️'
           : 'Bütünü eşit parçalara ayırmayı öğrendin 🍕');
const BASLIK_KISA = SAAT_MI ? 'SAAT ATÖLYESİ' : 'KESİR ATÖLYESİ';

/* Kesme turunda seçenek düğmeleri: gereken parça sayıları + oyalayıcılar */
function kesmeSecenekleri(gerekenler){
  const secim = [];
  gerekenler.forEach(n => { if (secim.indexOf(n) < 0) secim.push(n); });
  [2, 3, 4, 6, 8].forEach(n => { if (secim.length < 4 && secim.indexOf(n) < 0) secim.push(n); });
  return secim.sort((a, b) => a - b);
}

const TURLAR = (function(){
  if (SAAT_MI){
    const adimlar = CFG.rounds.map(r => ({
      /* 24'lük saat → 12'lik kadran (14 → 2) */
      saat: ((Number(r.targetH) - 1 + 12) % 12) + 1,
      dakika: ((Number(r.targetM) || 0) % 60 + 60) % 60,
      etiket: duzMetin(r.label) || (r.targetH + ':' + String(r.targetM || 0).padStart(2, '0')),
      seslen: duzMetin(r.say)
    })).filter(a => isFinite(a.saat));
    if (!adimlar.length) return [];
    return [{
      tip:'saat', gorev: TALIMAT, seslen: duzMetin(CFG.speak) || TALIMAT,
      adimlar: adimlar,
      hata: duzMetin(CFG.wrongMsg) || 'Saat yanlış — akrep ve yelkovanı yeniden ayarla.',
      tamam: BASARI
    }];
  }

  const adimlar = (CFG.steps || []).map(a => ({
    gerek: Math.max(2, Number(a.need) || 2),
    etiket: duzMetin(a.label) || ((a.need || 2) + '’ye Böl'),
    soru: duzMetin(a.ask) || 'Bütünü eş parçalara böl',
    tamam: duzMetin(a.msg) || 'Doğru!',
    seslen: duzMetin(a.say),
    hata: duzMetin(a.wrongHint) || 'Parça sayısına bir daha bak.'
  }));
  if (!adimlar.length) return [];
  return [{
    tip:'kesme', gorev: TALIMAT, seslen: duzMetin(CFG.speak) || TALIMAT,
    adimlar: adimlar,
    secenekler: kesmeSecenekleri(adimlar.map(a => a.gerek)),
    tamam: BASARI
  }];
})();

const CAN_SAYISI = 3;

/* --- Yerleşim -------------------------------------------------------- */
const MERKEZ_Y = 372;
const YARICAP  = 118;
const TUS_Y    = 578;
/* Pizzanın/çikolatanın rengi katalogdan (cfg.color) */
const HAMUR_RENK = (function(){
  const c = String(CFG.color || '').replace('#','');
  return /^[0-9a-fA-F]{6}$/.test(c) ? parseInt(c, 16) : RENK.hamur;
})();
const BUTUN_EMOJI = CFG.emoji || '🍕';

/* =====================================================================
   BOOT
   ===================================================================== */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }
  create(){
    let g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1); g.fillCircle(8, 8, 8);
    g.generateTexture('kivilcim', 16, 16); g.destroy();
    g = this.make.graphics({ add:false });
    for (let r = 14; r > 0; r--){ g.fillStyle(0xffffff, 0.06); g.fillCircle(14, 14, r); }
    g.generateTexture('toz', 28, 28); g.destroy();
    g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1); g.fillCircle(9, 9, 9);
    g.fillStyle(0x000000, 0.25); g.fillCircle(9, 9, 4);
    g.generateTexture('cark', 18, 18); g.destroy();
    /* Uygulama içinde çocuk oyunu listeden zaten seçti; menüyü atla. */
    this.scene.start(KOPRU ? 'Game' : 'Menu');
  }
}

/* =====================================================================
   Ortak
   ===================================================================== */
function mutfakCiz(sc){
  const g = sc.add.graphics();
  g.fillGradientStyle(RENK.zeminUst, RENK.zeminUst, RENK.zeminAlt, RENK.zeminAlt, 1);
  g.fillRect(0, 0, EN, BOY);
  g.lineStyle(1, 0xffffff, 0.04);
  for (let x = 0; x <= EN; x += 48) g.lineBetween(x, 0, x, BOY);
  for (let y = 0; y <= BOY; y += 48) g.lineBetween(0, y, EN, y);
  return g;
}

function dugmeYap(sc, x, y, metin, renk, geriCagri, genislik, yukseklik){
  const W = genislik || 280, H = yukseklik || 60;
  const c = sc.add.container(x, y);
  const g = sc.add.graphics();
  g.fillStyle(renk, 1);
  g.fillRoundedRect(-W / 2, -H / 2, W, H, Math.min(H / 2, 26));
  g.fillStyle(0xffffff, 0.16);
  g.fillRoundedRect(-W / 2, -H / 2, W, H * 0.4, { tl:Math.min(H / 2, 26), tr:Math.min(H / 2, 26), bl:0, br:0 });
  const t = sc.add.text(0, 0, metin, { fontFamily:'system-ui, sans-serif',
    fontSize: H > 52 ? '20px' : '16px', fontStyle:'bold', color:'#ffffff', align:'center' }).setOrigin(0.5);
  c.add([g, t]);
  c.setSize(W, H).setInteractive({ useHandCursor:true });
  c.on('pointerover', () => sc.tweens.add({ targets:c, scale:1.05, duration:110 }));
  c.on('pointerout',  () => sc.tweens.add({ targets:c, scale:1.00, duration:110 }));
  c.on('pointerdown', () => sc.tweens.add({ targets:c, scale:0.93, duration:90, yoyo:true, onComplete:geriCagri }));
  return c;
}

/* =====================================================================
   MENU
   ===================================================================== */
class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }
  create(){
    mutfakCiz(this);
    const g = this.add.graphics().setDepth(6);
    /* yarım pizza + yarım saat */
    g.fillStyle(RENK.kabuk, 1); g.slice(EN / 2 - 60, 208, 58, Phaser.Math.DegToRad(90), Phaser.Math.DegToRad(270), false); g.fillPath();
    g.fillStyle(RENK.hamur, 1); g.slice(EN / 2 - 60, 208, 50, Phaser.Math.DegToRad(90), Phaser.Math.DegToRad(270), false); g.fillPath();
    g.fillStyle(RENK.kadran, 1); g.slice(EN / 2 + 60, 208, 56, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(90), false); g.fillPath();
    g.lineStyle(5, 0x8d99ae, 1); g.strokeCircle(EN / 2 + 60, 208, 56);
    g.lineStyle(4, RENK.yanlis, 1); g.lineBetween(EN / 2 + 60, 208, EN / 2 + 60, 164);
    g.lineStyle(4, 0x2a3550, 1); g.lineBetween(EN / 2 + 60, 208, EN / 2 + 92, 208);

    const baslik = this.add.text(EN / 2, 336, OYUN_ADI, { fontFamily:'system-ui, sans-serif',
      fontSize:'35px', fontStyle:'bold', color:'#ffffff', align:'center', lineSpacing:5 }).setOrigin(0.5);
    this.tweens.add({ targets:baslik, scale:1.04, duration:1400, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    this.add.text(EN / 2, 418, TALIMAT, { fontFamily:'system-ui, sans-serif',
      wordWrap:{ width:EN - 60 }, lineSpacing:3,
      fontSize:'22px', color:'#ffe6c0', align:'center' }).setOrigin(0.5);
    const kart = this.add.graphics();
    kart.fillStyle(0x1a1109, 0.92); kart.fillRoundedRect(30, 456, EN - 60, 84, 16);
    kart.lineStyle(2, 0x8a5a2f, 1); kart.strokeRoundedRect(30, 456, EN - 60, 84, 16);
    this.add.text(EN / 2, 498, IPUCU, { fontFamily:'system-ui, sans-serif', fontSize:'17px',
      fontStyle:'bold', color:'#ffd166', align:'center', wordWrap:{ width:EN - 90 }, lineSpacing:4 }).setOrigin(0.5);
    dugmeYap(this, EN / 2, 612, '▶  BAŞLA', RENK.dogru, () => this.scene.start('Game'));
    this.add.text(EN / 2, 706, `${TURLAR.length} görev  ·  ${CAN_SAYISI} can`,
      { fontFamily:'system-ui, sans-serif', fontSize:'20px', color:'#e0c39a' }).setOrigin(0.5);
  }
}

/* =====================================================================
   GAME
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    this.can = CAN_SAYISI; this.puan = 0; this.seri = 0; this.tur = 0; this.kilit = true;
    this.tusNesne = null; this.dilimNesne = null; this.mesaj = null;
    this.anaCizim = null;
    /* "yoksa oluştur" mantığıyla kurulan yazılar; sıfırlanmazsa
       TEKRAR OYNA'da yok edilmiş metne setText çağrılıp çöküyor. */
    this.parcaYazi = null; this.dijitalYazi = null; this.saatSayi = null;

    mutfakCiz(this);

    this.kivilcimlar = this.add.particles(0, 0, 'kivilcim', {
      speed:{ min:120, max:330 }, angle:{ min:0, max:360 }, scale:{ start:0.8, end:0 },
      alpha:{ start:1, end:0 }, lifespan:600, gravityY:300, blendMode:'ADD', emitting:false }).setDepth(90);
    this.tozlar = this.add.particles(0, 0, 'toz', {
      speed:{ min:40, max:150 }, angle:{ min:200, max:340 }, scale:{ start:0.9, end:2 },
      alpha:{ start:0.5, end:0 }, lifespan:660, emitting:false }).setDepth(80);
    this.savrulan = this.physics.add.group();

    this.anaCizim = this.add.graphics().setDepth(8);
    this.arayuzKur();
    this.turuBaslat();
  }

  turuBaslat(){
    const t = TURLAR[this.tur];
    this.kilit = true;
    this.adim = 0;
    if (this.tusNesne)   this.tusNesne.forEach(o => o.destroy());
    if (this.dilimNesne) this.dilimNesne.forEach(o => o.destroy());
    this.tusNesne = []; this.dilimNesne = [];
    this.savrulan.clear(true, true);
    this.anaCizim.clear();

    this.aktifTur = t;     /* o anki tur — arayüz ve testler buradan okur */
    this.gorevYazi.setText(t.gorev);
    this.gorevYazi.setFontSize(t.gorev.length > 120 ? '15px'
                             : (t.gorev.length > 76 ? '16px' : '18px'));
    /* İpucu satırı yönergenin altına iner (uzun yönerge üstüne binmesin) */
    this.ipucuYazi.setY(Math.max(this.gorevYazi.y + this.gorevYazi.height + 6, 196));
    this.tweens.add({ targets:this.gorevYazi, scale:{ from:0.92, to:1 }, duration:280, ease:'Back.easeOut' });

    if (t.tip === 'kesme') this.kesmeKur(t);
    else                   this.saatKur(t);

    this.time.delayedCall(340, () => { this.kilit = false; });
    this.arayuzuTazele();
  }

  /* ================= fractionCut ================= */
  kesmeKur(t){
    this.parca = 1;
    this.pizzaCiz(1);
    this.ipucuYazi.setText(t.adimlar[0].soru);
    t.secenekler.forEach((n, i) => {
      const x = EN / 2 + (i - (t.secenekler.length - 1) / 2) * 108;
      const d = dugmeYap(this, x, TUS_Y, n + '’ye Böl', 0x8a5a2f,
                         () => this.kes(t, n), 98, 54).setDepth(14);
      this.tusNesne.push(d);
    });
  }

  pizzaCiz(n){
    const g = this.anaCizim;
    g.clear();
    /* kesme tahtası */
    g.fillStyle(0x6b4426, 1);
    g.fillRoundedRect(EN / 2 - 156, MERKEZ_Y - 150, 312, 300, 20);
    /* pizza */
    g.fillStyle(RENK.kabuk, 1); g.fillCircle(EN / 2, MERKEZ_Y, YARICAP);
    g.fillStyle(HAMUR_RENK, 1); g.fillCircle(EN / 2, MERKEZ_Y, YARICAP - 10);
    /* malzeme */
    g.fillStyle(0xc94b3c, 1);
    [[-46,-30],[38,-44],[10,18],[-24,44],[54,20],[-56,4]].forEach(([dx, dy]) =>
      g.fillCircle(EN / 2 + dx, MERKEZ_Y + dy, 9));
    /* kesim çizgileri */
    if (n > 1){
      g.lineStyle(4, 0x8a5a2f, 1);
      for (let i = 0; i < n; i++){
        const a = Phaser.Math.DegToRad(-90 + i * 360 / n);
        g.lineBetween(EN / 2, MERKEZ_Y,
          EN / 2 + Math.cos(a) * YARICAP, MERKEZ_Y + Math.sin(a) * YARICAP);
      }
    }
    /* parça sayısı */
    if (!this.parcaYazi){
      this.parcaYazi = this.add.text(EN / 2, MERKEZ_Y + 176, '', { fontFamily:'system-ui, sans-serif',
        fontSize:'24px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0.5).setDepth(14);
    }
    const ad = n === 1 ? '1 bütün' : n === 2 ? '2 yarım' : n === 4 ? '4 çeyrek' : n + ' eş parça';
    this.parcaYazi.setText(ad);
  }

  kes(t, n){
    if (this.kilit) return;
    const a = t.adimlar[this.adim];
    if (n !== a.gerek){
      this.yanlisHamle(a.hata);
      return;
    }
    this.kilit = true;
    this.parca = n;
    this.pizzaCiz(n);

    /* GERÇEK FİZİK: bir dilim ayrılıp savrulur */
    for (let i = 0; i < Math.min(n, 4); i++){
      const ang = Phaser.Math.DegToRad(-90 + (i + 0.5) * 360 / n);
      const px = EN / 2 + Math.cos(ang) * 60, py = MERKEZ_Y + Math.sin(ang) * 60;
      const s = this.physics.add.existing(
        this.add.text(px, py, '🍕', { fontSize:'29px' }).setOrigin(0.5).setDepth(30));
      this.savrulan.add(s);
      s.body.setAllowGravity(true);
      s.body.setVelocity(Math.cos(ang) * 180, Math.sin(ang) * 180 - 180);
      this.tweens.add({ targets:s, angle:Phaser.Math.Between(-200, 200), duration:800 });
      this.dilimNesne.push(s);
    }
    this.kivilcimlar.setParticleTint(RENK.vurgu);
    this.kivilcimlar.explode(20, EN / 2, MERKEZ_Y);
    this.cameras.main.flash(140, 80, 210, 140);
    this.puanEkle(200, EN / 2, MERKEZ_Y - 60);
    this.mesajGoster(a.tamam, '#1f6d4a');

    this.adim++;
    if (this.adim >= t.adimlar.length){
      this.time.delayedCall(1600, () => this.turuBitir(t));
      return;
    }
    this.time.delayedCall(1500, () => {
      this.ipucuYazi.setText(t.adimlar[this.adim].soru);
      this.kilit = false;
    });
  }

  /* ================= clockSet ================= */
  saatKur(t){
    this.saat = 12; this.dakika = 0;
    this.saatiCiz();
    this.hedefYaz(t);

    /* ayar tuşları */
    this.tusNesne.push(dugmeYap(this, EN / 2 - 150, TUS_Y, '◀ AKREP', 0x8a5a2f,
      () => this.saatAyar(t, -1, 0), 132, 52).setDepth(14));
    this.tusNesne.push(dugmeYap(this, EN / 2 + 150, TUS_Y, 'AKREP ▶', 0x8a5a2f,
      () => this.saatAyar(t, 1, 0), 132, 52).setDepth(14));
    this.tusNesne.push(dugmeYap(this, EN / 2 - 150, TUS_Y + 62, '◀ YELK.', 0x4a6b8a,
      () => this.saatAyar(t, 0, -15), 132, 52).setDepth(14));
    this.tusNesne.push(dugmeYap(this, EN / 2 + 150, TUS_Y + 62, 'YELK. ▶', 0x4a6b8a,
      () => this.saatAyar(t, 0, 15), 132, 52).setDepth(14));
    this.tusNesne.push(dugmeYap(this, EN / 2, TUS_Y + 31, '✓ ONAY', RENK.dogru,
      () => this.saatOnay(t), 132, 54).setDepth(14));
  }

  saatiCiz(){
    const g = this.anaCizim;
    g.clear();
    g.fillStyle(RENK.kadran, 1); g.fillCircle(EN / 2, MERKEZ_Y, YARICAP);
    g.lineStyle(8, 0x8d99ae, 1); g.strokeCircle(EN / 2, MERKEZ_Y, YARICAP);
    /* saat sayıları ve çentikler */
    for (let i = 1; i <= 12; i++){
      const a = Phaser.Math.DegToRad(-90 + i * 30);
      const rx = EN / 2 + Math.cos(a) * (YARICAP - 24), ry = MERKEZ_Y + Math.sin(a) * (YARICAP - 24);
      if (!this.saatSayi) this.saatSayi = [];
      if (!this.saatSayi[i]){
        this.saatSayi[i] = this.add.text(0, 0, String(i), { fontFamily:'system-ui, sans-serif',
          fontSize:'20px', fontStyle:'bold', color:'#3a2a1a' }).setOrigin(0.5).setDepth(12);
      }
      this.saatSayi[i].setPosition(rx, ry).setVisible(true);
      g.lineStyle(i % 3 === 0 ? 4 : 2, 0x8d99ae, 1);
      g.lineBetween(EN / 2 + Math.cos(a) * (YARICAP - 10), MERKEZ_Y + Math.sin(a) * (YARICAP - 10),
                    EN / 2 + Math.cos(a) * (YARICAP - 3),  MERKEZ_Y + Math.sin(a) * (YARICAP - 3));
    }
    /* akrep (saat) — dakikaya göre kayar */
    const sa = Phaser.Math.DegToRad(-90 + (this.saat % 12) * 30 + this.dakika * 0.5);
    g.lineStyle(9, 0x2a3550, 1);
    g.lineBetween(EN / 2, MERKEZ_Y, EN / 2 + Math.cos(sa) * 56, MERKEZ_Y + Math.sin(sa) * 56);
    /* yelkovan (dakika) */
    const da = Phaser.Math.DegToRad(-90 + this.dakika * 6);
    g.lineStyle(6, RENK.yanlis, 1);
    g.lineBetween(EN / 2, MERKEZ_Y, EN / 2 + Math.cos(da) * 86, MERKEZ_Y + Math.sin(da) * 86);
    g.fillStyle(RENK.vurgu, 1); g.fillCircle(EN / 2, MERKEZ_Y, 8);

    if (!this.dijitalYazi){
      this.dijitalYazi = this.add.text(EN / 2, MERKEZ_Y + 168, '', { fontFamily:'system-ui, sans-serif',
        fontSize:'26px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0.5).setDepth(14);
    }
    const ss = String(this.saat).padStart(2, '0'), dd = String(this.dakika).padStart(2, '0');
    this.dijitalYazi.setText(ss + ':' + dd);
  }

  hedefYaz(t){
    const a = t.adimlar[this.adim];
    this.ipucuYazi.setText('Hedef:  ' + a.etiket);
    if (KOPRU && a.seslen) KOPRU.oku(a.seslen);
  }

  saatAyar(t, ds, dd){
    if (this.kilit) return;
    if (ds){ this.saat = ((this.saat - 1 + ds + 12) % 12) + 1; }
    if (dd){ this.dakika = (this.dakika + dd + 60) % 60; }
    this.saatiCiz();
  }

  saatOnay(t){
    if (this.kilit) return;
    const a = t.adimlar[this.adim];
    if (this.saat !== a.saat || this.dakika !== a.dakika){
      this.yanlisHamle(t.hata);
      /* ibre yaylanarak sallanır */
      const eski = this.dakika;
      this.tweens.add({ targets:this, dakika:eski + 6, duration:120, yoyo:true,
        onUpdate:() => this.saatiCiz(),
        onComplete:() => { this.dakika = eski; this.saatiCiz(); } });
      return;
    }
    this.kilit = true;
    /* GERÇEK FİZİK: çarklar fırlar */
    for (let i = 0; i < 8; i++){
      const c = this.physics.add.existing(
        this.add.image(EN / 2, MERKEZ_Y, 'cark').setTint(RENK.vurgu).setScale(1.3).setDepth(30));
      this.savrulan.add(c);
      c.body.setAllowGravity(true);
      c.body.setVelocity(Phaser.Math.Between(-240, 240), Phaser.Math.Between(-440, -240));
      this.tweens.add({ targets:c, angle:720, duration:1200 });
    }
    this.kivilcimlar.setParticleTint(RENK.dogru);
    this.kivilcimlar.explode(24, EN / 2, MERKEZ_Y);
    this.cameras.main.flash(150, 80, 210, 140);
    this.puanEkle(200, EN / 2, MERKEZ_Y - 60);
    this.mesajGoster(a.etiket + ' ✓', '#1f6d4a');

    this.adim++;
    if (this.adim >= t.adimlar.length){
      this.time.delayedCall(1600, () => this.turuBitir(t));
      return;
    }
    this.time.delayedCall(1500, () => { this.hedefYaz(t); this.kilit = false; });
  }

  /* ---------- ortak ---------- */
  puanEkle(kazanc, x, y){
    this.seri++;
    const p = kazanc + (this.seri - 1) * 30;
    this.puan += p;
    this.puanYazi.setText('Puan ' + this.puan);
    this.tweens.add({ targets:this.puanYazi, scale:1.4, duration:120, yoyo:true, ease:'Back.easeOut' });
    const u = this.add.text(x, y, '+' + p, { fontFamily:'system-ui, sans-serif',
      fontSize:'24px', fontStyle:'bold', color:'#7ce0a3' }).setOrigin(0.5).setDepth(95);
    this.tweens.add({ targets:u, y:u.y - 44, alpha:0, duration:640, onComplete:() => u.destroy() });
  }

  yanlisHamle(mesaj){
    this.seri = 0; this.can--; this.arayuzuTazele();
    this.tozlar.explode(12, EN / 2, MERKEZ_Y);
    this.cameras.main.shake(210, 0.011);
    this.cameras.main.flash(160, 220, 90, 90);
    this.tweens.add({ targets:this.canYazi, angle:{ from:-12, to:12 }, duration:70,
      yoyo:true, repeat:3, onComplete:() => this.canYazi.setAngle(0) });
    this.mesajGoster(mesaj, '#b5453b');
    if (this.can <= 0){ this.kilit = true; this.time.delayedCall(900, () => this.bitir(false)); }
  }

  turuBitir(t){
    this.kilit = true;
    this.puan += 200;
    this.puanYazi.setText('Puan ' + this.puan);
    this.mesajGoster(t.tamam, '#1f6d4a');
    this.tur++;
    this.arayuzuTazele();
    this.time.delayedCall(2300, () => {
      if (this.tur >= TURLAR.length){ this.bitir(true); return; }
      if (this.parcaYazi){ this.parcaYazi.destroy(); this.parcaYazi = null; }
      if (this.dijitalYazi){ this.dijitalYazi.destroy(); this.dijitalYazi = null; }
      if (this.saatSayi){ this.saatSayi.forEach(o => o && o.destroy()); this.saatSayi = null; }
      this.turuBaslat();
    });
  }

  mesajGoster(metin, arka){
    if (this.mesaj) this.mesaj.destroy();
    this.mesaj = this.add.text(EN / 2, 236, metin, { fontFamily:'system-ui, sans-serif',
      fontSize:'17px', fontStyle:'bold', color:'#ffffff', backgroundColor:arka,
      padding:{ x:12, y:7 }, align:'center', wordWrap:{ width:EN - 60 }
    }).setOrigin(0.5).setDepth(96).setAlpha(0);
    const t = this.mesaj;
    this.tweens.add({ targets:t, alpha:1, duration:150 });
    this.time.delayedCall(1700, () => {
      if (!t.active) return;
      this.tweens.add({ targets:t, alpha:0, duration:250,
        onComplete:() => { if (this.mesaj === t) this.mesaj = null; t.destroy(); } });
    });
  }

  arayuzKur(){
    const serit = this.add.graphics().setDepth(60);
    serit.fillStyle(0x180f08, 0.97); serit.fillRoundedRect(10, 10, EN - 20, 104, 18);
    this.add.text(EN / 2, 38, OYUN_EMO + '  ' + BASLIK_KISA, { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#ffffff' }).setOrigin(0.5).setDepth(61);
    this.puanYazi = this.add.text(30, 80, 'Puan 0', { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0, 0.5).setDepth(61);
    this.canYazi = this.add.text(EN - 30, 80, '', { fontSize:'20px' }).setOrigin(1, 0.5).setDepth(61);
    this.ilerlemeYazi = this.add.text(EN / 2, 80, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'19px', fontStyle:'bold', color:'#e0c39a' }).setOrigin(0.5).setDepth(61);
    /* Yukarıdan büyüyor: uzun yönerge kadranın/pizzanın üstüne binmesin. */
    this.gorevYazi = this.add.text(EN / 2, 122, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'18px', fontStyle:'bold', color:'#ffffff', align:'center',
      wordWrap:{ width:EN - 44 }, lineSpacing:2 }).setOrigin(0.5, 0).setDepth(61);
    this.ipucuYazi = this.add.text(EN / 2, 208, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'18px', fontStyle:'bold', color:'#ffd166', align:'center',
      wordWrap:{ width:EN - 44 }, lineSpacing:2 }).setOrigin(0.5, 0).setDepth(61);
    this.arayuzuTazele();
  }

  arayuzuTazele(){
    this.canYazi.setText('❤️'.repeat(Math.max(0, this.can)) + '🖤'.repeat(Math.max(0, CAN_SAYISI - this.can)));
    const t = TURLAR[Math.min(this.tur, TURLAR.length - 1)];
    const ek = (this.tur < TURLAR.length && t.adimlar)
      ? '  ·  adım ' + Math.min(this.adim + 1, t.adimlar.length) + '/' + t.adimlar.length : '';
    this.ilerlemeYazi.setText(`${this.tur} / ${TURLAR.length} görev` + ek);
  }

  bitir(kazandi){
    this.scene.start('GameOver', { kazandi, puan:this.puan, can:this.can,
      tur:this.tur, toplam:TURLAR.length });
  }

  update(){
    if (!this.savrulan || !this.savrulan.children) return;
    this.savrulan.getChildren().forEach(o => {
      if (o.active && (o.y > BOY + 70 || o.x < -70 || o.x > EN + 70)) o.destroy();
    });
  }
}

/* =====================================================================
   GAME OVER
   ===================================================================== */
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }
  init(veri){ this.veri = veri; }
  create(){
    const { kazandi, puan, can, tur, toplam } = this.veri;

    /* Uygulama içindeyken kazanma ekranı uygulamanın kutlamasıdır:
       XP/altın, kutlama ve sıradaki oyuna geçiş orada. */
    if (kazandi && KOPRU){ KOPRU.bitir(BASARI, puan); return; }
    mutfakCiz(this);
    const emo = this.add.text(EN / 2, 190, kazandi ? '🕰️' : '💪', { fontSize:'97px' })
      .setOrigin(0.5).setScale(0);
    this.tweens.add({ targets:emo, scale:1, duration:520, ease:'Back.easeOut' });
    this.add.text(EN / 2, 300, kazandi ? 'ATÖLYE TAMAM!' : 'TEKRAR DENE',
      { fontFamily:'system-ui, sans-serif', fontSize:'35px', fontStyle:'bold',
        color: kazandi ? '#7ce0a3' : '#ffd166', align:'center' }).setOrigin(0.5);
    this.add.text(EN / 2, 360, kazandi ? BASARI : `${tur} / ${toplam} görevi tamamladın — bir daha deneyelim mi?`,
      { fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#ffe6c0', align:'center',
        wordWrap:{ width:EN - 70 }, lineSpacing:5 }).setOrigin(0.5);
    const py = this.add.text(EN / 2, 456, 'Puan 0', { fontFamily:'system-ui, sans-serif',
      fontSize:'42px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0.5);
    const s = { v:0 };
    this.tweens.add({ targets:s, v:puan, duration:900, ease:'Cubic.easeOut',
      onUpdate:() => py.setText('Puan ' + Math.round(s.v)) });
    this.add.text(EN / 2, 506, 'Kalan can: ' + (can > 0 ? '❤️'.repeat(can) : '—'),
      { fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#e0c39a' }).setOrigin(0.5);
    if (kazandi){
      const k = this.add.particles(EN / 2, -20, 'kivilcim', {
        speed:{ min:90, max:260 }, angle:{ min:60, max:120 }, scale:{ start:0.8, end:0 },
        alpha:{ start:1, end:0 }, lifespan:2000, gravityY:180, quantity:2, frequency:70,
        tint:[0xffd166, 0x7ce0a3, 0xf2c26b, 0xc94b3c] }).setDepth(5);
      this.time.delayedCall(2600, () => k.stop());
    }
    dugmeYap(this, EN / 2, 606, '↻  TEKRAR OYNA', RENK.dogru, () => this.scene.start('Game'));
    /* Çocuk bir oyunda takılıp kalmasın: uygulama içinde sıradakine geç. */
    if (KOPRU)  dugmeYap(this, EN / 2, 684, '⏭  SIRADAKİ OYUN', 0x4a679e, () => KOPRU.atla());
    if (!KOPRU) dugmeYap(this, EN / 2, 684, '☰  MENÜ', 0x8a5a2f, () => this.scene.start('Menu'));
  }
}

/* =====================================================================
   NETLİK — cihazın piksel yoğunluğunda çizim
   ---------------------------------------------------------------------
   Oyun 480x800 mantıksal tuvalde çiziliyordu; telefon bunu 1080 piksele
   büyütünce yazılar ve kenarlar bulanıklaşıyordu. Çözüm: tuvali cihazın
   gerçek piksel sayısında açmak, dünyayı ise kamerayı NETLIK katına
   yakınlaştırarak yine 480x800 koordinatta tutmak. Böylece Graphics ile
   çizilen her şey (kartlar, şeritler, kutular) vektör keskinliğinde,
   yazılar da NETLIK çözünürlüğünde üretiliyor; oyun kodunun tek satırı
   değişmiyor.
   ===================================================================== */
const NETLIK = Math.min(3, Math.max(1, Math.round((window.devicePixelRatio || 1) * 2) / 2));

/* Phaser yazıyı kendi ara tuvaline çiziyor; çözünürlük verilmezse 1x
   üretilip yakınlaştırmada bulanıklaşır. Bütün yazılara varsayılan
   olarak NETLIK veriyoruz. */
(function(){
  const TS = Phaser.GameObjects.TextStyle.prototype;
  const eskiSetStyle = TS.setStyle;
  TS.setStyle = function(style, updateText, setDefaults){
    if (style && style.resolution === undefined) style.resolution = NETLIK;
    return eskiSetStyle.call(this, style, updateText, setDefaults);
  };
})();

/* Tuval NETLIK katına büyüdüğü için Phaser imleç konumunu da o ölçekte
   veriyor (0–960). Oyun koordinatına (0–480) çeviren yardımcı: sürükleme
   olayları zaten dünya koordinatı verdiği için yalnız pointer olaylarında
   kullanılıyor. */
function imlec(p){ return { x: p.x / NETLIK, y: p.y / NETLIK }; }

/* Her sahne başlarken kamerayı NETLIK katına yakınlaştırıp fizik
   dünyasını mantıksal ölçüde tutuyoruz: tuval büyüdü, dünya büyümedi.
   Sahne örnekleri oyun kurulumundan sonra eşzamansız oluştuğu için
   kanca Systems.start üzerine takılıyor — yeniden başlatmalarda da
   kendiliğinden çalışıyor. */
(function(){
  const SS = Phaser.Scenes.Systems.prototype;
  const eskiStart = SS.start;
  SS.start = function(veri){
    const sonuc = eskiStart.call(this, veri);
    const sc = this.scene;
    try{
      if (sc.cameras && sc.cameras.main){
        sc.cameras.main.setZoom(NETLIK);
        sc.cameras.main.centerOn(EN / 2, BOY / 2);
      }
      if (sc.physics && sc.physics.world) sc.physics.world.setBounds(0, 0, EN, BOY);
    }catch(e){ /* netlik ayarı oyunu engellemesin */ }
    return sonuc;
  };
})();

window.OYUN = new Phaser.Game({
  type: Phaser.AUTO, parent: 'oyun', width: EN * NETLIK, height: BOY * NETLIK,
  backgroundColor: '#20160e',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 740 } } },
  scene: [BootScene, MenuScene, GameScene, GameOverScene]
});
