<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paketleme ve Paylaştırma — Phaser 3</title>
<script src="phaser.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#161a26; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  #oyun { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="oyun"></div>
<script>
/* =====================================================================
   PAKETLEME VE PAYLAŞTIRMA — Phaser 3
   (mekanik: groupMultiply + shareDivide · 3 + 2 = 5 oyun)
   ---------------------------------------------------------------------
   Kazanım: MAT.2.2.4 — Çarpma işlemini tekrarlı toplamayla, bölme
   işlemini ardışık çıkarma ve eşit paylaştırmayla ilişkilendirir.

   NOT — iki mekanik tek şablon:
   groupMultiply "her kutuya n tane, kaç kutu → çarpma",
   shareDivide "toplamı gruplara eşit paylaştır → bölme" mantığıydı.
   İkisi de eşit gruplar fikrinin iki yüzü; şablon tur tipine göre
   (carpma / bolme) sayaç ve doğrulamayı buna göre kuruyor.

   Fizik    : Arcade. Her öge kutuya/tabağa YERÇEKİMİYLE düşer ve
              yerine kilitlenir; grup tamamlanınca kutu zıplar.
              Fazla verilen öge geri savrulur.
   ===================================================================== */

const EN = 480, BOY = 800;

const RENK = {
  zeminUst : 0x1c2130,
  zeminAlt : 0x323b52,
  dogru    : 0x34c47b,
  yanlis   : 0xf07575,
  kutu     : 0x8a5a2f,
  kutuIc   : 0x2a3040,
  vurgu    : 0xffd166
};

/* ---------------- uygulama köprüsü ----------------
   Uygulamanın içine iframe olarak gömüldüğünde adres  paketleme.html#oyun=v18
   biçiminde olur. Sayfa uygulamayla AYNI kaynaktan sunulduğu için üst
   pencereden katalog verisi doğrudan okunabiliyor. Böylece 3 groupMultiply +
   2 shareDivide oyununun hepsi bu tek şablonla oynanıyor. Kazanınca
   completeGame() çağrılır; XP, altın, kutlama ve sıradaki oyuna geçiş
   uygulamada kalır.
   Köprü yoksa (dosya tek başına açıldıysa) örnek içerik oynanır.        */
const KOPRU = (function(){
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const id = p.get('oyun');
    if (id && window.parent && window.parent !== window &&
        typeof window.parent.getGame === 'function'){
      const g = window.parent.getGame(id);
      if (g && g.cfg) return {
        oyun: g, cfg: g.cfg,
        bitir(mesaj, puan){ try{ window.parent.completeGame(mesaj || '', puan); }catch(e){} },
        /* Turun kendi metnini uygulamanın sesiyle okutur (Piper). */
        oku(metin){ try{ if (window.parent.oku) window.parent.oku(metin); }catch(e){} },
        /* Kaybetme ekranından: bu oyunu bırak, sıradakine geç. */
        atla(){ try{ if (window.parent.sonrakiOyunaGec) window.parent.sonrakiOyunaGec(); }catch(e){} }
      };
    }
  }catch(e){ /* çapraz kaynak engeli: tek başına oynanır */ }
  return null;
})();

/* HTML varlıklarını çöz: katalogda "Pay &lt; payda" gibi yazımlar var,
   çözülmezse ekranda "&lt;" olarak görünüyor ve öyle okunuyor. */
function varlikCoz(m){
  return String(m)
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
    .replace(/&hellip;/gi, '…').replace(/&mdash;/gi, '—').replace(/&ndash;/gi, '–')
    .replace(/&times;/gi, '×').replace(/&divide;/gi, '÷').replace(/&deg;/gi, '°')
    .replace(/&rarr;/gi, '→').replace(/&larr;/gi, '←')
    .replace(/&amp;/gi, '&');            /* en sona: çift çözmeyi önler */
}

function duzMetin(x){
  return varlikCoz(String(x == null ? '' : x).replace(/<br\s*\/?>/gi,' ')
    .replace(/<[^>]+>/g,'')).replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}

const VARSAYILAN = {   /* şablon tek başına açıldığında: uygulamadaki v18 */
  instruction:'Her kutuya <b>3 robot</b> koyduk, <b>4 kutu</b> var. Kutulara sırayla dokunarak üçer üçer say!',
  groups:4, perGroup:3, emoji:'🤖',
  successMsg:'4 × 3 = 12. Çarpma, tekrarlı toplamanın kısa yoludur! 🤖'
};

const CFG = KOPRU ? KOPRU.cfg : VARSAYILAN;

/* ---------------------------------------------------------------------
   İÇERİK — katalogdaki iki "eşit gruplar" mekaniği
   ---------------------------------------------------------------------
   groupMultiply : cfg.groups × cfg.perGroup → kutuları SIRAYLA doldur,
                   ritmik say. cfg.showCheck varsa sonda bölmeyle sağlama.
   shareDivide   : cfg.total ögeyi cfg.groups gruba EŞİT paylaştır; her
                   turda sırası gelen gruba bir tane. cfg.giveLabel varsa
                   "herkese birer ver" düğmesi de çıkar.
   ------------------------------------------------------------------- */
const BOLME_MI = (CFG.total !== undefined);

const OYUN_ADI = KOPRU ? duzMetin(KOPRU.oyun.title) : 'PAKETLEME VE\nPAYLAŞTIRMA';
const OYUN_EMO = KOPRU ? (KOPRU.oyun.emo || '📦') : '🤖';
const TALIMAT  = duzMetin(CFG.instruction) || 'Eşit gruplar kur';
const IPUCU    = duzMetin(CFG.tip) ||
  'Çarpma tekrarlı toplamanın kısa yolu; bölme ise eşit paylaştırmaktır.';
const BASARI   = duzMetin(CFG.successMsg) ||
  'Eşit grup ustası! Çarpma ve bölmenin aynı fikrin iki yüzü olduğunu gördün 📦';
const BASLIK_KISA = BOLME_MI ? 'EŞİT PAYLAŞTIRMA' : 'PAKETLEME BANDI';

const TURLAR = (function(){
  const grup = Math.max(1, Number(CFG.groups) || 1);
  if (BOLME_MI){
    const toplam = Math.max(1, Number(CFG.total) || 1);
    return [{
      tip:'bolme',
      gorev: TALIMAT,
      seslen: duzMetin(CFG.speak) || TALIMAT,
      toplam: toplam, grup: grup,
      emoji: CFG.emoji || '🍎',
      kutuEmoji: CFG.groupEmoji || '🧒',
      grupAdi: duzMetin(CFG.groupName) || 'gruba',
      ogeAdi:  duzMetin(CFG.itemName)  || 'öge',
      dagitEtiketi: duzMetin(CFG.giveLabel) || ('👐  Herkese 1 ' + (duzMetin(CFG.itemName) || 'öge') + ' ver'),
      saglama: false, saglamaEtiketi: '',
      hataMsj: duzMetin(CFG.wrongMsg) || 'Eşit paylaştır: sırası gelen gruba ver.',
      tamam: BASARI
    }];
  }
  const birim = Math.max(1, Number(CFG.perGroup) || 1);
  return [{
    tip:'carpma',
    gorev: TALIMAT,
    seslen: duzMetin(CFG.speak) || TALIMAT,
    grup: grup, birim: birim,
    emoji: CFG.emoji || '📦',
    kutuEmoji: CFG.groupEmoji || '📦',
    grupAdi:'kutuya', ogeAdi:'öge', dagitEtiketi:'',
    /* showCheck: sonda "çarpmanın tersi bölmedir" sağlaması */
    saglama: !!CFG.showCheck,
    saglamaEtiketi: duzMetin(CFG.checkLabel) || '🔍  Bölmeyle sağlamasını yap',
    hataMsj: duzMetin(CFG.wrongMsg) || 'Bu kutu doldu! Sıradaki kutuya geç.',
    tamam: BASARI
  }];
})();

const CAN_SAYISI = 3;

/* --- Yerleşim -------------------------------------------------------- */
/* Katalogda grup sayısı 2 ile 8, grup başına öge 3 ile 7 arasında
   değişiyor. Tek sıra + sabit 96 piksel kutu 8 kutuyu ekrandan taşırıyordu;
   kutular ızgaraya diziliyor ve ölçüleri veriye göre hesaplanıyor. */
const KUTU_UST = 300;
const IZG_SUTUN = Math.min(4, TURLAR[0] ? TURLAR[0].grup : 4);
const IZG_SATIR = Math.ceil((TURLAR[0] ? TURLAR[0].grup : 4) / IZG_SUTUN);
const SATIR_BOY = Math.floor(342 / IZG_SATIR);
const KUTU_EN  = Math.min(96, Math.floor((EN - 36) / IZG_SUTUN) - 14);
const KUTU_BOY = Math.min(130, SATIR_BOY - 56);
/* Kutu içindeki öge ızgarası: 2 sütun (çok ögede 3) */
const OGE_SUTUN = ((TURLAR[0] && (TURLAR[0].birim || Math.ceil(TURLAR[0].toplam / TURLAR[0].grup))) > 8) ? 3 : 2;
const OGE = Math.min(26, Math.floor(KUTU_EN / (OGE_SUTUN + 0.5)));

/* =====================================================================
   BOOT
   ===================================================================== */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }
  create(){
    let g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1); g.fillCircle(8, 8, 8);
    g.generateTexture('kivilcim', 16, 16); g.destroy();
    g = this.make.graphics({ add:false });
    for (let r = 14; r > 0; r--){ g.fillStyle(0xffffff, 0.06); g.fillCircle(14, 14, r); }
    g.generateTexture('toz', 28, 28); g.destroy();
    /* Uygulama içinde çocuk oyunu listeden zaten seçti; menüyü atla. */
    this.scene.start(KOPRU ? 'Game' : 'Menu');
  }
}

/* =====================================================================
   Ortak
   ===================================================================== */
function fabrikaCiz(sc){
  const g = sc.add.graphics();
  g.fillGradientStyle(RENK.zeminUst, RENK.zeminUst, RENK.zeminAlt, RENK.zeminAlt, 1);
  g.fillRect(0, 0, EN, BOY);
  for (let i = 0; i < 22; i++){
    const s = sc.add.circle(Phaser.Math.Between(6, EN - 6), Phaser.Math.Between(6, BOY - 6),
      Phaser.Math.FloatBetween(1.4, 3.2), 0xffffff, Phaser.Math.FloatBetween(0.04, 0.14));
    sc.tweens.add({ targets:s, alpha:0.02, duration:Phaser.Math.Between(1300, 2900),
      yoyo:true, repeat:-1, delay:Phaser.Math.Between(0, 1900) });
  }
  return g;
}

function dugmeYap(sc, x, y, metin, renk, geriCagri, genislik, yukseklik){
  const W = genislik || 280, H = yukseklik || 60;
  const c = sc.add.container(x, y);
  const g = sc.add.graphics();
  g.fillStyle(renk, 1);
  g.fillRoundedRect(-W / 2, -H / 2, W, H, Math.min(H / 2, 26));
  g.fillStyle(0xffffff, 0.16);
  g.fillRoundedRect(-W / 2, -H / 2, W, H * 0.4, { tl:Math.min(H / 2, 26), tr:Math.min(H / 2, 26), bl:0, br:0 });
  const t = sc.add.text(0, 0, metin, { fontFamily:'system-ui, sans-serif',
    fontSize: H > 52 ? '20px' : '16px', fontStyle:'bold', color:'#ffffff', align:'center' }).setOrigin(0.5);
  c.add([g, t]);
  c.setSize(W, H).setInteractive({ useHandCursor:true });
  c.on('pointerover', () => sc.tweens.add({ targets:c, scale:1.05, duration:110 }));
  c.on('pointerout',  () => sc.tweens.add({ targets:c, scale:1.00, duration:110 }));
  c.on('pointerdown', () => sc.tweens.add({ targets:c, scale:0.93, duration:90, yoyo:true, onComplete:geriCagri }));
  return c;
}

/* =====================================================================
   MENU
   ===================================================================== */
class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }
  create(){
    fabrikaCiz(this);
    for (let k = 0; k < 3; k++){
      const x = EN / 2 - 110 + k * 110;
      this.add.text(x, 200, '📦', { fontSize:'48px' }).setOrigin(0.5);
      for (let i = 0; i < 3; i++){
        const r = this.add.text(x - 20 + i * 20, 168, '🤖', { fontSize:'20px' }).setOrigin(0.5);
        this.tweens.add({ targets:r, y:160, duration:700, delay:(k * 3 + i) * 90,
          yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
      }
    }
    const baslik = this.add.text(EN / 2, 328, OYUN_ADI, { fontFamily:'system-ui, sans-serif',
      fontSize:'36px', fontStyle:'bold', color:'#ffffff', align:'center', lineSpacing:5 }).setOrigin(0.5);
    this.tweens.add({ targets:baslik, scale:1.04, duration:1400, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    this.add.text(EN / 2, 412, TALIMAT, { fontFamily:'system-ui, sans-serif',
      wordWrap:{ width:EN - 60 }, lineSpacing:3,
      fontSize:'22px', color:'#d5dcf0', align:'center' }).setOrigin(0.5);
    const kart = this.add.graphics();
    kart.fillStyle(0x121722, 0.92); kart.fillRoundedRect(30, 450, EN - 60, 84, 16);
    kart.lineStyle(2, 0x4a5a86, 1); kart.strokeRoundedRect(30, 450, EN - 60, 84, 16);
    this.add.text(EN / 2, 492, IPUCU, { fontFamily:'system-ui, sans-serif', fontSize:'17px',
      fontStyle:'bold', color:'#ffd166', align:'center', wordWrap:{ width:EN - 90 }, lineSpacing:4 }).setOrigin(0.5);
    dugmeYap(this, EN / 2, 610, '▶  BAŞLA', RENK.dogru, () => this.scene.start('Game'));
    this.add.text(EN / 2, 706, `${TURLAR.length} görev  ·  ${CAN_SAYISI} can`,
      { fontFamily:'system-ui, sans-serif', fontSize:'20px', color:'#9fb0d6' }).setOrigin(0.5);
  }
}

/* =====================================================================
   GAME
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    this.can = CAN_SAYISI; this.puan = 0; this.seri = 0; this.tur = 0; this.kilit = true;
    this.kutuNesne = null; this.ogeNesne = null; this.mesaj = null;
    this.kutuCizim = null; this.sayacYazi = null;

    fabrikaCiz(this);

    this.kivilcimlar = this.add.particles(0, 0, 'kivilcim', {
      speed:{ min:120, max:330 }, angle:{ min:0, max:360 }, scale:{ start:0.8, end:0 },
      alpha:{ start:1, end:0 }, lifespan:600, gravityY:300, blendMode:'ADD', emitting:false }).setDepth(90);
    this.tozlar = this.add.particles(0, 0, 'toz', {
      speed:{ min:40, max:150 }, angle:{ min:200, max:340 }, scale:{ start:0.9, end:2 },
      alpha:{ start:0.5, end:0 }, lifespan:660, emitting:false }).setDepth(80);
    this.ogeler = this.physics.add.group();

    this.kutuCizim = this.add.graphics().setDepth(6);
    this.arayuzKur();
    this.turuBaslat();
  }

  /* Kutular ızgaraya diziliyor: 8 kutu tek sıraya sığmıyordu. */
  kutuX(i){
    const sut = i % IZG_SUTUN;
    const buSatir = Math.min(IZG_SUTUN, (TURLAR[this.tur].grup - (Math.floor(i / IZG_SUTUN)) * IZG_SUTUN));
    return EN / 2 + (sut - (buSatir - 1) / 2) * (KUTU_EN + 14);
  }
  kutuY(i){ return KUTU_UST + Math.floor(i / IZG_SUTUN) * SATIR_BOY; }

  turuBaslat(){
    const t = TURLAR[this.tur];
    this.kilit = true;
    if (this.kutuNesne) this.kutuNesne.forEach(o => o.destroy());
    if (this.ogeNesne)  this.ogeNesne.forEach(o => o.destroy());
    this.kutuNesne = []; this.ogeNesne = [];
    this.ogeler.clear(true, true);
    this.kutuCizim.clear();
    if (this.sayacYazi){ this.sayacYazi.destroy(); this.sayacYazi = null; }

    this.aktifTur = t;     /* o anki tur — arayüz ve testler buradan okur */
    this.saglamaBitti = false;
    this.dolu = new Array(t.grup).fill(0);
    this.verilen = 0;
    this.hedefBirim = (t.tip === 'carpma') ? t.birim : t.toplam / t.grup;
    this.toplamHedef = (t.tip === 'carpma') ? t.grup * t.birim : t.toplam;

    this.gorevYazi.setText(t.gorev);
    this.gorevYazi.setFontSize(t.gorev.length > 120 ? '15px'
                             : (t.gorev.length > 76 ? '16px' : '18px'));
    this.tweens.add({ targets:this.gorevYazi, scale:{ from:0.88, to:1 }, duration:280, ease:'Back.easeOut' });

    this.kutulariCiz(t);

    /* dokunma alanları */
    for (let i = 0; i < t.grup; i++){
      const a = this.add.rectangle(this.kutuX(i), this.kutuY(i) + KUTU_BOY / 2,
                                   KUTU_EN, KUTU_BOY + 30, 0, 0)
        .setInteractive({ useHandCursor:true }).setDepth(10);
      a.on('pointerdown', () => this.kutuyaKoy(t, i));
      this.kutuNesne.push(a);
    }

    /* Paylaştırma oyunlarında katalog "herkese birer ver" diyor; düğme
       sırayı kendisi döndürüyor, kutulara tek tek dokunmak da çalışıyor. */
    if (t.tip === 'bolme'){
      this.kutuNesne.push(dugmeYap(this, EN / 2, KUTU_UST + IZG_SATIR * SATIR_BOY + 60,
        t.dagitEtiketi, RENK.dogru, () => this.herkeseVer(t), EN - 90, 52).setDepth(16));
    }

    this.sayacYazi = this.add.text(EN / 2, KUTU_UST + IZG_SATIR * SATIR_BOY + 14, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'24px', fontStyle:'bold',
      color:'#ffd166', align:'center' }).setOrigin(0.5).setDepth(14);
    this.sayacTazele(t);

    this.time.delayedCall(340, () => { this.kilit = false; });
    this.arayuzuTazele();
  }

  kutulariCiz(t){
    const g = this.kutuCizim;
    g.clear();
    for (let i = 0; i < t.grup; i++){
      const x = this.kutuX(i), uy = this.kutuY(i);
      const tam = this.dolu[i] >= this.hedefBirim;
      g.fillStyle(RENK.kutuIc, 0.95);
      g.fillRoundedRect(x - KUTU_EN / 2, uy, KUTU_EN, KUTU_BOY, 10);
      g.lineStyle(3, tam ? RENK.dogru : RENK.kutu, 1);
      g.strokeRoundedRect(x - KUTU_EN / 2, uy, KUTU_EN, KUTU_BOY, 10);
      /* kutu/tabak etiketi */
      if (!this.kutuEtiket) this.kutuEtiket = [];
      if (!this.kutuEtiket[i]){
        this.kutuEtiket[i] = this.add.text(0, 0, '', { fontSize:'29px' }).setOrigin(0.5).setDepth(8);
        this.kutuSayi[i] = this.add.text(0, 0, '', { fontFamily:'system-ui, sans-serif',
          fontSize:'20px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0.5).setDepth(8);
      }
      this.kutuEtiket[i].setText(t.kutuEmoji).setPosition(x, uy - 22)
        .setFontSize(IZG_SATIR > 1 ? 24 : 29);
      this.kutuSayi[i].setText(this.dolu[i] + ' / ' + this.hedefBirim)
        .setPosition(x, uy + KUTU_BOY + 16)
        .setFontSize(IZG_SATIR > 1 ? 16 : 20)
        .setColor(tam ? '#7ce0a3' : '#ffd166');
    }
  }

  ogeNoktasi(i, n){
    /* kutu içinde OGE_SUTUN sütun × k satır, aşağıdan yukarı dolar */
    const x = this.kutuX(i), uy = this.kutuY(i);
    const sut = n % OGE_SUTUN, sat = Math.floor(n / OGE_SUTUN);
    const ara = OGE + 4;
    return { x: x + (sut - (OGE_SUTUN - 1) / 2) * ara,
             y: uy + KUTU_BOY - OGE / 2 - 6 - sat * ara };
  }

  kutuyaKoy(t, i){
    if (this.kilit) return;
    if (this.dolu[i] >= this.hedefBirim){ this.yanlisHamle(t.hataMsj, i); return; }

    /* bölmede sıra önemli: en az dolu olan gruba verilmeli */
    if (t.tip === 'bolme'){
      const enAz = Math.min.apply(null, this.dolu);
      if (this.dolu[i] > enAz){ this.yanlisHamle(t.hataMsj, i); return; }
    }
    /* çarpmada sıralı doldurma: önceki kutu bitmeden sonrakine geçilmez */
    if (t.tip === 'carpma' && i > 0 && this.dolu[i - 1] < this.hedefBirim){
      this.yanlisHamle('Önce soldaki kutuyu tamamla.', i);
      return;
    }

    const n = this.dolu[i];
    const p = this.ogeNoktasi(i, n);
    /* GERÇEK FİZİK: öge kutuya düşer */
    const o = this.physics.add.existing(
      this.add.text(p.x, this.kutuY(i) - 70, t.emoji,
        { fontSize:Math.max(15, OGE - 2) + 'px' }).setOrigin(0.5).setDepth(20));
    this.ogeler.add(o);
    o.body.setAllowGravity(true);
    o.body.setVelocity(0, 50);
    o.setData('hedef', p);
    this.ogeNesne.push(o);

    this.dolu[i]++;
    this.verilen++;
    this.kutulariCiz(t);
    this.sayacTazele(t);
    this.kivilcimlar.setParticleTint(RENK.vurgu);
    this.kivilcimlar.explode(5, p.x, p.y);
    this.puanEkle(30, p.x, p.y - 24);

    if (this.dolu[i] === this.hedefBirim){
      this.tweens.add({ targets:this.kutuEtiket[i], scale:1.35, duration:150, yoyo:true, ease:'Back.easeOut' });
      this.tweens.add({ targets:this.kutuSayi[i], scale:1.3, duration:150, yoyo:true });
    }

    if (this.verilen >= this.toplamHedef){
      this.kilit = true;
      this.time.delayedCall(700, () => this.turuBitir(t));
    }
  }

  /* Sırası gelen gruba (en az dolu olana) bir öge ver — katalogdaki
     "her seferinde herkese birer ver" yönergesinin karşılığı. */
  herkeseVer(t){
    if (this.kilit) return;
    const enAz = Math.min.apply(null, this.dolu);
    const i = this.dolu.indexOf(enAz);
    if (i >= 0) this.kutuyaKoy(t, i);
  }

  /* showCheck: "çarpmanın tersi bölmedir" sağlaması. Katalogda yalnız
     bazı groupMultiply oyunlarında var (w20, p21). */
  saglamaGoster(t, devam){
    const carpim = t.grup * t.birim;
    const kap = this.add.container(0, 0).setDepth(120);
    kap.add(this.add.rectangle(EN / 2, BOY / 2, EN, BOY, 0x0f1420, 0.92));
    kap.add(this.add.text(EN / 2, 286, t.grup + ' × ' + t.birim + ' = ' + carpim, {
      fontFamily:'system-ui, sans-serif', fontSize:'34px', fontStyle:'bold',
      color:'#ffd166' }).setOrigin(0.5));
    const cevap = this.add.text(EN / 2, 372, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'28px', fontStyle:'bold',
      color:'#7ce0a3', align:'center', wordWrap:{ width:EN - 60 }, lineSpacing:6
    }).setOrigin(0.5);
    kap.add(cevap);
    kap.add(dugmeYap(this, EN / 2, 476, t.saglamaEtiketi, RENK.dogru, () => {
      if (cevap.text) return;                    /* çift dokunmayı yut */
      cevap.setText(carpim + ' ÷ ' + t.grup + ' = ' + t.birim + '\n' +
                    carpim + ' ÷ ' + t.birim + ' = ' + t.grup);
      this.kivilcimlar.setParticleTint(RENK.dogru);
      this.kivilcimlar.explode(24, EN / 2, 372);
      this.puanEkle(150, EN / 2, 330);
      this.time.delayedCall(2000, () => { kap.destroy(); devam(); });
    }, EN - 90, 58));
  }

  sayacTazele(t){
    if (t.tip === 'carpma'){
      const tamKutu = this.dolu.filter(d => d >= this.hedefBirim).length;
      this.sayacYazi.setText(tamKutu + ' kutu × ' + this.hedefBirim + ' = ' + this.verilen);
    } else {
      this.sayacYazi.setText('Dağıtılan: ' + this.verilen + ' / ' + t.toplam +
        '   ·   her tabakta ' + Math.min.apply(null, this.dolu));
    }
  }

  puanEkle(kazanc, x, y){
    this.seri++;
    const p = kazanc + (this.seri - 1) * 4;
    this.puan += p;
    this.puanYazi.setText('Puan ' + this.puan);
    this.tweens.add({ targets:this.puanYazi, scale:1.3, duration:110, yoyo:true, ease:'Back.easeOut' });
    const u = this.add.text(x, y, '+' + p, { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#7ce0a3' }).setOrigin(0.5).setDepth(95);
    this.tweens.add({ targets:u, y:u.y - 36, alpha:0, duration:560, onComplete:() => u.destroy() });
  }

  yanlisHamle(mesaj, i){
    this.seri = 0; this.can--; this.arayuzuTazele();
    const x = this.kutuX(i);
    /* GERÇEK FİZİK: fazla öge kutudan savrulur */
    const t = TURLAR[this.tur];
    const sav = this.physics.add.existing(
      this.add.text(x, KUTU_UST + 20, t.emoji, { fontSize:'24px' }).setOrigin(0.5).setDepth(26));
    this.ogeler.add(sav);
    sav.body.setAllowGravity(true);
    sav.body.setVelocity(Phaser.Math.Between(-150, 150), -300);
    this.tweens.add({ targets:sav, angle:Phaser.Math.Between(-200, 200), duration:700 });
    this.tozlar.explode(12, x, KUTU_UST + 40);
    this.cameras.main.shake(210, 0.011);
    this.cameras.main.flash(160, 220, 90, 90);
    this.tweens.add({ targets:this.canYazi, angle:{ from:-12, to:12 }, duration:70,
      yoyo:true, repeat:3, onComplete:() => this.canYazi.setAngle(0) });
    this.mesajGoster(mesaj, '#b5453b');
    if (this.can <= 0){ this.kilit = true; this.time.delayedCall(900, () => this.bitir(false)); }
  }

  turuBitir(t){
    /* showCheck: önce bölmeyle sağlama, sonra tur biter. */
    if (t.saglama && !this.saglamaBitti){
      this.saglamaBitti = true;
      this.saglamaGoster(t, () => this.turuBitir(t));
      return;
    }
    this.puan += 200;
    this.puanYazi.setText('Puan ' + this.puan);
    this.kivilcimlar.setParticleTint(RENK.dogru);
    this.kivilcimlar.explode(28, EN / 2, KUTU_UST + KUTU_BOY / 2);
    this.cameras.main.flash(150, 80, 210, 140);
    this.mesajGoster(t.tamam, '#1f6d4a');
    this.tur++;
    this.arayuzuTazele();
    this.time.delayedCall(2400, () => {
      if (this.tur >= TURLAR.length){ this.bitir(true); return; }
      this.turuBaslat();
    });
  }

  mesajGoster(metin, arka){
    if (this.mesaj) this.mesaj.destroy();
    this.mesaj = this.add.text(EN / 2, 246, metin, { fontFamily:'system-ui, sans-serif',
      fontSize:'17px', fontStyle:'bold', color:'#ffffff', backgroundColor:arka,
      padding:{ x:12, y:7 }, align:'center', wordWrap:{ width:EN - 60 }
    }).setOrigin(0.5).setDepth(96).setAlpha(0);
    const t = this.mesaj;
    this.tweens.add({ targets:t, alpha:1, duration:150 });
    this.time.delayedCall(1800, () => {
      if (!t.active) return;
      this.tweens.add({ targets:t, alpha:0, duration:250,
        onComplete:() => { if (this.mesaj === t) this.mesaj = null; t.destroy(); } });
    });
  }

  arayuzKur(){
    this.kutuEtiket = []; this.kutuSayi = [];
    const serit = this.add.graphics().setDepth(60);
    serit.fillStyle(0x111520, 0.97); serit.fillRoundedRect(10, 10, EN - 20, 104, 18);
    this.add.text(EN / 2, 38, OYUN_EMO + '  ' + BASLIK_KISA, { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#ffffff' }).setOrigin(0.5).setDepth(61);
    this.puanYazi = this.add.text(30, 80, 'Puan 0', { fontFamily:'system-ui, sans-serif',
      fontSize:'20px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0, 0.5).setDepth(61);
    this.canYazi = this.add.text(EN - 30, 80, '', { fontSize:'20px' }).setOrigin(1, 0.5).setDepth(61);
    this.ilerlemeYazi = this.add.text(EN / 2, 80, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'19px', fontStyle:'bold', color:'#9fb0d6' }).setOrigin(0.5).setDepth(61);
    /* Yukarıdan büyüyor: uzun yönerge kutuların üstüne binmesin. */
    this.gorevYazi = this.add.text(EN / 2, 124, '', { fontFamily:'system-ui, sans-serif',
      fontSize:'18px', fontStyle:'bold', color:'#ffffff', align:'center',
      wordWrap:{ width:EN - 44 }, lineSpacing:2 }).setOrigin(0.5, 0).setDepth(61);
    this.arayuzuTazele();
  }

  arayuzuTazele(){
    this.canYazi.setText('❤️'.repeat(Math.max(0, this.can)) + '🖤'.repeat(Math.max(0, CAN_SAYISI - this.can)));
    this.ilerlemeYazi.setText(`${this.tur} / ${TURLAR.length} görev`);
  }

  bitir(kazandi){
    this.scene.start('GameOver', { kazandi, puan:this.puan, can:this.can,
      tur:this.tur, toplam:TURLAR.length });
  }

  update(){
    if (!this.ogeler || !this.ogeler.children) return;
    this.ogeler.getChildren().forEach(o => {
      if (!o.active || !o.body || !o.body.enable) return;
      const h = o.getData('hedef');
      if (h && o.y >= h.y - 1){
        o.body.setVelocity(0, 0); o.body.setAllowGravity(false); o.body.enable = false;
        o.setPosition(h.x, h.y);
      }
      if (o.y > BOY + 60 || o.x < -60 || o.x > EN + 60) o.destroy();
    });
  }
}

/* =====================================================================
   GAME OVER
   ===================================================================== */
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }
  init(veri){ this.veri = veri; }
  create(){
    const { kazandi, puan, can, tur, toplam } = this.veri;

    /* Uygulama içindeyken kazanma ekranı uygulamanın kutlamasıdır:
       XP/altın, kutlama ve sıradaki oyuna geçiş orada. */
    if (kazandi && KOPRU){ KOPRU.bitir(BASARI, puan); return; }
    fabrikaCiz(this);
    const emo = this.add.text(EN / 2, 190, kazandi ? '🤖' : '💪', { fontSize:'97px' })
      .setOrigin(0.5).setScale(0);
    this.tweens.add({ targets:emo, scale:1, duration:520, ease:'Back.easeOut' });
    this.add.text(EN / 2, 300, kazandi ? 'GRUP USTASI!' : 'TEKRAR DENE',
      { fontFamily:'system-ui, sans-serif', fontSize:'35px', fontStyle:'bold',
        color: kazandi ? '#7ce0a3' : '#ffd166', align:'center' }).setOrigin(0.5);
    this.add.text(EN / 2, 360, kazandi ? BASARI : `${tur} / ${toplam} görevi tamamladın — bir daha deneyelim mi?`,
      { fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#d5dcf0', align:'center',
        wordWrap:{ width:EN - 70 }, lineSpacing:5 }).setOrigin(0.5);
    const py = this.add.text(EN / 2, 456, 'Puan 0', { fontFamily:'system-ui, sans-serif',
      fontSize:'42px', fontStyle:'bold', color:'#ffd166' }).setOrigin(0.5);
    const s = { v:0 };
    this.tweens.add({ targets:s, v:puan, duration:900, ease:'Cubic.easeOut',
      onUpdate:() => py.setText('Puan ' + Math.round(s.v)) });
    this.add.text(EN / 2, 506, 'Kalan can: ' + (can > 0 ? '❤️'.repeat(can) : '—'),
      { fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#9fb0d6' }).setOrigin(0.5);
    if (kazandi){
      const k = this.add.particles(EN / 2, -20, 'kivilcim', {
        speed:{ min:90, max:260 }, angle:{ min:60, max:120 }, scale:{ start:0.8, end:0 },
        alpha:{ start:1, end:0 }, lifespan:2000, gravityY:180, quantity:2, frequency:70,
        tint:[0xffd166, 0x7ce0a3, 0x8a5a2f, 0x4a5a86] }).setDepth(5);
      this.time.delayedCall(2600, () => k.stop());
    }
    dugmeYap(this, EN / 2, 606, '↻  TEKRAR OYNA', RENK.dogru, () => this.scene.start('Game'));
    /* Çocuk bir oyunda takılıp kalmasın: uygulama içinde sıradakine geç. */
    if (KOPRU)  dugmeYap(this, EN / 2, 684, '⏭  SIRADAKİ OYUN', 0x4a679e, () => KOPRU.atla());
    if (!KOPRU) dugmeYap(this, EN / 2, 684, '☰  MENÜ', 0x4a5a86, () => this.scene.start('Menu'));
  }
}

/* =====================================================================
   NETLİK — cihazın piksel yoğunluğunda çizim
   ---------------------------------------------------------------------
   Oyun 480x800 mantıksal tuvalde çiziliyordu; telefon bunu 1080 piksele
   büyütünce yazılar ve kenarlar bulanıklaşıyordu. Çözüm: tuvali cihazın
   gerçek piksel sayısında açmak, dünyayı ise kamerayı NETLIK katına
   yakınlaştırarak yine 480x800 koordinatta tutmak. Böylece Graphics ile
   çizilen her şey (kartlar, şeritler, kutular) vektör keskinliğinde,
   yazılar da NETLIK çözünürlüğünde üretiliyor; oyun kodunun tek satırı
   değişmiyor.
   ===================================================================== */
const NETLIK = Math.min(3, Math.max(1, Math.round((window.devicePixelRatio || 1) * 2) / 2));

/* Phaser yazıyı kendi ara tuvaline çiziyor; çözünürlük verilmezse 1x
   üretilip yakınlaştırmada bulanıklaşır. Bütün yazılara varsayılan
   olarak NETLIK veriyoruz. */
(function(){
  const TS = Phaser.GameObjects.TextStyle.prototype;
  const eskiSetStyle = TS.setStyle;
  TS.setStyle = function(style, updateText, setDefaults){
    if (style && style.resolution === undefined) style.resolution = NETLIK;
    return eskiSetStyle.call(this, style, updateText, setDefaults);
  };
})();

/* Tuval NETLIK katına büyüdüğü için Phaser imleç konumunu da o ölçekte
   veriyor (0–960). Oyun koordinatına (0–480) çeviren yardımcı: sürükleme
   olayları zaten dünya koordinatı verdiği için yalnız pointer olaylarında
   kullanılıyor. */
function imlec(p){ return { x: p.x / NETLIK, y: p.y / NETLIK }; }

/* Her sahne başlarken kamerayı NETLIK katına yakınlaştırıp fizik
   dünyasını mantıksal ölçüde tutuyoruz: tuval büyüdü, dünya büyümedi.
   Sahne örnekleri oyun kurulumundan sonra eşzamansız oluştuğu için
   kanca Systems.start üzerine takılıyor — yeniden başlatmalarda da
   kendiliğinden çalışıyor. */
(function(){
  const SS = Phaser.Scenes.Systems.prototype;
  const eskiStart = SS.start;
  SS.start = function(veri){
    const sonuc = eskiStart.call(this, veri);
    const sc = this.scene;
    try{
      if (sc.cameras && sc.cameras.main){
        sc.cameras.main.setZoom(NETLIK);
        sc.cameras.main.centerOn(EN / 2, BOY / 2);
      }
      if (sc.physics && sc.physics.world) sc.physics.world.setBounds(0, 0, EN, BOY);
    }catch(e){ /* netlik ayarı oyunu engellemesin */ }
    return sonuc;
  };
})();

window.OYUN = new Phaser.Game({
  type: Phaser.AUTO, parent: 'oyun', width: EN * NETLIK, height: BOY * NETLIK,
  backgroundColor: '#161a26',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 720 } } },
  scene: [BootScene, MenuScene, GameScene, GameOverScene]
});
