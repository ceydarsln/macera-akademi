if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);

function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(speech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}
function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();requestAnimationFrame(()=>speak(round().prompt))}
function updateStage(){if(!round())return;const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
function wrong(hint){if(locked||!round())return;if(!round().noPenalty)lives=Math.max(0,lives-1);feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün. Nesneleri dikkatle incele.');const sc=$('.stage');sc?.classList.remove('shake');void sc?.offsetWidth;sc?.classList.add('shake');if(lives===0){lives=3;setTimeout(render,650)}else $('.lives').innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function good(message){if(locked)return;locked=true;score+=10;const r=round();if(r.successScene){$('#stage').innerHTML=typeof r.successScene==='function'?r.successScene(state):r.successScene;$('#stage').classList.add('success-motion')}feedback(message||r.result||'Doğru!');speak(r.result||message||'Doğru.');setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function C(label,correct=false,value=null){return{label,correct,value}}
function P(id,html,target){return{id,html,target}}
function T(id,html,need=1){return{id,html,need}}
function Q(prompt,scene,choices,result,hint,extra={}){return{kind:'choice',prompt,scene,choices,result,hint,...extra}}
function D(prompt,scene,pieces,targets,result,hint,extra={}){return{kind:'drag',prompt,scene,pieces,targets,result,hint,...extra}}
function renderRound(){const r=round();if(!r)return;updateStage();const fn={choice:renderChoice,multi:renderMulti,order:renderOrder,drag:renderDrag,process:renderProcess,estimate:renderEstimate,memory:renderMemory,tally:renderTally,graph:renderGraph,slider:renderSlider,basamak:renderBasamak,numpad:renderNumpad,serit:renderSerit,kule:renderKule,sayidogru:renderSayidogru,asansor:renderAsansor,tepsi:renderTepsi,terazi:renderTerazi,ayna:renderAyna,ciz:renderCiz,kod:renderKod,ip:renderIp,aci:renderAci}[r.kind];(fn||renderChoice)(r)}
function renderChoice(r){$('#task').innerHTML=`<div class="choices">${r.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c.html||esc(c.label)}</button>`).join('')}</div>`;$$('[data-choice]').forEach(b=>b.onclick=()=>{const c=r.choices[+b.dataset.choice];if(c.correct)good(c.message);else wrong(c.hint||r.hint)})}

/* ===== 4. sınıf ortak yardımcılar ===== */
const PLACES=[['yb','yüz binler'],['ob','on binler'],['bn','binler'],['yz','yüzler'],['on','onlar'],['br','birler']];
function ertele(fn,ms){const t=roundIndex;setTimeout(()=>{if(roundIndex===t&&!locked)fn()},ms)}
function grupla(n){const s=String(n);return s.length>3?s.slice(0,-3)+'.'+s.slice(-3):s}
const BIR=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],ONLR=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
function uclu(n){const y=Math.floor(n/100),o=Math.floor(n%100/10),b=n%10;
 return [(y?(y>1?BIR[y]+' ':'')+'yüz':''),ONLR[o],BIR[b]].filter(Boolean).join(' ')}
function sayiAdi(n){if(n===0)return 'sıfır';const bin=Math.floor(n/1000),kalan=n%1000;
 const bp=bin?((bin===1?'':uclu(bin)+' ')+'bin'):'';return [bp,kalan?uclu(kalan):''].filter(Boolean).join(' ')}
function karistir(a,tohum){return a.map((x,i)=>({x,k:(i*7+tohum*13)%a.length})).sort((p,q)=>p.k-q.k).map(o=>o.x)}
function birimKare(n,renk){return `<div class="row" style="gap:2px">${Array.from({length:n},()=>`<i style="width:15px;height:15px;background:${renk||'#8fd0a2'};border:1px solid #3f8a5c;display:inline-block"></i>`).join('')}</div>`}

function bitirTur(r){if(r.after)ertele(()=>sonSoru(r),FAST?20:520);else good()}
/* --- basamak kasası: altı pencere + rakam paleti (p01) ---
   Şartname: ekranda hazır üçlü gruplar YOK; yalnız sayının okunuşu var.
   Çocuk her basamağı ayrı kurar, sıfırlı basamak da elle doldurulur. */
function pvTable(dig,sel,err){
 const cell=(i)=>{const [k,ad]=PLACES[i];
  return `<div class="pv-cell ${i<3?'binler':'birler'} ${sel===i?'hot':''} ${err===i?'err':''}" data-pv="${i}">
   <b>${dig[i]===null?'&nbsp;':dig[i]}</b><small>${ad}</small></div>`};
 return `<div class="pv-group"><div>${[0,1,2].map(cell).join('')}</div><span class="pv-sep">·</span><div>${[3,4,5].map(cell).join('')}</div></div>
 <div class="caption" style="font-size:12px">binler bölüğü &nbsp;·&nbsp; birler bölüğü</div>`}
function renderBasamak(r){
 state.dig=[null,null,null,null,null,null];state.sel=0;state.err=null;
 const pal=karistir(r.palette,r.seed||3);
 const ciz=()=>{
  $('#stage').innerHTML=`<div class="caption">${r.kasa||'🔐'} ${esc(r.adi)}</div>${pvTable(state.dig,state.sel,state.err)}
   <div class="note">${esc(r.note||'Önce bir pencereye, sonra rakama dokun.')}</div>`;
  $$('[data-pv]').forEach(c=>c.onclick=()=>{state.sel=+c.dataset.pv;state.err=null;ciz()});
  $('#task').innerHTML=`<div class="chip-row">${pal.map((d,i)=>`<button class="choice" data-dig="${i}" style="flex:0 0 46px;min-width:46px">${d}</button>`).join('')}</div>
   <div class="actions"><button class="action" data-clear>↶ Pencereyi boşalt</button></div>`;
  $$('[data-dig]').forEach(b=>b.onclick=()=>{
   const d=pal[+b.dataset.dig],i=state.sel;
   if(String(r.target).padStart(6,'0')[i]!==String(d)){state.err=i;ciz();return wrong(r.pvHint?r.pvHint(i,d):r.hint)}
   state.dig[i]=d;state.err=null;
   const bos=state.dig.findIndex(x=>x===null);state.sel=bos<0?i:bos;ciz();
   if(state.dig.every(x=>x!==null))bitirTur(r)});
  $('[data-clear]').onclick=()=>{state.dig[state.sel]=null;state.err=null;ciz()}};
 ciz()}

/* --- adım adım tuş takımı: ara basamak/strateji görünür (p14,p18,p29,p40,p56) --- */
function renderNumpad(r){
 state.i=0;state.buf='';
 const ciz=()=>{
  const s=r.steps[state.i];
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}
   <div class="worksteps">${r.steps.map((x,i)=>`<div class="${i<state.i?'done':''}">${i<state.i?'✅ ':(i===state.i?'▶️ ':'⬜ ')}${x.ask}${i<state.i?' = <b>'+esc(String(x.answer))+'</b>':''}</div>`).join('')}</div>
   <div class="readout">${esc(state.buf||'—')}${s&&s.unit?' '+esc(s.unit):''}</div>`;
  if(!s)return;
  $('#task').innerHTML=`<div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-k="${d}">${d}</button>`).join('')}
   ${s.comma?'<button data-k=",">,</button>':''}<button data-back>⌫</button><button data-ok>✔️</button></div>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{if(state.buf.length<7){state.buf+=b.dataset.k;ciz()}});
  $('[data-back]').onclick=()=>{state.buf=state.buf.slice(0,-1);ciz()};
  $('[data-ok]').onclick=()=>{
   if(state.buf==='')return wrong('Önce rakamlara dokunarak sonucu yaz.');
   if(state.buf!==String(s.answer)){state.buf='';state.reveal=state.i;ciz();return wrong(s.hint||r.hint)}
   state.i++;state.buf='';ciz();if(state.i===r.steps.length)good()}};
 ciz()}

/* --- durağan bant: kart karar verilene kadar ORTADA ve tam görünür --- */
function renderSerit(r){
 state.i=0;state.gecis=false;
 const ciz=()=>{
  const c=r.cards[state.i];
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}
   <div class="belt-rail"><div class="belt-card">${c?c.html:'Bant boşaldı ✅'}${c&&c.sub?`<small>${c.sub}</small>`:''}</div></div>
   <div class="belt-progress">${r.cards.map((_,i)=>`<i class="${i<state.i?'on':''}"></i>`).join('')}</div>
   ${state.kanit?`<div class="note">${state.kanit}</div>`:''}`;
  if(!c)return;
  if(c.say&&!state.gecis)ertele(()=>speak(c.say),120);
  $('#task').innerHTML=`<div class="bins">${r.bins.map(b=>`<button class="bin" data-bin="${b.id}"><b>${b.emoji||''}</b><span>${esc(b.label)}</span>${b.sub?`<small>${esc(b.sub)}</small>`:''}</button>`).join('')}</div>`;
  $$('[data-bin]').forEach(b=>b.onclick=()=>{
   if(state.gecis)return;
   if(b.dataset.bin!==c.bin){b.classList.add('bad');state.kanit=c.why||'';ciz();return wrong(c.why||r.hint)}
   state.gecis=true;state.kanit=c.proof||'';
   b.classList.add('ok');ciz();
   ertele(()=>{state.i++;state.gecis=false;state.kanit='';if(state.i===r.cards.length)bitirTur(r);else ciz()},FAST?20:620)})};
 ciz()}

/* --- sıra kulesi: sabit yuvalar; kart hareket etmez, aralara ekleme yapılır --- */
function renderKule(r){
 state.slots=Array(r.order.length).fill(null);
 (r.preset||[]).forEach(([i,id])=>state.slots[i]=id);
 state.pick=null;
 const kalan=()=>r.cards.filter(c=>!state.slots.includes(c.id));
 const ciz=()=>{
  $('#stage').innerHTML=`<div class="caption">${esc(r.yon||'')}</div>
   <div class="tower-slots">${state.slots.map((id,i)=>{const c=r.cards.find(x=>x.id===id);
    return `<div class="tower-slot ${c?'filled':''}" data-slot="${i}"><i>${i+1}.</i>${c?c.label:'boş yuva'}</div>`}).join('')}
   </div><div class="tower-arrow">${esc(r.okText||'')}</div>`;
  $$('[data-slot]').forEach(s=>s.onclick=()=>{
   const i=+s.dataset.slot;if(state.slots[i])return;
   if(state.pick===null)return wrong('Önce alttaki kartlardan birini seç.');
   if(r.order[i]!==state.pick){const gerek=r.cards.find(x=>x.id===r.order[i]),secilen=r.cards.find(x=>x.id===state.pick);
    return wrong(r.karsilastir?r.karsilastir(secilen,gerek):r.hint)}
   state.slots[i]=state.pick;state.pick=null;ciz();
   if(state.slots.every(Boolean))bitirTur(r)});
  $('#task').innerHTML=`<div class="chip-row">${kalan().map(c=>`<button class="choice" data-card="${c.id}" style="${state.pick===c.id?'outline:4px solid var(--gold)':''}">${c.label}</button>`).join('')||'<span class="note">Bütün kartlar yerleşti</span>'}</div>`;
  $$('[data-card]').forEach(b=>b.onclick=()=>{state.pick=b.dataset.card;ciz()})};
 ciz()}

/* --- gerçek sayı doğrusu: uzaklıklar ölçekli çizilir, sürgü tarafsız başlar --- */
function nlHtml(r,v){
 const p=x=>4+((x-r.min)/(r.max-r.min))*92;
 const ticks=(r.ticks||[]).map(t=>`<i class="tick ${t.major?'major':''}" style="left:${p(t.v)}%"></i>${t.label!==undefined?`<span class="lab" style="left:${p(t.v)}%">${esc(String(t.label))}</span>`:''}`).join('');
 const marks=(r.marks||[]).map(m=>`<span class="mark" style="left:${p(m.v)}%">${m.icon||'🔻'}${m.label?`<small>${esc(String(m.label))}</small>`:''}</span>`).join('');
 const spans=(state.showSpans?(r.spans||[]):[]).map(s=>`<i class="span" style="left:${p(s.from)}%;width:${p(s.to)-p(s.from)}%"><span>${esc(s.label)}</span></i>`).join('');
 return `<div class="numline"><i class="axis"></i>${ticks}${spans}${marks}
  <span class="mark" style="left:${p(v)}%;top:-4px">${r.handle||'🔺'}<small>${esc(r.format?r.format(v):String(v))}</small></span></div>`}
function renderSayidogru(r){
 state.value=r.start;state.showSpans=!!r.spansAtStart;
 const ciz=()=>{
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}${nlHtml(r,state.value)}
   ${state.note?`<div class="note">${state.note}</div>`:''}`;
  $('#task').innerHTML=`<input class="range-control" data-range type="range" min="${r.min}" max="${r.max}" step="${r.step||1}" value="${state.value}" aria-label="${esc(r.aria||'Değeri sürükle')}">
   <div class="actions">${r.spans?'<button class="action" data-spans>📏 Uzaklıkları göster</button>':''}<button class="action" data-ok>${esc(r.confirm||'Onayla')}: <b>${esc(r.format?r.format(state.value):String(state.value))}</b></button></div>`;
  const inp=$('[data-range]');inp.oninput=()=>{state.value=+inp.value;ciz()};
  $('[data-spans]')?.addEventListener('click',()=>{state.showSpans=true;ciz()});
  $('[data-ok]').onclick=()=>{
   if(Math.abs(state.value-r.target)>(r.tolerance||0)){state.showSpans=true;state.note=r.wrongNote||'';ciz();return wrong(typeof r.hint==='function'?r.hint(state.value):r.hint)}
   state.showSpans=true;state.note=r.okNote||'';ciz();
   bitirTur(r)}};
 ciz()}


/* --- gökdelen asansörü: dikey kuyuda ileri-geri ritmik sayma (p06) ---
   Rota çizgisi cevabı söylemez: kat yalnız doğru seçimden SONRA iz bırakır. */
function renderAsansor(r){
 state.leg=0;state.pos=r.start;state.trail=[r.start];state.steps=0;
 const leg=()=>r.legs[state.leg];
 const ciz=()=>{
  const g=leg();
  $('#stage').innerHTML=`<div class="caption">${esc(r.baslik||'')}</div>
   <div class="shaft">${r.floors.map(v=>`<div class="floor ${v===state.pos?'here':''} ${state.trail.includes(v)&&v!==state.pos?'trail':''} ${v===g.goal?'goal':''}" data-fl="${v}">
     <span>${v===state.pos?(r.kabin||'🛗'):''}</span><b>${grupla(v)}</b><span>${v===g.goal?'🎯':''}</span></div>`).join('')}</div>
   <div class="note">Görev ${state.leg+1}/${r.legs.length} · Adım: <b>${g.stepBy>0?'+':''}${grupla(g.stepBy)}</b> · Şu an: <b>${grupla(state.pos)}</b> · Hedef: <b>${grupla(g.goal)}</b></div>`;
  $$('[data-fl]').forEach(f=>f.onclick=()=>{
   const v=+f.dataset.fl,g2=leg();
   if(v!==state.pos+g2.stepBy)return wrong(`${grupla(state.pos)} ${g2.stepBy>0?'+':'−'} ${grupla(Math.abs(g2.stepBy))} = ${grupla(state.pos+g2.stepBy)} olur. Kabin bu katta bekliyor.`);
   state.pos=v;state.trail.push(v);ciz();
   if(state.pos===g2.goal){
    if(state.leg===r.legs.length-1)return good();
    state.leg++;state.trail=[state.pos];ertele(ciz,FAST?20:520);feedback('Görev tamam')}})};
 ciz()}

/* --- tepsi: seçilen parçalar tepside KALIR, tek tek geri alınabilir (p10,p23,p32,p51) --- */
function renderTepsi(r){
 state.tray=[];
 const say=()=>{const m={};state.tray.forEach(id=>m[id]=(m[id]||0)+1);return m};
 const tamam=()=>{const m=say(),n=r.need;const k=Object.keys(n);
  return k.length===Object.keys(m).length&&k.every(x=>m[x]===n[x])};
 const ciz=()=>{
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}
   <div class="tray">${state.tray.length?state.tray.map((id,i)=>{const p=r.pool.find(x=>x.id===id);
    return `<button class="slotted" data-rm="${i}">${p.label} ✕</button>`}).join(''):`<span class="tray-empty">${esc(r.emptyLabel||'Tepsi boş')}</span>`}</div>
   ${state.note?`<div class="note">${state.note}</div>`:''}`;
  $$('[data-rm]').forEach(b=>b.onclick=()=>{state.tray.splice(+b.dataset.rm,1);state.note='';ciz()});
  $('#task').innerHTML=`<div class="chip-row">${r.pool.map(p=>`<button class="choice" data-add="${p.id}">${p.label}</button>`).join('')}</div>
   <div class="actions"><button class="action" data-serve>${esc(r.serveLabel||'🍽️ Siparişi ver')}</button></div>`;
  $$('[data-add]').forEach(b=>b.onclick=()=>{
   const p=r.pool.find(x=>x.id===b.dataset.add);
   if(r.need[p.id]===undefined&&r.strict){state.note=p.why||'';ciz();return wrong(p.why||r.hint)}
   state.tray.push(p.id);state.note='';ciz()});
  $('[data-serve]').onclick=()=>{
   if(!state.tray.length)return wrong('Tepsi boş; önce parçaları seç.');
   if(!tamam()){state.note=r.wrongNote||'';ciz();return wrong(r.hint)}
   state.note=r.okNote||'';ciz();bitirTur(r)}};
 ciz()}

/* --- eşitlik terazisi: kefelerdeki her birim sayılır, eşitlik sembolle yazılır --- */
function renderTerazi(r){
 state.add=0;
 const sag=()=>r.right.n+state.add*(r.unitValue||1);
 const ciz=()=>{
  const l=r.left.n,s=sag(),d=l===s?'':(l>s?'tiltL':'tiltR');
  $('#stage').innerHTML=`<div class="caption">${esc(r.baslik||'')}</div>
   <div class="scale ${d}">
    <div class="pan"><b>${esc(r.left.label)}</b><div class="units">${Array.from({length:Math.min(l,r.cap||40)},()=>'<i></i>').join('')}</div><b>${l}</b></div>
    <div class="scale-mid">${l===s?'=':(l>s?'>':'<')}</div>
    <div class="pan"><b>${esc(r.right.label)}</b><div class="units">${Array.from({length:Math.min(r.right.n,r.cap||40)},()=>'<i></i>').join('')}${Array.from({length:Math.min(state.add*(r.unitValue||1),r.cap||40)},()=>'<i class="red"></i>').join('')}</div><b>${s}</b></div></div>
   <div class="note">${esc(r.left.label)} ${l} ${l===s?'=':'≠'} ${esc(r.right.label)} ${s}${state.add?` &nbsp;(${r.right.n} + ${state.add*(r.unitValue||1)})`:''}</div>`;
  $('#task').innerHTML=`<div class="actions"><button class="action" data-plus>➕ ${r.unitValue||1} ekle</button><button class="action" data-minus>➖ ${r.unitValue||1} çıkar</button><button class="action" data-ok>⚖️ Dengeyi onayla</button></div>
   <div class="note">Eklenen: <b>${state.add*(r.unitValue||1)}</b></div>`;
  $('[data-plus]').onclick=()=>{state.add++;ciz()};
  $('[data-minus]').onclick=()=>{state.add=Math.max(0,state.add-1);ciz()};
  $('[data-ok]').onclick=()=>{if(sag()!==r.left.n)return wrong(r.hint);bitirTur(r)}};

/* --- simetri ızgarası: eksen görünür, eş uzaklık kılavuzu var, silgi ve geri al bulunur --- */
function renderAyna(r){
 state.put=new Set();state.hist=[];state.silgi=false;
 const key=(x,y)=>x+','+y;
 const es=(x,y)=>{const out=[];
  if(r.axis==='v'||r.axis==='both')out.push([2*r.axisX-1-x,y]);
  if(r.axis==='h'||r.axis==='both')out.push([x,2*r.axisY-1-y]);
  if(r.axis==='both')out.push([2*r.axisX-1-x,2*r.axisY-1-y]);
  return out};
 const gerek=()=>{const s=new Set();r.src.forEach(([x,y])=>es(x,y).forEach(([a,b])=>{
   if(!r.src.some(p=>p[0]===a&&p[1]===b))s.add(key(a,b))}));return s};
 const hedef=gerek();
 const ciz=()=>{
  let g='';
  for(let y=0;y<r.rows;y++)for(let x=0;x<r.cols;x++){
   const src=r.src.some(p=>p[0]===x&&p[1]===y),put=state.put.has(key(x,y));
   const ax=(r.axis!=='h'&&(x===r.axisX-1||x===r.axisX))||(r.axis!=='v'&&(y===r.axisY-1||y===r.axisY));
   g+=`<div class="c ${src?'src':''}${put?' put':''}${ax&&!src&&!put?' axis':''}" data-cell="${x},${y}"></div>`}
  $('#stage').innerHTML=`<div class="caption">${esc(r.baslik||'')}</div>
   <div class="symgrid" style="--c:${r.cols}">${g}</div>

  $$('[data-cell]').forEach(c=>c.onclick=()=>{
   const [x,y]=c.dataset.cell.split(',').map(Number),k=key(x,y);
   if(state.silgi){if(state.put.delete(k)){state.hist=state.hist.filter(h=>h!==k);ciz()}return}
   if(r.src.some(p=>p[0]===x&&p[1]===y))return wrong('Bu hücre kaynak desende; eşini eksenin öbür yanına koy.');
   if(state.put.has(k))return;
   if(!hedef.has(k))return wrong(r.hint);
   state.put.add(k);state.hist.push(k);ciz();
   if([...hedef].every(h=>state.put.has(h)))bitirTur(r)});
  $('#task').innerHTML=`<div class="sym-tools"><button class="action" data-undo>↶ Geri al</button><button class="action" data-er>🧽 Silgi: ${state.silgi?'açık':'kapalı'}</button></div>`;
  $('[data-undo]').onclick=()=>{const k=state.hist.pop();if(k)state.put.delete(k);ciz()};
  $('[data-er]').onclick=()=>{state.silgi=!state.silgi;ciz()}};
 ciz()}

function renderKod(r){

  let g='';

   const w=(r.walls||[]).some(p=>p[0]===x&&p[1]===y),on=state.trail.includes(x+','+y),bot=state.pos[0]===x&&state.pos[1]===y;

  $('#task').innerHTML=`<div class="actions">${['U','D','L','R'].map(d=>`<button class="action" data-dir="${d}">${{U:'↑',D:'↓',L:'←',R:'→'}[d]}</button>`).join('')}
   <button class="action" data-clr>Sil</button><button class="action" data-run>▶️ Çalıştır</button></div>`;
  $$('[data-dir]').forEach(b=>b.onclick=()=>{if(state.prog.length<(r.maxSteps||14)){state.prog.push(b.dataset.dir);ciz()}});

function kodCalistir(r,ciz){
 if(!state.prog.length)return wrong('Önce yön bloklarıyla bir program kur.');

 let i=0;

  if(i>=state.prog.length){state.run=-1;ciz();return bitir(r)}

  const p=[...state.pos];if(d==='U')p[1]--;if(d==='D')p[1]++;if(d==='L')p[0]--;if(d==='R')p[0]++;
  if(p[0]<0||p[1]<0||p[0]>=r.cols||p[1]>=r.rows||(r.walls||[]).some(w=>w[0]===p[0]&&w[1]===p[1])){
   state.run=-1;ciz();return wrong(r.hint)}
  state.pos=p;if(!state.trail.includes(p.join(',')))state.trail.push(p.join(','));
  i++;ciz();ertele(adim,FAST?5:230)};

function bitir(r){

 if(hedef.every(h=>state.trail.includes(h))&&(!r.exact||state.trail.length===hedef.length))good();

/* ---- Tema 2: kesir modelleri (şerit ve daire) ----
   Şartnamenin ortak isteği: kesir hiçbir yerde yalnız sembol olarak kalmasın;
   aynı bütün üzerinde çizilen parça-bütün modeliyle birlikte görünsün. */
function kSerit(pay,payda,renk,genislik){const w=genislik||150;
 return `<span style="display:inline-flex;width:${w}px;height:26px;border:2px solid #3d5a72;border-radius:6px;overflow:hidden;vertical-align:middle">
 ${Array.from({length:payda},(_,i)=>`<i style="flex:1 1 0;border-right:${i<payda-1?'1px solid #3d5a72':'0'};background:${i<pay?(renk||'#f2b83f'):'#fff'}"></i>`).join('')}</span>`}
function kDaire(pay,payda,renk,cap){const R=(cap||58)/2,C=R,parts=[];
 for(let i=0;i<payda;i++){const a1=(i/payda)*2*Math.PI-Math.PI/2,a2=((i+1)/payda)*2*Math.PI-Math.PI/2;
  const x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1),x2=C+R*Math.cos(a2),y2=C+R*Math.sin(a2);
  parts.push(`<path d="M ${C} ${C} L ${x1} ${y1} A ${R} ${R} 0 ${(a2-a1)>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${i<pay?(renk||'#e8846b'):'#fff'}" stroke="#8a5725" stroke-width="1.5"/>`)}
 return `<svg width="${cap||58}" height="${cap||58}" viewBox="0 0 ${cap||58} ${cap||58}" style="vertical-align:middle">${parts.join('')}</svg>`}
function kBileske(pay,payda,renk){/* bileşik kesir: kaç TAM bütün doldu, kaç parça arttı */
 const tam=Math.floor(pay/payda),kalan=pay%payda;
 return `<span class="row" style="gap:4px;flex-wrap:wrap">${Array.from({length:tam},()=>kDaire(payda,payda,renk,46)).join('')}${kalan?kDaire(kalan,payda,renk,46):''}</span>`}
function kEtiket(pay,payda){return `<b style="font-size:20px">${pay}<span style="font-size:14px">/</span>${payda}</b>`}
function kTam(t,pay,payda){return `<b style="font-size:20px">${t} tam ${pay}<span style="font-size:14px">/</span>${payda}</b>`}
