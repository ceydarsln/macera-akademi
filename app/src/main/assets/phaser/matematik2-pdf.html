<body><div id="app" class="app"></div>
<script>
'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'v01';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speech=s=>String(s??'').replace(/\+/g,' artı ').replace(/[−–-]/g,' eksi ').replace(/[×x]/g,' çarpı ').replace(/[:÷]/g,' bölü ').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim();
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(speech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}

function frogScene(seq,gap,answer){return()=>`<div class="river"><span class="frog" style="left:${4+(state.done||0)*20}%">🐸</span>${seq.map((n,i)=>`<span class="lily">${i===gap?(state.done?answer:'?'):n}</span>`).join('')}</div><div class="caption">Komşu sayıları sayı doğrusu gibi soldan sağa oku.</div>`}
GAMES.v03={title:'Zıpzıp Kurbağa',theme:'pond',finish:'Eksik sayıları üç farklı konumda bulup kurbağayı sayı rotasının tamamında ilerlettin.',rounds:[
 D('18, 19, ?, 21 rotasında eksik nilüfer taşını boşluğa sürükle.',frogScene([18,19,0,21],2,20),[P('a','17',null),P('b','20','gap'),P('c','22',null)],[T('gap','🪷 ?')],'Kurbağa 18, 19, 20, 21 diye bütün rotaya zıpladı.','19’dan sonra gelen, 21’den önceki sayıyı düşün.',{onDrop:s=>s.done=1}),
 D('36, ?, 38, 39 rotasındaki boş nilüferi tamamla.',frogScene([36,0,38,39],1,37),[P('a','47',null),P('b','37','gap'),P('c','36',null)],[T('gap','🪷 ?')],'Kurbağa 36’dan 39’a kadar saydı; 37 iki komşusunun arasındaydı.','36’dan bir ileri git.',{onDrop:s=>s.done=1}),

]};

function trampScene(nums){return()=>`<div class="row" style="align-items:flex-end">${nums.map((n,i)=>`<div class="stack"><span class="big" style="font-size:42px;transform:translateY(${i%2?0:-10}px)">${i===(state.visualPos||0)?'👾':'⭐'}</span><span class="badge">${n}</span><span style="font-size:34px">🟣</span></div>`).join('')}</div><div class="caption">Her renkli yay bir sonraki ritmik sayma adımını gösterir.</div>`}
function orderNumbers(nums){return{kind:'order',scene:trampScene(nums),items:[...nums].reverse().map(n=>({id:String(n),label:String(n)})),order:nums.map(String),onStep:s=>s.visualPos=(s.visualPos||0)+1,hint:'Önceki trambolindeki sayıya turdaki adımı ekle.'}}

function cakeScene(pattern){return()=>`<div class="cake">${pattern.map((x,i)=>`<span class="cake-slot" style="left:${16+(i%4)*54}px;top:${i<4?7:80}px">${x==='?'?'':x}</span>`).join('')}</div><div class="caption">Tekrar eden küçük grubu pasta üzerinde izle.</div>`}

function balloonEstimate(actual,approx){return()=>`<div style="position:relative;width:100%">${balloons(actual)}<div class="cloud-mask ${state.revealed?'open':''}">${state.revealed?'':'☁️'}</div></div><div class="caption">${state.revealed?`Gerçek sayı ${actual}: ${Math.floor(actual/10)} dolu onluk ve ${actual%10} birlik. Tahmin ${approx}, fark ${Math.abs(actual-approx)}.`:'Bulutun kenarındaki dolu onluk demetlerini ara.'}</div>`}

function animalPieces(list){return list.map((x,i)=>P('a'+i,`<span class="animal">${x[0]}<b class="jersey">${x[1]}</b></span>`,'p'+[...list].sort((a,b)=>a[1]-b[1]).findIndex(y=>y[1]===x[1])))}
function animalTargets(n){return Array.from({length:n},(_,i)=>T('p'+i,`<div class="photo-spot">${i+1}</div>`))}

function boxActions(groups,icon){return Array.from({length:groups},(_,i)=>({id:'b'+i,label:`${i+1}. kutu`,html:`${icon} → ${i+1}. kutu`}))}

function freqScene(rows){return s=>{const i=(s.steps||[]).length,row=rows[Math.min(i,rows.length-1)];return `<div class="big">👽 🧺</div><div class="row">${rows.map((x,j)=>`<div class="tally" style="opacity:${j===i?1:.55}"><b>${x.icon}</b><div class="tally-marks">${tallyMarks(x.n)}</div>${j<i?`<strong>${x.n}</strong>`:''}</div>`).join('')}</div><div class="caption">Beşli grup + kalan: ${row.n>=5?'5 + '+(row.n-5):row.n}</div>`}}
function freqRound(prompt,rows,result){return{kind:'process',prompt,scene:freqScene(rows),actions:Array.from({length:10},(_,i)=>({id:String(i),label:String(i)})),sequence:rows.map(x=>String(x.n)),hint:'Önce çapraz çizgili beşli grubu, sonra kalan çizgileri say.',result}}
