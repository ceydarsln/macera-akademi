<body><div id="app" class="app"></div>
<script>
/* Sınama modunda (?test=1) tarayıcının arka plan sekme kısıntısını aş:
   gizli sekmede setTimeout dakikada bire kadar iniyor ve oyunun kendi
   geçişleri donuyordu. Yalnız kısa gecikmeler için, yalnız testte. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}

'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'v01';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speech=s=>String(s??'').replace(/\+/g,' artı ').replace(/[−–-]/g,' eksi ').replace(/[×x]/g,' çarpı ').replace(/[:÷]/g,' bölü ').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim();
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(speech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}
function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"${c.id?` data-chart-id="${esc(c.id)}"`:''}><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"${c.id?` data-chart-id="${esc(c.id)}"`:''}><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){state={};locked=false;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();requestAnimationFrame(()=>speak(round().prompt))}
function updateStage(){const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
function wrong(hint){if(locked)return;if(!round().noPenalty)lives=Math.max(0,lives-1);feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün. Nesneleri dikkatle incele.');const sc=$('.stage');sc?.classList.remove('shake');void sc?.offsetWidth;sc?.classList.add('shake');if(lives===0){lives=3;setTimeout(render,650)}else $('.lives').innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function good(message){if(locked)return;locked=true;score+=10;const r=round();if(r.successScene){$('#stage').innerHTML=typeof r.successScene==='function'?r.successScene(state):r.successScene;$('#stage').classList.add('success-motion')}feedback(message||r.result||'Doğru!');speak(r.result||message||'Doğru.');setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function C(label,correct=false,value=null){return{label,correct,value}}
function P(id,html,target){return{id,html,target}}
function T(id,html,need=1){return{id,html,need}}
function Q(prompt,scene,choices,result,hint,extra={}){return{kind:'choice',prompt,scene,choices,result,hint,...extra}}
function D(prompt,scene,pieces,targets,result,hint,extra={}){return{kind:'drag',prompt,scene,pieces,targets,result,hint,...extra}}
function renderRound(){const r=round();updateStage();const fn={choice:renderChoice,multi:renderMulti,order:renderOrder,drag:renderDrag,process:renderProcess,estimate:renderEstimate,route:renderRoute,clock:renderClock,cut:renderCut,fold:renderFold,memory:renderMemory,tally:renderTally,graph:renderGraph,research:renderResearch,slider:renderSlider,liquid:renderLiquid,rope:renderRope,connect:renderConnect,grid:renderGrid,scan:renderScan,timer:renderTimer}[r.kind];(fn||renderChoice)(r)}
function activateSceneElement(el){el.classList.add('scene-control');el.setAttribute('role','button');el.tabIndex=0;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}}
function renderChoice(r){const sceneChoices=$$('[data-scene-choice]'),shown=new Set(sceneChoices.map(el=>+el.dataset.sceneChoice));const choose=i=>{const c=r.choices[i];if(!c)return;if(c.correct)good(c.message);else wrong(c.hint||r.hint)};sceneChoices.forEach(el=>{activateSceneElement(el);el.onclick=()=>choose(+el.dataset.sceneChoice)});const fallback=r.choices.map((c,i)=>shown.has(i)?'':`<button class="choice" data-choice="${i}">${c.html||esc(c.label)}</button>`).join('');$('#task').innerHTML=fallback?`<div class="choices">${fallback}</div>`:'<div class="scene-instruction">Seçimini sahnedeki nesneye dokunarak yap.</div>';$$('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice))}
function renderMulti(r){state.selected=[];$('#task').innerHTML=`<div class="actions">${r.items.map((x,i)=>`<button class="action" data-item="${i}">${x.html||esc(x.label)}</button>`).join('')}</div>`;$$('[data-item]').forEach(b=>b.onclick=()=>{const x=r.items[+b.dataset.item];if(!x.correct)return wrong(r.hint);if(state.selected.includes(x.id))return;state.selected.push(x.id);b.style.background='#b9f0d4';if(r.onSelect){r.onSelect(state,x);updateStage()}if(state.selected.length===r.items.filter(x=>x.correct).length)good()})}
function performOrder(r,x,el){const want=r.order[state.pos];if(x.id!==want)return wrong(r.hint);state.pos++;state.ordered=(state.ordered||[]).concat(x.id);el?.classList.add('done');if(el?.tagName==='BUTTON')el.disabled=true;if(r.onStep){r.onStep(state,x);updateStage()}if(state.pos===r.order.length)return good();bindSceneOrder(r)}
function bindSceneOrder(r){const ids=new Set;$$('[data-scene-order]').forEach(el=>{const x=r.items.find(item=>item.id===el.dataset.sceneOrder);if(!x||state.ordered?.includes(x.id))return;ids.add(x.id);activateSceneElement(el);el.onclick=()=>performOrder(r,x,el)});return ids}
function renderOrder(r){state.pos=0;state.ordered=[];const sceneIds=bindSceneOrder(r),fallback=r.items.map((x,i)=>sceneIds.has(x.id)?'':`<button class="action" data-order="${i}">${x.html||esc(x.label)}</button>`).join('');$('#task').innerHTML=fallback?`<div class="actions">${fallback}</div>`:'<div class="scene-instruction">Nesnelere istenen sırayla doğrudan dokun.</div>';$$('[data-order]').forEach(b=>b.onclick=()=>performOrder(r,r.items[+b.dataset.order],b))}
function mountSceneTargets(r){const ids=new Set;$$('[data-scene-target]').forEach(el=>{const id=el.dataset.sceneTarget;if(!r.targets.some(t=>t.id===id))return;ids.add(id);el.dataset.target=id;el.classList.add('scene-drop');let placed=el.querySelector(':scope > .placed');if(!placed){placed=document.createElement('div');placed.className='placed';el.appendChild(placed)}placed.innerHTML=(state.placedPieces?.[id]||[]).map(pid=>{const p=r.pieces.find(x=>x.id===pid);return p?`<span>${p.placed||p.html}</span>`:''}).join('')});return ids}
function bindDropTargets(r){$$('[data-target]').forEach(t=>t.onclick=()=>{if(!state.tapPiece)return;dropPiece(r,state.tapPiece,t.dataset.target)})}
function renderDrag(r){state.placed={};state.placedPieces={};state.done=0;const sceneIds=mountSceneTargets(r);const pieces=`<div class="pieces">${r.pieces.map(p=>`<div class="piece" data-piece="${p.id}" role="button">${p.html}</div>`).join('')}</div>`;const fallback=r.targets.filter(t=>!sceneIds.has(t.id));const targets=fallback.length?`<div class="targets">${fallback.map(t=>`<div class="target" data-target="${t.id}">${t.html}<div class="placed"></div></div>`).join('')}</div>`:'';$('#task').innerHTML=pieces+targets;$$('[data-piece]').forEach(el=>{el.onpointerdown=e=>startDrag(e,el,r);el.onclick=()=>{if(el.classList.contains('done'))return;if(state.tapPiece===el.dataset.piece){state.tapPiece=null;el.style.outline=''}else{state.tapPiece=el.dataset.piece;$$('[data-piece]').forEach(x=>x.style.outline='');el.style.outline='4px solid #f1b53a'}}});bindDropTargets(r)}
function startDrag(e,el,r){if(el.classList.contains('done'))return;e.preventDefault();const box=el.getBoundingClientRect(),placeholder=document.createElement('div');placeholder.className='piece drag-placeholder';placeholder.style.width=box.width+'px';placeholder.style.height=box.height+'px';el.parentNode.insertBefore(placeholder,el);drag={el,r,id:el.dataset.piece,offX:e.clientX-box.left,offY:e.clientY-box.top,startX:e.clientX,startY:e.clientY,moved:false,placeholder,parent:el.parentNode,next:el.nextSibling};el.setPointerCapture?.(e.pointerId);el.classList.add('dragging');moveDrag(e);window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag)}
function moveDrag(e){if(!drag)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8)drag.moved=true;drag.el.style.left=(e.clientX-drag.offX)+'px';drag.el.style.top=(e.clientY-drag.offY)+'px';$$('[data-target]').forEach(t=>{const b=t.getBoundingClientRect();t.classList.toggle('hot',drag.moved&&e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)})}
function endDrag(e){if(!drag)return;const d=drag;let hit=null;window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointerup',endDrag);window.removeEventListener('pointercancel',endDrag);if(d.moved)$$('[data-target]').forEach(t=>{const b=t.getBoundingClientRect();if(e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)hit=t});d.el.releasePointerCapture?.(e.pointerId);d.el.classList.remove('dragging');d.el.style.left=d.el.style.top='';d.placeholder?.remove();$$('[data-target]').forEach(t=>t.classList.remove('hot'));drag=null;if(hit)dropPiece(d.r,d.id,hit.dataset.target)}
function dropPiece(r,pid,tid){const p=r.pieces.find(x=>x.id===pid),t=r.targets.find(x=>x.id===tid),el=$(`[data-piece="${pid}"]`);if(!p||!t||!el||el.classList.contains('done'))return;if(p.target!==tid)return wrong(r.hint);el.classList.add('done');state.tapPiece=null;state.placed[tid]=(state.placed[tid]||0)+1;(state.placedPieces[tid]||(state.placedPieces[tid]=[])).push(pid);const pl=$(`[data-target="${tid}"] .placed`);if(pl)pl.insertAdjacentHTML('beforeend',`<span>${p.placed||p.html}</span>`);state.done++;if(r.onDrop){r.onDrop(state,p,t);updateStage();mountSceneTargets(r);bindDropTargets(r)}if(state.done===r.pieces.filter(x=>x.target).length)good()}
function performProcess(r,a){const expected=r.sequence[state.steps.length];if(expected!=null&&a.id!==expected)return wrong(r.hint);state.steps.push(a.id);state.counts[a.id]=(state.counts[a.id]||0)+1;if(r.onStep)r.onStep(state,a);updateStage();if(state.steps.length===r.sequence.length)return good();bindSceneActions(r)}
function bindSceneActions(r){const ids=new Set;$$('[data-scene-action]').forEach(el=>{const a=r.actions.find(x=>x.id===el.dataset.sceneAction);if(!a)return;ids.add(a.id);activateSceneElement(el);el.onclick=()=>performProcess(r,a)});return ids}

function renderTimer(r){state.estimate=r.startEstimate??5;state.started=0;state.elapsed=0;updateTimer(r)}
function updateTimer(r){$('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}<div class="digital">${state.started?(state.elapsed/1000).toFixed(1)+' sn':'Tahmin: '+state.estimate+' sn'}</div><div class="caption">${state.started?'Eylemi yap, bitince durdur.':'Önce bağımsız tahminini kaydet.'}</div>`;if(!state.started){$('#task').innerHTML=`<input class="range-control" data-time-est type="range" min="${r.min||1}" max="${r.max||30}" value="${state.estimate}"><button class="action" data-start-timer>Tahmini Kaydet ve Başlat</button>`;const x=$('[data-time-est]');x.oninput=()=>{state.estimate=+x.value;updateTimer(r)};$('[data-start-timer]').onclick=()=>{state.started=performance.now();state.tick=setInterval(()=>{state.elapsed=performance.now()-state.started;const d=$('.digital');if(d)d.textContent=(state.elapsed/1000).toFixed(1)+' sn'},100);updateTimer(r)}}else{$('#task').innerHTML='<button class="action" data-stop-timer>⏱️ Ölçümü Durdur</button>';$('[data-stop-timer]').onclick=()=>{clearInterval(state.tick);state.elapsed=performance.now()-state.started;if(state.elapsed<(FAST?5:350))return wrong('Kronometreyi eylem başlamadan durdurma; kısa da olsa gerçek bir ölçüm yap.');good()}}}

function groupScene(groups,per,icon){return s=>{const counts=Array.from({length:groups},(_,i)=>s.counts?.['b'+i]||0);return `<div class="boxes">${counts.map((n,i)=>`<div class="box" data-scene-action="b${i}"><b>${i+1}. kutu</b>${icon.repeat(n)}</div>`).join('')}</div><div class="caption">Banttaki parçayı koymak için sıradaki gerçek kutuya dokun · ${counts.join(' + ')} · Toplam ${counts.reduce((a,b)=>a+b,0)}</div>`}}
function roundRobin(groups,per){return Array.from({length:groups*per},(_,i)=>'b'+(i%groups))}
function boxActions(groups,icon){return Array.from({length:groups},(_,i)=>({id:'b'+i,label:`${i+1}. kutu`,html:`${icon} → ${i+1}. kutu`}))}

function placePieces3(h,t,o,prefix='p'){return[...Array.from({length:h},(_,i)=>P(`${prefix}h${i}`,'<i class="hundred-plate"></i><small>100</small>','h')),...Array.from({length:t},(_,i)=>P(`${prefix}t${i}`,'<i class="ten-rod"></i><small>10</small>','t')),...Array.from({length:o},(_,i)=>P(`${prefix}o${i}`,'<i class="one-cube"></i><small>1</small>','o'))]}

function coreScene(n,label='ENERJİ ÇEKİRDEĞİ'){return `<div class="big pulse">🛰️</div><div class="badge">${label}: ${n}</div>${hundredsModel(n)}`}
