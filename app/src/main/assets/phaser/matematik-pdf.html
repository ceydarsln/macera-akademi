.scene.dwarf-game{background:radial-gradient(circle at 50% 18%,#334b68 0,#17273b 46%,#0c1726 100%);padding:8px 8px max(12px,env(safe-area-inset-bottom))}

.dwarf-room{width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;padding:18px 8px 14px;overflow:hidden;background:linear-gradient(180deg,#203a57 0 54%,#152940 54% 57%,#715338 57% 100%)}
.dwarf-room:before{content:"";position:absolute;inset:0 0 43%;opacity:.38;background:linear-gradient(90deg,transparent 0 48%,#8aa0b2 48% 52%,transparent 52%) 0 0/70px 38px,linear-gradient(#8aa0b2 0 8%,transparent 8% 92%,#8aa0b2 92%) 0 0/100% 38px;mix-blend-mode:screen}
.dwarf-room:after{content:"";position:absolute;left:-12%;right:-12%;bottom:-13%;height:58%;background:repeating-linear-gradient(90deg,rgba(45,28,18,.34) 0 2px,transparent 2px 42px),repeating-linear-gradient(0deg,rgba(45,28,18,.38) 0 2px,transparent 2px 31px);transform:perspective(260px) rotateX(58deg);transform-origin:bottom;pointer-events:none}
.dwarf-room-title{position:relative;z-index:2;padding:7px 16px;border:2px solid #f6d17c;border-radius:999px;background:linear-gradient(#65401f,#3c2414);box-shadow:0 4px 0 #241308,0 0 18px rgba(255,198,81,.23);color:#fff1bd;font-weight:1000;font-size:14px;letter-spacing:.04em}
.dwarf-stage{--track:#af8050;position:relative;z-index:3;width:min(var(--room-width),94%);height:205px;margin:auto;border:5px solid #b98c5b;border-radius:20px;background:linear-gradient(165deg,rgba(255,213,132,.2),transparent 35%),repeating-linear-gradient(90deg,#8f6744 0 28px,#7b5739 28px 31px);box-shadow:0 10px 0 #4d3423,0 16px 24px rgba(0,0,0,.34),inset 0 0 30px rgba(255,211,130,.16);transition:width .45s ease}
.dwarf-stage:before{content:"";position:absolute;left:9%;right:9%;top:51%;border-top:4px dashed rgba(255,238,182,.48)}
.dwarf-line{position:absolute;top:14%;bottom:13%;width:5px;border-radius:5px;background:linear-gradient(#fff5ba,#f4b83f,#fff5ba);box-shadow:0 0 11px #ffd85b;z-index:5}.dwarf-line.start{left:9%}.dwarf-line.end{right:9%}.dwarf-line b{position:absolute;top:-25px;left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:8px;background:#101d2c;color:#fff7d5;font-size:10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.dwarf-door{position:absolute;right:1%;bottom:13%;width:58px;height:102px;z-index:4;filter:drop-shadow(0 8px 5px rgba(0,0,0,.35))}.dwarf-door svg{width:100%;height:100%;display:block}
.dwarf-actor{position:absolute;left:1%;bottom:12%;width:66px;height:94px;z-index:8;filter:drop-shadow(0 7px 4px rgba(0,0,0,.4))}.dwarf-actor svg{width:100%;height:100%;display:block}.dwarf-actor.walk{animation:dwarfWalk 1.65s cubic-bezier(.2,.72,.25,1) forwards}.dwarf-actor.walk svg{animation:dwarfBob .24s ease-in-out 7 alternate}
@keyframes dwarfWalk{to{left:76%}}@keyframes dwarfBob{to{transform:translateY(-7px) rotate(2deg)}}
.dwarf-step{position:absolute;left:var(--x);top:59%;width:13px;height:21px;border-radius:55% 45% 58% 42%;background:#7fe8ff;border:2px solid #dcfbff;box-shadow:0 0 8px #52ddff,0 0 16px rgba(56,218,255,.8);opacity:0;transform:translate(-50%,-50%) rotate(var(--r));animation:stepGlow .28s ease forwards;animation-delay:calc(var(--i)*.095s + .14s);z-index:6}.dwarf-step:before{content:"";position:absolute;width:4px;height:4px;border-radius:50%;left:1px;top:-7px;background:#c8f8ff;box-shadow:5px -2px 0 #c8f8ff,9px 1px 0 #c8f8ff}
@keyframes stepGlow{from{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(var(--r))}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--r))}}
.dwarf-reference{position:relative;z-index:4;display:flex;align-items:center;gap:9px;align-self:flex-start;margin-left:2%;padding:8px 12px;border:3px solid #d29b45;border-radius:14px;background:linear-gradient(#6b421f,#462914);box-shadow:0 5px 0 #281508;color:#fff2c6;font-size:13px;font-weight:900}.reference-foot{display:inline-block;width:13px;height:21px;border-radius:55% 45% 58% 42%;background:#7fe8ff;border:2px solid #dcfbff;box-shadow:0 0 8px #52ddff;transform:rotate(-12deg)}
.dwarf-result{position:relative;z-index:7;min-height:34px;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;border-radius:13px;background:rgba(9,21,35,.86);border:2px solid #82e4ff;color:#fff;font-size:13px;font-weight:900}.dwarf-result strong{color:#8ef0ff;font-size:17px}
.dwarf-choices{display:grid;grid-template-columns:repeat(3,minmax(74px,1fr));gap:10px;width:min(360px,100%);margin:0 auto}.dwarf-choice{min-height:66px;border:4px solid rgba(255,255,255,.9);border-radius:50% 50% 44% 44%;color:#fff;font-size:27px;font-weight:1000;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 4px 5px rgba(255,255,255,.28),0 7px 0 var(--edge),0 11px 18px rgba(0,0,0,.28);background:linear-gradient(180deg,var(--top),var(--bottom));transition:transform .1s,filter .1s}.dwarf-choice:nth-child(1){--top:#55c9ff;--bottom:#1784d1;--edge:#0c5797}.dwarf-choice:nth-child(2){--top:#ff7b73;--bottom:#df3e46;--edge:#9c222b}.dwarf-choice:nth-child(3){--top:#91df5d;--bottom:#43aa45;--edge:#26742c}.dwarf-choice:active{transform:translateY(5px) scale(.98);box-shadow:inset 0 3px 5px rgba(255,255,255,.2),0 2px 0 var(--edge),0 5px 10px rgba(0,0,0,.25)}.dwarf-choice:focus-visible{outline:4px solid #ffe274;outline-offset:3px}.dwarf-choice[disabled]{filter:saturate(.55);opacity:.72}.dwarf-choice.selected{filter:brightness(1.18);outline:4px solid #fff4a8;outline-offset:2px}
/* İlk on oyun: aynı kabuk içinde on ayrı sahne kimliği. */
.scene-chip{position:absolute;left:14px;top:12px;z-index:8;padding:7px 12px;border-radius:999px;background:rgba(19,42,64,.88);color:#fff;font-size:12px;font-weight:1000;letter-spacing:.04em;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.scene-note{position:absolute;right:14px;top:12px;z-index:8;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.9);color:#29425a;font-size:12px;font-weight:900;box-shadow:0 4px 12px rgba(20,49,72,.15)}

/* m01 · Trafik Polisi */
.game-m01{background:linear-gradient(#8ed8ff 0 58%,#78b96f 58%)}.game-m01 .visual{padding:0;border-color:#d8f5ff;background:#98dcff}.traffic-world{width:100%;height:100%;min-height:285px;position:relative;overflow:hidden;background:linear-gradient(#87d7ff 0 50%,#79b96d 50%)}.traffic-world:before{content:"";position:absolute;left:0;right:0;bottom:0;height:54%;background:linear-gradient(90deg,transparent 0 34%,#515d67 34% 66%,transparent 66%),linear-gradient(#515d67 0 38%,transparent 38% 62%,#515d67 62%);border-top:7px solid #eef0dc}.traffic-world:after{content:"";position:absolute;left:48%;top:46%;width:4%;height:54%;background:repeating-linear-gradient(#ffe97a 0 13px,transparent 13px 26px);opacity:.92}.city-row{position:absolute;left:0;right:0;top:16%;display:flex;justify-content:space-around;align-items:flex-end}.city-building{width:13%;height:82px;border:5px solid #35526a;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,#ffdf83 0 13px,#5b7d94 13px 20px);box-shadow:0 8px 0 rgba(28,60,80,.2)}.city-building:nth-child(2){height:112px;background:repeating-linear-gradient(90deg,#a9e1ce 0 14px,#4e7489 14px 21px)}.city-building:nth-child(3){height:70px;background:repeating-linear-gradient(90deg,#f2a7a0 0 14px,#5a7588 14px 21px)}.traffic-officer{position:absolute;left:50%;top:51%;z-index:5;transform:translate(-50%,-50%);font-size:64px;filter:drop-shadow(0 6px 2px rgba(0,0,0,.25));animation:officerWave 1.2s ease-in-out infinite}.traffic-light{position:absolute;right:8%;top:43%;z-index:5;width:35px;padding:6px;border-radius:10px;background:#293643;border:4px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.25)}.traffic-light i{display:block;width:16px;height:16px;margin:3px auto;border-radius:50%;background:#52606b}.traffic-light .red{background:#ff5e5e;box-shadow:0 0 13px #ff5e5e}.traffic-light .amber{background:#ffd24d}.traffic-light .green{background:#4fd47a}.crosswalk{position:absolute;z-index:3;left:29%;right:29%;top:56%;height:34px;background:repeating-linear-gradient(90deg,#f8f7e8 0 18px,transparent 18px 34px)}@keyframes officerWave{50%{transform:translate(-50%,-54%) rotate(-4deg)}}

/* m02 · Pusula Korsanı */
.game-m02{background:linear-gradient(#7ddcf1 0 54%,#1d8eb6 54%)}.game-m02 .visual{background:radial-gradient(circle at 50% 44%,#f9df94 0 42%,#d8a859 43% 48%,#269cba 49%);border-color:#fff0b4}.pirate-map{width:min(760px,96%);height:100%;min-height:315px;position:relative;display:flex;align-items:center;justify-content:center}.pirate-map .grid-map{width:min(360px,70vh);z-index:3;transform:rotate(-1.4deg);background:#b37a3d;border:10px solid #6b4123;box-shadow:0 12px 0 rgba(69,45,25,.25)}.pirate-map .grid-cell{background:#f3d88d;border:2px solid rgba(126,80,36,.18)}.pirate-map .grid-cell:nth-child(3n){background:#edd082}.pirate-map .grid-cell.start:after{font-size:25px}.pirate-map .grid-cell.corrected{background:#f7b93d;box-shadow:inset 0 0 0 4px #fff1aa}.pirate-parrot{position:absolute;left:7%;top:13%;font-size:72px;z-index:4;animation:parrotBob 1.4s ease-in-out infinite;filter:drop-shadow(0 5px 2px rgba(0,0,0,.2))}.pirate-ship{position:absolute;right:5%;bottom:8%;font-size:68px;z-index:4;animation:shipFloat 2.2s ease-in-out infinite}.compass-rose{position:absolute;right:7%;top:10%;width:76px;height:76px;border:4px solid #7d542c;border-radius:50%;background:#fff4c9;display:grid;place-items:center;color:#b8463c;font-size:44px;font-weight:1000;box-shadow:0 6px 0 rgba(93,56,25,.2)}.compass-rose:after{content:"K";position:absolute;top:-19px;color:#fff;font-size:13px;text-shadow:0 2px #46697c}@keyframes parrotBob{50%{transform:translateY(-9px) rotate(-4deg)}}@keyframes shipFloat{50%{transform:translateY(-8px) rotate(3deg)}}

/* m03 · Dağcı Keçi */
.game-m03{background:linear-gradient(#9ee0ff 0 45%,#628d76 45%)}.game-m03 .visual{padding:0;background:#afe5ff;border-color:#edfaff}.game-m03 .path{height:100%;min-height:330px;border-radius:0;background:linear-gradient(#9ee0ff 0 48%,#7ba086 48%)}.mountain-back,.mountain-front{position:absolute;left:-5%;bottom:0;width:110%;height:72%;clip-path:polygon(0 100%,15% 45%,27% 70%,43% 16%,57% 61%,71% 31%,84% 67%,100% 42%,100% 100%)}.mountain-back{background:#7b9ca6;opacity:.68}.mountain-front{height:58%;background:#4e7868;clip-path:polygon(0 100%,18% 52%,34% 73%,53% 22%,70% 72%,86% 48%,100% 79%,100% 100%)}.game-m03 .stone{z-index:3;width:64px;height:31px;background:linear-gradient(#fff,#cbd6d0);border-color:#6e8379;box-shadow:0 7px 0 rgba(43,77,61,.22)}.game-m03 .goat{font-size:58px;filter:drop-shadow(0 6px 2px rgba(0,0,0,.2))}.game-m03 .flag{z-index:4;font-size:64px;filter:drop-shadow(0 5px 2px rgba(0,0,0,.2))}.mountain-cloud{position:absolute;top:12%;width:100px;height:28px;border-radius:30px;background:rgba(255,255,255,.82);box-shadow:30px 8px 0 rgba(255,255,255,.82);animation:cloudDrift 6s ease-in-out infinite}@keyframes cloudDrift{50%{transform:translateX(36px)}}

/* m04 · Gölge Avcıları */
.game-m04{background:linear-gradient(#9de3ff 0 42%,#8fc66c 42%)}.game-m04 .visual{background:linear-gradient(#b7ecff 0 48%,#8dca71 48%);border-color:#e8ffd5}.orchard{width:100%;height:100%;min-height:310px;position:relative;overflow:hidden}.orchard-ground{position:absolute;inset:48% 0 0;background:repeating-linear-gradient(8deg,#8bc56d 0 18px,#7db85f 18px 36px)}.orchard-tree{position:absolute;left:7%;bottom:17%;width:120px;height:150px;background:#81512e;border-radius:28px}.orchard-tree:before,.orchard-tree:after{content:"";position:absolute;border-radius:50%;background:#4c9f56}.orchard-tree:before{width:190px;height:125px;left:-55px;top:-70px}.orchard-tree:after{width:130px;height:110px;left:30px;top:-48px}.shadow-card{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:230px;height:230px;border-radius:30px;background:rgba(255,255,255,.92);border:6px dashed #f1c453;display:grid;place-items:center;box-shadow:0 12px 0 rgba(57,104,53,.2)}.apple-shape{--apple:#e65361;--apple-size:82px;width:var(--apple-size);height:calc(var(--apple-size)*.86);border-radius:52% 48% 55% 45%;background:var(--apple);position:relative;display:block;filter:drop-shadow(0 6px 0 rgba(76,43,31,.18))}.apple-shape:before{content:"";position:absolute;width:8%;height:30%;left:51%;top:-20%;border-radius:5px;background:#774a2c}.apple-shape:after{content:"";position:absolute;width:30%;height:18%;left:57%;top:-15%;border-radius:100% 0 100% 0;background:#59a84f;transform:rotate(15deg)}.apple-shape.small{--apple-size:58px}.apple-shape.large{--apple-size:105px}.apple-shape.tall{height:calc(var(--apple-size)*1.03);border-radius:45% 55% 55% 45%}.apple-shape.shadow{--apple:#1e2935;filter:none}.game-m04 .piece{min-width:100px}.game-m04 .target{min-height:106px;background:rgba(255,255,255,.86);border-color:#f1c453}

/* m05 · Çorap Eşleştirmece */
.game-m05{background:linear-gradient(#ffd4a8 0 48%,#b6714d 48%)}.game-m05 .visual{background:linear-gradient(#fff1cf 0 71%,#d68b58 71%);border-color:#fff7df}.laundry-room{width:100%;height:100%;min-height:300px;position:relative;overflow:hidden}.laundry-window{position:absolute;right:8%;top:12%;width:160px;height:112px;border:10px solid #fff;background:linear-gradient(#86d7ff 0 63%,#7fbd6d 63%);box-shadow:0 8px 0 rgba(117,71,44,.18)}.laundry-line{position:absolute;left:8%;right:8%;top:28%;height:5px;background:#76513a;transform:rotate(-1deg)}.laundry-line:before,.laundry-line:after{content:"";position:absolute;width:12px;height:38px;top:-5px;border-radius:4px;background:#e2b34d}.laundry-line:before{left:28%}.laundry-line:after{right:28%}.sample-laundry{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:20px;padding:18px 24px;border:4px solid #fff;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 9px 0 rgba(119,71,45,.2)}.sample-laundry .sock{animation:sockSwing 1.8s ease-in-out infinite;transform-origin:top center}.laundry-basket{font-size:72px;filter:drop-shadow(0 5px 2px rgba(0,0,0,.16))}@keyframes sockSwing{50%{transform:rotate(4deg)}}.game-m05 .target{background:linear-gradient(#fff8e8,#f3dfc2);border-color:#8b633e}.game-m05 .piece{background:#fffaf0}

/* m06 · Anahtar ve Kilit */
.game-m06{background:radial-gradient(circle at 50% 12%,#63799b,#263852 62%,#17243a)}.game-m06 .visual{background:linear-gradient(135deg,#263c59,#101d31);border-color:#8fc9e9}.vault-stage{width:100%;height:100%;min-height:320px;position:relative;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 18px,transparent 18px 36px)}.vault-door{width:240px;height:240px;border-radius:50%;border:15px solid #7890a6;background:radial-gradient(circle,#43566a 0 47%,#273a50 48% 66%,#91a8ba 67% 72%,#28394c 73%);box-shadow:0 15px 0 #142135,0 0 35px rgba(111,214,255,.25);display:grid;place-items:center;animation:vaultPulse 2.4s ease-in-out infinite}.vault-keyway{width:36px;height:84px;background:#0f1927;border:7px solid #d6b85b;border-radius:20px 20px 8px 8px;transform:rotate(var(--key-angle));position:relative}.vault-keyway:after{content:"";position:absolute;left:-29px;top:30px;width:82px;height:7px;background:#d6b85b;border-radius:7px}.vault-bolts{position:absolute;inset:26px;border:6px dashed rgba(210,231,244,.45);border-radius:50%;animation:boltSpin 18s linear infinite}.key-shape{width:118px;height:52px;position:relative;display:inline-block;transform:rotate(var(--key-angle));filter:drop-shadow(0 5px 0 rgba(61,43,15,.2))}.key-shape:before{content:"";position:absolute;left:3px;top:7px;width:34px;height:34px;border:12px solid var(--key-color,#e4b84d);border-radius:50%}.key-shape:after{content:"";position:absolute;left:44px;top:21px;width:70px;height:14px;background:var(--key-color,#e4b84d);clip-path:polygon(0 0,100% 0,100% 100%,82% 100%,82% 65%,67% 65%,67% 100%,0 100%)}.game-m06 .choices button{min-width:150px;min-height:92px;background:linear-gradient(#f5fbff,#cfe1ee);border-color:#8fc9e9}@keyframes boltSpin{to{transform:rotate(360deg)}}@keyframes vaultPulse{50%{box-shadow:0 15px 0 #142135,0 0 52px rgba(111,214,255,.48)}}

/* m07 · Dedektif Büyüteci */
.game-m07{background:linear-gradient(#50463a 0 52%,#2f2a26 52%)}.game-m07 .visual{background:linear-gradient(112deg,#755e45,#392f29);border-color:#d4bb86}.detective-desk{width:100%;height:100%;min-height:315px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 34px)}.evidence-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);width:min(430px,75%);height:235px;border-radius:14px;background:#f1e5c9;box-shadow:0 15px 0 rgba(33,24,18,.22);display:grid;place-items:center}.mud-print{width:150px;height:196px;border-radius:48% 48% 44% 44%;background:#322c2a;border:8px solid #76614d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;transform:rotate(-3deg)}.mud-print i,.sole-card i{display:block;width:72%;height:9px;border-radius:8px;background:#e7d6a9}.magnifier-prop{position:absolute;right:11%;top:21%;font-size:84px;transform:rotate(-18deg);filter:drop-shadow(0 7px 1px rgba(0,0,0,.25));animation:magnifyScan 2.4s ease-in-out infinite}.evidence-tag{position:absolute;left:5%;bottom:7%;padding:8px 13px;background:#d8b85e;color:#3c2b1f;font-size:13px;font-weight:1000;transform:rotate(2deg)}.sole-card{width:112px;height:135px;border-radius:50% 50% 42% 42%;background:#ece3c9;border:6px solid #3e3641;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.sole-card i{background:#594b42}.game-m07 .choices button{min-width:145px;background:#faf4df;border-color:#d8bd78}@keyframes magnifyScan{50%{transform:translate(-55px,35px) rotate(-10deg)}}

/* m08 · Meyve Suyu Şişeleri */

function money(n){const colors={5:'#d7a870',10:'#df7d7d',20:'#78bd8f',50:'#dc9b52',100:'#6b9fc9',200:'#aa82c5'};return `<div class="banknote" style="--note:${colors[n]||'#d9b36c'}">${n} TL</div>`}
function gearSvg(teeth,color='#efb84e',hole=true){const pts=[];for(let i=0;i<teeth*4;i++){const a=-Math.PI/2+i*Math.PI/(teeth*2),r=i%4<2?34:27;pts.push(`${40+Math.cos(a)*r},${40+Math.sin(a)*r}`)}return `<svg class="gear-svg" viewBox="0 0 80 80" aria-label="${teeth} dişli çark"><polygon points="${pts.join(' ')}" fill="${color}" stroke="#6e5528" stroke-width="3"/>${hole?'<circle cx="40" cy="40" r="10" fill="#fff" stroke="#6e5528" stroke-width="3"/>':''}</svg>`}

function dwarfDoorSvg(){return `<svg viewBox="0 0 60 106" aria-hidden="true"><path d="M3 104V34C3 15 14 3 30 3s27 12 27 31v70" fill="#657487" stroke="#273443" stroke-width="6"/><path d="M11 102V36c0-14 7-24 19-24s19 10 19 24v66z" fill="#8b502d" stroke="#3d2418" stroke-width="4"/><path d="M15 29h30M15 51h30M15 73h30" stroke="#c27a43" stroke-width="3"/><path d="M30 15v86" stroke="#59311f" stroke-width="3"/><circle cx="40" cy="61" r="3" fill="#ffe272"/></svg>`}
function dwarfRoomArt(r,s){const shown=!!s.revealed,count=r.actual,width=92+count*20,steps=shown?Array.from({length:count},(_,i)=>{const x=12+(i+.5)*(73/count),rot=i%2?-13:13;return `<i class="dwarf-step" style="--i:${i};--x:${x.toFixed(2)}%;--r:${rot}deg"></i>`}).join(''):'';const result=shown?`<div class="dwarf-result" aria-live="polite">Tahminin <strong>${esc(s.estimate)}</strong><span>•</span>Gerçek <strong>${count}</strong> adım</div>`:`<div class="dwarf-result">Tek adımı referans al, aradaki mesafeyi tahmin et</div>`;return `<div class="dwarf-room"><div class="dwarf-room-title">CÜCE GEÇİDİ · ${esc(r.roomName)}</div><div class="dwarf-stage" style="--room-width:${width}px"><span class="dwarf-line start"><b>Başlangıç</b></span><span class="dwarf-line end"><b>Bitiş</b></span>${steps}<span class="dwarf-actor ${shown?'walk':''}">${dwarfSvg()}</span><span class="dwarf-door">${dwarfDoorSvg()}</span></div><div class="dwarf-reference"><span class="reference-foot" aria-hidden="true"></span><span>1 cüce adımı</span></div>${result}</div>`}
function round(){return game.rounds[roundIndex]}
function hud(){const r=round();return `<div class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(r.prompt)}</div><div class="right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></div>`}
function render(){clearTimer();const r=round();state=state&&state.keep?state:{};document.getElementById('app').innerHTML=hud()+`<main class="scene game-${GAME_ID} ${r.floorGame?'floor-game':''} ${r.stack?'stack-game':''} ${r.kind==='balanceLoad'?'balance-game':''} ${r.dwarf?'dwarf-game':''}" data-theme="${r.theme||game.theme||'room'}"><div class="feedback" id="feedback"></div><section class="visual ${r.dark?'dark':''} ${r.dwarf?'dwarf-visual':''}" id="visual"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderTask(r);bindDrag();requestAnimationFrame(()=>speak(r.prompt))}
function clearTimer(){if(timer){clearInterval(timer);clearTimeout(timer);timer=null}}
function feedback(text,bad=false){const f=$('#feedback');if(!f)return;f.textContent=text;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
function wrong(message='Tekrar dene'){if(locked)return;lives--;feedback('Tekrar dene',true);speak('Tekrar dene');const sc=$('.scene');if(sc){sc.classList.remove('wrong-shake');void sc.offsetWidth;sc.classList.add('wrong-shake')}if(lives<=0){locked=true;setTimeout(()=>{speak('Canların bitti');showOverlay('Canların bitti','Bu oyunu yeniden başlatabilirsin.','Oyunu yeniden başlat',restart)},850)}else if(message&&message!=='Tekrar dene')setTimeout(()=>speak(message),650)}
function success(story){if(locked)return;locked=true;score+=300;const r=round(),v=$('#visual');if(v){v.classList.add('success-flash','story-go')}if(r.successSelector)$$(r.successSelector).forEach(x=>x.classList.add(r.successClass||'depart'));feedback(story||'Doğru!');speak(story||'Doğru!');setTimeout(()=>{if(roundIndex<2){roundIndex++;locked=false;state={};render()}else completeParent(game.finish||'Üç turu da tamamladın!')},1050)}
function restart(){clearTimer();roundIndex=0;lives=3;score=0;locked=false;state={};render()}
function showOverlay(title,text,button,onClick){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="overlay-card"><div class="big-icon">${title.includes('bitti')?'💛':'🏆'}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="action">${esc(button)}</button></div>`;document.getElementById('app').appendChild(o);o.querySelector('button').onclick=onClick}

function renderTask(r){const v=$('#visual'),t=$('#task');if(r.art)v.innerHTML=typeof r.art==='function'?r.art(state):r.art;const fn=RENDERERS[r.kind||'choose'];if(!fn){v.innerHTML='<b>Oyun sahnesi bulunamadı.</b>';return}fn(r,v,t);bindDrag()}
function bindChoice(r,handler){$$('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.choice;handler(r.choices[i],i,b)})}
function bindDrag(){$$('.piece[data-piece]').forEach(el=>{el.onpointerdown=e=>{if(locked||el.classList.contains('done'))return;e.preventDefault();const rect=el.getBoundingClientRect(),ph=document.createElement('span');ph.style.cssText=`display:block;width:${rect.width}px;height:${rect.height}px;flex:0 0 ${rect.width}px`;el.parentNode.insertBefore(ph,el.nextSibling);drag={el,id:el.dataset.piece,home:el.parentNode,next:el.nextSibling,placeholder:ph,dx:e.clientX-rect.left,dy:e.clientY-rect.top,startX:e.clientX,startY:e.clientY};/* Sürüklenen öğe pointer-events:none olur; hareket/bırakmayı öğede dinlersek mobil tarayıcı son olayı hedefe yollar. Pencere dinleyicileri akışı parmak kalkana kadar korur. */window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);try{el.setPointerCapture(e.pointerId)}catch(x){};el.classList.add('dragging');moveDrag(e)}})}
function targetAt(x,y){const candidates=$$('.target').map(t=>({t,r:t.getBoundingClientRect()}));const exact=candidates.find(({r})=>x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom);if(exact)return exact.t;return candidates.filter(({r})=>x>=r.left-18&&x<=r.right+18&&y>=r.top-18&&y<=r.bottom+18).sort((a,b)=>Math.hypot(x-(a.r.left+a.r.width/2),y-(a.r.top+a.r.height/2))-Math.hypot(x-(b.r.left+b.r.width/2),y-(b.r.top+b.r.height/2)))[0]?.t||null}
function moveDrag(e){if(!drag)return;drag.el.style.left=(e.clientX-drag.dx)+'px';drag.el.style.top=(e.clientY-drag.dy)+'px';$$('.target').forEach(x=>x.classList.remove('hot'));const target=targetAt(e.clientX,e.clientY);if(target)target.classList.add('hot')}
function endDrag(e){if(!drag)return;window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointerup',endDrag);window.removeEventListener('pointercancel',endDrag);const d=drag,target=targetAt(e.clientX,e.clientY);const moved=Math.hypot(e.clientX-d.startX,e.clientY-d.startY);d.el.classList.remove('dragging');d.el.style.left='';d.el.style.top='';$$('.target').forEach(x=>x.classList.remove('hot'));if(d.next&&d.next.parentNode===d.home)d.home.insertBefore(d.el,d.next);else d.home.appendChild(d.el);if(d.placeholder&&d.placeholder.parentNode)d.placeholder.remove();drag=null;if(e.type==='pointercancel')return;if(!target&&round().rotate&&moved<12){const a=(+(d.el.dataset.angle||0)+90)%360;d.el.dataset.angle=a;d.el.style.transform=`rotate(${a}deg)`;speak('Parça döndü');return}handleDrop(d.id,target?target.dataset.target:null,d.el,target)}
function handleDrop(pieceId,targetId,el,target){const r=round();if(!targetId){return}if(GAME_ID==='m33'&&pieceId.startsWith('candidate-')){const candidate=pieceId.slice(10),correct=r.pieces[0].target;if(targetId!=='patternSlot'||candidate!==correct){wrong(r.hint);return}const choice=r.targets.find(x=>x.id===candidate),slot=target&&target.querySelector('.placed');if(slot&&choice)slot.innerHTML=choice.html;success(r.story);return}if(r.kind==='countDrag'||r.kind==='sceneCountDrag'){countDragOne(r,pieceId,targetId);return}if(r.kind==='load'||r.kind==='sceneLoad'||r.kind==='balanceLoad'||r.kind==='massExperiment'){if(targetId==='loadTarget')loadOne(r);else wrong(r.hint);return}if(r.kind==='remove'){if(targetId==='returnCart')removeOne(r,pieceId,el);else wrong(r.hint);return}if(r.kind==='catch'){catchFish(r,targetId);return}const p=(r.pieces||[]).find(x=>x.id===pieceId);if(!p||!p.target||p.target!==targetId){wrong(r.hint);return}if(!state.placed)state.placed={};if(state.placed[pieceId])return;state.placed[pieceId]=targetId;el.classList.add('done');const slot=target&&target.querySelector('.placed');if(slot)slot.insertAdjacentHTML('beforeend',`<span>${p.doneHtml||p.html}</span>`);const gereken=(r.pieces||[]).filter(x=>x.target).length;if(Object.keys(state.placed).length===gereken)success(r.story)}

// M17: the five windows are the actual delivery targets, ordered bottom to top.
const originalSceneDrag=RENDERERS.sceneDrag;
RENDERERS.sceneDrag=(r,v,t)=>{
 if(GAME_ID!=='m17')return originalSceneDrag(r,v,t);
 v.innerHTML=`<div class="delivery-world"><h2>Uzaylı Apartmanı</h2><div class="delivery-tower">${r.targets.slice().sort((a,b)=>Number(b.id.slice(1))-Number(a.id.slice(1))).map(x=>`<div class="target" tabindex="0" role="button" aria-label="${x.id.slice(1)}. kat penceresi" data-target="${x.id}"><b>${x.id.slice(1)}. kat</b><span class="resident">${x.html.split('·')[1]||'👽'}</span><span class="placed"></span></div>`).join('')}</div></div>`;
 t.innerHTML=`<div class="delivery-source">${r.pieces.map(p=>`<div class="piece" tabindex="0" role="button" aria-label="Teslimat paketi" data-piece="${p.id}">${p.html}</div>`).join('')}<span>Paketi pencereye götür.</span></div>`;
 const source=t.querySelector('[data-piece]');let selected=false;
 const select=()=>{if(!locked){selected=true;source.setAttribute('aria-pressed','true')}};
 source.onclick=select;source.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}};
 v.querySelectorAll('[data-target]').forEach(target=>{const place=()=>{if(selected&&!locked){selected=false;source.setAttribute('aria-pressed','false');handleDrop(source.dataset.piece,target.dataset.target,source,target)}};target.onclick=place;target.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place()}}});
};
// M38: observe apples entering/leaving the cart; the scene no longer reveals +/−.
const originalChoose=RENDERERS.choose;
RENDERERS.choose=(r,v,t)=>{
 if(GAME_ID!=='m38')return originalChoose(r,v,t);
 const [start,change,adding]=[[5,3,true],[9,2,false],[4,5,true]][roundIndex];
 const apples=n=>Array.from({length:n},()=>'<i aria-hidden="true">🍎</i>').join('');
 v.innerHTML='<div class="apple-experiment"><h2>Market Arabası Dedektifi</h2><div class="apple-counter" aria-live="polite"></div><div class="apple-cart"><div class="apple-grid"></div></div><div class="apple-transfer"><div class="apple-grid"></div></div><button type="button">Elmaların hareketini izle</button></div>';
 t.innerHTML=chooseButtons(r.choices);t.querySelectorAll('button').forEach(b=>b.disabled=true);
 const cart=v.querySelector('.apple-cart .apple-grid'),tray=v.querySelector('.apple-transfer .apple-grid'),caption=v.querySelector('.apple-counter'),play=v.querySelector('button');
 const reset=()=>{cart.innerHTML=apples(start);tray.innerHTML=apples(adding?change:0);caption.textContent=`Arabada ${start} elma var.`};reset();
 play.onclick=async()=>{if(locked||play.disabled)return;play.disabled=true;t.querySelectorAll('button').forEach(b=>b.disabled=true);reset();
  for(let i=0;i<change;i++){
   await new Promise(resolve=>setTimeout(resolve,700));if(!v.isConnected)return;
   const apple=(adding?tray:cart).lastElementChild;if(apple){apple.classList.add('apple-moving');(adding?cart:tray).appendChild(apple)}
   caption.textContent=adding?`${i+1} elma arabaya geldi.`:`${i+1} elma arabadan çıktı.`;
  }
  caption.textContent=`Şimdi arabada ${start+(adding?change:-change)} elma var. Hangi işlem oldu?`;
  play.disabled=false;play.textContent='Yeniden izle';t.querySelectorAll('button').forEach(b=>b.disabled=false);
 };
bindChoice(r,c=>c.correct?success(r.story):wrong(r.hint));
};

 if(GAME_ID!=='m18')return beforeIceSceneDrag(r,v,t);
 const slots=r.targets.slice().sort((a,b)=>Number(b.id.slice(1))-Number(a.id.slice(1)));
 v.innerHTML=`<div class="ice-build-shop"><header><span>🍦 DONDURMA DÜKKÂNI</span><small>Sipariş ${roundIndex+1} / 3</small></header><p class="ice-order">${esc(r.prompt.replace(/^Aşağıdan yukarı /i,''))}</p><div class="ice-assembly"><div class="ice-scoop-slots">${slots.map(x=>`<div class="target ice-scoop-slot" data-target="${x.id}" tabindex="0" role="button" aria-label="Külahın ${x.id.slice(1)}. top yeri"><span class="ice-position">${x.id.slice(1)}</span><div class="placed"></div></div>`).join('')}</div><div class="ice-cone" aria-hidden="true"></div></div><span class="ice-customer" aria-hidden="true">🧑‍🍳</span></div>`;
 t.innerHTML=`<div class="pieces ice-source-tray">${r.pieces.map(p=>`<div class="piece" data-piece="${p.id}" tabindex="0" role="button" aria-label="${p.html} dondurma topu">${p.html}</div>`).join('')}</div><div class="scene-label">İlk topu külahın hemen üstüne koy.</div>`;
 let selected=null;
 t.querySelectorAll('[data-piece]').forEach(source=>{const choose=()=>{if(locked||source.classList.contains('done'))return;selected=source;t.querySelectorAll('[data-piece]').forEach(p=>p.setAttribute('aria-pressed',String(p===source)))};source.onclick=choose;source.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});
 v.querySelectorAll('[data-target]').forEach(target=>{const place=()=>{if(!selected||locked)return;const source=selected;selected=null;source.setAttribute('aria-pressed','false');handleDrop(source.dataset.piece,target.dataset.target,source,target)};target.onclick=place;target.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place()}}});
};
const beforeIceHandleDrop=handleDrop;
handleDrop=(pieceId,targetId,el,target)=>{
 if(GAME_ID==='m18'&&targetId){const expected='p'+(Object.keys(state.placed||{}).length+1);if(targetId!==expected){wrong('Külaha en yakın boş yere yerleştir.');return}}
 return beforeIceHandleDrop(pieceId,targetId,el,target);
};
// M36: the stationery item has its own length; clips fill an aligned measuring rail.
const beforeMeasureSceneLoad=RENDERERS.sceneLoad;
RENDERERS.sceneLoad=(r,v,t)=>{
 if(GAME_ID!=='m36')return beforeMeasureSceneLoad(r,v,t);
 if(state.loaded==null)state.loaded=r.start||0;
 const kind=['pencil','eraser','notebook'][roundIndex],label=['Kalem','Silgi','Defter kenarı'][roundIndex];
 v.innerHTML=`<div class="measurement-workbench"><header><span>📎 KIRTASİYE ÖLÇÜM MASASI</span><small>${roundIndex+1}. nesne / 3</small></header><div class="measurement-surface"><strong>${label}</strong><div class="measure-bench" style="--units:${r.targetCount}"><div class="measured-object ${kind}" role="img" aria-label="Ölçülen ${label.toLocaleLowerCase('tr')}"></div><div class="measure-axis"><span>Başlangıç</span><span>Bitiş</span></div><div class="clip-ruler target" data-target="loadTarget" style="--units:${r.targetCount}" tabindex="0" role="button" aria-label="Ataşı ölçüm çizgisine yerleştir">${Array.from({length:r.targetCount},(_,i)=>`<i class="${i<state.loaded?'filled':''}" aria-hidden="true">📎</i>`).join('')}</div></div><div class="measure-count" aria-live="polite">${state.loaded} / ${r.targetCount} ataş</div></div></div>`;
 t.innerHTML=`<div class="scene-load-tray"><div class="piece" data-piece="supply" tabindex="0" role="button" aria-label="Bir ataş">📎</div><div><strong>${state.loaded} / ${r.targetCount}</strong><span>Ataşı nesnenin altındaki çizgiye sürükle</span></div></div>`;
 const source=t.querySelector('[data-piece]'),target=v.querySelector('[data-target]');let selected=false;
 const choose=()=>{if(!locked){selected=true;source.setAttribute('aria-pressed','true')}};
 source.onclick=choose;source.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};
 const place=()=>{if(!selected||locked)return;selected=false;source.setAttribute('aria-pressed','false');handleDrop('supply','loadTarget',source,target)};
 target.onclick=place;target.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place()}};
};
game=GAMES[GAME_ID];
if(!game){document.getElementById('app').innerHTML='<div class="overlay"><div class="overlay-card"><h2>Oyun bulunamadı</h2><p>'+esc(GAME_ID)+'</p></div></div>'}
else if(game.rounds.length!==GAME_COUNT){document.getElementById('app').innerHTML='<div class="overlay"><div class="overlay-card"><h2>Tur verisi eksik</h2><p>'+esc(game.title)+'</p></div></div>'}
else render();
</script>
</body>
</html>
