<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>4. Sınıf Fen Bilimleri — Gerçek Deney Sahneleri</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="scene-workshop.css?v=20260921">
<script src="scene-workshop.js?v=20260921"></script>
<link rel="stylesheet" href="scene-discovery.css?v=20260921">
<script src="scene-discovery.js?v=20260921"></script>
<style>
:root{--ink:#1a2d3d;--muted:#4d6a80;--panel:rgba(255,255,255,.95);--ok:#12805a;--bad:#c8443b;--gold:#d99b20;--blue:#2a75ad;--line:#aec7d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#dcecf7;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;isolation:isolate}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:7px 9px;background:rgba(255,255,255,.97);box-shadow:0 3px 15px rgba(22,54,79,.16);z-index:30}
.round{font-size:clamp(13px,3.2vw,17px);font-weight:950;white-space:nowrap}
.prompt{font-size:clamp(11px,2.7vw,14px);line-height:1.18;font-weight:850;text-align:center;overflow-wrap:break-word}
.hud-right{display:flex;align-items:center;gap:5px}
.lives{font-size:15px;letter-spacing:-3px;white-space:nowrap}
.sound{width:46px;height:44px;border:0;border-radius:13px;background:#e2f2ff;box-shadow:0 2px 0 #a9cbe1;font-size:20px}
.scene{position:relative;min-height:0;overflow:auto;padding:9px 9px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;background:linear-gradient(#d7ebfa 0 58%,#a7c7de 58%)}
.scene[data-theme="lab"]{background:linear-gradient(#e6f4f2 0 64%,#6fa89a 64%)}
.scene[data-theme="masa"]{background:linear-gradient(#fdf3e4 0 68%,#bd8c58 68%)}
.scene[data-theme="mutfak"]{background:linear-gradient(#fdf0ef 0 66%,#c4796f 66%)}
.scene[data-theme="dunya"]{background:linear-gradient(#0d1c3a 0 62%,#2c4f7a 62%)}
.scene[data-theme="atolye"]{background:linear-gradient(#e9eef3 0 66%,#78899b 66%)}
.scene[data-theme="sehir"]{background:linear-gradient(#dbeefb 0 58%,#8fae86 58%)}
.scene[data-theme="gece"]{background:linear-gradient(#121d38 0 66%,#26364f 66%)}
.scene[data-theme="doga"]{background:linear-gradient(#d8ecfb 0 54%,#87bd6d 54%)}
.stage{position:relative;flex:1 1 auto;min-height:200px;border-radius:22px;padding:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.87);border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(18,52,78,.14)}
.task{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto}
.caption{width:100%;text-align:center;font-size:clamp(12px,3.1vw,15px);font-weight:850;line-height:1.28}
.caption.soru{font-size:clamp(13px,3.5vw,17px);font-weight:950}
.hint{width:100%;text-align:center;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;width:100%}
.sahne{width:min(330px,96%);height:auto;display:block;border-radius:14px}
.sahne-not{width:min(330px,96%);text-align:center;font-size:12px;font-weight:850;color:var(--muted);line-height:1.3}
/* ölçüt 4: karar verilecek kart HER konumda tam görünür, hiçbir kenarda kırpılmaz */
.kart{flex:0 0 auto;width:min(326px,95%);min-height:56px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 13px;font-weight:880;font-size:clamp(13px,3.5vw,16px);line-height:1.34;text-align:center;overflow-wrap:break-word;box-shadow:0 4px 0 rgba(30,72,104,.14)}
.kart.vurgu{border-color:var(--gold);background:#fffaf0}
.kutular{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
/* kutu etiketi iki satıra taşsa da kutunun içinde kalır */
.kutu{flex:1 1 45%;min-width:126px;max-width:210px;min-height:58px;border:3px solid #7ba0ba;border-radius:15px;background:#edf6fd;padding:8px 9px;font-weight:950;font-size:clamp(11px,3vw,14px);line-height:1.22;text-align:center;overflow-wrap:break-word;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kutu .sayac{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.choices{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:8px;width:100%}
.choice{min-height:52px;flex:1 1 100%;max-width:340px;border:3px solid #fff;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 rgba(30,72,104,.2);padding:9px 12px;font-weight:900;font-size:clamp(13px,3.4vw,16px);line-height:1.25;text-align:center;overflow-wrap:anywhere}
.choice.kisa{flex:1 1 44%;max-width:170px}
.choice.secili{border-color:var(--gold);background:#fff7e4}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,72,104,.2)}
.choice .alt{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:3px;line-height:1.25}
.ilerleme{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:11px;height:11px;border-radius:50%;background:#cddce7;border:2px solid #a6bece}
.ilerleme i.ok{background:var(--ok);border-color:#0a6349}
.ilerleme i.simdi{background:var(--gold);border-color:#a4750f}
.dizi{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.sirakart{flex:0 0 auto;width:min(326px,95%);min-height:50px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:8px 11px;font-weight:870;font-size:clamp(12px,3.3vw,15px);line-height:1.3;text-align:left;overflow-wrap:break-word;display:flex;align-items:center;gap:8px;touch-action:none}
.sirakart .no{flex:0 0 24px;height:24px;border-radius:50%;background:#e5edf4;color:var(--muted);font-size:12px;font-weight:950;display:flex;align-items:center;justify-content:center}
.sirakart.secili{border-color:var(--ok);background:#e8f6ef}
.sirakart.secili .no{background:var(--ok);color:#fff}
.sira-hedef{width:min(330px,96%);min-height:72px;border:3px dashed #6e9bb9;border-radius:16px;background:rgba(255,255,255,.8);padding:7px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.sira-hedef .sira-bos{text-align:center;color:var(--muted);font-size:12px;font-weight:900;line-height:1.3}
.sira-hedef .sira-adim{display:flex;align-items:flex-start;gap:6px;border:2px solid #91c8ae;border-radius:10px;background:#e8f6ef;padding:4px 7px;font-size:12px;font-weight:850;line-height:1.25;text-align:left}
.sira-hedef .sira-adim b{flex:0 0 21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:11px}
/* ölçüt 4: parça yazısı çipe tam sığar, hiçbir sözcük kesilmez */
.esle-alan{display:flex;flex-direction:column;gap:7px;width:100%;align-items:center}
.yuva{flex:0 0 auto;width:min(330px,96%);min-height:58px;border:3px dashed #6e9bb9;border-radius:15px;background:rgba(255,255,255,.74);padding:7px 9px;display:flex;align-items:center;gap:9px;text-align:left}
.yuva.dolu{border-style:solid;border-color:var(--ok);background:#e8f6ef}
.yuva .hedef{flex:1 1 auto;font-weight:880;font-size:clamp(12px,3.2vw,14px);line-height:1.3;overflow-wrap:break-word}
.yuva .kondu{flex:0 0 auto;max-width:46%;font-weight:900;font-size:12px;color:#0a6349;line-height:1.22;overflow-wrap:break-word}
.etiketler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.etiket{min-height:46px;min-width:48px;max-width:100%;flex:0 1 auto;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(30,72,104,.2);padding:7px 10px;font-weight:880;font-size:clamp(11px,3vw,13px);line-height:1.25;overflow-wrap:break-word;white-space:normal;text-align:center;touch-action:none}
.etiket.secili{border-color:var(--gold);background:#fff7e4}
.etiket.bitti{visibility:hidden}
.etiket.yok{display:none}
.ui-dragging{position:relative!important;z-index:999!important;pointer-events:none!important;opacity:.94;box-shadow:0 10px 25px rgba(0,0,0,.28)!important}
.drop-hot{filter:drop-shadow(0 0 9px #f1b53a)!important;outline:4px solid #f1b53a!important;outline-offset:3px}
[data-sinif-kart]{touch-action:none;cursor:grab}
.feedback{position:absolute;left:50%;top:46%;z-index:150;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#fff;border:4px solid var(--ok);border-radius:22px;padding:14px 19px;min-width:200px;text-align:center;font-size:clamp(17px,4.6vw,25px);font-weight:1000;box-shadow:0 12px 38px rgba(0,0,0,.27)}
.feedback.show{animation:pop .95s ease both}
.feedback.bad{border-color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%,74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes hop{50%{transform:translateY(-14px) scale(1.04)}}
.shake{animation:shake .38s}.success-motion{animation:hop .7s ease}
.overlay{position:absolute;inset:0;z-index:300;background:rgba(8,25,43,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{width:min(390px,94%);background:white;border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.overlay h2{margin:0 0 8px;font-size:27px}.overlay p{font-size:15px;font-weight:750;color:var(--muted);line-height:1.35}
.big{font-size:clamp(38px,11vw,64px)}
/* kur — seçilen öge ekranda gerçekten bir şey inşa eder (ölçüt 5) */
.kap{width:min(330px,96%);border:3px solid #8aa9c0;border-radius:16px;background:#fff;padding:9px;display:flex;flex-direction:column;gap:7px}
.kur-hedef{width:100%;display:flex;justify-content:center}
.kur-hedef>.kap{width:min(330px,96%)}
.kap .kap-ad{font-size:12px;font-weight:950;color:var(--muted);text-align:center}
.kap-icerik{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:46px}
.kap-cip{border:2px solid #9dbdd2;border-radius:11px;background:#eef7fd;padding:5px 8px;font-size:12px;font-weight:900;line-height:1.2;max-width:100%;overflow-wrap:break-word}
.kap-cip .ic{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-top:1px}
.kap-bos{font-size:12px;font-weight:800;color:#9aabb9;align-self:center}
.istek{width:min(330px,96%);border:3px solid var(--gold);border-radius:15px;background:#fffaef;padding:9px 11px;font-size:clamp(12px,3.2vw,15px);font-weight:880;line-height:1.32;text-align:left;overflow-wrap:break-word}
/* yaz — gerçek üretim; ölçütler canlı işaretlenir */
.yazi-alan{flex:0 0 auto;width:min(330px,96%);min-height:92px;border:3px solid #8db2ca;border-radius:15px;padding:9px 11px;font:inherit;font-size:15px;font-weight:800;line-height:1.4;resize:none;background:#fff}
.olcut{width:min(330px,96%);display:flex;flex-direction:column;gap:3px}
.olcut div{font-size:12px;font-weight:850;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.25}
.olcut div.tam{color:#0a6349}
.trharf{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:min(330px,96%)}
.trharf button{min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:#f3f9fd;font-size:17px;font-weight:950}
.banka{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(330px,96%)}
.banka button{min-height:44px;border:2px solid var(--line);border-radius:10px;background:#f1f7fb;padding:5px 9px;font-size:13px;font-weight:900}
/* sözdizim — kartlar küçük harfle gelir, baş harf ve noktalama öğrencinin kararı */
.dizim{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(330px,96%);min-height:52px;padding:7px;border:3px dashed #9db0c2;border-radius:13px;background:#fff}
.dizim span{font-size:15px;font-weight:900;line-height:1.3}
.sozler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.soz{min-height:46px;min-width:48px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 3px 0 rgba(30,72,104,.2);padding:6px 10px;font-size:15px;font-weight:900;touch-action:none}
.soz.bitti{visibility:hidden}
/* gözlem — ölçülen olgu ekranda canlanır */
.gozlem-dugme{min-height:50px;min-width:190px;border:3px solid #fff;border-radius:16px;background:var(--blue);color:#fff;font-weight:950;font-size:16px;box-shadow:0 4px 0 #1c5580}
.gozlem-dugme:active{transform:translateY(3px);box-shadow:0 1px 0 #1c5580}
.sayaclar{width:min(330px,96%);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sayaclar div{flex:1 1 44%;min-width:130px;border:2px solid var(--line);border-radius:11px;background:#fff;padding:6px 9px;font-size:13px;font-weight:900;display:flex;justify-content:space-between;gap:6px}
/* hafıza — uzay zemini yok, kartlar sahnenin içinde; can standardı 3 */
.kartlik{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(330px,96%)}
.hkart{min-height:60px;border:3px solid #fff;border-radius:14px;background:var(--blue);color:#fff;
 padding:7px 8px;font-weight:900;font-size:clamp(11px,2.9vw,13px);line-height:1.22;text-align:center;
 overflow-wrap:break-word;box-shadow:0 3px 0 rgba(30,72,104,.28);display:flex;align-items:center;justify-content:center}
.hkart.acik{background:#fff;color:var(--ink);border-color:var(--gold)}
.hkart.esles{background:#e8f6ef;color:#0a6349;border-color:var(--ok);box-shadow:none}
.hkart.yanlis{background:#fdeceb;color:#8d2f28;border-color:var(--bad)}
/* gözlem — ölçülen olgu ekranda gerçekten canlanır, sayaç onunla birlikte ilerler */
.gozlem-sar{width:min(330px,96%);display:flex;flex-direction:column;align-items:center;gap:7px}
/* ısıtma — kronometre yok; ocak, kap, madde ve termometre var.
   Sıcaklık-zaman çizgisi hâl değişimi boyunca DÜZ gider: kavramın kendisi. */
.isit-dugme{min-height:64px;min-width:200px;border:3px solid #fff;border-radius:18px;background:#d2603f;color:#fff;
 font-weight:950;font-size:17px;box-shadow:0 5px 0 #9c4229;user-select:none;touch-action:none}
.isit-dugme.basili{background:#9c4229;transform:translateY(3px);box-shadow:0 2px 0 #7a3320}
.isit-dugme.kapali{background:#8fa3b3;box-shadow:0 5px 0 #6b7d8b}
.gozlem-satir{width:min(330px,96%);border:3px solid var(--line);border-radius:13px;background:#fff;
 padding:7px 10px;font-size:13px;font-weight:900;line-height:1.3;text-align:center}
/* deney — öğrenci değişkenleri tek tek açıp kapatarak koşulları kendisi bulur */
.anahtarlar{width:min(330px,96%);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.anahtarlar button{flex:1 1 30%;min-width:96px;min-height:48px;border:3px solid var(--line);border-radius:13px;
 background:#fff;font-size:13px;font-weight:900;line-height:1.2;padding:6px 8px}
.anahtarlar button.on{border-color:var(--ok);background:#e8f6ef;color:#0a6349}
.olcek{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:min(330px,96%);height:48px;min-height:48px;background:transparent;margin:0}
.olcek::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:#dae7ef;border:2px solid #a6bece}
.olcek::-moz-range-track{height:14px;border-radius:8px;background:#dae7ef;border:2px solid #a6bece}
.olcek::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-14px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 2px 6px rgba(18,52,78,.35)}
.olcek::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:var(--blue);border:4px solid #fff}
/* grafik — veri satırı okunur, sayı ölçeği var, toplam sayacı yok */
.veri-tablo{width:min(330px,96%);display:flex;flex-direction:column;gap:4px}
.veri-satir{display:flex;justify-content:space-between;gap:8px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:5px 9px;font-size:12.5px;font-weight:900;line-height:1.25}
.grafik{width:min(330px,96%);display:flex;gap:8px}
.grafik .olcekcol{flex:0 0 26px;display:flex;flex-direction:column-reverse;justify-content:space-between;font-size:10px;font-weight:900;color:var(--muted);padding-bottom:26px}
.grafik .sutunlar{flex:1 1 auto;display:flex;gap:6px;align-items:flex-end}
.sutun{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.sutun .cubuk{width:100%;min-height:0;border:2px solid #8aa9c0;border-radius:7px 7px 0 0;background:#eef7fd;display:flex;flex-direction:column-reverse;overflow:hidden}
.sutun .cubuk i{display:block;height:16px;border-top:2px solid #fff;background:var(--blue)}
.sutun .ad{font-size:10.5px;font-weight:900;line-height:1.15;text-align:center;height:24px;overflow-wrap:break-word}
.sutun button{min-height:44px;width:100%;border:3px solid #fff;border-radius:11px;background:var(--panel);box-shadow:0 3px 0 rgba(30,72,104,.2);font-size:18px;font-weight:950}
.grafik-blok{min-width:150px;min-height:48px;border:3px solid #fff;border-radius:14px;background:var(--blue);color:#fff;box-shadow:0 3px 0 #1c5580;font-weight:950;touch-action:none}
/* plan — sokak ızgarası, kavşak ve işaret noktaları */
.plan{width:min(330px,96%)}
.program{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(330px,96%);min-height:48px;padding:6px;border:3px dashed #9db0c2;border-radius:13px;background:#fff}
.program span{min-width:38px;min-height:38px;border:2px solid var(--line);border-radius:9px;background:#f1f7fb;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.program span.hata{border-color:var(--bad);background:#fdeceb}
.yonler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.yonler button{min-width:56px;min-height:48px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 3px 0 rgba(30,72,104,.2);font-size:20px;font-weight:950}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Sınama modunda (?test=1) arka plan sekmesindeki setTimeout kısıntısını aş. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}
'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'f01';
addEventListener('hashchange',()=>location.reload());
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:820;
let game,roundIndex=0,lives=3,score=0,state={},locked=false;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Seslendirme ateşle-unut: ilerleme hiçbir yerde ses olayına bağlı değil. */
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(String(text||''),repeat)}catch(e){}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text||''));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',
 `<div class="overlay"><div class="overlay-card"><div class="big">🔬</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="choice" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function round(){return game.rounds[roundIndex]}

/* ===== SINIFLA: bant yok. Karar verilecek kart sabit durur ve tam görünür.
   Yanlış ipucu doğru kutunun adını SÖYLEMEZ; ölçütü soruyla hatırlatır. ===== */
function siniflaCiz(r){
 const i=state.ix||0,k=r.kartlar[i];
 if(!k)return;
 $('#stage').innerHTML=sahneHtml(r,k.sahneEk)+
  ilerleme(r.kartlar.length,i)+
  `<div class="kart vurgu" data-sinif-kart="1">${esc(k.t)}</div>`+
  (k.gozlem?`<div class="sahne-not">${esc(k.gozlem)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="kutular">${r.kutular.map((b,j)=>`<button class="kutu" data-kutu="${j}">${esc(b)}<span class="sayac">${(state.sayim||[])[j]||0}</span></button>`).join('')}</div>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 const yerlestir=j=>{
  if(state.gecis||locked)return;
  if(j!==k.dogru)return wrong(k.hint||'Kartı yeniden oku: elinde kanıt var mı?');
  state.sayim=state.sayim||r.kutular.map(()=>0);state.sayim[j]++;
  /* vurgu ancak karar verildikten SONRA çizilir: önce çizilse cevabı söylerdi */
  state.vurgu=k.vurgu||'';
  state.ix=i+1;state.not=k.neden||'';
  if(state.ix>=r.kartlar.length)return good();
  feedback('Doğru');gecisBasla(()=>siniflaCiz(r),FAST?30:520)};

 baglaSurukle('[data-sinif-kart]','[data-kutu]',(_k,h)=>yerlestir(+h.dataset.kutu))}
function renderSinifla(r){state.ix=0;state.not='';state.vurgu='';state.sayim=r.kutular.map(()=>0);siniflaCiz(r)}

  ilerleme(r.sorular.length,i)+
  (s.durum?`<div class="kart">${esc(s.durum)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');

  `<div class="choices">${state.dizilim[anahtar].map(j=>{const o=liste[j];

/* ===== SIRA: roket-yakıt sahnesi yok; adımlar defterde/tezgâhta birikir.

/* ===== SOZDIZ: kartlar KÜÇÜK harfle gelir; baş harfi büyütmek ve

/* ===== YAZ: son turda öğrenci kendi gözlemini/gerekçesini üretir.
   Ölçütler canlı işaretlenir; hazır kart dizmek başarı sayılmaz. ===== */
function olcutDurum(r,t){
 const c=kesmeDuz(t);
 const d=[];
 if(r.enAzKelime)d.push({ad:`En az ${r.enAzKelime} sözcük yaz (şu an ${kelimeSay(c)})`,tam:kelimeSay(c)>=r.enAzKelime});
 if(r.buyukHarf!==false)d.push({ad:'Cümleye büyük harfle başla',tam:/^\s*[A-ZÇĞİÖŞÜ]/.test(c)});
 if(r.bitis)d.push({ad:`Cümleyi "${r.bitis}" ile bitir`,tam:c.trim().endsWith(r.bitis)});
 (r.gerekli||[]).forEach(g=>d.push({ad:`"${g}" sözcüğünü kullan`,tam:sadelestir(c).includes(sadelestir(g))}));
 (r.denetim||[]).forEach(x=>d.push({ad:x.ad,tam:new RegExp(x.desen,x.bayrak||'i').test(c)}));
 return d}
function yazCiz(r){
 $('#stage').innerHTML=sahneHtml(r)+
  (r.gorev?`<div class="kart">${esc(r.gorev)}</div>`:'')+

 const d=olcutDurum(r,state.yazi||'');
 $('#task').innerHTML=
  `<textarea class="yazi-alan" id="yaziAlan" placeholder="${esc(r.yerTutucu||'Buraya yaz…')}">${esc(state.yazi||'')}</textarea>`+

  `<div class="olcut">${d.map(x=>`<div class="${x.tam?'tam':''}">${x.tam?'✔':'◻'} ${esc(x.ad)}</div>`).join('')}</div>`+
  `<button class="choice" id="onayBtn">Deftere kaydet</button>`;
 const ta=$('#yaziAlan');
 ta.oninput=()=>{state.yazi=ta.value;
  const y=olcutDurum(r,state.yazi);
  const el=$('.olcut');if(el)el.innerHTML=y.map(x=>`<div class="${x.tam?'tam':''}">${x.tam?'✔':'◻'} ${esc(x.ad)}</div>`).join('')};
 trSeritBagla('#yaziAlan',(v,k)=>{state.yazi=v;yazCiz(r);
  const t2=$('#yaziAlan');if(t2){t2.focus();try{t2.setSelectionRange(k,k)}catch(e){}}});
 $('#onayBtn').onclick=()=>{
  if(locked)return;
  const eksik=olcutDurum(r,state.yazi||'').filter(x=>!x.tam);
  if(eksik.length)return wrong(eksik[0].ad);
  good('Deftere yazıldı!')}}

/* ===== HAFIZA: uzay zemini yok, kartlar konunun sahnesinde durur. Kart
   konumları her açılışta karışır, can standardı 3'tür ve yanlış çiftte
   kartlar hemen kapanmaz — iki içerik yan yana okunup farkları sorulur.
   Her doğru çift bir gerekçe adımıyla doğrulanır. ===== */
const ACILIS=Math.floor((typeof performance!=='undefined'?performance.now():0)*1000)+1;
function hafizaCiz(r){
 const g=state.gerekce;
 $('#stage').innerHTML=sahneHtml(r)+
  ilerleme(r.ciftler.length,(state.eslesen||[]).length)+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(g){
  $('#task').innerHTML=`<div class="caption soru">${esc(g.soru)}</div>`+
   `<div class="choices">${g.secenekler.map((o,j)=>`<button class="choice" data-ger="${j}">${esc(o.t)}</button>`).join('')}</div>`;
  $$('[data-ger]').forEach(b=>b.onclick=()=>{
   if(locked)return;const o=g.secenekler[+b.dataset.ger];
   if(!o.dogru)return wrong(g.hint||'İki kartı yeniden oku.');
   state.gerekce=null;state.acik=[];
   if((state.eslesen||[]).length>=r.ciftler.length){hafizaCiz(r);return good()}
   feedback('Doğru');hafizaCiz(r)});
  return}
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="kartlik">${state.kartlar.map((k,i)=>{
    const acik=(state.acik||[]).indexOf(i)>=0, esles=(state.eslesen||[]).indexOf(k.cift)>=0;
    const yanlis=state.yanlisAcik&&acik;
    return `<button class="hkart ${esles?'esles':(acik?'acik':'')} ${yanlis?'yanlis':''}" data-k="${i}">`+
     `${esles||acik?esc(k.t):'?'}</button>`}).join('')}</div>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 $$('[data-k]').forEach(b=>b.onclick=()=>{
  if(locked||state.gecis||state.gerekce)return;

  const acik=state.acik||[];
  if(acik.indexOf(i)>=0)return;
  if(acik.length>=2)return;
  state.acik=acik.concat(i);
  if(state.acik.length<2)return hafizaCiz(r);
  const [a,b2]=state.acik.map(x=>state.kartlar[x]);
  if(a.cift!==b2.cift){
   /* kartlar hemen kapanmaz: iki içerik yan yana okunup farkı sorulur */
   state.yanlisAcik=true;state.not=r.farkSoru||'İki kartı yan yana oku: ikisi aynı şeyi mi anlatıyor?';
   hafizaCiz(r);wrong(state.not);
   return gecisBasla(()=>{state.acik=[];state.yanlisAcik=false;state.not='';hafizaCiz(r)},FAST?40:1500)}
  const c=r.ciftler[a.cift];
  state.eslesen=(state.eslesen||[]).concat(a.cift);
  state.not=c.neden||'';state.gerekce=c.gerekce||null;
  if(!state.gerekce){state.acik=[];
   if(state.eslesen.length>=r.ciftler.length){hafizaCiz(r);return good()}
   feedback('Eşleşti')}
  hafizaCiz(r)})}
function renderHafiza(r){
 const n=r.ciftler.length;
 const havuz=[];r.ciftler.forEach((c,i)=>{havuz.push({cift:i,t:c.a});havuz.push({cift:i,t:c.b})});
 /* her açılışta yeni diziliş: konum ezberi fen başarısı sayılmasın */
 const d=dizilimUret(havuz.length,tohum('hafiza')+ACILIS);
 state.kartlar=d.map(i=>havuz[i]);
 state.acik=[];state.eslesen=[];state.not='';state.gerekce=null;state.yanlisAcik=false;
 hafizaCiz(r)}

/* ===== GOZLEM: tren-tünel ve kronometre yok. Ölçülen olgu ekranda canlanır
   (Dünya döner, madde ısınır) ve karar bu gözleme dayanır. Yeniden izlemek
   ceza değildir; gözlem yapılmadan seçenekler açılmaz. ===== */
function gozlemCiz(r){
 const i=state.ix||0,s=r.sorular[i];
 const a=r.animasyon||{};

/* ===== ISIT: kronometre kaldırıldı. Ekranda gerçek ocak, kap, madde ve

function isitDurum(r){
 const m=r.madde;
 return {T:state.T,Tmin:m.olcekMin,Tmax:m.olcekMax,oran:state.oran,
  faz:state.isitiyor?'acik':'kapali',madde:m,kayit:state.kayit||[],yaniyor:state.bozuldu}}
function isitCiz(r){

 $('#stage').innerHTML=SAHNE.ocak(isitDurum(r))+

 $('#task').innerHTML=
  (r.gorev?`<div class="istek">${esc(r.gorev)}</div>`:'')+
  `<button class="isit-dugme ${state.isitiyor?'basili':''}" id="isitBtn">${state.isitiyor?'Isıtılıyor…':'Ocağı yak (basılı tut)'}</button>`+
  `<button class="choice" id="durBtn">Ocağı kapat</button>`+
  `<div class="hint">${esc(r.ipucu||'Maddeye bak: ne zaman duracağına sen karar ver.')}</div>`;
 const b=$('#isitBtn');
 const bas=e=>{e.preventDefault();if(locked||state.bozuldu)return;state.isitiyor=true;isitAdim(r);isitCiz(r)};
 const birak=e=>{e.preventDefault();if(!state.isitiyor)return;state.isitiyor=false;isitCiz(r)};
 b.onpointerdown=bas;b.onpointerup=birak;b.onpointercancel=birak;b.onpointerleave=birak;

function isitAdim(r){
 if(state.tik)return;
 const m=r.madde,tur=roundIndex;
 const adim=()=>{
  if(roundIndex!==tur){state.tik=false;return}
  if(!state.isitiyor||locked||state.bozuldu){state.tik=false;return isitCiz(r)}
  const h=FAST?9:1.15;                       /* saniyede değil kare başına ısı */
  if(state.oran>=1){state.T+=h*m.hizSonra}
  else if(state.T<m.degisimC-0.01){state.T=Math.min(m.degisimC,state.T+h*m.hizOnce)}
  else {                                     /* HÂL DEĞİŞİMİ: sıcaklık SABİT */
   state.T=m.degisimC;
   state.oran=Math.min(1,state.oran+h*m.hizDegisim)}
  state.kayit=(state.kayit||[]).concat(state.T);
  if(state.kayit.length>90)state.kayit=state.kayit.filter((_,i)=>i%2===0);
  state.gozlem = state.oran>=1
   ? (state.T>m.bozulmaC?m.gozlemBozuk:m.gozlem2)
   : (state.oran>0?m.gozlem1:m.gozlem0);
  if(state.T>m.bozulmaC&&state.oran>=1){state.bozuldu=true;state.isitiyor=false;
   isitCiz(r);return wrong(m.bozukHint)}
  isitCiz(r);state.tik=true;kareIste(()=>{state.tik=false;adim()})};
 state.tik=true;kareIste(()=>{state.tik=false;adim()})}
function isitKarar(r){
 const m=r.madde;
 if(state.oran<1)return wrong(m.erkenHint);
 if(state.T>m.bozulmaC)return wrong(m.bozukHint);
 state.not=m.sonuc||'';isitCiz(r);good('Tam zamanında!')}
function renderIsit(r){const m=r.madde;
 state.T=m.baslangicC;state.oran=0;state.kayit=[m.baslangicC];state.isitiyor=false;
 state.bozuldu=false;state.tik=false;state.gozlem=m.gozlem0;state.not='';isitCiz(r)}

 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+

 const ekle=i=>{

 $$('[data-sut]').forEach(b=>b.onclick=()=>ekle(+b.dataset.sut));

/* ===== PLAN: ızgara düz labirent değil, sokakları, kavşakları ve işaret
   noktaları olan bir şehir planı. Görev metni rotayı söylemez; güzergâh
   seçimi gerekçelendirilir. Engele çarpınca program silinmez, yalnız
   hatalı adım işaretlenir. ===== */
function planIzgara(r,konum,program){
 const G=r.genislik,Y=r.yukseklik,h=30;
 const hucre=(x,y)=>{
  const k=r.plan[y][x];
  const renk={'.':'#e8eef3','#':'#8fa3b3','c':'#d9c9a8','p':'#a8d6a0','o':'#f3d9a0'}[k]||'#e8eef3';
  return `<rect x="${x*h}" y="${y*h}" width="${h}" height="${h}" fill="${renk}" stroke="#c3ccd4" stroke-width="1"/>`+
   (k==='#'?`<rect x="${x*h+4}" y="${y*h+4}" width="${h-8}" height="${h-8}" rx="3" fill="#6b7d8b"/>`:'')+
   (k==='p'?`<circle cx="${x*h+h/2}" cy="${y*h+h/2}" r="8" fill="#5f9c4a"/><text x="${x*h+h/2}" y="${y*h+h/2+4}" font-size="9" font-weight="900" text-anchor="middle" fill="#fff">P</text>`:'')+
   (k==='o'?`<rect x="${x*h+6}" y="${y*h+8}" width="${h-12}" height="${h-16}" fill="#d9a03c"/><text x="${x*h+h/2}" y="${y*h+h/2+4}" font-size="9" font-weight="900" text-anchor="middle" fill="#fff">O</text>`:'')};
 let hucreler='';
 for(let y=0;y<Y;y++)for(let x=0;x<G;x++)hucreler+=hucre(x,y);
 return `<svg class="plan" viewBox="0 0 ${G*h} ${Y*h}" role="img">`+hucreler+
  `<circle cx="${konum.x*h+h/2}" cy="${konum.y*h+h/2}" r="10" fill="#2a75ad" stroke="#fff" stroke-width="2.5"/>`+
  `<text x="${konum.x*h+h/2}" y="${konum.y*h+h/2+4}" font-size="11" text-anchor="middle" fill="#fff">🚲</text>`+
  `</svg>`}
function planCiz(r){
 const p=state.program||[];
 $('#stage').innerHTML=
  `<div class="kap"><div class="kap-ad">🗺️ ${esc(r.planAd||'Mahalle planı')} — P park · O okul · gri: ana cadde</div>`+
  planIzgara(r,state.konum,p)+`</div>`+
  (r.gorev?`<div class="kart">${esc(r.gorev)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=
  `<div class="program">${p.length?p.map((a,i)=>
    `<span class="${state.hataIx===i?'hata':''}">${{'U':'⬆️','D':'⬇️','L':'⬅️','R':'➡️'}[a]}</span>`).join('')
   :'<span style="border:0;background:none;font-size:12px;font-weight:800;color:#9aabb9">program boş</span>'}</div>`+
  `<div class="yonler">${['U','D','L','R'].map(a=>
    `<button data-yon="${a}">${{'U':'⬆️','D':'⬇️','L':'⬅️','R':'➡️'}[a]}</button>`).join('')}</div>`+
  `<div class="row"><button class="choice kisa" id="geriBtn">← son adımı al</button>`+
   `<button class="choice kisa" id="calisBtn">Sür</button></div>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 $$('[data-yon]').forEach(b=>b.onclick=()=>{
  if(locked)return;state.program=(state.program||[]).concat(b.dataset.yon);
  state.hataIx=-1;state.not='';planCiz(r)});
 $('#geriBtn').onclick=()=>{if(locked)return;state.program=(state.program||[]).slice(0,-1);
  state.hataIx=-1;planCiz(r)};
 $('#calisBtn').onclick=()=>{if(locked)return;planCalistir(r)}}
function planCalistir(r){
 const p=state.program||[];
 if(!p.length)return uyar('Önce birkaç yön ekle');
 let x=r.basla.x,y=r.basla.y;
 for(let i=0;i<p.length;i++){
  const d={'U':[0,-1],'D':[0,1],'L':[-1,0],'R':[1,0]}[p[i]];
  const nx=x+d[0],ny=y+d[1];
  const disari=nx<0||ny<0||nx>=r.genislik||ny>=r.yukseklik;
  const engel=!disari&&r.plan[ny][nx]==='#';
  if(disari||engel){
   /* program SİLİNMEZ; yalnız hatalı adım işaretlenir ve plan üzerinde tarif edilir */
   state.konum={x,y};state.hataIx=i;
   state.not=engel?'Burada ana caddeye girdin; bisiklet yolu oradan geçmiyor.':'Plan dışına çıktın.';
   planCiz(r);return wrong(state.not)}
  x=nx;y=ny}
 state.konum={x,y};state.hataIx=-1;
 if(x!==r.hedef.x||y!==r.hedef.y){
  state.not='Okula ulaşmadın; program bitti ama başka bir noktadasın.';
  planCiz(r);return wrong(state.not)}
 state.not=r.sonuc||'';planCiz(r);
 if(r.gerekce){state.gerekce=r.gerekce;planGerekce(r);return}
 good('Okula ulaştın!')}
function planGerekce(r){
 const g=r.gerekce;
 $('#task').innerHTML=`<div class="caption soru">${esc(g.soru)}</div>`+
  `<div class="choices">${g.secenekler.map((o,j)=>`<button class="choice" data-ger="${j}">${esc(o.t)}</button>`).join('')}</div>`;
 $$('[data-ger]').forEach(b=>b.onclick=()=>{
  if(locked)return;const o=g.secenekler[+b.dataset.ger];
  if(!o.dogru)return wrong(g.hint||'Seçtiğin yolu plan üzerinde yeniden düşün.');
  good('Güzergâhını gerekçelendirdin!')})}
function renderPlan(r){state.program=[];state.konum={x:r.basla.x,y:r.basla.y};

/* Tabak — kur kipinde seçilen besin tabağa gerçekten yerleşir ve tabağın
   dengesi (protein / karbonhidrat / sebze-meyve) görsel olarak oluşur. */
const TABAK=(secilen)=>{
 const gruplar=[{k:'protein',ad:'protein',renk:'#cf6a5f'},
  {k:'karbonhidrat',ad:'karbonhidrat',renk:'#e0a53c'},
  {k:'sebze',ad:'sebze-meyve',kisa:'sebze',renk:'#8fbf6a'}];
 const say=g=>secilen.filter(h=>h.grup===g).length;
 const ekstra=secilen.filter(h=>['sut','yag'].indexOf(h.grup)>=0);
 const dilim=(i,dolu,renk)=>{
  const a0=(-90+i*120)*Math.PI/180, a1=(-90+(i+1)*120)*Math.PI/180, R=46;
  const x0=80+R*Math.cos(a0), y0=58+R*Math.sin(a0), x1=80+R*Math.cos(a1), y1=58+R*Math.sin(a1);
  return `<path d="M80 58 L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" `+
   `fill="${dolu?renk:'#f4f1ea'}" stroke="#b9a9a2" stroke-width="2"/>`};

/* ===== Motora gömülü öz denetim =====
   Bir oyunu tarayıcıda tek tek açmadan altı kabul ölçütünün metin
   üzerinden sınanabilen kısmını tarar. Kullanım: window.__TEST__.denetle() */
window.__TEST__={
 GAMES,
 denetle(){const kusur=[];
  const kutuAdi=s=>String(s||'').toLocaleLowerCase('tr');
  Object.keys(GAMES).forEach(id=>{const g=GAMES[id];
   if(!g.finish)kusur.push(id+': finish yok');
   if(!g.rounds||g.rounds.length!==3)kusur.push(id+': üç tur yok');
   const sonKip=g.rounds&&g.rounds[2]&&g.rounds[2].kind;
   if(['yaz','sozdiz'].indexOf(sonKip)<0)
    kusur.push(id+': son turda öğrenci üretimi yok (kip '+sonKip+')');
   (g.rounds||[]).forEach((r,ri)=>{const et=id+' tur'+(ri+1);
    if(!r.prompt)kusur.push(et+': yönerge yok');
    /* ölçüt 2: ipucu doğru kutunun/seçeneğin adını söylemesin */
    if(r.kind==='sinifla'){
     (r.kartlar||[]).forEach((k,ki)=>{
      const dk=kutuAdi(r.kutular[k.dogru]);
      if(k.hint&&kutuAdi(k.hint).includes(dk))
       kusur.push(et+' kart'+(ki+1)+': ipucu doğru kutunun adını içeriyor');
      if(k.dogru==null||!r.kutular[k.dogru])kusur.push(et+' kart'+(ki+1)+': doğru kutu yok')})}
    if(r.kind==='karar')(r.sorular||[]).forEach((s,si)=>{
     const d=(s.secenekler||[]).filter(o=>o.dogru);
     if(d.length!==1)kusur.push(et+' soru'+(si+1)+': tek doğru seçenek yok');
     const dm=kutuAdi(d[0]&&d[0].t);
     if(s.hint&&dm&&kutuAdi(s.hint).includes(dm))
      kusur.push(et+' soru'+(si+1)+': ipucu doğru seçeneği içeriyor');
     if(s.gerekce&&(s.gerekce.secenekler||[]).filter(o=>o.dogru).length!==1)
      kusur.push(et+' soru'+(si+1)+': gerekçede tek doğru yok')});
    if(r.kind==='sira'){
     if(!r.dogru||r.dogru.length!==(r.kartlar||[]).length)kusur.push(et+': sıra dizisi eksik');
     /* ekran dizilişi veri sırasıyla aynı olursa cevap sıradan okunur */
     const dz=dizilimUret((r.kartlar||[]).length,1,r.dogru);
     if(dz.every((v,i)=>v===r.dogru[i]))kusur.push(et+': ekran dizilişi cevabı veriyor')}
    if(r.kind==='esle'){
     const yn=(r.yuvalar||[]).length;
     (r.parcalar||[]).forEach((p,pi)=>{
      if(p.yuva==null||p.yuva>=yn)kusur.push(et+' parça'+(pi+1)+': yuva yok')});
     if((r.parcalar||[]).length!==yn)kusur.push(et+': parça/yuva sayısı eşit değil');
     /* emoji sızıntısı: parça ile hedefi aynı simge eşleştirmesin */
     const emo=s=>(String(s||'').match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu)||[]);
     (r.parcalar||[]).forEach((p,pi)=>{const y=r.yuvalar[p.yuva]||{};
      if(emo(p.t).some(e=>emo(y.t).indexOf(e)>=0))
       kusur.push(et+' parça'+(pi+1)+': parça ile hedef aynı simgeyi paylaşıyor')})}
    if(r.kind==='kur'){
     const idler=(r.havuz||[]).map(h=>h.id);
     (r.istekler||[]).forEach((s,si)=>(s.gerekli||[]).forEach(x=>{
      if(idler.indexOf(x)<0)kusur.push(et+' istek'+(si+1)+': havuzda yok "'+x+'"')}))}
    if(r.kind==='sozdiz'){
     (r.dogruDiziler||[]).forEach((dz,di)=>{
      if(dz.length!==(r.sozcukler||[]).length)kusur.push(et+' dizi'+(di+1)+': sözcük sayısı tutmuyor')});
     if((r.noktalar||['.','?','!']).indexOf(r.dogruNokta)<0)
      kusur.push(et+': doğru noktalama seçenekler arasında yok')}
    if(r.kind==='isit'){
     const m=r.madde||{};
     /* şartnamenin f21 maddesi: hedef sıcaklık görev metninde, "Hedef"
        satırında ve ölçek işaretinde YAZILI OLMAYACAK. Öğrenci maddeye
        bakarak karar verecek. */
     const metin=[r.prompt,r.gorev,r.ipucu,m.gozlem0,m.gozlem1,m.erkenHint].join(' ');
     if(m.degisimC!=null&&new RegExp('(^|[^0-9-])'+m.degisimC+'([^0-9]|$)').test(metin))
      kusur.push(et+': hedef sıcaklık ('+m.degisimC+') yönerge metinlerinde yazılı');
     if(!(m.hizDegisim>0))kusur.push(et+': hâl değişimi süresi yok, sıcaklık düzlüğü oluşmaz');
     if(!(m.bozulmaC>m.degisimC))kusur.push(et+': aşırı ısıtma sınırı hâl değişiminin üstünde değil');
     if(!m.gozlem1||!m.gozlem2)kusur.push(et+': maddedeki değişimi anlatan gözlem metni eksik');
    }
    if(r.kind==='yaz'){
     const c=r.ornekCevap||'';
     olcutDurum(r,c).filter(x=>!x.tam).forEach(x=>
      kusur.push(et+': ornekCevap ölçütü geçmiyor — '+x.ad))}
   })});
  return {oyun:Object.keys(GAMES).length,kusur}}};
