<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>4. Sınıf Türkçe — Gerçek Üretim Sahneleri</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="scene-workshop.css?v=20260921">
<script src="scene-workshop.js?v=20260921"></script>
<link rel="stylesheet" href="scene-collections.css?v=20260921">
<script src="scene-collections.js?v=20260921"></script>
<style>
:root{--ink:#1b2f45;--muted:#516d87;--panel:rgba(255,255,255,.95);--ok:#14855c;--bad:#cd463d;--gold:#dfa32a;--blue:#2c7cb6;--line:#b6cada}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#dbecfa;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;isolation:isolate}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:7px 9px;background:rgba(255,255,255,.97);box-shadow:0 3px 15px rgba(25,59,85,.16);z-index:30}
.round{font-size:clamp(13px,3.2vw,17px);font-weight:950;white-space:nowrap}
.prompt{font-size:clamp(11px,2.7vw,14px);line-height:1.18;font-weight:850;text-align:center;overflow-wrap:break-word}
.hud-right{display:flex;align-items:center;gap:5px}
.lives{font-size:15px;letter-spacing:-3px;white-space:nowrap}
.sound{width:46px;height:44px;border:0;border-radius:13px;background:#e3f3ff;box-shadow:0 2px 0 #aacce2;font-size:20px}
.scene{position:relative;min-height:0;overflow:auto;padding:9px 9px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;background:linear-gradient(#d5eafd 0 58%,#a9c9e0 58%)}
.scene[data-theme="kutuphane"]{background:linear-gradient(#fdf1da 0 68%,#b98358 68%)}
.scene[data-theme="atolye"]{background:linear-gradient(#e7edf3 0 66%,#7b8ea1 66%)}
.scene[data-theme="sahne"]{background:linear-gradient(#f3e6f5 0 64%,#8d6f9e 64%)}
.scene[data-theme="meydan"]{background:linear-gradient(#d9ecfb 0 60%,#9aa6ae 60%)}
.scene[data-theme="lab"]{background:linear-gradient(#e2f7f2 0 66%,#79b7a6 66%)}
.scene[data-theme="muze"]{background:linear-gradient(#ece5f4 0 66%,#8d7fa6 66%)}
.scene[data-theme="doga"]{background:linear-gradient(#d5eafd 0 52%,#8bbf6e 52%)}
.scene[data-theme="masa"]{background:linear-gradient(#fdf3e2 0 70%,#c19a6b 70%)}
.stage{position:relative;flex:1 1 auto;min-height:200px;border-radius:22px;padding:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.86);border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(20,56,82,.14)}
.task{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto}
.caption{width:100%;text-align:center;font-size:clamp(12px,3.1vw,15px);font-weight:850;line-height:1.28}
.caption.soru{font-size:clamp(13px,3.5vw,17px);font-weight:950}
.hint{width:100%;text-align:center;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.stack{display:flex;flex-direction:column;align-items:center;gap:4px}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;width:100%}
.choices{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:8px;width:100%}
.choice{min-height:52px;flex:1 1 100%;max-width:340px;border:3px solid #fff;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 rgba(35,77,108,.2);padding:9px 12px;font-weight:900;font-size:clamp(13px,3.4vw,16px);line-height:1.25;text-align:center;overflow-wrap:anywhere}
.choice.kisa{flex:1 1 44%;max-width:170px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,77,108,.2)}
/* karar verilecek cümle HER ZAMAN tam görünür (şartname ölçüt 5) */
.kart{flex:0 0 auto;width:min(324px,95%);min-height:56px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 13px;font-weight:880;font-size:clamp(13px,3.5vw,16px);line-height:1.34;text-align:center;overflow-wrap:break-word;box-shadow:0 4px 0 rgba(35,77,108,.14)}
.kart.vurgu{border-color:var(--gold);background:#fffaf0}
.kutular{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
.kutu{flex:1 1 45%;min-width:126px;max-width:200px;min-height:56px;border:3px solid #7fa3bd;border-radius:15px;background:#eef7fd;padding:8px 9px;font-weight:950;font-size:clamp(11px,3vw,14px);line-height:1.22;text-align:center;overflow-wrap:break-word}
.kutu .sayac{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.ilerleme{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:11px;height:11px;border-radius:50%;background:#cfdde8;border:2px solid #a8bfd0}
.ilerleme i.ok{background:var(--ok);border-color:#0b6a48}
.ilerleme i.simdi{background:var(--gold);border-color:#a97c14}
/* metin kartı — okuma ve düzeltme turlarında metin asla taşmaz */
.metin-kart{flex:0 0 auto;width:min(330px,96%);overflow:visible;background:#fffdf6;border:3px solid #d8c9a4;border-radius:14px;padding:10px 12px;font-size:clamp(13px,3.4vw,15px);line-height:1.5;text-align:left;overflow-wrap:break-word}
.metin-kart .baslik{font-weight:950;font-size:13px;color:#8a6a2c;margin-bottom:5px}
.kanit{border-bottom:2px dotted #9db4c6;padding:1px 2px;border-radius:4px;cursor:pointer}
.kanit.secili{background:#dff3e6;border-bottom-color:var(--ok)}
.kanit.yanlis{background:#fde9e7;border-bottom-color:var(--bad)}
.kanit-sayac{font-size:12px;font-weight:900;color:var(--muted)}
.dizi{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.sirakart{flex:0 0 auto;width:min(324px,95%);min-height:50px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:8px 11px;font-weight:870;font-size:clamp(12px,3.3vw,15px);line-height:1.3;text-align:left;overflow-wrap:break-word;display:flex;align-items:center;gap:8px;touch-action:none}
.sirakart .no{flex:0 0 24px;height:24px;border-radius:50%;background:#e6eef5;color:var(--muted);font-size:12px;font-weight:950;display:flex;align-items:center;justify-content:center}
.sirakart.secili{border-color:var(--ok);background:#e9f7f0}
.sirakart.secili .no{background:var(--ok);color:#fff}
.sira-hedef{width:min(330px,96%);min-height:72px;border:3px dashed #6f9cba;border-radius:16px;background:rgba(255,255,255,.78);padding:7px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.sira-hedef .sira-bos{text-align:center;color:var(--muted);font-size:12px;font-weight:900;line-height:1.3}
.sira-hedef .sira-adim{display:flex;align-items:flex-start;gap:6px;border:2px solid #91c8ae;border-radius:10px;background:#e9f7f0;padding:4px 7px;font-size:12px;font-weight:850;line-height:1.25;text-align:left}
.sira-hedef .sira-adim b{flex:0 0 21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:11px}
.esle-alan{display:flex;flex-direction:column;gap:7px;width:100%;align-items:center}
.yuva{flex:0 0 auto;width:min(330px,96%);min-height:58px;border:3px dashed #6f9cba;border-radius:15px;background:rgba(255,255,255,.72);padding:7px 9px;display:flex;align-items:center;gap:9px;text-align:left}
.yuva.dolu{border-style:solid;border-color:var(--ok);background:#e9f7f0}
.yuva .hedef{flex:1 1 auto;font-weight:880;font-size:clamp(12px,3.2vw,14px);line-height:1.3;overflow-wrap:break-word}
.yuva .kondu{flex:0 0 auto;max-width:44%;font-weight:900;font-size:12px;color:#0b6a48;line-height:1.2;overflow-wrap:break-word}
.etiketler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.etiket{min-height:46px;max-width:190px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);padding:7px 10px;font-weight:880;font-size:clamp(11px,3vw,13px);line-height:1.25;overflow-wrap:break-word;touch-action:none}
.etiket.secili{border-color:var(--gold);background:#fff7e2}
.etiket.bitti{visibility:hidden}
.ui-dragging{position:relative!important;z-index:999!important;pointer-events:none!important;opacity:.94;box-shadow:0 10px 25px rgba(0,0,0,.28)!important}
.drop-hot{filter:drop-shadow(0 0 9px #f1b53a)!important;outline:4px solid #f1b53a!important;outline-offset:3px}
.feedback{position:absolute;left:50%;top:46%;z-index:150;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#fff;border:4px solid var(--ok);border-radius:22px;padding:14px 19px;min-width:200px;text-align:center;font-size:clamp(17px,4.6vw,25px);font-weight:1000;box-shadow:0 12px 38px rgba(0,0,0,.27)}
.feedback.show{animation:pop .95s ease both}
.feedback.bad{border-color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%,74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes hop{50%{transform:translateY(-14px) scale(1.04)}}
.shake{animation:shake .38s}.success-motion{animation:hop .7s ease}
.overlay{position:absolute;inset:0;z-index:300;background:rgba(9,27,46,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{width:min(390px,94%);background:white;border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.overlay h2{margin:0 0 8px;font-size:27px}.overlay p{font-size:15px;font-weight:750;color:var(--muted);line-height:1.35}
.big{font-size:clamp(38px,11vw,64px)}
/* yazma — gerçek üretim; hazır kart dizmek başarı sayılmaz */
.yazi-alan{flex:0 0 auto;width:min(330px,96%);min-height:96px;border:3px solid #8fb4cd;border-radius:15px;padding:9px 11px;font:inherit;font-size:15px;font-weight:800;line-height:1.4;resize:none;background:#fff}
.olcut{width:min(330px,96%);display:flex;flex-direction:column;gap:3px}
.olcut div{font-size:12px;font-weight:850;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.25}
.olcut div.tam{color:#0b6a48}
.trharf{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:min(330px,96%)}
.trharf button{min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:#f4f9fd;font-size:17px;font-weight:950}
.banka{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(330px,96%)}
.banka button{min-height:44px;border:2px solid var(--line);border-radius:10px;background:#f2f7fb;padding:5px 9px;font-size:13px;font-weight:900}
/* konuşma — gerçek ses üretimi */
.rubrik{width:min(330px,96%);display:flex;flex-direction:column;gap:5px}
.rubrik button{min-height:44px;border:3px solid var(--line);border-radius:13px;background:#fff;padding:6px 10px;font-weight:850;font-size:13px;text-align:left;line-height:1.25}
.rubrik button.on{border-color:var(--ok);background:#e9f7f0}
.tut{min-height:60px;min-width:190px;border:3px solid #fff;border-radius:18px;background:#2c7cb6;color:#fff;font-weight:950;font-size:17px;box-shadow:0 5px 0 #1b5a88;user-select:none;touch-action:none}
.tut.basili{background:#1b5a88;transform:translateY(3px);box-shadow:0 2px 0 #134466}
.sure-cubuk{width:min(300px,92%);height:12px;border-radius:7px;background:#dbe7ef;overflow:hidden}
.sure-cubuk i{display:block;height:100%;width:var(--w,0%);background:var(--gold);transition:width .1s linear}
/* dikte — hedef sözcük hiçbir yerde yazılı değil, harf havuzu karışık */
.dikte-yuva{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(330px,96%);min-height:56px;padding:7px;border:3px dashed #9fb0c4;border-radius:13px;background:#fff}
.dikte-yuva span{min-width:34px;min-height:42px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #9fb0c4;font-size:22px;font-weight:950}
.harfler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.harf{min-width:48px;min-height:48px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);font-size:20px;font-weight:950}
.harf.bitti{visibility:hidden}
/* tahmin — tren-tünel yok; tahmin, gerçek değer ve fark yan yana */
.kova-sar{display:flex;align-items:flex-end;justify-content:center;gap:14px;width:100%}
.kova{position:relative;width:88px;height:94px;border:5px solid #7b8ea1;border-top:0;border-radius:0 0 14px 14px;background:rgba(255,255,255,.6);overflow:hidden}
.kova i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7fc6e8,#3f92c4);transition:height .5s}
.kova b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:900;color:#0d3b55}
.karsilastir{width:min(320px,94%);display:flex;flex-direction:column;gap:4px}
.karsilastir div{display:flex;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:900}
.olcek{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:min(330px,96%);height:48px;min-height:48px;background:transparent;margin:0}
.olcek::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0}
.olcek::-moz-range-track{height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0}
.olcek::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-14px;border-radius:50%;background:#2c7cb6;border:4px solid #fff;box-shadow:0 2px 6px rgba(20,56,82,.35)}
.olcek::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:#2c7cb6;border:4px solid #fff}
/* çetele — beşinci çizgi dördünü keser */
.cetele-tablo{width:min(330px,96%);display:flex;flex-direction:column;gap:6px}
.cetele-satir{display:flex;align-items:center;gap:8px;min-height:52px;border:3px solid var(--line);border-radius:13px;background:#fff;padding:6px 9px;text-align:left}
.cetele-satir .ad{flex:0 0 100px;font-size:12px;font-weight:950;line-height:1.15;overflow-wrap:break-word}
.cetele-satir .isaret{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:26px}
.cetele-satir.vurgu{border-color:var(--ok);background:#e9f7f0}
.oy-karti{touch-action:none;cursor:grab;border-color:var(--gold);background:#fffaf0;box-shadow:0 4px 0 rgba(154,110,18,.22)}
.oy-karti:active{cursor:grabbing}
.oy-karti small{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:850}
/* dinleme — metin görünmez, tekrar dinleme cezasız */
.ses-kart{width:min(310px,94%);min-height:88px;border:3px solid var(--line);border-radius:16px;background:#eef6fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.ses-dalga{display:flex;gap:3px;align-items:flex-end;height:30px}
.ses-dalga i{width:5px;border-radius:3px;background:var(--blue)}
.sayim{font-size:12px;font-weight:900;color:var(--muted)}
/* sahne çizimleri */
svg.sahne{width:min(320px,94%);height:auto;max-height:170px;display:block}
svg.mini{flex:0 0 74px;width:74px;height:auto;display:block}
.sahne-not{font-size:12px;font-weight:850;color:var(--muted);text-align:center;line-height:1.25}
.ses-yedek{margin-top:6px;font-size:12px;font-weight:850;text-align:center;line-height:1.3;
 color:#8a4b12;background:#fff3e0;border:2px solid #f0b775;border-radius:10px;padding:6px 8px}
.ses-yedek b{font-size:15px;letter-spacing:.5px}
.konus-balon{flex:0 0 auto;background:#fff;border:3px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 11px;font-weight:870;font-size:clamp(12px,3.2vw,15px);line-height:1.35;max-width:min(324px,95%);overflow-wrap:break-word;text-align:left}
@media (max-height:640px){.stage{min-height:160px}.scene{gap:6px}.choice{min-height:48px}svg.sahne{max-height:130px}.metin-kart{max-height:170px}.yazi-alan{min-height:76px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Sınama modunda (?test=1) arka plan sekmesindeki setTimeout kısıntısını aş. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}
'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'z01';
addEventListener('hashchange',()=>location.reload());
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:820;
let game,roundIndex=0,lives=3,score=0,state={},locked=false;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Seslendirme ateşle-unut: ilerleme hiçbir yerde ses olayına bağlı değil. */
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(String(text||''),repeat)}catch(e){}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text||''));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',
 `<div class="overlay"><div class="overlay-card"><div class="big">🏅</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="choice" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function round(){return game.rounds[roundIndex]}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div>`+
 `<div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi tekrar dinle">🔊</button></div></header>`}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;sonCeza=0;
 document.getElementById('app').innerHTML=hud()+
  `<main class="scene" data-theme="${round().theme||game.theme||'masa'}"><div class="feedback"></div>`+
  `<section class="stage" id="stage"></section><section class="task" id="task"></section></main>`;
 $('.sound').onclick=()=>{const r=round();if(r)speak(r.prompt,true)};
 /* rAF geri çağrısı bir sonraki karede çalışır; o ana kadar oyun bitmiş
    olabilir (gizli sekmede kuyrukta bekliyor). round() boşsa okuma. */
 renderRound();requestAnimationFrame(()=>{const t=roundIndex,r=round();
  /* kare geri döndüğünde tur değişmiş olabilir: bayat yönergeyi okuma */
  if(r&&roundIndex===t)speak(r.prompt)})}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
/* Hızlı çift dokunuş tek hata için iki can götürmesin. */
let sonCeza=0;
function wrong(hint){if(locked||!round())return;
 const simdi=Date.now();if(simdi-sonCeza<550)return;sonCeza=simdi;
 if(!round().cezasiz)lives=Math.max(0,lives-1);
 feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün.');
 const sc=$('.stage');if(sc){sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake')}
 const l=$('.lives');if(l)l.innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
 if(lives===0){lives=3;setTimeout(render,700)}}
function good(message){if(locked)return;locked=true;score+=10;const r=round();
 feedback(message||'Doğru!');speak(r.result||message||'Doğru.');
 const st=$('#stage');if(st)st.classList.add('success-motion');
 setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}

/* Kartı gerçekten sahnedeki hedefe taşı. Kısa dokunma olayını engellemez;

function baglaSurukle(kaynakSec,hedefSec,birak){$$(kaynakSec).forEach(k=>{let aktif=false,tasindi=false,sx=0,sy=0;
 k.addEventListener('click',e=>{if(k.dataset.dragged){e.preventDefault();e.stopImmediatePropagation();delete k.dataset.dragged}},true);
 k.onpointerdown=e=>{if(k.disabled)return;aktif=true;tasindi=false;sx=e.clientX;sy=e.clientY;k.setPointerCapture?.(e.pointerId)};
 k.onpointermove=e=>{if(!aktif)return;tasindi=tasindi||Math.hypot(e.clientX-sx,e.clientY-sy)>7;if(!tasindi)return;k.classList.add('ui-dragging');k.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.07)`;$$(hedefSec).forEach(t=>{const b=t.getBoundingClientRect();t.classList.toggle('drop-hot',e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)})};
 const bitir=e=>{if(!aktif)return;let hit=null;$$(hedefSec).forEach(t=>{const b=t.getBoundingClientRect();if(e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)hit=t;t.classList.remove('drop-hot')});aktif=false;k.releasePointerCapture?.(e.pointerId);k.classList.remove('ui-dragging');k.style.transform='';if(tasindi){k.dataset.dragged='1';if(hit&&e.type!=='pointercancel')birak(k,hit)}};
 k.onpointerup=bitir;k.onpointercancel=bitir})}

/* ===== KANIT (okuma kipi): cevaptan önce metindeki kanıt işaretlenir;
   doğru seçenek ancak kanıtla tutarlıysa kabul edilir. ===== */
function metinHtml(r){
 return `<div class="metin-kart">${r.baslik?`<div class="baslik">${esc(r.baslik)}</div>`:''}`+
  r.metin.map(par=>`<div>${par.map((p,si)=>{
   if(typeof p==='string')return esc(p);
   const ix=r.metin.indexOf(par)+'-'+si;
   const se=(state.kanit||[]).indexOf(ix)>=0, ya=(state.yanlisKanit||[]).indexOf(ix)>=0;
   return `<span class="kanit${se?' secili':''}${ya?' yanlis':''}" data-kanit="${ix}" data-dogru="${p.dogru?1:0}">${esc(p.t)}</span>`
  }).join('')}</div>`).join('')+`</div>`}
function kanitCiz(r){
 const gerek=r.gerekKanit||1;
 $('#stage').innerHTML=sahneHtml(r)+metinHtml(r)+
  `<div class="kanit-sayac">İşaretlenen kanıt: ${(state.kanit||[]).length}/${gerek}</div>`+
  `<div class="caption">${esc(state.not||'Cevaptan önce metinde kanıtı işaretle.')}</div>`;
 $$('[data-kanit]').forEach(el=>el.onclick=()=>{
  if(state.gecis||state.faz>0||locked)return;
  const ix=el.dataset.kanit;
  if((state.kanit||[]).indexOf(ix)>=0)return feedback('Bunu işaretledin');
  if(el.dataset.dogru!=='1'){
   state.yanlisKanit=(state.yanlisKanit||[]).concat(ix);
   state.not='Bu bölüm soruyu yanıtlamıyor. Sorunun ne istediğini yeniden oku.';
   kanitCiz(r);return wrong(state.not)}
  state.kanit=(state.kanit||[]).concat(ix);state.not='Kanıt işaretlendi.';kanitCiz(r);
  if(state.kanit.length>=gerek){state.faz=1;feedback('Kanıt tamam');gecisBasla(()=>kanitCiz(r),FAST?30:560)}});
 if(state.faz===0){$('#task').innerHTML='<div class="caption">Metinde soruyu yanıtlayan bölüme dokun.</div>';return}
 if(state.faz===2&&r.neden){
  /* Kanıt turunda ikinci basamak: çıkarımın gerekçesi ayrıca sorulur. */
  $('#task').innerHTML=`<div class="caption soru">${esc(r.neden.soru)}</div>`+
   `<div class="choices">${r.neden.secenekler.map((c,i)=>`<button class="choice" data-neden="${i}">${esc(c.label)}</button>`).join('')}</div>`;
  $$('[data-neden]').forEach(b=>b.onclick=()=>{
   if(locked||state.gecis)return;
   const c=r.neden.secenekler[+b.dataset.neden];
   if(!c.correct)return wrong(c.hint||'Metne dön: bunu hangi cümle gösteriyor?');
   good()});
  return}
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="choices">${r.secenekler.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.label)}</button>`).join('')}</div>`;
 $$('[data-choice]').forEach(b=>b.onclick=()=>{
  if(locked||state.gecis)return;
  const c=r.secenekler[+b.dataset.choice];
  if(!c.correct)return wrong(c.hint||'İşaretlediğin kanıta dön: o bölüm bu seçeneği destekliyor mu?');
  if(r.neden){state.faz=2;state.not=r.araSoz||'Doğru. Peki bunu nereden anladın?';feedback('Doğru');
   return gecisBasla(()=>kanitCiz(r),FAST?30:600)}

 const g=state.faz===1&&r.neden;
 $('#stage').innerHTML=sahneHtml(r)+

    :`<button class="choice" id="kaynakGor">${esc(r.kaynak.dugme||'Kaynağı gör')}</button>`):'')+

 if(kg)kg.onclick=()=>{state.kaynakAcik=true;kararCiz(r)};
 const soru=g?r.neden.soru:r.soru, sec=g?r.neden.secenekler:r.secenekler;
 $('#task').innerHTML=`<div class="caption soru">${esc(soru)}</div>`+
  `<div class="choices">${sec.map((c,i)=>`<button class="choice${c.label.length<16?' kisa':''}" data-${g?'neden':'sec'}="${i}">${esc(c.label)}</button>`).join('')}</div>`+

 $$(`[data-${g?'neden':'sec'}]`).forEach(b=>b.onclick=()=>{

  const c=sec[+(g?b.dataset.neden:b.dataset.sec)];

  if(!g&&r.neden){state.faz=1;state.not=r.araSoz||'Doğru. Peki neden?';feedback('Doğru');
   return gecisBasla(()=>kararCiz(r),FAST?30:600)}

/* ===== SINIFLA: cümle kartı sabit ve TAM görünür; bant akışı yok.

function sinifCiz(r){
 if(GAME_ID==='z10')return SceneCollections.render({id:GAME_ID,r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 const i=state.ix||0,k=r.kartlar[i];
 if(!k)return;
 $('#stage').innerHTML=sahneHtml(r)+
  ilerleme(r.kartlar.length,i)+
  `<div class="kart vurgu">${esc(k.t)}</div>`+

  state.sayim=state.sayim||r.kutular.map(()=>0);state.sayim[j]++;

/* ===== SIRA: roket-yakıt sahnesi yok; yanlışta dizi silinmez. ===== */
/* Kartlar dizi sırasında çizilirse ve doğru sıra [0,1,2,...] ise, doğru
   cevap ekrandan okunur. Tohumlu (Math.random'sız) karıştırma ile ekran
   dizilişi ayrılır; data-kart gerçek dizini taşımayı sürdürür. */
function siraDizilim(r,tohum){
 const n=r.kartlar.length,idx=[...Array(n).keys()];
 let x=(tohum*2654435761)%2147483647; if(x<=0)x+=2147483646;
 for(let i=n-1;i>0;i--){x=(x*48271)%2147483647;const j=x%(i+1);const t=idx[i];idx[i]=idx[j];idx[j]=t}
 if(idx.every((v,i)=>v===(r.dogru||[])[i]))idx.push(idx.shift());
 return idx}
function siraTohum(){let h=0;const s=GAME_ID+':'+roundIndex;
 for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
 return Math.abs(h)+1}
function siraCiz(r){
 const d=state.dizi||[];
 if(GAME_ID==='z04'){
  $('#stage').classList.add('workshop-stage');
  $('#stage').innerHTML='<p class="scene-kicker">SÖZCÜKLER BASKIYA GİRİYOR</p>'+SceneWorkshop.press(d.map(i=>r.kartlar[i].t),true,!!state.yeniSoz)+
   `<div class="scene-status">${esc(state.not||'Kartı matbaanın kağıdına sürükle.')}</div>`;
  state.yeniSoz=false;
 }else $('#stage').innerHTML=sahneHtml(r)+
  (r.gorev?`<div class="konus-balon">${esc(r.gorev)}</div>`:'')+
  `<div class="sira-hedef" data-sira-hedef="1">${d.length
   ?d.map((i,p)=>`<div class="sira-adim"><b>${p+1}</b><span>${esc(r.kartlar[i].t)}</span></div>`).join('')
   :'<div class="sira-bos">İlk kartı buraya sürükle; doğru adımlar burada sırayla oluşacak.</div>'}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(!state.dizilim)state.dizilim=siraDizilim(r,siraTohum());
 $('#task').innerHTML=(r.dinlet?`<button class="choice" id="dinleBtn">${state.dinleme?'Yeniden dinle':'Olayları dinle'}</button>`+
   `<div class="hint">${state.dinleme?state.dinleme+' kez dinledin (tekrar dinlemek ceza değildir)':'Dinledikten sonra sırala.'}</div>`:'')+
  `<div class="dizi">${state.dizilim.map(i=>{
   const k=r.kartlar[i],p=d.indexOf(i);
   return `<button class="sirakart ${p>=0?'secili':''}" data-kart="${i}"><span class="no">${p>=0?p+1:''}</span><span>${esc(k.t)}</span></button>`}).join('')}</div>`+
  `<div class="hint">${d.length}/${r.kartlar.length} adım dizildi. ${esc(r.ipucu||'')}</div>`;
 const db=$('#dinleBtn');
 if(db)db.onclick=()=>{if(locked)return;state.dinleme=(state.dinleme||0)+1;speak(r.dinlet,true);siraCiz(r)};
 const ekle=b=>{
  if(state.gecis||locked)return;
  const i=+b.dataset.kart;
  if(d.indexOf(i)>=0)return feedback('Bunu dizdin');
  if(i!==r.dogru[d.length]){
   state.not=(r.ipucular&&r.ipucular[d.length])||'Önce hangisi olmalı?';
   siraCiz(r);return wrong(state.not)}
  state.dizi=d.concat(i);state.not='';state.yeniSoz=true;
  if(state.dizi.length>=r.dogru.length){siraCiz(r);return good()}
  siraCiz(r)};
 $$('[data-kart]').forEach(b=>b.onclick=()=>ekle(b));
 (GAME_ID==='z04'?SceneWorkshop.bindDrag:baglaSurukle)('[data-kart]:not(.secili)','[data-sira-hedef]',k=>ekle(k))}
function renderSira(r){state.dizi=[];state.not='';state.dizilim=null;siraCiz(r)}

/* ===== ESLE: parça ile hedef arasında simge/renk eşleşmesi YOK;
   karar metnin anlamına dayanır. ===== */
function esleCiz(r){
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="esle-alan">${r.yuvalar.map((y,i)=>{
    const v=(state.yerlesen||[])[i];
    return `<button class="yuva ${v!=null?'dolu':''}" data-yuva="${i}">`+
     `<span class="hedef">${esc(y.hedef)}</span>`+
     (v!=null?`<span class="kondu">${esc(r.etiketler[v].t)}</span>`:'')+`</button>`}).join('')}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru||'Kartı doğrudan sahnedeki ait olduğu hedefe sürükle.')}</div>`+
  `<div class="etiketler">${r.etiketler.map((e,j)=>{
    const kondu=(state.yerlesen||[]).indexOf(j)>=0;
    return `<button class="etiket ${kondu?'bitti':''} ${state.secEt===j?'secili':''}" data-et="${j}">${esc(e.t)}</button>`}).join('')}</div>`+
  `<div class="hint">${esc(r.ipucu||'Kartı doğrudan sahnedeki ait olduğu hedefe sürükle.')}</div>`;
 const yerlestir=(j,i)=>{
  if(locked||j==null)return;
  if((state.yerlesen||[])[i]!=null)return feedback('Bu satır dolu');
  if(j!==r.yuvalar[i].dogru){
   state.not=r.yuvalar[i].hint||'Bu kart bu satıra ait değil; anlamını yeniden düşün.';
   state.secEt=null;esleCiz(r);return wrong(state.not)}

 (r.gerekli||[]).forEach(g=>d.push({ad:`"${g}" sözcüğünü kullan`,tam:sadelestir(t).includes(sadelestir(g))}));

  if(!sesler.length)return true;

/* ===== TAHMIN: tahmin ekrandaki bilgi metnine dayanır; tahmin, gerçek değer
   ve fark birlikte gösterilip karşılaştırma sorulur. ===== */
function tahminCiz(r){
 const i=state.ix||0,d=r.durumlar[i];if(!d)return;
 const t=state.tahmin==null?Math.round(d.enCokOlcek/2):state.tahmin;
 const oran=v=>Math.min(100,v/d.enCokOlcek*100);
 $('#stage').innerHTML=sahneHtml(r)+
  (r.bilgi?`<div class="metin-kart"><div class="baslik">${esc(r.bilgiBaslik||'Bilgi metni')}</div>${esc(r.bilgi)}</div>`:'')+
  `<div class="konus-balon">${esc(d.t)}</div>`+
  `<div class="kova-sar">`+
   `<div class="stack"><div class="kova"><i style="height:${oran(t)}%"></i><b>tahminim</b></div><div class="sahne-not">${t} ${esc(d.birim)}</div></div>`+
   (state.faz===1?`<div class="stack"><div class="kova"><i style="height:${oran(d.gercek)}%;background:linear-gradient(#f0b0a0,#cd463d)"></i><b>gerçek</b></div><div class="sahne-not">${d.gercek} ${esc(d.birim)}</div></div>`:'')+
  `</div>`+
  (state.faz===1?`<div class="karsilastir"><div><span>Tahminin</span><span>${t} ${esc(d.birim)}</span></div>`+
    `<div><span>Gerçek</span><span>${d.gercek} ${esc(d.birim)}</span></div>`+
    `<div><span>Fark</span><span>${Math.abs(d.gercek-t)} ${esc(d.birim)}</span></div></div>`:'')+
  ilerleme(r.durumlar.length,i)+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(state.faz===0){
  $('#task').innerHTML=`<div class="caption soru">${esc(d.soru)}</div>`+
   `<input class="olcek" type="range" min="0" max="${d.enCokOlcek}" step="${d.adim||1}" value="${t}" id="tahminAlan" aria-label="Tahmin ölçeri">`+
   `<button class="choice" id="tahminOk">Tahminim bu</button>`+
   `<div class="hint">Tahminini yukarıdaki bilgi metnine dayandır.</div>`;
  const al=$('#tahminAlan');
  al.oninput=()=>{state.tahmin=+al.value;tahminCiz(r);const y=$('#tahminAlan');if(y)y.focus()};
  $('#tahminOk').onclick=()=>{if(locked)return;state.tahmin=t;state.faz=1;
   state.not='Şimdi gerçek değerle karşılaştır.';tahminCiz(r)};
  return}
 $('#task').innerHTML=`<div class="caption soru">${esc(d.yorumSoru)}</div>`+
  `<div class="choices">${d.secenekler.map((c,j)=>`<button class="choice" data-tsec="${j}">${esc(c.label)}</button>`).join('')}</div>`;
 $$('[data-tsec]').forEach(b=>b.onclick=()=>{
  if(locked||state.gecis)return;
  const c=d.secenekler[+b.dataset.tsec];
  if(!c.correct)return wrong(c.hint||'Tabloya yeniden bak.');
  state.ix=i+1;state.faz=0;state.tahmin=null;state.not=d.neden||'';
  if(state.ix>=r.durumlar.length)return good();
  feedback('Doğru');gecisBasla(()=>tahminCiz(r),FAST?30:600)})}
function renderTahmin(r){state.ix=0;state.faz=0;state.tahmin=null;state.not='';tahminCiz(r)}

/* ===== ÖZ DENETİM =====
   Her yazma/düzeltme/yönerge turunun örnek cevabı kendi ölçütlerini geçiyor mu?
   Motorla birlikte taşındığı için içerik eklendikçe kural setiyle birlikte
   sınanır; koşumdaki opak "zaman aşımı" hatalarını önler.
   Kullanım: konsolda __TEST__.olcutDenetimi()  */
window.__TEST__={
 olcutDenetimi(){
  const kusur=[];
  Object.keys(GAMES).forEach(id=>GAMES[id].rounds.forEach((r,ti)=>{
   const et=id+' tur'+(ti+1), c=r.ornekCevap||'';
   if(r.kind==='yaz'||r.kind==='duzelt'){
    if(!c)return kusur.push(et+': ornekCevap yok');
    const eksik=(r.kind==='yaz'?olcutDurum(r,c)
      :(r.denetim||[]).map(x=>({ad:x.ad,tam:new RegExp(x.desen,x.bayrak||'').test(kesmeDuz(c))})))
      .filter(x=>!x.tam).map(x=>x.ad);
    if(eksik.length)kusur.push(et+' ['+kelimeSay(c)+' sözcük]: '+eksik.join(' | '));
    (r.yasak||[]).forEach(y=>{
     if(sadelestir(c)===sadelestir(y)||sadelestir(c).includes(sadelestir(y)))
      kusur.push(et+': ornekCevap yasak metni içeriyor')});
    if(r.kind==='duzelt'&&r.sozcukKorunsun!==false&&sadelestir(c)!==sadelestir(r.hatali))
     kusur.push(et+': sözcük kilidi ihlali');
   }
   if(r.kind==='yonerge')r.adimlar.forEach((a,ai)=>{
    if(!new RegExp(a.desen,a.bayrak||'i').test(kesmeDuz(a.ornekCevap||'')))
     kusur.push(et+' adım'+(ai+1)+': ornekCevap deseni geçmiyor')});
   if(r.kind==='dikte')r.sozcukler.forEach(sz=>{
    const havuz=sz.t.split('').concat(sz.celdirici||[]);
    sz.t.split('').forEach(ch=>{if(havuz.indexOf(ch)<0)kusur.push(et+': harf havuzunda yok "'+ch+'"')})});
  }));
  return {oyun:Object.keys(GAMES).length,kusur};
 }};
