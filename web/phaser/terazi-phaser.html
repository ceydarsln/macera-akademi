<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kozmik Tahterevalli — Phaser 3</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#140f24; overflow:hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action:none; }
  #oyun { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="oyun"></div>
<script>
/* =====================================================================
   KOZMİK TAHTEREVALLİ — Phaser 3
   (mekanik: tiltBalance + balanceScale · 5 + 2 = 7 oyun)
   ---------------------------------------------------------------------
   Kazanım: MAT.3.2.8.b / c — Aynı sonucu veren dört işlemi eşitliğin
   anlamını kullanarak ifade eder, eşitliği yorumlar.

   NOT — iki mekanik tek şablon:
   tiltBalance "sağ kefeye eşit değerde işlem koy", balanceScale ise
   "iki kefeyi karşılaştır / eksiği tamamla" mantığıydı. İkisinin
   ortak çekirdeği aynı: kefelerin DEĞERİ eşitlenince terazi dengeye
   gelir. Şablon değer karşılaştırmasını yürüttüğü için her iki içerik
   tipiyle de çalışır.

   Sahneler : Boot → Menu → Game → GameOver
   Fizik    : Arcade.
              · Blok sürükleyip bırakılınca kefeye YERÇEKİMİYLE düşer.
              · Terazi kolu kefelerin GERÇEK değer farkına göre eğilir;
                fark büyükse kol dibe vurur, eşitse yataya oturur.
              · Ağır blok kefeden taşıp aşağı savrulur.
   Görsel   : Bütün dokular Graphics ile çalışma anında üretilir —
              uygulama çevrimdışı kabukta (APK / iOS) çalışacağı için
              dışarıdan resim çekilmiyor.
   ===================================================================== */

const EN = 480, BOY = 800;

const RENK = {
  uzayUst : 0x1b1533,
  uzayAlt : 0x3a2d5e,
  dogru   : 0x34c47b,
  yanlis  : 0xf07575,
  kol     : 0x8d99ae,
  kefe    : 0xbfaeff,
  blok    : 0xfdfbff,
  vurgu   : 0xffd166
};

/* ---------------- uygulama köprüsü ----------------
   Uygulamanın içine iframe olarak gömüldüğünde adres  terazi.html#oyun=w23
   biçiminde olur. Sayfa uygulamayla AYNI kaynaktan sunulduğu için üst
   pencereden katalog verisi doğrudan okunabiliyor. Böylece 5 tiltBalance +
   2 balanceScale oyununun hepsi bu tek şablonla oynanıyor. Kazanınca
   completeGame() çağrılır; XP, altın, kutlama ve sıradaki oyuna geçiş
   uygulamada kalır.
   Köprü yoksa (dosya tek başına açıldıysa) örnek içerik oynanır.        */
const KOPRU = (function(){
  try{
    const p = new URLSearchParams(location.hash.slice(1));
    const id = p.get('oyun');
    if (id && window.parent && window.parent !== window &&
        typeof window.parent.getGame === 'function'){
      const g = window.parent.getGame(id);
      if (g && g.cfg) return {
        oyun: g, cfg: g.cfg,
        bitir(mesaj, puan){ try{ window.parent.completeGame(mesaj || '', puan); }catch(e){} },
        /* Turun kendi metnini uygulamanın sesiyle okutur (Piper). */
        oku(metin){ try{ if (window.parent.oku) window.parent.oku(metin); }catch(e){} },
        /* Kaybetme ekranından: bu oyunu bırak, sıradakine geç. */
        atla(){ try{ if (window.parent.sonrakiOyunaGec) window.parent.sonrakiOyunaGec(); }catch(e){} }
      };
    }
  }catch(e){ /* çapraz kaynak engeli: tek başına oynanır */ }
  return null;
})();

/* HTML varlıklarını çöz: katalogda "Pay &lt; payda" gibi yazımlar var,
   çözülmezse ekranda "&lt;" olarak görünüyor ve öyle okunuyor. */
function varlikCoz(m){
  return String(m)
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
    .replace(/&hellip;/gi, '…').replace(/&mdash;/gi, '—').replace(/&ndash;/gi, '–')
    .replace(/&times;/gi, '×').replace(/&divide;/gi, '÷').replace(/&deg;/gi, '°')
    .replace(/&rarr;/gi, '→').replace(/&larr;/gi, '←')
    .replace(/&amp;/gi, '&');            /* en sona: çift çözmeyi önler */
}

function duzMetin(x){
  return varlikCoz(String(x == null ? '' : x).replace(/<br\s*\/?>/gi,' ')
    .replace(/<[^>]+>/g,'')).replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
}

const VARSAYILAN = {   /* şablon tek başına açıldığında: uygulamadaki w23 */
  instruction:'Kozmik teraziyi dengele! <b>Eşittir</b> bir sonuç değil, <b>iki tarafın eşit değerde</b> olduğunu gösterir ⚖️',
  leftTitle:'SOL KEFE', rightTitle:'SAĞ KEFE', unitEmoji:'⭐',
  rounds:[
    {prompt:'⚖️ Sol kefede <b>8 × 3</b> var. Sağ kefeye <b>aynı değerde</b> bir işlem koy!',
     leftLabel:'8 × 3', leftValue:24,
     blocks:[{id:'b1',label:'15 + 9',value:24},{id:'b2',label:'12 + 10',value:22},
             {id:'b3',label:'30 − 6',value:24},{id:'b4',label:'20 + 6',value:26},
             {id:'b5',label:'6 × 4',value:24}],
     overHint:'Bu blok çok ağır! 8 × 3 = 24 · Daha küçük bir değer dene ⚖️',
     okMsg:'Denge sağlandı! ⚖️✨',
     revealHtml:'Sayılar ve işlemler farklı olsa da <b>değerleri aynı</b> olduğu için eşitlik sağlandı ✨'}
  ],
  tip:'⚖️ “=” işareti iki tarafın <b>eşit değerde</b> olduğunu söyler.',
  successMsg:'Denge ustası! Eşittir işaretinin “iki taraf eşit değerde” anlamına geldiğini kavradın ⚖️'
};

const CFG = KOPRU ? KOPRU.cfg : VARSAYILAN;

/* ---------------------------------------------------------------------
   İÇERİK — katalogdaki iki terazi mekaniği
   ---------------------------------------------------------------------
   tiltBalance  : cfg.rounds[{prompt, leftLabel, leftValue, rightStart,
                  blocks[{label,value,repeat}], overHint, okMsg, revealHtml}]
   balanceScale : cfg.compare{leftCount,rightCount,emoji,question,options,
                  correct} + cfg.equalize{leftVal,rightStart,unitLabel,
                  resultEquation}
                  → compare bir SORU aşaması, equalize ise "birer birer
                    ekleyerek eşitle" turu (tekrarlanabilir 1 değerli blok).

   İKİ MOD:
   · "seç"     — kefeye TEK blok konur, değeri sol kefeye eşit olmalı
                 (w23 / p24: 24 eden işlemi bul).
   · "biriktir"— bloklar ÜST ÜSTE eklenir, toplam sol değere ulaşmalı
                 (w45 / p54 / h40: +1'leri ekle; ya da 8+5+9 = 22).
   Mod veriden çıkarılıyor: başlangıç değeri varsa, tekrarlanan blok varsa
   ya da tek başına sol değere eşit blok YOKSA biriktirme turudur.
   ------------------------------------------------------------------- */
const OYUN_ADI = KOPRU ? duzMetin(KOPRU.oyun.title) : 'KOZMİK\nTAHTEREVALLİ';
const OYUN_EMO = KOPRU ? (KOPRU.oyun.emo || '⚖️') : '⚖️';
const TALIMAT  = duzMetin(CFG.instruction) || 'Kefeleri eşit değere getir';
const IPUCU    = duzMetin(CFG.tip) ||
  'Eşittir bir sonuç değil, iki tarafın eşit değerde olduğunu gösterir.';
const BASARI   = duzMetin(CFG.successMsg) ||
  'Denge kuruldu! İki tarafın eşit değerde olması gerektiğini gösterdin ⚖️';
const SOL_AD   = duzMetin(CFG.leftTitle)  || 'SOL KEFE';
const SAG_AD   = duzMetin(CFG.rightTitle) || 'SAĞ KEFE';
const BIRIM    = CFG.unitEmoji || (CFG.equalize && CFG.equalize.unitLabel) || '⭐';
const BASLIK_KISA = 'DENGE TERAZİSİ';

function turCevir(r){
  const solDeger = Number(r.leftValue) || 0;
  const bas      = Number(r.rightStart) || 0;
  const bloklar  = (r.blocks || []).map(b => ({
    etiket: duzMetin(b.label) || String(b.value),
    deger:  Number(b.value) || 0,
    tekrar: !!b.repeat
  })).filter(b => b.deger > 0);
  /* Tek hamlede eşitleyen blok var mı? Yoksa biriktirme turudur. */
  const tekHamle = bloklar.some(b => !b.tekrar && b.deger === solDeger);
  const biriktir = bas > 0 || bloklar.some(b => b.tekrar) || !tekHamle;
  return {
    gorev: duzMetin(r.prompt),
    seslen: duzMetin(r.say) || duzMetin(r.prompt),
    solEtiket: duzMetin(r.leftLabel) || String(solDeger),
    solDeger: solDeger,
    sagBaslangic: bas,
    biriktir: biriktir,
    bloklar: bloklar,
    agirIpucu:  duzMetin(r.overHint) || 'Fazla oldu — sol kefeyi geçtin ⚖️',
    hafifIpucu: duzMetin(r.underHint) || 'Bu kadarı yetmiyor — sol kefe hâlâ ağır ⚖️',
    tamam: duzMetin(r.okMsg) || 'Denge sağlandı! ⚖️',
    aciklama: duzMetin(r.revealHtml),
    okuAciklama: duzMetin(r.revealSay),
    soru: null
  };
}

const TURLAR = (function(){
  /* tiltBalance */
  if (Array.isArray(CFG.rounds) && CFG.rounds.length)
    return CFG.rounds.map(turCevir).filter(t => t.solDeger > 0 && t.bloklar.length);

  /* balanceScale: compare (soru) + equalize (birer birer ekle) */
  const e = CFG.equalize || {};
  const solDeger = Number(e.leftVal) || 0;
  const bas      = Number(e.rightStart) || 0;
  const birim    = e.unitLabel || BIRIM;
  const k        = CFG.compare;
  const tur = {
    gorev: TALIMAT,
    seslen: duzMetin(CFG.speak) || TALIMAT,
    solEtiket: String(solDeger) + ' ' + birim,
    solDeger: solDeger,
    sagBaslangic: bas,
    biriktir: true,
    bloklar: [{ etiket: birim + ' +1', deger:1, tekrar:true }],
    agirIpucu:'Fazla oldu! Sol kefeyi geçtin — bir tane geri al ⚖️',
    hafifIpucu:'Henüz eşit değil — bir tane daha ekle ⚖️',
    tamam: duzMetin(e.resultEquation) || 'İki kefe eşit! ⚖️',
    aciklama: duzMetin(e.resultEquation),
    okuAciklama: '',
    soru: (k && k.question && Array.isArray(k.options) && k.options.length) ? {
      metin: duzMetin(k.question),
      /* Katalogda seçenekler düz metin dizisi, doğru cevap ayrı alanda. */
      secenekler: k.options.map(o => ({
        etiket: duzMetin(o),
        dogru: duzMetin(o) === duzMetin(k.correct)
      }))
    } : null
  };
  if (solDeger <= 0) return [];
  return [tur];
})();

const CAN_SAYISI = 3;

/* --- Yerleşim -------------------------------------------------------- */
const DIREK_X   = EN / 2;
const KOL_Y     = 306;      /* terazi kolunun ekseni */
const KOL_YARIM = 148;      /* kolun yarı uzunluğu */
const KEFE_EN   = 152;
const AZAMI_ACI = 17;       /* kolun azami eğim açısı (derece) */
const RAF_Y     = 574;      /* blok rafı */

/* =====================================================================
   1) BOOT — dokuları üret
   ===================================================================== */
class BootScene extends Phaser.Scene {
  constructor(){ super('Boot'); }

  create(){
    this.dokuKivilcim();
    this.dokuToz();
    /* Uygulama içinde çocuk oyunu listeden zaten seçti; menüyü atla. */
    this.scene.start(KOPRU ? 'Game' : 'Menu');
  }

  dokuKivilcim(){
    const g = this.make.graphics({ add:false });
    g.fillStyle(0xffffff, 1);
    g.fillCircle(8, 8, 8);
    g.generateTexture('kivilcim', 16, 16);
    g.destroy();
  }

  dokuToz(){
    const g = this.make.graphics({ add:false });
    for (let r = 14; r > 0; r--){
      g.fillStyle(0xffffff, 0.06);
      g.fillCircle(14, 14, r);
    }
    g.generateTexture('toz', 28, 28);
    g.destroy();
  }
}

/* =====================================================================
   Ortak yardımcılar
   ===================================================================== */
function uzayCiz(sc){
  const g = sc.add.graphics();
  g.fillGradientStyle(RENK.uzayUst, RENK.uzayUst, RENK.uzayAlt, RENK.uzayAlt, 1);
  g.fillRect(0, 0, EN, BOY);

  for (let i = 0; i < 40; i++){
    const s = sc.add.circle(
      Phaser.Math.Between(4, EN - 4),
      Phaser.Math.Between(4, BOY - 4),
      Phaser.Math.FloatBetween(1, 2.4),
      0xffffff,
      Phaser.Math.FloatBetween(0.15, 0.8)
    );
    sc.tweens.add({
      targets:s, alpha:0.05,
      duration:Phaser.Math.Between(900, 2400),
      yoyo:true, repeat:-1, delay:Phaser.Math.Between(0, 1800)
    });
  }
  return g;
}

function dugmeYap(sc, x, y, metin, renk, geriCagri, genislik, yukseklik){
  const W = genislik || 280, H = yukseklik || 60;
  const c = sc.add.container(x, y);
  const g = sc.add.graphics();
  g.fillStyle(renk, 1);
  g.fillRoundedRect(-W / 2, -H / 2, W, H, Math.min(H / 2, 26));
  g.fillStyle(0xffffff, 0.16);
  g.fillRoundedRect(-W / 2, -H / 2, W, H * 0.4, { tl:Math.min(H / 2, 26), tr:Math.min(H / 2, 26), bl:0, br:0 });
  const t = sc.add.text(0, 0, metin, {
    fontFamily:'system-ui, sans-serif', fontSize: H > 52 ? '20px' : '17px',
    fontStyle:'bold', color:'#ffffff', align:'center'
  }).setOrigin(0.5);
  c.add([g, t]);
  c.setSize(W, H).setInteractive({ useHandCursor:true });
  c.on('pointerover', () => sc.tweens.add({ targets:c, scale:1.05, duration:110 }));
  c.on('pointerout',  () => sc.tweens.add({ targets:c, scale:1.00, duration:110 }));
  c.on('pointerdown', () => sc.tweens.add({
    targets:c, scale:0.93, duration:90, yoyo:true, onComplete:geriCagri
  }));
  return c;
}

/* =====================================================================
   2) MENU
   ===================================================================== */
class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }

  create(){
    uzayCiz(this);

    /* sallanan terazi */
    const g = this.add.graphics().setDepth(6);
    const durum = { a:-10 };
    const ciz = () => {
      g.clear();
      const r = Phaser.Math.DegToRad(durum.a);
      const cx = EN / 2, cy = 214, yar = 108;
      /* direk */
      g.fillStyle(RENK.kol, 1);
      g.fillRoundedRect(cx - 8, cy, 16, 92, 6);
      g.fillRoundedRect(cx - 46, cy + 88, 92, 12, 6);
      /* kol */
      g.lineStyle(9, RENK.kol, 1);
      g.lineBetween(cx - Math.cos(r) * yar, cy - Math.sin(r) * yar,
                    cx + Math.cos(r) * yar, cy + Math.sin(r) * yar);
      /* kefeler */
      [-1, 1].forEach(s => {
        const px = cx + s * Math.cos(r) * yar, py = cy + s * Math.sin(r) * yar;
        g.lineStyle(2, RENK.kefe, 0.8);
        g.lineBetween(px, py, px, py + 26);
        g.fillStyle(RENK.kefe, 0.9);
        g.fillRoundedRect(px - 34, py + 26, 68, 10, 5);
      });
      g.fillStyle(RENK.vurgu, 1);
      g.fillCircle(cx, cy, 7);
    };
    ciz();
    this.tweens.add({
      targets:durum, a:10, duration:1700, yoyo:true, repeat:-1,
      ease:'Sine.easeInOut', onUpdate:ciz
    });

    const baslik = this.add.text(EN / 2, 372, OYUN_ADI, {
      fontFamily:'system-ui, sans-serif', fontSize:'38px', fontStyle:'bold',
      color:'#ffffff', align:'center', lineSpacing:5
    }).setOrigin(0.5);
    this.tweens.add({
      targets:baslik, scale:1.04, duration:1400,
      yoyo:true, repeat:-1, ease:'Sine.easeInOut'
    });

    this.add.text(EN / 2, 452, TALIMAT, {
      wordWrap:{ width:EN - 60 }, lineSpacing:3,
      fontFamily:'system-ui, sans-serif', fontSize:'21px',
      color:'#ded4ff', align:'center', wordWrap:{ width:EN - 60 }
    }).setOrigin(0.5);

    const kart = this.add.graphics();
    kart.fillStyle(0x120e20, 0.92);
    kart.fillRoundedRect(30, 486, EN - 60, 76, 16);
    kart.lineStyle(2, 0x5a4a8a, 1);
    kart.strokeRoundedRect(30, 486, EN - 60, 76, 16);
    this.add.text(EN / 2, 524, IPUCU, {
      fontFamily:'system-ui, sans-serif', fontSize:'17px', fontStyle:'bold',
      color:'#ffd166', align:'center', wordWrap:{ width:EN - 90 }, lineSpacing:4
    }).setOrigin(0.5);

    dugmeYap(this, EN / 2, 626, '▶  BAŞLA', RENK.dogru, () => this.scene.start('Game'));

    this.add.text(EN / 2, 716, `${TURLAR.length} denge  ·  ${CAN_SAYISI} can`, {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', color:'#b3a6dd'
    }).setOrigin(0.5);
  }
}

/* =====================================================================
   3) GAME
   ===================================================================== */
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    this.can   = CAN_SAYISI;
    this.puan  = 0;
    this.seri  = 0;
    this.tur   = 0;
    this.kilit = true;
    this.aci   = -AZAMI_ACI;   /* sol ağır: sol kefe aşağıda */
    this.sagDeger = 0;

    /* Phaser sahne örneğini yeniden kullanır — TEKRAR OYNA'da eski
       nesnelere işaret etmesinler. */
    this.blokNesne = null;
    this.kefedeki  = null;
    this.mesaj     = null;
    /* Kefe etiketleri turuBaslat içinde "yoksa oluştur" mantığıyla
       kuruluyor; sıfırlanmazsa TEKRAR OYNA'da yok edilmiş metne
       setText çağrılıp çöküyordu. */
    this.solYazi   = null;
    this.sagYazi   = null;
    this.kefeBlok  = null;
    this.soruKap   = null;
    this.kefeAdYazi = null;
    this.bosaltDugme = null;

    uzayCiz(this);

    this.kivilcimlar = this.add.particles(0, 0, 'kivilcim', {
      speed:{ min:130, max:340 }, angle:{ min:0, max:360 },
      scale:{ start:0.85, end:0 }, alpha:{ start:1, end:0 },
      lifespan:620, gravityY:300, blendMode:'ADD', emitting:false
    }).setDepth(90);

    this.tozlar = this.add.particles(0, 0, 'toz', {
      speed:{ min:40, max:150 }, angle:{ min:200, max:340 },
      scale:{ start:0.9, end:2 }, alpha:{ start:0.5, end:0 },
      lifespan:660, emitting:false
    }).setDepth(80);

    this.teraziCizim = this.add.graphics().setDepth(8);
    this.dusenler = this.physics.add.group();

    this.arayuzKur();
    this.surukleKur();
    this.turuBaslat();
  }

  /* kefe merkezinin ekran konumu (kol açısına göre) */
  kefeNoktasi(sol){
    const r = Phaser.Math.DegToRad(this.aci);
    const s = sol ? -1 : 1;
    return {
      x: DIREK_X + s * Math.cos(r) * KOL_YARIM,
      y: KOL_Y  + s * Math.sin(r) * KOL_YARIM + 30
    };
  }

  /* ---------- terazi ---------- */
  teraziyiCiz(){
    const g = this.teraziCizim;
    const r = Phaser.Math.DegToRad(this.aci);
    g.clear();

    /* direk ve taban */
    g.fillStyle(RENK.kol, 1);
    g.fillRoundedRect(DIREK_X - 9, KOL_Y, 18, 132, 7);
    g.fillStyle(0x6b7a94, 1);
    g.fillRoundedRect(DIREK_X - 58, KOL_Y + 126, 116, 14, 7);

    /* kol */
    g.lineStyle(11, RENK.kol, 1);
    g.lineBetween(DIREK_X - Math.cos(r) * KOL_YARIM, KOL_Y - Math.sin(r) * KOL_YARIM,
                  DIREK_X + Math.cos(r) * KOL_YARIM, KOL_Y + Math.sin(r) * KOL_YARIM);

    /* kefeler */
    [true, false].forEach(sol => {
      const p = this.kefeNoktasi(sol);
      g.lineStyle(2, RENK.kefe, 0.75);
      g.lineBetween(p.x, p.y - 30, p.x, p.y - 4);
      g.fillStyle(RENK.kefe, 0.92);
      g.fillRoundedRect(p.x - KEFE_EN / 2, p.y - 4, KEFE_EN, 12, 6);
      /* kefe kenarları */
      g.lineStyle(3, RENK.kefe, 0.9);
      g.lineBetween(p.x - KEFE_EN / 2, p.y - 4, p.x - KEFE_EN / 2 - 6, p.y - 22);
      g.lineBetween(p.x + KEFE_EN / 2, p.y - 4, p.x + KEFE_EN / 2 + 6, p.y - 22);
    });

    /* eksen */
    g.fillStyle(RENK.vurgu, 1);
    g.fillCircle(DIREK_X, KOL_Y, 8);

    /* etiketleri kefelerle taşı */
    const sp = this.kefeNoktasi(true), sg = this.kefeNoktasi(false);
    if (this.solYazi) this.solYazi.setPosition(sp.x, sp.y - 44);
    if (this.sagYazi) this.sagYazi.setPosition(sg.x, sg.y - 44);
    if (this.kefeBlok) this.kefeBlok.setPosition(sg.x, sg.y - 20);
    if (this.kefeAdYazi){
      this.kefeAdYazi[0].setPosition(sp.x, sp.y - 68);
      this.kefeAdYazi[1].setPosition(sg.x, sg.y - 68);
    }
  }

  /* Değer farkına göre kolu eğ — GERÇEK oran, kademeli */
  dengeyiTazele(animasyon){
    const t = TURLAR[this.tur];
    const fark = this.sagDeger - t.solDeger;
    /* farkı ±AZAMI_ACI aralığına sıkıştır: sol ağır → negatif açı */
    const oran = Phaser.Math.Clamp(fark / Math.max(6, t.solDeger * 0.5), -1, 1);
    const hedef = -AZAMI_ACI * -oran;   /* sağ ağırsa sağ iner (pozitif) */

    if (!animasyon){ this.aci = hedef; this.teraziyiCiz(); return; }
    this.tweens.add({
      targets:this, aci:hedef, duration:620, ease:'Elastic.easeOut',
      onUpdate:() => this.teraziyiCiz()
    });
  }

  /* ---------- tur ---------- */
  turuBaslat(){
    const t = TURLAR[this.tur];
    this.aktifTur = t;     /* o anki tur — arayüz ve testler buradan okur */
    this.kilit = true;
    /* Katalogda turun sağ kefesi dolu başlayabiliyor (rightStart). */
    this.sagDeger = t.sagBaslangic;
    this.kefedeki = null;
    this.nesil = (this.nesil || 0) + 1;
    if (this.soruKap){ this.soruKap.destroy(); this.soruKap = null; }

    if (this.blokNesne) this.blokNesne.forEach(o => o.destroy());
    this.blokNesne = [];
    this.dusenler.clear(true, true);
    if (this.kefeBlok){ this.kefeBlok.destroy(); this.kefeBlok = null; }

    this.gorevYazi.setText(t.gorev);
    this.gorevYazi.setFontSize(t.gorev.length > 130 ? '15px'
                             : (t.gorev.length > 80 ? '16px' : '18px'));
    this.tweens.add({
      targets:this.gorevYazi, scale:{ from:0.92, to:1 }, duration:280, ease:'Back.easeOut'
    });

    /* kefe etiketleri */
    if (!this.solYazi){
      this.solYazi = this.add.text(0, 0, '', {
        fontFamily:'system-ui, sans-serif', fontSize:'24px', fontStyle:'bold',
        color:'#ffffff', backgroundColor:'#4a3a7d', padding:{ x:10, y:5 }
      }).setOrigin(0.5).setDepth(14);
      this.sagYazi = this.add.text(0, 0, '', {
        fontFamily:'system-ui, sans-serif', fontSize:'21px', fontStyle:'bold',
        color:'#2a2140', backgroundColor:'#ded4ff', padding:{ x:10, y:5 }
      }).setOrigin(0.5).setDepth(14);
    }
    if (!this.kefeAdYazi){
      const stil = { fontFamily:'system-ui, sans-serif', fontSize:'13px',
                     fontStyle:'bold', color:'#b3a6dd' };
      this.kefeAdYazi = [ this.add.text(0, 0, SOL_AD, stil).setOrigin(0.5).setDepth(14),
                          this.add.text(0, 0, SAG_AD, stil).setOrigin(0.5).setDepth(14) ];
    }
    this.solYazi.setText(t.solEtiket + ' = ' + t.solDeger);
    this.sagYazi.setText(this.sagEtiket(t));

    /* Biriktirme turunda geri alma yolu: kefeyi boşalt. Eksik bırakmak
       hata sayılmadığı için can götürmez — yalnız baştan denenir. */
    if (this.bosaltDugme){ this.bosaltDugme.destroy(); this.bosaltDugme = null; }
    if (t.biriktir){
      this.bosaltDugme = dugmeYap(this, EN / 2, RAF_Y - 52, '↺  Kefeyi boşalt',
        0x5a4a8a, () => this.kefeyiBosalt(), 200, 40).setDepth(30);
    }

    /* Blok rafı — karıştırılmış. Tekrarlanabilir tek blok ortada durur. */
    const karisik = t.bloklar.length > 1
      ? Phaser.Utils.Array.Shuffle(t.bloklar.slice()) : t.bloklar.slice();
    const sutunSayisi = Math.min(3, karisik.length);
    karisik.forEach((b, i) => {
      const sut = i % sutunSayisi, sat = Math.floor(i / sutunSayisi);
      const x = EN / 2 + (sut - (sutunSayisi - 1) / 2) * 152;
      const y = RAF_Y + sat * 66;
      this.blokNesne.push(this.blokYap(b, x, y));
    });

    this.dengeyiTazele(false);
    this.arayuzuTazele();
    /* İlk turu uygulama yönergeyle okuyor; sonrakileri burada. */
    if (KOPRU && this.tur > 0 && t.seslen) KOPRU.oku(t.seslen);

    /* balanceScale'de önce karşılaştırma sorusu var. */
    if (t.soru && t.soru.secenekler.length){ this.soruyuGoster(t); return; }
    this.time.delayedCall(340, () => { this.kilit = false; });
  }

  /* Sağ kefenin etiketi: biriktirme turunda çalışan toplam. */
  sagEtiket(t){
    if (!t.biriktir) return this.sagDeger ? String(this.sagDeger) : '?';
    return this.sagDeger + ' / ' + t.solDeger;
  }

  /* ---------- karşılaştırma sorusu (balanceScale · compare) ---------- */
  soruyuGoster(t){
    this.kilit = true;
    const kap = this.add.container(0, 0).setDepth(120);
    kap.add(this.add.rectangle(EN / 2, BOY / 2, EN, BOY, 0x0d0a1a, 0.9));
    kap.add(this.add.text(EN / 2, 250, t.soru.metin, {
      fontFamily:'system-ui, sans-serif', fontSize:'23px', fontStyle:'bold',
      color:'#ffffff', align:'center', wordWrap:{ width:EN - 70 }, lineSpacing:4
    }).setOrigin(0.5));
    const n = t.soru.secenekler.length;
    t.soru.secenekler.forEach((sec, i) => {
      kap.add(dugmeYap(this, EN / 2, 330 + i * 76, sec.etiket, 0x4a3a7d, () => {
        if (!this.soruKap) return;                  /* çift dokunmayı yut */
        if (sec.dogru){
          this.soruKap.destroy(); this.soruKap = null;
          this.soruUyari = null;
          this.kivilcimlar.setParticleTint(RENK.dogru);
          this.kivilcimlar.explode(14, EN / 2, 330 + i * 76);
          this.puanEkle(120, EN / 2, 300);
          this.mesajGoster('Doğru! Elma kartını sağ kefeye sürükleyerek eşitle ⚖️', '#1f6d4a');
          this.time.delayedCall(340, () => { this.kilit = false; });
        } else {
          this.seri = 0; this.can--; this.arayuzuTazele();
          this.cameras.main.shake(200, 0.01);
          this.cameras.main.flash(160, 220, 90, 90);
          if (this.soruUyari && this.soruUyari.active) this.soruUyari.destroy();
          this.soruUyari = this.add.text(EN / 2, 556,
            'Kefelere bir daha bak — hangisi daha çok?', {
              fontFamily:'system-ui, sans-serif', fontSize:'17px', fontStyle:'bold',
              color:'#ffffff', backgroundColor:'#b5453b', padding:{x:12,y:7},
              align:'center', wordWrap:{width:EN-70}
            }).setOrigin(0.5).setDepth(130);
          kap.add(this.soruUyari);
          if (this.can <= 0){
            if (this.soruKap){ this.soruKap.destroy(); this.soruKap = null; this.soruUyari = null; }
            this.time.delayedCall(900, () => this.bitir(false));
          }
        }
      }, 300, 62));
    });
    this.soruKap = kap;
    if (KOPRU) KOPRU.oku(t.soru.metin);
  }

  /* puan ekleme — hem soru hem denge için */
  puanEkle(kazanc, x, y){
    this.seri++;
    const p = kazanc + (this.seri - 1) * 25;
    this.puan += p;
    this.puanYazi.setText('Puan ' + this.puan);
    this.tweens.add({ targets:this.puanYazi, scale:1.4, duration:130, yoyo:true, ease:'Back.easeOut' });
    const u = this.add.text(x, y, '+' + p, { fontFamily:'system-ui, sans-serif',
      fontSize:'27px', fontStyle:'bold', color:'#7ce0a3' }).setOrigin(0.5).setDepth(95);
    this.tweens.add({ targets:u, y:u.y - 50, alpha:0, duration:740,
      ease:'Cubic.easeOut', onComplete:() => u.destroy() });
    return p;
  }

  /* kefeyi turun başlangıç değerine döndür, blokları rafa al */
  kefeyiBosalt(){
    if (this.kilit) return;
    const t = TURLAR[this.tur];
    this.sagDeger = t.sagBaslangic;
    this.sagYazi.setText(this.sagEtiket(t));
    this.blokNesne.forEach(o => {
      o.setVisible(true).setDepth(22);
      const ev = o.getData('ev');
      if (ev) o.setPosition(ev.x, ev.y);
    });
    this.dusenler.clear(true, true);
    this.dengeyiTazele(true);
    this.mesajGoster('Kefe boşaltıldı — baştan dene ⚖️', '#4a3a7d');
  }

  blokYap(b, x, y){
    const c = this.add.container(x, y).setDepth(22);
    const g = this.add.graphics();
    g.fillStyle(RENK.blok, 1);
    g.fillRoundedRect(-68, -25, 136, 50, 11);
    g.lineStyle(2, 0xc9bff0, 1);
    g.strokeRoundedRect(-68, -25, 136, 50, 11);
    /* Katalogda etiketler '🔵 +1 sorumluluk' kadar uzayabiliyor; sabit
       22 punto 136 pikselden taşıyordu. */
    const punto = b.etiket.length > 13 ? 15 : (b.etiket.length > 8 ? 18 : 22);
    const t = this.add.text(0, 0, b.etiket, {
      fontFamily:'system-ui, sans-serif', fontSize:punto + 'px', fontStyle:'bold',
      color:'#2a2140', align:'center', wordWrap:{ width:128 }
    }).setOrigin(0.5);
    c.add([g, t]);
    c.setSize(136, 50);
    c.setData('deger', b.deger);
    c.setData('etiket', b.etiket);
    c.setData('tekrar', !!b.tekrar);
    c.setData('ev', { x, y });
    /* Dokunma alanını Phaser'a bırakıyoruz: Container'a elle
       Rectangle(-W/2,-H/2,…) verilince kaydırma bir kez daha uygulanıyor ve
       alan sola-yukarı kayıyor — nesneyi tutmak için sol üstüne basmak
       gerekiyordu. setSize + argümansız setInteractive() alanı ortalıyor.
       Alan görselden bir miktar geniş: parmak payı. */
    c.setSize(136 + 24, 50 + 24);
    c.setInteractive();
    this.input.setDraggable(c);
    return c;
  }

  /* ---------- sürükleme ---------- */
  surukleKur(){
    this.input.on('dragstart', (p, b) => {
      if (this.kilit) return;
      this.suruklenen = b;
      b.setDepth(70);
      this.tweens.add({ targets:b, scale:1.1, duration:120, ease:'Back.easeOut' });
    });

    this.input.on('drag', (p, b, x, y) => {
      if (this.kilit) return;
      b.x = Phaser.Math.Clamp(x, 74, EN - 74);
      b.y = Phaser.Math.Clamp(y, 200, BOY - 40);
    });

    this.input.on('dragend', (p, b) => {
      if (this.kilit) return;
      this.suruklenen = null;
      this.tweens.add({ targets:b, scale:1, duration:120 });

      const kefe = this.kefeNoktasi(false);
      const yakin = Math.abs(b.x - kefe.x) < KEFE_EN / 2 + 40 &&
                    Math.abs(b.y - kefe.y) < 90;
      if (yakin) this.kefeyeKoy(b);
      else this.eveDon(b);
    });
  }

  eveDon(b){
    const ev = b.getData('ev');
    b.setDepth(22);
    this.tweens.add({ targets:b, x:ev.x, y:ev.y, duration:240, ease:'Back.easeOut' });
  }

  /* ---------- kefeye koy ---------- */
  kefeyeKoy(b){
    const t = TURLAR[this.tur];
    const deger = b.getData('deger');
    this.kilit = true;

    /* GERÇEK FİZİK: blok kefeye düşer */
    const kefe = this.kefeNoktasi(false);
    const dusen = this.physics.add.existing(
      this.add.text(b.x, b.y, b.getData('etiket'), {
        fontFamily:'system-ui, sans-serif', fontSize:'21px', fontStyle:'bold',
        color:'#2a2140', backgroundColor:'#ded4ff', padding:{ x:10, y:5 }
      }).setOrigin(0.5).setDepth(24)
    );
    this.dusenler.add(dusen);
    dusen.body.setAllowGravity(true);
    dusen.body.setVelocity((kefe.x - b.x) * 1.6, 60);
    b.setVisible(false);

    this.time.delayedCall(360, () => {
      if (dusen.active){ this.tozlar.explode(6, kefe.x, kefe.y); dusen.destroy(); }

      /* Biriktirme turunda bloklar üst üste eklenir; seçme turunda
         kefedeki tek blok değişir. */
      const yeni = t.biriktir ? this.sagDeger + deger : deger;
      this.sagDeger = yeni;
      this.sagYazi.setText(t.biriktir ? this.sagEtiket(t)
                                      : (b.getData('etiket') + ' = ' + deger));
      this.dengeyiTazele(true);

      if (yeni === t.solDeger){ this.time.delayedCall(680, () => this.dogru(b)); return; }

      /* Sol kefeyi geçtiyse ya da seçme turunda değeri tutmadıysa hata. */
      if (yeni > t.solDeger || !t.biriktir){
        this.time.delayedCall(700, () => this.yanlis(b, yeni));
        return;
      }

      /* Biriktirme turunda hâlâ eksik: ceza yok, eklemeye devam.
         Tekrarlanabilir blok rafta kalır, tek kullanımlık blok tükenir. */
      this.time.delayedCall(340, () => {
        if (b.getData('tekrar')) b.setVisible(true).setDepth(22);
        this.eveDon(b);
        this.kilit = false;
      });
    });
  }

  dogru(b){
    const t = TURLAR[this.tur];
    this.kilit = true;
    this.kivilcimlar.setParticleTint(RENK.dogru);
    this.kivilcimlar.explode(30, DIREK_X, KOL_Y);
    this.cameras.main.flash(160, 80, 210, 140);
    this.puanEkle(200, DIREK_X, KOL_Y - 60);

    const sonucMetni = t.aciklama && t.aciklama !== t.tamam
      ? (t.tamam + '  ·  ' + t.aciklama) : t.tamam;
    this.mesajGoster(sonucMetni, '#1f6d4a');
    if (KOPRU && t.okuAciklama) KOPRU.oku(t.okuAciklama);
    this.tur++;
    this.arayuzuTazele();

    this.time.delayedCall(2400, () => {
      if (this.tur >= TURLAR.length){ this.bitir(true); return; }
      this.turuBaslat();
    });
  }

  yanlis(b, deger){
    const t = TURLAR[this.tur];
    this.seri = 0;
    this.can--;
    this.arayuzuTazele();

    /* GERÇEK FİZİK: dengesiz blok kefeden savrulur */
    const kefe = this.kefeNoktasi(false);
    const sav = this.physics.add.existing(
      this.add.text(kefe.x, kefe.y - 20, b.getData('etiket'), {
        fontFamily:'system-ui, sans-serif', fontSize:'21px', fontStyle:'bold',
        color:'#2a2140', backgroundColor:'#f0c0c0', padding:{ x:10, y:5 }
      }).setOrigin(0.5).setDepth(26)
    );
    this.dusenler.add(sav);
    sav.body.setAllowGravity(true);
    sav.body.setVelocity(Phaser.Math.Between(60, 200), -340);
    this.tweens.add({ targets:sav, angle:Phaser.Math.Between(-220, 220), duration:800 });

    this.tozlar.explode(14, kefe.x, kefe.y);
    this.cameras.main.shake(240, 0.013);
    this.cameras.main.flash(170, 220, 90, 90);
    this.tweens.add({
      targets:this.canYazi, angle:{ from:-12, to:12 },
      duration:70, yoyo:true, repeat:3,
      onComplete:() => this.canYazi.setAngle(0)
    });

    this.mesajGoster(deger > t.solDeger ? t.agirIpucu : t.hafifIpucu, '#b5453b');

    this.time.delayedCall(1500, () => {
      if (this.can <= 0){ this.bitir(false); return; }
      /* Kefeyi turun başlangıç değerine döndür, BÜTÜN blokları rafa al. */
      this.sagDeger = t.sagBaslangic;
      this.sagYazi.setText(this.sagEtiket(t));
      this.blokNesne.forEach(o => {
        o.setVisible(true).setDepth(22);
        const ev = o.getData('ev');
        if (ev) o.setPosition(ev.x, ev.y);
      });
      this.dengeyiTazele(true);
      this.kilit = false;
    });
  }

  mesajGoster(metin, arka){
    if (this.mesaj) this.mesaj.destroy();
    this.mesaj = this.add.text(EN / 2, 496, metin, {
      fontFamily:'system-ui, sans-serif', fontSize:'17px', fontStyle:'bold',
      color:'#ffffff', backgroundColor:arka,
      padding:{ x:12, y:7 }, align:'center', wordWrap:{ width:EN - 60 }, lineSpacing:3
    }).setOrigin(0.5).setDepth(96).setAlpha(0);
    const t = this.mesaj;
    this.tweens.add({ targets:t, alpha:1, duration:150 });
    this.time.delayedCall(1900, () => {
      if (!t.active) return;
      this.tweens.add({
        targets:t, alpha:0, duration:250,
        onComplete:() => { if (this.mesaj === t) this.mesaj = null; t.destroy(); }
      });
    });
  }

  /* ---------- arayüz ---------- */
  arayuzKur(){
    const serit = this.add.graphics().setDepth(60);
    serit.fillStyle(0x100c1c, 0.97);
    serit.fillRoundedRect(10, 10, EN - 20, 104, 18);

    /* Şeride yönergenin tamamı sığmıyor (tek satır, sarmalsız); orada
       mekaniğin kısa adı, yönerge aşağıda sarmalı yazılıyor. */
    this.add.text(EN / 2, 38, OYUN_EMO + '  ' + BASLIK_KISA, {
      fontFamily:'system-ui, sans-serif', fontSize:'19px', fontStyle:'bold',
      color:'#ffffff'
    }).setOrigin(0.5).setDepth(61);

    this.puanYazi = this.add.text(30, 80, 'Puan 0', {
      fontFamily:'system-ui, sans-serif', fontSize:'20px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0, 0.5).setDepth(61);

    this.canYazi = this.add.text(EN - 30, 80, '', { fontSize:'20px' })
      .setOrigin(1, 0.5).setDepth(61);

    this.ilerlemeYazi = this.add.text(EN / 2, 80, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'19px', fontStyle:'bold',
      color:'#b3a6dd'
    }).setOrigin(0.5).setDepth(61);

    /* Yukarıdan büyüyor: uzun tur metni terazinin koluna binmesin. */
    this.gorevYazi = this.add.text(EN / 2, 122, '', {
      fontFamily:'system-ui, sans-serif', fontSize:'18px', fontStyle:'bold',
      color:'#ffffff', align:'center', wordWrap:{ width:EN - 44 }, lineSpacing:2
    }).setOrigin(0.5, 0).setDepth(61);

    this.arayuzuTazele();
  }

  arayuzuTazele(){
    this.canYazi.setText(
      '❤️'.repeat(Math.max(0, this.can)) +
      '🖤'.repeat(Math.max(0, CAN_SAYISI - this.can))
    );
    this.ilerlemeYazi.setText(`${this.tur} / ${TURLAR.length} denge`);
  }

  bitir(kazandi){
    this.scene.start('GameOver', {
      kazandi, puan:this.puan, can:this.can,
      tur:this.tur, toplam:TURLAR.length
    });
  }

  /* ---------- her kare ---------- */
  update(){
    if (!this.dusenler || !this.dusenler.children) return;
    this.dusenler.getChildren().forEach(d => {
      if (!d.active) return;
      if (d.y > BOY + 60 || d.x < -60 || d.x > EN + 60) d.destroy();
    });
  }
}

/* =====================================================================
   4) GAME OVER
   ===================================================================== */
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }

  init(veri){ this.veri = veri; }

  create(){
    const { kazandi, puan, can, tur, toplam } = this.veri;

    /* Uygulama içindeyken kazanma ekranı uygulamanın kutlamasıdır:
       XP/altın, kutlama ve sıradaki oyuna geçiş orada. */
    if (kazandi && KOPRU){ KOPRU.bitir(BASARI, puan); return; }

    uzayCiz(this);

    const emo = this.add.text(EN / 2, 190, kazandi ? '⚖️' : '💪', { fontSize:'97px' })
      .setOrigin(0.5).setScale(0);
    this.tweens.add({ targets:emo, scale:1, duration:520, ease:'Back.easeOut' });

    this.add.text(EN / 2, 300, kazandi ? 'KOZMİK DENGE!' : 'TEKRAR DENE', {
      fontFamily:'system-ui, sans-serif', fontSize:'35px', fontStyle:'bold',
      color: kazandi ? '#7ce0a3' : '#ffd166', align:'center'
    }).setOrigin(0.5);

    this.add.text(EN / 2, 360,
      kazandi ? BASARI : `${tur} / ${toplam} dengeyi kurdun — bir daha deneyelim mi?`, {
      fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#ded4ff',
      align:'center', wordWrap:{ width:EN - 70 }, lineSpacing:5
    }).setOrigin(0.5);

    const puanYazi = this.add.text(EN / 2, 456, 'Puan 0', {
      fontFamily:'system-ui, sans-serif', fontSize:'42px', fontStyle:'bold',
      color:'#ffd166'
    }).setOrigin(0.5);
    const sayac = { v:0 };
    this.tweens.add({
      targets:sayac, v:puan, duration:900, ease:'Cubic.easeOut',
      onUpdate:() => puanYazi.setText('Puan ' + Math.round(sayac.v))
    });

    this.add.text(EN / 2, 506,
      'Kalan can: ' + (can > 0 ? '❤️'.repeat(can) : '—'), {
      fontFamily:'system-ui, sans-serif', fontSize:'21px', color:'#b3a6dd'
    }).setOrigin(0.5);

    if (kazandi){
      const konfeti = this.add.particles(EN / 2, -20, 'kivilcim', {
        speed:{ min:90, max:260 }, angle:{ min:60, max:120 },
        scale:{ start:0.8, end:0 }, alpha:{ start:1, end:0 },
        lifespan:2000, gravityY:180, quantity:2, frequency:70,
        tint:[0xffd166, 0x7ce0a3, 0xbfaeff, 0xf07575]
      }).setDepth(5);
      this.time.delayedCall(2600, () => konfeti.stop());
    }

    dugmeYap(this, EN / 2, 606, '↻  TEKRAR OYNA', RENK.dogru, () => this.scene.start('Game'));
    /* Çocuk bir oyunda takılıp kalmasın: uygulama içinde sıradakine geç. */
    if (KOPRU)  dugmeYap(this, EN / 2, 684, '⏭  SIRADAKİ OYUN', 0x4a679e, () => KOPRU.atla());
    if (!KOPRU) dugmeYap(this, EN / 2, 684, '☰  MENÜ',        0x5a4a8a, () => this.scene.start('Menu'));
  }
}

/* =====================================================================
   OYUNU BAŞLAT
   ===================================================================== */
/* =====================================================================
   NETLİK — cihazın piksel yoğunluğunda çizim
   ---------------------------------------------------------------------
   Oyun 480x800 mantıksal tuvalde çiziliyordu; telefon bunu 1080 piksele
   büyütünce yazılar ve kenarlar bulanıklaşıyordu. Çözüm: tuvali cihazın
   gerçek piksel sayısında açmak, dünyayı ise kamerayı NETLIK katına
   yakınlaştırarak yine 480x800 koordinatta tutmak. Böylece Graphics ile
   çizilen her şey (kartlar, şeritler, kutular) vektör keskinliğinde,
   yazılar da NETLIK çözünürlüğünde üretiliyor; oyun kodunun tek satırı
   değişmiyor.
   ===================================================================== */
const NETLIK = Math.min(3, Math.max(1, Math.round((window.devicePixelRatio || 1) * 2) / 2));

/* Phaser yazıyı kendi ara tuvaline çiziyor; çözünürlük verilmezse 1x
   üretilip yakınlaştırmada bulanıklaşır. Bütün yazılara varsayılan
   olarak NETLIK veriyoruz. */
(function(){
  const TS = Phaser.GameObjects.TextStyle.prototype;
  const eskiSetStyle = TS.setStyle;
  TS.setStyle = function(style, updateText, setDefaults){
    if (style && style.resolution === undefined) style.resolution = NETLIK;
    return eskiSetStyle.call(this, style, updateText, setDefaults);
  };
})();

/* Tuval NETLIK katına büyüdüğü için Phaser imleç konumunu da o ölçekte
   veriyor (0–960). Oyun koordinatına (0–480) çeviren yardımcı: sürükleme
   olayları zaten dünya koordinatı verdiği için yalnız pointer olaylarında
   kullanılıyor. */
function imlec(p){ return { x: p.x / NETLIK, y: p.y / NETLIK }; }

/* Her sahne başlarken kamerayı NETLIK katına yakınlaştırıp fizik
   dünyasını mantıksal ölçüde tutuyoruz: tuval büyüdü, dünya büyümedi.
   Sahne örnekleri oyun kurulumundan sonra eşzamansız oluştuğu için
   kanca Systems.start üzerine takılıyor — yeniden başlatmalarda da
   kendiliğinden çalışıyor. */
(function(){
  const SS = Phaser.Scenes.Systems.prototype;
  const eskiStart = SS.start;
  SS.start = function(veri){
    const sonuc = eskiStart.call(this, veri);
    const sc = this.scene;
    try{
      if (sc.cameras && sc.cameras.main){
        sc.cameras.main.setZoom(NETLIK);
        sc.cameras.main.centerOn(EN / 2, BOY / 2);
      }
      if (sc.physics && sc.physics.world) sc.physics.world.setBounds(0, 0, EN, BOY);
    }catch(e){ /* netlik ayarı oyunu engellemesin */ }
    return sonuc;
  };
})();

window.OYUN = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'oyun',
  width: EN * NETLIK,
  height: BOY * NETLIK,
  backgroundColor: '#140f24',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 780 } }
  },
  scene: [BootScene, MenuScene, GameScene, GameOverScene]
});
