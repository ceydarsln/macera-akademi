<script>
/* Sınama modunda (?test=1) tarayıcının arka plan sekme kısıntısını aş:
   gizli sekmede setTimeout dakikada bire kadar iniyor ve oyunun kendi
   geçişleri donuyordu. Yalnız kısa gecikmeler için, yalnız testte. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}

'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'t01';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speech=s=>String(s??'').replace(/\+/g,' artı ').replace(/[−–-]/g,' eksi ').replace(/[×x]/g,' çarpı ').replace(/[:÷]/g,' bölü ').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim();
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(speech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}

function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;sonCeza=0;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();/* rAF geri çağrısı bir sonraki karede çalışıyor; gizli sekmede hiç
   çalışmayıp sekme görünür olunca kuyruktan dönüyor. O ana kadar oyun
   bitmişse round() undefined oluyordu. Tur numarası da doğrulanıyor ki
   geciken kare bir önceki turun yönergesini okumasın. */
requestAnimationFrame(()=>{const t=roundIndex,r=round();if(r&&roundIndex===t)speak(r.prompt)})}
function updateStage(){if(!round())return;const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
/* Yönlendirme uyarısı hata değildir: örneği dinlemek ya da ölçüt işaretlemek
   bir ön koşuldur, can götürmemeli. */
function uyar(msg){feedback(msg,true);speak(msg)}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
/* Hızlı çift dokunuş tek hata için iki can götürüyordu; kısa bir ceza
   soğuması hem çocuğun ikinci dokunuşunu hem de yinelenen olayları yutar. */
let sonCeza=0;
function wrong(hint){if(locked||!round())return;
 const simdi=Date.now();if(simdi-sonCeza<550)return;sonCeza=simdi;
 if(!round().noPenalty)lives=Math.max(0,lives-1);feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün. Nesneleri dikkatle incele.');const sc=$('.stage');sc?.classList.remove('shake');void sc?.offsetWidth;sc?.classList.add('shake');if(lives===0){lives=3;setTimeout(render,650)}else $('.lives').innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function good(message){if(locked)return;locked=true;score+=10;const r=round();if(r.successScene){$('#stage').innerHTML=typeof r.successScene==='function'?r.successScene(state):r.successScene;$('#stage').classList.add('success-motion')}feedback(message||r.result||'Doğru!');speak(r.result||message||'Doğru.');setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function C(label,correct=false,value=null){return{label,correct,value}}
function P(id,html,target){return{id,html,target}}
function T(id,html,need=1){return{id,html,need}}
function Q(prompt,scene,choices,result,hint,extra={}){return{kind:'choice',prompt,scene,choices,result,hint,...extra}}
function D(prompt,scene,pieces,targets,result,hint,extra={}){return{kind:'drag',prompt,scene,pieces,targets,result,hint,...extra}}

function gecisBasla(fn,ms){state.gecis=true;ertele(()=>{state.gecis=false;fn()},ms)}
function ertele(fn,ms){const t=roundIndex;setTimeout(()=>{if(roundIndex===t&&!locked)fn()},ms)}
const TRUP=s=>String(s||'').toLocaleUpperCase('tr');
function sadeleştir(s){return String(s||'').toLocaleLowerCase('tr').replace(/[^\wçğıöşü\s]/g,' ').replace(/\s+/g,' ').trim()}
function kelimeSay(s){const t=sadeleştir(s);return t?t.split(' ').length:0}

 'S':'Büyük S: yukarıdan sola dönerek başla, ortada kıvrıl, aşağıda sağa dönerek bitir.',
 's':'Küçük s: aynı kıvrımı küçük yaz; kalem kalkmaz.',
 'D':'Büyük D: aşağı in, sonra üstten alta büyük kemeri çiz.',
 'd':'Küçük d: önce yuvarlağı çiz, sonra sağdaki uzun çizgiyi indir.'
};

/* ortak yardımcı: ses gösterimi ("/a/" gibi) konuşmada bozulmasın */
function sesOku(h){return String(h).replace(/^\/(.*)\/$/,'$1')}
function karistir(liste,tohum){const idx=[...liste.keys()];
 let x=(tohum*2654435761)%2147483647;if(x<=0)x+=2147483646;
 for(let i=idx.length-1;i>0;i--){x=(x*48271)%2147483647;const j=x%(i+1);const t=idx[i];idx[i]=idx[j];idx[j]=t}
 return idx}
/* Seçenekler veri sırasında çizilince doğru cevap ekrandan okunabiliyordu
   (hece kasaları hep ilk iki kutu, doğru anahtar hep ilk anahtar).
   Görünüm sırası tohumlu olarak karıştırılıyor; data-* gerçek dizini taşıdığı
   için doğruluk mantığı ve koşum etkilenmiyor. */
function gorunumSirasi(n,ek){const y=karistir(new Array(n).fill(0),turTohumu(ek));
 if(y.every((v,i)=>v===i))y.push(y.shift());
 return y}
/* Karıştırmak tek başına yetmiyor: doğru parçalar ekranda yan yana ve doğru
   sırada kalırsa cevap yine dizilişten okunuyor. Havuzlarda doğru dizinin
   bitişik olmadığı bir permütasyon aranıyor. */
function gsHavuz(ad,n,dogru,ek){const k='H'+ad+':'+(state.asama||0);
 state._gs=state._gs||{};
 if(state._gs[k]&&state._gs[k].length===n)return state._gs[k];
 let y=null;
 for(let d=0;d<16;d++){
  y=gorunumSirasi(n,(ek||0)+(state.asama||0)*7+d*101);
  const yer=dogru.map(i=>y.indexOf(i));
  const bitisik=yer.every((v,i)=>i===0||v===yer[i-1]+1);
  if(!bitisik)break}
 state._gs[k]=y;return y}
function gs(ad,n,ek){const k=ad+':'+(state.asama||0)+':'+(state.faz||0);
 state._gs=state._gs||{};
 if(!state._gs[k]||state._gs[k].length!==n)state._gs[k]=gorunumSirasi(n,(ek||0)+(state.asama||0)*7);
 return state._gs[k]}
function turTohumu(ek){let t=roundIndex+11+(ek||0);for(const c of String(GAME_ID))t=t*31+c.charCodeAt(0);return t}


/* ===================== ÇİZ: harf yazma (t01) =====================
   Şartname: ilerleme etiketi 'harf' diyecek, üç kılavuz düzeyi olacak,
   büyük ve küçük biçim ayrı çalışılacak, yanlış yön bütün harfi silmeyecek,
   bitişte yazı sesle bağlanacak. */
const IZ_TOL=30;
function yolNoktalari(d,n){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',d);const L=p.getTotalLength(),liste=[];
 for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n);liste.push([q.x,q.y])}
 return liste}
function izUzunluk(d){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);return p.getTotalLength()}
function izHarfKur(h){state.harf=h;
 state.yollar=HARF[h].map(d=>({d,nokta:yolNoktalari(d,d.length>70?8:5),uz:izUzunluk(d)}));
 state.hamle=0;state.adim=0;state.basli=false}
function izKur(r){state.sira=0;state.harfler=r.harfler.slice();state.kilavuz=r.kilavuz;
 state.faz=0;state.not='';izHarfKur(state.harfler[0])}
function izIc(r){const OX=115,OY=40;let ic=`<g transform="translate(${OX},${OY})">`;
 state.yollar.forEach((y,i)=>{const bitti=i<state.hamle;
  const gorunur=state.kilavuz===0||(state.kilavuz===1&&i>=state.hamle);
  if(gorunur&&!bitti)ic+=`<path class="kilavuz" d="${y.d}" stroke="rgba(255,255,255,${state.kilavuz===0?0.85:0.3})" stroke-dasharray="${state.kilavuz===0?'0':'10 12'}"/>`;
  const oran=bitti?1:(i===state.hamle?state.adim/(y.nokta.length-1):0);
  ic+=`<path class="murekkep" id="mur${i}" d="${y.d}" stroke="#ffd63a" stroke-dasharray="${y.uz}" stroke-dashoffset="${(y.uz*(1-oran)).toFixed(1)}"/>`});
 const y=state.yollar[state.hamle];
 if(y){const hedef=y.nokta[state.adim];
  ic+=`<circle id="hedefNokta" class="${state.adim===0?'basla-top':'kn'}" cx="${hedef[0]}" cy="${hedef[1]}" r="${state.adim===0?12:10}" fill="${state.adim===0?'#ffd63a':'rgba(255,214,58,.55)'}" stroke="${state.adim===0?'#8a5725':'#ffd63a'}" stroke-width="3"/>
   <text id="baslaYazi" x="${hedef[0]}" y="${hedef[1]-19}" font-size="11" font-weight="900" fill="#ffd63a" text-anchor="middle" opacity="${state.adim===0?1:0}">BAŞLA</text>`}
 /* uçak yalnız yazım çizgisinin üzerinde: o anki hedef noktanın hizasında */
 if(y){const h=y.nokta[state.adim];
  ic+=`<text x="${h[0]}" y="${h[1]-30}" font-size="20" text-anchor="middle">✈️</text>`}
 return ic+'</g>'}
function izCiz(r){
 if(state.faz===1)return izSesEsle(r);
 const kh=['Kılavuz açık (yoğun nokta)','Kılavuz soluk (yalnız başlangıç-bitiş)','Kılavuz yok (boş satır)'][state.kilavuz];
 $('#stage').innerHTML=`<div class="stack"><div class="sahne-katman" id="izKatman">${sahneSvg(r.sahne,izIc(r),true)}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">${esc(kh)} · harf ${state.sira+1}/${state.harfler.length} (${esc(state.harf)}) · hamle ${Math.min(state.hamle+1,state.yollar.length)}/${state.yollar.length}</div></div>`;
 const sv=$('#izKatman svg');if(!sv)return;
 const cev=e=>{const b=sv.getBoundingClientRect();
  return [(e.clientX-b.left)/b.width*330-115,(e.clientY-b.top)/b.height*230-40]};
 const dokun=e=>{if(!state.basli||!sv.isConnected)return;const p=cev(e),y=state.yollar[state.hamle];if(!y)return;
  const h=y.nokta[state.adim];
  if(Math.hypot(p[0]-h[0],p[1]-h[1])<IZ_TOL)izIlerle(r)};
 sv.onpointerdown=e=>{e.preventDefault();const p=cev(e),y=state.yollar[state.hamle];if(!y)return;
  const h=y.nokta[state.adim];
  if(Math.hypot(p[0]-h[0],p[1]-h[1])<IZ_TOL+10){state.basli=true;sv.setPointerCapture&&sv.setPointerCapture(e.pointerId);izIlerle(r)}
  /* Motor sapması can götürmez: yalnız yön hatırlatılır. */
  else{state.not='Parmağını sarı BAŞLA topundan başlat.';izCiz(r)}};
 sv.onpointermove=dokun;
 sv.onpointerup=()=>{state.basli=false};
 sv.onpointercancel=()=>{state.basli=false};
 $('#task').innerHTML=`<div class="actions"><button class="action" id="izSes">🔊 Yönü dinle</button>
  <button class="action" id="izGeri">↩ Son hamleyi sil</button></div>`;
 $('#izSes').onclick=()=>speak(HARF_YON[state.harf],true);
 /* Şartname: yanlış yönde bütün harf silinmesin, yalnız son bölüm geri alınsın. */
 $('#izGeri').onclick=()=>{if(state.adim>0){state.adim=0;state.not='Son hamle silindi; BAŞLA topundan yeniden çiz.'}
  else if(state.hamle>0){state.hamle--;state.adim=0;state.not='Bir önceki hamleye döndün.'}
  else state.not='Henüz çizilmiş hamle yok.';
  izCiz(r)}}
function izGuncelle(){const y=state.yollar[state.hamle];if(!y)return;
 const oran=state.adim/(y.nokta.length-1),mur=$('#mur'+state.hamle);
 if(mur)mur.setAttribute('stroke-dashoffset',(y.uz*(1-oran)).toFixed(1));
 const h=y.nokta[state.adim],d=$('#hedefNokta'),t=$('#baslaYazi');
 if(d){d.setAttribute('cx',h[0]);d.setAttribute('cy',h[1]);
  d.setAttribute('r',state.adim===0?12:10);d.setAttribute('class',state.adim===0?'basla-top':'kn')}
 if(t){t.setAttribute('x',h[0]);t.setAttribute('y',h[1]-19);t.setAttribute('opacity',state.adim===0?1:0)}}
function izIlerle(r){const y=state.yollar[state.hamle];if(!y)return;
 if(state.adim<y.nokta.length-1){state.adim++;state.not='';izGuncelle();
  if(state.adim===y.nokta.length-1){state.hamle++;state.adim=0;state.basli=false;
   if(state.hamle>=state.yollar.length)return izHarfBitti(r);
   state.not='Bu hamle tamam. Kalemi kaldır, sıradaki BAŞLA topuna geç.';izCiz(r)}}}
function izHarfBitti(r){state.basli=false;
 if(state.sira<state.harfler.length-1){
  state.sira++;feedback(state.harf+' yazıldı');speak(state.harf+' yazıldı. Şimdi '+state.harfler[state.sira]+' harfini yaz.');
  izHarfKur(state.harfler[state.sira]);state.not='Şimdi '+state.harfler[state.sira]+' biçimini yaz.';
  gecisBasla(()=>izCiz(r),FAST?40:800);return}
 if(!r.sesEsle){state.not='Harf tamam!';izCiz(r);return good()}
 state.faz=1;feedback('Harf tamam!');speak('Harfler yazıldı. Şimdi sesi eşleştir.');
 gecisBasla(()=>izSesEsle(r),FAST?40:800)}
function izSesEsle(r){const e=r.sesEsle;
 $('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,'')}
  <div class="hece-kutu">${esc(state.harfler.join(' '))}</div>
  <div class="caption">${esc(state.not||e.gorev)}</div></div>`;
 $('#task').innerHTML=`<div class="actions"><button class="action" id="sesDinle">🔊 Sesi dinle</button></div>
  <div class="nesne-alan">${gs('ses',e.secenekler.length,1).map(i=>e.secenekler[i]).map((c,j)=>`<button class="resim-kart" data-sec="${e.secenekler.indexOf(c)}"><span class="im">${c.im}</span><span class="ad">${state.acik?esc(c.ad):''}</span></button>`).join('')}</div>`;
 $('#sesDinle').onclick=()=>speak(sesOku(e.ses)+' sesi',true);
 $$('[data-sec]').forEach(b=>b.onclick=()=>{const c=e.secenekler[+b.dataset.sec];
  if(!c.correct)return wrong(c.hint||'Bu sözcük '+sesOku(e.ses)+' sesiyle başlamıyor. Sesi bir daha dinle.');
  state.acik=true;state.not=e.result||'';izSesEsle(r);good(e.result)})}
/* koşum yardımcısı: o anki hedef noktanın ekran koordinatı */
function izNoktaEkran(){const sv=$('#izKatman svg');if(!sv)return null;
 const y=state.yollar&&state.yollar[state.hamle];if(!y)return null;
 const b=sv.getBoundingClientRect(),h=y.nokta[state.adim];
 return [b.left+(h[0]+115)/330*b.width, b.top+(h[1]+40)/230*b.height]}
function renderCiz(r){izKur(r);izCiz(r);
 requestAnimationFrame(()=>{const t=roundIndex,rr=round();if(rr&&roundIndex===t)speak(HARF_YON[state.harf])})}

/* ===================== SEPET: sesi işitsel ayırt etme (t02) =====================
   Şartname: ilk turda kelime yazıları görünmez, her nesnenin adı ayrı dinleme
   düğmesiyle çalınır, tekrar dinleme cezasız, baş-orta-son konumu çalışılır. */
function sepetCiz(r){
 const yaziAcik=state.acik||r.yaziAcik;
 const secili=state.secili||[];
 const sepetler=r.sepetler||[{ad:r.sepetAd||'Sepet',im:'🧺'}];
 $('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,'')}
  <div class="nesne-alan">${sepetler.map((s,i)=>`<div class="resim-kart" style="cursor:default;border-style:solid">
    <span class="im">${s.im}</span><span class="ad">${esc(s.ad)}</span>
    <span class="ad">${(state.yerlesen||[]).filter(x=>x.sepet===i).map(x=>r.nesneler[x.n].im).join('')||'…'}</span></div>`).join('')}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div></div>`;
 $('#task').innerHTML=`<div class="nesne-alan">${r.nesneler.map((n,i)=>{
   const bitti=(state.yerlesen||[]).some(x=>x.n===i);
   return `<button class="resim-kart${secili.indexOf(i)>=0?' secili':''}${bitti?' dogru':''}" data-n="${i}" ${bitti?'disabled':''}>
    <span class="im">${n.im}</span><span class="ad">${yaziAcik?esc(n.ad):'🔊'}</span></button>`}).join('')}</div>
  <div class="actions">${sepetler.map((s,i)=>`<button class="action" data-sepet="${i}">${s.im} ${esc(s.ad)}</button>`).join('')}</div>`;
 /* Nesneye dokunmak önce adını çalar; ikinci dokunuş seçer. Böylece
    işitsel karar yazıdan değil sesten veriliyor. */
 $$('[data-n]').forEach(b=>b.onclick=()=>{const i=+b.dataset.n;
  const s=(state.secili||[]).slice(),k=s.indexOf(i);
  if(k<0){s.push(i);speak(r.nesneler[i].ad,true)}else s.splice(k,1);
  state.secili=s;state.not=k<0?'Adını dinledin. Şimdi sepeti seç ya da başka nesneye dokun.':'';sepetCiz(r)});
 $$('[data-sepet]').forEach(b=>b.onclick=()=>{const sp=+b.dataset.sepet;
  const s=state.secili||[];
  if(!s.length)return uyar('Önce bir nesneye dokunup adını dinle.');
  const yanlis=s.find(i=>r.nesneler[i].sepet!==sp);
  if(yanlis!=null){const n=r.nesneler[yanlis];
   state.secili=[];state.not=n.hint||'“'+n.ad+'” sözcüğünü bir daha dinle: aradığın ses var mı?';
   sepetCiz(r);speak(n.ad,true);return wrong(state.not)}
  state.yerlesen=(state.yerlesen||[]).concat(s.map(i=>({n:i,sepet:sp})));
  state.secili=[];state.not='Sepete girdi.';sepetCiz(r);
  if(state.yerlesen.length>=r.nesneler.length){state.acik=true;state.not=r.result||'';sepetCiz(r);good()}})}
function renderSepet(r){state.secili=[];state.yerlesen=[];state.acik=false;state.not='';sepetCiz(r)}

/* ===================== KONUM: sesin baş-orta-son yeri (t02 tur 2) ===================== */
function konumCiz(r){const i=state.ix||0,n=r.nesneler[i];
 if(!n)return;
 $('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,'')}
  <div class="nesne-alan"><div class="resim-kart" style="cursor:default;border-style:solid"><span class="im">${n.im}</span>
   <span class="ad">${state.acik?esc(n.ad):'🔊'}</span></div></div>
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">${i+1}/${r.nesneler.length}</div></div>`;
 $('#task').innerHTML=`<div class="actions"><button class="action" id="adDinle">🔊 Adını dinle</button></div>
  <div class="serit">${['Başta','Ortada','Sonda'].map((k,j)=>`<button data-k="${j}">${k}</button>`).join('')}</div>`;
 $('#adDinle').onclick=()=>speak(n.ad,true);
 $$('[data-k]').forEach(b=>b.onclick=()=>{const j=+b.dataset.k;
  if(j!==n.konum){state.not=n.hint||'“'+n.ad+'” sözcüğünü yavaşça dinle: '+sesOku(r.ses)+' sesi neredeydi?';
   konumCiz(r);speak(n.ad,true);return wrong(state.not)}
  state.acik=true;state.not='Doğru: '+n.ad+' sözcüğünde '+sesOku(r.ses)+' sesi '+['başta','ortada','sonda'][j]+'.';
  konumCiz(r);
  if(i+1>=r.nesneler.length)return gecisBasla(()=>good(),FAST?40:700);
  gecisBasla(()=>{state.ix=i+1;state.acik=false;state.not='';konumCiz(r)},FAST?40:800)})}
function renderKonum(r){state.ix=0;state.acik=false;state.not='';konumCiz(r)}

/* ===================== BALON: büyük-küçük harf ayırt etme (t03) =====================
   Şartname: gerçek baloncuk, sepet/kova yok, iki yazı biçimi ve iki boyut,
   süre baskısı yok, yanlışta iki harf yan yana büyütülerek karşılaştırılıyor. */
const YAZIM=['ui-rounded, "Trebuchet MS", system-ui, sans-serif','Georgia, "Times New Roman", serif'];
function balonCiz(r){
 const patlak=state.patlak||[];
 $('#stage').innerHTML=`<div class="stack">${sahneSvg('bubbles','')}
  ${state.kars?`<div class="nesne-alan"><div class="resim-kart" style="cursor:default;border-style:solid"><span class="im" style="font-size:46px">${esc(state.kars[0])}</span><span class="ad">seçtiğin</span></div>
   <div class="resim-kart" style="cursor:default;border-style:solid"><span class="im" style="font-size:46px">${esc(state.kars[1])}</span><span class="ad">aranan</span></div></div>`:''}
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">Patlatılan: ${patlak.length}/${r.baloncuklar.filter(b=>b.dogru).length}</div></div>`;
 $('#task').innerHTML=`<div class="nesne-alan">${r.baloncuklar.map((b,i)=>{
   const bitti=patlak.indexOf(i)>=0;
   const st=`font-family:${YAZIM[b.yazim||0]};font-size:${b.buyuk?40:26}px`;
   return `<button class="resim-kart${bitti?' dogru':''}" data-b="${i}" ${bitti?'disabled':''}
     style="border-radius:50%;width:74px;height:74px;justify-content:center;background:radial-gradient(circle at 34% 30%,#ffffff,#cfeaf8 60%,#9fd2ee)">
    <span class="im" style="${st}">${bitti?'💥':esc(b.h)}</span></button>`}).join('')}</div>`;
 $$('[data-b]').forEach(el=>el.onclick=()=>{const i=+el.dataset.b,b=r.baloncuklar[i];
  if(!b.dogru){state.kars=[b.h,r.hedefler[0]];
   state.not=b.hint||'“'+b.h+'” ile “'+r.hedefler[0]+'” biçimlerini karşılaştır: çizgileri aynı mı?';
   balonCiz(r);return wrong(state.not)}
  state.patlak=(state.patlak||[]).concat(i);state.kars=null;state.not='Patladı!';
  speak(sesOku(r.ses));balonCiz(r);
  if(state.patlak.length>=r.baloncuklar.filter(x=>x.dogru).length){state.not=r.result||'';balonCiz(r);good()}})}
function renderBalon(r){state.patlak=[];state.kars=null;state.not='';balonCiz(r)}


/* Bazı turlar şartnamede birden çok kurulum istiyor (ör. "NA açık ve AN kapalı
   karşılaştırılır"). Aşama listesi bunu tek turda sırayla yürütüyor. */
function asama(r){return (r.asamalar&&r.asamalar[state.asama||0])||r}
function asamaSayisi(r){return r.asamalar?r.asamalar.length:1}
function asamaIlerle(r,devam){
 if((state.asama||0)+1>=asamaSayisi(r))return gecisBasla(()=>good(),FAST?40:700);
 gecisBasla(()=>{state.asama=(state.asama||0)+1;devam()},FAST?40:800)}

/* ===================== TREN: sesleri birleştirip hece kurma (t04) =====================
   Şartname: gerçek lokomotif ve vagonlar, hedef hece başta yazılı değil,
   sesler soldan sağa kesintisiz kaynaşıyor, açık/kapalı etiketi çocuk seçiyor. */
function trenCiz(r){const a=asama(r);
 const yer=state.yer||[null,null];
 $('#stage').innerHTML=`<div class="stack">${sahneSvg('wagons','')}
  <div class="vagon-alan"><span style="font-size:30px">🚂</span>
   ${yer.map((v,i)=>`<div class="vagon${v!=null?' dolu':''}${yer.indexOf(null)===i?' aktif':''}">${v!=null?esc(a.sesler[v]):'…'}</div>`).join('<span style="font-size:15px;color:#5b7185">→</span>')}</div>
  ${state.kuruldu?`<div class="hece-kutu">${esc(state.kuruldu)}</div>`:''}
  <div class="caption">${esc(state.not||a.gorev||r.gorev)}</div>
  <div class="caption">Vagon dizisi ${(state.asama||0)+1}/${asamaSayisi(r)}</div></div>`;
 if(state.faz===1){
  $('#task').innerHTML=`<div class="caption">Kurduğun hece hangi sesle bitiyor?</div>
   <div class="choices"><button class="choice" data-tip="acik">Ünlüyle bitiyor · AÇIK hece</button>
    <button class="choice" data-tip="kapali">Ünsüzle bitiyor · KAPALI hece</button></div>`;
  $$('[data-tip]').forEach(b=>b.onclick=()=>{
   if(b.dataset.tip!==a.tip)return wrong('Hecenin SON sesini söyle: ünlü mü, ünsüz mü?');
   state.not=a.sonuc||'';trenCiz(r);
   asamaIlerle(r,()=>{state.yer=[null,null];state.faz=0;state.kuruldu='';state.not='';trenCiz(r)})});
  return}
 $('#task').innerHTML=`<div class="actions"><button class="action" id="hedefDinle">🔊 Heceyi dinle</button>
   <button class="action" id="vagonGeri">↩ Son vagonu çıkar</button></div>

 $('#hedefDinle').onclick=()=>speak(a.hedefSes,true);
