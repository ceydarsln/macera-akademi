.kart-islem{background:#fff;border:3px solid #cbd5e1;border-radius:11px;padding:6px 10px;font-weight:950;font-size:16px;color:#1f3b52;cursor:pointer}
.kart-islem.dogru{background:#e7f7ec;border-color:#2f9e5e}
.kart-islem.yanlis{background:#fde8e8;border-color:#e05555;opacity:.6}
.tepsi{display:inline-grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#c9a86a;border:3px solid #8a5725;border-radius:8px;padding:3px;margin:2px}
.tepsi span{font-size:13px;line-height:1}
.tekler{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:290px}
.tekler span{font-size:15px;line-height:1}
.sayac-kart{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.kup-svg{touch-action:none;background:#0e1b2e;border:4px solid #3d5a7d;border-radius:14px}
.acinim{display:grid;grid-template-columns:repeat(4,34px);grid-template-rows:repeat(3,34px);gap:3px;justify-content:center}
.acinim i{border:3px solid #7b8ea1;border-radius:5px;background:#f1f4f7;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#5b7185}
.acinim i.acik{background:#ffd873;border-color:#c9922a;color:#6b4a10}
.sekil-svg{touch-action:manipulation}
.kapi{display:flex;flex-direction:column;align-items:center;gap:1px;background:#fff;border:3px solid #cbd5e1;border-radius:11px;padding:5px 7px;cursor:pointer;min-width:74px}
.kapi b{font-size:13px;font-weight:950;color:#1f3b52}
.kapi small{font-size:10px;font-weight:800;color:#5b7185}
.grid-dot{fill:#8fa8bd}
.grid-dot.secili{fill:#e95e77}
.olcum-kart{background:#fff;border:3px solid #cbd5e1;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:900;color:#1f3b52}
.cetvel{position:relative;height:34px;background:#f7e6b8;border:3px solid #b9945c;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.cetvel i{flex:1;border-left:2px solid #8a5725;height:11px;position:relative}
.cetvel i:nth-child(5n+1){height:20px}
.cetvel i b{position:absolute;top:-13px;left:2px;font-size:8px;font-weight:900;color:#6b4a22}
.ip-cizgi{stroke:#e05555;stroke-width:5;fill:none;stroke-linecap:round}
.surahi{position:relative;border:5px solid #7b8ea1;border-top:0;border-radius:0 0 14px 14px;background:rgba(255,255,255,.6);overflow:hidden}
.su{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7fc6e8,#3f92c4);transition:height .18s}
.derece{position:absolute;left:0;right:0;border-top:2px dashed #6b7a8f;font-size:9px;font-weight:900;color:#42586d;text-align:right;padding-right:3px}
.tahmin-cizgi{position:absolute;left:-4px;right:-4px;border-top:4px dashed #e08b2a;cursor:grab}
.litre-kap{width:34px;height:44px;border:3px solid #7b8ea1;border-top:0;border-radius:0 0 8px 8px;background:#eef6fb;display:flex;align-items:flex-end}
.litre-kap i{display:block;width:100%;height:0;background:#3f92c4;transition:height .2s}
.mozaik-svg{touch-action:manipulation;background:repeating-linear-gradient(0deg,#f6f1e7 0 27px,#eee7d8 27px 28px),repeating-linear-gradient(90deg,#f6f1e7 0 27px,#eee7d8 27px 28px);border:4px solid #c9a86a;border-radius:12px}
.parca-btn{background:#fff;border:3px solid #cbd5e1;border-radius:11px;padding:5px 9px;font-weight:900;font-size:13px;color:#1f3b52;cursor:pointer}
.parca-btn.secili{background:#fdf0d0;border-color:#d9b25e}
.parca-btn.bitti{opacity:.4}
.kilim{display:grid;gap:2px;background:#8a5725;padding:4px;border-radius:8px;position:relative}
.kilim .huc{width:30px;height:30px;border-radius:3px;background:#f6ede0;cursor:pointer;position:relative}
.kilim .huc.eksen{box-shadow:inset -2px 0 0 #e05aa0}
.kilim .huc.hayalet{outline:3px dashed #e05aa0;outline-offset:-3px}
.kilim .huc.kaynak{box-shadow:inset 0 0 0 3px #33526b}
.kilim-katla{transform:scaleX(-1);transition:transform .8s}
.palet{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.palet button{width:36px;height:36px;border-radius:9px;border:3px solid #cbd5e1;cursor:pointer}
.palet button.secili{border-color:#33526b;transform:scale(1.1)}
.tahta{display:grid;grid-template-columns:18px repeat(8,32px);gap:1px}
.tahta .kare{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.tahta .kare.acik{background:#f0e0c0}.tahta .kare.koyu{background:#b98b5e}
.tahta .kare.eksen-d{box-shadow:inset -2px 0 0 #e05aa0}
.tahta .kare.eksen-y{box-shadow:inset 0 -2px 0 #e05aa0}
.tahta .etiket{width:18px;height:32px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#5b7185}
.tahta .ust{width:32px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#5b7185}
.secenek-kart{background:#fff;border:3px solid #cbd5e1;border-radius:12px;padding:4px;cursor:pointer}
.secenek-kart.secili{border-color:#e08b2a;background:#fdf6e9}
.kod-izgara{display:grid;gap:2px;background:#8a9aa8;padding:3px;border-radius:8px}
.kod-izgara .kh{width:30px;height:30px;border-radius:4px;background:#eef3f7;display:flex;align-items:center;justify-content:center;font-size:16px}
.kod-izgara .kh.eks-d{box-shadow:inset -2px 0 0 #e05aa0}
.kod-izgara .kh.eks-y{box-shadow:inset 0 -2px 0 #e05aa0}
.kod-izgara .kh.engel{background:#7b8ea1}
.kod-izgara .kh.iz{background:#cfe9d8}
.kod-izgara .kh.refiz{background:#fbe3c8}
.kod-izgara .kh.hedef{background:#ffe08a}
.kod-blok{background:#e3f1fb;border:3px solid #7fb6de;border-radius:8px;padding:3px 8px;font-weight:950;font-size:15px;color:#1f3b52;cursor:pointer}
.kod-blok.ref{background:#fbe3c8;border-color:#e0a55a;cursor:default}
.kod-blok.aktif{background:#ffd873;border-color:#c9922a}
.kod-blok.hata{background:#fde8e8;border-color:#e05555}
.harf-kart{background:#fff;border:4px solid #cbd5e1;border-radius:14px;padding:6px}
.soru-kart{background:#fff;border:4px solid #7fb6de;border-radius:14px;padding:9px 12px;max-width:298px;text-align:center;font-weight:900;font-size:15px;color:#1f3b52}
.kutu-iki{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.kutu-iki button{flex:1 1 130px;background:#fff;border:3px solid #cbd5e1;border-radius:12px;padding:7px 6px;font-weight:900;font-size:12px;color:#1f3b52;cursor:pointer;line-height:1.15}
.anket-sutun{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:3px solid #cbd5e1;border-radius:11px;padding:5px 6px;min-width:88px;cursor:pointer}
.anket-sutun.vurgu{border-color:#2f9e5e;background:#e7f7ec}
.anket-sutun small{font-size:11px;font-weight:900;color:#5b7185}
.cetele-satir{display:flex;align-items:center;gap:7px;background:#fff;border:3px solid #cbd5e1;border-radius:11px;padding:4px 7px;width:min(300px,96%)}
.cetele-satir b{font-size:12px;min-width:64px;color:#1f3b52}
.cetele-satir .yer{min-width:38px;height:32px;border:2px dashed #b7cfe4;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:17px;color:#1f3b52}
.cetele-satir .yer.dolu{border-style:solid;border-color:#2f9e5e;background:#e7f7ec}
.nokta-graf{display:flex;align-items:flex-end;justify-content:center;gap:10px;border-left:4px solid #536878;border-bottom:4px solid #536878;padding:5px 8px;min-height:150px}
.nokta-sutun{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;cursor:pointer;min-width:52px}
.nokta-sutun .nk{width:17px;height:17px;border-radius:50%;background:#3f87b7}
.nokta-sutun .nk.fazla{background:#e05555}
.nokta-sutun small{font-size:11px;font-weight:900;color:#5b7185;margin-top:3px}
.anahtar{background:#eaf2fb;border:3px solid #b7cfe4;border-radius:9px;padding:3px 8px;font-size:12px;font-weight:900;color:#25506f}
.graf-ro{display:flex;align-items:flex-end;justify-content:center;gap:12px;border-left:3px solid #536878;border-bottom:3px solid #536878;padding:4px 7px;min-height:118px}
.graf-ro .st{display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.graf-ro .st span{width:14px;height:14px;border-radius:50%;background:#3f87b7}
.graf-ro .st span.esles{background:#cbd5e1}
.graf-ro .st span.fazla{background:#e08b2a;box-shadow:0 0 0 2px #8a5725}
.graf-ro .st small{font-size:10px;font-weight:900;color:#5b7185;margin-top:3px}
.tus{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center}
.tus button{min-height:44px;border-radius:10px;border:3px solid #cbd5e1;background:#fff;font-weight:950;font-size:19px;color:#1f3b52;cursor:pointer}
.ekran{background:#152f3e;color:#8df0b6;border-radius:10px;padding:5px 14px;font-size:26px;font-weight:950;letter-spacing:2px;min-width:110px;text-align:center}
.iki-panel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.panel-kart{background:#fff;border:3px solid #cbd5e1;border-radius:11px;padding:5px 7px}
.panel-kart h4{margin:0 0 3px;font-size:12px;color:#5b7185}
.asama{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.asama span{font-size:11px;font-weight:900;padding:2px 6px;border-radius:7px;background:#eef3f7;color:#5b7185}
.asama span.aktif{background:#ffd873;color:#6b4a10}
.asama span.bitti{background:#e7f7ec;color:#1f7a45}
/* ===== 4. sınıf sahne parçaları ===== */
/* Sahne kutusu esneyip içeriği kırpıyordu (sayı doğrusu etiketleri kesiliyordu). */
.stage{flex-shrink:0}
.m4-pv-table{display:flex;gap:3px;justify-content:center;flex-wrap:nowrap;width:100%}
.m4-pv-cell{flex:1 1 0;min-width:0;text-align:center;border:2px solid #b9cfe0;border-radius:11px;background:#fff;padding:4px 2px}
.m4-pv-cell.binler{background:#eef4ff;border-color:#7ea6d8}
.m4-pv-cell.birler{background:#fff6e8;border-color:#dcae6b}
.m4-pv-cell b{display:block;font-size:clamp(19px,5.4vw,30px);line-height:1.05;min-height:1.05em}
.m4-pv-cell small{display:block;font-size:9px;font-weight:900;color:#52708b;line-height:1.1}
.m4-pv-cell.hot{outline:4px solid var(--gold);outline-offset:1px}
.m4-pv-cell.err{border-color:var(--bad);background:#ffecef}
.pv-group{display:flex;gap:7px;justify-content:center;width:100%}
.pv-group>div{display:flex;gap:3px}
.pv-sep{align-self:center;font-weight:1000;font-size:22px;color:#7a7687}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;max-width:330px;margin:0 auto}
.keypad button{min-height:46px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 4px 0 rgba(35,77,108,.22);font-size:20px;font-weight:950}
.readout{min-height:44px;border:3px dashed #6e9db9;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.4vw,29px);font-weight:1000;letter-spacing:2px;padding:4px 10px}
.worksteps{display:flex;flex-direction:column;gap:4px;width:100%;max-width:340px;margin:0 auto}
.worksteps div{background:#fff;border:2px solid #cfe0ec;border-radius:11px;padding:5px 9px;font-weight:900;font-size:14px}
.worksteps div.done{background:#e7f8ee;border-color:#68c398}
/* durağan bant: kart karar verilene kadar ORTADA ve TAM görünür */
.belt-rail{width:100%;border-top:5px solid #8b98a3;border-bottom:5px solid #8b98a3;background:repeating-linear-gradient(90deg,#cdd8e0 0 14px,#b3c0ca 14px 17px);padding:10px 6px;display:flex;justify-content:center}
.belt-card{max-width:min(320px,94%);background:#fff;border:3px solid #7fa8c9;border-radius:17px;padding:10px 13px;text-align:center;font-weight:950;font-size:clamp(15px,4vw,21px);box-shadow:0 6px 16px rgba(20,56,82,.18)}
.belt-card small{display:block;font-size:12px;font-weight:800;color:#52708b;margin-top:3px}
.belt-progress{display:flex;gap:4px;justify-content:center;margin-top:6px}
.belt-progress i{width:11px;height:11px;border-radius:50%;background:#c9d6df;border:2px solid #93a6b4}
.belt-progress i.on{background:#68c398;border-color:#2f8f63}
.bins{display:flex;gap:7px;width:100%;justify-content:center;flex-wrap:wrap}
.bin{flex:1 1 100px;min-width:100px;min-height:64px;border:4px solid #6e9db9;border-radius:17px;background:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:950;font-size:15px;line-height:1.12;text-align:center;padding:7px 6px}
.bin b{font-size:23px;display:block;line-height:1}
.bin small{display:block;font-size:11px;font-weight:800;line-height:1.15;color:#52708b}
.bin.bad{border-color:var(--bad);background:#ffecef}
.bin.ok{border-color:var(--ok);background:#e7f8ee}
/* sıra kulesi: sabit yuvalar, kart hareket etmez */
.tower-slots{display:flex;flex-direction:column-reverse;gap:4px;align-items:center;width:100%}
.tower-slot{width:min(280px,92%);min-height:44px;border:3px dashed #6e9db9;border-radius:13px;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:19px;position:relative}
.tower-slot.filled{border-style:solid;background:#fff;border-color:#68c398}
.tower-slot i{position:absolute;left:7px;font-size:11px;font-style:normal;color:#7a7687;font-weight:900}
.tower-arrow{font-size:15px;font-weight:1000;color:#3f6f96}
/* gerçek sayı doğrusu */
.m4-numline{position:relative;width:100%;height:96px;margin:8px 0 4px}
.m4-numline .axis{position:absolute;left:11%;right:11%;top:38px;height:5px;background:#4a6b85;border-radius:3px}
.m4-numline .m4-tick{position:absolute;top:26px;width:3px;height:18px;background:#4a6b85;transform:translateX(-50%)}
.m4-numline .m4-tick.major{height:28px;top:21px;width:5px}
.m4-numline .m4-lab{position:absolute;top:54px;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;max-width:31vw;overflow:hidden;text-overflow:ellipsis}
.m4-numline .mark{position:absolute;top:2px;transform:translateX(-50%);font-size:22px}
.m4-numline .mark small{display:block;font-size:10px;font-weight:900;text-align:center;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:5px;padding:0 3px}
.m4-numline .span{position:absolute;top:44px;height:12px;border-left:3px solid #e0663f;border-right:3px solid #e0663f;border-bottom:3px solid #e0663f}
.m4-numline .span span{position:absolute;left:50%;top:11px;transform:translateX(-50%);font-size:10px;font-weight:900;color:#c0451f;white-space:nowrap}
/* asansör / dikey kuyu */
.shaft{display:flex;flex-direction:column-reverse;gap:2px;align-items:stretch;width:min(230px,90%);margin:0 auto}
.shaft .floor{min-height:26px;border:2px solid #9db4c4;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:2px 8px;font-weight:900;font-size:13px}
.shaft .floor.here{background:#fff2c6;border-color:var(--gold);font-size:15px}
.shaft .floor.trail{background:#e3f1fb}
.shaft .floor.goal{border-color:#2f8f63;border-width:3px}
/* tepsi */
.m4-tray{width:100%;min-height:72px;border:4px solid #c0a06a;border-radius:14px 14px 26px 26px;background:#fffaf0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;padding:8px}
.m4-tray .slotted{background:#fff;border:2px solid #ddc79a;border-radius:11px;padding:4px 8px;font-weight:900;font-size:15px}
.tray-empty{color:#9a8f78;font-weight:900}
/* terazi */
.m4-scale{display:flex;align-items:flex-end;justify-content:center;gap:6px;width:100%}
.m4-pan{flex:1 1 0;min-width:0;border:3px solid #8ea6b8;border-top-width:6px;border-radius:6px 6px 20px 20px;background:rgba(255,255,255,.86);min-height:76px;padding:6px 4px;text-align:center}
.m4-pan b{display:block;font-size:15px}
.m4-pan .units{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px}
.m4-pan .units i{width:13px;height:13px;border-radius:3px;background:#5fb0e0;border:2px solid #2d78ab;font-style:normal}
.m4-pan .units i.red{background:#e8636f;border-color:#a83741}
.scale-mid{font-size:26px;font-weight:1000;padding-bottom:22px}
.m4-scale.tiltL .m4-pan:first-child{transform:translateY(9px)}
.m4-scale.tiltR .m4-pan:last-child{transform:translateY(9px)}
/* simetri ızgarası */
.symgrid{display:grid;gap:2px;margin:0 auto;--c:8}
.symgrid{grid-template-columns:repeat(var(--c),1fr);width:min(300px,94%)}
.symgrid .c{aspect-ratio:1;border:1px solid #b7c9d6;border-radius:3px;background:#fff}
.symgrid .c.src{background:#f2b83f;border-color:#a5751a}
.symgrid .c.put{background:#5fb0e0;border-color:#2d78ab}
.symgrid .c.axis{background:#ffe3ea;border-color:#e88ba1}
.symgrid .c.hint{outline:2px dashed #e0663f}
.sym-tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%}
/* çizim tahtası */
.m4-board{position:relative;margin:0 auto;background:#fff;border:3px solid #b9cfe0;border-radius:14px;touch-action:none}
.m4-board svg{display:block}
.m4-board .dot{fill:#4a6b85}
.m4-board .dot.on{fill:#e0663f}
.draw-info{font-weight:900;font-size:14px;text-align:center;width:100%}
/* kodlama ızgarası */
.codegrid{display:grid;gap:2px;margin:0 auto;width:min(280px,92%)}
.codegrid .cc{aspect-ratio:1;border:1px solid #b7c9d6;background:#fff;border-radius:3px;display:grid;place-items:center;font-size:15px}
.codegrid .cc.on{background:#ffe9a8}
.codegrid .cc.wall{background:#8a94a0}
.codegrid .cc.bot{background:#cdebff}
.m4-program{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:34px;width:100%;background:rgba(255,255,255,.7);border:2px dashed #8ea6b8;border-radius:11px;padding:5px}
.m4-program i{font-style:normal;font-weight:900;background:#fff;border:2px solid #9db4c4;border-radius:8px;padding:2px 7px;font-size:14px}
.m4-program i.run{background:#ffe9a8;border-color:var(--gold)}
/* ölçüm (ip, açıölçer, kâğıt köşesi) */
.measure-wrap{position:relative;margin:0 auto;touch-action:none}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:100%}
.chip{background:#fff;border:2px solid #9db4c4;border-radius:11px;padding:4px 9px;font-weight:900;font-size:14px}
.chip.ok{background:#e7f8ee;border-color:#2f8f63}
.chip.no{background:#ffecef;border-color:var(--bad)}
.note{width:100%;text-align:center;font-size:13px;font-weight:800;color:#3d5a72}
/* eksenli sütun grafiği: sayı etiketleri sütun yükseklikleriyle birebir hizalı */
.m4-grafik{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:6px;width:100%;padding-bottom:34px;margin-top:4px}
.m4-eksen{position:relative;width:20px;flex:0 0 20px;border-right:3px solid #536878}
.m4-eksen span{position:absolute;right:6px;transform:translateY(50%);font-size:11px;font-weight:900;color:#3d5a72;white-space:nowrap}
.m4-eksen i{position:absolute;right:0;width:6px;height:0;border-top:2px solid #98aab8}
.m4-sutunlar{display:flex;align-items:flex-end;justify-content:center;gap:10px;border-bottom:3px solid #536878}
.m4-sutun{position:relative;width:62px;display:flex;align-items:flex-end}
.m4-sutun b{display:block;width:100%;border-radius:9px 9px 0 0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.m4-sutun small{position:absolute;top:100%;left:-9px;right:-9px;padding-top:5px;font-size:11px;font-weight:900;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-dragging{position:relative!important;z-index:999!important;pointer-events:none!important;opacity:.94;box-shadow:0 10px 25px rgba(0,0,0,.28)!important}
.drop-hot,[data-target].hot{filter:drop-shadow(0 0 9px #f1b53a)!important;outline:4px solid #f1b53a!important;outline-offset:3px}

/* Yönerge üçüncü satıra geçtiğinde de tamamı görünür. */
.hud .prompt{max-height:none;overflow:visible;min-width:0;overflow-wrap:break-word}
</style>
<link rel="stylesheet" href="scene-upper-stage.css">
</head>
<body><div id="app" class="app"></div>
<script>
/* Sınama modunda (?test=1) tarayıcının arka plan sekme kısıntısını aş:
   gizli sekmede setTimeout dakikada bire kadar iniyor ve oyunun kendi
   geçişleri donuyordu. Yalnız kısa gecikmeler için, yalnız testte. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}

'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'p01';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* İşaret sözcüğe yalnız SAYILAR arasında çevrilir. Eski kural her ':' işaretini
   'bölü', her '-' işaretini 'eksi' okuyordu; 'ölç: her kenara' yönergesi
   'ölç bölü her kenara', 'Köşe-Kenar' ise 'Köşe eksi Kenar' diye seslendiriliyordu. */
const speech=s=>String(s??'')
 .replace(/(\d)\s*\+\s*(\d)/g,'$1 artı $2')
 .replace(/(\d)\s*[−–-]\s*(\d)/g,'$1 eksi $2')
 .replace(/(\d)\s*[×x]\s*(\d)/g,'$1 çarpı $2')
 .replace(/(\d)\s*[:÷]\s*(\d)/g,'$1 bölü $2')
 .replace(/(\d)\s*=\s*(\d)/g,'$1 eşittir $2')
 .replace(/°/g,' derece')
 .replace(/[:;·•]/g,' ')   /* tilki balonu aynı metni gösterdiği için virgül değil boşluk */
 .replace(/[–—]/g,' ')
 .replace(/\s+/g,' ').trim();
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(speech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}
function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col" data-graph-target="${c.id}"><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col" data-graph-target="${c.id}"><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function eksenliGrafik(cols,birim,enBuyuk){
 const mx=Math.max(enBuyuk||0,...cols.map(c=>c.n),1);
 const B=Math.max(14,Math.min(24,Math.floor(150/mx))),H=mx*B;
 return `<div class="m4-grafik">
  <div class="m4-eksen" style="height:${H}px">${Array.from({length:mx+1},(_,k)=>
    `<i style="bottom:${k*B}px"></i><span style="bottom:${k*B}px">${k}</span>`).join('')}</div>
  <div class="m4-sutunlar" style="height:${H}px">${cols.map(c=>
    `<div class="m4-sutun"><b style="height:${c.n*B}px;background:${c.color||'#e95e77'}"></b>
     <small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div>
 </div>
 <div class="caption" style="font-size:12px">Dikey eksen 1’er artıyor · 1 blok = 1 ${esc(birim||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();requestAnimationFrame(()=>speak(round().prompt))}
function updateStage(){if(!round())return;const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
function wrong(hint){if(locked||!round())return;if(!round().noPenalty)lives=Math.max(0,lives-1);feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün. Nesneleri dikkatle incele.');const sc=$('.stage');sc?.classList.remove('shake');void sc?.offsetWidth;sc?.classList.add('shake');if(lives===0){lives=3;setTimeout(render,650)}else $('.lives').innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function good(message){if(locked)return;locked=true;score+=10;const r=round();if(r.successScene){$('#stage').innerHTML=typeof r.successScene==='function'?r.successScene(state):r.successScene;$('#stage').classList.add('success-motion')}feedback(message||r.result||'Doğru!');speak(r.result||message||'Doğru.');setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function C(label,correct=false,value=null){return{label,correct,value}}
function P(id,html,target){return{id,html,target}}
function T(id,html,need=1){return{id,html,need}}
function Q(prompt,scene,choices,result,hint,extra={}){return{kind:'choice',prompt,scene,choices,result,hint,...extra}}
function D(prompt,scene,pieces,targets,result,hint,extra={}){return{kind:'drag',prompt,scene,pieces,targets,result,hint,...extra}}
function renderRound(){const r=round();if(!r)return;updateStage();const fn={choice:renderChoice,multi:renderMulti,order:renderOrder,drag:renderDrag,process:renderProcess,estimate:renderEstimate,memory:renderMemory,tally:renderTally,graph:renderGraph,slider:renderSlider,basamak:renderBasamak,numpad:renderNumpad,serit:renderSerit,kule:renderKule,sayidogru:renderSayidogru,asansor:renderAsansor,tepsi:renderTepsi,terazi:renderTerazi,ayna:renderAyna,ciz:renderCiz,tara:renderTara,kod:renderKod,ip:renderIp,aci:renderAci}[r.kind];(fn||renderChoice)(r)}
function renderChoice(r){$('#task').innerHTML=`<div class="choices">${r.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c.html||esc(c.label)}</button>`).join('')}</div>`;$$('[data-choice]').forEach(b=>b.onclick=()=>{const c=r.choices[+b.dataset.choice];if(c.correct)good(c.message);else wrong(c.hint||r.hint)})}
function baglaSurukle(kaynakSec,hedefSec,birak){$$(kaynakSec).forEach(k=>{let aktif=false,tasindi=false,sx=0,sy=0;
 k.addEventListener('click',e=>{if(k.dataset.dragged){e.preventDefault();e.stopImmediatePropagation();delete k.dataset.dragged}},true);
 k.onpointerdown=e=>{if(k.disabled)return;delete k.dataset.dragged;aktif=true;tasindi=false;sx=e.clientX;sy=e.clientY;k.setPointerCapture?.(e.pointerId)};
 k.onpointermove=e=>{if(!aktif)return;tasindi=tasindi||Math.hypot(e.clientX-sx,e.clientY-sy)>7;if(!tasindi)return;k.classList.add('ui-dragging');k.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.07)`;$$(hedefSec).forEach(t=>{const b=t.getBoundingClientRect();t.classList.toggle('drop-hot',e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)})};
 const bitir=e=>{if(!aktif)return;let hit=null;$$(hedefSec).forEach(t=>{const b=t.getBoundingClientRect();if(e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)hit=t;t.classList.remove('drop-hot')});aktif=false;k.releasePointerCapture?.(e.pointerId);k.classList.remove('ui-dragging');k.style.transform='';if(tasindi){k.dataset.dragged='1';if(hit&&e.type!=='pointercancel')birak(k,hit)}};
 k.onpointerup=bitir;k.onpointercancel=bitir})}

/* ===== 4. sınıf ortak yardımcılar ===== */
const PLACES=[['yb','yüz binler'],['ob','on binler'],['bn','binler'],['yz','yüzler'],['on','onlar'],['br','birler']];
function ertele(fn,ms){const t=roundIndex;setTimeout(()=>{if(roundIndex===t&&!locked)fn()},ms)}
function grupla(n){const s=String(n);return s.length>3?s.slice(0,-3)+'.'+s.slice(-3):s}
const BIR=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],ONLR=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
function uclu(n){const y=Math.floor(n/100),o=Math.floor(n%100/10),b=n%10;
 return [(y?(y>1?BIR[y]+' ':'')+'yüz':''),ONLR[o],BIR[b]].filter(Boolean).join(' ')}
function sayiAdi(n){if(n===0)return 'sıfır';const bin=Math.floor(n/1000),kalan=n%1000;
 const bp=bin?((bin===1?'':uclu(bin)+' ')+'bin'):'';return [bp,kalan?uclu(kalan):''].filter(Boolean).join(' ')}
function karistir(a,tohum){return a.map((x,i)=>({x,k:(i*7+tohum*13)%a.length})).sort((p,q)=>p.k-q.k).map(o=>o.x)}
function birimKare(n,renk){return `<div class="row" style="gap:2px">${Array.from({length:n},()=>`<i style="width:15px;height:15px;background:${renk||'#8fd0a2'};border:1px solid #3f8a5c;display:inline-block"></i>`).join('')}</div>`}

function bitirTur(r){if(r.after)ertele(()=>sonSoru(r),FAST?20:520);else good()}
/* --- basamak kasası: altı pencere + rakam paleti (p01) ---
   Şartname: ekranda hazır üçlü gruplar YOK; yalnız sayının okunuşu var.
   Çocuk her basamağı ayrı kurar, sıfırlı basamak da elle doldurulur. */
function pvTable(dig,sel,err){
 const cell=(i)=>{const [k,ad]=PLACES[i];
  return `<div class="m4-pv-cell ${i<3?'binler':'birler'} ${sel===i?'hot':''} ${err===i?'err':''}" data-pv="${i}">
   <b>${dig[i]===null?'&nbsp;':dig[i]}</b><small>${ad}</small></div>`};
 return `<div class="pv-group"><div>${[0,1,2].map(cell).join('')}</div><span class="pv-sep">·</span><div>${[3,4,5].map(cell).join('')}</div></div>
 <div class="caption" style="font-size:12px">binler bölüğü &nbsp;·&nbsp; birler bölüğü</div>`}
function renderBasamak(r){
 state.dig=[null,null,null,null,null,null];state.sel=0;state.err=null;
 const pal=karistir(r.palette,r.seed||3);
 const ciz=()=>{
  $('#stage').innerHTML=`<div class="caption">${r.kasa||'🔐'} ${esc(r.adi)}</div>${pvTable(state.dig,state.sel,state.err)}
   <div class="note">${esc(r.note||'Önce bir pencereye, sonra rakama dokun.')}</div>`;
  $$('[data-pv]').forEach(c=>c.onclick=()=>{state.sel=+c.dataset.pv;state.err=null;ciz()});
  $('#task').innerHTML=`<div class="chip-row">${pal.map((d,i)=>`<button class="choice" data-dig="${i}" style="flex:0 0 46px;min-width:46px">${d}</button>`).join('')}</div>
   <div class="actions"><button class="action" data-clear>↶ Pencereyi boşalt</button></div>`;
  $$('[data-dig]').forEach(b=>b.onclick=()=>{
   const d=pal[+b.dataset.dig],i=state.sel;
   if(String(r.target).padStart(6,'0')[i]!==String(d)){state.err=i;ciz();return wrong(r.pvHint?r.pvHint(i,d):r.hint)}
   state.dig[i]=d;state.err=null;
   const bos=state.dig.findIndex(x=>x===null);state.sel=bos<0?i:bos;ciz();
   if(state.dig.every(x=>x!==null))bitirTur(r)});
  $('[data-clear]').onclick=()=>{
   /* Seçili pencere zaten boşsa çocuk “son yazdığımı geri al” bekliyor. */
   if(state.dig[state.sel]===null){for(let k=5;k>=0;k--)if(state.dig[k]!==null){state.sel=k;break}}
   state.dig[state.sel]=null;state.err=null;ciz()}};
 ciz()}

/* --- adım adım tuş takımı: ara basamak/strateji görünür (p14,p18,p29,p40,p56) --- */
function renderNumpad(r){
 if(GAME_ID==='p15')$('#stage').classList.add('market-stage');
 if(GAME_ID==='p24')$('#stage').classList.add('balance-stage');
 state.i=0;state.buf='';
 const ciz=()=>{
  const s=r.steps[state.i];
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}
   <div class="worksteps">${r.steps.map((x,i)=>`<div class="${i<state.i?'done':''}">${i<state.i?'✅ ':(i===state.i?'▶️ ':'⬜ ')}${x.ask}${i<state.i?' = <b>'+esc(String(x.answer))+'</b>':''}</div>`).join('')}</div>
   <div class="readout">${esc(state.buf||'—')}${s&&s.unit?' '+esc(s.unit):''}</div>`;
  if(!s)return;
  $('#task').innerHTML=`<div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(d=>`<button data-k="${d}">${d}</button>`).join('')}
   ${s.comma?'<button data-k=",">,</button>':''}<button data-back>⌫</button><button data-ok>✔️</button></div>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{if(state.buf.length<7){state.buf+=b.dataset.k;ciz()}});
  $('[data-back]').onclick=()=>{state.buf=state.buf.slice(0,-1);ciz()};
  $('[data-ok]').onclick=()=>{
   if(state.buf==='')return wrong('Önce rakamlara dokunarak sonucu yaz.');
   if(state.buf!==String(s.answer)){state.buf='';state.reveal=state.i;ciz();return wrong(s.hint||r.hint)}
   state.i++;state.buf='';ciz();if(state.i===r.steps.length)good()}};
 ciz()}

/* --- durağan bant: kart karar verilene kadar ORTADA ve tam görünür --- */
function renderSerit(r){
 state.i=0;state.gecis=false;
 const ciz=()=>{
  const c=r.cards[state.i];
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}
   <div class="belt-rail"><div class="belt-card">${c?c.html:'Bant boşaldı ✅'}${c&&c.sub?`<small>${c.sub}</small>`:''}</div></div>
   <div class="belt-progress">${r.cards.map((_,i)=>`<i class="${i<state.i?'on':''}"></i>`).join('')}</div>
   ${state.kanit?`<div class="note">${state.kanit}</div>`:''}`;
  if(!c)return;
  if(c.say&&!state.gecis)ertele(()=>speak(c.say),120);
  $('#task').innerHTML=`<div class="bins">${r.bins.map(b=>`<button class="bin" data-bin="${b.id}"><b>${b.emoji||''}</b><span>${esc(b.label)}</span>${b.sub?`<small>${esc(b.sub)}</small>`:''}</button>`).join('')}</div>`;
  $$('[data-bin]').forEach(b=>b.onclick=()=>{
   if(state.gecis)return;
   if(b.dataset.bin!==c.bin){b.classList.add('bad');state.kanit=c.why||'';ciz();return wrong(c.why||r.hint)}
   state.gecis=true;state.kanit=c.proof||'';
   b.classList.add('ok');ciz();
   ertele(()=>{state.i++;state.gecis=false;state.kanit='';if(state.i===r.cards.length)bitirTur(r);else ciz()},FAST?20:620)})};
 ciz()}

/* --- sıra kulesi: sabit yuvalar; kart hareket etmez, aralara ekleme yapılır --- */
function renderKule(r){
 state.slots=Array(r.order.length).fill(null);
 (r.preset||[]).forEach(([i,id])=>state.slots[i]=id);
 state.pick=null;
 const kalan=()=>r.cards.filter(c=>!state.slots.includes(c.id));
 const ciz=()=>{
  $('#stage').innerHTML=`<div class="caption">${esc(r.yon||'')}</div>
   ${typeof r.scene==='function'?r.scene(state):r.scene||''}
   <div class="tower-slots">${state.slots.map((id,i)=>{const c=r.cards.find(x=>x.id===id);
    return `<div class="tower-slot ${c?'filled':''}" data-slot="${i}"><i>${i+1}.</i>${c?c.label:'boş yuva'}</div>`}).join('')}
   </div><div class="tower-arrow">${esc(r.okText||'')}</div>`;
  $$('[data-slot]').forEach(s=>s.onclick=()=>{
   const i=+s.dataset.slot;if(state.slots[i])return;
   if(state.pick===null)return wrong('Önce alttaki kartlardan birini seç.');
   kuleYerlestir(r,state.pick,i,ciz)});
  $('#task').innerHTML=`<div class="chip-row">${kalan().map(c=>`<button class="choice" data-card="${c.id}" style="${state.pick===c.id?'outline:4px solid var(--gold)':''}">${c.label}</button>`).join('')||'<span class="note">Bütün kartlar yerleşti</span>'}</div>`;
  $$('[data-card]').forEach(b=>b.onclick=()=>{state.pick=b.dataset.card;ciz()});
  baglaSurukle('[data-card]','[data-slot]',(k,s)=>kuleYerlestir(r,k.dataset.card,+s.dataset.slot,ciz))};
 ciz()}
function kuleYerlestir(r,id,i,ciz){if(state.slots[i])return;
 if(r.order[i]!==id){const gerek=r.cards.find(x=>x.id===r.order[i]),secilen=r.cards.find(x=>x.id===id);
  return wrong(r.karsilastir?r.karsilastir(secilen,gerek):r.hint)}
 state.slots[i]=id;state.pick=null;ciz();if(state.slots.every(Boolean))bitirTur(r)}

/* --- gerçek sayı doğrusu: uzaklıklar ölçekli çizilir, sürgü tarafsız başlar --- */
function nlHtml(r,v){
 const p=x=>11+((x-r.min)/(r.max-r.min))*78;
 const ticks=(r.ticks||[]).map(t=>`<i class="m4-tick ${t.major?'major':''}" style="left:${p(t.v)}%"></i>${t.label!==undefined?`<span class="m4-lab" style="left:${p(t.v)}%">${esc(String(t.label))}</span>`:''}`).join('');
 const marks=(r.marks||[]).map(m=>`<span class="mark" style="left:${p(m.v)}%">${m.icon||'🔻'}${m.label?`<small>${esc(String(m.label))}</small>`:''}</span>`).join('');
 const spans=(state.showSpans?(r.spans||[]):[]).map(s=>`<i class="span" style="left:${p(s.from)}%;width:${p(s.to)-p(s.from)}%"><span>${esc(s.label)}</span></i>`).join('');
 return `<div class="m4-numline"><i class="axis"></i>${ticks}${spans}${marks}
  <span class="mark" style="left:${p(v)}%;top:-4px">${r.handle||'🔺'}<small>${esc(r.format?r.format(v):String(v))}</small></span></div>`}
function renderSayidogru(r){
 state.value=r.start;state.showSpans=!!r.spansAtStart;
 const ciz=()=>{
  $('#stage').innerHTML=`${typeof r.scene==='function'?r.scene(state):r.scene||''}${nlHtml(r,state.value)}
   ${state.note?`<div class="note">${state.note}</div>`:''}`;
  $('#task').innerHTML=`<input class="range-control" data-range type="range" min="${r.min}" max="${r.max}" step="${r.step||1}" value="${state.value}" aria-label="${esc(r.aria||'Değeri sürükle')}">

   state.showSpans=true;state.note=r.okNote||'';ciz();

/* --- gökdelen asansörü: dikey kuyuda ileri-geri ritmik sayma (p06) ---

/* --- tepsi: seçilen parçalar tepside KALIR, tek tek geri alınabilir (p10,p23,p32,p51) --- */

 state.tray=[];

  $('#task').innerHTML=`<div class="chip-row">${r.pool.map(p=>`<button class="choice" data-add="${p.id}">${p.label}</button>`).join('')}</div>
   <div class="actions"><button class="action" data-serve>${esc(r.serveLabel||'🍽️ Siparişi ver')}</button></div>`;
  const tepsiyeEkle=id=>{

/* --- simetri ızgarası: eksen görünür, eş uzaklık kılavuzu var, silgi ve geri al bulunur --- */
function renderAyna(r){
 state.put=new Set((r.bozuk||[]).map(c=>c[0]+','+c[1]));state.hist=[];state.silgi=!!(r.bozuk&&r.bozuk.length);
 const key=(x,y)=>x+','+y;
 const es=(x,y)=>{const out=[];
  if(r.axis==='v'||r.axis==='both')out.push([2*r.axisX-1-x,y]);
  if(r.axis==='h'||r.axis==='both')out.push([x,2*r.axisY-1-y]);
  if(r.axis==='both')out.push([2*r.axisX-1-x,2*r.axisY-1-y]);
  return out};
 const gerek=()=>{const s=new Set();r.src.forEach(([x,y])=>es(x,y).forEach(([a,b])=>{
   if(!r.src.some(p=>p[0]===a&&p[1]===b))s.add(key(a,b))}));return s};
 const hedef=gerek();
 const ciz=()=>{
  let g='';
  for(let y=0;y<r.rows;y++)for(let x=0;x<r.cols;x++){
   const src=r.src.some(p=>p[0]===x&&p[1]===y),put=state.put.has(key(x,y));
   const ax=(r.axis!=='h'&&(x===r.axisX-1||x===r.axisX))||(r.axis!=='v'&&(y===r.axisY-1||y===r.axisY));
   g+=`<div class="c ${src?'src':''}${put?' put':''}${ax&&!src&&!put?' axis':''}" data-cell="${x},${y}"></div>`}
  $('#stage').innerHTML=`<div class="caption">${esc(r.baslik||'')}</div>
   <div class="symgrid" style="--c:${r.cols}">${g}</div>
   <div class="note">Eksen: ${r.axis==='v'?'dikey':r.axis==='h'?'yatay':'iki eksen'} · Kalan eş nokta: <b>${hedef.size-[...state.put].filter(k=>hedef.has(k)).length}</b>${[...state.put].some(k=>!hedef.has(k))?' · ⚠️ eksene uymayan hücre var':''}${state.silgi?' · 🧽 silgi açık':''}</div>`;
  $$('[data-cell]').forEach(c=>c.onclick=()=>{
   const [x,y]=c.dataset.cell.split(',').map(Number),k=key(x,y);
   if(state.silgi){if(state.put.delete(k)){state.hist=state.hist.filter(h=>h!==k);ciz()}return}
   if(r.src.some(p=>p[0]===x&&p[1]===y))return wrong('Bu hücre kaynak desende; eşini eksenin öbür yanına koy.');
   if(state.put.has(k))return;
   if(!hedef.has(k))return wrong(r.hint);
   state.put.add(k);state.hist.push(k);ciz();
   if([...hedef].every(h=>state.put.has(h))&&state.put.size===hedef.size)bitirTur(r)});
  $('#task').innerHTML=`<div class="sym-tools"><button class="action" data-undo>↶ Geri al</button><button class="action" data-er>🧽 Silgi: ${state.silgi?'açık':'kapalı'}</button><button class="action" data-clearall>🧹 Tümünü temizle</button></div>
   <div class="note">${esc(r.note||'Kaynak hücrelerin eksene uzaklığını say; eşini karşı tarafa aynı uzaklıkta koy.')}</div>`;
  $('[data-undo]').onclick=()=>{const k=state.hist.pop();if(k)state.put.delete(k);ciz()};
  $('[data-clearall]')?.addEventListener('click',()=>{state.put=new Set();state.hist=[];ciz()});
  $('[data-er]').onclick=()=>{state.silgi=!state.silgi;ciz()}};
 ciz()}


/* --- çizim tahtası: noktalar arasında GERÇEK çizgi çekilir; sonuç önceden söylenmez ---
   p26 küp tarama, p28 köşe-kenar, p39 açı ışınları, p45 simetri doğrusu. */
function segKey(a,b){return [a,b].sort().join('|')}
function renderCiz(r){
 state.segs=[];state.from=null;

   return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#e0663f" stroke-width="5" stroke-linecap="round"/>`}).join('');
  $('#stage').innerHTML=`<div class="caption">${esc(r.baslik||'')}</div>
   <div class="m4-board" style="width:${r.w+6}px"><svg viewBox="0 0 ${r.w} ${r.h}" width="${r.w}" height="${r.h}">${r.base||''}${lines}${dots}</svg></div>
   <div class="draw-info">${esc(r.counterLabel||'Çizilen')}: <b>${state.segs.length}</b> / ${need.length}${state.note?' · '+state.note:''}</div>`;
  $$('[data-dot]').forEach(c=>c.onclick=()=>{
   const id=c.dataset.dot;
   if(state.from===null){state.from=id;ciz();return}
   if(state.from===id){state.from=null;ciz();return}
   const k=segKey(state.from,id);state.from=null;
   if(state.segs.includes(k)){state.note='Bu çizgi zaten var.';ciz();return}

 ciz()}
function sonSoru(r){

 speak(r.after.ask);
 $$('[data-cz]').forEach(b=>b.onclick=()=>{const c=r.after.choices[+b.dataset.cz];c.correct?good():wrong(c.hint||r.after.hint)})}


/* --- tarama tahtası: köşe/ayrıt/yüz/kenar tek tek işaretlenip SAYILIR ---
   Şartname (p26, p27, p29): sonuç sayıları başlangıçta gizli; her dokunuş
   numaralanır, aynı öğeye ikinci kez dokunmak tekrar saymaz. */
function taraCiz(r){
 const on=(id)=>state.tapped.indexOf(id);
 /* Görünür öğe ince olabilir; dokunma alanı ayrı ve GENİŞ çiziliyor (44 px kuralı). */
 const parca=(it)=>{
  const i=on(it.id),vur=i>=0;
  const renk=vur?'#e0663f':(it.soluk?'#9db4c4':'#4a6b85');
  if(it.type==='dot')return `<circle cx="${it.x}" cy="${it.y}" r="${it.r||10}" fill="${vur?'#e0663f':'#f2b83f'}" stroke="#3d5a72" stroke-width="2"/>`;
  if(it.type==='line')return `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${renk}" stroke-width="${vur?7:5}" stroke-linecap="round" ${it.dash?'stroke-dasharray="7 5"':''}/>`;
  return `<polygon points="${it.points}" fill="${vur?'rgba(224,102,63,.45)':'rgba(122,160,190,.22)'}" stroke="${renk}" stroke-width="3"/>`};
 const hedef=(it)=>{
  const stil='fill="transparent" stroke="transparent" pointer-events="all" style="cursor:pointer"';
  if(it.type==='dot')return `<circle data-tara="${it.id}" cx="${it.x}" cy="${it.y}" r="${Math.max(it.r||10,22)}" ${stil}/>`;
  if(it.type==='line')return `<line data-tara="${it.id}" x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke-width="26" stroke-linecap="round" ${stil}/>`;
  return `<polygon data-tara="${it.id}" points="${it.points}" ${stil}/>`};
 const etiket=(it)=>{const i=on(it.id);if(i<0)return '';
  const x=it.tx!==undefined?it.tx:(it.x!==undefined?it.x:(it.x1+it.x2)/2),
        y=it.ty!==undefined?it.ty:(it.y!==undefined?it.y:(it.y1+it.y2)/2);
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="900" fill="#7a2d12" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(it.olcu||String(i+1))}</text>`};
 return `<div class="caption">${esc(r.baslik||'')}</div>
  <div class="m4-board" style="width:${r.w+6}px"><svg viewBox="0 0 ${r.w} ${r.h}" width="${r.w}" height="${r.h}">
   ${r.base||''}${r.items.map(parca).join('')}${r.items.map(hedef).join('')}${r.items.map(etiket).join('')}</svg></div>
  <div class="draw-info">${esc(r.sayacAdi||'İşaretlenen')}: <b>${state.tapped.length}</b>${r.gizliToplam?'':' / '+r.items.length}</div>`}
function renderTara(r){
 state.tapped=[];
 const ciz=()=>{
  $('#stage').innerHTML=taraCiz(r);
  $$('[data-tara]').forEach(el=>el.onclick=()=>{
   const id=el.dataset.tara;
   if(state.tapped.includes(id))return feedback('Bu öğe zaten sayıldı');
   state.tapped.push(id);ciz();
   if(state.tapped.length===r.items.length)bitirTur(r)});
  $('#task').innerHTML=`<div class="actions"><button class="action" data-undo>↶ Son işareti kaldır</button></div>
   <div class="note">${esc(r.note||'Her öğeye bir kez dokun; sayaç kendiliğinden oluşur.')}</div>`;
  $('[data-undo]').onclick=()=>{state.tapped.pop();ciz()}};

/* --- geometri çizim yardımcıları --- */
function svgKare(x,y,s,dolgu){return `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${dolgu||'#cfe4f5'}" stroke="#3d5a72" stroke-width="2"/>`}
function svgIzgara(x,y,sut,sat,b,goster){let s='';

/* --- kodlama mimarı: komut çalışırken aktif blok parlar, rota korunur (p46) --- */
function renderKod(r){
 state.prog=[];state.pos=[...r.start];state.trail=[r.start.join(',')];state.run=-1;
 const ciz=()=>{
  let g='';
  for(let y=0;y<r.rows;y++)for(let x=0;x<r.cols;x++){
   const w=(r.walls||[]).some(p=>p[0]===x&&p[1]===y),on=state.trail.includes(x+','+y),bot=state.pos[0]===x&&state.pos[1]===y;
   const goal=(r.goals||[]).some(p=>p[0]===x&&p[1]===y);
   g+=`<div class="cc ${w?'wall':''}${on&&!bot?' on':''}${bot?' bot':''}">${bot?(r.bot||'🤖'):goal?(r.goalIcon||'🎯'):''}</div>`}
  $('#stage').innerHTML=`<div class="caption">${esc(r.baslik||'')}</div>
   <div class="codegrid" style="grid-template-columns:repeat(${r.cols},1fr)">${g}</div>
   <div class="m4-program">${state.prog.length?state.prog.map((d,i)=>`<i class="${state.run===i?'run':''}">${i+1}${{U:'↑',D:'↓',L:'←',R:'→'}[d]}</i>`).join(''):'<span class="note">Program boş</span>'}</div>
   <div class="note">${esc(r.hedefText||'')} · İşaretli hücre: <b>${state.trail.length}</b></div>`;
  $('#task').innerHTML=`<div class="actions">${['U','D','L','R'].map(d=>`<button class="action" data-dir="${d}">${{U:'↑',D:'↓',L:'←',R:'→'}[d]}</button>`).join('')}
   <button class="action" data-clr>Sil</button><button class="action" data-run>▶️ Çalıştır</button></div>`;
  $$('[data-dir]').forEach(b=>b.onclick=()=>{if(state.prog.length<(r.maxSteps||14)){state.prog.push(b.dataset.dir);ciz()}});
  $('[data-clr]').onclick=()=>{state.prog=[];state.pos=[...r.start];state.trail=[r.start.join(',')];ciz()};
  $('[data-run]').onclick=()=>kodCalistir(r,ciz)};
 ciz()}
function kodCalistir(r,ciz){
 if(!state.prog.length)return wrong('Önce yön bloklarıyla bir program kur.');
 state.pos=[...r.start];state.trail=[r.start.join(',')];
 let i=0;
 const adim=()=>{
  if(i>=state.prog.length){state.run=-1;ciz();return bitir(r)}
  const d=state.prog[i];state.run=i;
  const p=[...state.pos];if(d==='U')p[1]--;if(d==='D')p[1]++;if(d==='L')p[0]--;if(d==='R')p[0]++;
  if(p[0]<0||p[1]<0||p[0]>=r.cols||p[1]>=r.rows||(r.walls||[]).some(w=>w[0]===p[0]&&w[1]===p[1])){
   state.run=-1;ciz();return wrong(r.hint)}
  state.pos=p;if(!state.trail.includes(p.join(',')))state.trail.push(p.join(','));
  i++;ciz();ertele(adim,FAST?5:230)};
 adim()}
function bitir(r){
 const hedef=(r.goals||[]).map(p=>p.join(','));
 if(hedef.every(h=>state.trail.includes(h))&&(!r.exact||state.trail.length===hedef.length))bitirTur(r);
 else wrong(r.hint)}


/* --- açı çizimi: iki gerçek ışın, köşe ve dönüş yayı (p33, p35, p37, p38) --- */
function aciCiz(deg,o){o=o||{};const w=o.w||150,h=o.h||110,cx=o.cx||28,cy=o.cy||(h-20),R=o.R||62;
 const a=deg*Math.PI/180;
 const x2=cx+R*Math.cos(a),y2=cy-R*Math.sin(a);
 const yayR=Math.min(30,R*0.45);
 const yay=`M ${(cx+yayR).toFixed(1)} ${cy} A ${yayR} ${yayR} 0 ${deg>180?1:0} 0 ${(cx+yayR*Math.cos(a)).toFixed(1)} ${(cy-yayR*Math.sin(a)).toFixed(1)}`;
 const kare=deg===90?`<rect x="${cx}" y="${cy-15}" width="15" height="15" fill="none" stroke="#c0451f" stroke-width="2.5"/>`:'';
 return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">

/* ---- Tema 2: kesir modelleri (şerit ve daire) ----
   Şartnamenin ortak isteği: kesir hiçbir yerde yalnız sembol olarak kalmasın;
   aynı bütün üzerinde çizilen parça-bütün modeliyle birlikte görünsün. */
function kSerit(pay,payda,renk,genislik){const w=genislik||150;
 return `<span style="display:inline-flex;width:${w}px;height:26px;border:2px solid #3d5a72;border-radius:6px;overflow:hidden;vertical-align:middle">
 ${Array.from({length:payda},(_,i)=>`<i style="flex:1 1 0;border-right:${i<payda-1?'1px solid #3d5a72':'0'};background:${i<pay?(renk||'#f2b83f'):'#fff'}"></i>`).join('')}</span>`}
function kDaire(pay,payda,renk,cap){const R=(cap||58)/2,C=R,parts=[];
 for(let i=0;i<payda;i++){const a1=(i/payda)*2*Math.PI-Math.PI/2,a2=((i+1)/payda)*2*Math.PI-Math.PI/2;
  const x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1),x2=C+R*Math.cos(a2),y2=C+R*Math.sin(a2);
  parts.push(`<path d="M ${C} ${C} L ${x1} ${y1} A ${R} ${R} 0 ${(a2-a1)>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${i<pay?(renk||'#e8846b'):'#fff'}" stroke="#8a5725" stroke-width="1.5"/>`)}
 return `<svg width="${cap||58}" height="${cap||58}" viewBox="0 0 ${cap||58} ${cap||58}" style="vertical-align:middle">${parts.join('')}</svg>`}
function kBileske(pay,payda,renk){/* bileşik kesir: kaç TAM bütün doldu, kaç parça arttı */
 const tam=Math.floor(pay/payda),kalan=pay%payda;
 return `<span class="row" style="gap:4px;flex-wrap:wrap">${Array.from({length:tam},()=>kDaire(payda,payda,renk,46)).join('')}${kalan?kDaire(kalan,payda,renk,46):''}</span>`}
function kEtiket(pay,payda){return `<b style="font-size:20px">${pay}<span style="font-size:14px">/</span>${payda}</b>`}
function kTam(t,pay,payda){return `<b style="font-size:20px">${t} tam ${pay}<span style="font-size:14px">/</span>${payda}</b>`}

function renderKasaPazari(r){
 state.tray=[];state.kasalar=[];
 const count=roundIndex===0?4:5,per=roundIndex===0?6:4,type=roundIndex===0?'apple':'pencil';
 const ciz=(fresh=-1)=>{
  $('#stage').classList.add('market-stage');
  $('#stage').innerHTML=`<p class="scene-kicker">MAHALLE PAZARI • ${count} EŞ KASA</p><div class="market-crates">${Array.from({length:count},(_,i)=>state.kasalar.includes(i)?'<div class="produce-crate" style="opacity:.12" aria-hidden="true"></div>':`<button class="produce-crate" data-add="kasa" data-crate="${i}" aria-label="${per} ${type==='apple'?'elmalı':'kalemli'} kasa">${SceneWorkshop.crate(type,per)}</button>`).join('')}</div><div class="market-cart" data-tepsi aria-label="Pazar arabasının sepeti">${state.kasalar.length?state.kasalar.map((k,i)=>`<button class="produce-crate ${k===fresh?'crate-arrival':''}" data-rm="${i}" aria-label="Bu kasayı rafa geri koy">${SceneWorkshop.crate(type,per)}</button>`).join(''):'<span class="paper-guide">Seçtiğin kasaları arabaya taşı</span>'}</div><div class="scene-status" aria-live="polite">${state.kasalar.length} kasa × ${per} = ${state.kasalar.length*per} ${type==='apple'?'elma':'kalem'}</div>`;
  $('#task').innerHTML=`<button class="action" data-serve>Seçimi onayla</button><div class="hint">Kasaya dokunarak da taşıyabilirsin. Geri koymak için arabadaki kasaya dokun.</div>${state.note?`<div class="note">${esc(state.note)}</div>`:''}`;
  const ekle=el=>{if(locked)return;const i=+el.dataset.crate;if(state.kasalar.includes(i))return;state.kasalar.push(i);state.tray.push('kasa');state.note='';ciz(i)};
  $$('[data-add]').forEach(el=>el.onclick=()=>ekle(el));
  $$('[data-rm]').forEach(el=>el.onclick=()=>{if(locked)return;state.kasalar.splice(+el.dataset.rm,1);state.tray.splice(+el.dataset.rm,1);state.note='';ciz()});
  SceneWorkshop.bindDrag('[data-add]','[data-tepsi]',el=>ekle(el));
  $('[data-serve]').onclick=()=>{if(locked)return;if(state.tray.length!==r.need.kasa){state.note=r.hint;ciz();return wrong(r.hint)}bitirTur(r)};
 };ciz();
}

function labSahne(baslik,basla,adimlar){return(st)=>{
 const n=(st.steps||[]).length;let v=basla;const satir=[];
 for(let i=0;i<n&&i<adimlar.length;i++){const a=adimlar[i];v=a.f(v);satir.push(`${a.ad} → <b>${v}</b>`)}
 return `<div class="caption">🧭 ${esc(baslik)}</div>
  <div class="row"><span class="badge">Başlangıç: ${basla}</span><span class="pv-sep">→</span><span class="badge">Şu an: ${v}</span></div>
  ${satir.length?adimDefteri(satir):'<div class="note">Not defteri boş · yönerge kartlarını sırayla seç.</div>'}`}}

function kefeSahne(sol,solEtiket){return(st)=>{
 const secilen=(st.etiketler||[]);
 return `<div class="caption">⚖️ Eşitliğin iki tarafı</div>
  <div class="m4-scale"><div class="m4-pan"><b>${esc(solEtiket)}</b><div style="font-size:23px;font-weight:1000">${sol}</div>
   <div class="units">${Array.from({length:Math.min(sol,40)},()=>'<i></i>').join('')}</div></div>
  <div class="scale-mid">=</div>
  <div class="m4-pan" data-multi-target role="button"><b>SAĞ KEFE</b><div style="font-size:15px;font-weight:900">${secilen.length?secilen.join(' · '):'kartları buraya sürükle'}</div>
   <div class="units">${Array.from({length:Math.min(secilen.length?sol:0,40)},()=>'<i class="red"></i>').join('')}</div></div></div>
  <div class="note">Bulunan eşit ifade: <b>${secilen.length}</b></div>`}}
function renderEsitlikAtolyesi(r){
 state.selected=[];state.etiketler=[];state.currentWeight=null;
 const total=roundIndex===0?48:72,values=roundIndex===0?[48,48,48,44,56]:[72,72,72,73,48];
 const ciz=(fresh=false)=>{
  const w=state.currentWeight,balanced=w!=null&&values[w]===total;
  $('#stage').classList.add('balance-stage');
  $('#stage').innerHTML='<p class="scene-kicker">DENGE ATÖLYESİ</p>'+SceneWorkshop.scale(`${roundIndex===0?'12 × 4':'72'}<small>${total} birim</small>`,w==null?'':`${esc(r.items[w].label)}<small>${values[w]} birim</small>`,{loaded:w!=null,tilt:w==null?12:balanced?0:values[w]<total?7:-7,fresh:fresh&&balanced})+
   `<div class="scene-status" aria-live="polite">${w==null?'Bir işlem ağırlığını sağ kefeye bırak.':balanced?'Dengede: '+total+' = '+values[w]:'Denge olmadı: '+total+(values[w]<total?' > ':' < ')+values[w]}</div><div class="balance-records">${state.etiketler.map(x=>`<span>✓ ${esc(x)} = ${total}</span>`).join('')}</div><div class="hint">Her ağırlığı ayrı ayrı dene. Doğru eşitlikler aşağıda kaydedilir.</div>`;
  $('#task').innerHTML=`<div class="actions">${r.items.map((x,i)=>`<button class="action operation-weight" data-item="${i}" ${state.selected.includes(x.id)?'disabled':''}>${esc(x.label)}</button>`).join('')}</div>`;
  const weigh=el=>{if(locked||state.finished)return;const i=+el.dataset.item,x=r.items[i];if(state.selected.includes(x.id))return;state.currentWeight=i;
   if(!x.correct){ciz();return wrong(r.hint)}state.selected.push(x.id);state.etiketler.push(x.label);ciz(true);
   if(state.selected.length===r.items.filter(x=>x.correct).length){state.finished=true;setTimeout(()=>bitirTur(r),FAST?20:800)}};
  $$('[data-item]:not(:disabled)').forEach(el=>el.onclick=()=>weigh(el));
  SceneWorkshop.bindDrag('[data-item]:not(:disabled)','[data-multi-target]',el=>weigh(el));
 };ciz();
}

const KUP={on:[[40,70],[130,70],[130,160],[40,160]],arka:[[75,40],[165,40],[165,130],[75,130]]};
function kupBase(){const o=KUP.on,a=KUP.arka;
 const cizgi=(p,q,d)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#c3d4e0" stroke-width="3" ${d?'stroke-dasharray="6 4"':''}/>`;
 let s='';for(let i=0;i<4;i++){s+=cizgi(o[i],o[(i+1)%4]);s+=cizgi(a[i],a[(i+1)%4],true);s+=cizgi(o[i],a[i],i===3)}

 for(let i=0;i<4;i++){out.push({id:'o'+i,type:'line',x1:o[i][0],y1:o[i][1],x2:o[(i+1)%4][0],y2:o[(i+1)%4][1]});
  out.push({id:'a'+i,type:'line',dash:true,x1:a[i][0],y1:a[i][1],x2:a[(i+1)%4][0],y2:a[(i+1)%4][1]});
  out.push({id:'d'+i,type:'line',dash:i===3,x1:o[i][0],y1:o[i][1],x2:a[i][0],y2:a[i][1]})}
 return out}

/* p30 — İp Dolama Deneyi · eğri kenarın çevresini ölç
   Şartname: kronometre kadranı ve zamanlama toleransı kaldırıldı. İp gerçekten
   çevre boyunca sarılıyor, sonra düzleşip cetvelde okunuyor. */
function daireYay(cx,cy,R,n){const out=[];
 for(let i=0;i<n;i++){const a1=(i/n)*2*Math.PI-Math.PI/2,a2=((i+1)/n)*2*Math.PI-Math.PI/2;
  out.push({d:`M ${(cx+R*Math.cos(a1)).toFixed(1)} ${(cy+R*Math.sin(a1)).toFixed(1)} A ${R} ${R} 0 0 1 ${(cx+R*Math.cos(a2)).toFixed(1)} ${(cy+R*Math.sin(a2)).toFixed(1)}`})}
 return out}
function cetvelSvg(x,y,uzunluk,birim){let s=`<rect x="${x}" y="${y}" width="${uzunluk*birim}" height="16" fill="#fff7e4" stroke="#c9a227" stroke-width="2"/>`;
 for(let i=0;i<=uzunluk;i+=2)s+=`<line x1="${x+i*birim}" y1="${y}" x2="${x+i*birim}" y2="${y+(i%10===0?12:7)}" stroke="#c9a227" stroke-width="2"/>`;
 return s}

 return `<div class="m4-board" style="width:216px"><svg viewBox="0 0 216 84" width="216" height="84">${p.join('')}</svg></div>`}

function motifSvg(yollar,w,h,eksen){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
 ${eksen||''}${yollar}</svg>`}
function dikeyEksen(x,h){return `<line x1="${x}" y1="2" x2="${x}" y2="${h-2}" stroke="#e88ba1" stroke-width="3" stroke-dasharray="6 4"/>`}
function yatayEksen(y,w){return `<line x1="2" y1="${y}" x2="${w-2}" y2="${y}" stroke="#e88ba1" stroke-width="3" stroke-dasharray="6 4"/>`}
function harfSvg(d,w,h,eksen){return motifSvg(`<path d="${d}" fill="none" stroke="#3d5a72" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`,w||90,h||96,eksen)}

function torba(kirmizi,mavi,yesil){return `<div class="stack"><div style="font-size:34px">👜</div>
 <div class="row" style="gap:3px;max-width:170px">${'🔴'.repeat(kirmizi)}${'🔵'.repeat(mavi)}${'🟢'.repeat(yesil||0)}</div>
 <small style="font-weight:900">Torbanın içi görünüyor: ${[kirmizi?kirmizi+' kırmızı':'',mavi?mavi+' mavi':'',yesil?yesil+' yeşil':''].filter(Boolean).join(', ')}</small></div>`}
function zarYuzleri(){return `<div class="row" style="gap:4px">${['⚀','⚁','⚂','⚃','⚄','⚅'].map(z=>`<span style="font-size:30px">${z}</span>`).join('')}</div>
 <small style="font-weight:900">Standart zarın mümkün sonuçları: 1, 2, 3, 4, 5, 6</small>`}
