<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2. Sınıf Hayat Bilgisi — Gerçek Yaşam Sahneleri</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#1d3346;--muted:#56728a;--panel:rgba(255,255,255,.95);--ok:#158a5e;--bad:#d0483f;--gold:#e0a52c;--blue:#2f7fb8;--line:#b8ccdb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#dceefb;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;isolation:isolate}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:7px 9px;background:rgba(255,255,255,.97);box-shadow:0 3px 15px rgba(25,59,85,.16);z-index:30}
.round{font-size:clamp(13px,3.2vw,17px);font-weight:950;white-space:nowrap}
.prompt{font-size:clamp(11px,2.7vw,14px);line-height:1.18;font-weight:850;text-align:center;overflow-wrap:break-word}
.hud-right{display:flex;align-items:center;gap:5px}
.lives{font-size:15px;letter-spacing:-3px;white-space:nowrap}
.sound{width:46px;height:44px;border:0;border-radius:13px;background:#e3f3ff;box-shadow:0 2px 0 #aacce2;font-size:20px}
.scene{position:relative;min-height:0;overflow:auto;padding:9px 9px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;background:linear-gradient(#cdeaff 0 56%,#a9cf87 56%)}
.scene[data-theme="sinif"]{background:linear-gradient(#fdf3d8 0 70%,#c08a5c 70%)}
.scene[data-theme="bahce"]{background:linear-gradient(#cdeaff 0 54%,#8fc47a 54%)}
.scene[data-theme="sehir"]{background:linear-gradient(#d5ecfb 0 62%,#9aa6ae 62%)}
.scene[data-theme="ev"]{background:linear-gradient(#fff1de 0 68%,#b98358 68%)}
.scene[data-theme="doga"]{background:linear-gradient(#cdeaff 0 50%,#8bbf6e 50%)}
.scene[data-theme="muze"]{background:linear-gradient(#eae3f5 0 66%,#8d7fa6 66%)}
.scene[data-theme="banyo"]{background:linear-gradient(#e2f5fb 0 64%,#a9c3ce 64%)}
.stage{position:relative;flex:1 1 auto;min-height:210px;border-radius:22px;padding:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.82);border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(20,56,82,.14)}
.task{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto}
.caption{width:100%;text-align:center;font-size:clamp(12px,3.1vw,15px);font-weight:850;line-height:1.28}
.caption.soru{font-size:clamp(14px,3.6vw,17px);font-weight:950}
.hint{width:100%;text-align:center;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;width:100%}
.choices{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:8px;width:100%}
.choice{min-height:52px;flex:1 1 100%;max-width:340px;border:3px solid #fff;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 rgba(35,77,108,.2);padding:9px 12px;font-weight:900;font-size:clamp(13px,3.4vw,16px);line-height:1.25;text-align:center}
.choice.kisa{flex:1 1 44%;max-width:170px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,77,108,.2)}
.choice.sec{border-color:var(--gold);background:#fff7e2}
.choice.olu{opacity:.45}
/* kart: hiçbir kenarda kırpılmaz — sarmalanır, taşmaz (şartname ölçüt 5) */
.kart{width:min(320px,94%);min-height:56px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 13px;font-weight:900;font-size:clamp(13px,3.5vw,16px);line-height:1.3;text-align:center;overflow-wrap:break-word;word-break:normal;box-shadow:0 4px 0 rgba(35,77,108,.14)}
.kart.vurgu{border-color:var(--gold);background:#fffaf0}
.kutular{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
.kutu{flex:1 1 45%;min-width:132px;max-width:190px;min-height:56px;border:3px solid #7fa3bd;border-radius:15px;background:#eef7fd;padding:8px 9px;font-weight:950;font-size:clamp(12px,3.2vw,15px);line-height:1.22;text-align:center;overflow-wrap:break-word}
.kutu:active{transform:translateY(2px)}
.kutu .sayac{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.ilerleme{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:11px;height:11px;border-radius:50%;background:#cfdde8;border:2px solid #a8bfd0}
.ilerleme i.ok{background:var(--ok);border-color:#0d6444}
.ilerleme i.simdi{background:var(--gold);border-color:#a97c14}
.dizi{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.sirakart{width:min(320px,94%);min-height:50px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:8px 11px;font-weight:880;font-size:clamp(12px,3.3vw,15px);line-height:1.28;text-align:left;overflow-wrap:break-word;display:flex;align-items:center;gap:8px}
.sirakart .no{flex:0 0 24px;height:24px;border-radius:50%;background:#e6eef5;color:var(--muted);font-size:12px;font-weight:950;display:flex;align-items:center;justify-content:center}
.sirakart.secili{border-color:var(--ok);background:#eaf8f1}
.sirakart.secili .no{background:var(--ok);color:#fff}
.sirakart.olu{opacity:.4}
.esle-alan{display:flex;flex-direction:column;gap:7px;width:100%;align-items:center}
.yuva{width:min(330px,96%);min-height:60px;border:3px dashed #6f9cba;border-radius:15px;background:rgba(255,255,255,.7);padding:7px 9px;display:flex;align-items:center;gap:9px}
.yuva.dolu{border-style:solid;border-color:var(--ok);background:#eaf8f1}
svg.mini{flex:0 0 74px;width:74px;height:auto;display:block}
.yuva svg.mini{flex:0 0 66px;width:66px}
.yuva svg.sahne{width:64px;flex:0 0 64px;max-height:64px}
.yuva .hedef{flex:1 1 auto;font-weight:900;font-size:clamp(12px,3.2vw,15px);line-height:1.25;overflow-wrap:break-word}
.yuva .kondu{flex:1 1 auto;font-weight:850;font-size:12px;color:#0d6444;line-height:1.2}
.etiketler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.etiket{min-height:46px;max-width:160px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);padding:7px 10px;font-weight:900;font-size:clamp(12px,3.2vw,14px);line-height:1.2;overflow-wrap:break-word}
.etiket.secili{border-color:var(--gold);background:#fff7e2}
.etiket.bitti{visibility:hidden}
.feedback{position:absolute;left:50%;top:46%;z-index:150;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#fff;border:4px solid var(--ok);border-radius:22px;padding:14px 19px;min-width:200px;text-align:center;font-size:clamp(17px,4.6vw,25px);font-weight:1000;box-shadow:0 12px 38px rgba(0,0,0,.27)}
.feedback.show{animation:pop .95s ease both}
.feedback.bad{border-color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%,74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes hop{50%{transform:translateY(-14px) scale(1.04)}}
.shake{animation:shake .38s}.success-motion{animation:hop .7s ease}
.overlay{position:absolute;inset:0;z-index:300;background:rgba(9,27,46,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{width:min(390px,94%);background:white;border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.overlay h2{margin:0 0 8px;font-size:27px}.overlay p{font-size:15px;font-weight:750;color:var(--muted);line-height:1.35}
.big{font-size:clamp(38px,11vw,64px)}
/* yazma ve konuşma kipleri */
.yazi-alan{width:min(330px,96%);min-height:82px;border:3px solid #8fb4cd;border-radius:15px;padding:9px 11px;font:inherit;font-size:15px;font-weight:800;line-height:1.35;resize:none;background:#fff}
.olcut{width:min(330px,96%);display:flex;flex-direction:column;gap:3px}
.olcut div{font-size:12px;font-weight:850;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.25}
.olcut div.tam{color:#0d6444}
.rubrik{width:min(330px,96%);display:flex;flex-direction:column;gap:5px}
.rubrik button{min-height:44px;border:3px solid var(--line);border-radius:13px;background:#fff;padding:6px 10px;font-weight:850;font-size:13px;text-align:left;line-height:1.25}
.rubrik button.on{border-color:var(--ok);background:#eaf8f1}
.tut{min-height:60px;min-width:190px;border:3px solid #fff;border-radius:18px;background:#2f7fb8;color:#fff;font-weight:950;font-size:17px;box-shadow:0 5px 0 #1d5c8b;user-select:none;touch-action:none}
.tut.basili{background:#1d5c8b;transform:translateY(3px);box-shadow:0 2px 0 #14456a}
.sure-cubuk{width:min(300px,92%);height:12px;border-radius:7px;background:#dbe7ef;overflow:hidden}
.sure-cubuk i{display:block;height:100%;width:var(--w,0%);background:var(--gold);transition:width .1s linear}
/* sahne parçaları */
svg.sahne{width:min(330px,96%);height:auto;max-height:190px;display:block}
.sahne-not{font-size:12px;font-weight:850;color:var(--muted);text-align:center;line-height:1.25}
.konus-balon{background:#fff;border:3px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 11px;font-weight:880;font-size:clamp(12px,3.2vw,15px);line-height:1.3;max-width:min(320px,94%);overflow-wrap:break-word}
/* mesafe ölçeri — ölçülen kavram (iki kişi arasındaki boşluk) ekranda canlanır */
.mesafe-yol{width:min(330px,96%);min-height:96px;display:flex;align-items:flex-end;justify-content:center;gap:0;background:linear-gradient(#eaf4fb 0 70%,#cbd8e0 70%);border:3px solid var(--line);border-radius:14px;padding:8px 6px;overflow:hidden}
.figur{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
.figur b{font-size:11px;font-weight:900;color:var(--muted);white-space:nowrap}
.mesafe-bos{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:center;position:relative}
.mesafe-bos i{display:block;width:100%;border-top:3px dashed #e0a52c}
.olcek{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:min(330px,96%);height:48px;min-height:48px;background:transparent;margin:0}
.olcek::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0}
.olcek::-moz-range-track{height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0}
.olcek::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-14px;border-radius:50%;background:#2f7fb8;border:4px solid #fff;box-shadow:0 2px 6px rgba(20,56,82,.35)}
.olcek::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:#2f7fb8;border:4px solid #fff}
/* tuş takımı — gerçek telefon; aranacak numara hiçbir yerde yazılı değil */
.tus-ekran{width:min(240px,90%);min-height:46px;background:#12283a;color:#8df0b6;border-radius:11px;padding:8px 12px;font-size:26px;font-weight:950;letter-spacing:4px;text-align:center}
.tus-takim{display:grid;grid-template-columns:repeat(3,minmax(64px,80px));gap:7px;justify-content:center}
.tus{min-height:52px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 4px 0 rgba(35,77,108,.2);font-size:22px;font-weight:950}
.tus:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,77,108,.2)}
.tus.genis{grid-column:span 3}
/* yön ızgarası — bloklar KUZEY/GÜNEY/DOĞU/BATI; güneşin konumu ekranda */
.harita-sar{position:relative;width:min(310px,96%);padding:38px 46px}
.harita{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#8a7a5c;border:4px solid #6b5a44;border-radius:10px;padding:4px}
.huc{aspect-ratio:1;border-radius:5px;background:#efe2c4;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.huc.engel{background:#6b7a68}
.huc.hedef{background:#ffe08a;box-shadow:inset 0 0 0 3px #c9922a}
.huc.robot{background:#bcd9ee;box-shadow:inset 0 0 0 3px #2f7fb8}
.gunes{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;width:46px;font-size:9px;line-height:1.05;font-weight:900;color:#8a6a12;text-align:center}
.gunes.ust{top:0;left:50%;transform:translateX(-50%)}
.gunes.alt{bottom:0;left:50%;transform:translateX(-50%)}
.gunes.sol{left:0;top:50%;transform:translateY(-50%)}
.gunes.sag{right:0;top:50%;transform:translateY(-50%)}
.program{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:42px;width:min(320px,94%);padding:5px;background:#fff;border:3px dashed #9fb0c4;border-radius:11px}
.blok{background:#e3f1fb;border:3px solid #7fb6de;border-radius:9px;padding:4px 8px;font-weight:950;font-size:13px;color:#1f3b52}
.blok.hata{background:#fde8e8;border-color:#e05555;color:#8a2020}
.yon-tus{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.yon-tus button{min-height:48px;min-width:84px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);font-weight:950;font-size:14px}
/* musluk — gerçek musluk, kap ve akan su; gereken miktar söylenmiyor */
.lavabo{position:relative;width:min(300px,94%);height:196px}
.lavabo svg.arka{position:absolute;inset:0;width:100%;height:100%}
.akis{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:8px;background:linear-gradient(#9fdcf4,#3f9fd0);border-radius:4px;opacity:0;transition:opacity .1s}
.akis.acik{opacity:1}
.bardak{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:74px;height:84px;border:5px solid #8fb9d2;border-top:0;border-radius:0 0 18px 18px;background:rgba(255,255,255,.72);overflow:hidden}
.bardak:before{content:"";position:absolute;left:-9px;right:-9px;top:-7px;height:7px;border-radius:4px;background:#8fb9d2}
.bardak i{position:absolute;left:0;right:0;bottom:0;height:var(--su,0%);background:linear-gradient(#7fc6e8,#3f92c4);transition:height .12s}
.tasan{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;font-weight:900;color:var(--bad);background:#fff;border-radius:7px;padding:1px 6px}
/* israf tahmini — akan musluk ve dolan kova görünür */
.kova-sar{display:flex;align-items:flex-end;justify-content:center;gap:14px;width:100%}
.kova{position:relative;width:92px;height:96px;border:5px solid #7b8ea1;border-top:0;border-radius:0 0 14px 14px;background:rgba(255,255,255,.6);overflow:hidden}
.kova i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7fc6e8,#3f92c4);transition:height .5s}
.kova b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:900;color:#0d3b55}
.karsilastir{width:min(320px,94%);display:flex;flex-direction:column;gap:4px}
.karsilastir div{display:flex;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:900}
/* çetele — beşinci çizgi dördünü keser; rakam sayacı değil */
.cetele-tablo{width:min(330px,96%);display:flex;flex-direction:column;gap:6px}
.cetele-satir{display:flex;align-items:center;gap:8px;min-height:52px;border:3px solid var(--line);border-radius:13px;background:#fff;padding:6px 9px;text-align:left}
.cetele-satir .ad{flex:0 0 96px;font-size:12px;font-weight:950;line-height:1.15;overflow-wrap:break-word}
.cetele-satir .isaret{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:26px}
.cetele-satir.vurgu{border-color:var(--ok);background:#eaf8f1}
.sik-tablo{width:min(330px,96%);display:flex;flex-direction:column;gap:4px}
.sik-tablo div{display:flex;justify-content:space-between;gap:8px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:900}
/* afet çantası — seçilen malzeme çantaya gerçekten girer, doluluk görünür */
.canta-kutu{width:min(320px,94%);min-height:84px;border:4px solid #8a5f38;border-radius:12px 12px 18px 18px;background:#e6d3ba;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.canta-kutu .icerik{background:#fff;border:2px solid #b79f79;border-radius:9px;padding:3px 7px;font-size:12px;font-weight:900;line-height:1.15;max-width:150px;overflow-wrap:break-word}
.doluluk{width:min(320px,94%);height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0;overflow:hidden}
.doluluk i{display:block;height:100%;width:var(--w,0%);background:var(--ok);transition:width .3s}
.esyalar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.esya{min-height:48px;max-width:158px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);padding:7px 10px;font-weight:900;font-size:clamp(12px,3.2vw,14px);line-height:1.2;overflow-wrap:break-word}
.esya.alindi{visibility:hidden}
@media (max-height:640px){.stage{min-height:168px}.scene{gap:6px}.choice{min-height:48px}svg.sahne{max-height:150px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Sınama modunda (?test=1) arka plan sekmesindeki setTimeout kısıntısını aş —
   gizli sekmede oyunun kendi tur geçişleri donuyor. Yalnız kısa gecikmeler için. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}
'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'h01';
addEventListener('hashchange',()=>location.reload());
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:820;
let game,roundIndex=0,lives=3,score=0,state={},locked=false;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(String(text||''),repeat)}catch(e){}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text||''));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',
 `<div class="overlay"><div class="overlay-card"><div class="big">🏅</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="choice" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function round(){return game.rounds[roundIndex]}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div>`+
 `<div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi tekrar dinle">🔊</button></div></header>`}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;sonCeza=0;
 document.getElementById('app').innerHTML=hud()+
  `<main class="scene" data-theme="${round().theme||game.theme||'sinif'}"><div class="feedback"></div>`+
  `<section class="stage" id="stage"></section><section class="task" id="task"></section></main>`;
 $('.sound').onclick=()=>{const r=round();if(r)speak(r.prompt,true)};
 /* rAF geri çağrısı bir sonraki karede çalışır; o ana kadar oyun bitmiş
    olabilir (gizli sekmede kuyrukta bekliyor). round() boşsa okuma. */
 renderRound();requestAnimationFrame(()=>{const r=round();if(r)speak(r.prompt)})}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
/* Hızlı çift dokunuş tek hata için iki can götürmesin. */
let sonCeza=0;
function wrong(hint){if(locked||!round())return;
 const simdi=Date.now();if(simdi-sonCeza<550)return;sonCeza=simdi;
 if(!round().cezasiz)lives=Math.max(0,lives-1);
 feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün.');
 const sc=$('.stage');if(sc){sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake')}
 const l=$('.lives');if(l)l.innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
 if(lives===0){lives=3;setTimeout(render,700)}}
function good(message){if(locked)return;locked=true;score+=10;const r=round();
 feedback(message||'Doğru!');speak(r.result||message||'Doğru.');
 const st=$('#stage');if(st)st.classList.add('success-motion');
 setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function ertele(fn,ms){const t=roundIndex;setTimeout(()=>{if(roundIndex===t&&!locked)fn()},ms)}
function gecisBasla(fn,ms){state.gecis=true;ertele(()=>{state.gecis=false;fn()},ms)}
function sadelestir(s){return String(s||'').toLocaleLowerCase('tr').replace(/[^\wçğıöşü\s]/g,' ').replace(/\s+/g,' ').trim()}
function kelimeSay(s){const t=sadelestir(s);return t?t.split(' ').length:0}
function ilerleme(n,i){return `<div class="ilerleme">${Array.from({length:n},(_,k)=>`<i class="${k<i?'ok':(k===i?'simdi':'')}"></i>`).join('')}</div>`}
function sahneHtml(r){return typeof r.sahne==='function'?r.sahne(state):(r.sahne||'')}

/* ===== KARAR: sahneye bağlı seçim; seçenekler sabit durur, düşme/refleks yok.
   İstenirse ikinci basamakta gerekçe sorulur (şartname: karar + gerekçe). ===== */
function kararCiz(r){
 const g=state.faz===1&&r.neden;
 $('#stage').innerHTML=sahneHtml(r)+
  (r.durum?`<div class="konus-balon">${esc(r.durum)}</div>`:'')+
  (r.sahneNot?`<div class="sahne-not">${esc(r.sahneNot)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 const soru=g?r.neden.soru:r.soru, sec=g?r.neden.secenekler:r.secenekler;
 $('#task').innerHTML=`<div class="caption soru">${esc(soru)}</div>`+
  `<div class="choices">${sec.map((c,i)=>`<button class="choice${c.label.length<16?' kisa':''}" data-${g?'neden':'sec'}="${i}">${esc(c.label)}</button>`).join('')}</div>`+
  (r.ipucu&&!g?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 $$(`[data-${g?'neden':'sec'}]`).forEach(b=>b.onclick=()=>{
  if(state.gecis||locked)return;
  const c=sec[+(g?b.dataset.neden:b.dataset.sec)];
  if(!c.correct)return wrong(c.hint||r.yanlisIpucu||'Sahneye yeniden bak.');
  if(!g&&r.neden){state.faz=1;state.not=r.araSoz||'Doğru karar. Peki neden?';feedback('Doğru karar');
   return gecisBasla(()=>kararCiz(r),FAST?30:620)}
  good()})}
function renderKarar(r){state.faz=0;state.not='';kararCiz(r)}

/* ===== SINIFLA: kart bantta akmaz, sabit durur ve hiçbir kenarda kırpılmaz.
   Kutularda emoji/renk ipucu yok (şartname ölçüt 4). ===== */
function sinifCiz(r){
 const i=state.ix||0,k=r.kartlar[i];
 if(!k)return;
 $('#stage').innerHTML=sahneHtml(r)+
  ilerleme(r.kartlar.length,i)+
  (k.gorsel?`<div class="row">${k.gorsel}</div>`:'')+
  `<div class="kart vurgu">${esc(k.t)}</div>`+
  (k.sahne?`<div class="sahne-not">${esc(k.sahne)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="kutular">${r.kutular.map((b,j)=>`<button class="kutu" data-kutu="${j}">${esc(b)}<span class="sayac">${(state.sayim||[])[j]||0} kart</span></button>`).join('')}</div>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 $$('[data-kutu]').forEach(b=>b.onclick=()=>{
  if(state.gecis||locked)return;
  const j=+b.dataset.kutu;
  if(j!==k.dogru)return wrong(k.hint||'Kartı yeniden oku: bu davranış hangi kutuya uyuyor?');
  state.sayim=state.sayim||r.kutular.map(()=>0);state.sayim[j]++;
  state.ix=i+1;state.not=k.neden||'';
  if(state.ix>=r.kartlar.length)return good();
  feedback('Doğru');gecisBasla(()=>sinifCiz(r),FAST?30:520)})}
function renderSinif(r){state.ix=0;state.not='';state.sayim=r.kutular.map(()=>0);sinifCiz(r)}

/* ===== SIRA: gerçek sahnede adım sıralama; roket-yakıt yok.
   Yanlışta bütün dizi silinmez, yalnız son seçim geri alınır. ===== */
/* Kartlar dizi sırasında çizilirse ve doğru sıra [0,1,2,...] ise, doğru
   cevap ekrandan okunur. Tohumlu (Math.random'sız) karıştırma ile ekran
   dizilişi ayrılır; data-kart gerçek dizini taşımayı sürdürür. */
function siraDizilim(r,tohum){
 const n=r.kartlar.length,idx=[...Array(n).keys()];
 let x=(tohum*2654435761)%2147483647; if(x<=0)x+=2147483646;
 for(let i=n-1;i>0;i--){x=(x*48271)%2147483647;const j=x%(i+1);const t=idx[i];idx[i]=idx[j];idx[j]=t}
 if(idx.every((v,i)=>v===(r.dogru||[])[i]))idx.push(idx.shift());
 return idx}
function siraTohum(){let h=0;const s=GAME_ID+':'+roundIndex;
 for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
 return Math.abs(h)+1}
function siraCiz(r){
 $('#stage').innerHTML=sahneHtml(r)+
  (r.gorev?`<div class="konus-balon">${esc(r.gorev)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 const d=state.dizi||[];
 if(!state.dizilim)state.dizilim=siraDizilim(r,siraTohum());
 $('#task').innerHTML=`<div class="dizi">${state.dizilim.map(i=>{
   const k=r.kartlar[i],p=d.indexOf(i);
   return `<button class="sirakart ${p>=0?'secili':''}" data-kart="${i}"><span class="no">${p>=0?p+1:''}</span><span>${esc(k.t)}</span></button>`}).join('')}</div>`+
  `<div class="hint">${d.length}/${r.kartlar.length} adım dizildi. ${esc(r.ipucu||'')}</div>`;
 $$('[data-kart]').forEach(b=>b.onclick=()=>{
  if(state.gecis||locked)return;
  const i=+b.dataset.kart;
  if(d.indexOf(i)>=0)return feedback('Bunu dizdin');
  if(i!==r.dogru[d.length]){
   state.not=(r.ipucular&&r.ipucular[d.length])||'Önce ne olmalı? Sahneye bak.';
   siraCiz(r);return wrong(state.not)}
  state.dizi=d.concat(i);state.not='';
  if(state.dizi.length>=r.dogru.length){siraCiz(r);return good()}
  siraCiz(r)})}
function renderSira(r){state.dizi=[];state.not='';state.dizilim=null;siraCiz(r)}

/* ===== ESLE: parça ile hedef arasında emoji/renk eşleşmesi YOK; karar bilgiye
   dayanır. Dokunma alanları 44 px üstünde (şartname ölçüt 4 ve 5). ===== */
function esleCiz(r){
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="esle-alan">${r.yuvalar.map((y,i)=>{
    const v=(state.yerlesen||[])[i];
    return `<button class="yuva ${v!=null?'dolu':''}" data-yuva="${i}">`+
     (y.gorsel?y.gorsel:'')+
     `<span class="hedef">${esc(y.hedef)}</span>`+
     (v!=null?`<span class="kondu">${esc(r.etiketler[v].t)}</span>`:'')+
     (v!=null&&y.basari?y.basari:'')+`</button>`}).join('')}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="etiketler">${r.etiketler.map((e,j)=>{
    const kondu=(state.yerlesen||[]).indexOf(j)>=0;
    return `<button class="etiket ${kondu?'bitti':''} ${state.secEt===j?'secili':''}" data-et="${j}">${esc(e.t)}</button>`}).join('')}</div>`+
  `<div class="hint">${esc(r.ipucu||'Önce alttan bir kart seç, sonra ait olduğu satıra dokun.')}</div>`;
 $$('[data-et]').forEach(b=>b.onclick=()=>{if(locked)return;state.secEt=+b.dataset.et;esleCiz(r)});
 $$('[data-yuva]').forEach(b=>b.onclick=()=>{
  if(locked||state.secEt==null)return;
  const i=+b.dataset.yuva;
  if((state.yerlesen||[])[i]!=null)return feedback('Bu satır dolu');
  if(state.secEt!==r.yuvalar[i].dogru){
   state.not=r.yuvalar[i].hint||'Bu kart bu satıra ait değil. Ne işe yaradığını düşün.';
   state.secEt=null;esleCiz(r);return wrong(state.not)}
  state.yerlesen[i]=state.secEt;state.not=r.yuvalar[i].neden||'';
  if(r.sesliSoyle)speak(r.etiketler[state.secEt].t);
  state.secEt=null;
  esleCiz(r);
  if(state.yerlesen.every(v=>v!=null))good()})}
function renderEsle(r){state.yerlesen=r.yuvalar.map(()=>null);state.secEt=null;state.not='';esleCiz(r)}

/* ===== YAZ: gerçek üretim. Hazır cümle kopyalamak reddedilir; ölçütler
   yazarken canlı işaretlenir (şartname: son turda kendi örneği). ===== */
function olcutDurum(r,t){
 const k=kelimeSay(t),ham=String(t||'').trim(),d=[];
 if(r.enAzKelime)d.push({ad:`En az ${r.enAzKelime} sözcük yaz`,tam:k>=r.enAzKelime});
 if(r.buyukHarf)d.push({ad:'Büyük harfle başla',tam:/^[A-ZÇĞİÖŞÜ]/.test(ham)});
 if(r.bitis)d.push({ad:`Sonuna "${r.bitis}" koy`,tam:ham.endsWith(r.bitis)});
 (r.gerekli||[]).forEach(g=>d.push({ad:`"${g}" sözcüğünü kullan`,tam:sadelestir(t).includes(sadelestir(g))}));
 return d}
function yazCiz(r){
 const t=state.yazi||'',d=olcutDurum(r,t),tam=d.every(x=>x.tam);
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="konus-balon">${esc(r.gorev)}</div>`+
  (r.ornek?`<div class="sahne-not">${esc(r.ornek)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=
  `<textarea class="yazi-alan" id="yaziAlan" placeholder="${esc(r.ipucuMetin||'Buraya kendi cümleni yaz.')}">${esc(t)}</textarea>`+
  `<div class="olcut">${d.map(x=>`<div class="${x.tam?'tam':''}">${x.tam?'✓':'○'} ${esc(x.ad)}</div>`).join('')}</div>`+
  `<button class="choice" id="yazOk" ${tam?'':'disabled style="opacity:.5"'}>Bitirdim</button>`;
 const ta=$('#yaziAlan');
 ta.oninput=()=>{const c=ta.selectionStart;state.yazi=ta.value;yazCiz(r);
  const y=$('#yaziAlan');y.focus();try{y.setSelectionRange(c,c)}catch(e){}};
 $('#yazOk').onclick=()=>{
  if(locked)return;
  const kopya=(r.yasak||[]).some(y=>sadelestir(state.yazi)===sadelestir(y));
  if(kopya){state.not='Bu, ekrandaki örnek cümlenin aynısı. Kendi cümleni yaz.';yazCiz(r);return wrong(state.not)}
  if(!olcutDurum(r,state.yazi).every(x=>x.tam))return wrong('Ölçütlerin hepsi tamam değil.');
  good()}}
function renderYaz(r){state.yazi=r.baslangicMetni||'';state.not='';yazCiz(r)}

/* ===== KONUS: örnek dinlenir, öğrenci GERÇEKTEN ses üretir (süre ölçülür),
   sonra ölçütleri tek tek işaretler. ===== */
function konusCiz(r){
 const sure=state.sure||0;
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="konus-balon">${esc(r.gorev)}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(state.faz===0){
  $('#task').innerHTML=`<button class="choice" id="ornekDinle">Örneği dinle</button>`+
   `<button class="choice" id="konusBasla" ${state.dinledi?'':'disabled style="opacity:.5"'}>Şimdi ben anlatacağım</button>`+
   `<div class="hint">Önce örneği dinle, sonra kendi anlatımını yap.</div>`;
  $('#ornekDinle').onclick=()=>{state.dinledi=true;speak(r.ornek,true);state.not='Örneği dinledin. Şimdi sıra sende.';konusCiz(r)};
  $('#konusBasla').onclick=()=>{if(!state.dinledi)return;state.faz=1;konusCiz(r)};
  return}
 if(state.faz===1){
  const yeter=sure>=1200;
  $('#task').innerHTML=`<button class="tut ${state.basili?'basili':''}" id="konusTut">Basılı tut ve konuş</button>`+
   `<div class="sure-cubuk"><i style="--w:${Math.min(100,sure/2000*100)}%"></i></div>`+
   `<div class="hint">${yeter?'Anlatımın kaydedildi.':'En az 1,2 saniye konuş.'} (${(sure/1000).toFixed(1)} sn)</div>`+
   (yeter?`<button class="choice" id="konusBitti">Anlattım</button>`:'');
  const b=$('#konusTut');
  const bas=()=>{state.basili=true;state.bas=Date.now();konusCiz(r);
   state.sayac=setInterval(()=>{state.sure=Date.now()-state.bas;const c=$('.sure-cubuk i');
    if(c)c.style.setProperty('--w',Math.min(100,state.sure/2000*100)+'%')},80)};
  const birak=()=>{if(!state.basili)return;state.basili=false;clearInterval(state.sayac);
   state.sure=Date.now()-state.bas;
   state.not=state.sure>=1200?'Anlatımını aldık.':'Çok kısa oldu; biraz daha uzun anlat.';konusCiz(r)};
  b.onpointerdown=e=>{e.preventDefault();bas()};
  b.onpointerup=birak;b.onpointerleave=birak;b.onpointercancel=birak;
  const bt=$('#konusBitti');if(bt)bt.onclick=()=>{state.faz=2;state.not='';konusCiz(r)};
  return}
 const rub=state.rubrik||[];
 $('#task').innerHTML=`<div class="caption soru">Kendi anlatımını değerlendir:</div>`+
  `<div class="rubrik">${r.olcutler.map((o,i)=>`<button class="${rub.indexOf(i)>=0?'on':''}" data-ol="${i}">${rub.indexOf(i)>=0?'✓':'○'} ${esc(o)}</button>`).join('')}</div>`+
  `<button class="choice" id="konusOk" ${rub.length>=r.olcutler.length?'':'disabled style="opacity:.5"'}>Tamamla</button>`;
 $$('[data-ol]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ol;
  state.rubrik=rub.indexOf(i)>=0?rub.filter(x=>x!==i):rub.concat(i);konusCiz(r)});
 $('#konusOk').onclick=()=>{if((state.rubrik||[]).length>=r.olcutler.length)good()}}
function renderKonus(r){state.faz=0;state.dinledi=false;state.sure=0;state.basili=false;state.rubrik=[];state.not='';konusCiz(r)}

 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+

 const al=$('#mesafeAlan');
 al.oninput=()=>{state.olcek=+al.value;mesafeCiz(r);const y=$('#mesafeAlan');if(y)y.focus()};
 $('#mesafeOk').onclick=()=>{

function cantaCiz(r){

 const dolu=Math.round(al.length/r.gerekenSayi*100);
 $('#stage').innerHTML=sahneHtml(r)+

 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="esyalar">${r.esyalar.map((e,j)=>`<button class="esya ${al.indexOf(j)>=0?'alindi':''}" data-esya="${j}">${esc(e.t)}</button>`).join('')}</div>`+

 $$('[data-esya]').forEach(b=>b.onclick=()=>{

   cantaCiz(r);return wrong(state.not)}

/* ===== CETELE: rakam sayacı yok — işaretler çetele çizgisiyle birikir ve
   beşinci çizgi dördünü keser. Yanıt cümlesi satır adını birebir söylemez. ===== */
function ceteleSvg(n){
 const tam=Math.floor(n/5),kalan=n%5,g=[];
 const grup=(k,cizik)=>`<svg width="${k*7+(cizik?10:0)}" height="24" viewBox="0 0 ${k*7+(cizik?10:0)} 24">`+
  Array.from({length:k},(_,i)=>`<line x1="${3+i*7}" y1="3" x2="${3+i*7}" y2="21" stroke="#2f5fa8" stroke-width="3" stroke-linecap="round"/>`).join('')+
  (cizik?`<line x1="0" y1="20" x2="${k*7+6}" y2="4" stroke="#c8342b" stroke-width="3" stroke-linecap="round"/>`:'')+`</svg>`;
 for(let i=0;i<tam;i++)g.push(grup(4,true));
 if(kalan)g.push(grup(kalan,false));
 return g.join('')||'<span style="font-size:12px;color:#8aa0b2">—</span>'}
function ceteleCiz(r){
 const i=state.ix||0,o=r.oylar[i],say=state.say||r.satirlar.map(()=>0);
 $('#stage').innerHTML=sahneHtml(r)+
  (o?`<div class="konus-balon">${esc(o.t)}</div>`:'')+
  ilerleme(r.oylar.length,i)+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="cetele-tablo">${r.satirlar.map((sa,j)=>
    `<button class="cetele-satir ${state.sonSatir===j?'vurgu':''}" data-satir="${j}">`+
    `<span class="ad">${esc(sa)}</span><span class="isaret">${ceteleSvg(say[j])}</span></button>`).join('')}</div>`+
  `<div class="hint">${esc(r.ipucu||'Beşinci çizgi dördünü keser.')}</div>`;
 $$('[data-satir]').forEach(b=>b.onclick=()=>{
  if(locked||state.gecis||!o)return;
  const j=+b.dataset.satir;
  if(j!==o.dogru){state.not=o.hint||'Söylenene yeniden bak: hangi görevi anlatıyor?';
   ceteleCiz(r);return wrong(state.not)}
  state.say=say.slice();state.say[j]++;state.sonSatir=j;state.ix=i+1;state.not=o.neden||'';
  if(state.ix>=r.oylar.length){ceteleCiz(r);return good()}
  feedback('İşlendi');gecisBasla(()=>ceteleCiz(r),FAST?30:480)})}
function renderCetele(r){state.ix=0;state.say=r.satirlar.map(()=>0);state.not='';state.sonSatir=null;ceteleCiz(r)}

/* ===== YON: bloklar KUZEY/GÜNEY/DOĞU/BATI. Yön adının ekranda hangi yöne
   karşılık geldiği YALNIZ güneşin konumundan çıkarılabilir; ekran okları yok.
   (Şartname h27: kazanım ile mekanik kopukluğunun giderilmesi.) ===== */
const KENAR=['ust','sag','alt','sol'];
const PUSULA=['KUZEY','DOĞU','GÜNEY','BATI'];
const ADIM={ust:[0,-1],sag:[1,0],alt:[0,1],sol:[-1,0]};
function yonKenar(t){                       /* pusula adı -> ekran kenarı */
 const gk=KENAR.indexOf(t.gunesKenar);
 const dogu=(t.zaman==='sabah')?gk:(gk+2)%4;   /* akşam güneşi batıda */
 const m={};PUSULA.forEach((ad,i)=>{m[ad]=KENAR[(dogu+i-1+4)%4]});
 return m}
function yonCiz(r){
 const i=state.ix||0,t=r.turlar[i];if(!t)return;
 const m=yonKenar(t),prog=state.prog||[],rp=state.robot||t.baslangic;
 const huc=(x,y)=>{
  const engel=t.engeller.some(e=>e[0]===x&&e[1]===y);
  const hedef=t.hedef[0]===x&&t.hedef[1]===y, rob=rp[0]===x&&rp[1]===y;
  return `<div class="huc ${engel?'engel':''} ${hedef?'hedef':''} ${rob?'robot':''}">${rob?'●':(hedef?'⌂':'')}</div>`};
 $('#stage').innerHTML=
  `<div class="konus-balon">${esc(t.t)}</div>`+
  `<div class="harita-sar"><div class="gunes ${t.gunesKenar}">`+
   `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="8" fill="#f7cf5a" stroke="#d6a41f" stroke-width="2"/>`+
   [0,45,90,135,180,225,270,315].map(a=>`<line x1="15" y1="15" x2="${15+13*Math.cos(a*Math.PI/180)}" y2="${15+13*Math.sin(a*Math.PI/180)}" stroke="#e8b93a" stroke-width="2"/>`).join('')+
   `</svg><span>${esc(t.zaman)} güneşi</span></div>`+
   `<div class="harita">${[0,1,2,3].map(y=>[0,1,2,3].map(x=>huc(x,y)).join('')).join('')}</div></div>`+
  ilerleme(r.turlar.length,i)+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="program">${prog.length?prog.map((b,k)=>`<span class="blok ${state.hataAdim===k?'hata':''}">${esc(b)}</span>`).join(''):'<span class="hint">Henüz blok eklemedin.</span>'}</div>`+
  `<div class="yon-tus">${PUSULA.map(ad=>`<button data-yon="${ad}">${ad}</button>`).join('')}`+
   `<button data-geri="1">Son bloğu sil</button><button id="calistir">Çalıştır</button></div>`+
  `<div class="hint">${esc(r.ipucu||'Güneş sabah doğudan doğar, akşam batıdan batar.')}</div>`;
 $$('[data-yon]').forEach(b=>b.onclick=()=>{if(locked||state.gecis)return;
  if(prog.length>=8)return feedback('Program çok uzun');
  state.prog=prog.concat(b.dataset.yon);state.hataAdim=null;yonCiz(r)});
 $('[data-geri]').onclick=()=>{if(locked||state.gecis)return;state.prog=prog.slice(0,-1);state.hataAdim=null;yonCiz(r)};
 $('#calistir').onclick=()=>{
  if(locked||state.gecis||!prog.length)return;
  let p=t.baslangic.slice();
  for(let k=0;k<prog.length;k++){
   const [dx,dy]=ADIM[m[prog[k]]];const n=[p[0]+dx,p[1]+dy];
   const disi=n[0]<0||n[0]>3||n[1]<0||n[1]>3;
   const engel=t.engeller.some(e=>e[0]===n[0]&&e[1]===n[1]);
   if(disi||engel){state.robot=p;state.hataAdim=k;
    state.not=(disi?'Robot haritadan çıkacaktı.':'Robot engele çarptı.')+' Güneşin konumuna yeniden bak: bu adım hangi yöne gidiyor?';
    yonCiz(r);return wrong(state.not)}
   p=n}
  state.robot=p;
  if(p[0]!==t.hedef[0]||p[1]!==t.hedef[1]){
   state.hataAdim=prog.length-1;state.not='Robot kampa varamadı. Programı tümüyle silme, eksik adımı ekle.';
   yonCiz(r);return wrong(state.not)}
  state.ix=i+1;state.prog=[];state.robot=null;state.hataAdim=null;state.not=t.neden||'';
  if(state.ix>=r.turlar.length){yonCiz(r);return good()}
  feedback('Kampa vardın');gecisBasla(()=>yonCiz(r),FAST?30:640)}}
function renderYon(r){state.ix=0;state.prog=[];state.robot=null;state.hataAdim=null;state.not='';yonCiz(r)}

/* ===== MUSLUK: kronometre yok. Gerçek musluk, kap ve akan su var; gereken
   miktar görev metninde SÖYLENMEZ, öğrenci işe bakarak karar verir. Fazlası
   taşar ve görünür; taşırmak ceza değil, sorudur. (Şartname h29) ===== */
function muslukCiz(r){
 const i=state.ix||0,is=r.isler[i];if(!is)return;
 const y=Math.min(130,state.yuzde||0),tasan=Math.max(0,y-100);
 $('#stage').innerHTML=
  `<div class="konus-balon">${esc(is.t)}</div>`+
  `<div class="lavabo"><svg class="arka" viewBox="0 0 300 196" preserveAspectRatio="none">`+
    `<rect x="206" y="2" width="16" height="32" rx="4" fill="#8f9dab"/>`+
    `<path d="M214 34 q0 24 -28 24 h-36" fill="none" stroke="#8f9dab" stroke-width="13" stroke-linecap="round"/>`+
    `<rect x="192" y="4" width="44" height="9" rx="4" fill="#7b8996"/>`+
    `<circle cx="214" cy="2" r="7" fill="#7b8996"/>`+
    `<path d="M40 132 h220 l-22 46 h-176z" fill="#e4edf2" stroke="#a9bcc8" stroke-width="4"/>`+
    `<rect x="34" y="124" width="232" height="11" rx="5" fill="#c3d3dd"/>`+
    `<ellipse cx="150" cy="170" rx="13" ry="4" fill="#a9bcc8"/></svg>`+
   `<div class="akis ${state.basili?'acik':''}" style="height:${state.basili?46:0}px"></div>`+
   `<div class="bardak"><i style="--su:${Math.min(100,y)}%"></i></div>`+
   (tasan?`<div class="tasan">taşan su: ${Math.round(tasan)} birim</div>`:'')+
   `</div>`+
  ilerleme(r.isler.length,i)+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=
  `<button class="tut ${state.basili?'basili':''}" id="musluk">Musluğu basılı tut</button>`+
  `<div class="sure-cubuk"><i style="--w:${Math.min(100,y)}%"></i></div>`+
  `<button class="choice" id="muslukOk">Bu kadar yeter</button>`+
  `<div class="hint">${esc(r.ipucu||'Ne kadar gerektiğine işe bakarak sen karar ver.')}</div>`;
 const b=$('#musluk');
 const bas=()=>{if(locked||state.gecis)return;state.basili=true;state.bas=Date.now();state.baslangicYuzde=state.yuzde||0;muslukCiz(r);
  state.sayac=setInterval(()=>{const v=state.baslangicYuzde+(Date.now()-state.bas)/30;
   state.yuzde=Math.min(130,v);const c=$('.bardak i');if(c)c.style.setProperty('--su',Math.min(100,state.yuzde)+'%');
   const s2=$('.sure-cubuk i');if(s2)s2.style.setProperty('--w',Math.min(100,state.yuzde)+'%')},70)};
 const birak=()=>{if(!state.basili)return;state.basili=false;clearInterval(state.sayac);
  state.yuzde=Math.min(130,state.baslangicYuzde+(Date.now()-state.bas)/30);muslukCiz(r)};
 b.onpointerdown=e=>{e.preventDefault();bas()};
 b.onpointerup=birak;b.onpointerleave=birak;b.onpointercancel=birak;
 $('#muslukOk').onclick=()=>{
  if(locked||state.gecis||state.basili)return;
  const v=state.yuzde||0;
  if(v>100){state.not='Su taştı. Bu iş için bu kadarı gerekiyor muydu? Yeniden dene.';
   state.yuzde=0;muslukCiz(r);return wrong(state.not)}
  if(v<is.enAz||v>is.enCok){state.not=v<is.enAz?'Bu iş bu kadar suyla yapılamaz.':'Bu iş için bu kadar su gerekmiyor; fazlası boşa gidiyor.';
   state.yuzde=0;muslukCiz(r);return wrong(state.not)}
  state.ix=i+1;state.yuzde=0;state.not=is.neden||'';
  if(state.ix>=r.isler.length)return good();
  feedback('Tam gerektiği kadar');gecisBasla(()=>muslukCiz(r),FAST?30:600)}}
function renderMusluk(r){state.ix=0;state.yuzde=0;state.basili=false;state.not='';muslukCiz(r)}

/* ===== TAHMIN: tren-tünel yok. Akan musluk ve dolan kova görünür; tahmin,
   gerçek değer ve fark birlikte gösterilip karşılaştırma sorulur. (h30) ===== */
function tahminCiz(r){
 const i=state.ix||0,d=r.durumlar[i];if(!d)return;
 const t=state.tahmin==null?d.enCokOlcek/2:state.tahmin;
 const oran=v=>Math.min(100,v/d.enCokOlcek*100);
 $('#stage').innerHTML=
  `<div class="konus-balon">${esc(d.t)}</div>`+
  `<div class="kova-sar">`+
   `<div class="stack"><div class="kova"><i style="height:${oran(t)}%"></i><b>tahminim</b></div><div class="sahne-not">${t} ${esc(d.birim)}</div></div>`+
   (state.faz===1?`<div class="stack"><div class="kova"><i style="height:${oran(d.gercek)}%;background:linear-gradient(#f0b0a0,#d0483f)"></i><b>gerçek</b></div><div class="sahne-not">${d.gercek} ${esc(d.birim)}</div></div>`:'')+
  `</div>`+
  (state.faz===1?`<div class="karsilastir"><div><span>Tahminin</span><span>${t} ${esc(d.birim)}</span></div>`+
    `<div><span>Gerçek</span><span>${d.gercek} ${esc(d.birim)}</span></div>`+
    `<div><span>Fark</span><span>${Math.abs(d.gercek-t)} ${esc(d.birim)}</span></div></div>`:'')+
  ilerleme(r.durumlar.length,i)+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(state.faz===0){
  $('#task').innerHTML=`<div class="caption soru">${esc(d.soru)}</div>`+
   `<input class="olcek" type="range" min="0" max="${d.enCokOlcek}" step="${d.adim||1}" value="${t}" id="tahminAlan" aria-label="Tahmin ölçeri">`+
   `<button class="choice" id="tahminOk">Tahminim bu</button>`+
   `<div class="hint">Tahmininde doğru ya da yanlış yok; sonra gerçeğiyle karşılaştıracaksın.</div>`;
  const al=$('#tahminAlan');
  al.oninput=()=>{state.tahmin=+al.value;tahminCiz(r);const y=$('#tahminAlan');if(y)y.focus()};
  $('#tahminOk').onclick=()=>{if(locked)return;state.tahmin=t;state.faz=1;
   state.not='Şimdi gerçek değerle karşılaştır.';tahminCiz(r)};
  return}
 $('#task').innerHTML=`<div class="caption soru">${esc(d.yorumSoru)}</div>`+
  `<div class="choices">${d.secenekler.map((c,j)=>`<button class="choice" data-tsec="${j}">${esc(c.label)}</button>`).join('')}</div>`;
 $$('[data-tsec]').forEach(b=>b.onclick=()=>{
  if(locked||state.gecis)return;
  const c=d.secenekler[+b.dataset.tsec];
  if(!c.correct)return wrong(c.hint||'Tabloya yeniden bak.');
  state.ix=i+1;state.faz=0;state.tahmin=null;state.not=d.neden||'';
  if(state.ix>=r.durumlar.length)return good();
  feedback('Doğru');gecisBasla(()=>tahminCiz(r),FAST?30:600)})}
function renderTahmin(r){state.ix=0;state.faz=0;state.tahmin=null;state.not='';tahminCiz(r)}
