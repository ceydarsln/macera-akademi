<title>3. Sınıf Fen Bilimleri — Gözlem ve Kanıt Sahneleri</title>

<script src="scene-proverb-geology.js?v=20260923"></script>
<style>
:root{--ink:#1b2f45;--muted:#516d87;--panel:rgba(255,255,255,.95);--ok:#14855c;--bad:#cd463d;--gold:#dfa32a;--blue:#2c7cb6;--line:#b6cada;--toprak:#8b5e3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#dbecfa;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;isolation:isolate}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:7px 9px;background:rgba(255,255,255,.97);box-shadow:0 3px 15px rgba(25,59,85,.16);z-index:30}
.round{font-size:clamp(13px,3.2vw,17px);font-weight:950;white-space:nowrap}
.prompt{font-size:clamp(11px,2.7vw,14px);line-height:1.18;font-weight:850;text-align:center;overflow-wrap:break-word}
.hud-right{display:flex;align-items:center;gap:5px}
.lives{font-size:15px;letter-spacing:-3px;white-space:nowrap}
.sound{width:46px;height:44px;border:0;border-radius:13px;background:#e3f3ff;box-shadow:0 2px 0 #aacce2;font-size:20px}
.scene{position:relative;min-height:0;overflow:auto;padding:9px 9px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;background:linear-gradient(#d5eafd 0 58%,#a9c9e0 58%)}
/* Her tema kendi konusunun gerçek mekânı: uzay zemini ve fabrika bandı yok. */
.scene[data-theme="lab"]{background:linear-gradient(#e2f7f2 0 66%,#79b7a6 66%)}
.scene[data-theme="defter"]{background:linear-gradient(#fdf7e6 0 70%,#c9a86a 70%)}
.scene[data-theme="doga"]{background:linear-gradient(#d5eafd 0 52%,#8bbf6e 52%)}
.scene[data-theme="kazi"]{background:linear-gradient(#f6e7cf 0 40%,#b98a55 40%)}
.scene[data-theme="kayac"]{background:linear-gradient(#e7e2da 0 44%,#8c8279 44%)}
.scene[data-theme="tarla"]{background:linear-gradient(#dff0fb 0 46%,#9a6a44 46%)}
.scene[data-theme="atolye"]{background:linear-gradient(#e7edf3 0 66%,#7b8ea1 66%)}
.scene[data-theme="ev"]{background:linear-gradient(#fdeee2 0 68%,#b08360 68%)}
.scene[data-theme="golet"]{background:linear-gradient(#d9f0fb 0 50%,#5aa7bf 50%)}
.scene[data-theme="bahce"]{background:linear-gradient(#d9eefb 0 54%,#7fb463 54%)}
.scene[data-theme="park"]{background:linear-gradient(#dbeafb 0 56%,#93bd77 56%)}
.stage{position:relative;flex:1 0 auto;min-height:200px;border-radius:22px;padding:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.86);border:2px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(20,56,82,.14)}
.task{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto}
.caption{width:100%;text-align:center;font-size:clamp(12px,3.1vw,15px);font-weight:850;line-height:1.28}
.caption.soru{font-size:clamp(13px,3.5vw,17px);font-weight:950}
.hint{width:100%;text-align:center;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;width:100%}
.choices{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:8px;width:100%}
.choice{min-height:52px;flex:1 1 100%;max-width:340px;border:3px solid #fff;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 rgba(35,77,108,.2);padding:9px 12px;font-weight:900;font-size:clamp(13px,3.4vw,16px);line-height:1.25;text-align:center;overflow-wrap:anywhere}
.choice.kisa{flex:1 1 44%;max-width:170px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,77,108,.2)}
/* karar verilecek kart HER ZAMAN tam görünür; bant akışı yok (ölçüt 5) */
.kart{flex:0 0 auto;width:min(324px,95%);min-height:56px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 13px;font-weight:880;font-size:clamp(13px,3.5vw,16px);line-height:1.34;text-align:center;overflow-wrap:break-word;box-shadow:0 4px 0 rgba(35,77,108,.14)}
.kart.vurgu{border-color:var(--gold);background:#fffaf0}
/* kutu etiketi kutu İÇİNDE kalır: taşma yerine sarma ve alt açıklama satırı */
.kutular{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
.kutu{flex:1 1 45%;min-width:126px;max-width:210px;min-height:56px;border:3px solid #7fa3bd;border-radius:15px;background:#eef7fd;padding:8px 9px;font-weight:950;font-size:clamp(11px,3vw,14px);line-height:1.22;text-align:center;overflow-wrap:break-word}
.kutu .alt{display:block;font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.15;margin-top:2px}
.kutu .sayac{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.ilerleme{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:11px;height:11px;border-radius:50%;background:#cfdde8;border:2px solid #a8bfd0}
.ilerleme i.ok{background:var(--ok);border-color:#0b6a48}
.ilerleme i.simdi{background:var(--gold);border-color:#a97c14}
.metin-kart{flex:0 0 auto;width:min(330px,96%);overflow:visible;background:#fffdf6;border:3px solid #d8c9a4;border-radius:14px;padding:10px 12px;font-size:clamp(13px,3.4vw,15px);line-height:1.5;text-align:left;overflow-wrap:break-word}
.metin-kart .baslik{font-weight:950;font-size:13px;color:#8a6a2c;margin-bottom:5px}
.dizi{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.sirakart{flex:0 0 auto;width:min(324px,95%);min-height:50px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:8px 11px;font-weight:870;font-size:clamp(12px,3.3vw,15px);line-height:1.3;text-align:left;overflow-wrap:break-word;display:flex;align-items:center;gap:8px;touch-action:none}
.sirakart .no{flex:0 0 24px;height:24px;border-radius:50%;background:#e6eef5;color:var(--muted);font-size:12px;font-weight:950;display:flex;align-items:center;justify-content:center}
.sirakart.secili{border-color:var(--ok);background:#e9f7f0}
.sirakart.secili .no{background:var(--ok);color:#fff}
.sira-hedef{width:min(330px,96%);min-height:72px;border:3px dashed #6f9cba;border-radius:16px;background:rgba(255,255,255,.78);padding:7px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.sira-hedef .sira-bos{text-align:center;color:var(--muted);font-size:12px;font-weight:900;line-height:1.3}
.sira-hedef .sira-adim{display:flex;align-items:flex-start;gap:6px;border:2px solid #91c8ae;border-radius:10px;background:#e9f7f0;padding:4px 7px;font-size:12px;font-weight:850;line-height:1.25;text-align:left}
.sira-hedef .sira-adim b{flex:0 0 21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:11px}
.esle-alan{display:flex;flex-direction:column;gap:7px;width:100%;align-items:center}
.yuva{flex:0 0 auto;width:min(330px,96%);min-height:58px;border:3px dashed #6f9cba;border-radius:15px;background:rgba(255,255,255,.72);padding:7px 9px;display:flex;align-items:center;gap:9px;text-align:left}
.yuva.dolu{border-style:solid;border-color:var(--ok);background:#e9f7f0}
.yuva .hedef{flex:1 1 auto;font-weight:880;font-size:clamp(12px,3.2vw,14px);line-height:1.3;overflow-wrap:break-word}
.yuva .kondu{flex:0 0 auto;max-width:44%;font-weight:900;font-size:12px;color:#0b6a48;line-height:1.2;overflow-wrap:break-word}
/* parça yazısı çipe TAM sığar: kesme yok, sarma var (ölçüt: dragMatch) */
.etiketler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.etiket{min-height:46px;min-width:46px;max-width:200px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);padding:7px 10px;font-weight:880;font-size:clamp(11px,3vw,13px);line-height:1.25;overflow-wrap:break-word;white-space:normal;touch-action:none}
.etiket.secili{border-color:var(--gold);background:#fff7e2}
.etiket.bitti{visibility:hidden}
.ui-dragging{position:relative!important;z-index:999!important;pointer-events:none!important;opacity:.94;box-shadow:0 10px 25px rgba(0,0,0,.28)!important}
.drop-hot{filter:drop-shadow(0 0 9px #f1b53a)!important;outline:4px solid #f1b53a!important;outline-offset:3px}
[data-sinif-kart]{touch-action:none;cursor:grab}
.feedback{position:absolute;left:50%;top:46%;z-index:150;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#fff;border:4px solid var(--ok);border-radius:22px;padding:14px 19px;min-width:200px;text-align:center;font-size:clamp(17px,4.6vw,25px);font-weight:1000;box-shadow:0 12px 38px rgba(0,0,0,.27)}
.feedback.show{animation:pop .95s ease both}
.feedback.bad{border-color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%,74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes hop{50%{transform:translateY(-14px) scale(1.04)}}
.shake{animation:shake .38s}.success-motion{animation:hop .7s ease}
.overlay{position:absolute;inset:0;z-index:300;background:rgba(9,27,46,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{width:min(390px,94%);background:white;border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.overlay h2{margin:0 0 8px;font-size:27px}.overlay p{font-size:15px;font-weight:750;color:var(--muted);line-height:1.35}
.big{font-size:clamp(38px,11vw,64px)}
/* TOPLA — çanta/plan/pano gerçekten dolar; seçilen şey ekranda görünür */
.depo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.depo button{min-height:48px;min-width:48px;max-width:200px;border:3px solid #fff;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);padding:7px 10px;font-weight:880;font-size:clamp(11px,3vw,13px);line-height:1.25;overflow-wrap:break-word;touch-action:none}
.depo button.bitti{visibility:hidden}
.canta{width:min(330px,96%);min-height:96px;border:3px solid var(--toprak);border-radius:16px 16px 20px 20px;background:#fdf3e6;padding:8px 9px;display:flex;flex-direction:column;gap:5px}
.canta .bas{font-size:12px;font-weight:950;color:#7a4e2c;text-align:center}
.canta .icerik{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:44px;align-content:flex-start}
.canta .icerik span{background:#fff;border:2px solid #d3b28c;border-radius:10px;padding:4px 7px;font-size:11.5px;font-weight:900;line-height:1.2;max-width:150px}
.canta .bos{font-size:11.5px;font-weight:800;color:#a78460;align-self:center}
.grafik-blok{min-width:150px;min-height:48px;border:3px solid #fff;border-radius:14px;background:var(--blue);color:#fff;box-shadow:0 3px 0 #1b5a88;font-weight:950;touch-action:none}
/* HAFIZA — kart yerleri her açılışta karışır, can standardı 3 */
.hafiza-alan{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(330px,96%)}
.hkart{min-height:62px;border:3px solid var(--line);border-radius:13px;background:#eef6fc;padding:5px 6px;font-size:11px;font-weight:880;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:break-word}
.hkart.kapali{background:#5f86a6;border-color:#456c8c;color:#5f86a6}
.hkart.acik{background:#fff;border-color:var(--gold)}
.hkart.eslesti{background:#e9f7f0;border-color:var(--ok);color:#0b6a48}
/* GRAFIK — veri satırı ekranda okunur, ölçek var, depo grafiği örtmez */
.veri-kutu{width:min(330px,96%);border:3px solid #b8a06e;border-radius:13px;background:#fffdf3;padding:7px 9px}
.veri-kutu .bas{font-size:12px;font-weight:950;color:#8a6a2c;margin-bottom:4px;text-align:center}
.veri-satir{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:900;padding:2px 4px;border-bottom:1px dotted #ddd0b4}
.veri-satir:last-child{border-bottom:0}
.grafik{width:min(330px,96%);display:flex;gap:5px;align-items:stretch}
.grafik .olcek-sutun{flex:0 0 22px;display:flex;flex-direction:column-reverse;font-size:10px;font-weight:900;color:var(--muted);text-align:right;padding-bottom:32px}
/* ölçek basamağı = blok yüksekliği (17px) + aralık (1px); kategori adı 24px,
   sütun aralığı 3px ve çerçeve 2px alttan düşülür ki sayı bloğun tam yanına gelsin */
.grafik .olcek-sutun span{flex:0 0 18px;height:18px;line-height:18px}
.grafik .sutunlar{flex:1 1 auto;display:flex;gap:5px;align-items:flex-end}
.gsutun{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.gsutun .bar{width:100%;border:2px solid #a8bfd0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(0deg,#eef4f9 0 17px,#dfe9f1 17px 18px);display:flex;flex-direction:column-reverse;gap:1px;padding:0}
.gsutun .bar i{display:block;flex:0 0 17px;height:17px;border-radius:3px;background:var(--blue)}
.gsutun .ad{font-size:10.5px;font-weight:950;line-height:1.1;text-align:center;min-height:24px;overflow-wrap:break-word}
/* OLCUM — dinamometre yayı ve yük ekranda; tren-tünel yok */
.olcek{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:min(330px,96%);height:48px;min-height:48px;background:transparent;margin:0}
.olcek::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0}
.olcek::-moz-range-track{height:14px;border-radius:8px;background:#dbe7ef;border:2px solid #a8bfd0}
.olcek::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-14px;border-radius:50%;background:#2c7cb6;border:4px solid #fff;box-shadow:0 2px 6px rgba(20,56,82,.35)}
.olcek::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:#2c7cb6;border:4px solid #fff}
/* TUS — ölçüm tablosu ekranda, cevap tabloda yazmaz */
.tablo{width:min(330px,96%);border:3px solid var(--line);border-radius:13px;background:#fff;overflow:hidden}
.tablo .satir{display:flex;font-size:12.5px;font-weight:880;border-bottom:1px solid #dfe8ef}
.tablo .satir:last-child{border-bottom:0}
.tablo .satir.bas{background:#eef6fc;font-weight:950;font-size:11.5px;color:var(--muted)}
.tablo .satir.vurgu{background:#fff7e2}
.tablo .h{flex:1 1 0;padding:6px 7px;line-height:1.2;overflow-wrap:break-word}
.tablo .h.sag{flex:0 0 84px;text-align:right}
.ekran{width:min(220px,80%);min-height:52px;border:3px solid #6f8ba3;border-radius:12px;background:#132a3d;color:#8ff0c0;font-size:26px;font-weight:950;display:flex;align-items:center;justify-content:center;letter-spacing:2px}
.tuslar{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}
.tuslar button{min-width:64px;min-height:52px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);font-size:20px;font-weight:950}
/* GOZLEM — patika, gözlem noktaları ve kayıt defteri */
.izgara{display:grid;gap:3px;width:min(300px,92%);margin:0 auto}
.hucre{aspect-ratio:1/1;min-height:44px;border-radius:8px;border:2px solid #a8bfd0;background:#eaf3ea;display:flex;align-items:center;justify-content:center;font-size:18px}
.hucre.patika{background:#e8dcc2;border-color:#c9a86a}
.hucre.engel{background:#a9bfa2;border-color:#7d9b78}
.hucre.nokta{background:#fff3d0;border-color:var(--gold)}
.hucre.robot{background:#d6ecfa;border-color:var(--blue)}
.hucre.kayitli{background:#e9f7f0;border-color:var(--ok)}
.program{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:min(330px,96%);min-height:44px;padding:5px;border:3px dashed #9fb0c4;border-radius:12px;background:#fff}
.program span{min-width:38px;min-height:34px;border-radius:8px;background:#eef6fc;border:2px solid var(--line);font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center}
.program span.hatali{background:#fde9e7;border-color:var(--bad)}
.yonler{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.yonler button{min-width:56px;min-height:48px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);font-size:20px;font-weight:950}
.defter{width:min(330px,96%);border:3px solid #c9a86a;border-radius:13px;background:#fffdf3;padding:7px 9px}
.defter .bas{font-size:12px;font-weight:950;color:#8a6a2c;text-align:center;margin-bottom:4px}
.defter .kayit{font-size:12px;font-weight:880;line-height:1.3;padding:2px 0;border-bottom:1px dotted #ddd0b4}
.defter .bos{font-size:11.5px;font-weight:800;color:#a78460;text-align:center}
/* SULA — gerçek saksı, fide ve sulama kabı; hedef sayı hiçbir yerde yazmaz */
.sula-sar{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.tut{min-height:60px;min-width:190px;border:3px solid #fff;border-radius:18px;background:#2c7cb6;color:#fff;font-weight:950;font-size:17px;box-shadow:0 5px 0 #1b5a88;user-select:none;touch-action:none}
.tut.basili{background:#1b5a88;transform:translateY(3px);box-shadow:0 2px 0 #134466}
.sure-cubuk{width:min(300px,92%);height:14px;border-radius:8px;background:#dbe7ef;overflow:hidden;border:2px solid #a8bfd0}
.sure-cubuk i{display:block;height:100%;width:var(--w,0%);background:var(--blue);transition:width .08s linear}
/* CUMLE — kartlar küçük harfle gelir; baş harf ve son işaret öğrencinin kararı */
.cumle-yuva{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:min(330px,96%);min-height:56px;padding:7px;border:3px dashed #9fb0c4;border-radius:13px;background:#fff;align-items:center}
.cumle-yuva span{min-height:40px;display:flex;align-items:center;padding:4px 8px;border-radius:9px;background:#eef6fc;border:2px solid var(--line);font-size:14px;font-weight:900}
.kelimeler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.kelime{min-height:46px;min-width:46px;border:3px solid #fff;border-radius:13px;background:var(--panel);box-shadow:0 3px 0 rgba(35,77,108,.2);padding:6px 11px;font-size:14px;font-weight:900;touch-action:none}
.kelime.bitti{visibility:hidden}
/* YAZ — gerçek üretim; hazır kart dizmek başarı sayılmaz */

  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};

function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(String(text||''),repeat)}catch(e){}

 $('.sound').onclick=()=>{const r=round();if(r)speak(r.prompt,true)};

    olabilir (gizli sekmede kuyrukta bekliyor). round() boşsa okuma. */

  if(r&&roundIndex===t)speak(r.prompt)})}

   erişilebilir seç-koy yedeği olarak çalışmayı sürdürür. */
function baglaSurukle(kaynakSec,hedefSec,birak){$$(kaynakSec).forEach(k=>{let aktif=false,tasindi=false,sx=0,sy=0;
 k.addEventListener('click',e=>{if(k.dataset.dragged){e.preventDefault();e.stopImmediatePropagation();delete k.dataset.dragged}},true);
 k.onpointerdown=e=>{if(k.disabled)return;aktif=true;tasindi=false;sx=e.clientX;sy=e.clientY;k.setPointerCapture?.(e.pointerId)};
 k.onpointermove=e=>{if(!aktif)return;tasindi=tasindi||Math.hypot(e.clientX-sx,e.clientY-sy)>7;if(!tasindi)return;k.classList.add('ui-dragging');k.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.07)`;$$(hedefSec).forEach(t=>{const b=t.getBoundingClientRect();t.classList.toggle('drop-hot',e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)})};
 const bitir=e=>{if(!aktif)return;let hit=null;$$(hedefSec).forEach(t=>{const b=t.getBoundingClientRect();if(e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom)hit=t;t.classList.remove('drop-hot')});aktif=false;k.releasePointerCapture?.(e.pointerId);k.classList.remove('ui-dragging');k.style.transform='';if(tasindi){k.dataset.dragged='1';if(hit&&e.type!=='pointercancel')birak(k,hit)}};

/* Ekran dizilişini veri sırasından ayıran tohumlu karıştırma: doğru sıra
   [0,1,2,…] olduğunda cevabın ekrandan okunmasını önler (Math.random yok:
   koşum yeniden çalıştırıldığında aynı diziliş üretilsin). */
function tohumlu(n,tohum){
 const idx=[...Array(n).keys()];
 let x=(tohum*2654435761)%2147483647; if(x<=0)x+=2147483646;
 for(let i=n-1;i>0;i--){x=(x*48271)%2147483647;const j=x%(i+1);const t=idx[i];idx[i]=idx[j];idx[j]=t}
 return idx}

/* ===== SINIFLA (eski beltSort) =====
   Bant akışı yok: kart sabit ve tam görünür. Kutu etiketi kutu içinde kalır
   (uzun tanım "alt" satırına iner). wrongHint doğru kutunun adını SÖYLEMEZ;
   yalnız karta yeniden bakmayı sağlayan bir soru sorar. Kart simgesi
   taşımaz — eşleştirme içeriğin okunmasıyla yapılır. ===== */
function sinifCiz(r){
 if(GAME_ID==='g13')return SceneProverbGeology.geology({r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g19')return SceneMirrorMatter.matter({r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g37')return SceneSimileGreenhouse.greenhouse({r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g31')return SceneBookPower.power({r,index:roundIndex,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g25')return SceneBridgesMotion.motion({r,index:roundIndex,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g18')return SceneForestDig.dig({r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g23')return SceneDestinations.recycle({r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 if(GAME_ID==='g07')return SceneCollections.render({id:GAME_ID,r,state,wrong,finish:good,next:gecisBasla,fast:FAST,locked:()=>locked});
 const i=state.ix||0,k=r.kartlar[i];
 if(!k)return;
 $('#stage').innerHTML=sahneHtml(r)+
  ilerleme(r.kartlar.length,i)+
  `<div class="kart vurgu" data-sinif-kart="1">${esc(k.t)}</div>`+
  (k.sahne?`<div class="sahne-not">${esc(k.sahne)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="kutular">${r.kutular.map((b,j)=>{
    const ad=typeof b==='string'?b:b.ad, alt=typeof b==='string'?'':b.alt;
    return `<button class="kutu" data-kutu="${j}">${esc(ad)}`+
     (alt?`<span class="alt">${esc(alt)}</span>`:'')+
     `<span class="sayac">${(state.sayim||[])[j]||0}</span></button>`}).join('')}</div>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 const yerlestir=j=>{
  if(state.gecis||locked)return;
  if(j!==k.dogru)return wrong(k.hint||'Kartı yeniden oku: hangi özelliği söylüyor?');
  state.sayim=state.sayim||r.kutular.map(()=>0);state.sayim[j]++;
  state.ix=i+1;state.not=k.neden||'';
  if(state.ix>=r.kartlar.length)return good();
  feedback('Doğru');gecisBasla(()=>sinifCiz(r),FAST?30:520)};
 $$('[data-kutu]').forEach(b=>b.onclick=()=>yerlestir(+b.dataset.kutu));
 baglaSurukle('[data-sinif-kart]','[data-kutu]',(_k,h)=>yerlestir(+h.dataset.kutu))}
function renderSinif(r){state.ix=0;state.not='';state.sayim=r.kutular.map(()=>0);sinifCiz(r)}

/* ===== SIRA (eski orderSequence) =====
   Roket-YAKIT sahnesi kaldırıldı: adımlar kendi konusunun sahnesinde
   (kelebek bahçesi, kazı alanı, deney tezgâhı, tarla) dizilir. Yanlışta
   dizi silinmez, yalnız o adım geri alınır ve "bundan önce ne olmalı?"
   sorusu sorulur. Kartlar tohumlu karıştırmayla çizilir. ===== */
function siraCiz(r){
 const d=state.dizi||[];
 $('#stage').innerHTML=sahneHtml(r)+
  (r.gorev?`<div class="konus-balon">${esc(r.gorev)}</div>`:'')+
  `<div class="sira-hedef" data-sira-hedef="1">${d.length
   ?d.map((i,p)=>`<div class="sira-adim"><b>${p+1}</b><span>${esc(r.kartlar[i].t)}</span></div>`).join('')
   :'<div class="sira-bos">İlk kartı buraya sürükle; doğru adımlar burada sırayla oluşacak.</div>'}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(!state.dizilim){
  let idx=tohumlu(r.kartlar.length,turTohum('sira'));
  if(idx.every((v,i)=>v===r.dogru[i]))idx.push(idx.shift());
  state.dizilim=idx}
 $('#task').innerHTML=
  `<div class="dizi">${state.dizilim.map(i=>{
   const k=r.kartlar[i],p=d.indexOf(i);
   return `<button class="sirakart ${p>=0?'secili':''}" data-kart="${i}"><span class="no">${p>=0?p+1:''}</span><span>${esc(k.t)}</span></button>`}).join('')}</div>`+
  `<div class="hint">${d.length}/${r.kartlar.length} adım dizildi. ${esc(r.ipucu||'')}</div>`;
 const ekle=b=>{
  if(state.gecis||locked)return;
  const i=+b.dataset.kart;
  if(d.indexOf(i)>=0)return uyar('Bu adımı dizdin');
  if(i!==r.dogru[d.length]){
   state.not=(r.ipucular&&r.ipucular[d.length])||'Bundan önce ne olmalı?';
   siraCiz(r);return wrong(state.not)}
  state.dizi=d.concat(i);state.not=r.kartlar[i].neden||'';
  if(state.dizi.length>=r.dogru.length){siraCiz(r);return good()}
  siraCiz(r)};
 $$('[data-kart]').forEach(b=>b.onclick=()=>ekle(b));
 baglaSurukle('[data-kart]:not(.secili)','[data-sira-hedef]',k=>ekle(k))}
function renderSira(r){state.dizi=[];state.not='';state.dizilim=null;siraCiz(r)}

/* ===== ESLE (eski dragMatch) =====
   Parça yazısı çipe tam sığar (sarma açık, kesme yok), hedef alanlar 58 px.
   Parça ile hedef arasında simge kopyası yoktur; karar bilimsel ilişkiye
   dayanır ve her eşleşme kısa bir gerekçeyle doğrulanır. ===== */
function esleCiz(r){
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="esle-alan">${r.yuvalar.map((y,i)=>{
    const v=(state.yerlesen||[])[i];
    return `<button class="yuva ${v!=null?'dolu':''}" data-yuva="${i}">`+
     `<span class="hedef">${esc(y.hedef)}</span>`+
     (v!=null?`<span class="kondu">${esc(r.etiketler[v].t)}</span>`:'')+`</button>`}).join('')}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<div class="etiketler">${r.etiketler.map((e,j)=>{
    const kondu=(state.yerlesen||[]).indexOf(j)>=0;
    return `<button class="etiket ${kondu?'bitti':''} ${state.secEt===j?'secili':''}" data-et="${j}">${esc(e.t)}</button>`}).join('')}</div>`+
  `<div class="hint">${esc(r.ipucu||'Kartı doğrudan sahnedeki ait olduğu hedefe sürükle.')}</div>`;
 const yerlestir=(j,i)=>{
  if(locked||j==null)return;
  if((state.yerlesen||[])[i]!=null)return uyar('Bu satır dolu');
  if(j!==r.yuvalar[i].dogru){
   state.not=r.yuvalar[i].hint||'Bu kart bu satıra uymuyor; aradaki ilişkiyi yeniden düşün.';
   state.secEt=null;esleCiz(r);return wrong(state.not)}
  state.yerlesen[i]=j;state.not=r.yuvalar[i].neden||'';
  state.secEt=null;esleCiz(r);
  if(state.yerlesen.every(v=>v!=null))good()};
 $$('[data-et]').forEach(b=>b.onclick=()=>{if(locked)return;state.secEt=+b.dataset.et;esleCiz(r)});
 $$('[data-yuva]').forEach(b=>b.onclick=()=>{if(locked||state.secEt==null)return uyar('Önce alttan bir kart seç');yerlestir(state.secEt,+b.dataset.yuva)});
 baglaSurukle('[data-et]:not(.bitti)','[data-yuva]',(k,h)=>yerlestir(+k.dataset.et,+h.dataset.yuva))}
function renderEsle(r){state.yerlesen=r.yuvalar.map(()=>null);state.secEt=null;state.not='';esleCiz(r)}

/* ===== KARAR (eski catchDrop/radar) =====
   Düşen kapsül yok: seçenekler sabit durur, karar süresi yoktur ve her

function kararCiz(r){
 const g=state.faz===1&&r.neden;
 $('#stage').innerHTML=sahneHtml(r)+

 const soru=g?r.neden.soru:r.soru, sec=g?r.neden.secenekler:r.secenekler;

 $$(`[data-${g?'neden':'sec'}]`).forEach(b=>b.onclick=()=>{
  if(state.gecis||locked)return;
  const c=sec[+(g?b.dataset.neden:b.dataset.sec)];
  if(!c.correct)return wrong(c.hint||r.yanlisIpucu||'Sahneye yeniden bak.');
  if(!g&&r.neden){state.faz=1;state.not=r.araSoz||'Doğru. Peki neden?';feedback('Doğru');
   return gecisBasla(()=>kararCiz(r),FAST?30:600)}

/* ===== TOPLA (eski serveOrder) =====

function cantaHtml(r){

function toplaCiz(r){

  $$('[data-oge]').forEach(b=>{b.innerHTML=SceneDiscovery.sourceBook(r.ogeler[+b.dataset.oge].t);b.disabled=b.classList.contains('bitti')});
  SceneWorkshop.bindDrag('[data-oge]:not(:disabled)','.satchel-mouth',k=>ekle(k));state.freshSource=null;
 }else baglaSurukle('[data-oge]:not(.bitti)','[data-canta]',k=>ekle(k))}
function renderTopla(r){state.alinan=[];state.not='';toplaCiz(r)}

/* ===== HAFIZA (eski memoryPairs) =====
   Kart konumları her açılışta tohumla karışır, can sayısı genel standartla
   (3) eşit ve her eşleşme bir gerekçe adımıyla doğrulanır. Yanlış çiftte
   kartlar hemen kapanmaz: iki içerik yan yana okunur. ===== */
function hafizaCiz(r){
 const kartlar=state.kartlar||[];
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="hafiza-alan">${kartlar.map((k,i)=>{
    const es=(state.eslesti||[]).indexOf(k.cift)>=0;
    const ac=es||(state.acik||[]).indexOf(i)>=0;
    return `<button class="hkart ${es?'eslesti':(ac?'acik':'kapali')}" data-hk="${i}">${ac?esc(k.t):'?'}</button>`}).join('')}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(state.dogrula!=null){
  const c=r.ciftler[state.dogrula];
  $('#task').innerHTML=`<div class="caption soru">${esc(c.soru)}</div>`+
   `<div class="choices">${c.secenekler.map((s,i)=>`<button class="choice" data-hs="${i}">${esc(s.label)}</button>`).join('')}</div>`;
  $$('[data-hs]').forEach(b=>b.onclick=()=>{
   if(locked)return;
   const s=c.secenekler[+b.dataset.hs];
   if(!s.correct)return wrong(s.hint||'İki kartı yeniden oku.');
   state.eslesti=(state.eslesti||[]).concat(state.dogrula);
   state.dogrula=null;state.acik=[];state.not=c.neden||'';
   hafizaCiz(r);
   if(state.eslesti.length>=r.ciftler.length)return good();
   feedback('Eşleşti')});
  return}
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru||'İki kartı aç ve eşleşen çifti bul.')}</div>`+
  `<div class="hint">${(state.eslesti||[]).length}/${r.ciftler.length} çift eşleşti. ${esc(r.ipucu||'')}</div>`;
 $$('[data-hk]').forEach(b=>b.onclick=()=>{
  if(state.gecis||locked)return;
  const i=+b.dataset.hk,k=kartlar[i];
  if((state.eslesti||[]).indexOf(k.cift)>=0)return;
  const acik=state.acik||[];
  if(acik.indexOf(i)>=0)return;
  if(acik.length>=2)return;
  state.acik=acik.concat(i);hafizaCiz(r);
  if(state.acik.length===2){
   const [a,b2]=state.acik.map(x=>kartlar[x]);
   if(a.cift===b2.cift){state.dogrula=a.cift;state.not='Şimdi bu eşleşmenin nedenini söyle.';
    return gecisBasla(()=>hafizaCiz(r),FAST?30:420)}
   state.not=r.ciftler[a.cift].fark||'İki kart farklı şeyleri anlatıyor; ikisini yan yana oku.';
   hafizaCiz(r);wrong(state.not);
   gecisBasla(()=>{state.acik=[];state.not='';hafizaCiz(r)},FAST?40:1400)}})}
function renderHafiza(r){
 const dizi=[];
 r.ciftler.forEach((c,i)=>{dizi.push({t:c.a,cift:i});dizi.push({t:c.b,cift:i})});
 const idx=tohumlu(dizi.length,turTohum('hafiza'));
 state.kartlar=idx.map(i=>dizi[i]);
 state.acik=[];state.eslesti=[];state.dogrula=null;state.not='';hafizaCiz(r)}

/* ===== GRAFIK (eski graphBuild) =====
   Şartname: grup sayıları ekranda okunur biçimde bulunacak, blok deposu
   grafiğin üzerine binmeyecek ve grafiğe sayı ölçeği eklenecek. Veri kutusu
   sahnenin içinde, blok deposu ise ayrı bir alanda duruyor. ===== */
function veriKutu(v){
 return `<div class="veri-kutu"><div class="bas">${esc(v.bas)}</div>`+
  v.satirlar.map(s=>`<div class="veri-satir"><span>${esc(s.ad)}</span><span>${esc(String(s.deger))}</span></div>`).join('')+
  `</div>`}
function grafikCiz(r){
 const enCok=r.enCok||Math.max(...r.gruplar.map(g=>g.sayi))+1;
 const kondu=state.kondu||r.gruplar.map(()=>0);
 const kalan=r.gruplar.reduce((t,g,i)=>t+(g.sayi-kondu[i]),0);
 $('#stage').innerHTML=sahneHtml(r)+
  (r.veri?veriKutu(r.veri):'')+
  `<div class="grafik"><div class="olcek-sutun">${Array.from({length:enCok},(_,i)=>`<span>${i+1}</span>`).join('')}</div>`+
  `<div class="sutunlar">${r.gruplar.map((g,i)=>
   `<button class="gsutun" data-sut="${i}"><span class="bar" style="height:${enCok*18}px">${Array.from({length:kondu[i]},()=>'<i></i>').join('')}</span>`+
   `<span class="ad">${esc(g.ad)}</span></button>`).join('')}</div></div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<button class="grafik-blok" data-grafik-blok="1">VERİ BLOĞU</button>`+
  `<div class="hint">Blok deposu: ${kalan} blok kaldı. ${esc(r.ipucu||'Bloğu ait olduğu sütuna sürükle.')}</div>`;
 const ekle=i=>{
  if(state.gecis||locked)return;
  if(kondu[i]>=r.gruplar[i].sayi){
   state.not=r.gruplar[i].hint||'Veri satırını yeniden oku: bu grupta kaç tane var?';
   grafikCiz(r);return wrong(state.not)}
  state.kondu=kondu.slice();state.kondu[i]++;state.not='';
  grafikCiz(r);
  if(r.gruplar.every((g,j)=>state.kondu[j]===g.sayi))return good()};
 $$('[data-sut]').forEach(b=>b.onclick=()=>ekle(+b.dataset.sut));
 baglaSurukle('[data-grafik-blok]','[data-sut]',(_k,h)=>ekle(+h.dataset.sut))}
function renderGrafik(r){state.kondu=r.gruplar.map(()=>0);state.not='';grafikCiz(r)}

/* ===== OLCUM (eski dragSlider/tren-tünel) =====
   Tren-tünel sahnesi kaldırıldı: ekranda dinamometre, yayı ve üzerine
   kuvvet uygulanan cisim var. Ölçek çekildikçe yay uzuyor, yani ölçülen
   olgu gerçekten canlanıyor; karar gözlem tablosuna dayanıyor. ===== */
function olcumCiz(r){
 const d=state.deger==null?r.min:state.deger;
 const oran=(d-r.min)/Math.max(1,(r.max-r.min));
 $('#stage').innerHTML=dinamometre(oran,r.yukAd)+
  (r.veri?veriKutu(r.veri):'')+
  (r.gorev?`<div class="konus-balon">${esc(r.gorev)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru)}</div>`+
  `<input class="olcek" id="olcek" type="range" min="${r.min}" max="${r.max}" step="${r.adim||1}" value="${d}">`+
  `<div class="caption">${esc(String(d))} ${esc(r.birim||'birim')}</div>`+
  `<button class="choice" id="olcOk">Bu değeri uygula</button>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 const s=$('#olcek');
 s.oninput=()=>{state.deger=+s.value;olcumCiz(r)};
 $('#olcOk').onclick=()=>{
  if(locked)return;
  if(+d!==+r.dogru){
   state.not=r.yanlisIpucu||'Yay bu kadar uzadı. Gözlem tablosundaki satırlarla karşılaştır.';
   olcumCiz(r);return wrong(state.not)}
  good()}}
function renderOlcum(r){state.deger=r.min;state.not='';olcumCiz(r)}

/* ===== SULA (eski holdFill/kronometre) =====
   Kronometre kaldırıldı: ekranda saksı, fide, toprak ve sulama kabı var.
   Hedef miktar ne görev metninde ne "Hedef" satırında ne de ölçekte
   YAZILI DEĞİL; öğrenci fidenin boyuna ve türüne bakarak karar veriyor.
   Az veya fazla su ceza değil: bitkide sonucu görünüyor ve yeniden
   deneniyor (tur "cezasiz"). ===== */
function sulaCiz(r){
 const v=state.verilen||0, oran=v/r.uygunUst;
 /* Karar bir sayıya değil gözleme dayansın: uygun aralık aşıldığı anda
    toprakta göllenme görünür. Öğrenci hedefi okumaz, saksıya bakar. */
 const durum=state.sonuc||(oran>1?'cok':'');
 $('#stage').innerHTML=saksi(oran,durum)+
  `<div class="konus-balon">${esc(r.gorev)}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=
  `<div class="sure-cubuk"><i style="--w:${Math.min(100,oran*62)}%"></i></div>`+
  `<div class="hint">${esc(r.ipucu||'Bitkiye bak: yaprakları ne söylüyor?')}</div>`+
  `<button class="tut ${state.basili?'basili':''}" id="tut">Sulama kabını eğik tut</button>`+
  `<button class="choice" id="sulaOk">Sulamayı bitirdim</button>`;
 const t=$('#tut');
 const bas=e=>{e.preventDefault();if(locked||state.basili)return;state.basili=true;t.classList.add('basili');
  state.saat=setInterval(()=>{state.verilen=(state.verilen||0)+1;state.sonuc='';sulaGuncelle(r)},FAST?4:70)};
 const birak=()=>{if(!state.basili)return;state.basili=false;t.classList.remove('basili');clearInterval(state.saat)};
 t.addEventListener('pointerdown',bas);t.addEventListener('pointerup',birak);
 t.addEventListener('pointerleave',birak);t.addEventListener('pointercancel',birak);
 $('#sulaOk').onclick=()=>{
  if(locked)return;birak();
  const v2=state.verilen||0;
  if(v2<r.uygunAlt){state.sonuc='az';state.not=r.azMetin||'Toprak kuru kaldı, yapraklar sarktı. Biraz daha su ver.';
   sulaCiz(r);return uyar('Yaprakları gözle')}
  if(v2>r.uygunUst){state.sonuc='cok';state.not=r.cokMetin||'Su toprakta göllendi; kök havasız kalır. Boşalt ve yeniden dene.';
   state.verilen=0;sulaCiz(r);return uyar('Toprağı gözle')}
  state.sonuc='iyi';state.not=r.iyiMetin||'Toprak nemli, su göllenmedi.';sulaCiz(r);good()}}
function sulaGuncelle(r){
 const v=state.verilen||0,oran=v/r.uygunUst;
 const st=$('#stage');if(st)st.firstElementChild.outerHTML=saksi(oran,oran>1?'cok':'');
 const c=$('.sure-cubuk i');if(c)c.style.setProperty('--w',Math.min(100,oran*62)+'%')}
function renderSula(r){state.verilen=0;state.sonuc='';state.not='';state.basili=false;sulaCiz(r)}

/* ===== TUS (eski numPad) =====
   Ekranda gerçek bir ölçüm tablosu var ve soru o veriden okunuyor; cevap
   tabloda hazır yazmıyor, satırlardan hesaplanıyor. Yanlış sayıda doğru
   cevap ekrana yazılmaz, ilgili satırlar vurgulanır. ===== */
function tusCiz(r){
 const vur=state.vurgu||[];
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="tablo"><div class="satir bas"><span class="h">${esc(r.tablo.bas[0])}</span><span class="h sag">${esc(r.tablo.bas[1])}</span></div>`+
  r.tablo.satirlar.map((s,i)=>`<div class="satir ${vur.indexOf(i)>=0?'vurgu':''}"><span class="h">${esc(s[0])}</span><span class="h sag">${esc(String(s[1]))}</span></div>`).join('')+
  `</div>`+
  `<div class="konus-balon">${esc(r.gorev)}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=`<div class="ekran">${esc(state.giris||'')||'&nbsp;'}</div>`+
  `<div class="tuslar">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-tus="${n}">${n}</button>`).join('')}`+
  `<button data-tus="sil">⌫</button><button data-tus="0">0</button><button data-tus="ok">✓</button></div>`+
  (r.ipucu?`<div class="hint">${esc(r.ipucu)}</div>`:'');
 $$('[data-tus]').forEach(b=>b.onclick=()=>{
  if(locked)return;
  const v=b.dataset.tus;
  if(v==='sil'){state.giris=(state.giris||'').slice(0,-1);return tusCiz(r)}
  if(v==='ok'){
   if(!state.giris)return uyar('Önce bir sayı yaz');
   if(+state.giris!==+r.dogru){
    state.vurgu=r.vurgu||[];state.not=r.yanlisIpucu||'Tabloda vurgulanan satırlara yeniden bak.';
    state.giris='';tusCiz(r);return wrong(state.not)}
   return good()}
  if((state.giris||'').length>=4)return;
  state.giris=(state.giris||'')+v;tusCiz(r)})}
function renderTus(r){state.giris='';state.vurgu=[];state.not='';tusCiz(r)}

/* ===== CUMLE (eski sentenceBuild) =====
   Kartlar küçük harfle gelir ve nokta kartı yoktur: baş harf ile son işaret
   öğrencinin kararıdır, yani diziliş cevabı ele vermez. Anlamlı alternatif
   sıra da kabul edilir; yanlışta bütün dizi bozulmaz. ===== */
function cumleCiz(r){
 const d=state.dizi||[];
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="konus-balon">${esc(r.gorev)}</div>`+
  `<div class="cumle-yuva" data-cumle-yuva="1">${d.length?d.map(i=>`<span>${esc(r.kelimeler[i])}</span>`).join('')
    :'<span class="bos" style="border:0;background:none">İlk sözcüğü buraya sürükle</span>'}</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(state.faz===1){
  $('#task').innerHTML=`<div class="caption soru">Cümlenin başı ve sonu nasıl olmalı?</div>`+
   `<div class="choices">${r.bitirme.map((b,i)=>`<button class="choice" data-bit="${i}">${esc(b.label)}</button>`).join('')}</div>`;
  $$('[data-bit]').forEach(b=>b.onclick=()=>{
   if(locked)return;
   const s=r.bitirme[+b.dataset.bit];
   if(!s.correct)return wrong(s.hint||'Cümle nasıl başlar, nasıl biter?');
   good()});
  return}
 if(!state.dizilim){
  let idx=tohumlu(r.kelimeler.length,turTohum('cumle'));
  /* ekran dizilişi kabul edilen sıralardan hiçbirine eşit olmasın */
  let guv=0;
  while(r.kabul.some(k=>String(idx)===String(k))&&guv++<8)idx.push(idx.shift());
  state.dizilim=idx}
 $('#task').innerHTML=`<div class="caption soru">${esc(r.soru||'Sözcükleri anlamlı bir cümle olacak biçimde sırala.')}</div>`+
  `<div class="kelimeler">${state.dizilim.map(i=>
    `<button class="kelime ${d.indexOf(i)>=0?'bitti':''}" data-kel="${i}">${esc(r.kelimeler[i])}</button>`).join('')}</div>`+
  `<div class="hint">${d.length?'Son sözcüğü geri almak için "Geri al".':''} ${esc(r.ipucu||'')}</div>`+
  (d.length?`<button class="choice" id="geriAl">Geri al</button>`:'');
 const ga=$('#geriAl');
 if(ga)ga.onclick=()=>{state.dizi=d.slice(0,-1);state.not='';cumleCiz(r)};
 const ekle=b=>{
  if(locked)return;
  const i=+b.dataset.kel;
  if(d.indexOf(i)>=0)return;
  const yeni=d.concat(i);
  const olabilir=r.kabul.some(k=>yeni.every((v,j)=>k[j]===v));
  if(!olabilir){
   /* yalnız son kart geri alınır; dizi bozulmaz */
   state.not=r.yanlisIpucu||'Bu sözcük burada anlamlı olmuyor; cümleyi baştan oku.';
   cumleCiz(r);return wrong(state.not)}
  state.dizi=yeni;state.not='';
  if(yeni.length===r.kelimeler.length){state.faz=1;feedback('Sıra tamam');
   return gecisBasla(()=>cumleCiz(r),FAST?30:520)}
  cumleCiz(r)};
 $$('[data-kel]').forEach(b=>b.onclick=()=>ekle(b));
 baglaSurukle('[data-kel]:not(.bitti)','[data-cumle-yuva]',k=>ekle(k))}
function renderCumle(r){state.dizi=[];state.faz=0;state.not='';state.dizilim=null;cumleCiz(r)}

/* ===== GOZLEM (eski codeGrid) =====
   Izgara düz labirent değil gerçek bir gözlem alanı: patika, gözlem
   noktaları ve kayıt defteri var. Engele çarpınca yürüyüş durur ve
   programdaki hatalı adım işaretlenir; program silinmez. Öğrenci ulaştığı
   noktada gözlemini deftere kaydeder. ===== */
const YON={'⬆️':[0,-1],'⬇️':[0,1],'⬅️':[-1,0],'➡️':[1,0]};
function gozlemCiz(r){
 const p=state.pos||r.basla, prog=state.prog||[];
 const kayit=state.kayit||[];
 $('#stage').innerHTML=
  `<div class="izgara" style="grid-template-columns:repeat(${r.en},1fr)">`+
  Array.from({length:r.boy},(_,y)=>Array.from({length:r.en},(_,x)=>{
   const engel=r.engeller.some(e=>e[0]===x&&e[1]===y);
   const nk=r.noktalar.findIndex(n=>n.x===x&&n.y===y);
   const patika=r.patika&&r.patika.some(e=>e[0]===x&&e[1]===y);
   const burada=p[0]===x&&p[1]===y;
   const sinif=burada?'robot':(nk>=0?(kayit.indexOf(nk)>=0?'kayitli':'nokta'):(engel?'engel':(patika?'patika':'')));
   const ic=burada?'🥾':(nk>=0?(kayit.indexOf(nk)>=0?'✔️':'🔎'):(engel?'🌿':''));
   return `<div class="hucre ${sinif}">${ic}</div>`}).join('')).join('')+
  `</div>`+
  `<div class="defter"><div class="bas">GÖZLEM DEFTERİ — ${kayit.length}/${r.noktalar.length}</div>`+
  (kayit.length?kayit.map(i=>`<div class="kayit">${esc(r.noktalar[i].kayit)}</div>`).join('')
   :`<div class="bos">Henüz gözlem kaydetmedin.</div>`)+`</div>`+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 if(state.soruNokta!=null){
  const n=r.noktalar[state.soruNokta];
  $('#task').innerHTML=`<div class="caption soru">${esc(n.soru)}</div>`+
   `<div class="choices">${n.secenekler.map((s,i)=>`<button class="choice" data-gs="${i}">${esc(s.label)}</button>`).join('')}</div>`;
  $$('[data-gs]').forEach(b=>b.onclick=()=>{
   if(locked)return;
   const s=n.secenekler[+b.dataset.gs];
   if(!s.correct)return wrong(s.hint||'Bulunduğun noktaya yeniden bak.');
   state.kayit=(state.kayit||[]).concat(state.soruNokta);state.soruNokta=null;
   state.prog=[];state.not='Gözlem deftere yazıldı.';
   gozlemCiz(r);
   if(state.kayit.length>=r.noktalar.length)return good();
   feedback('Kaydedildi')});
  return}
 $('#task').innerHTML=
  `<div class="program">${prog.length?prog.map((y,i)=>`<span class="${state.hataAdim===i?'hatali':''}">${y}</span>`).join('')
    :'<span style="border:0;background:none;font-size:12px;font-weight:800">Yön blokları buraya dizilir</span>'}</div>`+
  `<div class="yonler">${Object.keys(YON).map(y=>`<button data-yon="${y}">${y}</button>`).join('')}`+
  `<button data-yon="sil">⌫</button><button data-yon="git">▶︎</button></div>`+
  `<div class="hint">${esc(r.ipucu||'Bir sonraki gözlem noktasına ulaşacak yolu programla.')}</div>`;
 $$('[data-yon]').forEach(b=>b.onclick=()=>{
  if(locked||state.yuruyor)return;
  const y=b.dataset.yon;
  if(y==='sil'){state.prog=prog.slice(0,-1);state.hataAdim=null;return gozlemCiz(r)}
  if(y==='git'){
   if(!prog.length)return uyar('Önce yön blokları diz');
   return gozlemYuru(r)}
  if(prog.length>=10)return uyar('Program doldu');
  state.prog=prog.concat(y);state.hataAdim=null;gozlemCiz(r)})}
function gozlemYuru(r){
 state.yuruyor=true;state.hataAdim=null;
 let i=0,p=(state.pos||r.basla).slice();
 const adim=()=>{
  if(locked||roundIndex!==state.tur){state.yuruyor=false;return}
  if(i>=state.prog.length){
   state.yuruyor=false;state.pos=p;
   const nk=r.noktalar.findIndex((n,j)=>n.x===p[0]&&n.y===p[1]&&(state.kayit||[]).indexOf(j)<0);
   if(nk>=0){state.soruNokta=nk;state.not='Gözlem noktasına ulaştın.';return gozlemCiz(r)}
   state.not='Program bitti ama gözlem noktasına varmadın; adımları yeniden say.';
   gozlemCiz(r);return wrong(state.not)}
  const d=YON[state.prog[i]],nx=p[0]+d[0],ny=p[1]+d[1];
  if(nx<0||ny<0||nx>=r.en||ny>=r.boy||r.engeller.some(e=>e[0]===nx&&e[1]===ny)){
   state.yuruyor=false;state.hataAdim=i;state.pos=p;
   state.not='Yürüyüş burada durdu: işaretli adım çalılığa giriyor. Yalnız o adımı değiştir.';
   gozlemCiz(r);return wrong(state.not)}

/* ===== YAZ =====
   Üçüncü turların çoğu burada bitiyor: öğrenci kendi gözlemini, önerisini
   veya gerekçesini üretiyor. Ölçütler yazarken canlı işaretlenir, ekrandaki
   örnek cümlenin kopyası kabul edilmez. ===== */
function olcutDurum(r,t){
 const k=kelimeSay(t),ham=String(t||'').trim(),d=[];
 if(r.enAzKelime)d.push({ad:`En az ${r.enAzKelime} sözcük yaz`,tam:k>=r.enAzKelime});
 if(r.enAzCumle)d.push({ad:`En az ${r.enAzCumle} cümle yaz`,tam:(ham.match(/[.!?…]/g)||[]).length>=r.enAzCumle});
 if(r.buyukHarf)d.push({ad:'Büyük harfle başla',tam:/^[A-ZÇĞİÖŞÜ]/.test(ham)});
 if(r.bitis)d.push({ad:`Sonuna "${r.bitis}" koy`,tam:ham.endsWith(r.bitis)});
 (r.gerekli||[]).forEach(g=>d.push({ad:`"${g}" sözcüğünü kullan`,tam:sadelestir(t).includes(sadelestir(g))}));
 (r.denetim||[]).forEach(dn=>d.push({ad:dn.ad,tam:new RegExp(dn.desen,dn.bayrak||'').test(kesmeDuz(ham))}));
 return d}
function yazCiz(r){
 const t=state.yazi||'',d=olcutDurum(r,t),tam=d.every(x=>x.tam);
 $('#stage').innerHTML=sahneHtml(r)+
  `<div class="konus-balon">${esc(r.gorev)}</div>`+
  (r.veri?veriKutu(r.veri):'')+
  (r.ornek?`<div class="sahne-not">${esc(r.ornek)}</div>`:'')+
  (state.not?`<div class="caption">${esc(state.not)}</div>`:'');
 $('#task').innerHTML=
  `<textarea class="yazi-alan" id="yaziAlan" placeholder="${esc(r.ipucuMetin||'Buraya kendi cümleni yaz.')}">${esc(t)}</textarea>`+
  `<div class="olcut">${d.map(x=>`<div class="${x.tam?'tam':''}">${x.tam?'✓':'○'} ${esc(x.ad)}</div>`).join('')}</div>`+
  trSerit()+
  (r.bank?`<div class="banka">${r.bank.map(b=>`<button data-bank="${esc(b)}">${esc(b)}</button>`).join('')}</div>`:'')+
  `<button class="choice" id="yazOk" ${tam?'':'disabled style="opacity:.5"'}>Yazdım, kontrol et</button>`;
 const ta=$('#yaziAlan');
 ta.oninput=()=>{const c=ta.selectionStart;state.yazi=ta.value;yazCiz(r);
  const y=$('#yaziAlan');y.focus();try{y.setSelectionRange(c,c)}catch(e){}};
 $$('[data-bank]').forEach(b=>b.onclick=()=>{
  const v=b.dataset.bank;state.yazi=(state.yazi?state.yazi.replace(/\s*$/,' '):'')+v;yazCiz(r);
  const y=$('#yaziAlan');if(y)y.focus()});
 trSeritBagla('#yaziAlan',(yeni,imlec)=>{state.yazi=yeni;yazCiz(r);
  const y=$('#yaziAlan');if(y){y.focus();try{y.setSelectionRange(imlec,imlec)}catch(e){}}});
 $('#yazOk').onclick=()=>{
  if(locked)return;
  if((r.yasak||[]).some(y=>sadelestir(state.yazi)===sadelestir(y)||sadelestir(state.yazi).includes(sadelestir(y)))){
   state.not='Bu, ekrandaki hazır cümlenin kopyası. Kendi sözcüklerinle yaz.';yazCiz(r);return wrong(state.not)}
  const eksik=olcutDurum(r,state.yazi).find(x=>!x.tam);
  if(eksik)return uyar('Eksik ölçüt: '+eksik.ad);
  good()}}
function renderYaz(r){state.yazi=r.baslangicMetni||'';state.not='';yazCiz(r)}

function renderRound(){const r=round();if(!r)return;
 const fn={sinifla:renderSinif,sira:renderSira,esle:renderEsle,karar:renderKarar,
  topla:renderTopla,hafiza:renderHafiza,grafik:renderGrafik,olcum:renderOlcum,
  sula:renderSula,tus:renderTus,cumle:renderCumle,gozlem:renderGozlem,yaz:renderYaz}[r.kind];
 (fn||renderKarar)(r)}

/* ===== OYUN VERİSİ BURADA BİTER (yeni parti bu satırın üstüne eklenir) ===== */

/* ===== ÖZ DENETİM =====
   Şartnamenin altı kabul ölçütü motorla birlikte taşınsın diye içerik
   eklendikçe kural setiyle sınanıyor. Konsolda: __TEST__.olcutDenetimi()
   Yakaladığı kusurlar:
   1) yanlış ipucunun doğru kutunun/hedefin adını söylemesi,
   2) kart ya da etiket üzerinde kalan simge (emoji) sızıntısı,
   3) üç turu tamamlanmamış oyun,
   4) yazma turunun örnek cevabının kendi ölçütlerini geçmemesi,
   5) birden çok oyunun aynı yönergeyi paylaşması (ortak radar metni),
   6) tek doğru seçeneği bulunmayan karar/gerekçe soruları. */
const EMOJI=/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/u;
window.__TEST__={
 olcutDenetimi(){
  const kusur=[],yonergeler=new Map();
  const trkucuk=s=>String(s||'').toLocaleLowerCase('tr');
  const tekDogru=(sec,et)=>{
   const n=(sec||[]).filter(s=>s.correct).length;
   if(n!==1)kusur.push(et+': tek doğru seçenek yok ('+n+')');
   (sec||[]).forEach((s,i)=>{if(!s.correct&&!s.hint)kusur.push(et+' seçenek'+(i+1)+': yanlış seçeneğin ipucu yok')})};
  Object.keys(GAMES).forEach(id=>{
   const g=GAMES[id];
   if(g.rounds.length!==3)kusur.push(id+': tur sayısı 3 değil ('+g.rounds.length+')');
   if(!g.finish)kusur.push(id+': bitiş metni yok');
   g.rounds.forEach((r,ti)=>{
    const et=id+' tur'+(ti+1);
    if(!r.prompt)return kusur.push(et+': yönerge yok');
    /* Ortak şablon yönergesi: aynı metin iki oyunda birden geçmemeli. */
    const onceki=yonergeler.get(r.prompt);
    if(onceki&&onceki!==id)kusur.push(et+': yönerge '+onceki+' ile birebir aynı');
    yonergeler.set(r.prompt,id);
    if(r.kind==='sinifla'){
     const adlar=r.kutular.map(b=>trkucuk(typeof b==='string'?b:b.ad));
     r.kartlar.forEach((k,ki)=>{
      const dad=adlar[k.dogru];
      if(k.hint&&trkucuk(k.hint).includes(dad))
       kusur.push(et+' kart'+(ki+1)+': ipucu doğru kutunun adını söylüyor');
      if(EMOJI.test(k.t))kusur.push(et+' kart'+(ki+1)+': kartta simge var');
      if(k.dogru==null||!r.kutular[k.dogru])kusur.push(et+' kart'+(ki+1)+': doğru kutu geçersiz')});
     r.kutular.forEach((b,bi)=>{if(EMOJI.test(typeof b==='string'?b:b.ad+(b.alt||'')))
      kusur.push(et+' kutu'+(bi+1)+': kutu etiketinde simge var')});
    }
    if(r.kind==='esle'){
     r.yuvalar.forEach((y,yi)=>{
      const dt=r.etiketler[y.dogru];
      if(!dt)return kusur.push(et+' yuva'+(yi+1)+': doğru etiket yok');
      if(y.hint&&trkucuk(y.hint).includes(trkucuk(dt.t)))
       kusur.push(et+' yuva'+(yi+1)+': ipucu doğru etiketin adını söylüyor');
      if(EMOJI.test(y.hedef))kusur.push(et+' yuva'+(yi+1)+': hedef satırında simge var')});
     r.etiketler.forEach((e,ei)=>{if(EMOJI.test(e.t))kusur.push(et+' etiket'+(ei+1)+': etikette simge var')});
     const kap=r.yuvalar.map(y=>y.dogru);
     if(new Set(kap).size!==kap.length)kusur.push(et+': iki yuva aynı etiketi istiyor');
    }
    if(r.kind==='sira'){
     if(!r.dogru||r.dogru.length!==r.kartlar.length)kusur.push(et+': doğru sıra kart sayısıyla uyuşmuyor');
     r.kartlar.forEach((k,ki)=>{if(EMOJI.test(k.t))kusur.push(et+' kart'+(ki+1)+': kartta simge var')});
    }
    if(r.kind==='karar'){
     tekDogru(r.secenekler,et);
     if(r.neden)tekDogru(r.neden.secenekler,et+' gerekçe');
    }
    if(r.kind==='topla'){
     if(!r.gerekli||!r.gerekli.length)kusur.push(et+': toplanacak öge yok');
     (r.gerekli||[]).forEach(i=>{if(!r.ogeler[i])kusur.push(et+': gerekli öge dizini geçersiz')});
     r.ogeler.forEach((o,oi)=>{
      if((r.gerekli||[]).indexOf(oi)<0&&!o.hint)kusur.push(et+' öge'+(oi+1)+': çeldiricinin ipucu yok')});
    }
    if(r.kind==='hafiza'){
     r.ciftler.forEach((c,ci)=>{
      tekDogru(c.secenekler,et+' çift'+(ci+1));
      if(!c.soru)kusur.push(et+' çift'+(ci+1)+': gerekçe sorusu yok');
      if(EMOJI.test(c.a+c.b))kusur.push(et+' çift'+(ci+1)+': kartta simge var')});
    }
    if(r.kind==='grafik'){
     if(!r.veri)kusur.push(et+': grup sayıları ekranda yok (veri kutusu eksik)');
     r.gruplar.forEach((gr,gi)=>{
      const sat=(r.veri&&r.veri.satirlar||[]).find(s=>trkucuk(s.ad).includes(trkucuk(gr.ad)));
      if(!sat)kusur.push(et+' grup'+(gi+1)+': "'+gr.ad+'" için veri satırı yok');
      else if(+sat.deger!==+gr.sayi)kusur.push(et+' grup'+(gi+1)+': veri satırı ile hedef sayı farklı')});
    }
    if(r.kind==='olcum'){
     if(r.dogru<r.min||r.dogru>r.max)kusur.push(et+': doğru değer ölçek dışında');
     if(!r.veri)kusur.push(et+': karar için gözlem tablosu yok');
     if(r.veri&&(r.veri.satirlar||[]).some(s=>+s.deger===+r.dogru&&trkucuk(s.ad).includes(trkucuk(r.yukAd||''))))
      kusur.push(et+': cevap gözlem tablosunda hazır yazıyor');
    }
    if(r.kind==='sula'){
     if(r.uygunAlt>=r.uygunUst)kusur.push(et+': uygun aralık geçersiz');
     const metin=[r.gorev,r.prompt,r.ipucu].join(' ');
     if(/\d/.test(metin))kusur.push(et+': hedef miktar görev metninde sayıyla yazılı');
    }
    if(r.kind==='tus'){
     if(!r.tablo)kusur.push(et+': ölçüm tablosu yok');
     if(r.tablo&&r.tablo.satirlar.some(s=>+s[1]===+r.dogru))
      kusur.push(et+': cevap tabloda hazır yazıyor');
    }
    if(r.kind==='cumle'){
     if(!r.kabul||!r.kabul.length)kusur.push(et+': kabul edilen sıra yok');
     r.kelimeler.forEach((k,ki)=>{
      if(/^[A-ZÇĞİÖŞÜ]/.test(k))kusur.push(et+' kelime'+(ki+1)+': kart büyük harfle başlıyor (diziliş cevabı ele veriyor)');
      if(/[.!?]/.test(k))kusur.push(et+' kelime'+(ki+1)+': kartta noktalama var')});
     (r.kabul||[]).forEach((k,ki)=>{
      if(k.length!==r.kelimeler.length)kusur.push(et+' kabul'+(ki+1)+': sıra uzunluğu kelime sayısıyla uyuşmuyor')});
     tekDogru(r.bitirme,et+' bitirme');
    }
    if(r.kind==='gozlem'){
     if(!r.noktalar||!r.noktalar.length)kusur.push(et+': gözlem noktası yok');
     (r.noktalar||[]).forEach((n,ni)=>{
      tekDogru(n.secenekler,et+' nokta'+(ni+1));
      if(!n.kayit)kusur.push(et+' nokta'+(ni+1)+': defter kaydı yok')});
    }
    if(r.kind==='yaz'){
     const c=r.ornekCevap||'';
     if(!c)return kusur.push(et+': ornekCevap yok');
     const eksik=olcutDurum(r,c).filter(x=>!x.tam).map(x=>x.ad);
     if(eksik.length)kusur.push(et+' ['+kelimeSay(c)+' sözcük]: '+eksik.join(' | '));
     (r.yasak||[]).forEach(y=>{
      if(sadelestir(c)===sadelestir(y)||sadelestir(c).includes(sadelestir(y)))
       kusur.push(et+': ornekCevap yasak metni içeriyor')});
    }
   })});
  /* son tur öğrencinin kendi üretimi olmalı (kabul ölçütü 6) */
  Object.keys(GAMES).forEach(id=>{
   const son=GAMES[id].rounds[2];
   if(son&&['yaz','cumle','gozlem'].indexOf(son.kind)<0&&!son.uretim)
    kusur.push(id+' tur3: öğrenci üretimi içermiyor ('+son.kind+')')});
  return {oyun:Object.keys(GAMES).length,kusur}}
};

/* ===== açılış ===== */
game=GAMES[GAME_ID]||GAMES.g01;
render();
</script>
