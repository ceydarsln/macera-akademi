<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>1. Sınıf Matematik — Özel Oyun Sahneleri</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#17324d;--soft:#52708b;--green:#20a36a;--red:#db4e57;--gold:#f2b83f;--panel:rgba(255,255,255,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#dff2ff;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;position:relative;isolation:isolate}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.95);border-bottom:2px solid rgba(62,118,156,.18);z-index:20;box-shadow:0 3px 14px rgba(23,50,77,.12)}
.hud .round{font-weight:900;font-size:clamp(13px,3vw,17px);white-space:nowrap}.hud .prompt{font-weight:800;text-align:center;font-size:clamp(12px,2.8vw,16px);line-height:1.2;max-height:2.5em;overflow:hidden}.hud .right{display:flex;align-items:center;gap:6px}.lives{font-size:clamp(13px,3.3vw,18px);letter-spacing:-2px;white-space:nowrap}.sound{width:42px;height:38px;border:0;border-radius:13px;background:#e7f5ff;font-size:21px;box-shadow:0 2px 0 #a7cce5}
.scene{min-height:0;position:relative;overflow:auto;padding:10px 10px 18px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(#ccecff 0 58%,#dff2d2 58%)}
.scene[data-theme="road"]{background:linear-gradient(#bfe6ff 0 38%,#83b56d 38% 48%,#59636c 48% 86%,#8ac273 86%)}
.scene[data-theme="sea"]{background:linear-gradient(#a9e7ff,#2d9bd4 55%,#0870a8)}
.scene[data-theme="space"]{background:radial-gradient(circle at 22% 18%,#485699,#14224f 38%,#09152f)}
.scene[data-theme="market"]{background:linear-gradient(#f8e4af 0 62%,#d6a871 62%)}
.scene[data-theme="room"]{background:linear-gradient(#f7e7cf 0 66%,#c78e5b 66%)}
.scene[data-theme="mountain"]{background:linear-gradient(#bde8ff 0 55%,#91ad9a 55%,#537b68)}
.scene[data-theme="factory"]{background:linear-gradient(#c9d7df,#718794)}
.scene[data-theme="night"]{background:linear-gradient(#26395d 0 64%,#294f42 64%)}
.scene[data-theme="class"]{background:linear-gradient(#fff0cf 0 68%,#bd8258 68%)}
.scene[data-theme="clinic"]{background:linear-gradient(#e7fbf4 0 66%,#85cdb7 66%)}
.visual{min-height:150px;border-radius:22px;background:rgba(255,255,255,.75);border:2px solid rgba(255,255,255,.8);box-shadow:0 8px 24px rgba(23,50,77,.13);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:12px;position:relative;overflow:hidden}
.visual.dark{background:rgba(8,22,48,.58);color:white}.story{font-size:clamp(36px,10vw,66px);filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}.scene-label{width:100%;text-align:center;font-weight:900;font-size:clamp(13px,3.3vw,18px)}
.controls,.choices,.pieces,.targets{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:9px}.controls{margin-top:auto}.choices button,.action{min-width:88px;min-height:58px;border:3px solid #fff;border-radius:18px;background:var(--panel);font-weight:900;font-size:clamp(16px,4vw,22px);box-shadow:0 5px 0 rgba(38,79,108,.22);padding:8px 13px}.choices button:active,.action:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(38,79,108,.22)}
.piece{min-width:70px;min-height:62px;padding:6px 9px;border:3px solid #fff;border-radius:18px;background:var(--panel);box-shadow:0 6px 0 rgba(39,80,110,.24);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,48px);font-weight:900;touch-action:none;user-select:none;position:relative;z-index:4}.piece.dragging{position:fixed;z-index:999;pointer-events:none;transform:scale(1.12);opacity:.94}.piece.done{visibility:hidden}
.target{flex:1 1 92px;min-width:92px;min-height:82px;border:4px dashed rgba(46,104,143,.62);border-radius:22px;background:rgba(255,255,255,.64);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:clamp(24px,7vw,42px);font-weight:900;position:relative}.target.hot{border-style:solid;border-color:var(--gold);background:#fff8d8;transform:scale(1.03)}.target .placed{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:28px}.target-label{font-size:13px;font-weight:900;display:block}
.feedback{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.8);z-index:100;background:#fff;border:4px solid var(--green);border-radius:24px;padding:18px 24px;font-size:clamp(21px,5vw,30px);font-weight:1000;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);opacity:0;pointer-events:none}.feedback.show{animation:pop .95s ease both}.feedback.bad{border-color:var(--red)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}18%,76%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
.success-flash{animation:successFlash .9s ease}.wrong-shake{animation:shake .36s ease}.story-go{animation:storyGo .85s ease}
@keyframes successFlash{35%{filter:brightness(1.22);box-shadow:inset 0 0 0 999px rgba(84,220,150,.17)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes storyGo{50%{transform:translateY(-10px) scale(1.05)}}
.overlay{position:absolute;inset:0;z-index:200;background:rgba(12,31,51,.86);display:flex;align-items:center;justify-content:center;padding:20px}.overlay-card{width:min(390px,94%);background:white;border-radius:28px;padding:25px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}.overlay-card h2{margin:0 0 10px;font-size:30px}.overlay-card p{font-weight:700;color:var(--soft)}
.big-icon{font-size:clamp(38px,10vw,68px)}.object-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px}.unit{font-size:clamp(24px,6.5vw,39px);display:inline-block}.unit.small{font-size:22px}.count-badge{min-width:78px;padding:8px 14px;border-radius:18px;background:white;font-size:32px;font-weight:1000;text-align:center;box-shadow:0 4px 0 rgba(23,50,77,.2)}
.road{width:100%;height:122px;background:#505b64;border-top:10px solid #7cb769;border-bottom:10px solid #7cb769;position:relative;overflow:hidden}.road:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px dashed #f7df79}.moving{animation:drive 4.5s linear infinite}.moving:nth-child(even){animation-direction:reverse;animation-duration:5.2s}@keyframes drive{0%{transform:translateX(-25px)}50%{transform:translateX(28px)}100%{transform:translateX(-25px)}}
.car{width:66px;height:30px;border-radius:10px 15px 8px 8px;background:var(--car,#e84f5f);position:relative;border:3px solid rgba(0,0,0,.18)}.car:before{content:"";position:absolute;left:12px;top:-17px;width:37px;height:20px;border-radius:15px 15px 3px 3px;background:var(--car,#e84f5f);border:3px solid rgba(0,0,0,.18)}.car:after{content:"●  ●";position:absolute;left:7px;bottom:-17px;color:#253443;letter-spacing:20px;font-size:15px}
.grid-map{display:grid;grid-template-columns:repeat(5,1fr);width:min(330px,92%);aspect-ratio:1;gap:3px;padding:8px;background:#c49a61;border:8px solid #8b5c2e;border-radius:18px}.grid-cell{border:0;border-radius:8px;background:#f2d998;position:relative;font-size:22px}.grid-cell.start:after{content:"🚩"}.grid-cell.corrected{background:#e7bd5a}.parrot{font-size:58px;animation:wing 1s ease-in-out infinite}@keyframes wing{50%{transform:rotate(-8deg) scale(1.06)}}
.path{width:100%;height:230px;position:relative;background:linear-gradient(#bfe8ff 0 45%,#6d9071 45%);border-radius:18px;overflow:hidden}.stone{position:absolute;width:56px;height:28px;border-radius:50%;background:#d5d8d2;border:3px solid #8d9b92}.goat{position:absolute;font-size:46px;transition:left .38s,top .38s;z-index:3}.flag{position:absolute;right:14px;top:42px;font-size:52px}
.sock{width:62px;height:100px;border-radius:12px 12px 30px 12px;background:repeating-linear-gradient(var(--sock,#e94f63) 0 15px,#fff 15px 24px);position:relative;box-shadow:inset 0 0 0 4px rgba(0,0,0,.08)}.sock.short{height:72px}.sock.dot{background-color:var(--sock,#efc84a);background-image:radial-gradient(#fff 22%,transparent 25%);background-size:20px 20px}.sock.star{background:var(--sock,#efc84a)}.sock.star:after{content:"★";color:white;font-size:29px;position:absolute;left:16px;top:21px}
.gear-svg{width:76px;height:76px;display:block}.fish{width:72px;height:40px;border-radius:52% 44% 44% 52%;background:var(--fish,#e94f63);position:relative;box-shadow:inset -10px -6px rgba(0,0,0,.1)}.fish:after{content:"";position:absolute;right:-24px;top:6px;border:14px solid transparent;border-left:0;border-right:25px solid var(--fish,#e94f63)}.fish:before{content:"•";position:absolute;left:14px;top:-5px;color:white;font-size:25px}.fish.swim{animation:swim 2.4s ease-in-out infinite}@keyframes swim{50%{transform:translateX(18px) rotate(2deg)}}
.ten-frame{display:grid;grid-template-columns:repeat(5,34px);gap:4px;padding:7px;border:4px solid #365a74;border-radius:10px;background:#fff}.ten-frame .cell{width:34px;height:30px;border:2px solid #9eb5c6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px}
.building{display:flex;align-items:flex-end;gap:6px;padding:8px 18px;background:#586f84;border-radius:16px}.floor{width:65px;min-height:48px;background:#d8f1ff;border:4px solid #304b63;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:1000;position:relative}.elevator-shaft{width:90px;height:220px;background:#526777;border:5px solid #293c4b;border-radius:12px;position:relative}.cabin{position:absolute;left:8px;right:8px;height:48px;bottom:6px;background:rgba(187,239,255,.9);border:4px solid #e7fbff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:29px;transition:bottom .45s}.floor-list{height:220px;display:flex;flex-direction:column;justify-content:space-between}.floor-list span{font-weight:900}
.plate{min-width:110px;min-height:84px;border-radius:50%;background:#fff;border:9px solid #d8e6ee;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;max-width:145px}.monster{font-size:70px;animation:talk .7s ease-in-out infinite}@keyframes talk{50%{transform:scaleY(.92) rotate(2deg)}}
.scale{width:min(360px,95%);height:165px;position:relative}.scale .beam{position:absolute;left:14%;right:14%;top:55px;height:12px;background:#8a633c;border-radius:8px;transition:transform .35s}.scale .post{position:absolute;left:48%;top:45px;width:18px;height:105px;background:#8a633c}.pan{position:absolute;top:76px;width:40%;min-height:62px;border-bottom:8px solid #7d8790;border-radius:0 0 50% 50%;display:flex;justify-content:center;align-content:center;flex-wrap:wrap;font-size:22px}.pan.left{left:0}.pan.right{right:0}.scale .beam.left-heavy{transform:rotate(-8deg)}.scale .beam.right-heavy{transform:rotate(8deg)}
.basket-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}.diff-cell{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}.diff-item{min-height:50px;border:3px solid transparent;border-radius:13px;background:#fff8e6;font-size:29px}.diff-item.found{border-color:var(--green);background:#dcf8e9}.diff-item:disabled{opacity:1}
.rocket{font-size:65px;display:inline-block;transform:rotate(-8deg)}.launch{animation:launch 1s ease-in forwards}@keyframes launch{to{transform:translateY(-320px) scale(.55);opacity:.1}}
.snowman{font-size:72px;transition:transform .3s,opacity .3s}.melt1{transform:scaleY(.78);opacity:.85}.melt2{transform:scaleY(.55);opacity:.65}
.jar{width:165px;min-height:170px;border:8px solid rgba(170,215,232,.75);border-top:18px solid #83a5b3;border-radius:18px 18px 42px 42px;background:rgba(255,255,255,.42);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding:13px;gap:0}.candy{font-size:21px;display:inline-block;transform:rotate(var(--rot,0deg));margin:-2px}
.train{display:flex;align-items:flex-end;gap:4px;font-size:49px}.wagon-shape{width:68px;height:52px;background:#d85c68;border:5px solid #8e3340;border-radius:8px 8px 18px 18px;display:flex;align-items:center;justify-content:center;font-size:29px;position:relative}.wagon-shape.circle{border-radius:50%}.wagon-shape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}.wagon-shape.square{border-radius:7px}.wagon-shape:after{content:"●  ●";position:absolute;bottom:-17px;font-size:14px;color:#283743}
.banknote{width:112px;height:58px;border:4px solid rgba(0,0,0,.2);border-radius:9px;background:var(--note,#d9b36c);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:1000;box-shadow:inset 0 0 0 5px rgba(255,255,255,.3)}
.shape{width:66px;height:66px;background:var(--shape,#ec6c73)}.shape.circle{border-radius:50%}.shape.triangle{width:0;height:0;background:transparent;border-left:39px solid transparent;border-right:39px solid transparent;border-bottom:70px solid var(--shape,#ec6c73)}.shape.rect{width:96px;height:56px}.shape.silhouette{filter:brightness(.2);opacity:.7}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:170px;width:100%}.chart-col{width:78px;text-align:center;font-weight:900}.chart-bar{min-height:10px;border-radius:14px 14px 4px 4px;background:var(--bar,#e95b75);transition:height .3s;display:flex;flex-direction:column-reverse;overflow:hidden;font-size:23px}.portrait{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid var(--portrait,#e95b75);display:flex;align-items:center;justify-content:center;font-size:43px}
.targets.stack-targets{flex-direction:column;align-items:center}.stack-targets .target{width:150px;min-height:54px;flex:0 0 auto}.targets.podium-targets{align-items:flex-end;flex-wrap:nowrap}.podium-targets .target{min-width:95px}.podium-targets [data-target="p1"]{min-height:128px;background:#f2c94c}.podium-targets [data-target="p2"]{min-height:98px;background:#d9e0e5}.podium-targets [data-target="p3"]{min-height:76px;background:#d99b69}
.appointment-table{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%}.appointment-col{min-height:105px;border:3px solid #83bfae;border-radius:14px;background:#fff;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;font-size:22px}.appointment-col b{width:100%;text-align:center;font-size:15px}
.progress{height:14px;border-radius:12px;background:#d6e3ea;overflow:hidden;width:100%}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#3ebd82,#f0c24c);transition:width .25s linear}.countdown{font-size:72px;font-weight:1000;color:#fff;text-shadow:0 5px 0 #284062}
.hands{display:flex;gap:20px;align-items:flex-end}.hand{height:126px;width:118px;border-radius:20px 20px 46px 46px;background:#8d59bd;display:flex;align-items:flex-start;justify-content:center;gap:4px;padding:7px;position:relative}.finger{width:16px;height:74px;border-radius:12px;background:#ffd9bd;border:3px solid #b77459;transition:height .3s}.finger:nth-child(1),.finger:nth-child(5){height:55px}.finger:nth-child(2),.finger:nth-child(4){height:67px}.finger.closed{height:22px!important;background:#c79884}.hand:after{content:"";position:absolute;width:70px;height:54px;left:24px;bottom:8px;border-radius:28px;background:#ffd9bd;border:3px solid #b77459}
.free-mag{position:absolute;left:18px;top:16px;font-size:54px;z-index:12;cursor:grab;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25));touch-action:none;user-select:none}.free-mag:active{cursor:grabbing}.multi-choices button{font-size:clamp(30px,8vw,44px);min-width:82px}
@media (max-height:560px){.visual{min-height:115px}.scene{gap:6px;padding-top:6px}.choices button,.action{min-height:48px}.hud{padding-top:4px;padding-bottom:4px}.story{font-size:40px}}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
const GAME_ID=(new URLSearchParams(location.hash.slice(1))).get('oyun')||'m01';
const GAME_COUNT=3;
let game=null,roundIndex=0,lives=3,score=0,locked=false,state={},drag=null,timer=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mathSpeech(s){return String(s).replace(/\+/g,' artı ').replace(/[−–]/g,' eksi ').replace(/(\d)\s*-\s*(\d)/g,'$1 eksi $2').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim()}
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(mathSpeech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(mathSpeech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function completeParent(msg){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(msg,score);return}}catch(e){}showOverlay('Harikasın!',msg,'Yeniden oyna',()=>restart())}
function units(icon,n,cls=''){return `<div class="object-row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" style="--rot:${(i%5-2)*9}deg">${icon}</span>`).join('')}</div>`}
function ten(icon,n){return `<div class="ten-frame">${Array.from({length:20},(_,i)=>`<span class="cell">${i<n?icon:''}</span>`).join('')}</div>`}
function candies(n){return `<div class="jar">${Array.from({length:n},(_,i)=>`<span class="candy" style="--rot:${(i%7-3)*12}deg">${['🍬','🍭','🍫'][i%3]}</span>`).join('')}</div>`}
function money(n){const colors={5:'#d7a870',10:'#df7d7d',20:'#78bd8f',50:'#dc9b52',100:'#6b9fc9',200:'#aa82c5'};return `<div class="banknote" style="--note:${colors[n]||'#d9b36c'}">${n} TL</div>`}
function gearSvg(teeth,color='#efb84e',hole=true){const pts=[];for(let i=0;i<teeth*4;i++){const a=-Math.PI/2+i*Math.PI/(teeth*2),r=i%4<2?34:27;pts.push(`${40+Math.cos(a)*r},${40+Math.sin(a)*r}`)}return `<svg class="gear-svg" viewBox="0 0 80 80" aria-label="${teeth} dişli çark"><polygon points="${pts.join(' ')}" fill="${color}" stroke="#6e5528" stroke-width="3"/>${hole?'<circle cx="40" cy="40" r="10" fill="#fff" stroke="#6e5528" stroke-width="3"/>':''}</svg>`}
function sock(color,kind,size=''){return `<div class="sock ${kind||''} ${size}" style="--sock:${color}"></div>`}
function fish(color){return `<div class="fish swim" style="--fish:${color}"></div>`}
function shape(kind,color){return `<div class="shape ${kind}" style="--shape:${color}"></div>`}
function round(){return game.rounds[roundIndex]}
function hud(){const r=round();return `<div class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(r.prompt)}</div><div class="right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></div>`}
function render(){clearTimer();const r=round();state=state&&state.keep?state:{};document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${r.theme||game.theme||'room'}"><div class="feedback" id="feedback"></div><section class="visual ${r.dark?'dark':''}" id="visual"></section><section id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderTask(r);bindDrag();requestAnimationFrame(()=>speak(r.prompt))}
function clearTimer(){if(timer){clearInterval(timer);clearTimeout(timer);timer=null}}
function feedback(text,bad=false){const f=$('#feedback');if(!f)return;f.textContent=text;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
function wrong(message='Tekrar dene'){if(locked)return;lives--;feedback('Tekrar dene',true);speak('Tekrar dene');const sc=$('.scene');if(sc){sc.classList.remove('wrong-shake');void sc.offsetWidth;sc.classList.add('wrong-shake')}if(lives<=0){locked=true;setTimeout(()=>{speak('Canların bitti');showOverlay('Canların bitti','Bu oyunu yeniden başlatabilirsin.','Oyunu yeniden başlat',restart)},850)}else if(message&&message!=='Tekrar dene')setTimeout(()=>speak(message),650)}
function success(story){if(locked)return;locked=true;score+=300;const v=$('#visual');if(v){v.classList.add('success-flash','story-go')}feedback(story||'Doğru!');speak(story||'Doğru!');setTimeout(()=>{if(roundIndex<2){roundIndex++;locked=false;state={};render()}else completeParent(game.finish||'Üç turu da tamamladın!')},1050)}
function restart(){clearTimer();roundIndex=0;lives=3;score=0;locked=false;state={};render()}
function showOverlay(title,text,button,onClick){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="overlay-card"><div class="big-icon">${title.includes('bitti')?'💛':'🏆'}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="action">${esc(button)}</button></div>`;document.getElementById('app').appendChild(o);o.querySelector('button').onclick=onClick}
function chooseButtons(choices,handler){return `<div class="choices">${choices.map((c,i)=>`<button data-choice="${i}">${c.html||esc(c.label)}</button>`).join('')}</div>`}
function renderTask(r){const v=$('#visual'),t=$('#task');if(r.art)v.innerHTML=typeof r.art==='function'?r.art(state):r.art;const fn=RENDERERS[r.kind||'choose'];if(!fn){v.innerHTML='<b>Oyun sahnesi bulunamadı.</b>';return}fn(r,v,t);bindDrag()}

function targetAt(x,y){return $$('.target').find(t=>{const r=t.getBoundingClientRect(),pad=18;return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad})||null}

function endDrag(e){if(!drag)return;const d=drag,target=targetAt(e.clientX,e.clientY);const moved=Math.hypot(e.clientX-d.startX,e.clientY-d.startY);d.el.classList.remove('dragging');d.el.style.left='';d.el.style.top='';d.el.onpointermove=null;d.el.onpointerup=null;d.el.onpointercancel=null;$$('.target').forEach(x=>x.classList.remove('hot'));if(d.next&&d.next.parentNode===d.home)d.home.insertBefore(d.el,d.next);else d.home.appendChild(d.el);if(d.placeholder&&d.placeholder.parentNode)d.placeholder.remove();drag=null;if(!target&&round().rotate&&moved<12){const a=(+(d.el.dataset.angle||0)+90)%360;d.el.dataset.angle=a;d.el.style.transform=`rotate(${a}deg)`;speak('Parça döndü');return}handleDrop(d.id,target?target.dataset.target:null,d.el,target)}
function handleDrop(pieceId,targetId,el,target){const r=round();if(!targetId){return}if(r.kind==='load'){if(targetId==='loadTarget')loadOne(r);else wrong(r.hint);return}if(r.kind==='remove'){if(targetId==='returnCart')removeOne(r,pieceId,el);else wrong(r.hint);return}if(r.kind==='catch'){catchFish(r,targetId);return}const p=(r.pieces||[]).find(x=>x.id===pieceId);if(!p||!p.target||p.target!==targetId){wrong(r.hint);return}if(!state.placed)state.placed={};if(state.placed[pieceId])return;state.placed[pieceId]=targetId;el.classList.add('done');const slot=target&&target.querySelector('.placed');if(slot)slot.insertAdjacentHTML('beforeend',`<span>${p.doneHtml||p.html}</span>`);const gereken=(r.pieces||[]).filter(x=>x.target).length;if(Object.keys(state.placed).length===gereken)success(r.story)}
