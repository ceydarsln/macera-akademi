<body><div id="app" class="app"></div>
<script>
/* Sınama modunda (?test=1) tarayıcının arka plan sekme kısıntısını aş:
   gizli sekmede setTimeout dakikada bire kadar iniyor ve oyunun kendi
   geçişleri donuyordu. Yalnız kısa gecikmeler için, yalnız testte. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}

'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'u01';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speech=s=>String(s??'').replace(/\+/g,' artı ').replace(/[−–-]/g,' eksi ').replace(/[×x]/g,' çarpı ').replace(/[:÷]/g,' bölü ').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim();
function speak(text,repeat=false){try{if(parent&&parent!==window&&typeof parent.oku==='function')return parent.oku(speech(text),repeat)}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));u.lang='tr-TR';speechSynthesis.speak(u);return true}catch(e){return false}}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}
function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();requestAnimationFrame(()=>speak(round().prompt))}
function updateStage(){if(!round())return;const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}
function wrong(hint){if(locked||!round())return;if(!round().noPenalty)lives=Math.max(0,lives-1);feedback('Bir daha düşün',true);speak(hint||'Bir daha düşün. Nesneleri dikkatle incele.');const sc=$('.stage');sc?.classList.remove('shake');void sc?.offsetWidth;sc?.classList.add('shake');if(lives===0){lives=3;setTimeout(render,650)}else $('.lives').innerHTML='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function good(message){if(locked)return;locked=true;score+=10;const r=round();if(r.successScene){$('#stage').innerHTML=typeof r.successScene==='function'?r.successScene(state):r.successScene;$('#stage').classList.add('success-motion')}feedback(message||r.result||'Doğru!');speak(r.result||message||'Doğru.');setTimeout(()=>{roundIndex++;if(roundIndex>=3)parentComplete();else render()},WAIT)}
function C(label,correct=false,value=null){return{label,correct,value}}
function P(id,html,target){return{id,html,target}}
function T(id,html,need=1){return{id,html,need}}
function Q(prompt,scene,choices,result,hint,extra={}){return{kind:'choice',prompt,scene,choices,result,hint,...extra}}
function D(prompt,scene,pieces,targets,result,hint,extra={}){return{kind:'drag',prompt,scene,pieces,targets,result,hint,...extra}}

function gecisBasla(fn,ms){state.gecis=true;ertele(()=>{state.gecis=false;fn()},ms)}
function ertele(fn,ms){const t=roundIndex;setTimeout(()=>{if(roundIndex===t&&!locked)fn()},ms)}
const TRUP=s=>String(s||'').toLocaleUpperCase('tr');
function sadeleştir(s){return String(s||'').toLocaleLowerCase('tr').replace(/[^\wçğıöşü\s]/g,' ').replace(/\s+/g,' ').trim()}
function kelimeSay(s){const t=sadeleştir(s);return t?t.split(' ').length:0}

/* ===== KANIT: metindeki kanıtı işaretlemeden seçenek açılmaz (okuma kipi) ===== */
function metinHtml(r){const p=r.metin;
 return `<div class="metin-kart">${r.baslik?`<div class="baslik">${esc(r.baslik)}</div>`:''}
  ${p.map((par,pi)=>`<div>${par.map((par2,si)=>{
   if(typeof par2==='string')return esc(par2);
   const ix=pi+'-'+si,se=(state.kanit||[]).indexOf(ix)>=0,ya=(state.yanlisKanit||[]).indexOf(ix)>=0;
   return `<span class="kanit${se?' secili':''}${ya?' yanlis':''}" data-kanit="${ix}" data-dogru="${par2.dogru?1:0}">${esc(par2.t)}</span>`}).join('')}</div>`).join('')}</div>`}
function kanitCiz(r){const gerek=r.gerekKanit||1;
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}${metinHtml(r)}
  <div class="kanit-sayac">İşaretlenen kanıt: ${(state.kanit||[]).length}/${gerek}</div>
  <div class="caption">${esc(state.not||'Cevaptan önce metinde kanıtı işaretle.')}</div></div>`;
 $$('[data-kanit]').forEach(el=>el.onclick=()=>{
  if(state.gecis||state.faz>0)return;
  const ix=el.dataset.kanit;
  if((state.kanit||[]).indexOf(ix)>=0)return feedback('Bunu işaretledin');
  if(el.dataset.dogru!=='1'){state.yanlisKanit=(state.yanlisKanit||[]).concat(ix);
   state.not='Bu bölüm soruyu yanıtlamıyor. Sorunun ne istediğini yeniden oku.';kanitCiz(r);return wrong(state.not)}
  state.kanit=(state.kanit||[]).concat(ix);state.not='Kanıt işaretlendi.';kanitCiz(r);
  if(state.kanit.length>=gerek){state.faz=1;feedback('Kanıt tamam');gecisBasla(()=>kanitCiz(r),FAST?30:600)}});
 if(state.faz===0)$('#task').innerHTML='<div class="caption">Metinde soruyu yanıtlayan bölüme dokun.</div>';
 else{$('#task').innerHTML=`<div class="caption">${esc(r.soru)}</div>
  <div class="choices">${r.secenekler.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.label)}</button>`).join('')}</div>`;
  $$('[data-choice]').forEach(b=>b.onclick=()=>{const c=r.secenekler[+b.dataset.choice];
   if(!c.correct)return wrong(c.hint||'İşaretlediğin kanıta geri dön: o cümle bu seçeneği destekliyor mu?');
   good()})}}
function renderKanit(r){state.kanit=[];state.yanlisKanit=[];state.faz=0;state.not='';kanitCiz(r)}

/* ===== YAZ: gerçek üretim (yazma kipi) ===== */
function olcutDurum(r,t){const k=kelimeSay(t),ham=String(t||'').trim();
 const d=[];
 if(r.enAzKelime)d.push({ad:`En az ${r.enAzKelime} sözcük`,tam:k>=r.enAzKelime});
 if(r.buyukHarf)d.push({ad:'Büyük harfle başlıyor',tam:/^[A-ZÇĞİÖŞÜ]/.test(ham)});
 if(r.bitis)d.push({ad:`Sonunda ${r.bitis} var`,tam:ham.endsWith(r.bitis)});
 (r.gerekli||[]).forEach(g=>{const im=/^[^0-9A-Za-zÇĞİÖŞÜçğıöşü]+$/.test(g);
  d.push({ad:im?`Metinde ${g} işareti var`:`"${g}" sözcüğü geçiyor`,
   tam:im?ham.indexOf(g)>=0:sadeleştir(ham).indexOf(sadeleştir(g))>=0})});
 if(r.enAzSatir)d.push({ad:`${r.enAzSatir} satır yazıldı`,tam:ham.split('\n').filter(x=>x.trim()).length>=r.enAzSatir});
 return d}
function yazCiz(r){const t=state.yazi||'',d=olcutDurum(r,t);
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}
  ${r.ornek?`<div class="metin-kart"><div class="baslik">Örnek</div>${esc(r.ornek)}</div>`:''}
  <div class="task-card">${esc(r.gorev)}</div>
  <div class="olcut">${d.map(x=>`<div class="${x.tam?'tam':''}"><i>${x.tam?'✓':'○'}</i>${esc(x.ad)}</div>`).join('')}</div></div>`;
 $('#task').innerHTML=`<textarea class="yaz-alan" id="yaziAlan" rows="${r.enAzSatir?4:2}" placeholder="${esc(r.ipucuMetin||'Buraya kendi cümlenizi yaz…')}">${esc(t)}</textarea>
  ${r.bank?`<div class="kelime-bank">${r.bank.map(w=>`<button data-bank="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}
  <button class="action" id="yazOk">Yazdım, kontrol et</button>`;
 const ta=$('#yaziAlan');
 ta.oninput=()=>{state.yazi=ta.value;const dd=olcutDurum(r,ta.value);
  $$('.olcut div').forEach((el,i)=>{if(!dd[i])return;el.className=dd[i].tam?'tam':'';el.innerHTML=`<i>${dd[i].tam?'✓':'○'}</i>`+esc(dd[i].ad)})};
 $$('[data-bank]').forEach(b=>b.onclick=()=>{const v=b.dataset.bank;
  ta.value=(ta.value?ta.value.replace(/\s*$/,' '):'')+v;state.yazi=ta.value;ta.focus();ta.oninput()});
 $('#yazOk').onclick=()=>{const dd=olcutDurum(r,state.yazi||'');
  const eksik=dd.find(x=>!x.tam);
  if(eksik)return wrong('Eksik ölçüt: '+eksik.ad+'. Yazdığını gözden geçir.');
  if(r.yasak&&r.yasak.some(y=>sadeleştir(state.yazi).indexOf(sadeleştir(y))>=0))
   return wrong('Hazır cümleyi kopyalamak yerine kendi sözcüklerinle yaz.');
  good()}}
function renderYaz(r){state.yazi=r.baslangicMetni||'';yazCiz(r)}

/* ===== DİNLE: metin görünmez, ses tekrar edilebilir (dinleme kipi) ===== */
function dinleCiz(r){
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}
  <div class="ses-kart">🎧</div>
  <div class="caption">${state.dinleme?('Dinleme sayısı: '+state.dinleme+' · tekrar dinlemek ceza değil'):'Önce dinle. Metin ekranda yazılı değil.'}</div>
  ${state.faz>0&&r.cozum?`<div class="metin-kart"><div class="baslik">Dinlediğin metin</div>${esc(r.ses)}</div>`:''}</div>`;
 $('#task').innerHTML=`<div class="actions"><button class="action" id="dinleBtn">🔊 ${state.dinleme?'Tekrar dinle':'Dinle'}</button></div>
  ${state.dinleme?`<div class="caption">${esc(r.soru)}</div><div class="choices">${r.secenekler.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.label)}</button>`).join('')}</div>`:'<div class="caption">Seçenekler dinledikten sonra açılır.</div>'}`;
 $('#dinleBtn').onclick=()=>{state.dinleme=(state.dinleme||0)+1;speak(r.ses,true);dinleCiz(r)};
 $$('[data-choice]').forEach(b=>b.onclick=()=>{const c=r.secenekler[+b.dataset.choice];
  if(!c.correct)return wrong(c.hint||'Bir kez daha dinle: aradığın bilgi metnin neresinde geçiyor?');
  state.faz=1;dinleCiz(r);good()})}
function renderDinle(r){state.dinleme=0;state.faz=0;dinleCiz(r);
 requestAnimationFrame(()=>speak(r.gorev))}

/* ===== KONUŞ: örnek dinle → basılı tutarak konuş → rubrik (konuşma kipi) ===== */
function konusCiz(r){const sure=state.sure||0;
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}
  <div class="task-card">${esc(r.gorev)}</div>
  ${state.faz>=1?`<div class="caption">Konuşma süresi: ${sure.toFixed(1).replace('.',',')} saniye</div>`:''}
  <div class="caption">${esc(state.not||'Önce örneği dinle, sonra kendi cümlenle söyle.')}</div></div>`;
 if(state.faz===0){
  $('#task').innerHTML=`<div class="actions"><button class="action" id="ornekDinle">🔊 Örneği dinle</button><button class="action" id="konusBasla">Hazırım</button></div>`;
  $('#ornekDinle').onclick=()=>{state.dinledi=true;speak(r.ornek,true)};
  $('#konusBasla').onclick=()=>{if(!state.dinledi)return wrong('Önce örneği dinle.');
   state.faz=1;state.not='Düğmeyi basılı tut ve yüksek sesle söyle.';konusCiz(r)};
 }else if(state.faz===1){
  $('#task').innerHTML=`<button class="konus-btn" id="konusTut">🎤 Basılı tut ve konuş</button>
   <div class="caption">Bırakınca değerlendirmeye geçilir.</div>`;
  const b=$('#konusTut');
  b.onpointerdown=e=>{e.preventDefault();b.classList.add('basili');state.t0=performance.now()};
  const bitir=()=>{if(!state.t0)return;b.classList.remove('basili');
   state.sure=(performance.now()-state.t0)/1000;state.t0=null;
   if(state.sure<1.2){state.not='Çok kısa konuştun. Cümlenin tamamını söyleyip düğmeyi sonra bırak.';konusCiz(r);return}
   state.faz=2;state.rubrik=[];state.not='Kendini değerlendir: hangi ölçütleri sağladın?';konusCiz(r)};
  b.onpointerup=bitir;b.onpointerleave=bitir;b.onpointercancel=bitir;
 }else{
  $('#task').innerHTML=`<div class="rubrik">${r.olcutler.map((o,i)=>`<button data-ol="${i}" class="${(state.rubrik||[]).indexOf(i)>=0?'secili':''}">${(state.rubrik||[]).indexOf(i)>=0?'✓':'○'} ${esc(o)}</button>`).join('')}</div>
   <button class="action" id="konusOk">Değerlendirmemi bitir</button>`;
  $$('[data-ol]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ol,l=(state.rubrik||[]).slice();
   const k=l.indexOf(i);if(k>=0)l.splice(k,1);else l.push(i);state.rubrik=l;konusCiz(r)});
  $('#konusOk').onclick=()=>{if((state.rubrik||[]).length<r.olcutler.length)
    return wrong('Bütün ölçütleri gözden geçir. Sağlamadığını düşündüğün varsa tekrar konuşabilirsin.');
   good()}}}
function renderKonus(r){state.faz=0;state.dinledi=false;state.sure=0;state.rubrik=[];state.not='';konusCiz(r);
 requestAnimationFrame(()=>speak(r.gorev))}

/* ===== SIRA: olayları oluş sırasına dizme (sabit kartlar) ===== */
function siraCiz(r){
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}
  <div class="vagon-dizi">${r.dogru.map((_,i)=>{const k=(state.dizi||[])[i];
   return `<div class="yuvakart${k!=null?' dolu':''}">${i+1}. ${k!=null?esc(r.kartlar[k].t):'…'}</div>`}).join('')}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div></div>`;
 $('#task').innerHTML=`<div class="stack">${r.kartlar.map((k,i)=>`<button class="sira-kart${(state.dizi||[]).indexOf(i)>=0?' secili':''}" data-kart="${i}">${esc(k.t)}</button>`).join('')}</div>
  <button class="action" id="siraGeri">↩ Son kartı geri al</button>`;
 $$('[data-kart]').forEach(b=>b.onclick=()=>{const i=+b.dataset.kart;
  if((state.dizi||[]).indexOf(i)>=0)return;
  const yer=(state.dizi||[]).length;
  if(r.dogru[yer]!==i){state.not=(r.kartIpucu&&r.kartIpucu[i])||(r.ipucular&&r.ipucular[yer])||'Zaman bağlarına bak: bundan önce ne oldu?';
   siraCiz(r);return wrong(state.not)}
  state.dizi=(state.dizi||[]).concat(i);state.not='Doğru sıra.';siraCiz(r);
  if(state.dizi.length>=r.dogru.length){
   if(r.sonYaz){state.faz=1;gecisBasla(()=>{const rr={...r,...r.sonYaz};state.yazi='';yazCiz(rr)},FAST?30:700);return}
   good()}});
 $('#siraGeri').onclick=()=>{if(!(state.dizi||[]).length)return;state.dizi=state.dizi.slice(0,-1);siraCiz(r)}}
function renderSira(r){state.dizi=[];state.faz=0;state.not='';siraCiz(r)}

/* ===== EŞLE: gerçek sahnede etiket yerleştirme ===== */
function esleCiz(r){
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}
  <div class="stack">${r.yuvalar.map((y,i)=>`<div class="yuvakart${state.yerlesen&&state.yerlesen[i]!=null?' dolu':''}" data-yuva="${i}">${esc(y.ad)}: ${state.yerlesen&&state.yerlesen[i]!=null?esc(r.etiketler[state.yerlesen[i]].t):'…'}</div>`).join('')}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div></div>`;
 $('#task').innerHTML=`<div class="actions">${r.etiketler.map((e,i)=>`<button class="choice" data-et="${i}" ${(state.yerlesen||[]).indexOf(i)>=0?'style="opacity:.35"':''}>${esc(e.t)}</button>`).join('')}</div>`;
 $$('[data-et]').forEach(b=>b.onclick=()=>{state.secEt=+b.dataset.et;state.not='Etiket seçildi: hangi yuvaya ait?';esleCiz(r)});
 $$('[data-yuva]').forEach(el=>el.onclick=()=>{const i=+el.dataset.yuva;
  if(state.secEt==null)return feedback('Önce bir etiket seç',true);
  if(r.yuvalar[i].dogru!==state.secEt){state.not=r.yuvalar[i].ipucu||'Bu etiket buraya uymuyor; metindeki kanıta bak.';
   esleCiz(r);return wrong(state.not)}
  const y=(state.yerlesen||r.yuvalar.map(()=>null)).slice();y[i]=state.secEt;state.yerlesen=y;state.secEt=null;
  state.not='Doğru eşleşme.';esleCiz(r);
  if(y.every(x=>x!=null))good()})}
function renderEsle(r){state.yerlesen=r.yuvalar.map(()=>null);state.secEt=null;state.not='';esleCiz(r)}

/* ===== DÜZELT: hazır doğru biçim verilmez, çocuk düzenler ===== */
function duzeltCiz(r){const t=state.yazi!=null?state.yazi:r.hatali;
 const tam=r.denetim.map(d=>({ad:d.ad,tam:new RegExp(d.desen,d.bayrak||'').test(t)}));
 $('#stage').innerHTML=`<div class="stack">${r.sahne||''}
  <div class="metin-kart"><div class="baslik">Düzeltilecek metin</div>${esc(r.hatali)}</div>
  <div class="olcut">${tam.map(x=>`<div class="${x.tam?'tam':''}"><i>${x.tam?'✓':'○'}</i>${esc(x.ad)}</div>`).join('')}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div></div>`;
 $('#task').innerHTML=`<textarea class="duzelt-alan" id="duzeltAlan" rows="3">${esc(t)}</textarea>
  <button class="action" id="duzeltOk">Düzelttim, kontrol et</button>`;
 const ta=$('#duzeltAlan');
 ta.oninput=()=>{state.yazi=ta.value;
  const dd=r.denetim.map(d=>new RegExp(d.desen,d.bayrak||'').test(ta.value));
  $$('.olcut div').forEach((el,i)=>{el.className=dd[i]?'tam':'';el.innerHTML=`<i>${dd[i]?'✓':'○'}</i>`+esc(r.denetim[i].ad)})};
 $('#duzeltOk').onclick=()=>{const v=state.yazi!=null?state.yazi:r.hatali;
  const eksik=r.denetim.find(d=>!new RegExp(d.desen,d.bayrak||'').test(v));
  if(eksik)return wrong('Hâlâ düzeltilmemiş: '+eksik.ad);
  if(sadeleştir(v)===sadeleştir(r.hatali))return wrong('Metinde hiçbir değişiklik yapmadın.');
  good()}}
function renderDuzelt(r){state.yazi=r.hatali;state.not='';duzeltCiz(r)}

function renderRound(){const r=round();if(!r)return;
 const fn={kanit:renderKanit,yaz:renderYaz,dinle:renderDinle,konus:renderKonus,
  sira:renderSira,esle:renderEsle,duzelt:renderDuzelt}[r.kind];
 (fn||renderKanit)(r)}
