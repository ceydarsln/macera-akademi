<body><div id="app" class="app"></div>
<script>
/* Sınama modunda (?test=1) tarayıcının arka plan sekme kısıntısını aş:
   gizli sekmede setTimeout dakikada bire kadar iniyor ve oyunun kendi
   geçişleri donuyordu. Yalnız kısa gecikmeler için, yalnız testte. */
if(new URLSearchParams(location.search).has('test')){
 const _st=window.setTimeout;
 window.setTimeout=function(fn,ms){
  if(!document.hidden||!(ms<2000))return _st(fn,ms);
  const son=Date.now()+(ms||0),k=new MessageChannel();
  k.port1.onmessage=()=>{Date.now()>=son?fn():k.port2.postMessage(0)};
  k.port2.postMessage(0);return 0};
}

'use strict';
const GAME_ID=new URLSearchParams(location.hash.slice(1)).get('oyun')||'s0';
const FAST=new URLSearchParams(location.search).has('test');
const WAIT=FAST?25:760;
let game,roundIndex=0,lives=3,score=0,state={},locked=false,drag=null,clockDrag=null;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speech=s=>String(s??'').replace(/\+/g,' artı ').replace(/[−–-]/g,' eksi ').replace(/[×x]/g,' çarpı ').replace(/[:÷]/g,' bölü ').replace(/=/g,' eşittir ').replace(/\s+/g,' ').trim();
/* Kataloğun oku(metin,tekrar) köprüsü, tekrar=false iken aynı metni bir daha
   okumaz (gs.spokenKey karşılaştırması). Dinleme düğmeleri bu bayrağı
   geçirmediği için ikinci basıştan sonra sessiz kalıyordu; hedef sayı
   ekranda hiç yazılı olmadığından çocuk ilk okumayı kaçırırsa kilitleniyordu. */
/* ===== SES YEDEĞİ =====
   Bu motorlarda hedef şartname gereği ekrana KASTEN yazılmıyor, yalnız sesle
   veriliyor. Cihazda Türkçe ses paketi yoksa (ya da kullanıcı sesi kapattıysa)
   speakNow false dönüyor ve oyun çözülemez hâle geliyordu: çocuk ne duyuyor ne
   görüyor. Kataloğun oku() yorumunda tarif edilen yedek yol buydu ama kullanan
   yoktu. Artık speak() gerçekten seslendirildi mi bilgisini tutuyor; seslendirme
   olmuyorsa o turun gizli hedefi "ses yok" notuyla görünür kılınıyor.
   Çözülemeyen oyun, görünen hedeften kötüdür. */
let sesVar=null;
function sesYok(){return sesVar===false}
function speak(text,repeat=false){
 let ok=false,koprü=false;
 try{if(parent&&parent!==window&&typeof parent.oku==='function'){koprü=true;ok=!!parent.oku(speech(text),repeat)}}catch(e){}
 /* Köprü varsa onun cevabı bağlayıcıdır. Aksi hâlde motorun kendi
    speechSynthesis'i devreye giriyor ve o hata vermediği için köprünün
    "ses yok" sinyalini maskeliyordu. */
 if(!koprü){try{
   const sesler=speechSynthesis.getVoices()||[];
   /* getVoices ilk çağrıda boş dönebilir; boşluğu "bilinmiyor" sayıp
      yanlış alarm vermiyoruz. */
   if(!sesler.length||sesler.some(v=>/^tr/i.test(v.lang||''))){
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speech(text));
    u.lang='tr-TR';speechSynthesis.speak(u);ok=true}
  }catch(e){ok=false}}
 /* Boş metin her zaman false döner; bayrağı yalnız gerçek denemeler belirler. */
 if(String(text||'').trim()){sesVar=ok;sesUyariCiz()}
 return ok}
function sesUyariCiz(){
 const kap=document.querySelector('.scene');if(!kap)return;
 let el=document.getElementById('sesYokKutu');
 const h=sesYok()&&typeof gizliHedef==='function'?gizliHedef(round&&round()):'';
 if(!h){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='sesYokKutu';el.className='ses-yok';kap.appendChild(el)}
 el.innerHTML='🔇 Ses açılamadı, hedef gösteriliyor: <b>'+esc(h)+'</b>'}
/* Gizli hedef: yalnız 'yaz' turunda hedef sayı sesle veriliyor. 'ciz'
   turunda rakam kılavuzda ve oyun başlığında görünür, ses gerekmiyor. */
function gizliHedef(r){
 /* Hedef tur boyunca sabit gösteriliyor: "zaten açıldı" koşulları banner'ı
    turun ortasında bayatlatıyordu ve bilgi her hâlükârda aynı. */
 if(!r||r.kind!=='yaz'||state.hedef==null)return '';
 return String(state.hedef)+' ('+sayiAdiTR(state.hedef)+')'}
function parentComplete(){try{if(parent&&parent!==window&&typeof parent.completeGame==='function'){parent.completeGame(game.finish,score);return}}catch(e){}showOverlay()}
function showOverlay(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="overlay"><div class="overlay-card"><div class="big">🏆</div><h2>Harikasın!</h2><p>${esc(game.finish)}</p><button class="action" onclick="location.reload()">Yeniden oyna</button></div></div>`)}
function units(icon,n,cls=''){return `<div class="row">${Array.from({length:n},(_,i)=>`<span class="unit ${cls}" data-unit="${i}">${icon}</span>`).join('')}</div>`}
function baseTen(n){const t=Math.floor(n/10),o=n%10;return `<div class="base-ten">${'<i class="ten-rod"></i>'.repeat(t)}${'<i class="one-cube"></i>'.repeat(o)}</div>`}
function balloons(n){return `<div class="balloon-field">${'<span class="balloon">🎈</span>'.repeat(n)}</div>`}
function tallyMarks(n){const f=Math.floor(n/5),r=n%5;return `${'||||̸ '.repeat(f)}${'|'.repeat(r)}`}
function chart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div class="bar" style="--n:${c.n/key};--bar:${c.color||'#e95e77'}">${Array.from({length:c.n/key},()=>'<span>■</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Her blok ${key} veriyi gösterir.</div>`}
function dotChart(cols,key=1){return `<div class="chart">${cols.map(c=>`<div class="bar-col"><div style="min-height:135px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;color:${c.color||'#3f87b7'};font-size:25px;line-height:.78">${Array.from({length:c.n/key},()=>'<span>●</span>').join('')}</div><small>${c.icon||''} ${esc(c.label||'')}</small></div>`).join('')}</div><div class="caption">Anahtar: ● = ${key} ${esc(cols[0]?.unit||'kişi')}</div>`}
function sceneHtml(r){return typeof r.scene==='function'?r.scene(state):r.scene||''}
function hud(){return `<header class="hud"><div class="round">Tur ${roundIndex+1}/3</div><div class="prompt">${esc(round().prompt)}</div><div class="hud-right"><span class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(3-lives)}</span><button class="sound" aria-label="Yönergeyi dinle">🔊</button></div></header>`}
function round(){return game.rounds[roundIndex]}
function render(){if(!game||roundIndex>=game.rounds.length)return;state={};locked=false;document.getElementById('app').innerHTML=hud()+`<main class="scene" data-theme="${round().theme||game.theme||'room'}"><div class="feedback"></div><section class="stage ${round().dark?'dark':''}" id="stage"></section><section class="task" id="task"></section></main>`;$('.sound').onclick=()=>speak(round().prompt,true);renderRound();sesUyariCiz();/* rAF geri çağrısı bir sonraki karede çalışıyor; gizli sekmede hiç
   çalışmayıp sekme görünür olunca kuyruktan dönüyor. O ana kadar oyun
   bitmişse round() undefined oluyordu. Tur numarası da doğrulanıyor ki
   geciken kare bir önceki turun yönergesini okumasın. */
requestAnimationFrame(()=>{const t=roundIndex,r=round();if(r&&roundIndex===t)speak(r.prompt)})}
function updateStage(){if(!round())return;const st=$('#stage');if(st)st.innerHTML=sceneHtml(round())}
function feedback(msg,bad=false){const f=$('.feedback');if(!f)return;f.textContent=msg;f.className='feedback show'+(bad?' bad':'');setTimeout(()=>{if(f)f.className='feedback'},950)}

function sahneSvg(ad,ic,odulUcur){const s=SAHNE[ad]||SAHNE.clouds;
 return `<svg class="iz-svg" viewBox="0 0 330 230" width="330" height="230">
  <rect x="0" y="0" width="330" height="230" rx="18" fill="${s.gok}"/>

  ${ic}</svg>`}

/* ===================== ÇİZ: rakam yazma (s0–s10) ===================== */
const IZ_TOL=26;
function yolNoktalari(d,n){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',d);const L=p.getTotalLength(),liste=[];
 for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n);liste.push([q.x,q.y])}
 return liste}
function izKur(r){const rk=r.rakam,yollar=RAKAM[rk];
 state.hamle=0;state.adim=0;state.tamam=[];
 state.yollar=yollar.map(d=>({d,nokta:yolNoktalari(d,d.length>90?9:6),uz:izUzunluk(d)}));
 state.kilavuz=r.kilavuz;state.faz=0;state.sayilan=0}
function izUzunluk(d){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);return p.getTotalLength()}
function izIc(r){const OX=115,OY=44;let ic=`<g transform="translate(${OX},${OY})">`;
 state.yollar.forEach((y,i)=>{const bitti=i<state.hamle;
  const gorunur=state.kilavuz===0||(state.kilavuz===1&&i>=state.hamle);
  if(gorunur&&!bitti)ic+=`<path class="kilavuz" d="${y.d}" stroke="rgba(255,255,255,${state.kilavuz===0?0.85:0.32})" stroke-dasharray="${state.kilavuz===0?'0':'10 12'}"/>`;
  const oran=bitti?1:(i===state.hamle?state.adim/(y.nokta.length-1):0);
  ic+=`<path class="murekkep" id="mur${i}" d="${y.d}" stroke="${r.murekkep||'#ffd63a'}" stroke-dasharray="${y.uz}" stroke-dashoffset="${(y.uz*(1-oran)).toFixed(1)}"/>`});
 const y=state.yollar[state.hamle];
 if(y){const hedef=y.nokta[state.adim];
  ic+=`<circle id="hedefNokta" class="${state.adim===0?'basla-top':'kn'}" cx="${hedef[0]}" cy="${hedef[1]}" r="${state.adim===0?11:9}" fill="${state.adim===0?'#ffd63a':'rgba(255,214,58,.55)'}" stroke="${state.adim===0?'#8a5725':'#ffd63a'}" stroke-width="3"/>
   <text id="baslaYazi" x="${hedef[0]}" y="${hedef[1]-18}" font-size="11" font-weight="900" fill="#ffd63a" text-anchor="middle" opacity="${state.adim===0?1:0}">BAŞLA</text>`}
 return ic+'</g>'}
function izCiz(r){
 if(state.faz===1)return izSay(r);
 $('#stage').innerHTML=`<div class="stack"><div class="sahne-katman" id="izKatman">${sahneSvg(r.sahne,izIc(r))}</div>
  <div class="caption">${esc(state.not||r.gorev)}</div>
  <div class="caption">${esc(['Kılavuz açık','Kılavuz soluk','Kılavuz yok'][state.kilavuz])} · hamle ${Math.min(state.hamle+1,state.yollar.length)}/${state.yollar.length}</div></div>`;
 const sv=$('#izKatman svg');if(!sv)return;
 const cev=e=>{const b=sv.getBoundingClientRect();
  return [(e.clientX-b.left)/b.width*330-115,(e.clientY-b.top)/b.height*230-44]};
 const dokun=e=>{if(!state.basli||!sv.isConnected)return;const p=cev(e),y=state.yollar[state.hamle];if(!y)return;
  const h=y.nokta[state.adim];
  if(Math.hypot(p[0]-h[0],p[1]-h[1])<IZ_TOL)izIlerle(r)};
 sv.onpointerdown=e=>{e.preventDefault();const p=cev(e),y=state.yollar[state.hamle];if(!y)return;
  const h=y.nokta[state.adim];
  if(Math.hypot(p[0]-h[0],p[1]-h[1])<IZ_TOL+8){state.basli=true;sv.setPointerCapture&&sv.setPointerCapture(e.pointerId);izIlerle(r)}
  else{state.not='Parmağını sarı BAŞLA topundan başlat.';izCiz(r)}};
 sv.onpointermove=dokun;
 sv.onpointerup=()=>{state.basli=false;if(state.adim>0&&state.hamle<state.yollar.length){state.not='Parmağını kaldırdın; kaldığın noktadan devam et.'}};
 sv.onpointercancel=()=>state.basli=false;
 $('#task').innerHTML=`<div class="caption">Sarı topa bas ve parmağını noktalardan geçirerek ilerlet.</div>
  <button class="action" id="izSes">🔊 Yönergeyi dinle</button>`;
 $('#izSes').onclick=()=>speak(r.rakamAdi+'. '+YON[r.rakam],true)}
function izGuncelle(){const y=state.yollar[state.hamle];if(!y)return;
 const oran=state.adim/(y.nokta.length-1),mur=$('#mur'+state.hamle);
 if(mur)mur.setAttribute('stroke-dashoffset',(y.uz*(1-oran)).toFixed(1));
 const h=y.nokta[state.adim],d=$('#hedefNokta'),t=$('#baslaYazi');
 if(d){d.setAttribute('cx',h[0]);d.setAttribute('cy',h[1]);
  d.setAttribute('r',state.adim===0?11:9);d.setAttribute('class',state.adim===0?'basla-top':'kn')}
 if(t){t.setAttribute('x',h[0]);t.setAttribute('y',h[1]-18);t.setAttribute('opacity',state.adim===0?1:0)}}
/* Her adımda bütün sahneyi yeniden kurmak sürüklemeyi koparıyordu:
   yalnız mürekkep ve hedef nokta güncelleniyor. */
function izIlerle(r){const y=state.yollar[state.hamle];
 if(state.adim<y.nokta.length-1){state.adim++;state.not='';izGuncelle();
  if(state.adim===y.nokta.length-1){state.hamle++;state.adim=0;
   if(state.hamle>=state.yollar.length)return izBitti(r);
   state.basli=false;state.not='Bu hamle tamam. Sıradaki hamlenin BAŞLA topuna geç.';izCiz(r)}}}
function izBitti(r){state.basli=false;
 if(r.sayimHedef==null){state.not='Rakam tamam!';izCiz(r);return good()}
 state.faz=1;state.sayilan=0;feedback('Rakam tamam!');speak(r.rakamAdi+' yazıldı.');gecisBasla(()=>izSay(r),FAST?40:800)}
function izSay(r){const n=r.sayimHedef;
 $('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,`<g transform="translate(115,44)"><path class="murekkep" d="${state.yollar[state.yollar.length-1].d}" stroke="${r.murekkep||'#ffd63a'}"/></g>`)}
  <div class="nesne-alan">${n?Array.from({length:n},(_,i)=>`<span class="nesne${i<state.sayilan?' sayildi':''}" data-nesne="${i}">${r.nesne}</span>`).join(''):`<span class="caption">${esc(r.bosMetin||'Sepet tamamen boş.')}</span>`}</div>
  <div class="sayac-buyuk">${state.sayilan}</div>
  <div class="caption">${esc(state.not||(n?'Nesneleri tek tek sayarak dokun.':'Hiç nesne yok. Bu miktara hangi rakam uyar?'))}</div></div>`;
 $$('[data-nesne]').forEach(el=>el.onclick=()=>{const i=+el.dataset.nesne;
  if(i!==state.sayilan)return wrong('Sırayla say: sıradaki nesne bir sonraki.');
  state.sayilan++;speak(String(state.sayilan));izSay(r);
  if(state.sayilan>=n){state.not='Şimdi bu miktara uyan rakamı seç.';izSay(r)}});
 if(!n||state.sayilan>=n){
  $('#task').innerHTML=`<div class="caption">Saydığın miktar hangi rakamla yazılır?</div>
   <div class="choices">${r.sayimSec.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.label)}</button>`).join('')}</div>`;
  $$('[data-choice]').forEach(b=>b.onclick=()=>{
   if(!r.sayimSec[+b.dataset.choice].correct)return wrong('Kaç nesne saydın? O sayının rakamını seç.');
   good()});
 }else $('#task').innerHTML='<div class="caption">Nesnelere sırayla dokunarak say.</div>'}
function renderIzOyun(r){izKur(r);state.not='';izCiz(r);
 requestAnimationFrame(()=>speak(r.rakamAdi+'. '+YON[r.rakam]))}
/* koşum yardımcıları */
function izNoktaEkran(){const sv=$('#izKatman svg');if(!sv)return null;
 const y=state.yollar[state.hamle];if(!y)return null;
 const b=sv.getBoundingClientRect(),h=y.nokta[state.adim];
 return [b.left+(h[0]+115)/330*b.width, b.top+(h[1]+44)/230*b.height]}

/* ===================== YAZ: iki basamaklı sayı (n1–n9) ===================== */
function yazKur(r){state.hedef=r.sayilar[Math.floor(Math.random()*r.sayilar.length)];
 state.basamak=[null,null];state.slot=0;state.faz=r.nesneOnce?0:1;
 state.kilavuz=r.kilavuz;state.sayilan=0;state.yollar=null;state.not=''}
function yazSlotlar(){const d=String(state.hedef);
 return `<div class="row">${[0,1].map(i=>`<div class="yuva"><div class="kutu${state.basamak[i]!=null?' dolu':''}${state.slot===i&&state.basamak[i]==null?' aktif':''}">${state.basamak[i]!=null?state.basamak[i]:''}</div><small>${i?'birler':'onlar'}</small></div>`).join('')}</div>`}
function yazCiz(r){
 if(state.faz===0)return yazNesne(r);
 if(state.faz===2)return yazIz(r);
 $('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,'')}
  ${yazSlotlar()}
  <div class="caption">${esc(state.not||(sesYok()?'Ses açılamadı: sayı aşağıda gösteriliyor. Rakamlarını seç.':'Sayıyı dinle, sonra rakamlarını seç. Sayı ekranda yazılı değil.'))}</div></div>`;

function yazRakam(r,n){const d=String(state.hedef),i=state.slot;
 if(state.basamak[i]!=null)return;
 if(String(n)!==d[i]){state.not=i===0
   ?'Onlar basamağı bu değil. On onluk demet kaç eder? Sayıyı yeniden dinle.'
   :'Birler basamağı bu değil. Demetten artan tek nesneleri say.';
  yazCiz(r);return wrong(state.not)}
 state.basamak[i]=n;state.not='Şimdi bu rakamı yaz.';state.faz=2;
 state.rakamYaz=String(n);izKurYaz(r);yazIz(r)}
function izKurYaz(r){const yollar=RAKAM[state.rakamYaz];
 state.hamle=0;state.adim=0;
 state.yollar=yollar.map(d=>({d,nokta:yolNoktalari(d,d.length>90?9:6),uz:izUzunluk(d)}))}
function yazIz(r){
 $('#stage').innerHTML=`<div class="stack"><div class="sahne-katman" id="izKatman">${sahneSvg(r.sahne,izIc({...r,rakam:state.rakamYaz,murekkep:'#5cf0c8'}))}</div>
  ${yazSlotlar()}
  <div class="caption">${esc(state.not||'')} · ${esc(['Kılavuz açık','Kılavuz soluk','Kılavuz yok'][state.kilavuz])}</div></div>`;
 const sv=$('#izKatman svg');if(!sv)return;
 const cev=e=>{const b=sv.getBoundingClientRect();return [(e.clientX-b.left)/b.width*330-115,(e.clientY-b.top)/b.height*230-44]};
 const ilerle=()=>{const y=state.yollar[state.hamle];
  if(state.adim<y.nokta.length-1){state.adim++;izGuncelle();
   if(state.adim===y.nokta.length-1){state.hamle++;state.adim=0;
    if(state.hamle>=state.yollar.length)return yazIzBitti(r);
    state.basli=false;yazIz(r)}}};
 const dokun=e=>{if(!state.basli||!sv.isConnected)return;const p=cev(e),y=state.yollar[state.hamle];if(!y)return;
  const h=y.nokta[state.adim];if(Math.hypot(p[0]-h[0],p[1]-h[1])<IZ_TOL)ilerle()};
 sv.onpointerdown=e=>{e.preventDefault();const p=cev(e),y=state.yollar[state.hamle];if(!y)return;
  const h=y.nokta[state.adim];
  if(Math.hypot(p[0]-h[0],p[1]-h[1])<IZ_TOL+8){state.basli=true;sv.setPointerCapture&&sv.setPointerCapture(e.pointerId);ilerle()}};
 sv.onpointermove=dokun;sv.onpointerup=()=>state.basli=false;sv.onpointercancel=()=>state.basli=false;
 $('#task').innerHTML=`<div class="caption">${esc(state.rakamYaz)} rakamını sarı toptan başlayarak yaz.</div><button class="action" id="izSes">🔊 Yönergeyi dinle</button>`;

function yazIzBitti(r){state.basli=false;
 if(state.slot===0){state.slot=1;state.faz=1;state.not='Onlar basamağı tamam. Şimdi birler basamağı.';
  feedback('Onlar yazıldı');gecisBasla(()=>yazCiz(r),FAST?40:700);return}
 state.faz=3;feedback('Sayı yazıldı');speak(sayiAdiTR(state.hedef));gecisBasla(()=>yazDogrula(r),FAST?40:800)}
function yazNesne(r){const on=Math.floor(state.hedef/10),bir=state.hedef%10;
 $('#stage').innerHTML=`<div class="stack">${sahneSvg(r.sahne,'')}
  <div class="nesne-alan">${Array.from({length:on},(_,i)=>`<span class="demet${i<Math.min(state.sayilan,on)?' sayildi':''}" data-demet="${i}">${'<i></i>'.repeat(10)}</span>`).join('')}
   ${Array.from({length:bir},(_,i)=>`<span class="birlik${(state.sayilan-on)>i?' sayildi':''}" data-birlik="${i}"></span>`).join('')}</div>
  <div class="sayac-buyuk">${state.sayilan<=on?state.sayilan*10:on*10+(state.sayilan-on)}</div>
  <div class="caption">${esc(state.not||'Önce demetleri say (onar onar), sonra tek nesneleri (birer birer).')}</div></div>`;
 const say=()=>{state.sayilan++;const d=state.sayilan<=on?state.sayilan*10:on*10+(state.sayilan-on);
  speak(String(d));
  if(state.sayilan>=on+bir){state.not='Bu miktar kaç eder? Şimdi sayıyı yaz.';
   /* Son nesneye dokunulduğunda sayaç bir eksik kalıyordu: ekranda 16 yazarken
      geri bildirim 'Toplam 17' diyordu. Önce son sayı çizilsin, sonra geçilsin. */
   yazNesne(r);state.faz=1;
   feedback('Toplam '+state.hedef);gecisBasla(()=>yazCiz(r),FAST?40:800);return}
  yazNesne(r)};

  if(+el.dataset.demet!==state.sayilan)return wrong('Demetleri sırayla say.');say()});
 $$('[data-birlik]').forEach(el=>el.onclick=()=>{if(state.gecis)return;
  if(state.sayilan<on)return wrong('Önce onluk demetleri say.');
  if(+el.dataset.birlik!==state.sayilan-on)return wrong('Tek nesneleri sırayla say.');say()});
 $('#task').innerHTML='<div class="caption">Nesnelere sırayla dokunarak say.</div>'}

  <div class="caption">${state.hedef} = ${on} onluk demet + ${bir} birlik</div>
  <div class="caption">Yazdığın sayı, duyduğun sayı ve nesne miktarı aynı.</div></div>`;
 $('#task').innerHTML=`<button class="action" id="yazOk">Tamam</button>`;
 $('#yazOk').onclick=()=>good()}
function sayiAdiTR(n){const b=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],
 o=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
 if(n<10)return b[n];const t=Math.floor(n/10),k=n%10;return (o[t]+(k?' '+b[k]:'')).trim()}

function renderRound(){const r=round();if(!r)return;
 const fn={ciz:renderIzOyun,yaz:renderYazOyun}[r.kind];(fn||renderIzOyun)(r)}
function renderYazOyun(r){yazKur(r);yazCiz(r);
 requestAnimationFrame(()=>speak(r.gorev+' '+sayiAdiTR(state.hedef)))}

const GAMES={};
/* ===== 1. SINIF SAYMA — s0–s10 (rakam yazma) ve n1–n9 (iki basamaklı sayı) =====
   Kaynak şartname: 1_sinif_sayma_oyunlari_detayli_duzeltmeler.pdf
   (yapılandırılmış hâli tmp/pdfs/sayma1_games.json + build betiği).
   Motor sıfırdan yazıldı: eğrisel yollar, gerçek sahneler, cezasız sapma,
   üç kademeli tur (kılavuzlu → soluk → kılavuzsuz) ve sayı-miktar bağı. */
function saySec(n){const a=[n-1,n,n+1].filter(x=>x>=0);
 if(a.length<3)a.push(n+2);
 return a.map(x=>({label:String(x),correct:x===n}))}
function cizTur(g,kilavuz,gorev,sayim){
 const t={kind:'ciz',prompt:g.prompt[kilavuz],sahne:g.sahne,rakam:g.rakam,rakamAdi:g.adi,
  kilavuz,gorev,murekkep:g.murekkep,sayimHedef:null,
  result:g.sonuc[kilavuz]};
 if(sayim){t.sayimHedef=g.miktar;t.nesne=g.nesne;t.sayimSec=saySec(g.miktar);t.bosMetin=g.bosMetin}
 return t}
function cizOyun(g){GAMES[g.id]={title:g.title,theme:g.tema||'room',finish:g.finish,rounds:[
 cizTur(g,0,g.gorev[0],false),cizTur(g,1,g.gorev[1],false),cizTur(g,2,g.gorev[2],true)]}}
function yazTur(g,kilavuz,nesneOnce){return {kind:'yaz',prompt:g.prompt[kilavuz],sahne:g.sahne,
 kilavuz,nesneOnce,sayilar:g.sayilar[kilavuz],gorev:g.gorev,result:g.sonuc[kilavuz]}}
function yazOyun(g){GAMES[g.id]={title:g.title,theme:g.tema||'room',finish:g.finish,rounds:[
 yazTur(g,0,false),yazTur(g,1,false),yazTur(g,2,true)]}}
