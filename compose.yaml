name: macera-akademi

services:
  app:
    build:
      context: .
    image: macera-akademi:${MACERA_IMAGE_TAG:-2.8.1}
    restart: unless-stopped
    init: true
    ports:
      - "${MACERA_BIND_ADDRESS:-127.0.0.1}:${MACERA_HTTP_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MACERA_DB_HOST: ${MACERA_DB_HOST:-db}
      MACERA_DB_PORT: ${MACERA_DB_PORT:-3306}
      MACERA_DB_NAME: ${MACERA_DB_NAME:-macera_akademi}
      MACERA_DB_USER: ${MACERA_DB_USER:-macera_user}
      MACERA_DB_PASSWORD: ${MACERA_DB_PASSWORD:-BURAYA_GUCLU_PAROLA_YAZIN}
      MACERA_DB_CHARSET: ${MACERA_DB_CHARSET:-utf8mb4}
      MACERA_ALLOWED_ORIGINS: ${MACERA_ALLOWED_ORIGINS:-https://maceraakademi.com.tr,https://www.maceraakademi.com.tr,https://appassets.androidplatform.net,null}
      MACERA_TOKEN_TTL_DAYS: ${MACERA_TOKEN_TTL_DAYS:-90}
      MACERA_DEBUG: ${MACERA_DEBUG:-false}
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.0
    profiles:
      - bundled-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MACERA_DB_NAME:-macera_akademi}
      MYSQL_USER: ${MACERA_DB_USER:-macera_user}
      MYSQL_PASSWORD: ${MACERA_DB_PASSWORD:-BURAYA_GUCLU_PAROLA_YAZIN}
      MYSQL_ROOT_PASSWORD: ${MACERA_DB_ROOT_PASSWORD:-BURAYA_FARKLI_BIR_ROOT_PAROLASI_YAZIN}
    volumes:
      - macera_mysql_data:/var/lib/mysql
      - ./web/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  macera_mysql_data:
