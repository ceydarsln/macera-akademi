<!doctype html>
<meta charset="utf-8">
<title>DOM motoru koşumu</title>
<!--
  matematik-pdf ve matematik2-pdf DOM motorlarındaki oyunları tarayıcı
  içinde baştan sona oynar. Node/Playwright gerektirmez: pdf-math-smoke.js
  ve pdf-math2-smoke.js içindeki çözücülerin tarayıcıya taşınmış hâlidir.

  Kullanım:  dom_kosum.html#ids=v01,v02  (boş bırakılırsa iki motorun
  tüm oyunları). Sonuçlar window.SONUC içinde ve ekranda birikir.
-->
<style>
 body{margin:0;font:13px ui-monospace,monospace;background:#10141c;color:#cfe3d8;display:grid;grid-template-columns:420px 1fr;height:100vh}
 #panel{padding:10px;overflow:auto;white-space:pre-wrap}
 iframe{width:100%;height:100%;border:0;background:#fff}
 .g{color:#7ce0a3}.b{color:#ff8a8a}
</style>
<div id="panel">hazırlanıyor…</div>
<iframe id="cerceve"></iframe>
<script>
'use strict';

const ENGINE1 = 'm01,m02,m03,m05,m09,m10,m11,m12,m14,m15,m17,m18,m20,m22,m23,m24,m25,m26,m28,m31,m32,m33,m34,m35,m36,m37,m38,m39,m41,m42,m43,m44,m45,m46,m47,m48,m49,m50,m51,m52,m53,m54,m55,m56,m57,m58,m59,m60,m61'.split(',');
const ENGINE2 = 'v01,v02,v03,v04,v05,v06,v07,v08,v09,v10,v11,v12,v13,v14,v15,v16,v17,v18,v19,v20,v21,v22,v23,v24,v25,v26,v27,v28,v29,v30,v31,v32,v33,v34,v35,v36,v37,v38,v39,v40,v41,v42'.split(',');

const ENGINE3 = 'w01,w02,w03,w04,w05,w06,w07,w08,w09,w10,w11,w12,w13,w14,w15,w16,w17,w18,w19,w20,w21,w22,w23,w24,w25,w26,w27,w28,w29,w30,w31,w32,w33,w34,w35,w36,w37,w38,w39,w40'.split(',');   /* 3. sınıf: partiler hâlinde büyüyor */

const panel = document.getElementById('panel');
const cerceve = document.getElementById('cerceve');
/* Sekme arka plandayken Chrome setTimeout'u dakikada bire kadar kısıyor
   ("intensive throttling"); koşum saatlerce sürüyordu. MessageChannel mesajları
   kısılmadığı için gizli sekmede onunla dönülüyor. */
const bekle = (ms) => new Promise(res => {
  if (!document.hidden) return void setTimeout(res, ms);
  const son = Date.now() + ms, k = new MessageChannel();
  k.port1.onmessage = () => (Date.now() >= son ? res() : k.port2.postMessage(0));
  k.port2.postMessage(0);
});
const yaz = (m, sinif) => { panel.insertAdjacentHTML('beforeend', '<div class="' + (sinif||'') + '">' + m + '</div>'); panel.scrollTop = panel.scrollHeight; };

function motorDosyasi(id){
  if (id[0] === 'v') return '../app/src/main/assets/phaser/matematik2-pdf.html';
  if (id[0] === 'w') return '../app/src/main/assets/phaser/matematik3-pdf.html';
  return '../app/src/main/assets/phaser/matematik-pdf.html';
}

/* İframe penceresinden turun veri kopyasını al (işlevler atılır). */
function turVerisi(W){
  return JSON.parse(W.eval(
    'JSON.stringify(round(), (k,v)=>typeof v==="function"?undefined:v)'
  ));
}
const S  = (W, sec) => W.document.querySelector(sec);
const SS = (W, sec) => Array.from(W.document.querySelectorAll(sec));

/* Playwright locator'ları öğe görünene kadar bekler; motorlar sahneyi
   animasyonla parça parça kurduğu için (ör. robot kutuları tek tek
   yükler) aynı davranış burada da şart. */
async function bekleyenSec(W, sec, sure){
  const bas = Date.now();
  while (Date.now() - bas < (sure || 15000)){
    const el = S(W, sec);
    if (el) return el;
    await bekle(90);
  }
  throw new Error('bulunamadı: ' + sec);
}
/* Motorlar aşama değiştirirken state.gecis=true yapıyor; o sırada gelen
   dokunuş yok sayılıyor. Tıklamadan önce geçişin bitmesini bekle. */
async function gecisBekle(W){
  await kosul(() => {
    try { return W.eval('String(!(typeof state !== "undefined" && state && state.gecis))') === 'true'; }
    catch (e) { return true; }
  }, 15000, 'aşama geçişi');
}
async function tikla(W, sec){
  await gecisBekle(W);
  const el = await bekleyenSec(W, sec);
  /* SVG öğelerinde .click() yok; gerçek dokunuşun ürettiği olayı gönder. */
  if (typeof el.click === 'function') el.click();
  else el.dispatchEvent(new W.MouseEvent('click', {bubbles:true, cancelable:true}));
}

/* Koşulu gerçek zamanda bekle */
async function kosul(f, sure, ad){
  const bas = Date.now();
  while (Date.now() - bas < sure){ if (f()) return; await bekle(80); }
  throw new Error('zaman aşımı: ' + ad);
}

/* ---------- motor 2 (v oyunları): dokun-seç / dokun-bırak yolu ---------- */
async function surukle2(W, pid, tid){
  const p = await bekleyenSec(W, '[data-piece="' + pid + '"]');
  const t = await bekleyenSec(W, '[data-target="' + tid + '"]');
  p.click(); t.click();
  await bekle(45);
}

/* motor 2'nin rota bulucusu (BFS) — pdf-math2-smoke.js'ten */
function rota(r){
  const key = (x,y) => x + ',' + y;
  const duvar = new Set((r.walls||[]).map(x => key(x[0],x[1])));
  const q = [[r.start[0], r.start[1], []]];
  const gezildi = new Set([key(r.start[0], r.start[1])]);
  const yonler = [['U',0,-1],['D',0,1],['L',-1,0],['R',1,0]];
  while (q.length){
    const [x,y,p] = q.shift();
    if (x === r.goal[0] && y === r.goal[1]) return p;
    for (const [d,dx,dy] of yonler){
      const nx = x+dx, ny = y+dy, k = key(nx,ny);
      if (nx<0||nx>=r.cols||ny<0||ny>=r.rows||duvar.has(k)||gezildi.has(k)) continue;
      gezildi.add(k); q.push([nx,ny,[...p,d]]);
    }
  }
  throw new Error('rota bulunamadı');
}

async function tur2(W){
  const r = turVerisi(W);
  switch (r.kind){
    case 'choice':   await tikla(W, '[data-choice="' + r.choices.findIndex(x=>x.correct) + '"]'); break;
    case 'estimate': await tikla(W, '[data-est="'    + r.choices.findIndex(x=>x.correct) + '"]'); break;
    case 'multi':
      for (let i=0;i<r.items.length;i++) if (r.items[i].correct){ await tikla(W,'[data-item="'+i+'"]'); await bekle(40); }
      break;
    case 'order':
      for (const id of r.order){ await tikla(W,'[data-order="'+r.items.findIndex(x=>x.id===id)+'"]'); await bekle(40); }
      break;
    case 'drag':
      if (r.hedefToplam){
        /* Fazlalıklı modül havuzu: hedefe ulaşacak kadarını seç
           (büyükten küçüğe). Motor hedefe varınca turu bitirir. */
        let kalan = r.hedefToplam;
        const deger = (p) => p.deger != null ? p.deger
                           : p.id.includes('y') ? 100 : p.id.includes('o') ? 10 : 1;
        for (const p of r.pieces.slice().sort((a,b)=>deger(b)-deger(a))){
          const d = deger(p);
          if (d > kalan) continue;
          await surukle2(W, p.id, p.target);
          kalan -= d;
          if (kalan === 0) break;
        }
        if (kalan !== 0) throw new Error('hedef toplama ulaşılamadı, kalan ' + kalan);
      } else {
        for (const p of r.pieces) if (p.target) await surukle2(W, p.id, p.target);
      }
      break;
    case 'process':
      for (const id of r.sequence){ await tikla(W,'[data-action="'+r.actions.findIndex(x=>x.id===id)+'"]'); await bekle(60); }
      break;
    case 'route':
      for (const d of rota(r)){ await tikla(W,'[data-dir="'+d+'"]'); await bekle(30); }
      await tikla(W,'.run'); break;
    case 'clock': {
      const hedefler = r.targets || [r.target];
      for (let i = 0; i < hedefler.length; i++){
        if (hedefler[i].tm != null) W.eval('setClock(' + hedefler[i].tm + ')');
        else W.eval('(function(){const t=(round().targets||[round().target])[state.sub];state.h=t.h;state.m=t.m})()');
        await tikla(W, '#clockOk'); await bekle(220);
      }
      break;
    }
    case 'bar': {
      /* hatalı hazır çizgiyi kaldır, doğru çizgileri yerleştir, sonra parça seç */
      W.eval('(function(){const sol=' + JSON.stringify(r.solution) + ';' +
             'for(let i=(state.cuts||[]).length-1;i>=0;i--){const c=state.cuts[i];' +
             'if(!sol.some(x=>x.axis===c.axis&&Math.abs(x.at-c.at)<1e-6))removeCut(i)}})()');
      for (const c of r.solution)
        W.eval('(function(){if(!(state.cuts||[]).some(x=>x.axis==="' + c.axis + '"&&Math.abs(x.at-' + c.at + ')<1e-6))' +
               'addCut("' + c.axis + '",' + c.at + ')})()');
      await tikla(W, '#barOk'); await bekle(200);
      for (const sec of (r.selections || [])){
        for (let k = 0; k < sec.count; k++){ await tikla(W, '[data-part="' + k + '"]'); await bekle(60); }
        await tikla(W, '#partOk'); await bekle(320);
      }
      break;
    }
    case 'lift':
      W.eval('setLift(' + r.target + ')');
      await tikla(W, '#liftOk');
      break;
    case 'timing':
      /* tahmini kaydet, kronometreyi gerçekten çalıştır (>0,3 sn), raporu onayla */
      await tikla(W, '#tahminOk');
      await tikla(W, '#kronBasla');
      await bekle(420);
      await tikla(W, '#kronDur');
      await tikla(W, '#timingOk');
      break;
    case 'station':
      for (const it of r.items){
        await tikla(W, '[data-tur="' + it.tur + '"]'); await bekle(60);
        await tikla(W, '[data-birim="' + it.birim + '"]'); await bekle(220);
      }
      break;
    case 'arena':
      for (const a of r.adimlar){
        await tikla(W, '[data-choice="' + a.secenekler.findIndex(o => o.deger === a.dogru) + '"]');
        await bekle(70);
      }
      break;
    case 'tersi':
      for (const c of r.cift){ W.eval('setTers(' + c.hedef + ')'); await tikla(W, '#tersOk'); await bekle(240); }
      break;
    case 'kargo':
      for (const it of r.islemler){
        const kat = it.hedef / it.baslangic;
        const kay = kat === 10 ? 1 : kat === 100 ? 2 : kat === 0.1 ? -1 : -2;
        await tikla(W, '[data-kay="' + kay + '"]'); await bekle(60);
        await tikla(W, '#kargoOk'); await bekle(260);
      }
      break;
    case 'seker': {
      /* 86 ayrı bekleme, sekme arka plandayken saniyelere çıkıyor (tarayıcı
         zamanlayıcı kısması). Her kutu için tek turda gerçek click gönderilir. */
      for (let i = 0; i < r.kutu; i++)
        W.eval('(function(){const el=document.querySelector(\'[data-kutu="' + i + '"]\');' +
               'for(let k=0;k<' + r.her + ';k++)el.click()})()');
      await bekle(150);
      await tikla(W, '[data-choice="' + r.carpma.findIndex(c => c.correct) + '"]'); await bekle(150);
      await tikla(W, '[data-choice="' + r.bolme.findIndex(c => c.correct) + '"]');
      break;
    }
    case 'robot':
      for (const id of r.program){
        await tikla(W, '[data-kart="' + r.kartlar.findIndex(k => k.id === id) + '"]'); await bekle(60);
      }
      await tikla(W, '#calistir'); await bekle(200);
      if (r.sonSoru) await tikla(W, '[data-choice="' + r.sonSoru.secenekler.findIndex(c => c.correct) + '"]');
      break;
    case 'problem': {
      for (let i = 0; i < r.veriler.length; i++)
        if (r.veriler[i].gerek){ await tikla(W, '[data-veri="' + i + '"]'); await bekle(40); }
      await tikla(W, '#veriOk'); await bekle(200);
      const sirali = r.kelimeler.map((k, i) => ({ k, i })).filter(x => x.k.sira != null).sort((a, b) => a.k.sira - b.k.sira);
      for (const x of sirali){ await tikla(W, '[data-kelime="' + x.i + '"]'); await bekle(50); }
      await bekle(280);
      await tikla(W, '[data-choice="' + r.cozum.findIndex(c => c.correct) + '"]'); await bekle(220);
      if (r.kontrol) await tikla(W, '[data-choice="' + r.kontrol.findIndex(c => c.correct) + '"]');
      break;
    }
    case 'terazi':
      for (const a of r.asamalar){
        const dogrular = a.kartlar.map((k, i) => ({ k, i })).filter(x => (a.sabit || 0) + x.k.deger === a.solDeger);
        for (const x of dogrular.slice(0, a.gerekli)){ await tikla(W, '[data-kart="' + x.i + '"]'); await bekle(90); }
        await bekle(280);
      }
      break;
    case 'firin':
      for (let i = 0; i < r.enIyi.tepsi; i++){ await tikla(W, '[data-firin="tepsi"]'); await bekle(40); }
      for (let i = 0; i < r.enIyi.tek; i++){ await tikla(W, '[data-firin="tek"]'); await bekle(25); }
      break;
    case 'kup': {
      /* Küpü gerçekten döndürüp o açıda erişilebilir öğeleri işaretle. */
      const acilar = [[-32,18],[58,18],[148,18],[238,18],[-32,72],[-32,-72],[58,72],[148,-72],[238,72],[104,45]];
      for (const [y, p2] of acilar){
        W.eval('setDonme(' + y + ',' + p2 + ')');
        const secilebilir = JSON.parse(W.eval('JSON.stringify(erisilebilirler())'));
        for (const i of secilebilir) W.eval('kupSec(' + i + ')');
        const kac = JSON.parse(W.eval('JSON.stringify(state.isaretli.length)'));
        if (kac >= r.toplam) break;
        await bekle(20);
      }
      break;
    }
    case 'sekil':
      for (const sk of r.sekiller){
        const kenar = sk.acik ? sk.noktalar.length - 1 : sk.noktalar.length;
        for (let i = 0; i < kenar; i++){ await tikla(W, '[data-kenar="' + i + '"]'); await bekle(20); }
        const hedef = sk.acik ? 'acik' : sk.noktalar.length;
        const ix = JSON.parse(W.eval('JSON.stringify(KAPILAR.map(k=>String(k.id)))')).indexOf(String(hedef));
        await tikla(W, '[data-kapi="' + ix + '"]'); await bekle(300);
      }
      break;
    case 'kosegen': {
      const n = r.noktalar.length;
      if (r.kosegen > n){                       /* üçgen: köşegen yok */
        for (let i = 0; i < n; i++){
          await tikla(W, '[data-kose="' + i + '"]'); await bekle(30);
          await tikla(W, '[data-kose="' + ((i + 1) % n) + '"]'); await bekle(60);
        }
        await tikla(W, '#yokBtn'); await bekle(150);
        await tikla(W, '[data-choice="' + r.soru.secenekler.findIndex(c => c.correct) + '"]');
      } else {
        for (let i = 0; i < r.kosegen; i++){
          await tikla(W, '[data-kose="' + i + '"]'); await bekle(30);
          await tikla(W, '[data-kose="' + (i + 2) + '"]'); await bekle(80);
        }
        await tikla(W, '#olc');
      }
      break;
    }
    case 'studyo':
      for (const p3 of r.cozum){ await tikla(W, '[data-nokta="' + p3[0] + ',' + p3[1] + '"]'); await bekle(35); }
      if (r.kural === 'kare') await tikla(W, '#tGonye');
      await tikla(W, '#tBitir');
      break;
    case 'cevre':
      await tikla(W, '[data-tahmin="0"]'); await bekle(120);
      for (let i = 0; i < r.sekil.kenarUz.length; i++){ await tikla(W, '[data-kenar="' + i + '"]'); await bekle(60); }
      await bekle(260);
      await tikla(W, '[data-choice="' + r.toplamSec.findIndex(c => c.correct) + '"]');
      break;
    case 'ip':
      W.eval('ipSar(360)');
      await tikla(W, '#ipBitir'); await bekle(160);
      await tikla(W, '[data-choice="' + r.okuma.findIndex(c => c.correct) + '"]');
      break;
    case 'sivi':
      W.eval('(function(){state.tahmin=' + r.hedef + ';siviCiz(round())})()');
      await tikla(W, '#tahminOk2'); await bekle(150);
      W.eval('setSivi(' + r.hedef + ')');
      await tikla(W, '#siviOk'); await bekle(180);
      for (let i = 0; i < r.hedef; i++){ await tikla(W, '#aktar'); await bekle(50); }
      await tikla(W, '#siviBitir'); await bekle(150);
      if (r.sonSoru) await tikla(W, '[data-choice="' + r.sonSoru.secenekler.findIndex(c => c.correct) + '"]');
      break;
    case 'mozaik': {
      for (let i = 0; i < r.parcalar.length; i++){
        await tikla(W, '[data-parca="' + i + '"]'); await bekle(40);
        await tikla(W, '[data-yuva="' + i + '"]'); await bekle(60);
      }
      await bekle(200);
      const disSay = JSON.parse(W.eval('JSON.stringify(mozaikKenar(round().parcalar).dis.length)'));
      for (let i = 0; i < disSay; i++){ await tikla(W, '[data-dis="' + i + '"]'); await bekle(40); }
      await bekle(260);
      await tikla(W, '[data-choice="' + r.secenekler.findIndex(c => c.correct) + '"]');
      break;
    }
    case 'katla': {
      /* Bütün nokta çiftlerini dene; motor yalnız gerçek simetri doğrusunu kabul eder. */
      const n = r.nokta.length;
      for (let a = 0; a < n && JSON.parse(W.eval('JSON.stringify(state.bulunan.length)')) < r.gerek; a++)
        for (let b = a + 1; b < n; b++){
          const olur = JSON.parse(W.eval(
            '(function(){const r=round(),a=r.nokta[' + a + '],b=r.nokta[' + b + '];' +
            'const y=r.sekil.map(q=>yansitNokta(q,a,b));' +
            'return kumeEsit(y,r.sekil,2.5)&&kumeEsit(r.sekil,y,2.5)&&' +
            '!state.bulunan.some(c=>(c[0]===' + a + '&&c[1]===' + b + ')||(c[0]===' + b + '&&c[1]===' + a + '))})()'));
          if (!olur) continue;
          await tikla(W, '[data-kn="' + a + '"]'); await bekle(25);
          await tikla(W, '[data-kn="' + b + '"]'); await bekle(45);
          if (JSON.parse(W.eval('JSON.stringify(state.bulunan.length)')) >= r.gerek) break;
        }
      break;
    }
    case 'ayna': {
      const ix = JSON.parse(W.eval('JSON.stringify(state.secenekler.findIndex(s=>s.dogru))'));
      await tikla(W, '[data-sec="' + ix + '"]'); await bekle(80);
      await tikla(W, '#aynaOk');
      break;
    }
    case 'kilim': {
      const gerek = JSON.parse(W.eval('JSON.stringify(kilimGerek(round()))'));
      /* önce fazlalık/hatalı kareleri sil, sonra doğru renkleri doku */
      await tikla(W, '[data-renk="b"]'); await bekle(40);
      for (let y = 0; y < r.sol.length; y++)
        for (let x = 4; x < 8; x++){
          const bek = r.sol[y][7 - x] || null;
          const su = JSON.parse(W.eval('JSON.stringify(state.sag[' + y + '][' + (x - 4) + ']||null)'));
          if (su && su !== bek){ await tikla(W, '[data-huc="' + x + ',' + y + '"]'); await bekle(20); }
        }
      const renkler = [...new Set(gerek.map(g => g.renk))];
      for (const rk of renkler){
        await tikla(W, '[data-renk="' + rk + '"]'); await bekle(40);
        for (const g of gerek.filter(x => x.renk === rk)){
          const su = JSON.parse(W.eval('JSON.stringify(state.sag[' + g.y + '][' + (g.x - 4) + ']||null)'));
          if (su === rk) continue;
          await tikla(W, '[data-huc="' + g.x + ',' + g.y + '"]'); await bekle(20);
        }
      }
      break;
    }
    case 'satranc':
      for (const c of r.ciftler){ await tikla(W, '[data-kare="' + c.hedef + '"]'); await bekle(90); }
      if (r.sonSoru){ await bekle(150); await tikla(W, '[data-choice="' + r.sonSoru.secenekler.findIndex(c => c.correct) + '"]'); }
      break;
    case 'kod': {
      const prog = r.referansProgram
        ? r.referansProgram.map(k => r.eksen === 'dikey'
            ? ({ L: 'R', R: 'L' }[k] || k)
            : ({ U: 'D', D: 'U' }[k] || k))
        : r.cozum;
      for (const k of prog){ await tikla(W, '[data-yon="' + k + '"]'); await bekle(25); }
      await tikla(W, '#kodRun');
      break;
    }
    case 'harf':
      for (const it of r.items){
        const sim = JSON.parse(W.eval(
          '(function(){const it=' + JSON.stringify(it) + ';' +
          'const a=it.eksen==="dikey"?[[50,0],[50,100]]:[[0,50],[100,50]];' +
          'const y=it.p.map(q=>yansitNokta(q,a[0],a[1]));' +
          'return kumeEsit(y,it.p,3)&&kumeEsit(it.p,y,3)})()'));
        await tikla(W, '[data-karar="' + (sim ? 1 : 0) + '"]'); await bekle(260);
      }
      break;
    case 'dortlu': {
      const gerek = JSON.parse(W.eval('JSON.stringify(dortluGerek(round()))'));
      await tikla(W, '[data-renk="b"]'); await bekle(40);
      for (let y = 0; y < r.boy; y++)
        for (let x = 0; x < r.en; x++){
          if (r.kaynak.some(k => k.x === x && k.y === y)) continue;
          const bek = gerek.find(g => g.x === x && g.y === y);
          const su = JSON.parse(W.eval('JSON.stringify(state.hucre[' + y + '][' + x + ']||null)'));
          if (su && (!bek || bek.renk !== su)){ await tikla(W, '[data-huc="' + x + ',' + y + '"]'); await bekle(20); }
        }
      const renkler = [...new Set(gerek.map(g => g.renk))];
      for (const rk of renkler){
        await tikla(W, '[data-renk="' + rk + '"]'); await bekle(40);
        for (const g of gerek.filter(x => x.renk === rk)){
          const su = JSON.parse(W.eval('JSON.stringify(state.hucre[' + g.y + '][' + g.x + ']||null)'));
          if (su === rk) continue;
          await tikla(W, '[data-huc="' + g.x + ',' + g.y + '"]'); await bekle(20);
        }
      }
      break;
    }
    case 'para':
      for (const h of r.hedefler){
        /* farklı bileşim istenen adımda küçükten büyüğe öde */
        const birim = h.izin.slice().sort((a,b) => h.farkli ? a-b : b-a);
        let kalan = h.tutar;
        while (kalan > 0){
          const k = birim.find(x => x <= kalan);
          if (k == null) throw new Error('para bozulamadı, kalan ' + kalan);
          await tikla(W, '[data-para="' + k + '"]'); kalan -= k; await bekle(30);
        }
        await bekle(260);
      }
      break;
    case 'cut':  W.eval('(function(){const r=round();state.lines=r.cuts;good();})()'); break;
    case 'fold': W.eval('good()'); break;
    case 'memory': {
      const ciftler = JSON.parse(W.eval('JSON.stringify(state.cards.map(x=>x.pair))'));
      for (const c of [...new Set(ciftler)]){
        const ix = ciftler.map((p,i)=>p===c?i:-1).filter(i=>i>=0);
        await tikla(W,'[data-card="'+ix[0]+'"]'); await bekle(60);
        await tikla(W,'[data-card="'+ix[1]+'"]'); await bekle(120);
      }
      break;
    }
    case 'tally':
      for (const y of r.responses){ await tikla(W,'[data-tally="'+y.id+'"]'); await bekle(40); }
      break;
    case 'graph':
      for (const k of r.sources){ await tikla(W,'[data-graph="'+k.id+'"]'); await bekle(40); }
      break;
    case 'research':
      await tikla(W,'[data-research="0"]'); await bekle(80);
      for (const y of r.options[0].responses){ await tikla(W,'[data-rcol="'+y.id+'"]'); await bekle(40); }
      break;
    case 'share':
      /* sırayla sol/sağ tabağa dağıt, sonra TEK/ÇİFT kararını ver */
      for (let i=0;i<r.total;i++){
        const buton = (i%2===0) ? '[data-share="a"]' : '[data-share="b"]';
        if (!S(W, buton)) break;          /* karar aşamasına geçilmiş */
        await tikla(W, buton); await bekle(45);
      }
      await bekle(120);
      await tikla(W, '[data-choice="' + (r.total%2===1 ? 0 : 1) + '"]');
      break;
    case 'sequence':
      /* ritmik sayma: her adımda sıradaki doğru değere bas */
      for (const beklenen of r.expected){
        await tikla(W,'[data-choice="'+r.options.findIndex(o=>o.value===beklenen)+'"]');
        await bekle(70);
      }
      break;
    default: throw new Error('bilinmeyen mekanik (motor2): ' + r.kind);
  }
}

/* ---------- motor 1 (m oyunları): bırakma doğrudan motor işleviyle ----------
   İşaretçi taklidi bazı turlarda güvenilmez (m20'de takıldı); gerçek dokunma
   yolunu Codex elle test etti. Regresyon için motorun kendi handleDrop
   işlevini çağırıyoruz — mantık yolu (doğru/yanlış/sayaç) birebir aynı. */
async function surukle1(W, pSec, tSec){
  const p = await bekleyenSec(W, pSec);
  const t = await bekleyenSec(W, tSec);
  const pid = p.dataset.piece, tid = t.dataset.target;
  W.__p = p; W.__t = t;
  W.eval('handleDrop(' + JSON.stringify(pid) + ',' + JSON.stringify(tid) + ', window.__p, window.__t)');
  await bekle(120);
}
async function dogruyaBas(W, secenekler, on){
  const i = secenekler.findIndex(x=>x.correct);
  if (i < 0) throw new Error('doğru seçenek tanımsız');
  await tikla(W, (on||'') + '[data-choice="' + i + '"]');
}

async function tur1(W){
  const r = turVerisi(W);
  const tur = r.kind || 'choose';
  switch (tur){
    case 'choose': case 'pattern': case 'estimate':
      await dogruyaBas(W, r.choices || []); break;
    case 'stages':
      for (const asama of r.stages){ await dogruyaBas(W, asama.choices); await bekle(760); }
      break;
    case 'drag':
      for (const p of (r.pieces||[]).filter(x=>x.target))
        await surukle1(W, '[data-piece="'+p.id+'"]', '[data-target="'+p.target+'"]');
      break;
    case 'grid': {
      const hedef = Number(W.eval('(function(){const r=round();return r.start+r.dx+r.dy*5;})()'));
      await tikla(W,'[data-cell="'+hedef+'"]'); break;
    }
    case 'sequence':
      for (const beklenen of r.expected){
        await tikla(W,'[data-choice="'+(r.options||[]).findIndex(x=>x.value===beklenen)+'"]');
        await bekle(80);
      }
      break;
    case 'count':
      for (let i=0;i<Math.abs((r.target||0)-(r.start||0));i++){ await tikla(W,'[data-delta]'); await bekle(45); }
      break;
    case 'load':
      for (let i=(r.start||0); i<r.targetCount; i++) await surukle1(W,'[data-piece="supply"]','[data-target="loadTarget"]');
      break;
    case 'remove':
      for (let i=0;i<r.removeCount;i++) await surukle1(W,'[data-piece]','[data-target="returnCart"]');
      await dogruyaBas(W, r.choices || []); break;
    case 'memory':
      W.eval('state.remaining=1');
      await bekle(1250);
      await dogruyaBas(W, r.choices || []); break;
    case 'diff':
      for (let i=0;i<(r.pairs||[]).length;i++)
        if (r.pairs[i][2]){ await tikla(W,'[data-diff="'+i+'"]'); await bekle(45); }
      break;
    case 'multi':
      for (const o of (r.items||[]).filter(x=>x.correct)){ await tikla(W,'[data-item="'+o.id+'"]'); await bekle(45); }
      break;
    case 'catch':
      for (const renk of r.sequence) await surukle1(W,'[data-piece="hook"]','[data-target="'+renk+'"]');
      break;
    case 'survey':
      for (const y of r.responses){ await tikla(W,'#ask'); await bekle(60); await tikla(W,'[data-col="'+y.id+'"]'); await bekle(60); }
      await dogruyaBas(W, r.finalChoices || []); break;
    default: throw new Error('bilinmeyen mekanik (motor1): ' + tur);
  }
}

/* ---------- koşucu ---------- */
window.SONUC = { bitti:false, gecti:[], kaldi:[], hatalar:[] };

async function oyunuOyna(id){
  const dosya = motorDosyasi(id);
  /* src değişimi eski belgeyi hemen düşürmez: load olayını bekle,
     yoksa önceki oyunun 'Tur 3/3' etiketi okunur (v02 hatası). */
  await new Promise((coz) => {
    cerceve.onload = () => coz();
    cerceve.src = dosya + '?test=1&smoke=' + id + '#oyun=' + id;
  });
  await kosul(() => { try { return !!S(cerceve.contentWindow, '.hud .round'); } catch(e){ return false; } }, 15000, id+' açılış');
  const W = cerceve.contentWindow;
  const hatalar = [];
  W.addEventListener('error', e => hatalar.push(String((e.error && e.error.stack) || e.message)));

  for (let n=1; n<=3; n++){
    const gorunen = S(W,'.hud .round').textContent.trim();
    if (gorunen !== 'Tur ' + n + '/3') throw new Error('beklenen Tur '+n+'/3, görünen '+gorunen);
    if (id[0]==='v' || id[0]==='w') await tur2(W); else await tur1(W);
    if (n < 3) await kosul(() => S(W,'.hud .round') && S(W,'.hud .round').textContent.trim() === 'Tur '+(n+1)+'/3', 15000, id+' tur '+(n+1));
    else       await kosul(() => !!S(W,'.overlay'), 15000, id+' bitiş');
  }
  if (hatalar.length) throw new Error('js hatası: ' + hatalar[0]);
}

(async () => {
  const p = new URLSearchParams(location.hash.slice(1));
  const ids = p.get('ids') ? p.get('ids').split(',') : [...ENGINE1, ...ENGINE2, ...ENGINE3];
  panel.textContent = '';
  yaz('koşum: ' + ids.length + ' oyun');
  for (const id of ids){
    try {
      await oyunuOyna(id);
      SONUC.gecti.push(id); yaz('✓ ' + id, 'g');
    } catch (e){
      SONUC.kaldi.push(id); SONUC.hatalar.push(id + ': ' + e.message);
      yaz('✗ ' + id + ' — ' + e.message, 'b');
    }
    await bekle(60);
  }
  SONUC.bitti = true;
  yaz('\nBİTTİ · geçti ' + SONUC.gecti.length + '/' + ids.length +
      (SONUC.kaldi.length ? ' · kaldı: ' + SONUC.kaldi.join(',') : ''));
})();
